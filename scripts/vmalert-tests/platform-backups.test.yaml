---
rule_files:
  - rules/platform-backups.yaml
evaluation_interval: 1h
tests:
  - name: drills older than their window, datasets with a drill but no verified restore and datasets never backed up fire; the rest stay quiet
    interval: 1h
    input_series:
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="authentik", configmap="restore-verified-cnpg-authentik-db"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="authentik", configmap="restore-verified-cnpg-authentik-db", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="authentik", label_backup_webgrip_io_name="authentik-db", label_backup_webgrip_io_kind="cnpg"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="forgejo", configmap="restore-verified-cnpg-forgejo-db"}'
        values: "14400x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="forgejo", configmap="restore-verified-cnpg-forgejo-db", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="forgejo", label_backup_webgrip_io_name="forgejo-db", label_backup_webgrip_io_kind="cnpg"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="vikunja", configmap="restore-verified-cnpg-vikunja-db"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="vikunja", configmap="restore-verified-cnpg-vikunja-db", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="vikunja", label_backup_webgrip_io_name="vikunja-db", label_backup_webgrip_io_kind="cnpg"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="ai", configmap="restore-verified-cnpg-litellm-db"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="ai", configmap="restore-verified-cnpg-litellm-db", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="ai", label_backup_webgrip_io_name="litellm-db", label_backup_webgrip_io_kind="cnpg"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="harbor", configmap="restore-verified-cnpg-harbor-db"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="harbor", configmap="restore-verified-cnpg-harbor-db", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="harbor", label_backup_webgrip_io_name="harbor-db", label_backup_webgrip_io_kind="cnpg"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="freshrss", configmap="restore-verified-cnpg-freshrss-db"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="freshrss", configmap="restore-verified-cnpg-freshrss-db", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="freshrss", label_backup_webgrip_io_name="freshrss-db", label_backup_webgrip_io_kind="cnpg"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="observability", configmap="restore-verified-cnpg-grafana-db"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="observability", configmap="restore-verified-cnpg-grafana-db", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="observability", label_backup_webgrip_io_name="grafana-db", label_backup_webgrip_io_kind="cnpg"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="security", configmap="restore-verified-cnpg-dependency-track-db"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="security", configmap="restore-verified-cnpg-dependency-track-db", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="security", label_backup_webgrip_io_name="dependency-track-db", label_backup_webgrip_io_kind="cnpg"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="backup", configmap="restore-verified-longhorn-forgejo-data"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="backup", configmap="restore-verified-longhorn-forgejo-data", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="forgejo", label_backup_webgrip_io_name="forgejo-data", label_backup_webgrip_io_kind="longhorn"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="backup", configmap="restore-verified-longhorn-vikunja"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="backup", configmap="restore-verified-longhorn-vikunja", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="vikunja", label_backup_webgrip_io_name="vikunja", label_backup_webgrip_io_kind="longhorn"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="security", configmap="restore-verified-openbao-openbao-raft"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="security", configmap="restore-verified-openbao-openbao-raft", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="security", label_backup_webgrip_io_name="openbao-raft", label_backup_webgrip_io_kind="openbao"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="security", configmap="restore-verified-escrow-openbao-unseal-key"}'
        values: "705600x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="security", configmap="restore-verified-escrow-openbao-unseal-key", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="security", label_backup_webgrip_io_name="openbao-unseal-key", label_backup_webgrip_io_kind="escrow"}'
        values: "1x222"
      - series: 'kube_configmap_created{job="kube-state-metrics", namespace="observability", exported_namespace="backup", configmap="restore-verified-etcd-homelab-etcd"}'
        values: "532800x222"
      - series: 'kube_configmap_labels{job="kube-state-metrics", namespace="observability", exported_namespace="backup", configmap="restore-verified-etcd-homelab-etcd", label_backup_webgrip_io_restore_verified="true", label_backup_webgrip_io_namespace="talos", label_backup_webgrip_io_name="homelab-etcd", label_backup_webgrip_io_kind="etcd"}'
        values: "1x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="forgejo", pod="forgejo-db-1"}'
        values: "784800x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="vikunja", pod="vikunja-db-1"}'
        values: "784800x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="ploeg", pod="ploeg-db-1"}'
        values: "784800x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="n8n", pod="n8n-db-1"}'
        values: "784800x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="sparkyfitness", pod="sparkyfitness-db-1"}'
        values: "784800x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="ai", pod="litellm-db-1"}'
        values: "784800x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="harbor", pod="harbor-db-1"}'
        values: "784800x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="freshrss", pod="freshrss-db-1"}'
        values: "784800x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="observability", pod="grafana-db-1"}'
        values: "784800x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="security", pod="dependency-track-db-1"}'
        values: "784800x222"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="backstage", pod="backstage-db-1"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-forgejo-data", pvc_namespace="forgejo", pvc="forgejo-data"}'
        values: "0x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-vikunja", pvc_namespace="vikunja", pvc="vikunja"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-invoiceninja-storage", pvc_namespace="invoiceninja", pvc="invoiceninja-storage"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-invoiceninja-mariadb", pvc_namespace="invoiceninja", pvc="invoiceninja-mariadb"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-data-openbao-0", pvc_namespace="security", pvc="data-openbao-0"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-authentik-media", pvc_namespace="authentik", pvc="authentik-media"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-unfold-data", pvc_namespace="ploeg", pvc="unfold-data"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-omnigraph-014-state", pvc_namespace="ai", pvc="omnigraph-014-state"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-n8n-data", pvc_namespace="n8n", pvc="n8n-data"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-sparkyfitness-uploads", pvc_namespace="sparkyfitness", pvc="sparkyfitness-uploads"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-sparkyfitness-backup", pvc_namespace="sparkyfitness", pvc="sparkyfitness-backup"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-freshrss", pvc_namespace="freshrss", pvc="freshrss"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-minecraft", pvc_namespace="minecraft", pvc="minecraft"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-omnigraph-state", pvc_namespace="ai", pvc="omnigraph-state"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-omnigraph-brain-eval-store", pvc_namespace="ai", pvc="omnigraph-brain-eval-store"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-open-webui-data", pvc_namespace="ai", pvc="open-webui-data"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-vlsingle-victorialogs-audit", pvc_namespace="observability", pvc="vlsingle-victorialogs-audit"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-gitea-mirror", pvc_namespace="forgejo", pvc="gitea-mirror"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-data-garage-0", pvc_namespace="garage", pvc="data-garage-0"}'
        values: "784800x222"
      - series: 'longhorn_volume_last_backup_at{volume="pvc-meta-garage-0", pvc_namespace="garage", pvc="meta-garage-0"}'
        values: "784800x222"
      - series: 'kube_cronjob_status_last_successful_time{job="kube-state-metrics", namespace="observability", exported_namespace="security", cronjob="openbao-snapshot"}'
        values: "784800x222"
      - series: 'kube_cronjob_status_last_successful_time{job="kube-state-metrics", namespace="observability", exported_namespace="backup", cronjob="etcd-backup"}'
        values: "784800x222"
    metricsql_expr_test:
      - expr: backup:last_success_timestamp_seconds{dataset="vikunja/vikunja-db"}
        eval_time: 220h
        exp_samples:
          - labels: 'backup:last_success_timestamp_seconds{dataset="vikunja/vikunja-db", kind="cnpg"}'
            value: 784800
      - expr: backup:restore_last_success_timestamp_seconds{dataset="forgejo/forgejo-data"}
        eval_time: 220h
        exp_samples:
          - labels: 'backup:restore_last_success_timestamp_seconds{dataset="forgejo/forgejo-data", kind="longhorn"}'
            value: 705600
    alert_rule_test:
      - eval_time: 220h
        groupname: platform.backups
        alertname: BackupRestoreVerificationStale
        exp_alerts:
          - exp_labels:
              dataset: forgejo/forgejo-db
              kind: cnpg
              tier: T1
              drill: weekly
              severity: warning
              owner: platform
              service: backup
            exp_annotations:
              summary: "Backup restore not verified within its drill window (forgejo/forgejo-db)"
          - exp_labels:
              dataset: talos/homelab-etcd
              kind: etcd
              tier: T1
              drill: daily
              severity: warning
              owner: platform
              service: backup
            exp_annotations:
              summary: "Backup restore not verified within its drill window (talos/homelab-etcd)"
      - eval_time: 220h
        groupname: platform.backups
        alertname: BackupRestoreNeverVerified
        exp_alerts:
          - exp_labels:
              dataset: invoiceninja/invoiceninja-storage
              kind: longhorn
              tier: T1
              drill: weekly
              severity: warning
              owner: platform
              service: backup
            exp_annotations:
              summary: "Backup has a drill but no verified restore (invoiceninja/invoiceninja-storage)"
          - exp_labels:
              dataset: ploeg/ploeg-db
              kind: cnpg
              tier: T1
              drill: weekly
              severity: warning
              owner: platform
              service: backup
            exp_annotations:
              summary: "Backup has a drill but no verified restore (ploeg/ploeg-db)"
      - eval_time: 220h
        groupname: platform.backups
        alertname: BackupDatasetNeverBackedUp
        exp_alerts:
          - exp_labels:
              dataset: authentik/authentik-db
              kind: cnpg
              tier: T1
              severity: critical
              owner: platform
              service: backup
            exp_annotations:
              summary: "Registered dataset has no completed backup (authentik/authentik-db)"
          - exp_labels:
              dataset: forgejo/forgejo-data
              kind: longhorn
              tier: T1
              severity: critical
              owner: platform
              service: backup
            exp_annotations:
              summary: "Registered dataset has no completed backup (forgejo/forgejo-data)"
      - eval_time: 220h
        groupname: platform.backups
        alertname: HomelabEtcdBackupStale
        exp_alerts: []

  - name: an etcd snapshot older than 14 hours fires, a younger one does not
    interval: 1h
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{job="kube-state-metrics", namespace="observability", exported_namespace="backup", cronjob="etcd-backup"}'
        values: "3600x30"
    alert_rule_test:
      - eval_time: 10h
        groupname: platform.backups
        alertname: HomelabEtcdBackupStale
        exp_alerts: []
      - eval_time: 20h
        groupname: platform.backups
        alertname: HomelabEtcdBackupStale
        exp_alerts:
          - exp_labels:
              dataset: talos/homelab-etcd
              severity: warning
              owner: platform
              service: backup
            exp_annotations:
              summary: "Homelab etcd snapshot older than 14 hours (talos/homelab-etcd)"
