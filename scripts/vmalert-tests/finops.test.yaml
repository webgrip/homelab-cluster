---
rule_files:
  - rules/finops.yaml
evaluation_interval: 5m
tests:
  - name: measured lines add up, a line without its input stays out, and the missing count says so
    interval: 5m
    input_series:
      - series: 'kepler_node_cpu_watts{zone="package", node_name="worker-1"}'
        values: "100x20"
      - series: 'kepler_node_cpu_watts{zone="dram", node_name="worker-1"}'
        values: "50x20"
      - series: 'kepler_node_cpu_watts{zone="uncore", node_name="worker-1"}'
        values: "999x20"
      - series: 'hcloud:projected_month_eur:sum{project="unfold"}'
        values: "10x20"
      - series: 'litellm_spend_metric_total{model="m"}'
        values: "0+1x20"
    metricsql_expr_test:
      - expr: finops:monthly_cost_eur
        eval_time: 30m
        exp_samples:
          - labels: 'finops:monthly_cost_eur{line="electricity", source="kepler-cpu-dram-floor"}'
            value: 32.85
          - labels: 'finops:monthly_cost_eur{line="hetzner-cloud", source="hcloud-cost-exporter"}'
            value: 10
      - expr: finops:monthly_total_eur
        eval_time: 30m
        exp_samples:
          - labels: 'finops:monthly_total_eur'
            value: 42.85
      - expr: finops:monthly_cost_lines_missing
        eval_time: 30m
        exp_samples:
          - labels: 'finops:monthly_cost_lines_missing'
            value: 5

  - name: a stopped exporter drops its line instead of reading zero
    interval: 5m
    input_series:
      - series: 'kepler_node_cpu_watts{zone="package", node_name="worker-1"}'
        values: "100x20"
    metricsql_expr_test:
      - expr: finops:monthly_cost_eur{line="hetzner-cloud"}
        eval_time: 30m
        exp_samples: []
      - expr: finops:monthly_cost_lines_missing
        eval_time: 30m
        exp_samples:
          - labels: 'finops:monthly_cost_lines_missing'
            value: 6
