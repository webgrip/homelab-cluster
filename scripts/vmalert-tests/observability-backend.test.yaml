---
rule_files:
  - rules/observability-backend.yaml
evaluation_interval: 1m
tests:
  - name: a query timeout fires, a quiet counter does not
    interval: 1m
    input_series:
      - series: 'vm_concurrent_select_limit_timeout_total{job="vmsingle-vmsingle", instance="a"}'
        values: "0x30 1x30"
    alert_rule_test:
      - eval_time: 20m
        groupname: observability.backend
        alertname: VictoriaMetricsQueryTimeouts
        exp_alerts: []
      - eval_time: 35m
        groupname: observability.backend
        alertname: VictoriaMetricsQueryTimeouts
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              service: observability
              job: vmsingle-vmsingle
            exp_annotations:
              summary: "VictoriaMetrics rejected queries that waited too long for a slot (vmsingle-vmsingle)"

  - name: slots full for ten minutes fires, one free slot in between does not
    interval: 1m
    input_series:
      - series: 'vm_concurrent_select_capacity{job="vmsingle-vmsingle", instance="a"}'
        values: "8x60"
      - series: 'vm_concurrent_select_current{job="vmsingle-vmsingle", instance="a"}'
        values: "8x15 7 8x44"
    alert_rule_test:
      - eval_time: 14m
        groupname: observability.backend
        alertname: VictoriaMetricsQuerySlotsFull
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              service: observability
              job: vmsingle-vmsingle
              instance: a
            exp_annotations:
              summary: "Every VictoriaMetrics query slot stayed busy for 10 minutes (a)"
      - eval_time: 20m
        groupname: observability.backend
        alertname: VictoriaMetricsQuerySlotsFull
        exp_alerts: []
      - eval_time: 40m
        groupname: observability.backend
        alertname: VictoriaMetricsQuerySlotsFull
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              service: observability
              job: vmsingle-vmsingle
              instance: a
            exp_annotations:
              summary: "Every VictoriaMetrics query slot stayed busy for 10 minutes (a)"

  - name: grafana-operator errors for over an hour fire, a single blip does not
    interval: 1m
    input_series:
      - series: 'controller_runtime_reconcile_errors_total{job="grafana-operator-metrics-service", controller="grafanamanifest"}'
        values: "0+1x120"
      - series: 'controller_runtime_reconcile_errors_total{job="grafana-operator-metrics-service", controller="grafanadashboard"}'
        values: "0x10 1x110"
    alert_rule_test:
      - eval_time: 50m
        groupname: observability.backend
        alertname: GrafanaOperatorSyncFailing
        exp_alerts: []
      - eval_time: 100m
        groupname: observability.backend
        alertname: GrafanaOperatorSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              service: observability
              controller: grafanamanifest
            exp_annotations:
              summary: "grafana-operator keeps failing to sync grafanamanifest resources (grafanamanifest)"

  - name: a panel that had data and went empty fires per dashboard; expected-empty and never-had-data panels do not
    interval: 5m
    input_series:
      - series: 'grafana_panel_has_data{dashboard_uid="costs", dashboard="Costs", panel_id="1", panel="Run-rate"}'
        values: "1x12 0x60"
      - series: 'grafana_panel_has_data{dashboard_uid="costs", dashboard="Costs", panel_id="2", panel="Idle"}'
        values: "1x12 0x60"
      - series: 'grafana_panel_has_data{dashboard_uid="costs", dashboard="Costs", panel_id="3", panel="Never had data"}'
        values: "0x72"
      - series: 'grafana_panel_has_data{dashboard_uid="walls", dashboard="Walls", panel_id="4", panel="Firing now"}'
        values: "1x12 0x60"
      - series: 'grafana_panel_empty_expected{dashboard_uid="walls", dashboard="Walls", panel_id="4", panel="Firing now"}'
        values: "1x72"
      - series: 'grafana_panel_has_data{dashboard_uid="ok", dashboard="Ok", panel_id="5", panel="Fine"}'
        values: "1x72"
    alert_rule_test:
      - eval_time: 2h
        groupname: observability.dashboards
        alertname: GrafanaPanelsStoppedShowingData
        exp_alerts: []
      - eval_time: 5h
        groupname: observability.dashboards
        alertname: GrafanaPanelsStoppedShowingData
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              service: observability
              dashboard_uid: costs
              dashboard: Costs
            exp_annotations:
              summary: "2 panel(s) on a dashboard stopped showing data (Costs)"

  - name: the panel check going stale fires, a fresh check does not
    interval: 5m
    input_series:
      - series: 'grafana_panel_check_last_success_timestamp_seconds'
        values: "0+300x20 6000x50"
    alert_rule_test:
      - eval_time: 90m
        groupname: observability.dashboards
        alertname: GrafanaPanelCheckStale
        exp_alerts: []
      - eval_time: 5h
        groupname: observability.dashboards
        alertname: GrafanaPanelCheckStale
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              service: observability
            exp_annotations:
              summary: "The Grafana panel check has not completed for 3 hours (grafana-panel-health)"
