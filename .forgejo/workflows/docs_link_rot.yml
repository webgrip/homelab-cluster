---
name: '[Workflow] Docs external link rot'

# Weekly external-link check over the docs sources (estate item #15). Internal
# link integrity is already gated at build (`zensical build --strict`); this
# covers what strict cannot — the outside world rotting under our references.
# Failures are a report, not a merge gate (schedule-only; a red run here means
# "go fix links", never "trunk is blocked").

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC; default-branch only by engine rule
  workflow_dispatch: {}

jobs:
  link-rot:
    name: 'lychee external links'
    runs-on: docker
    container: harbor.webgrip.dev/dockerhub/lycheeverse/lychee:0.24.2
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        run: |-
          # External links ONLY (--scheme): internal integrity is zensical
          # --strict's job at build. --root-dir lets root-relative estate links
          # parse (they then resolve to file:// and fall out of scope).
          # .lycheeignore is auto-discovered from the CWD — there is no
          # --ignore-file flag (the first dispatch proof failed on it).
          lychee --no-progress --cache --max-cache-age 7d \
            --scheme https --scheme http --root-dir "$(pwd)" \
            'docs/techdocs/docs/**/*.md' 'README.md'
