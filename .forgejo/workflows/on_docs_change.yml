---
name: '[Workflow] On Documentation Change'

# The docs publish path (ADR-0039 + ADR-0052). One mkdocs build, two consumers of
# the same techdocs-site artifact:
#   deploy-backstage  — TechDocs artifact (ADR-0039): techdocs-cli publish into the
#                       Garage `techdocs` bucket; the Backstage on-ramp (deferred).
#   deploy-docs-site  — the HUMAN site (ADR-0052): Zensical build + llms/redirect
#                       graft from the artifact, rclone-synced into the Garage
#                       `docs-site` bucket, served at docs.<domain> via Garage web.
# (The ADR-0038 Codeberg leg was dropped 2026-08-09 — see ADR-0052.)
# Org secrets/vars (TECHDOCS_S3_*) are converged from OpenBao by the
# forgejo-actions-secrets CronJob.

on:
  push:
    branches:
      - '*'
    paths:
      - 'docs/techdocs/**'
      - 'catalog/**'
      - 'catalog-info.yaml'
      - '.forgejo/workflows/on_docs_change.yml'
  workflow_dispatch:
    inputs:
      source-dir:
        type: string
        description: 'The directory containing the techdocs files'
        required: false
        default: 'docs/techdocs'

jobs:
  generate-documentation:
    name: 'Generate'
    uses: webgrip/workflows/.forgejo/workflows/techdocs-generate.yml@77bd6c0a45eac315a521aed6e12effab731cad68 # main
    with:
      source-dir: ${{ github.event.inputs.source-dir || 'docs/techdocs' }}

  deploy-backstage:
    name: 'Deploy (Backstage / Garage S3)'
    uses: webgrip/workflows/.forgejo/workflows/techdocs-deploy-backstage-s3.yml@77bd6c0a45eac315a521aed6e12effab731cad68 # main
    needs: generate-documentation
    if: github.ref == 'refs/heads/main'
    with:
      # Must match the catalog entity carrying backstage.io/techdocs-ref
      # (catalog/components/homelab-cluster.yaml — namespace `homelab`, NOT the
      # `default` the original plan assumed).
      entity: homelab/component/homelab-cluster
    secrets:
      TECHDOCS_S3_ACCESS_KEY_ID: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
      TECHDOCS_S3_SECRET_ACCESS_KEY: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}

  deploy-docs-site:
    name: 'Deploy (docs site / Garage web)'
    uses: webgrip/workflows/.forgejo/workflows/techdocs-deploy-docs-site.yml@77bd6c0a45eac315a521aed6e12effab731cad68 # main
    needs: generate-documentation
    if: github.ref == 'refs/heads/main'
    with:
      # Broken links fail the build (flagship runs strict; onboarding repos
      # start strict:false until their links are clean).
      strict: 'true'
    secrets:
      TECHDOCS_S3_ACCESS_KEY_ID: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
      TECHDOCS_S3_SECRET_ACCESS_KEY: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}
