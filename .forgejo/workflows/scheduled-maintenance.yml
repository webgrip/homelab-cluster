---
# Weekly repo janitor — the mechanical backstop for the two-delivery-path collision
# (owner trunk-pushes per CLAUDE.md vs agent fleet PR-only per ADR-0048/ADR-0050):
# when the same work lands on main first by trunk push, the fleet's PR goes
# "nothing to merge" and its branch goes stale. This job sweeps both.
#
#   1. Closes open PRs whose head is fully contained in their base (zombie PRs),
#      with an explanatory comment.
#   2. Deletes branches fully contained in main that have no open PR.
#      Never touches main or renovate/* (Renovate manages its own branches).
#
# A second job guards Renovate's discovery. Selection moved from a hand-maintained list to the
# `renovate` repo topic on 2026-09-18, after that list had rotted in both directions: three
# entries pointed at repos that no longer existed, and six that did were missing — including
# frontend-toolkit, whose packages the estate's frontend toolchain is built on. Nothing failed;
# Renovate simply never ran on them. Topics are preventive, but they move the failure rather
# than remove it — an untagged repo is unmanaged just as silently — so this asserts every active
# source repo carries the topic.
#
# Runs as the forgejo-ci bot (WEBGRIP_CI_TOKEN org secret), NOT agent-builder —
# janitor ≠ builder, mirroring ADR-0048's builder ≠ judge split.
# Manual runs default to dry-run; the weekly schedule runs live.
name: '[Scheduled] Maintenance'

on:
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC (schedules run on the default branch only)
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log only; do not change anything'
        type: string
        required: false
        default: 'true'

concurrency:
  group: scheduled-maintenance
  cancel-in-progress: false

jobs:
  janitor:
    name: 'Zombie-PR + merged-branch janitor'
    runs-on: docker
    steps:
      - name: Checkout (full history — merge-base needs it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close contained PRs, prune contained branches
        shell: bash
        env:
          TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          # Ternary emulation: dispatch honors the input; schedule is always live.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
        run: |-
          set -euo pipefail
          command -v jq >/dev/null || { echo "FATAL: jq missing on runner image"; exit 1; }
          [ -n "${TOKEN:-}" ] || { echo "FATAL: WEBGRIP_CI_TOKEN not available"; exit 1; }
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          DEFAULT_BRANCH=main
          echo "mode: DRY_RUN=${DRY_RUN}"
          git fetch origin --prune --quiet

          # ── 1. Zombie PRs: open, same-repo head, head sha an ancestor of base ──
          closed=0
          while IFS=$'\t' read -r num head base hsha; do
            bsha=$(git rev-parse "origin/${base}" 2>/dev/null) || continue
            git cat-file -e "${hsha}" 2>/dev/null || continue
            if git merge-base --is-ancestor "${hsha}" "${bsha}"; then
              echo "zombie PR #${num} (${head} -> ${base}): head fully contained in base"
              [ "${DRY_RUN}" = "true" ] && continue
              # Comment is best-effort (token may lack write:issue); close is mandatory.
              curl -fsS -X POST -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
                "${API}/issues/${num}/comments" \
                -d '{"body":"Janitor: closing — every commit on this branch is already contained in the target branch (nothing to merge). The work most likely landed on main via another delivery path; see ADR-0050."}' \
                >/dev/null || echo "WARN: comment on #${num} failed (token scope?)"
              curl -fsS -X PATCH -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
                "${API}/pulls/${num}" -d '{"state":"closed"}' >/dev/null
              closed=$((closed + 1))
            fi
          done < <(curl -fsS -H "Authorization: token ${TOKEN}" "${API}/pulls?state=open&limit=50" \
                   | jq -r '.[] | select(.head.repo.full_name == .base.repo.full_name)
                            | [.number, .head.ref, .base.ref, .head.sha] | @tsv')

          # Refresh AFTER closures so branches of just-closed PRs are prunable this run.
          open_heads=$(curl -fsS -H "Authorization: token ${TOKEN}" "${API}/pulls?state=open&limit=50" \
                       | jq -r '.[].head.ref')

          # ── 2. Contained branches with no open PR (never main, never renovate/*) ──
          candidates=()
          while read -r sha ref; do
            b=${ref#refs/heads/}
            case "${b}" in "${DEFAULT_BRANCH}" | renovate/*) continue ;; esac
            grep -qxF "${b}" <<<"${open_heads}" && continue
            if git merge-base --is-ancestor "${sha}" "origin/${DEFAULT_BRANCH}"; then
              candidates+=("${b}")
            fi
          done < <(git ls-remote --heads origin)

          # Mass-deletion fuse: a wrong origin/main ref would make EVERYTHING "contained".
          if [ "${#candidates[@]}" -gt 15 ]; then
            echo "FUSE: ${#candidates[@]} deletion candidates (>15) — refusing; investigate manually"
            exit 1
          fi

          pruned=0
          for b in "${candidates[@]:-}"; do
            [ -n "${b}" ] || continue
            echo "contained branch: ${b}"
            [ "${DRY_RUN}" = "true" ] && continue
            enc=$(printf %s "${b}" | sed 's|/|%2F|g')
            curl -fsS -X DELETE -H "Authorization: token ${TOKEN}" "${API}/branches/${enc}" >/dev/null \
              && { echo "deleted: ${b}"; pruned=$((pruned + 1)); }
          done

          echo "done: PRs closed=${closed}, branches pruned=${pruned} (dry-run=${DRY_RUN})"

  renovate-discovery-drift:
    name: 'Every active source repo carries the renovate topic'
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare the topic against the active source repos
        shell: bash
        env:
          TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: ./scripts/renovate-discovery-drift.sh
