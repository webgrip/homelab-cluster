---
name: "e2e"

# Forgejo port of .github/workflows/e2e.yaml (VIK-85; move-not-copy — the GitHub copy is
# deleted in the same commit). Same 11-check gate, same scripts. Adaptations for the
# in-cluster docker runner (host-mode toolchain container + DinD sidecar):
#   - TMPDIR=/mnt/ci-shared: `docker run -v` bind-mounts resolve on the DAEMON's fs, so the
#     mktemp workspaces the validator scripts mount must live on the emptyDir the scaledjob
#     mounts into BOTH the runner and dind containers at this path.
#   - yamllint runs in a container (the toolchain image ships python3 but no pip).
#   - kind is fetched as a static binary for the chainsaw step (the image has neither it nor a
#     go toolchain for scripts/lib ensure_kind's fallback). The kubeconfig kind writes is NOT
#     usable from the runner: since the per-pod DinD sidecar became a shared per-node dind
#     DaemonSet, the API server's 127.0.0.1:<port> publish lands in the DAEMON's netns, not the
#     runner's (run 584). The script talks to the cluster via `docker exec` on the node, and
#     containerized steps use `--network host` — see scripts/lib/kyverno-tests.sh::kind_kubectl.
#   - checkout@v4: proven on this runner (see forgejo-runner scaledjob.yaml notes); v6 is
#     GitHub-only.
#
# SPEED (2026-07-14): the gate used to be ONE serial job (~10min). It is now four jobs that
# run CONCURRENTLY on the KEDA warm pool (min 2, bursts to 6), so wall-clock is the slowest
# single branch (chainsaw) instead of the sum of every check. Every tool image is pulled
# through the in-cluster Harbor pull-through proxy (harbor.webgrip.dev, ADR-0025) rather than
# ghcr.io/docker.io directly: the runner's DinD uses an emptyDir image store so every pull is
# cold, and Harbor turns each into a LAN-speed, rate-limit-free, cache-warm pull. flux-local
# renders now shard across parallel workers (scripts/lib/flux-local.sh :: run_flux_local_batch)
# instead of one container per kustomization, and chainsaw only blocks on the two Kyverno
# controllers its suites actually exercise.

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Renovate config validation is a standalone job: `npx renovate` cold-downloads a large npm
  # tree every run (no cache on the ephemeral runner), so isolating it keeps the fast static
  # checks in `lint` from waiting on it. npm isn't rate-limited, so this stays npx (the full
  # renovate container image is ~2.5 GiB — worse to pull than the npm tarball).
  renovate:
    name: Validate Renovate config
    runs-on: docker
    env:
      # docker run -v bind-mounts resolve on the DinD DAEMON's fs (see file header), so the
      # mktemp workspace we mount into the node container must live on the emptyDir shared
      # with dind at this path.
      TMPDIR: /mnt/ci-shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Renovate config
        env:
          GITHUB_COM_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          # renovate 43.208.0's engines require Node ^24.11.0; the runner's toolchain ships
          # Node v20, which prints an EBADENGINE warning for every renovate subpackage. Run the
          # validator in a Node 24 container pulled through the Harbor proxy (ADR-0025 — LAN-
          # speed, rate-limit-free, cache-warm) instead of on the host toolchain. The tag is
          # pinned to major 24 because renovate's ^24.11.0 is >=24.11.0 <25.0.0 — Node 25+ would
          # re-trigger EBADENGINE; bump this in lockstep if a future renovate raises its floor.
          # Only .renovaterc.json5 is needed (the validator does not fetch the local> presets),
          # so copy it onto the dind-shared workspace and mount just that.
          ws="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/.renovaterc.json5" "$ws/"
          docker run --rm -v "$ws":/data -w /data -e GITHUB_COM_TOKEN \
            harbor.webgrip.dev/dockerhub/library/node:24-slim \
            npx --yes --package renovate@43.208.0 renovate-config-validator --no-global .renovaterc.json5

  # Fast static checks — no KinD, no cluster. All cheap python/shell plus two light container
  # steps (yamllint, kyverno CLI) that pull through Harbor.
  lint:
    name: Lint & static validation
    runs-on: docker
    env:
      TMPDIR: /mnt/ci-shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify OCIRepository digests
        env:
          # Robot creds let the verifier resolve first-party charts in the
          # PRIVATE harbor webgrip project (anonymous tokens 401 there).
          HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
        run: ./scripts/verify-oci-digests.sh "$GITHUB_WORKSPACE"

      - name: Lint YAML (yamllint, relaxed)
        run: |
          # Base image pulled through Harbor (LAN, rate-limit-free) instead of docker.io, which
          # used to throttle the cold pull (TLS handshake timeout — old run 22). pip is fetched
          # from PyPI, which isn't rate-limited.
          ws="$(mktemp -d)"
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/kubernetes" "$ws/"
          docker run --rm -v "$ws":/data -w /data harbor.webgrip.dev/dockerhub/library/python:3.12-slim \
            sh -ec "pip install --quiet yamllint==1.38.0 && yamllint -d relaxed kubernetes"

      - name: Validate the access model (schema + cross-file rules)
        run: |
          ws="$(mktemp -d)"
          mkdir -p "$ws/kubernetes/apps/security/access-plane"
          rsync -a "$GITHUB_WORKSPACE/scripts" "$ws/"
          rsync -a "$GITHUB_WORKSPACE/kubernetes/apps/security/access-plane/model" "$ws/kubernetes/apps/security/access-plane/"
          docker run --rm -v "$ws":/data:ro -w /data harbor.webgrip.dev/dockerhub/library/python:3.12-slim \
            sh -ec "pip install --quiet check-jsonschema==0.38.0 pyyaml==6.0.3 && ./scripts/validate-access-model.sh /data"

      - name: Validate Omnigraph policy isolation
        run: |
          ws="$(mktemp -d)"
          mkdir -p "$ws/kubernetes/apps/ai/omnigraph/app"
          rsync -a "$GITHUB_WORKSPACE/scripts" "$ws/"
          rsync -a "$GITHUB_WORKSPACE/kubernetes/apps/ai/omnigraph/app/bundle" "$ws/kubernetes/apps/ai/omnigraph/app/"
          docker run --rm -v "$ws":/data -w /data harbor.webgrip.dev/dockerhub/library/python:3.12-slim \
            sh -ec "pip install --quiet pyyaml==6.0.3 && \
              python3 scripts/validate_omnigraph_policies.py kubernetes/apps/ai/omnigraph/app/bundle/cluster.yaml \
                --cross-client-actor act-admin --cross-client-actor act-ryan --cross-client-actor act-ingest \
              && bash scripts/test-validate-omnigraph-policies.sh"

      - name: Test Obsidian vault importer
        run: |
          ws="$(mktemp -d)"
          mkdir -p "$ws/kubernetes/apps/ai/omnigraph/app" "$ws/kubernetes/apps/ai/omnigraph/vault-import"
          rsync -a "$GITHUB_WORKSPACE/scripts" "$ws/"
          rsync -a "$GITHUB_WORKSPACE/kubernetes/apps/ai/omnigraph/app/bundle" "$ws/kubernetes/apps/ai/omnigraph/app/"
          rsync -a "$GITHUB_WORKSPACE/kubernetes/apps/ai/omnigraph/vault-import/app" "$ws/kubernetes/apps/ai/omnigraph/vault-import/"
          docker run --rm -v "$ws":/data -w /data harbor.webgrip.dev/dockerhub/library/python:3.12-slim \
            python3 scripts/test_omnigraph_vault_import.py

      - name: Test Forgejo projects importer
        run: |
          ws="$(mktemp -d)"
          mkdir -p "$ws/kubernetes/apps/ai/omnigraph/app" "$ws/kubernetes/apps/ai/omnigraph/forge-import"
          rsync -a "$GITHUB_WORKSPACE/scripts" "$ws/"
          rsync -a "$GITHUB_WORKSPACE/kubernetes/apps/ai/omnigraph/app/bundle" "$ws/kubernetes/apps/ai/omnigraph/app/"
          rsync -a "$GITHUB_WORKSPACE/kubernetes/apps/ai/omnigraph/forge-import/app" "$ws/kubernetes/apps/ai/omnigraph/forge-import/"
          docker run --rm -v "$ws":/data -w /data harbor.webgrip.dev/dockerhub/library/python:3.12-slim \
            python3 scripts/test_omnigraph_forge_import.py

      - name: Test Omnigraph distiller
        run: |
          ws="$(mktemp -d)"
          mkdir -p "$ws/kubernetes/apps/ai/omnigraph/app" "$ws/kubernetes/apps/ai/omnigraph/distill"
          rsync -a "$GITHUB_WORKSPACE/scripts" "$ws/"
          rsync -a "$GITHUB_WORKSPACE/kubernetes/apps/ai/omnigraph/app/bundle" "$ws/kubernetes/apps/ai/omnigraph/app/"
          rsync -a "$GITHUB_WORKSPACE/kubernetes/apps/ai/omnigraph/distill/app" "$ws/kubernetes/apps/ai/omnigraph/distill/"
          docker run --rm -v "$ws":/data -w /data harbor.webgrip.dev/dockerhub/library/python:3.12-slim \
            sh -ec "python3 scripts/test_omnigraph_distill.py && bash scripts/test-omnigraph-distill-mutation.sh"

      - name: Test forgejo-sync leaves private repos alone
        run: bash scripts/test-forgejo-sync-skips-private.sh

      - name: Validate synthetic coverage of routes
        run: |
          ws="$(mktemp -d)"
          rsync -a "$GITHUB_WORKSPACE/scripts" "$ws/"
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/kubernetes" "$ws/"
          docker run --rm -v "$ws":/data -w /data harbor.webgrip.dev/dockerhub/library/python:3.12-slim \
            sh -ec "pip install --quiet pyyaml==6.0.3 && \
              python3 scripts/validate_synthetic_coverage.py /data && bash scripts/test-validate-synthetic-coverage.sh"

      - name: Check docs nav + links
        run: ./scripts/check-docs-links.sh "$GITHUB_WORKSPACE"

      - name: Validate ADR consistency
        run: python3 scripts/validate_adr_consistency.py "$GITHUB_WORKSPACE"

      - name: Validate alert annotations
        run: python3 scripts/validate_alert_annotations.py "$GITHUB_WORKSPACE"

      - name: Generated Grafana walls, boards and playlists are current
        run: python3 scripts/dashboards/generate.py --check

      - name: Validate Grafana alert-rule expressions
        run: python3 scripts/validate_grafana_alert_expr.py "$GITHUB_WORKSPACE"

      - name: Check Kyverno enforce test coverage
        run: ./scripts/check-kyverno-test-coverage.sh "$GITHUB_WORKSPACE"

      - name: Run Kyverno CLI tests
        run: ./scripts/run-kyverno-cli-tests.sh "$GITHUB_WORKSPACE"

  omnigraph:
    name: Omnigraph bundle rehearsal
    runs-on: docker
    env:
      TMPDIR: /mnt/ci-shared
      OMNIGRAPH_TOOLS: /mnt/ci-shared/omnigraph-tools-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Does this change touch the Omnigraph bundle?
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "${{ github.base_ref }}" || true
            base="$(git merge-base HEAD FETCH_HEAD 2>/dev/null || true)"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "${base}" ] || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            base="$(git rev-parse --verify --quiet HEAD~1 || git rev-parse HEAD)"
            run=true
          elif git diff --name-only "${base}" -- \
                 kubernetes/apps/ai/omnigraph/app \
                 kubernetes/apps/ai/omnigraph/embed-step \
                 kubernetes/components/placement/worker-pool \
                 .mise.toml \
                 scripts/omnigraph_rehearsal.py \
                 scripts/rehearse-omnigraph-bundle.sh \
                 scripts/test-rehearse-omnigraph-bundle.sh \
                 scripts/test_omnigraph_embedding_contract.py \
                 .forgejo/workflows/e2e.yml | grep -q .; then
            run=true
          else
            run=false
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Fetch the pinned omnigraph and kustomize
        if: steps.filter.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bin="$OMNIGRAPH_TOOLS"
          mkdir -p "$bin"
          image="$(grep -m1 -oE 'harbor\.webgrip\.dev/dockerhub/modernrelay/omnigraph-server:[^[:space:]]+' kubernetes/apps/ai/omnigraph/app/deployment.yaml)"
          container="$(docker create "$image")"
          docker cp "$container:/usr/local/bin/omnigraph" "$bin/omnigraph"
          docker cp "$container:/usr/local/bin/omnigraph-server" "$bin/omnigraph-server"
          docker rm "$container" >/dev/null
          kustomize_version="$(sed -nE 's/^"aqua:kubernetes-sigs\/kustomize" = "([^"]+)"$/\1/p' .mise.toml)"
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${kustomize_version}/kustomize_v${kustomize_version}_linux_amd64.tar.gz" | tar -xz -C "$bin" kustomize
          "$bin/omnigraph" --version

      - name: Rehearse the bundle over the previous commit's
        if: steps.filter.outputs.run == 'true'
        run: PATH="$OMNIGRAPH_TOOLS:$PATH" ./scripts/rehearse-omnigraph-bundle.sh --base-ref "${{ steps.filter.outputs.base }}"

      - name: Mutation-test the rehearsal and the embedding contract
        if: steps.filter.outputs.run == 'true'
        run: |
          export PATH="$OMNIGRAPH_TOOLS:$PATH"
          bash scripts/test-rehearse-omnigraph-bundle.sh
          python3 scripts/test_omnigraph_embedding_contract.py --self-test

  # Renders every Flux Kustomization. Sharded across workers inside the script (each worker
  # gets its own workspace copy because flux-local mutates its tree in place).
  flux-local:
    name: Flux-local render
    runs-on: docker
    env:
      TMPDIR: /mnt/ci-shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0: the render is scoped to the diff below, which needs real history.
          # A shallow clone makes the base ref unresolvable, which the script treats as
          # "render everything" -- correct, but slow. Fetch the history and keep it fast.
          fetch-depth: 0
          persist-credentials: false

      # Scope the render to what changed. The full 90-kustomization render is ~20min and is
      # disk-iowait-bound (it cannot be parallelised -- see scripts/lib/flux-local.sh), so
      # running it for a one-file push was the single biggest cost of this gate. The blast-
      # radius rules live in select_affected_kustomizations; edits to the flux root, to
      # components/, or to the validator itself still force a FULL render.
      #
      # An unresolvable base (first push to a branch -> all-zero `before`, workflow_dispatch,
      # a shallow clone) leaves this empty, and an empty FLUX_LOCAL_BASE_REF means "render
      # everything". The gate degrades toward MORE checking, never less.
      - name: Determine diff base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "${{ github.base_ref }}" || true
            base="$(git merge-base HEAD FETCH_HEAD 2>/dev/null || true)"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "${base}" ] || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "base ref unusable ('${base}') -- falling back to a full render"
            base=""
          fi
          echo "ref=${base}" >> "$GITHUB_OUTPUT"

      - name: Run flux-local test
        env:
          FLUX_LOCAL_BASE_REF: ${{ steps.base.outputs.ref }}
        run: ./scripts/run-flux-local-test.sh "$GITHUB_WORKSPACE"

  # The long pole: stands up a KinD cluster + Kyverno and runs the Chainsaw suites. Kept in its
  # own job so it never serializes behind the other checks. Node + Kyverno images pull through
  # Harbor (see scripts/lib/kyverno-tests.sh).
  chainsaw:
    name: Kyverno Chainsaw (KinD)
    runs-on: docker
    env:
      TMPDIR: /mnt/ci-shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Standing up a KinD cluster + Kyverno takes ~10min and is the workflow's long pole. It
      # exercises exactly one thing: the policies and suites under kubernetes/apps/kyverno/.
      # A change that touches none of them cannot alter the result, so skip rather than burn a
      # runner slot for 10min -- the pool is capacity-bound (the worker nodes sit at >90% CPU
      # requests), so a wasted slot directly delays every other repo's CI.
      # The nightly full-validation workflow runs the suite unconditionally, so a skip here
      # never means the suite goes unrun for longer than a day.
      - name: Does this change touch Kyverno?
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          run=true
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "${{ github.base_ref }}" || true
            base="$(git merge-base HEAD FETCH_HEAD 2>/dev/null || true)"
          else
            base="${{ github.event.before }}"
          fi
          # Same fail-safe as flux-local: no usable base => run the suite.
          if [ -n "${base}" ] && git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            if git diff --name-only "${base}" -- \
                 kubernetes/apps/kyverno \
                 scripts/run-kyverno-chainsaw.sh \
                 scripts/lib/kyverno-tests.sh \
                 .forgejo/workflows/e2e.yml | grep -q .; then
              run=true
            else
              run=false
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          [ "${run}" = "true" ] && echo "Kyverno inputs changed -- running the suite" \
                               || echo "No Kyverno inputs changed -- skipping the KinD suite"

      - name: Run Chainsaw tests
        if: steps.filter.outputs.run == 'true'
        run: |-
          bin="$TMPDIR/bin"
          mkdir -p "$bin"
          # kubectl is deliberately NOT fetched: every cluster call runs inside the KinD node
          # via `docker exec` (the node image ships kubectl), because the client-side kubeconfig
          # points at a 127.0.0.1 port that only exists in the dind daemon's netns.
          curl -fsSL -o "$bin/kind" "https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64"
          chmod +x "$bin/kind"
          export PATH="$bin:$PATH"
          ./scripts/run-kyverno-chainsaw.sh "$GITHUB_WORKSPACE"
