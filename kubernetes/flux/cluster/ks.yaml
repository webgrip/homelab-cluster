---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
  deletionPolicy: WaitForTermination
  interval: 1h
  # Retry a FAILED reconciliation in 5m rather than waiting out `interval`.
  # See the child-Kustomization patch below for why this matters; it applies
  # here too, and this one is the parent of every app in the cluster.
  retryInterval: 5m
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  patches:
    - # Add Kustomization defaults for all child Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          decryption:
            provider: sops
          deletionPolicy: WaitForTermination
          # retryInterval is NOT interval. Per the CRD: "When not specified, the
          # controller uses the KustomizationSpec.Interval value to retry
          # failures." Every Kustomization here is interval: 1h, so before this
          # default existed a FAILED one sat broken for a full hour before Flux
          # tried again — 87 of 100 were in that state.
          #
          # That is not theoretical. On 2026-08-02 a Kyverno admission-controller
          # restart made the validating webhook briefly unreachable; twelve
          # Kustomizations failed their dry-run with
          # `failed calling webhook … EOF` and were still broken 7+ minutes
          # later, recovering only when reconciled by hand. The trigger was a
          # few seconds long; the outage it caused was bounded by this value.
          #
          # 5m matches what the thirteen Kustomizations that already set it
          # chose, so this makes the house standard the default rather than
          # something each app has to remember. Deliberately not shorter: a
          # retry is a full server-side dry-run + apply, and ~100 of them
          # hammering a struggling API server is how a brief webhook blip
          # becomes a real incident.
          retryInterval: 5m
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  # Detect (don't auto-correct) live drift from reconciled state.
                  # 'warn' surfaces drift via events + the gotk DriftDetected metric
                  # (FluxResourceDriftDetected alert) without fighting Kyverno mutate
                  # webhooks. Promote to 'enabled' per-HR once benign-drift paths are
                  # tuned out with spec.driftDetection.ignore.
                  driftDetection:
                    mode: warn
                    # seccomp-default-mutate (Kyverno, autogen) adds seccompProfile to
                    # workload templates at admission — including the drift dry-run — so
                    # every HR whose chart omits it warned DriftDetected hourly (~29 HRs
                    # since 2026-08-06). The field is Kyverno's by design; mask it here.
                    ignore:
                      - paths:
                          - /spec/template/spec/securityContext/seccompProfile
                          - /spec/jobTemplate/spec/template/spec/securityContext/seccompProfile
                  install:
                    crds: CreateReplace
                    strategy:
                      name: RetryOnFailure
                  rollback:
                    cleanupOnFail: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
