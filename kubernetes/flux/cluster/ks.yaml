---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
  deletionPolicy: WaitForTermination
  interval: 1h
  # Retry a FAILED reconciliation in 5m rather than waiting out `interval`.
  # See the child-Kustomization patch below for why this matters; it applies
  # here too, and this one is the parent of every app in the cluster.
  retryInterval: 5m
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  patches:
    - # Add Kustomization defaults for all child Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          decryption:
            provider: sops
          deletionPolicy: WaitForTermination
          # retryInterval is NOT interval. Per the CRD: "When not specified, the
          # controller uses the KustomizationSpec.Interval value to retry
          # failures." Every Kustomization here is interval: 1h, so before this
          # default existed a FAILED one sat broken for a full hour before Flux
          # tried again — 87 of 100 were in that state.
          #
          # That is not theoretical. On 2026-08-02 a Kyverno admission-controller
          # restart made the validating webhook briefly unreachable; twelve
          # Kustomizations failed their dry-run with
          # `failed calling webhook … EOF` and were still broken 7+ minutes
          # later, recovering only when reconciled by hand. The trigger was a
          # few seconds long; the outage it caused was bounded by this value.
          #
          # 5m matches what the thirteen Kustomizations that already set it
          # chose, so this makes the house standard the default rather than
          # something each app has to remember. Deliberately not shorter: a
          # retry is a full server-side dry-run + apply, and ~100 of them
          # hammering a struggling API server is how a brief webhook blip
          # becomes a real incident.
          retryInterval: 5m
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  # Correct live drift back to reconciled state. Ran as 'warn' until
                  # 2026-08-29: the benign-drift classes below (Kyverno-owned fields,
                  # spegel's unmergeable port) had ~30 HRs warning hourly, which under
                  # 'enabled' would have been hourly correction fights. With every
                  # known class masked, estate-wide drift went to ZERO (verified in
                  # VictoriaLogs: helm-controller msg:"detected changes in cluster
                  # state" — the only drift telemetry left; the DriftDetected metric
                  # and its alert died 2026-08-05, and Events age out in ~1h, so THAT
                  # query is the check to re-run before touching this). If an HR
                  # starts fighting a mutator, mask the field here or revert this
                  # line — one word, instant.
                  driftDetection:
                    mode: enabled
                    # seccomp-default-mutate (Kyverno, autogen) adds seccompProfile to
                    # workload templates at admission — including the drift dry-run — so
                    # every HR whose chart omits it warned DriftDetected hourly (~29 HRs
                    # since 2026-08-06). The field is Kyverno's by design; mask it here.
                    ignore:
                      - paths:
                          - /spec/template/spec/securityContext/seccompProfile
                          - /spec/jobTemplate/spec/template/spec/securityContext/seccompProfile
                          # Same class: the image-verify webhook stamps this verdict
                          # annotation at admission, and its pass/fail value flips with
                          # signature lookups (erfbeeld/ploeg warned every reconcile).
                          - /metadata/annotations/kyverno.io~1verify-images
                      # Same class again: sa-token-optout-mutate sets this on its
                      # enumerated no-RBAC ServiceAccounts at admission — the drift
                      # dry-run included — so every HR shipping one of those SAs
                      # (longhorn hourly since 2026-08; the victoria stack is next as
                      # those SAs get touched) warns forever. The field is Kyverno's
                      # by design across ALL ServiceAccounts; mask it estate-wide.
                      - paths:
                          - /automountServiceAccountToken
                        target:
                          kind: ServiceAccount
                      # NOT a Kyverno mutation: spegel's chart declares router-tcp
                      # (TCP/5001) AND router-quic (UDP/5001), but the containerPort
                      # strategic-merge key is the port number alone, so the apply
                      # collapses the pair and the UDP entry never lands — desired
                      # state that can never converge (kubernetes#113482 class).
                      # containerPort entries are informational (no hostPort on the
                      # QUIC one), so masking loses nothing.
                      - paths:
                          - /spec/template/spec/containers/0/ports
                          # GOMEMLIMIT's resourceFieldRef.divisor: the chart says
                          # integer 1, the API stores quantity "1", and the drift
                          # diff treats the type change as a change forever. Env
                          # index 0 is chart-order-dependent; re-check on a spegel
                          # chart bump if spegel starts warning again.
                          - /spec/template/spec/containers/0/env/0/valueFrom/resourceFieldRef/divisor
                          # Side effect of the ports item above: the drift dry-run
                          # DOES add the UDP port (SSA merges on port+protocol),
                          # which makes the server bump this managed annotation in
                          # the dry-run result while live keeps the old value — a
                          # change the ports mask cannot cover. Verified via
                          # `kubectl diff --server-side --field-manager=helm-controller`.
                          - /metadata/annotations/deprecated.daemonset.template.generation
                        target:
                          kind: DaemonSet
                          name: spegel
                  install:
                    crds: CreateReplace
                    strategy:
                      name: RetryOnFailure
                  rollback:
                    cleanupOnFail: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  upgrade:
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                labelSelector: "!helm.webgrip.io/fix-forward"
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
