---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-disaster-recovery
  annotations:
    # Stop database pods but retain PVCs for later rehydrate.
    cnpg.io/hibernation: "on"
spec:
  instances: 1

  # Every other CNPG cluster in the tree pins to the worker pool (ADR-0002); this
  # one did not, so a rehydrated DR cluster could land on a 12Gi soyo control
  # plane — precisely the OOM-cascade condition ADR-0002 exists to prevent, and
  # at the worst possible moment (a restore, i.e. during an incident). Latent
  # rather than live only because the cluster ships hibernated, which is exactly
  # why it went unnoticed.
  affinity:
    nodeSelector:
      node.webgrip.io/pool: worker

  # DR cluster is intentionally hibernated; disable PDB to avoid constant
  # KubePdbNotEnoughHealthyPods alerts when no pods are running.
  enablePDB: false

  inheritedMetadata:
    annotations:
      reloader.stakater.com/auto: "true"

  bootstrap:
    recovery:
      source: cnpg-disaster-recovery-source

  replica:
    enabled: true
    source: cnpg-disaster-recovery-source

  storage:
    size: 10Gi
    storageClass: longhorn

  # Dedicated WAL volume, matching every real cluster in the tree (5Gi/longhorn).
  # Without it pg_wal shares the data disk, and if Garage S3 is unreachable WAL
  # grows unbounded until the DB CrashLoops with "no free disk space for WALs" —
  # the failure that took Grafana and Dependency-Track down. A DR cluster is
  # rehydrated precisely when things are already broken, so it is the LAST place
  # to leave that trap armed.
  walStorage:
    size: 5Gi
    storageClass: longhorn

  monitoring:
    customQueriesConfigMap:
      - name: cnpg-disaster-recovery-monitoring
        key: custom-queries

  externalClusters:
    - name: cnpg-disaster-recovery-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          # Patch this per app/cluster:
          # Must reference an ObjectStore in the same namespace
          barmanObjectName: example-db-store
          # Must match the backup server name for the source cluster
          # (typically the source CNPG cluster name)
          serverName: example-db
