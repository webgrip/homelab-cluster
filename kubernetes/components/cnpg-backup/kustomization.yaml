---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - cnpg-backup-s3.externalsecret.yaml
  - cnpg-backup-s3.pushsecret.yaml
  # Off-site store credentials, inert until an app's objectstore.yaml points at
  # them. Both sets coexist so a cutover stays a two-line change with a revert
  # as its rollback.
  - cnpg-backup-s3-offsite.externalsecret.yaml
