---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-s3-offsite
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "An access key of the off-site Garage at s3-offsite.webgrip.dev, made by a person with garage key create on garage-fsn1 and granted only on its bucket."
    wellhead.dev/plain: "S3_ACCESS_KEY_ID S3_REGION S3_ENDPOINT S3_BUCKET"
    wellhead.dev/verify.format.S3_ACCESS_KEY_ID: "GK[0-9a-f]{24}"
    wellhead.dev/verify.format.S3_SECRET_ACCESS_KEY: "[0-9a-f]{64}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 15m # high-value external token — fast propagation (Class B)
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: cnpg-backup-s3-offsite, creationPolicy: Owner}
  data:
    - {secretKey: S3_ACCESS_KEY_ID, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_ACCESS_KEY_ID}}
    - {secretKey: S3_SECRET_ACCESS_KEY, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_SECRET_ACCESS_KEY}}
    - {secretKey: S3_REGION, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_REGION}}
    - {secretKey: S3_ENDPOINT, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_ENDPOINT}}
    - {secretKey: S3_BUCKET, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_BUCKET}}
