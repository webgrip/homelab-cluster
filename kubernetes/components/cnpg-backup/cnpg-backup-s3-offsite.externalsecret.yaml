---
# Credentials for the OFF-SITE object store (Hetzner FSN1), rendered into every
# CNPG namespace alongside cnpg-backup-s3.
#
# Deliberately parallel to cnpg-backup-s3.externalsecret.yaml rather than
# replacing it — the same shape as harbor-s3 / harbor-s3-cluster:
#   cnpg-backup-s3          <- s3/cnpg-backup          <- Proxmox box, 10.0.0.110
#   cnpg-backup-s3-offsite  <- s3/cnpg-backup-offsite  <- Hetzner, via Caddy TLS
# Both credential sets exist at once, so each app's cutover is a two-line change
# in its objectstore.yaml (endpointURL + the three s3Credentials names) and the
# rollback is reverting that same commit. No key is re-minted and none is lost.
#
# There is no matching PushSecret. cnpg-backup-s3.pushsecret.yaml exists because
# that credential was seeded from the cluster; this one was minted on the
# off-site box by `garage key create` and written straight to OpenBao, so the
# cluster is a consumer only. Adding a PushSecret here would let a stale or
# empty in-cluster Secret overwrite the real credential — ESO's updatePolicy
# defaults to Replace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-s3-offsite
spec:
  refreshInterval: 15m # high-value external token — fast propagation (Class B)
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: cnpg-backup-s3-offsite, creationPolicy: Owner}
  data:
    - {secretKey: S3_ACCESS_KEY_ID, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_ACCESS_KEY_ID}}
    - {secretKey: S3_SECRET_ACCESS_KEY, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_SECRET_ACCESS_KEY}}
    - {secretKey: S3_REGION, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_REGION}}
    - {secretKey: S3_ENDPOINT, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_ENDPOINT}}
    - {secretKey: S3_BUCKET, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_BUCKET}}
