---
# cnpg-backup-s3 now sourced from OpenBao (component-rendered into each CNPG namespace).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-s3
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "CloudNativePG's backup key on the in-cluster Garage, rotated by a person with bao kv put secret/s3/cnpg-backup (runbook: backup-restore-drills)."
    wellhead.dev/plain: "S3_ACCESS_KEY_ID S3_REGION S3_ENDPOINT S3_BUCKET"
    wellhead.dev/verify.format.S3_ACCESS_KEY_ID: "GK[0-9a-f]{24}"
    wellhead.dev/verify.format.S3_SECRET_ACCESS_KEY: "[0-9a-f]{64}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 15m # high-value external token — fast propagation (Class B)
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: cnpg-backup-s3, creationPolicy: Owner}
  data:
    - {secretKey: S3_ACCESS_KEY_ID, remoteRef: {key: s3/cnpg-backup, property: S3_ACCESS_KEY_ID}}
    - {secretKey: S3_SECRET_ACCESS_KEY, remoteRef: {key: s3/cnpg-backup, property: S3_SECRET_ACCESS_KEY}}
    - {secretKey: S3_REGION, remoteRef: {key: s3/cnpg-backup, property: S3_REGION}}
    - {secretKey: S3_ENDPOINT, remoteRef: {key: s3/cnpg-backup, property: S3_ENDPOINT}}
    - {secretKey: S3_BUCKET, remoteRef: {key: s3/cnpg-backup, property: S3_BUCKET}}
