---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-restore-test
  labels:
    backup.webgrip.io/drill: "true"
spec:
  suspend: false
  schedule: "0 10 * * 1"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cnpg-restore-test
        spec:
          serviceAccountName: cnpg-restore-test
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          nodeSelector:
            node.webgrip.io/pool: worker
          containers:
            - name: restore-test
              image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/restore-drill.sh
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SOURCE_CLUSTER
                  value: example-db
                - name: RESTORE_CLUSTER
                  value: example-db-restore
                - name: EXPECTED_DATABASE
                  value: ""
                - name: EXPECTED_ROLE
                  value: ""
                - name: BARMAN_OBJECT_NAME
                  value: ""
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: cnpg-restore-drill
            - name: tmp
              emptyDir: {}
