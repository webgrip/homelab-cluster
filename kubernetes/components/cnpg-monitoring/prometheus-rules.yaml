---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-backup-rules
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: cloudnative-pg
    prometheus: k8s
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: cnpg-backup.rules
      rules:
        - alert: CNPGOperatorDown
          expr: |
            sum(
              kube_pod_status_ready{namespace="cnpg-system", condition="true"}
              * on (namespace, pod) group_left()
                kube_pod_labels{namespace="cnpg-system", label_app_kubernetes_io_name="cloudnative-pg"}
            ) < 1
          for: 10m
          labels:
            severity: critical
            owner: platform
            service: cnpg
          annotations:
            summary: "CNPG operator down (cnpg-system)"
            description: |
              What's happening:
              - No healthy CloudNativePG operator instance detected for at least 10m.

              Impact/risk:
              - Cluster operations (failover, backups, reconciliation) may not occur.

              Likely causes:
              - Operator pod crashlooping or unschedulable
              - RBAC/API connectivity issues
              - Node/resource pressure

              First actions:
              - Check operator Deployment/pods and events in namespace cnpg-system
              - Review operator logs for errors
              - Verify the Kubernetes API is healthy and reachable
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/cnpg-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/dashboards?query=cnpg"

        - alert: CNPGBackupFailed
          expr: |
            max by (namespace) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp) > 0
            and
            max by (namespace) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
              >= max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: cnpg
          annotations:
            summary: "CNPG backups failing (cnpg-system)"
            description: |
              What's happening:
              - One or more CNPG backup operations have recorded errors in the last 5 minutes.

              Impact/risk:
              - Backup/restore reliability is degraded; increases data loss risk.

              Likely causes:
              - Object store/S3 connectivity or auth issues
              - Repository throttling or errors
              - Operator/backup job failures

              First actions:
              - Inspect recent Backup/ScheduledBackup resources and events
              - Check backup job/pod logs for S3/repo errors
              - Verify object store DNS/connectivity and credentials
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/cnpg-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/dashboards?query=cnpg"

        - alert: CNPGNoRecentBackup
          expr: time() - max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 86400
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: cnpg
          annotations:
            summary: "CNPG backups stale (cnpg-system)"
            description: |
              What's happening:
              - No successful CNPG backup observed for the cluster in the last 24h.

              Impact/risk:
              - RPO may be violated; increases data loss risk.

              Likely causes:
              - ScheduledBackup not configured or not running
              - Backup jobs failing (S3/repo connectivity/auth)
              - Operator issues preventing backup scheduling

              First actions:
              - Verify ScheduledBackup configuration and status
              - Check recent backup job/pod logs and events
              - Confirm object store connectivity and credentials
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/cnpg-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/dashboards?query=cnpg"

        # CNPGWALArchivingFailed tells you archiving BROKE. These two tell you how long
        # you have left before that break kills the database — the gap that turned the
        # 2026-07-15 netpol outage into "5Gi filled in ~1.5 days" (forgejo cluster.yaml).
        # When archiving stops, pg_wal grows at >= 16MB per `archive_timeout` (default
        # 5m => ~4.6 GB/day) and Postgres stops when the volume fills. A 2Gi walStorage
        # is ~10 hours of runway; the instance-manager then dies BEFORE Postgres starts,
        # so it can never archive its way out (see the cnpg-database skill).
        - alert: CNPGWALVolumeFillingUp
          expr: |
            100 * (
              1 - kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".+-wal"}
                  / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+-wal"}
            ) > 75
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: cnpg
          annotations:
            summary: "CNPG WAL volume >75% full ({{$labels.namespace}}/{{$labels.persistentvolumeclaim}})"
            description: |
              What's happening:
              - The dedicated pg_wal volume is over 75% full and has been for 15m.

              Impact/risk:
              - If this is a WAL backlog, the database STOPS when the volume fills, and
                a restart at that point kills the instance-manager before Postgres opens.

              Likely causes:
              - WAL archiving is failing (check CNPGWALArchivingFailed) — object store
                unreachable, credentials stale, or an egress NetworkPolicy blocking it
              - A long-running transaction or replication slot holding WAL
              - Genuine write growth outrunning walStorage.size

              First actions:
              - Check whether archiving is failing first; fixing that drains the backlog
              - Inspect pg_stat_archiver and the plugin-barman-cloud sidecar logs
              - Check for inactive replication slots pinning WAL
              - Do NOT restart the instance while the backlog is near capacity
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/cnpg-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/dashboards?query=cnpg"

        - alert: CNPGWALVolumeCritical
          expr: |
            100 * (
              1 - kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".+-wal"}
                  / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+-wal"}
            ) > 90
          for: 5m
          labels:
            severity: critical
            owner: platform
            service: cnpg
          annotations:
            summary: "CNPG WAL volume >90% full ({{$labels.namespace}}/{{$labels.persistentvolumeclaim}})"
            description: |
              What's happening:
              - The dedicated pg_wal volume is over 90% full. The database is close to
                halting.

              Impact/risk:
              - Postgres stops accepting writes when pg_wal fills. Restarting an instance
                whose backlog exceeds walStorage.size kills the instance-manager before
                Postgres starts, so it cannot recover on its own.

              Likely causes:
              - The backup target (Garage S3) is unreachable, so WAL cannot be archived
                and accumulates locally — the exact failure that took Grafana and
                Dependency-Track down.
              - A long-running transaction or an inactive replication slot holding WAL.
              - walStorage.size set too small for the instance's write rate.

              First actions:
              - Restore object-store connectivity so the backlog drains; that is the only
                clean exit
              - Verify egress reaches the S3 endpoint from THIS namespace specifically
              - Check for inactive replication slots pinning WAL
              - Expanding walStorage in git does NOT resize the live PVC — see the
                cnpg-database skill before attempting it under pressure
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/cnpg-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/dashboards?query=cnpg"

        - alert: CNPGWALArchivingFailed
          expr: max by (namespace) (increase(cnpg_pg_stat_archiver_failed_count[10m])) > 0
          for: 10m
          labels:
            severity: critical
            owner: platform
            service: cnpg
          annotations:
            summary: "CNPG WAL archiving errors (cnpg-system)"
            description: |
              What's happening:
              - WAL archive errors have been seen in the last 10 minutes.

              Impact/risk:
              - PITR may be compromised; DR/backups may be incomplete.

              Likely causes:
              - Object store connectivity/auth issues
              - Repository throttling/errors
              - Operator/backup configuration errors

              First actions:
              - Check CNPG cluster status for archiving errors
              - Inspect logs for archive command failures
              - Verify object store DNS/connectivity and credentials
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/cnpg-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/dashboards?query=cnpg"

      # NOTE: CNPG exposes no restore-error counter metric. Restore readiness is
      # verified by the Job-based CNPGRestoreTestFailed alert (cnpg-restore-test.rules).

    - name: cnpg-disaster-recovery.rules
      rules:
        - alert: CNPGDisasterRecoveryCheckStale
          expr: |
            (
              time() - max by (exported_namespace) (
                kube_cronjob_status_last_successful_time{job="kube-state-metrics", cronjob="cnpg-disaster-recovery-check"}
              ) > 10800
            )
            unless on (exported_namespace)
              max by (exported_namespace) (
                kube_cronjob_spec_suspend{job="kube-state-metrics", cronjob="cnpg-disaster-recovery-check"}
              ) == 1
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: cnpg
          annotations:
            summary: "CNPG DR standby check stale ({{ $labels.exported_namespace }})"
            description: |
              What's happening:
              - The cnpg-disaster-recovery-check CronJob in {{ $labels.exported_namespace }} has not passed for over 3h.

              Impact/risk:
              - The cnpg-disaster-recovery standby is not proven to be close to its source; it may be stuck on
                a missing or unreadable WAL segment in the object store and will never catch up by itself.

              Likely causes:
              - A hole in the WAL archive (archiving disabled, or the object store lost the segment's data)
              - The standby pod is not running, or the object store is unreachable
              - The check Job itself cannot reach the API server

              First actions:
              - kubectl -n {{ $labels.exported_namespace }} logs -l app.kubernetes.io/name=cnpg-disaster-recovery-check --tail=20
              - kubectl -n {{ $labels.exported_namespace }} logs cnpg-disaster-recovery-1 -c plugin-barman-cloud --tail=20
              - A segment that fails to download every retry means rebuilding the standby from the latest
                base backup (runbook, "The PVC ages out")
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/cnpg-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/dashboards?query=cnpg"

    - name: cnpg-restore-test.rules
      rules:
        - alert: CNPGRestoreTestFailed
          expr: |
            (
              max by (namespace) (
                kube_job_status_failed{job_name=~"cnpg-restore-test-.*"} == 1
                and on (namespace, job_name)
                (time() - kube_job_created{job_name=~"cnpg-restore-test-.*"} < 86400)
              ) > 0
            )
            unless on (namespace)
              kube_cronjob_spec_suspend{cronjob="cnpg-restore-test"} == 1
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: cnpg
          annotations:
            summary: "CNPG restore test failed ({{$labels.namespace}})"
            description: |
              What's happening:
              - A cnpg-restore-test Job failed in the last 24h in namespace {{$labels.namespace}}.

              Impact/risk:
              - Restore readiness is reduced; backups may not be usable.

              Likely causes:
              - Repository connectivity/auth issues
              - Missing/corrupt backup artifacts
              - Job/config regression

              First actions:
              - Inspect the Job logs for the restore-test container
              - Check events in namespace {{$labels.namespace}}
              - Validate repository access and backup integrity
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/cnpg-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/dashboards?query=cnpg"

        - alert: CNPGRestoreTestStale
          expr: |
            (
              (kube_cronjob_status_last_successful_time{cronjob="cnpg-restore-test"} == 0)
              or
              (time() - kube_cronjob_status_last_successful_time{cronjob="cnpg-restore-test"} > 691200)
            )
            unless on (namespace)
              kube_cronjob_spec_suspend{cronjob="cnpg-restore-test"} == 1
          for: 30m
          labels:
            severity: warning
            owner: platform
            service: cnpg
          annotations:
            summary: "CNPG restore test has not succeeded recently ({{$labels.namespace}})"
            description: |
              What's happening:
              - The cnpg-restore-test CronJob has no successful runs, or last success is older than 8 days (the drills run weekly).

              Impact/risk:
              - Restore readiness is unverified; backups may not be usable.

              Likely causes:
              - CronJob not running/scheduled
              - Job failures due to repo connectivity/auth
              - Resource constraints in {{$labels.namespace}}

              First actions:
              - Check CronJob and Jobs for cnpg-restore-test
              - Inspect failed Job logs/events
              - Verify repository connectivity and credentials
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/cnpg-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/dashboards?query=cnpg"

    - name: cnpg-service-endpoints.rules
      rules:
        - alert: CNPGPrimaryServiceNoReadyEndpoint
          expr: |
            max by (exported_namespace, exported_service) (
              kube_service_info{exported_service=~".+-db-rw"}
            )
            unless on (exported_namespace, exported_service)
            sum by (exported_namespace, exported_service) (
              label_replace(
                kube_endpointslice_endpoints{ready="true", endpointslice=~".+-db-rw-[a-z0-9]{5}"},
                "exported_service", "$$1", "endpointslice", "(.+)-[a-z0-9]{5}"
              )
            )
          for: 5m
          labels:
            severity: critical
            owner: platform
            service: cnpg
          annotations:
            summary: "CNPG primary service has no ready endpoint ({{$labels.exported_namespace}}/{{$labels.exported_service}})"
            description: |
              What's happening:
              - Service {{$labels.exported_service}} in {{$labels.exported_namespace}} has had zero ready endpoints for 5m.
              - The pods can be Running and the CNPG Cluster can report healthy at the same time; this is the Service-level view.

              Impact/risk:
              - Every client of this database is down (2026-09-25: Forgejo and Harbor down, Flux deadlocked).

              Likely causes:
              - The operator could not set the primary role label on the pod (admission webhook denial)
              - Primary pod not ready, or a failover stuck mid-switch

              First actions:
              - kubectl -n {{$labels.exported_namespace}} get endpointslices -l kubernetes.io/service-name={{$labels.exported_service}}
              - kubectl -n {{$labels.exported_namespace}} get pods -l cnpg.io/instanceRole=primary
              - kubectl -n cnpg-system logs deploy/cloudnative-pg --since=15m | grep "while patching instance metadata"
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/incidents/2026-09-25-cnpg-relabel-denied-gitops-deadlock"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/dashboards?query=cnpg"
