---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Homelab - Vloer OIDC
  labels:
    blueprints.goauthentik.io/description: Vloer public PKCE login for homelab administrators.
    blueprints.goauthentik.io/instantiate: "true"
context:
  domain: ${SECRET_DOMAIN}
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Homelab - Core groups and users
      required: true

  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Homelab - Policies
      required: true

  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Homelab - Authentication and MFA flows
      required: true

  - model: authentik_providers_oauth2.scopemapping
    id: vloer-oidc-groups-scope
    identifiers:
      name: vloer-groups
    attrs:
      name: vloer-groups
      scope_name: groups
      expression: |
        return {
            "groups": [group.name for group in request.user.groups.filter(name="homelab-admins")],
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: vloer-oidc-provider
    identifiers:
      name: vloer-oidc
    attrs:
      name: vloer-oidc
      client_type: public
      client_id: vloer
      issuer_mode: per_provider
      include_claims_in_id_token: true
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - - name
          - authentik Self-signed Certificate
      grant_types:
        - authorization_code
      redirect_uris:
        - matching_mode: strict
          url: !Format
            - "https://vloer.%s/api/auth/oidc/callback"
            - !Context domain
      authentication_flow: !Find
        - authentik_flows.flow
        - - slug
          - homelab-authentication
      authorization_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-authorization-explicit-consent
      invalidation_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-invalidation-flow
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - openid
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - profile
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - email
        - !KeyOf vloer-oidc-groups-scope

  - model: authentik_core.application
    id: vloer-oidc-app
    identifiers:
      slug: vloer
    attrs:
      name: Vloer
      provider: !KeyOf vloer-oidc-provider
      meta_launch_url: !Format
        - "https://vloer.%s"
        - !Context domain
      meta_description: Human workbench for Ploeg and remote agent workspaces.
      open_in_new_tab: true
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      policy: !Find
        - authentik_policies_expression.expressionpolicy
        - - name
          - homelab-admins-only
      target: !KeyOf vloer-oidc-app
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      order: 10
      policy: !Find
        - authentik_policies_expression.expressionpolicy
        - - name
          - homelab-mfa-required
      target: !KeyOf vloer-oidc-app
    attrs:
      enabled: true
