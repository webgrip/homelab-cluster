---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Homelab - Cloudflare Access OIDC
  labels:
    blueprints.goauthentik.io/description: Cloudflare Access identity provider (staging.twente.dev) and application.
    blueprints.goauthentik.io/instantiate: "true"
context:
  access_team: webgrip
  staging_host: staging.twente.dev
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Homelab - Core groups and users
      required: true

  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Homelab - Policies
      required: true

  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Homelab - Authentication and MFA flows
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: cloudflare-access-oidc-provider
    identifiers:
      name: cloudflare-access-oidc
    attrs:
      name: Cloudflare Access OIDC
      client_type: confidential
      client_id: cloudflare-access
      client_secret: !Env CLOUDFLARE_ACCESS_OIDC_CLIENT_SECRET
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - - name
          - authentik Self-signed Certificate
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: !Format
            - "https://%s.cloudflareaccess.com/cdn-cgi/access/callback"
            - !Context access_team
      authentication_flow: !Find
        - authentik_flows.flow
        - - slug
          - homelab-authentication
      authorization_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-authorization-explicit-consent
      invalidation_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-invalidation-flow
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - "openid"
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - "profile"
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - "email"

  - model: authentik_core.application
    id: cloudflare-access-oidc-app
    identifiers:
      slug: cloudflare-access
    attrs:
      name: Cloudflare Access
      provider: !KeyOf cloudflare-access-oidc-provider
      meta_launch_url: !Format
        - "https://%s"
        - !Context staging_host
      meta_description: Cloudflare Access login for the staging sites via Authentik OIDC.
      open_in_new_tab: true
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      policy: !Find
        - authentik_policies_expression.expressionpolicy
        - - name
          - homelab-users-only
      target: !KeyOf cloudflare-access-oidc-app
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      order: 10
      policy: !Find
        - authentik_policies_expression.expressionpolicy
        - - name
          - homelab-mfa-required
      target: !KeyOf cloudflare-access-oidc-app
    attrs:
      enabled: true
