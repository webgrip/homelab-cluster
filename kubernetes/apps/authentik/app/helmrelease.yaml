---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chart:
    spec:
      chart: authentik
      version: 2026.8.5
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  interval: 1h
  # Media and CSV reports live in the in-cluster Garage bucket authentik-media
  # (VIK-2380), not on a shared ReadWriteOnce volume. That volume used to pin
  # server and worker to one node and forced Recreate upgrades, and six of those
  # failed on 2026-08-03; with nothing shared, the chart's RollingUpdate is safe
  # and an upgrade no longer drops SSO.
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    timeout: 15m
  values:
    global:
      # Route the chart's default ghcr.io/goauthentik/server image through the
      # Harbor pull-through proxy-cache (ADR-0025) instead of ghcr.io direct.
      # Digest verified live (running pod imageID) and via `docker buildx
      # imagetools inspect` against the Harbor proxy before landing. VIK-242.
      image:
        repository: harbor.webgrip.dev/ghcr/goauthentik/server
        digest: sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
      # Pod-level hardening for all authentik components. The goauthentik image
      # already runs as uid 1000 (verified live), so runAsNonRoot formalizes it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      podAnnotations:
        reloader.stakater.com/auto: "true"
      # cpu=high selects fringe-workstation and worker-2. Nothing pins the pods to
      # one of them any more (media is on Garage, VIK-2380), so soft anti-affinity
      # spreads them when there is room.
      affinity:
        podAntiAffinity: soft
        nodeAffinity:
          type: hard
          matchExpressions:
            - key: node.webgrip.io/cpu
              operator: In
              values:
                - high
      # maxUnavailable 0: the replacement pod must be Ready before the old one
      # stops, so an upgrade keeps SSO up. If the surge pod cannot schedule (memory
      # on the cpu=high nodes), the rollout waits and the old pod keeps serving.
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      envFrom:
        # AUTHENTIK_STORAGE__S3__ACCESS_KEY / __SECRET_KEY (authentik-s3.externalsecret.yaml)
        - secretRef:
            name: authentik-s3
      env:
        - name: AUTHENTIK_LOG_LEVEL
          value: info
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-db-rw.authentik.svc.cluster.local
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: authentik-db-app
              key: username
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-db-app
              key: password
        - name: AUTHENTIK_POSTGRESQL__SSLMODE
          value: require
        # Media and reports in Garage (VIK-2380). Browsers get presigned GetObject
        # URLs signed for authentik's own host under /authentik-media/, which the
        # garage authentik-media HTTPRoute forwards unchanged to the S3 API.
        # 2026.8 uses X-Forwarded-* only from these networks (VIK-2380). The
        # default trusts every private range, LAN clients included; the only
        # proxy in front of authentik is Envoy Gateway, on the pod network.
        - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
          value: 10.42.0.0/16,127.0.0.0/8,::1/128
        # The external URL as a system setting (new in 2026.8, required by 2026.11).
        - name: AUTHENTIK_WEB__BASE_URL
          value: https://authentik.${SECRET_DOMAIN}
        - name: AUTHENTIK_STORAGE__BACKEND
          value: s3
        - name: AUTHENTIK_STORAGE__S3__ENDPOINT
          value: http://garage-s3.garage.svc.cluster.local:3900
        - name: AUTHENTIK_STORAGE__S3__REGION
          value: garage
        - name: AUTHENTIK_STORAGE__S3__BUCKET_NAME
          value: authentik-media
        - name: AUTHENTIK_STORAGE__S3__ADDRESSING_STYLE
          value: path
        - name: AUTHENTIK_STORAGE__S3__CUSTOM_DOMAIN
          value: authentik.${SECRET_DOMAIN}/authentik-media
        - name: AUTHENTIK_STORAGE__S3__SECURE_URLS
          value: "true"

    authentik:
      existingSecret:
        secretName: authentik-secret

    blueprints:
      configMaps:
        - authentik-blueprints

    server:
      # One replica for now. Media on Garage (VIK-2380) removed the shared volume
      # that made a second replica wedge on "Multi-Attach error" (2026-08-12/13),
      # and RollingUpdate already keeps SSO up through an upgrade. A second
      # replica for node-level HA needs memory headroom on the cpu=high nodes
      # first: on 2026-08-13 worker-2 was filtered out with "Insufficient memory".
      replicas: 1
      # NOTE: serviceAccount.create below only creates a SA for the "managed outposts"
      # (remote-cluster) subchart feature -- server/worker never consume it unless
      # this field is set explicitly (verified live: pods ran under `default` despite
      # serviceAccount.create: true). See serviceaccount.yaml.
      serviceAccountName: authentik-app
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          namespace: observability
          labels:
            release: kube-prometheus-stack
      route:
        main:
          enabled: true
          annotations:
            external-dns.alpha.kubernetes.io/exclude: "true"
            monitoring.webgrip.io/synthetic-check: blackbox-authentik-login
          hostnames:
            - authentik.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https

    worker:
      replicas: 1
      # `ak healthcheck` starts a Python process, and on the cpu=high nodes under
      # memory pressure it took longer than the chart's 3 s: the worker was
      # killed five times in an hour on 2026-10-24 while it worked. 10 s keeps
      # the probe a liveness check instead of a load test.
      livenessProbe:
        timeoutSeconds: 10
      readinessProbe:
        timeoutSeconds: 10
      startupProbe:
        timeoutSeconds: 10
      serviceAccountName: authentik-app
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 768Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          namespace: observability
          labels:
            release: kube-prometheus-stack

    serviceAccount:
      create: true

    geoip:
      enabled: false

    prometheus:
      rules:
        enabled: true
        namespace: observability
        labels:
          release: kube-prometheus-stack

    postgresql:
      enabled: false
