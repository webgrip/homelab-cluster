---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chart:
    spec:
      chart: authentik
      version: 2026.5.2
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  interval: 1h
  # authentik is single-node BY DESIGN: server (x2) and worker share one RWO
  # /data PVC, because the cluster disallows RWX. The goauthentik chart ships
  # RollingUpdate, which starts replacement pods BEFORE terminating the
  # originals — so the moment the scheduler picks a different node for the new
  # pods, they wedge in ContainerCreating on Multi-Attach and never recover. A
  # ReadWriteOnce volume cannot attach to two nodes.
  #
  # Observed live on 2026-08-02: replacements landed on fringe-workstation while
  # the running pods held /data on worker-2, and stuck. authentik pins to
  # cpu=high, which is a SET of two nodes (fringe + worker-2 since worker-2 was
  # added), so "same node again" was never guaranteed — the cluster-wide default
  # topology spread added in b6d0f2dc simply made picking the other one likely.
  #
  # Recreate is the correct strategy for a shared-RWO workload: terminate, free
  # the volume, then start. It costs a short SSO outage on every upgrade, which
  # is strictly better than an upgrade that hangs forever and rolls back. Same
  # pattern as n8n and minecraft (native) and harbor-jobservice (post-render).
  #
  # The durable fix is authentik media on S3 so /data stops being shared at all;
  # until then this constraint is structural, not incidental.
  postRenderers:
    - kustomize:
        patches:
          # `rollingUpdate: null` is REQUIRED, not decorative. A JSON-6902
          # `replace /spec/strategy` only rewrites the rendered manifest; Flux
          # then applies SERVER-SIDE, and the live Deployment still carries the
          # rollingUpdate block Kubernetes defaulted in when the type was
          # RollingUpdate. SSA merges the two and the API rejects the result:
          #   spec.strategy.rollingUpdate: Forbidden: may not be specified when
          #   strategy `type` is 'Recreate'
          # That failed 6 upgrades and rolled back each time (2026-08-03).
          # A strategic merge with an explicit null tells SSA to REMOVE the
          # field rather than leave it inherited.
          # CO-LOCATION, not spreading. All three authentik pods (2x server +
          # worker) mount ONE ReadWriteOnce /data PVC, so they must land on the
          # SAME node — a ReadWriteOnce volume cannot attach to two nodes.
          #
          # Two separate forces were pulling them apart on 2026-08-03:
          #  1. the cluster-wide default topologySpreadConstraint added in
          #     b6d0f2dc (maxSkew 1 across hostnames), and
          #  2. the chart's own `global.affinity.podAntiAffinity: soft`.
          # Result: one pod took the volume on worker-2 and the other two wedged
          # on fringe with "Multi-Attach error". The values block below had
          # explicitly warned "do NOT add a topologySpreadConstraint here"; the
          # cluster-wide default bypassed that warning by applying globally.
          #
          # Per KEP-1258 a pod that declares ANY topologySpreadConstraints opts
          # out of the cluster defaults entirely — that is what the maxSkew: 100
          # entry below is for. It is not a spreading rule, it is the documented
          # opt-out idiom. The preferred podAffinity then actively pulls the pods
          # together, and preferred (not required) avoids the bootstrap deadlock
          # where the first pod has no peer to attract it.
          #
          # The durable fix remains authentik media on S3, after which /data stops
          # being shared and normal spreading becomes correct.
          - target:
              kind: Deployment
              name: authentik-server
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: authentik-server
              spec:
                strategy:
                  type: Recreate
                  rollingUpdate: null
                template:
                  spec:
                    topologySpreadConstraints:
                      - maxSkew: 100
                        topologyKey: kubernetes.io/hostname
                        whenUnsatisfiable: ScheduleAnyway
                        labelSelector:
                          matchLabels:
                            app.kubernetes.io/instance: authentik
                    affinity:
                      podAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                          - weight: 100
                            podAffinityTerm:
                              topologyKey: kubernetes.io/hostname
                              labelSelector:
                                matchLabels:
                                  app.kubernetes.io/instance: authentik
          - target:
              kind: Deployment
              name: authentik-worker
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: authentik-worker
              spec:
                strategy:
                  type: Recreate
                  rollingUpdate: null
                template:
                  spec:
                    topologySpreadConstraints:
                      - maxSkew: 100
                        topologyKey: kubernetes.io/hostname
                        whenUnsatisfiable: ScheduleAnyway
                        labelSelector:
                          matchLabels:
                            app.kubernetes.io/instance: authentik
                    affinity:
                      # REQUIRED, not preferred — and anchored on the server,
                      # not on `instance: authentik`. A required podAffinity
                      # whose selector also matches the pod's own Deployment
                      # deadlocks on a cold start (replica 1 has no peer to
                      # attract it, so nothing ever schedules). Anchoring on
                      # component=server is deadlock-free: the server carries
                      # no podAffinity of its own and always schedules first,
                      # then the worker is filtered onto whichever node the
                      # server picked — the node that necessarily holds /data.
                      # A hard filter also beats any surviving preferred
                      # anti-affinity outright, instead of tying with it.
                      podAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          - topologyKey: kubernetes.io/hostname
                            labelSelector:
                              matchLabels:
                                app.kubernetes.io/instance: authentik
                                app.kubernetes.io/component: server
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    timeout: 15m
  values:
    global:
      # Route the chart's default ghcr.io/goauthentik/server image through the
      # Harbor pull-through proxy-cache (ADR-0025) instead of ghcr.io direct.
      # Digest verified live (running pod imageID) and via `docker buildx
      # imagetools inspect` against the Harbor proxy before landing. VIK-242.
      image:
        repository: harbor.webgrip.dev/ghcr/goauthentik/server
        digest: sha256:3ddf09bbf69ded6a9634ecd753a01608d477f811e99bb5ffe9fc2ef7ad1c6581
      # Pod-level hardening for all authentik components. The goauthentik image
      # already runs as uid 1000 (verified live), so runAsNonRoot formalizes it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      podAnnotations:
        reloader.stakater.com/auto: "true"
      # Single-node by design (RWO /data shared by server+worker; the cluster
      # disallows RWX). Both server replicas therefore sit on ONE node on
      # purpose — do NOT add a topologySpreadConstraint here; it would make the
      # second replica unschedulable. Node-level HA needs media on S3 first
      # (follow-up). ADR-0002.
      #
      # cpu=high no longer means "fringe, the only high-CPU node" — worker-2 was
      # added 2026-08-02 with cpu=high (8 cores), so this now selects a set of
      # two and authentik may legitimately land on either. The redundant
      # nodeSelector was dropped 2026-08-02; the hard nodeAffinity below already
      # expresses exactly the same constraint.
      #
      # That widening is what makes the pod-level co-location rules load-bearing
      # rather than decorative: nodeAffinity narrows the candidates to a SET of
      # two, and only podAntiAffinity=none (below) plus the postRenderer patches
      # decide that all three pods pick the SAME member of that set. Adding a
      # third cpu=high node changes nothing; removing those rules breaks it.
      affinity:
        # `none`, NOT `soft`. The chart's soft podAntiAffinity renders a
        # preferred term at weight 100 that pushes the server replicas onto
        # DIFFERENT nodes — the exact opposite of what a shared RWO /data
        # needs. The 2026-08-03 fix added a preferred podAffinity (also
        # weight 100) to pull them back together, but two opposing preferred
        # terms of equal weight cancel in the scheduler's score: co-location
        # was then decided by unrelated node scoring, and on 2026-08-12 it
        # split again (server on worker-2 holding /data, server+worker wedged
        # on fringe in ContainerCreating for 14h — the worker component was
        # fully down, so blueprints stopped applying).
        # Removing the repulsion leaves the attraction unopposed.
        podAntiAffinity: none
        nodeAffinity:
          type: hard
          matchExpressions:
            - key: node.webgrip.io/cpu
              operator: In
              values:
                - high
      volumes:
        - name: authentik-media
          persistentVolumeClaim:
            claimName: authentik-media
      volumeMounts:
        - name: authentik-media
          mountPath: /data
      env:
        - name: AUTHENTIK_LOG_LEVEL
          value: info
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-db-rw.authentik.svc.cluster.local
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: authentik-db-app
              key: username
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-db-app
              key: password
        - name: AUTHENTIK_POSTGRESQL__SSLMODE
          value: require
        - name: AUTHENTIK_STORAGE__BACKEND
          value: file
        - name: AUTHENTIK_STORAGE__FILE__PATH
          value: /data
        # Consumed by blueprint 36-oidc-harbor via !Env; sourced from the
        # generated harbor-oidc-client Secret (see its ExternalSecret).
        # optional: pods must not wedge on ESO lag — the blueprint apply
        # simply errors until the env exists, then reloader restarts us.
        - name: HARBOR_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: harbor-oidc-client
              key: HARBOR_OIDC_CLIENT_SECRET
              optional: true
        # Consumed by blueprint 37-oidc-vikunja via !Env; same generated-secret
        # pattern as Harbor above.
        - name: VIKUNJA_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: vikunja-oidc-client
              key: VIKUNJA_OIDC_CLIENT_SECRET
              optional: true
        # Consumed by blueprint 38-oidc-litellm via !Env; same generated-secret
        # pattern as Harbor above.
        - name: LITELLM_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: litellm-oidc-client
              key: LITELLM_OIDC_CLIENT_SECRET
              optional: true
        - name: CLOUDFLARE_ACCESS_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudflare-access-oidc-client
              key: CLOUDFLARE_ACCESS_OIDC_CLIENT_SECRET
              optional: true

    authentik:
      existingSecret:
        secretName: authentik-secret

    blueprints:
      configMaps:
        - authentik-blueprints

    server:
      # ONE replica, deliberately — a second one cannot be made safe here, and
      # the two reasons it was originally set to 2 have both since evaporated:
      #
      #  - "no SSO/OIDC blip on rollouts" is void. `strategy: Recreate` (added
      #    2026-08-03, and mandatory for a shared RWO /data) scales the old
      #    ReplicaSet to ZERO before creating the new one. Every rollout is a
      #    full stop regardless of replica count.
      #  - "survives a single server-pod crash" is thin: both replicas are
      #    pinned to the same node by the RWO volume, so anything that takes the
      #    node takes both.
      #
      # Against that, a second replica has now wedged the app twice. It can only
      # ever land in one of two states: on the SAME node (co-located, fine) or
      # on the other cpu=high node, where it hits "Multi-Attach error" and stays
      # in ContainerCreating forever. Co-location cannot be guaranteed, because
      # scheduling FILTERS run before affinity SCORING — on 2026-08-13 the live
      # event was:
      #   0/6 nodes are available: 2 Insufficient memory,
      #   4 node(s) didn't match Pod's node affinity/selector
      # worker-2 was filtered out on memory, so the podAffinity never got a
      # vote and fringe was the only node left. Making that podAffinity
      # `required` would not fix it either — it would just convert a wedged
      # pod into a permanently Pending one.
      #
      # So: 1 replica is the only setting that cannot wedge. Restoring 2 (and
      # real node-level HA) is unblocked by moving media to Garage S3, after
      # which /data stops being shared and ordinary spreading becomes correct.
      replicas: 1
      # NOTE: serviceAccount.create below only creates a SA for the "managed outposts"
      # (remote-cluster) subchart feature -- server/worker never consume it unless
      # this field is set explicitly (verified live: pods ran under `default` despite
      # serviceAccount.create: true). See serviceaccount.yaml.
      serviceAccountName: authentik-app
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          namespace: observability
          labels:
            release: kube-prometheus-stack
      route:
        main:
          enabled: true
          annotations:
            external-dns.alpha.kubernetes.io/exclude: "true"
            monitoring.webgrip.io/synthetic-check: k6-ingress-canary
          hostnames:
            - authentik.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https

    worker:
      replicas: 1
      serviceAccountName: authentik-app
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 768Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          namespace: observability
          labels:
            release: kube-prometheus-stack

    serviceAccount:
      create: true

    geoip:
      enabled: false

    prometheus:
      rules:
        enabled: true
        namespace: observability
        labels:
          release: kube-prometheus-stack

    postgresql:
      enabled: false
