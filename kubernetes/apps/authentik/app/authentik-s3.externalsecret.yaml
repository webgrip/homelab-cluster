---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-s3
  namespace: authentik
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: authentik-s3, creationPolicy: Owner}
  data:
    - {secretKey: AUTHENTIK_STORAGE__S3__ACCESS_KEY, remoteRef: {key: garage/authentik-media, property: access_key_id}}
    - {secretKey: AUTHENTIK_STORAGE__S3__SECRET_KEY, remoteRef: {key: garage/authentik-media, property: secret_access_key}}
