---
# authentik's key for its media bucket on the in-cluster Garage (VIK-2380). The key
# is minted by the garage bootstrap Job authentik-media.job.yaml and mirrored to
# OpenBao garage/authentik-media; the Secret keys are the authentik env var names,
# so the HelmRelease can load it with envFrom once storage switches to s3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-s3
  namespace: authentik
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: authentik-s3, creationPolicy: Owner}
  data:
    - {secretKey: AUTHENTIK_STORAGE__S3__ACCESS_KEY, remoteRef: {key: garage/authentik-media, property: access_key_id}}
    - {secretKey: AUTHENTIK_STORAGE__S3__SECRET_KEY, remoteRef: {key: garage/authentik-media, property: secret_access_key}}
