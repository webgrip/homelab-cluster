---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret
  namespace: authentik
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "Authentik's at-rest secret key and bootstrap login, written once and copied to OpenBao by the PushSecret authentik-secret. AUTHENTIK_SECRET_KEY encrypts Authentik's stored data and the bootstrap token feeds the openbao-config job: restore the values from OpenBao's history, never new ones."
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/homelab-cluster/src/branch/main/docs/techdocs/docs/general/authentik.md"
    wellhead.dev/fields: "AUTHENTIK_SECRET_KEY AUTHENTIK_BOOTSTRAP_PASSWORD_HASH AUTHENTIK_BOOTSTRAP_TOKEN AUTHENTIK_BOOTSTRAP_EMAIL"
    wellhead.dev/plain: "AUTHENTIK_BOOTSTRAP_EMAIL"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.AUTHENTIK_SECRET_KEY: "\\S{32,}"
    wellhead.dev/verify.format.AUTHENTIK_BOOTSTRAP_EMAIL: "\\S+@\\S+"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: authentik-secret, creationPolicy: Owner}
  dataFrom:
    - extract: {key: authentik/app}
