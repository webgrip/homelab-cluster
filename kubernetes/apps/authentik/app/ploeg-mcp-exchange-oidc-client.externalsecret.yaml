---
# Client secret of the ploeg-mcp-exchange token-exchange client (VIK-2381): authentik's
# access plane reads it from OpenBao authentik/ploeg-mcp-exchange-oidc, and the consumer's
# server reads the same path to authenticate its exchanges.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-mcp-exchange-oidc-client
  namespace: authentik
spec:
  refreshInterval: "0"
  target:
    name: ploeg-mcp-exchange-oidc-client
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: "password", target: "client_secret"}
