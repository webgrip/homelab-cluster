---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-consoles-oidc-client
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-push
  selector:
    secret:
      name: unfold-consoles-oidc-client
  data:
    - match: {secretKey: client_secret, remoteRef: {remoteKey: authentik/unfold-consoles-oidc, property: client_secret}}
    - match: {secretKey: client_secret, remoteRef: {remoteKey: unfold-main/ops-consoles/oidc, property: client_secret}}
