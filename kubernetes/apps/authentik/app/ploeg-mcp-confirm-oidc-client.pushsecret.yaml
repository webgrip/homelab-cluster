---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ploeg-mcp-confirm-oidc-client
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-push
  selector:
    secret:
      name: ploeg-mcp-confirm-oidc-client
  data:
    - match: {secretKey: client_secret, remoteRef: {remoteKey: authentik/ploeg-mcp-confirm-oidc, property: client_secret}}
