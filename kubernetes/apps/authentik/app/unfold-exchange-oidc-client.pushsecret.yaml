---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-exchange-oidc-client
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: unfold-exchange-oidc-client
  data:
    - match: {secretKey: client_secret, remoteRef: {remoteKey: authentik/unfold-exchange-oidc, property: client_secret}}
