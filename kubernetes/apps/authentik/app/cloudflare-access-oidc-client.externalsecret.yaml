---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-access-oidc-client
  namespace: authentik
spec:
  refreshInterval: "0"
  target:
    name: cloudflare-access-oidc-client
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: "password", target: "CLOUDFLARE_ACCESS_OIDC_CLIENT_SECRET"}
