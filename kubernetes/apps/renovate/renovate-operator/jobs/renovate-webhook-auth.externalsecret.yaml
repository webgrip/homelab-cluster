---
# renovate-webhook-auth now sourced from OpenBao. Replaces webhook-auth.secret.sops.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-webhook-auth
  namespace: renovate
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The bearer token the Renovate operator's webhook receiver accepts: any long random value, typed or left empty to generate. Seeded once from SOPS; the forgejo-actions-secrets bridge publishes it to the repositories that call the webhook."
    wellhead.dev/generate: "token"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.token: "\\S{32,}"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: renovate-webhook-auth, creationPolicy: Owner}
  data:
    - secretKey: token
      remoteRef: {key: renovate/webhook-auth, property: token}
