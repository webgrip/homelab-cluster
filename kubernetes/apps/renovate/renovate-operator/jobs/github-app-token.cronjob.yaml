---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-github-app-token
  namespace: renovate
spec:
  schedule: "*/30 * * * *"
  # Bound the miss-count window: without it, >100 missed starts (e.g. behind a wedged Forbid job) halt scheduling forever.
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: renovate-github-app-token
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          initContainers:
            - name: mint-token
              image: ghcr.io/mshekow/github-app-installation-token:2026.07.31@sha256:cb8752da9c957f470b47abf07926bb4eb579b4e1d82a0f19b585a0474d1f1bd7
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: renovate-secrets
              env:
                - name: GITHUB_API
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: RENOVATE_GITHUB_API
                      optional: true
                # Harbor robot for the PRIVATE webgrip project (first-party charts:
                # ploeg, erfbeeld). optional: the hostRule is simply omitted until the
                # renovate-harbor-robot ExternalSecret has synced.
                - name: HARBOR_HOST
                  value: harbor.${SECRET_DOMAIN}
                - name: HARBOR_ROBOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: renovate-harbor-robot
                      key: HARBOR_ROBOT_USER
                      optional: true
                - name: HARBOR_ROBOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-harbor-robot
                      key: HARBOR_ROBOT_TOKEN
                      optional: true
              command:
                - /bin/sh
                - -ceu
                - |
                  : "${RENOVATE_GITHUB_APP_ID:?missing RENOVATE_GITHUB_APP_ID}"
                  : "${RENOVATE_GITHUB_APP_INSTALLATION_ID:?missing RENOVATE_GITHUB_APP_INSTALLATION_ID}"

                  if [ ! -s /secrets/private-key.txt ]; then
                    echo "missing private key file (/secrets/private-key.txt)" >&2
                    exit 1
                  fi

                  node index.js \
                    "$RENOVATE_GITHUB_APP_ID" \
                    "$RENOVATE_GITHUB_APP_INSTALLATION_ID" \
                    /secrets/private-key.txt \
                    "${GITHUB_API:-https://api.github.com}" \
                    > /work/token

                  if [ ! -s /work/token ]; then
                    echo "failed to mint installation token" >&2
                    exit 1
                  fi

                  node - <<'PROBE'
                  const user = process.env.RENOVATE_DOCKERHUB_USERNAME;
                  const pass = process.env.RENOVATE_DOCKERHUB_TOKEN;

                  if (!user || !pass) {
                    console.log('docker hub: no credential configured, Renovate will use the anonymous path');
                    process.exit(0);
                  }

                  // Record, never abort. This probe exists to make a dead credential visible, and on
                  // 2026-09-18 it did the opposite: exiting non-zero here aborted the whole mint, so
                  // the runtime Secret stopped being refreshed and the GitHub App token went stale
                  // too ("github.com token 401 unauthorized" on every dashboard). A probe for one
                  // credential must never take down the others. The marker is read after the Secret
                  // is applied, so the Job still goes red and RenovateTokenMinterFailing still fires.
                  const fail = (msg) => {
                    console.error(msg);
                    require('node:fs').writeFileSync('/work/credential-probe-failed', msg + '\n');
                  };

                  const url =
                    'https://auth.docker.io/token' +
                    '?scope=repository:library/node:pull&service=registry.docker.io';
                  const auth = Buffer.from(user + ':' + pass).toString('base64');

                  fetch(url, { headers: { authorization: 'Basic ' + auth } })
                    .then((res) => {
                      if (res.status === 401) {
                        require('node:fs').writeFileSync('/work/dockerhub-credential-rejected', '');
                        fail(
                          'docker hub rejected the credential (401). A REJECTED credential is worse than' +
                            ' none: Renovate stops falling back to the anonymous path and every docker.io' +
                            ' lookup returns no-result, visible only as "No docker auth found - returning"' +
                            ' on the dependency dashboard. Rotate RENOVATE_DOCKERHUB_TOKEN in OpenBao' +
                            ' (renovate/operator).',
                        );
                        return;
                      }
                      if (!res.ok) {
                        fail('docker hub auth probe returned ' + res.status);
                        return;
                      }
                      console.log('docker hub: credential accepted');
                    })
                    .catch((err) => {
                      fail('docker hub auth probe failed: ' + err.message);
                    });
                  PROBE

                  node - <<'EOF'
                  const fs = require('node:fs');

                  const token = fs.readFileSync('/work/token', 'utf8').trim();
                  const dockerHubUsername = process.env.RENOVATE_DOCKERHUB_USERNAME;
                  const dockerHubToken = process.env.RENOVATE_DOCKERHUB_TOKEN;

                  if ((dockerHubUsername || dockerHubToken) && !(dockerHubUsername && dockerHubToken)) {
                    console.error('set both RENOVATE_DOCKERHUB_USERNAME and RENOVATE_DOCKERHUB_TOKEN');
                    process.exit(1);
                  }

                  const hostRules = [
                    {
                      matchHost: 'ghcr.io',
                      hostType: 'docker',
                      username: 'x-access-token',
                      password: token,
                    },
                  ];

                  const dockerHubRejected = fs.existsSync('/work/dockerhub-credential-rejected');
                  if (dockerHubRejected) {
                    console.error('docker hub: omitting the rejected credential so Renovate uses the anonymous path');
                  }

                  if (dockerHubUsername && dockerHubToken && !dockerHubRejected) {
                    hostRules.push({
                      matchHost: 'docker.io',
                      hostType: 'docker',
                      username: dockerHubUsername,
                      password: dockerHubToken,
                    });
                  }

                  const harborHost = process.env.HARBOR_HOST;
                  const harborUser = process.env.HARBOR_ROBOT_USER;
                  const harborToken = process.env.HARBOR_ROBOT_TOKEN;

                  if ((harborUser || harborToken) && !(harborUser && harborToken)) {
                    console.error('set both HARBOR_ROBOT_USER and HARBOR_ROBOT_TOKEN');
                    process.exit(1);
                  }

                  if (harborHost && harborUser && harborToken) {
                    hostRules.push({
                      matchHost: harborHost,
                      hostType: 'docker',
                      username: harborUser,
                      password: harborToken,
                    });
                  }

                  fs.writeFileSync('/work/host-rules.json', JSON.stringify(hostRules));

                  // hostRules only authenticate Renovate's OWN lookups. postUpgradeTasks run in a
                  // child process whose environment Renovate filters down to an allowlist, so the
                  // HARBOR_ROBOT_* envs on the RenovateJob pod never reach
                  // scripts/update-oci-digests.sh — it falls back to anonymous, which works for the
                  // public proxy projects but 401s on the private `webgrip` project and aborts the
                  // whole branch with artifactErrors. customEnvVariables is the supported channel
                  // for injecting env into those child processes.
                  const customEnv = {};
                  if (harborUser && harborToken) {
                    customEnv.HARBOR_ROBOT_USER = harborUser;
                    customEnv.HARBOR_ROBOT_TOKEN = harborToken;
                  }
                  fs.writeFileSync('/work/custom-env.json', JSON.stringify(customEnv));
                  EOF
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
                - name: github-app-private-key
                  mountPath: /secrets
                  readOnly: true
          containers:
            - name: apply-secret
              image: docker.io/alpine/k8s:1.36.4@sha256:358ddfc2d6ff3f00dd461dbd79aaa6d6738709f225b8da0945bb63bd4dbc304e
              imagePullPolicy: IfNotPresent
              env:
                - name: RUNTIME_SECRET_NAME
                  value: renovate-runtime-token
                - name: RUNTIME_SECRET_KEY
                  value: token
              command:
                - /bin/sh
                - -ceu
                - |
                  token="$(cat /work/token)"

                  kubectl -n renovate create secret generic "$RUNTIME_SECRET_NAME" \
                    --from-literal="$RUNTIME_SECRET_KEY=$token" \
                    --from-literal="RENOVATE_TOKEN=$token" \
                    --from-file="RENOVATE_HOST_RULES=/work/host-rules.json" \
                    --from-file="RENOVATE_CUSTOM_ENV_VARIABLES=/work/custom-env.json" \
                    --dry-run=client \
                    -o yaml \
                    | kubectl apply -f -

                  if [ -f /work/credential-probe-failed ]; then
                    echo "the runtime secret was refreshed, but a credential probe failed:" >&2
                    cat /work/credential-probe-failed >&2
                    exit 1
                  fi

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: work
                  mountPath: /work

          volumes:
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: github-app-private-key
              secret:
                secretName: renovate-secrets
                items:
                  - key: RENOVATE_GITHUB_APP_PRIVATE_KEY
                    path: private-key.txt
