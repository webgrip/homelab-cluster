---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config-unfold-hq
data:
  renovate.json: |-
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "platform": "github",
      "autodiscover": false,
      "onboarding": false,
      "requireConfig": "required",
      "platformCommit": "enabled",
      "timezone": "Europe/Amsterdam",
      "userAgent": "webgrip-homelab/renovate-operator-unfold-hq",
      "allowedCommands": ["^corepack pnpm install --lockfile-only --ignore-scripts --ignore-pnpmfile$"],
      "hostRules": [
        {
          "matchHost": "api.github.com",
          "concurrentRequestLimit": 2,
          "maxRequestsPerSecond": 1
        },
        {
          "matchHost": "docker.io",
          "hostType": "docker",
          "concurrentRequestLimit": 1,
          "maxRequestsPerSecond": 1
        }
      ]
    }
