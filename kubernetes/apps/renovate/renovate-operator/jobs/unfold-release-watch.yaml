---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unfold-release-watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unfold-release-watch
rules:
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    resourceNames:
      - "unfold-release-watch-state"
    verbs:
      - "get"
      - "patch"
  - apiGroups:
      - "renovate-operator.mogenius.com"
    resources:
      - "renovatejobs"
    resourceNames:
      - "webgrip-forgejo"
    verbs:
      - "get"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unfold-release-watch
subjects:
  - kind: ServiceAccount
    name: unfold-release-watch
    namespace: renovate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unfold-release-watch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unfold-release-watch-state
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    app.kubernetes.io/name: unfold-release-watch
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unfold-release-watch
  labels:
    app.kubernetes.io/name: unfold-release-watch
spec:
  schedule: "*/2 * * * *"
  startingDeadlineSeconds: 60
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 100
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: unfold-release-watch
        spec:
          serviceAccountName: unfold-release-watch
          restartPolicy: Never
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watch
              image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              imagePullPolicy: IfNotPresent
              command:
                - "/bin/sh"
                - "/scripts/unfold-release-watch.sh"
              env:
                - name: HOME
                  value: /tmp
                - name: NAMESPACE
                  value: renovate
                - name: STATE_CONFIGMAP
                  value: unfold-release-watch-state
                - name: RELEASE_REPOSITORY
                  value: unfold-hq/unfold
                - name: CHART_REPOSITORY
                  value: unfold-hq/charts/unfold
                - name: RENOVATE_JOB
                  value: webgrip-forgejo
                - name: PROJECT
                  value: webgrip/unfold-cluster
                - name: OPERATOR_URL
                  value: http://renovate-operator.renovate.svc.cluster.local:8082
                - name: METRICS_URL
                  value: http://vmsingle-unfold.observability.svc.cluster.local:8428
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-runtime-token
                      key: token
                      optional: true
                - name: WEBHOOK_TOKENS
                  valueFrom:
                    secretKeyRef:
                      name: renovate-webhook-auth
                      key: token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: unfold-release-watch-script
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
