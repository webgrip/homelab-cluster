# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: renovate-credentials
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate-operator
    release: kube-prometheus-stack
spec:
  groups:
    - name: renovate-credentials.rules
      rules:
        - alert: RenovateTokenMinterFailing
          expr: kube_job_status_failed{namespace="renovate", job_name=~"renovate-github-app-token.*"} == 1
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: renovate
          annotations:
            summary: "Renovate's token minter is failing ({{ $$labels.job_name }})"
            description: |
              What's happening:
              - The CronJob that mints RENOVATE_HOST_RULES has failed for at least 15m.
              - Since 2026-09-18 it also probes the Docker Hub credential against auth.docker.io
                and exits non-zero on a 401, so a rejected token lands here rather than nowhere.

              Impact/risk:
              - Renovate keeps running with the LAST minted host rules until they expire.
              - A rejected registry credential is worse than none: Renovate stops falling back to
                the anonymous path, so every lookup for that registry returns no-result. The only
                symptom is "No docker auth found - returning" in a dependency dashboard nobody reads,
                and dependency updates for those images silently stop being proposed.

              Likely causes:
              - the Docker Hub PAT in OpenBao renovate/operator expired or was revoked
              - the GitHub App installation token could not be minted
              - the Harbor robot credential was rejected

              First actions:
              - kubectl -n renovate logs job/{{ $$labels.job_name }} — the probe names which credential
              - rotate in OpenBao, then force the ExternalSecret and re-run the CronJob
              - NB there is a second, independent Docker Hub credential under harbor/registry-proxy;
                rotating one does not rotate the other
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/renovate"

        - alert: RenovateTokenMinterStale
          expr: |
            time() - max(kube_cronjob_status_last_successful_time{namespace="renovate", cronjob="renovate-github-app-token"}) > 86400
          for: 30m
          labels:
            severity: warning
            owner: platform
            service: renovate
          annotations:
            summary: "Renovate's token minter has not succeeded in over 24h (renovate/renovate-github-app-token)"
            description: |
              What's happening:
              - No successful mint for more than 24h. The CronJob may be suspended, unschedulable,
                or not firing at all.

              Impact/risk:
              - RENOVATE_HOST_RULES and GITHUB_COM_TOKEN go stale. Both are consumed with
                `optional: true`, so Renovate degrades QUIETLY: GHCR and Docker Hub fall back to
                anonymous (rate-limited) and github.com datasources drop from 5000/h to 60/h.
              - Nothing turns red. Updates just stop arriving.

              Likely causes:
              - CronJob suspended or deleted
              - the renovate namespace cannot schedule pods
              - a failing job that never succeeds (see RenovateTokenMinterFailing)

              First actions:
              - kubectl -n renovate get cronjob renovate-github-app-token
              - kubectl -n renovate get jobs --sort-by=.status.startTime | tail
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/renovate"
