---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secrets
  namespace: renovate
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "Renovate's Docker Hub token (hub.docker.com, Personal access tokens, read-only) and its GitHub App: App ID, installation id and a private key from the App's settings page."
    wellhead.dev/plain: "RENOVATE_DOCKERHUB_USERNAME RENOVATE_GITHUB_APP_ID RENOVATE_GITHUB_APP_INSTALLATION_ID"
    wellhead.dev/verify.github-app.app-id-field: "RENOVATE_GITHUB_APP_ID"
    wellhead.dev/verify.github-app.installation-id-field: "RENOVATE_GITHUB_APP_INSTALLATION_ID"
    wellhead.dev/verify.github-app.private-key-field: "RENOVATE_GITHUB_APP_PRIVATE_KEY"
    wellhead.dev/verify: "github-app"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: renovate-secrets, creationPolicy: Owner}
  data:
    - {secretKey: RENOVATE_DOCKERHUB_TOKEN, remoteRef: {key: renovate/operator, property: RENOVATE_DOCKERHUB_TOKEN}}
    - {secretKey: RENOVATE_DOCKERHUB_USERNAME, remoteRef: {key: renovate/operator, property: RENOVATE_DOCKERHUB_USERNAME}}
    - {secretKey: RENOVATE_GITHUB_APP_ID, remoteRef: {key: renovate/operator, property: RENOVATE_GITHUB_APP_ID}}
    - {secretKey: RENOVATE_GITHUB_APP_INSTALLATION_ID, remoteRef: {key: renovate/operator, property: RENOVATE_GITHUB_APP_INSTALLATION_ID}}
    - {secretKey: RENOVATE_GITHUB_APP_PRIVATE_KEY, remoteRef: {key: renovate/operator, property: RENOVATE_GITHUB_APP_PRIVATE_KEY}}
