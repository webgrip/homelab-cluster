---
apiVersion: generators.external-secrets.io/v1alpha1
kind: SSHKey
metadata:
  name: renovate-signing-key
spec:
  keyType: ed25519
  comment: renovate-commit-signing
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-signing-key
spec:
  refreshInterval: "0"
  target:
    name: renovate-signing-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        RENOVATE_GIT_PRIVATE_KEY: "{{ .privateKey }}"
        key.pub: "{{ .publicKey }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: SSHKey
          name: renovate-signing-key
