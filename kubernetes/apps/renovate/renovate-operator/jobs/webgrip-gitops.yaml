---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: webgrip-gitops
spec:
  # Explicit list, not `webgrip/*`: Forgejo-leading repos must NOT be processed on GitHub —
  # their GitHub copies are downstream force-push-mirrors, so a Renovate branch/automerge
  # commit there is silently destroyed by the next relay. Renovate's autodiscoverFilters
  # have UNION semantics (a negation pattern does not subtract from a glob), so exclusion
  # requires enumerating. This is the inverse of webgrip-forgejo's list; when a repo flips
  # Forgejo-leading, move it there. Trade-off: brand-new GitHub repos are no longer
  # auto-discovered (fine — the fleet is converging on Forgejo). Regenerate from live state:
  # kubectl -n renovate get renovatejob webgrip-gitops -o jsonpath='{range .status.projects[*]}{.name}{"\n"}{end}'
  discoveryFilters:
    - webgrip/.github
    - webgrip/.github-private
    - webgrip/SparkyFitness
    - webgrip/awesome-copilot
    - webgrip/code14-fullstack-assignment
    - webgrip/devops-is-a-philosophy
    - webgrip/docker-github-actions-runner
    - webgrip/impacttu-poc
    - webgrip/kotlin-fintech-starter-app
    - webgrip/opg-poc
    - webgrip/poc-samenoptrekken
    - webgrip/renovate
    - webgrip/twitch_exporter
    - webgrip/webcore
  provider:
    name: github
    endpoint: https://api.github.com/
  # renovate-operator evaluates cron in its controller timezone (typically UTC).
  # Keep dashboard approvals responsive without overlapping the busiest batch windows.
  schedule: "17 */6 * * *"
  parallelism: 1
  image: docker.io/renovate/renovate:44.165.3-full@sha256:3dd7dff3906de73d7dcfef3216c04e06b030579c7cd33cadb9129d54996645ce
  secretRef: renovate-runtime-token
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-auth
        key: token
  extraEnv:
    - name: RENOVATE_CONFIG_FILE
      value: /config/renovate.json
    - name: RENOVATE_BASE_DIR
      value: /tmp
    - name: HOME
      value: /tmp
    - name: NODE_OPTIONS
      value: --max-old-space-size=3000
    # info, not debug: at debug Renovate prints its resolved config, including
    # customEnvVariables (HARBOR_ROBOT_TOKEN), in plain text into the pod log,
    # which the log shipper stores. For a one-off "why didn't this update?",
    # run a single job at debug and delete its pod afterwards.
    - name: LOG_LEVEL
      value: info
    # Harbor robot for the PRIVATE webgrip project: registry auth arrives via
    # RENOVATE_HOST_RULES (token-minter folds it in), but the update-oci-digests.sh
    # postUpgradeTask reads these envs directly (scripts/lib/oci.sh fetch_digest —
    # anonymous requests 401 on first-party charts). optional: until the
    # renovate-harbor-robot ExternalSecret syncs, behavior stays as before.
    - name: HARBOR_ROBOT_USER
      valueFrom:
        secretKeyRef:
          name: renovate-harbor-robot
          key: HARBOR_ROBOT_USER
          optional: true
    - name: HARBOR_ROBOT_TOKEN
      valueFrom:
        secretKeyRef:
          name: renovate-harbor-robot
          key: HARBOR_ROBOT_TOKEN
          optional: true
    # Renovate filters the env handed to postUpgradeTask child processes, so the two vars
    # above never reach update-oci-digests.sh. The token-minter folds them into this key
    # so Renovate re-injects them into the child env.
    - name: RENOVATE_CUSTOM_ENV_VARIABLES
      valueFrom:
        secretKeyRef:
          name: renovate-runtime-token
          key: RENOVATE_CUSTOM_ENV_VARIABLES
          optional: true
  extraVolumes:
    - name: config
      configMap:
        name: renovate-config-gitops
  extraVolumeMounts:
    - name: config
      mountPath: /config
      readOnly: true
  nodeSelector:
    node.webgrip.io/pool: worker
  tolerations:
    - key: dedicated
      operator: Equal
      value: fringe
      effect: NoSchedule
  resources:
    requests:
      cpu: 250m
      # 1Gi stopped fitting once the CNPG DBs got memory requests (fringe
      # ~930Mi request-headroom, worker-1 CPU-request-full) — jobs sat Pending.
      # A request is a scheduling promise, not a cap; the 4Gi limit still
      # covers real usage bursts.
      memory: 512Mi
    limits:
      cpu: "1500m"
      memory: 4Gi
  securityContext:
    pod:
      runAsNonRoot: true
      runAsUser: 12021
      runAsGroup: 12021
    container:
      allowPrivilegeEscalation: false
