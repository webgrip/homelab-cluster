---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-webgrip-talos-pull
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: renovate-webgrip-talos-pull, creationPolicy: Owner}
  data:
    - {secretKey: username, remoteRef: {key: unfold-cluster/metal-image-pull, property: username}}
    - {secretKey: token, remoteRef: {key: unfold-cluster/metal-image-pull, property: token}}
