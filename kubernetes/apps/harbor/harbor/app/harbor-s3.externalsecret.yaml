---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3
  namespace: harbor
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "Harbor's key on the off-site Garage (s3-offsite.webgrip.dev), written with just the harbor-s3 recipe; made by a person with garage key create on garage-fsn1."
    wellhead.dev/plain: "REGISTRY_STORAGE_S3_ACCESSKEY"
    wellhead.dev/verify.format.REGISTRY_STORAGE_S3_ACCESSKEY: "GK[0-9a-f]{24}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: harbor-s3, creationPolicy: Owner}
  data:
    - {secretKey: REGISTRY_STORAGE_S3_ACCESSKEY, remoteRef: {key: harbor/s3, property: REGISTRY_STORAGE_S3_ACCESSKEY}}
    - {secretKey: REGISTRY_STORAGE_S3_SECRETKEY, remoteRef: {key: harbor/s3, property: REGISTRY_STORAGE_S3_SECRETKEY}}
