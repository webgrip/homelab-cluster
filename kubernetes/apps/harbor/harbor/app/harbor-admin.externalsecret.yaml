---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0" # generate once, never rotate (secretKey is an at-rest key)
  target:
    name: harbor-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
      rewrite:
        - regexp: {source: "password", target: "HARBOR_ADMIN_PASSWORD"}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-16
      rewrite:
        - regexp: {source: "password", target: "secretKey"}
