---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-robot-renovate
  namespace: harbor
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0" # generate-once, never rotate on its own
  target:
    name: harbor-robot-renovate
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        RENOVATE_USER: "robot$$webgrip+renovate"
        RENOVATE_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
      rewrite:
        - regexp: {source: "password", target: "token"}
