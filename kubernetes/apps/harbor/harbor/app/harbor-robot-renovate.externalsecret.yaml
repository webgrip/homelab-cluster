---
# Read-only credential for Renovate's Harbor tag enumeration. Renovate cannot see any
# webgrip/* image tag today — the project is private and the bot has no Harbor identity —
# so none of the Harbor-hosted image pins (infrastructure cross-image ARGs, workflows
# container pins, this repo's runner pins) ever get bump PRs; every one found stale in the
# 2026-07-27 audit was bumped by hand. Same generate-once pattern as harbor-robot-webgrip;
# the provisioner CronJob converges the robot `robot$webgrip+renovate` (pull-only) and the
# PushSecret mirrors the credential to OpenBao secret/harbor/robot-renovate for the bot's
# hostRules, wherever the bot runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-robot-renovate
  namespace: harbor
spec:
  refreshInterval: "0" # generate-once, never rotate on its own
  target:
    name: harbor-robot-renovate
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Literal Harbor robot login name ($$ -> $ after Flux substitution).
        RENOVATE_USER: "robot$$webgrip+renovate"
        RENOVATE_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
      rewrite:
        - regexp: {source: "password", target: "token"}
