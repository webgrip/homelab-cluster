---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata: {name: harbor-admin, namespace: harbor}
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: harbor-admin}}
  data:
    - match: {secretKey: HARBOR_ADMIN_PASSWORD, remoteRef: {remoteKey: harbor/admin, property: HARBOR_ADMIN_PASSWORD}}
