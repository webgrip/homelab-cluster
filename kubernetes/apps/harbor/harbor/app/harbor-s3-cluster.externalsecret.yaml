---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3-cluster
  namespace: harbor
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: harbor-s3-cluster, creationPolicy: Owner}
  data:
    - {secretKey: REGISTRY_STORAGE_S3_ACCESSKEY, remoteRef: {key: harbor/s3-cluster, property: REGISTRY_STORAGE_S3_ACCESSKEY}}
    - {secretKey: REGISTRY_STORAGE_S3_SECRETKEY, remoteRef: {key: harbor/s3-cluster, property: REGISTRY_STORAGE_S3_SECRETKEY}}
