---
# Credentials for the IN-CLUSTER Garage (namespace `garage`), which will hold
# registry blobs after the Stage-2 cutover.
#
# Deliberately parallel to harbor-s3.externalsecret.yaml rather than replacing it:
#   harbor-s3          <- secret/harbor/s3          <- off-cluster Garage (10.0.0.110)
#   harbor-s3-cluster  <- secret/harbor/s3-cluster  <- in-cluster Garage
# Both credential sets exist at once, so the cutover is a two-line change in
# helmrelease.yaml (`regionendpoint` + `existingSecret`) and the rollback is
# reverting that same commit — no secret restore, no re-minting, no lost keys.
#
# Populated by the garage bootstrap Job via a PushSecret
# (apps/garage/garage/bootstrap/pushsecret.yaml). Until that Job has run this
# ExternalSecret will report SecretSyncError, which is expected and harmless —
# nothing consumes the Secret until the helmrelease flips to it.
#
# Key names match what the goharbor chart expects, identical to harbor-s3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3-cluster
  namespace: harbor
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: harbor-s3-cluster, creationPolicy: Owner}
  data:
    - {secretKey: REGISTRY_STORAGE_S3_ACCESSKEY, remoteRef: {key: harbor/s3-cluster, property: REGISTRY_STORAGE_S3_ACCESSKEY}}
    - {secretKey: REGISTRY_STORAGE_S3_SECRETKEY, remoteRef: {key: harbor/s3-cluster, property: REGISTRY_STORAGE_S3_SECRETKEY}}
