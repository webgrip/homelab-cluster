---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata: {name: harbor-robot-talos, namespace: harbor}
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: harbor-robot-talos}}
  data:
    - match: {secretKey: CI_USER, remoteRef: {remoteKey: harbor/robot-talos, property: CI_USER}}
    - match: {secretKey: CI_TOKEN, remoteRef: {remoteKey: harbor/robot-talos, property: CI_TOKEN}}
