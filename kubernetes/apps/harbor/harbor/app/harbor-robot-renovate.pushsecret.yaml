---
# Mirror the generated renovate robot credential to OpenBao so the (out-of-cluster) Renovate
# bot's hostRules can be seeded from secret/harbor/robot-renovate.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata: {name: harbor-robot-renovate, namespace: harbor}
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: harbor-robot-renovate}}
  data:
    - match: {secretKey: RENOVATE_USER, remoteRef: {remoteKey: harbor/robot-renovate, property: RENOVATE_USER}}
    - match: {secretKey: RENOVATE_TOKEN, remoteRef: {remoteKey: harbor/robot-renovate, property: RENOVATE_TOKEN}}
