---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-robot-talos
  namespace: harbor
spec:
  refreshInterval: "0"
  target:
    name: harbor-robot-talos
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        CI_USER: "robot$$talos+ci"
        CI_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
      rewrite:
        - regexp: {source: "password", target: "token"}
