---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: harbor-release-relay
  labels:
    app.kubernetes.io/name: harbor-release-relay
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-release-relay
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
