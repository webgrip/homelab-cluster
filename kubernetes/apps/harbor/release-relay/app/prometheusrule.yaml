---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: harbor-release-relay
  labels:
    app.kubernetes.io/name: harbor-release-relay
    release: kube-prometheus-stack
spec:
  groups:
    - name: harbor-release-relay.rules
      rules:
        - alert: HarborReleaseRelayScheduleFailing
          expr: increase(harbor_release_relay_schedules_total{result="failed"}[1h]) > 0
          for: 0m
          labels:
            severity: warning
            owner: platform
            service: harbor
          annotations:
            summary: "An Unfold release push did not reach Renovate (harbor-release-relay)"
            description: |
              What's happening:
              - harbor-release-relay received an Unfold release push from Harbor and the
                renovate-operator schedule call did not return 2xx.

              Impact/risk:
              - The homelab bump for that release waits for the hourly RenovateJob run.

              Likely causes:
              - status 401: Secret harbor-release-relay-renovate no longer holds a token listed in
                OpenBao renovate/webhook-auth
              - status 0: the relay NetworkPolicy or the renovate-operator pod is down

              First actions:
              - kubectl -n harbor logs deploy/harbor-release-relay
              - kubectl -n renovate get pods -l app=renovate-operator
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/renovate"
        - alert: HarborReleaseRelayUnconfigured
          expr: harbor_release_relay_configured == 0
          for: 30m
          labels:
            severity: warning
            owner: platform
            service: harbor
          annotations:
            summary: "harbor-release-relay is missing a token (harbor)"
            description: |
              What's happening:
              - The relay runs without its inbound token or its Renovate token.

              Impact/risk:
              - Harbor's release pushes are rejected or never reach Renovate; releases wait for
                the hourly RenovateJob run.

              Likely causes:
              - ExternalSecret harbor-release-relay-inbound or harbor-release-relay-renovate not Synced
              - OpenBao renovate/webhook-auth has no token property

              First actions:
              - kubectl -n harbor get externalsecret harbor-release-relay-inbound harbor-release-relay-renovate
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/renovate"
        - alert: HarborReleaseRelayDown
          expr: up{namespace="harbor", service="harbor-release-relay"} == 0
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: harbor
          annotations:
            summary: "harbor-release-relay is down (harbor)"
            description: |
              What's happening:
              - The relay that turns Unfold release pushes into Renovate runs is unscrapable.

              Impact/risk:
              - Unfold releases reach homelab only on the hourly RenovateJob run.

              Likely causes:
              - pod crashlooping or unschedulable on the worker pool
              - the python image cannot be pulled through Harbor

              First actions:
              - kubectl -n harbor describe deploy harbor-release-relay
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/renovate"
