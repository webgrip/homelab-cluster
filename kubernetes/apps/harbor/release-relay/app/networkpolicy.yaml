---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-release-relay-to-renovate-webhook
  labels:
    app.kubernetes.io/part-of: harbor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: harbor-release-relay
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: renovate
          podSelector:
            matchLabels:
              app: renovate-operator
      ports:
        - protocol: TCP
          port: 8082
