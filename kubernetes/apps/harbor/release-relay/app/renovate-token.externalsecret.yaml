---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-release-relay-renovate
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: harbor-release-relay-renovate
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RENOVATE_WEBHOOK_TOKEN: '{{ .tokens | splitList "," | first | trim }}'
  data:
    - secretKey: tokens
      remoteRef: {key: renovate/webhook-auth, property: token}
