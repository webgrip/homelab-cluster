---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-release-relay
  labels:
    app.kubernetes.io/name: harbor-release-relay
    app.kubernetes.io/part-of: harbor
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-release-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-release-relay
        app.kubernetes.io/part-of: harbor
    spec:
      nodeSelector:
        node.webgrip.io/pool: worker
      serviceAccountName: harbor-release-relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:a1321512d6a287428c50dcdf2ab3857761127e03a23b1f648e9c1c0de59288f8
          command:
            - "python3"
            - "-u"
            - "/opt/relay/relay.py"
          envFrom:
            - secretRef: {name: harbor-release-relay-inbound, optional: true}
            - secretRef: {name: harbor-release-relay-renovate, optional: true}
          env:
            - name: RENOVATE_SCHEDULE_URL
              value: http://renovate-operator.renovate.svc.cluster.local:8082/webhook/v1/schedule?job=webgrip-forgejo&namespace=renovate&project=webgrip%2Fhomelab-cluster
            - name: WATCHED_REPOSITORIES
              value: webgrip/unfold,webgrip/unfold-agent,webgrip/charts/unfold
            - name: REPEAT_AFTER_SECONDS
              value: "1200"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /opt/relay
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
      volumes:
        - name: script
          configMap:
            name: harbor-release-relay-script
