---
# Zero-trust for kroki. The namespace label kyverno.io/default-network-policies
# generates default-deny (ingress+egress) + allow-dns. Kroki is two components —
# the gateway and the mermaid companion it calls intra-namespace — and with
# KROKI_SAFE_MODE=SECURE it renders fully in-process, so beyond DNS the only
# egress needed is gateway -> companion.
#
# Ingress: gateway (network ns) + RFC1918/loopback (masquerade) + intra-namespace
# (kroki -> mermaid) on the app ports. Egress: intra-namespace only; DNS is
# covered by the generated allow-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kroki-allow-ingress
  labels:
    app.kubernetes.io/part-of: kroki
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kroki
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            cidr: 127.0.0.0/8
        - ipBlock:
            cidr: fd00::/8
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8002
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kroki-allow-egress-intra-namespace
  labels:
    app.kubernetes.io/part-of: kroki
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kroki
