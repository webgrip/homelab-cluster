---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/agent-sandbox-system/agent-sandbox/app
  prune: true
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: agent-sandbox-controller
      namespace: agent-sandbox-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agent-sandbox-system
