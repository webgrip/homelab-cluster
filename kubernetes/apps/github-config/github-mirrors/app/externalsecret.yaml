---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-mirrors-forgejo
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: github-mirrors-forgejo, creationPolicy: Owner}
  data:
    - {secretKey: FORGEJO_TOKEN, remoteRef: {key: forgejo/repo-config, property: FORGEJO_TOKEN}}
