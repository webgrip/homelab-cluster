---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: github-mirrors-allow-forgejo-openbao-and-vmagent
  labels:
    app.kubernetes.io/name: github-mirrors
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: github-mirrors
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8429
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: github-mirrors-egress
  labels:
    app.kubernetes.io/name: github-mirrors
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: github-mirrors
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.github.com
        - matchName: uploads.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
