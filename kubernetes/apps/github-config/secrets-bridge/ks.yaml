---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-secrets-bridge
spec:
  dependsOn:
    - name: forgejo-actions-secrets
      namespace: forgejo
  interval: 1h
  retryInterval: 5m
  path: ./kubernetes/apps/github-config/secrets-bridge/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: github-config
  wait: false
