---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-secrets-bridge-source
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: github-secrets-bridge-source, creationPolicy: Owner}
  data:
    - {secretKey: RELEASE_CONSUMER_TOKEN_FORGEJO, remoteRef: {key: forgejo/ploeg-release, property: token}}
