---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: ploeg-hq
  labels:
    app.kubernetes.io/name: github-config-ploeg-hq
spec:
  suspend: false
  approvePlan: auto
  interval: 1h
  retryInterval: 15m
  path: ./kubernetes/apps/repo-config/repo-config/tofu-github
  vars:
    - name: github_owner
      value: ploeg-hq
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  serviceAccountName: github-config-ploeg-hq-runner
  storeReadablePlan: human
  alwaysCleanupRunnerPod: true
  runnerPodTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: github-config
    spec:
      priorityClassName: background-batch
      nodeSelector:
        node.webgrip.io/pool: worker
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
