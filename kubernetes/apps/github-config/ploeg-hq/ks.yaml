---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-config-ploeg-hq
spec:
  dependsOn:
    - name: tofu-controller
      namespace: flux-system
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/github-config/ploeg-hq/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: github-config
  wait: false
