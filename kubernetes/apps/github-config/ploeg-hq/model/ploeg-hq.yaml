---
owner: ploeg-hq
repository: ploeg
app_secret_path: github/ploeg-hq-app

settings:
  visibility: public
  default_branch: development
  has_issues: true
  has_projects: true
  has_wiki: true
  has_discussions: false
  allow_merge_commit: true
  allow_squash_merge: true
  allow_rebase_merge: true
  allow_auto_merge: true
  allow_update_branch: false
  delete_branch_on_merge: true
  web_commit_signoff_required: false
  squash_merge_commit_title: COMMIT_OR_PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES
  merge_commit_title: MERGE_MESSAGE
  merge_commit_message: PR_TITLE
  actions_enabled: true
  allowed_actions: all
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false

rulesets:
  protect-development:
    id: 24451069
    name: Protect development
    target: branch
    include:
      - refs/heads/development
    deletion: true
    non_fast_forward: true
    update: false
    required_status_checks:
      - context: verify
        integration_id: 15368
    bypass_repository_role_ids:
      - 5
  protect-main:
    id: 24445411
    name: Protect main
    target: branch
    include:
      - refs/heads/main
    deletion: true
    non_fast_forward: true
    update: false
    required_status_checks:
      - context: verify
        integration_id: 15368
    bypass_repository_role_ids:
      - 5
  release-tags-immutable:
    id: 24445407
    name: Release tags are immutable
    target: tag
    include:
      - refs/tags/v*
    deletion: true
    non_fast_forward: true
    update: true
    required_status_checks: []
    bypass_repository_role_ids: []

release_consumers_enabled: true
release_consumers: >-
  [{"forge":"forgejo","url":"https://forgejo.webgrip.dev","repo":"webgrip/unfold","base":"development","recipe":"scripts/consume-ploeg-release.sh","message":"fix(ploeg): update Ploeg to {version}"}]
