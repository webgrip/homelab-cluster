---
# Adopt: ExternalSecret takes over the previously-unmanaged backstage-oidc-secrets from OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-oidc-secrets
  namespace: backstage
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The OIDC client of Backstage in Authentik: the client id the access-plane broker registers and a client secret of your choice (leave it empty to generate). The broker reads both from here and configures Authentik with them, so a new value takes effect on its next run."
    wellhead.dev/plain: "AUTH_OIDC_CLIENT_ID"
    wellhead.dev/generate: "AUTH_OIDC_CLIENT_SECRET"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.AUTH_OIDC_CLIENT_SECRET: "\\S{32,}"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: backstage-oidc-secrets, creationPolicy: Owner}
  data:
    - {secretKey: AUTH_OIDC_CLIENT_ID, remoteRef: {key: backstage/oidc, property: AUTH_OIDC_CLIENT_ID}}
    - {secretKey: AUTH_OIDC_CLIENT_SECRET, remoteRef: {key: backstage/oidc, property: AUTH_OIDC_CLIENT_SECRET}}
