---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  namespace: backstage
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "App secrets written once and copied to OpenBao by their PushSecret; they include an at-rest key the app encrypts its data with. Restore the values from OpenBao's history, never new ones. BACKEND_SECRET signs Backstage's tokens; the GitHub client id and secret belong to its GitHub OAuth app."
    wellhead.dev/fields: "AUTH_GITHUB_CLIENT_ID AUTH_GITHUB_CLIENT_SECRET BACKEND_SECRET GA_MEASUREMENT_ID GITHUB_APP_CLIENT_ID GITHUB_APP_CLIENT_SECRET GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY GITHUB_APP_WEBHOOK_SECRET GITHUB_TOKEN NEW_RELIC_REST_API_KEY NEW_RELIC_USER_KEY OPENAPI_AI_KEY POSTGRES_DB SENTRY_TOKEN"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "none"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: backstage-secrets, creationPolicy: Owner}
  dataFrom:
    - extract: {key: backstage/app}
