---
# TechDocs S3 read credentials (ADR-0039). Pulls ONLY the read-only half of the
# Garage-minted key material (secret/garage/techdocs, mirrored there by the
# garage-techdocs-keys PushSecret): Backstage runs `builder: 'external'` — it
# serves prebuilt docs from the bucket and never writes. The read+write publish
# key goes to the Forgejo runner via forgejo-actions-secrets, not here.
#
# Key names match the ${TECHDOCS_S3_*} placeholders the app-config techdocs block
# substitutes (see plan-backstage-techdocs Phase 2); the Deployment consumes this
# Secret via envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-techdocs-s3
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: backstage-techdocs-s3, creationPolicy: Owner}
  data:
    - {secretKey: TECHDOCS_S3_ACCESS_KEY_ID, remoteRef: {key: garage/techdocs, property: read_access_key_id}}
    - {secretKey: TECHDOCS_S3_SECRET_ACCESS_KEY, remoteRef: {key: garage/techdocs, property: read_secret_access_key}}
