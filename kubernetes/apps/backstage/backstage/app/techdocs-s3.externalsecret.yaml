---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-techdocs-s3
  namespace: backstage
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: backstage-techdocs-s3, creationPolicy: Owner}
  data:
    - {secretKey: TECHDOCS_S3_ACCESS_KEY_ID, remoteRef: {key: garage/techdocs, property: read_access_key_id}}
    - {secretKey: TECHDOCS_S3_SECRET_ACCESS_KEY, remoteRef: {key: garage/techdocs, property: read_secret_access_key}}
