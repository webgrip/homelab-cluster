---
# backstage-db-secret now sourced from OpenBao. Replaces SOPS. Value-preserving (CNPG bootstrap secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-db-secret
  namespace: backstage
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "A database login created by CloudNativePG at initdb and copied to OpenBao by its PushSecret; the database keeps the password, so restore the value from OpenBao's history rather than typing a new one."
    wellhead.dev/fields: "username password"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "none"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: backstage-db-secret, creationPolicy: Owner}
  dataFrom:
    - extract: {key: backstage/db}
