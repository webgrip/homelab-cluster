---
# One-shot recovery: purge the JetStream DOCUMENTS backlog. The 2026-08-06→27
# inert-blobAddr era queued ~10M pointer messages whose S3 blobs were never
# written — every delivery 404s (NoSuchKey), nothing can ever Ack, so the queue
# cannot drain itself and pinned the 10Gi volume at ENOSPC for 15 days.
# Guarded: purges ONLY when the stream holds >7GiB (a wedged state no healthy
# flow reaches under the 8Gi max_file cap), so a rerun on a recovered stream is
# a no-op and cannot eat in-flight documents. Remove this Job once it has run.
apiVersion: batch/v1
kind: Job
metadata:
  name: guac-nats-purge
  annotations:
    # Job spec.template is immutable; force = delete+recreate on template change.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
        - name: purge
          image: docker.io/natsio/nats-box:0.18.0@sha256:abdc9f9f0120bb8adfbf674eb037d1551db55356eb198b7bd4ffed377f6950a6
          # The image's WORKDIR is /root, unreadable as uid 1000 — the nats CLI
          # dies on `stat .` without a readable cwd.
          workingDir: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: NATS_URL
              value: nats://guac-nats.security.svc.cluster.local:4222
          command:
            - sh
            - -ec
            - |
              bytes=$(nats stream info DOCUMENTS --json | sed -n 's/.*"bytes": *\([0-9]*\).*/\1/p' | head -1)
              if [ -z "$bytes" ]; then
                echo "could not read DOCUMENTS stream state — refusing to guess" >&2
                exit 1
              fi
              echo "DOCUMENTS stream holds $bytes bytes"
              if [ "$bytes" -gt 7516192768 ]; then
                # rm, not purge: purge writes a fresh block file, which a 100%-full
                # volume cannot host (proven 2026-08-27: "Error creating msg block
                # file"). Deletion only frees. GUAC components recreate the stream
                # and their consumers idempotently at startup — that is how the
                # stream came to exist on the originally empty volume.
                nats stream rm DOCUMENTS --force
                echo "removed wedged stream"
              else
                echo "stream healthy, nothing to do"
              fi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
