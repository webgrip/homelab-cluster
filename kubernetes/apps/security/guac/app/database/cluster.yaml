---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: guac-db
  namespace: security
  annotations:
    policy.webgrip.io/allow-stateful-delete: "true"
spec:
  instances: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  # Pin the DB off the soyo control-planes onto the worker pool (ADR-0002).
  # This was the missing pin that let guac-db reschedule onto soyo-3 when
  # the 2026-07-11 resources rollout recreated the pod (guac-db is a separate
  # Flux Kustomization and never inherited guac/app's worker-pool component).
  affinity:
    nodeSelector:
      node.webgrip.io/pool: worker
  inheritedMetadata:
    annotations:
      reloader.stakater.com/auto: "true"
      policy.webgrip.io/allow-stateful-delete: "true"
  storage:
    size: 20Gi
    storageClass: longhorn
  walStorage:
    size: 5Gi
    storageClass: longhorn
  postgresql:
    parameters:
      # Tier 4 (no WAL archiving — nightly pg_dump instead; the graph rebuilds
      # from re-ingested SBOMs). Compress WAL + widen checkpoints to keep the
      # LOCAL WAL volume small. See docs/techdocs/docs/database-backup-tiers.md
      wal_compression: "zstd"
      max_wal_size: "2GB"
      checkpoint_timeout: "15min"
  bootstrap:
    initdb:
      database: guac
      owner: guac
      secret:
        name: guac-secrets
