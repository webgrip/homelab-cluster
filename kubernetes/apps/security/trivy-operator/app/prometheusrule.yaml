---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-trivy-rules
  labels:
    app.kubernetes.io/name: trivy-operator
    release: kube-prometheus-stack
spec:
  groups:
    - name: security.trivy
      rules:
        # AGGREGATED and downgraded to warning on 2026-08-05. This was `sum by (namespace,
        # resource_kind, resource_name) ... > 0` at severity critical, so it emitted ONE
        # CRITICAL PER WORKLOAD — 19 of them, firing continuously since 2026-08-03, out of
        # 26 total criticals.
        #
        # That is a backlog, not an incident. A published CVE in a base image is not
        # actionable at 3am; it is actionable when someone rebuilds the image. Paging 19
        # times for it, permanently, is what trained every critical to be ignorable — and
        # that is not hypothetical: cilium-agent crash-looped for 43 hours in August 2026,
        # CiliumAgentRestarting fired the whole time, and nobody saw it inside this noise.
        #
        # `SLO: Critical CVEs in Portfolio` (slo-security.yaml) already tracks the
        # aggregate trend, and the per-workload detail lives where detail belongs: the
        # VulnerabilityReport CRs and the security dashboards. This alert now says only
        # "how many workloads are affected", once.
        #
        # Deliberately a judgment call, and reversible: if you want per-workload paging
        # back, restore the `sum by (...)` grouping and severity critical.
        - alert: TrivyCriticalImageVulnerabilities
          expr: |
            count(
              sum by (namespace, resource_kind, resource_name) (
                trivy_image_vulnerabilities{severity="Critical"}
              ) > 0
            )
          for: 30m
          labels:
            severity: warning
            owner: platform
            service: trivy-operator
          annotations:
            summary: "{{$value}} workloads have critical image vulnerabilities"
            description: |
              What's happening:
              - {{$value}} workloads currently report at least one CRITICAL image CVE.

              Impact/risk:
              - Known-exploitable CVEs in running workloads increase compromise risk. This is a
                burn-down backlog, not a page: it should trend down, not clear instantly.

              Likely causes:
              - Outdated base images or dependencies with published critical CVEs.

              First actions:
              - Open the security dashboard for the per-workload breakdown (this alert is
                deliberately aggregated so it stays one line).
              - Rebuild the worst offenders from a patched base, re-pin the digest, confirm clearance.
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/security-supply-chain/#trivy-operator"

        - alert: TrivyHighImageVulnerabilityBacklog
          expr: |
            sum(trivy_image_vulnerabilities{severity=~"Critical|High"}) > 20
          for: 2h
          labels:
            severity: warning
            owner: platform
            service: trivy-operator
          annotations:
            summary: "High vulnerability backlog is growing (cluster-wide)"
            description: |
              What's happening:
              - More than 20 high/critical image vulnerability findings exist cluster-wide for 2h.

              Impact/risk:
              - A growing backlog erodes supply-chain posture and slows incident response.

              Likely causes:
              - Accumulated unpatched images, or a base-image CVE affecting many workloads.

              First actions:
              - Triage findings, prioritizing internet-facing and privileged workloads.
              - Rebuild/patch the worst offenders; track the backlog trending back down.
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/security-supply-chain/#trivy-operator"

        - alert: TrivyExposedSecretsDetected
          # The cloudnative-pg/postgresql image carries exactly ONE known-benign finding:
          # Trivy's `private-key` rule matching /etc/ssl/private/ssl-cert-snakeoil.key —
          # the Debian placeholder self-signed key present in every Debian-based image.
          # It is not a credential. It fired 3 permanent CRITICALs (grafana-db-1,
          # guac-db-1, guac-db-backup) continuously from 2026-08-02, adding to a wall of
          # 26 firing criticals that made the real signals unreadable — the 43-hour CNI
          # outage went unnoticed inside exactly that noise.
          #
          # Waived by COUNT, not by exclusion: that image is still monitored, and a
          # SECOND finding in it pages normally. A blanket
          # `image_repository!="cloudnative-pg/postgresql"` would have silently accepted
          # every future secret baked into our database image, which is precisely the
          # thing this alert exists to catch.
          #
          # The scanner itself is left ON (operator.exposedSecretScannerEnabled) so the
          # finding stays visible in reports and dashboards; only the page is suppressed.
          # Re-check the baseline if the CNPG image ever changes base distro.
          expr: |
            (
              sum by (namespace, resource_kind, resource_name) (
                trivy_image_exposedsecrets{severity=~"Critical|High|Medium", image_repository!="cloudnative-pg/postgresql"}
              ) > 0
            )
            or
            (
              sum by (namespace, resource_kind, resource_name) (
                trivy_image_exposedsecrets{severity=~"Critical|High|Medium", image_repository="cloudnative-pg/postgresql"}
              ) > 1
            )
          for: 15m
          labels:
            severity: critical
            owner: platform
            service: trivy-operator
          annotations:
            summary: "Potential exposed secret in image ({{$labels.namespace}}/{{$labels.resource_name}})"
            description: |
              What's happening:
              - Trivy detected a potential embedded secret in the image for {{$labels.namespace}}/{{$labels.resource_name}}.

              Impact/risk:
              - A baked-in credential is effectively published wherever the image is stored.

              Likely causes:
              - Secret committed into the build context or copied into an image layer.

              First actions:
              - Review the ExposedSecretReport CR; treat the credential as compromised.
              - Rotate the credential, rebuild without it, and re-pin the digest.
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/security-supply-chain/#trivy-operator"

        - alert: TrivyClusterComplianceFailures
          expr: |
            sum by (title) (
              trivy_cluster_compliance{status="Fail"}
            ) > 0
          for: 1h
          labels:
            severity: warning
            owner: platform
            service: trivy-operator
          annotations:
            summary: "Trivy compliance failures detected ({{$labels.title}})"
            description: |
              What's happening:
              - Trivy cluster compliance check "{{$labels.title}}" is failing for 1h.

              Impact/risk:
              - The cluster deviates from the named compliance baseline (e.g. CIS/NSA).

              Likely causes:
              - New non-compliant workload, or a control regressed after a change.

              First actions:
              - Review the ClusterComplianceReport detail rows for the failing control.
              - Remediate the offending resources before promoting audit policies to enforce.
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/security-supply-chain/#trivy-operator"
