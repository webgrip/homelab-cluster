---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wireguard-peers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wireguard-peers
rules:
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    resourceNames:
      - "wireguard-peers"
    verbs:
      - "get"
      - "patch"
      - "update"
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wireguard-peers
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: wireguard-peers}
subjects:
  - {kind: ServiceAccount, name: wireguard-peers, namespace: security}
