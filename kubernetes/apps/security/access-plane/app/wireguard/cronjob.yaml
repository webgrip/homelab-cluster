---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wireguard-peers
spec:
  schedule: "*/15 * * * *"
  startingDeadlineSeconds: 900
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wireguard-peers
        spec:
          serviceAccountName: wireguard-peers
          restartPolicy: Never
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: reconcile
              image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              imagePullPolicy: IfNotPresent
              command:
                - "bash"
                - "/scripts/reconcile.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: OPNSENSE_URL, value: "https://10.0.0.1"}
                - {name: OPNSENSE_PINNED_PUBKEY, value: "sha256//LMrmJee2CB2P5Ivd7M6Y5w3S+fMK31MPDC2/yt4RhbY="}
                - {name: MODEL_PEOPLE, value: /model/people.yaml}
                - {name: PEER_CONFIGMAP, value: wireguard-peers}
                - {name: WG_ENDPOINT, value: "vpn.webgrip.dev:51820"}
                - {name: WG_PEER_DNS, value: "10.0.0.1"}
                - {name: WG_ALLOWED_IPS, value: "10.0.0.0/24"}
                - name: NAMESPACE
                  valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
              envFrom:
                - secretRef: {name: opnsense-wireguard-api}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: model, mountPath: /model, readOnly: true}
          volumes:
            - name: tmp
              emptyDir: {}
            - name: scripts
              configMap: {name: wireguard-peers-reconciler}
            - name: model
              configMap: {name: access-plane-model}
