---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./rbac.yaml
  - ./cronjob.yaml
configMapGenerator:
  - name: wireguard-peers-reconciler
    files:
      - reconcile.sh
    options:
      labels:
        app.kubernetes.io/name: wireguard-peers
generatorOptions:
  disableNameSuffixHash: true
