---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsense-wireguard-api
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "An OPNsense API key and secret for the WireGuard reconciler (OPNsense, System, Access, Users, the reconciler user, API keys), written with bao kv put -mount=secret opnsense/wireguard-reconciler."
    wellhead.dev/verify.format.key: "\\S{40,}"
    wellhead.dev/verify.format.secret: "\\S{40,}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: opnsense-wireguard-api
    creationPolicy: Owner
  data:
    - secretKey: OPNSENSE_API_KEY
      remoteRef: {key: opnsense/wireguard-reconciler, property: key}
    - secretKey: OPNSENSE_API_SECRET
      remoteRef: {key: opnsense/wireguard-reconciler, property: secret}
