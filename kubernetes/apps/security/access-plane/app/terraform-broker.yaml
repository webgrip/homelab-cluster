---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: access-broker
  labels:
    app.kubernetes.io/name: access-plane
    app.kubernetes.io/component: broker
spec:
  interval: 15m
  retryInterval: 2m
  path: ./kubernetes/apps/security/access-plane/tofu/broker
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  serviceAccountName: access-plane-runner
  approvePlan: auto
  storeReadablePlan: human
  alwaysCleanupRunnerPod: true
  vars:
    - name: adopt_existing
      value: "true"
    - name: google_login
      value: "false"
  varsFrom:
    - kind: Secret
      name: cluster-secrets
      varsKeys:
        - SECRET_DOMAIN
  runnerPodTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: access-plane
    spec:
      nodeSelector:
        node.webgrip.io/pool: worker
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
