username\":=\"system:anonymous\" AND \"annotations.authorization.k8s.io/decision\":=\"allow\" | fields _time, verb, requestURI"}],"options": {"showTime": true,"showLabels": false,"wrapLogMessage": true,"enableLogDetails": true,"dedupStrategy": "none","sortOrder": "Descending"}},{"id": 16,"type": "row","title": "Machines","gridPos": {"h": 1,"w": 24,"x": 0,"y": 42},"collapsed": false},{"id": 17,"type": "table","title": "Calls by service account","gridPos": {"h": 8,"w": 24,"x": 0,"y": 43},"datasource": {"type": "victoriametrics-logs-datasource","uid": "victorialogs-audit"},"targets": [{"refId": "A","queryType": "stats","expr": "filter user.username:~\"^system:serviceaccount:\" | stats by (user.username) count() as calls | sort by (calls) desc | limit 30"}],"options": {"sortBy": [{"displayName": "calls","desc": true}]}}],"links": [{"title": "Runbook: Kubernetes login","type": "link","url": "https://backstage.$${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/kubernetes-login/","targetBlank": true}]}
