    {"schemaVersion": 39,"title": "Access / Kubernetes API audit","uid": "access-kubernetes-audit","timezone": "browser","tags": ["security","access-plane","audit"],"editable": false,"graphTooltip": 1,"refresh": "1m","time": {"from": "now-24h","to": "now"},"templating": {"list": []},"panels": [{"id": 1,"type": "row","title": "People","gridPos": {"h": 1,"w": 24,"x": 0,"y": 0},"collapsed": false},{"id": 2,"type": "stat","title": "Human principals seen","gridPos": {"h": 4,"w": 6,"x": 0,"y": 1},"datasource": {"type": "victoriametrics-logs-datasource","uid": "victorialogs-audit"},"targets": [{"refId": "A","queryType": "stats","expr": "filter NOT user.username:~\"^system:\" | stats count_uniq(user.username) as principals"}],"options": {"reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"colorMode": "background"}},{"id": 3,"type": "stat","title": "Human calls","gridPos": {"h": 4,"w": 6,"x": 6,"y": 1},"datasource": {"type": "victoriametrics-logs-datasource","uid": "victorialogs-audit"},"targets": [{"refId": "A","queryType": "stats","expr": "filter NOT user.username:~\"^system:\" | stats count() as calls"}],"options": {"reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"colorMode": "background"}},{"id": 4,"type": "stat","title": "Admin certificate calls","gridPos": {"h": 4,"w": 6,"x": 12,"y": 1},"datasource": {"type": "victoriametrics-logs-datasource","uid": "victorialogs-audit"},"targets": [{"refId": "A","queryType": "stats","expr": "filter user.username:=\"admin\" | stats count() as calls"}],"options": {"reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"colorMode": "background"}},{"id": 5,"type": "stat","title": "Impersonated calls","gridPos": {"h": 4,"w": 6,"x": 18,"y": 1},"datasource": {"type": "victoriametrics-logs-datasource","uid": "victorialogs-audit"},"targets": [{"refId": "A","queryType": "stats","expr": "filter impersonatedUser.username:* | stats count() as calls"}],"options": {"reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"colorMode": "background"}},{"id": 6,"type": "table","title": "Calls by person","gridPos": {"h": 8,"w": 12,"x": 0,"y": 5},"datasource": {"type": "victoriametrics-logs-datasource","uid": "victorialogs-audit"},"targets": [{"refId": "A","queryType": "stats","expr": "filter NOT user.username:~\"^system:\" | stats by (user.username) count() as calls | sort by (calls) desc"}],"options": {"sortBy": [{"displayName": "calls","desc": true}]}},{"id": 7,"type": "table","title": "Writes by person, verb and resource","gridPos": {"h": 8,"w": 12,"x": 12,"y": 5},"datasource": {"type": "victoriametrics-logs-datasource","uid": "victorialogs-audit"},"targets": [{"refId": "A","queryType": "stats","expr": "filter NOT user.username:~\"^system:\" AND verb:~\"^(create|update|patch|delete|deletecollection)$$\" | stats by (user.username, verb, objectRef.resource) count() as calls | sort by (calls) desc"}],"options": {"sortBy": [{"displayName": "calls","desc": true}]}},{"id": 8,"type": "row","title": "Break-glass","gridPos": {"h": 1,"w": 24,"x": 0,"y": 13},"collapsed": false},{"id": 9,"type": "table","title": "Admin certificate by source and client","gridPos": {"h": 8,"w": 12,"x": 0,"y": 14},"datasource": {"type": "victoriametrics-logs-datasource","uid": "victorialogs-audit"},"targets": [{"refId": "A","queryType": "stats","expr": "filter user.username:=\"admin\" | stats by (sourceIPs, userAgent) count() as calls | sort by (calls) desc"}],"options": {"sortBy": [{"displayName": "calls","desc": true}]}},{"id": 10,"type": "logs","title": "Admin certificate calls","gridPos": {"h": 9,"w": 12,"x": 12,"y": 14},"datasource": {"type": "victoriametrics-logs-datasource","uid": "victorialogs-audit"},"targets": [{"refId": "A","queryType": "instant","expr": "user.username:=\"admin\" | fields _time, verb, objectRef.resource, objectRef.namespace, objectRef.name, sourceIPs, userAgent"}],"options": {"showTime": true,"showLabels": false,"wrapLogMessage": true,"