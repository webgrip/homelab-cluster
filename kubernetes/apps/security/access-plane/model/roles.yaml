---
# yaml-language-server: $schema=schema/roles.schema.json
apiVersion: access.webgrip.io/v1alpha1
kind: RoleCatalogue
roles:
  platform-engineer:
    summary: Operates the cluster itself; the platform is the product
    owner: ryan@webgrip.nl
    grants:
      - capability: k8s-operate
        scope: project
      - capability: secrets-admin
      - capability: registry-admin
      - capability: repo-admin
      - capability: grafana-admin
      - capability: dashboards-view
      - capability: storage-admin
      - capability: litellm-admin
      - capability: vloer-admin
      - capability: tasks-use
      - capability: catalog-use
      - capability: staging-sites-use
  developer:
    summary: Builds and ships code into the namespaces their projects own
    owner: ryan@webgrip.nl
    grants:
      - capability: k8s-read
        scope: project
      - capability: registry-push
        scope: project
      - capability: repo-contribute
      - capability: grafana-edit
      - capability: tasks-use
      - capability: catalog-use
      - capability: llm-use
  client:
    summary: A customer, seeing the previews of their own project and nothing else
    owner: ryan@webgrip.nl
    grants:
      - capability: previews-use
        scope: project
  agent:
    summary: Software acting on a named human's behalf, with that human's rights and none of its own
    owner: ryan@webgrip.nl
    human: false
    grants:
      - capability: act-as-human
        scope: cluster
  service:
    summary: A non-human principal that acts as itself; inventoried, never granted a human capability
    owner: ryan@webgrip.nl
    human: false
    grants: []
