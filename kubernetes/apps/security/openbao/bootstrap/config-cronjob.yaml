---
# Auto-config: reconciles policies, k8s auth roles, identity, and OIDC idempotently as the
# scoped config-admin role (k8s auth, NOT root). Self-heals drift. No human steps, no root.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-config
spec:
  schedule: "2-59/5 * * * *"
  # Bound the miss-count window: without it, >100 missed starts (e.g. behind a wedged Forbid job) halt scheduling forever.
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Typical run is ~2m30s; a job that outlives this is wedged and would block Forbid
      # scheduling indefinitely (happened 2026-08-06→27: one dead job froze the schedule 21d).
      activeDeadlineSeconds: 600
      # GC finished Jobs so a terminal-but-unGC'd failure can't linger as "active".
      ttlSecondsAfterFinished: 21600
      template:
        spec:
          serviceAccountName: openbao-config
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
          containers:
            - name: config
              image: docker.io/openbao/openbao:2.6.3@sha256:a60afafda36337abe833c4a63894bf1095098f29abea4091e7e555a33dd52889
              command:
                - "/bin/sh"
                - "/scripts/config.sh"
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                - configMapRef:
                    name: openbao-domain
                    optional: true
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: tmp, mountPath: /tmp}
                # vault_admin password for the freshrss-db database-engine connection (ADR-0016).
                # config-admin can't read KV, so config.sh reads it from this mounted file.
                - {name: db-admin-freshrss, mountPath: /db-admin/freshrss, readOnly: true}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              # Matches its sibling openbao-init exactly. Measured 2026-09-04 over
              # 24h: peak 1.9Mi / 18m CPU, so this is deliberate headroom, not a
              # sizing estimate. Absent values tripped workload-resources-audit on
              # every 5-minute run — 2 warning events/run, the loudest source of
              # event noise in the cluster.
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
          volumes:
            - name: scripts
              configMap: {name: openbao-bootstrap}
            - name: tmp
              emptyDir: {}
            # optional:true so the job doesn't crashloop before ESO materialises the Secret.
            - name: db-admin-freshrss
              secret:
                secretName: freshrss-vault-admin
                optional: true
