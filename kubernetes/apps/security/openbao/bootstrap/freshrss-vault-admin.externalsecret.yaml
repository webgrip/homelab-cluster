---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freshrss-vault-admin
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0" # generate once, never rotate (CNPG owns the value ongoing)
  target:
    name: freshrss-vault-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: "vault_admin"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
