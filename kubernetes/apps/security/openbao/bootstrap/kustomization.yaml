---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - init-cronjob.yaml
  - config-cronjob.yaml
  - snapshot-cronjob.yaml
  - restore-drill-cronjob.yaml
  - eso-grants-job.yaml
  # Dynamic Postgres credentials (ADR-0016): generate the freshrss-db vault_admin password
  # once, seed it into OpenBao KV, and mount it into the config job (see config-cronjob.yaml).
  - freshrss-vault-admin.externalsecret.yaml
  - freshrss-vault-admin.pushsecret.yaml
  - unfold-hcloud-luks.externalsecret.yaml
  - unfold-hcloud-luks.pushsecret.yaml
configMapGenerator:
  - name: openbao-bootstrap
    options:
      disableNameSuffixHash: true
    files:
      - init.sh
      - store.sh
      - config.sh
      - eso-grants.sh
      - snapshot.sh
      - upload.sh
      - restore-drill-fetch.sh
      - restore-drill.sh
      - restore-drill-record.sh
      - admins.hcl
      - snapshot.hcl
      - config-admin.hcl
      - cosign-signer.hcl
      - cosign-pub-reader.hcl
      - access-plane.hcl
      - ci-unfold.hcl
      - ci-twente-dev.hcl
      - ci-cloudflare.hcl
      - ci-unfold-cluster.hcl
      - ci-unfold-cluster-etcd-check.hcl
      - unfold-main-reader.hcl
      - unfold-main-service-account.pem
      - forgejo-repo-config.hcl
      - github-config-ploeg-hq.hcl
      - github-config-webgrip.hcl
      - github-secrets-bridge.hcl
      - github-mirrors.hcl
      - renovate-github-app-token-ploeg-hq.hcl
      - renovate-github-app-token-wellhead-dev.hcl
      - homelab-etcd-age-keygen.hcl
  - name: openbao-eso-grants
    files:
      - eso-grants.txt
