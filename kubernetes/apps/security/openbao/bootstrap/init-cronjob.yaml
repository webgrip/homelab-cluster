---
# Auto-init: initialises OpenBao on a fresh/wiped instance, does the one-time root-only
# setup, REVOKES root, and stores only the unseal key as the openbao-keys Secret.
# Idempotent (no-op once initialised), so it self-heals and re-bootstraps on recreation.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-init
spec:
  schedule: "*/5 * * * *"
  # Bound the miss-count window: without it, >100 missed starts (e.g. behind a wedged Forbid job) halt scheduling forever.
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # 1, not 3: with the 6h TTL below, extra failed-job history only feeds stale
  # KubeContainerWaiting/KubeJobFailed alerts (jobs created before the TTL change
  # never expire on their own — the controller prunes them via this limit).
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # Typical run is ~1m; a longer-lived job is wedged and would block Forbid scheduling.
      activeDeadlineSeconds: 600
      # GC finished Jobs (incl. failures) after 6h — day-old failed pods otherwise
      # linger until 3 NEW failures rotate them out, tripping health checks.
      ttlSecondsAfterFinished: 21600
      template:
        spec:
          serviceAccountName: openbao-bootstrap
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
          initContainers:
            - name: init
              image: docker.io/openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
              command:
                - "/bin/sh"
                - "/scripts/init.sh"
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: shared, mountPath: /shared}
                - {name: tmp, mountPath: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              # Idempotent no-op on an initialised instance finishes in seconds;
              # a real (re)init is API calls, not compute.
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
          containers:
            - name: store
              # alpine/k8s has kubectl AND a shell (registry.k8s.io/kubectl is distroless).
              image: docker.io/alpine/k8s:1.36.4@sha256:358ddfc2d6ff3f00dd461dbd79aaa6d6738709f225b8da0945bb63bd4dbc304e
              command:
                - "/bin/sh"
                - "/scripts/store.sh"
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: shared, mountPath: /shared}
                - {name: tmp, mountPath: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              # kubectl apply of one small Secret.
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
          volumes:
            - name: scripts
              configMap: {name: openbao-bootstrap}
            - name: shared
              emptyDir: {}
            - name: tmp
              emptyDir: {}
