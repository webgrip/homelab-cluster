---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  namespace: security
---
# Nightly raft snapshot -> Garage (S3). bao auths via k8s auth (snapshot policy); the
# uploader uses the existing cnpg-backup-s3 Garage credentials. DR for full storage loss.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
spec:
  schedule: "0 3 * * *"
  # Bound the miss-count window: without it, >100 missed starts (e.g. behind a wedged Forbid job) halt scheduling forever.
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Typical run is ~3m40s; a longer-lived job is wedged and would block Forbid scheduling.
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: openbao-snapshot
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: snapshot
              image: docker.io/openbao/openbao:2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
              command:
                - "/bin/sh"
                - "/scripts/snapshot.sh"
              env:
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: shared, mountPath: /shared}
                - {name: tmp, mountPath: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          containers:
            - name: upload
              image: docker.io/amazon/aws-cli:2.36.34@sha256:cf1f5e5741c33f3fee383296ba8045b96b9eb93c3de017be6688fb00356352d7
              command:
                - "/bin/sh"
                - "/scripts/upload.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: cnpg-backup-s3, key: S3_ACCESS_KEY_ID}}}
                - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: cnpg-backup-s3, key: S3_SECRET_ACCESS_KEY}}}
                - {name: AWS_DEFAULT_REGION, valueFrom: {secretKeyRef: {name: cnpg-backup-s3, key: S3_REGION}}}
                - {name: S3_ENDPOINT, valueFrom: {secretKeyRef: {name: cnpg-backup-s3, key: S3_ENDPOINT}}}
                - {name: S3_BUCKET, valueFrom: {secretKeyRef: {name: cnpg-backup-s3, key: S3_BUCKET}}}
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: shared, mountPath: /shared}
                - {name: tmp, mountPath: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          volumes:
            - {name: scripts, configMap: {name: openbao-bootstrap}}
            - {name: shared, emptyDir: {}}
            - {name: tmp, emptyDir: {}}
