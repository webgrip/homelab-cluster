---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  namespace: security
---
# Nightly raft snapshot -> Garage (S3). bao auths via k8s auth (snapshot policy); the
# uploader uses the existing cnpg-backup-s3 Garage credentials. DR for full storage loss.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: openbao-snapshot
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: snapshot
              image: docker.io/openbao/openbao:2.6.1@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
              command:
                - "/bin/sh"
                - "/scripts/snapshot.sh"
              env:
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: shared, mountPath: /shared}
                - {name: tmp, mountPath: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          containers:
            - name: upload
              image: docker.io/amazon/aws-cli:2.36.25@sha256:d5b61bcb558149739b6d17410bdff21ec66518f3c921f0b8fc8ffa725f3f1b00
              command:
                - "/bin/sh"
                - "/scripts/upload.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: cnpg-backup-s3, key: S3_ACCESS_KEY_ID}}}
                - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: cnpg-backup-s3, key: S3_SECRET_ACCESS_KEY}}}
                - {name: AWS_DEFAULT_REGION, valueFrom: {secretKeyRef: {name: cnpg-backup-s3, key: S3_REGION}}}
                - {name: S3_ENDPOINT, valueFrom: {secretKeyRef: {name: cnpg-backup-s3, key: S3_ENDPOINT}}}
                - {name: S3_BUCKET, valueFrom: {secretKeyRef: {name: cnpg-backup-s3, key: S3_BUCKET}}}
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: shared, mountPath: /shared}
                - {name: tmp, mountPath: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          volumes:
            - {name: scripts, configMap: {name: openbao-bootstrap}}
            - {name: shared, emptyDir: {}}
            - {name: tmp, emptyDir: {}}
