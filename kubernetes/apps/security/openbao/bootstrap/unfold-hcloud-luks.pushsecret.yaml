---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-hcloud-luks
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: unfold-hcloud-luks
  data:
    - match: {secretKey: encryption-passphrase, remoteRef: {remoteKey: unfold-main/hcloud-luks, property: encryption-passphrase}}
