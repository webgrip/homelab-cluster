---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  interval: 1h
  # OpenBao boots SEALED, so its pods stay 0/1 Ready until a human runs the unseal
  # ceremony. disableWait lets Flux mark the release Ready on apply instead of
  # blocking on pod readiness (which would never come pre-unseal).
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: openbao
      version: 0.28.3
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: security
  values:
    injector:
      enabled: false # ESO reads via the API; no agent-injector needed
    ui:
      enabled: true
    server:
      logLevel: info
      # Pin off the soyos onto the worker pool (ADR-0002). STS = clean ordered
      # move; lands on fringe (WFFC-era longhorn-general volume predates worker-1).
      # gitops-critical soyo replica dropped 2026-06-21 (ADR-0008); DR = nightly
      # raft snapshot to external Garage S3.
      nodeSelector:
        node.webgrip.io/pool: worker
      dataStorage:
        enabled: true
        size: 3Gi
        storageClass: longhorn-general
        accessMode: ReadWriteOnce
      ha:
        enabled: true
        replicas: 1 # single-node raft for the homelab (scale to 3 later)
        # NO PodDisruptionBudget while replicas is 1. The chart's PDB is
        # UNSATISFIABLE at this size, not merely strict — templates/_helpers.tpl
        # hardcodes it:
        #
        #   {{- define "openbao.pdb.maxUnavailable" -}}
        #   {{- if eq (int .Values.server.ha.replicas) 1 -}}
        #   {{ 0 }}
        #   {{- else if .Values.server.ha.disruptionBudget.maxUnavailable -}}
        #
        # so at one replica maxUnavailable is unconditionally 0 and the
        # disruptionBudget.maxUnavailable override is never even consulted (it
        # sits in the else-if). Verified by rendering the chart: setting the
        # override at replicas=1 still emits maxUnavailable: 0.
        #
        # The effect is a PDB that can never allow an eviction, so whichever
        # node openbao lands on can never be gracefully drained and every Talos
        # upgrade or node maintenance there blocks forever. Found 2026-08-13
        # trying to drain worker-2 for the kata schematic upgrade.
        #
        # A PDB over a single replica protects nothing — there is no availability
        # to preserve, so its only behaviour is to block drains. Node maintenance
        # already implies an openbao outage; the PDB was preventing the DRAIN,
        # never the DOWNTIME. Recovery is already automatic and exercised on
        # every node reboot: the raft PVC re-attaches and openbao-unsealer
        # re-unseals within ~15s.
        #
        # WHEN SCALING TO 3 (the "scale to 3 later" above): re-enable this and
        # set maxUnavailable: 1 — at replicas != 1 the override IS honoured
        # (verified: renders maxUnavailable: 1) and it correctly protects raft
        # quorum by allowing only one peer down at a time. Note that scaling
        # also needs retry_join stanzas in the raft config below (there are
        # none, so extra peers would not form a cluster) and a rework of
        # openbao-unsealer, which targets openbao-0 by hardcoded address.
        disruptionBudget:
          enabled: false
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true
            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }
            storage "raft" {
              path = "/openbao/data"
            }
            service_registration "kubernetes" {}
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
