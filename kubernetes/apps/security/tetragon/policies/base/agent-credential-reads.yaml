---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: agent-credential-reads
spec:
  kprobes:
    - call: security_file_open
      syscall: false
      return: false
      message: "Credential or process environment file opened in an agent pod"
      tags:
        - runtime-detection
        - credential-access
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/run/secrets/kubernetes.io/serviceaccount
                - /run/secrets/kubernetes.io/serviceaccount
                - /var/run/secrets/tokens
                - /etc/shadow
        - matchArgs:
            - index: 0
              operator: Postfix
              values:
                - /environ
                - /.git-credentials
                - /.netrc
                - /.docker/config.json
                - /.kube/config
                - /.ssh/id_rsa
                - /.ssh/id_ed25519
                - /.ssh/id_ecdsa
