---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-openbao
  namespace: ai
  labels:
    app.kubernetes.io/managed-by: eso-grants
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: ai
spec:
  provider:
    vault:
      server: http://openbao.security.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-read-ai
          serviceAccountRef:
            name: eso-openbao
            audiences:
            - openbao
