---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  # Added 2026-08-05 — this was the only HelmRelease in the tree failing the enforcing
  # flux-governance-enforce/require-helmrelease-remediation rule. Without it a failed
  # install or upgrade of the secret-delivery control plane just stays failed until a
  # human notices, which is the worst component to leave in that state.
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    installCRDs: true
    replicaCount: 1
    # Protect the secret-delivery control plane from OOM eviction order
    # (built-in class, always present so no admission-ordering risk).
    priorityClassName: system-cluster-critical
    webhook:
      replicaCount: 1
      priorityClassName: system-cluster-critical
    certController:
      replicaCount: 1
      priorityClassName: system-cluster-critical
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
