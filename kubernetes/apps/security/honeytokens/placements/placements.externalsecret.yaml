---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workspace-deploy-credentials
  namespace: unfold-workspaces
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: workspace-deploy-credentials
    creationPolicy: Owner
  data:
    - {secretKey: FORGEJO_ADMIN_TOKEN, remoteRef: {key: honeytokens/forgejo, property: workspace}}
    - {secretKey: LITELLM_ADMIN_KEY, remoteRef: {key: honeytokens/litellm-workspace, property: key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin-break-glass
  namespace: ploeg
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: forgejo-admin-break-glass
    creationPolicy: Owner
  data:
    - {secretKey: FORGEJO_ADMIN_TOKEN, remoteRef: {key: honeytokens/forgejo, property: escape}}
    - {secretKey: LITELLM_MASTER_KEY, remoteRef: {key: honeytokens/litellm-escape, property: key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: honeytoken-fingerprints
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: honeytoken-fingerprints
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HONEYTOKEN_LITELLM_SHA256_WORKSPACE: '{{ .workspace | sha256sum }}'
        HONEYTOKEN_LITELLM_SHA256_REPOSITORY: '{{ .repository | sha256sum }}'
        HONEYTOKEN_LITELLM_SHA256_ESCAPE: '{{ .escape | sha256sum }}'
  data:
    - {secretKey: workspace, remoteRef: {key: honeytokens/litellm-workspace, property: key}}
    - {secretKey: repository, remoteRef: {key: honeytokens/litellm-repository, property: key}}
    - {secretKey: escape, remoteRef: {key: honeytokens/litellm-escape, property: key}}
