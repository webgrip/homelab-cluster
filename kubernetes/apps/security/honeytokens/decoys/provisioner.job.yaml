---
apiVersion: batch/v1
kind: Job
metadata:
  name: honeytoken-provisioner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: honeytoken-provisioner
    cleanup.webgrip.io/retry-failed: "true"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: honeytoken-provisioner
    spec:
      serviceAccountName: honeytoken-provisioner
      restartPolicy: Never
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: provision
          image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - /scripts/provision.sh
          env:
            - {name: HOME, value: /tmp}
            - {name: FORGEJO_URL, value: "http://forgejo-http.forgejo.svc.cluster.local:3000"}
            - {name: NAMESPACE, value: forgejo}
            - {name: TOKEN_SECRET, value: honeytoken-forgejo}
            - {name: TOKEN_NAME, value: automation}
            - {name: EMAIL_DOMAIN, value: noreply.webgrip.dev}
            - {name: WORKSPACE_USER, value: deploy-automation}
            - {name: REPOSITORY_USER, value: backup-operator}
            - {name: ESCAPE_USER, value: breakglass-admin}
            - name: ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: forgejo-admin-secret, key: username}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: forgejo-admin-secret, key: password}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap:
            name: honeytoken-provisioner
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
