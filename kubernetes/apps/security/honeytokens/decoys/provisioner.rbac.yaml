---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: honeytoken-provisioner
  namespace: forgejo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: honeytoken-provisioner
  namespace: forgejo
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "honeytoken-forgejo"
    verbs:
      - "get"
      - "update"
      - "patch"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: honeytoken-provisioner
  namespace: forgejo
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: honeytoken-provisioner}
subjects:
  - {kind: ServiceAccount, name: honeytoken-provisioner, namespace: forgejo}
