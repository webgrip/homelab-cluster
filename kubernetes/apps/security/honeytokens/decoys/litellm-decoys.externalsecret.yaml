---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: honeytoken-litellm-workspace
  namespace: forgejo
spec:
  refreshInterval: "0"
  target:
    name: honeytoken-litellm-workspace
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        key: "sk-{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
