---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: honeytoken-forgejo
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: SecretStore, name: openbao-push}
  selector: {secret: {name: honeytoken-forgejo}}
  data:
    - match: {secretKey: workspace, remoteRef: {remoteKey: honeytokens/forgejo, property: workspace}}
    - match: {secretKey: repository, remoteRef: {remoteKey: honeytokens/forgejo, property: repository}}
    - match: {secretKey: escape, remoteRef: {remoteKey: honeytokens/forgejo, property: escape}}
