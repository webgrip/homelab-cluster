---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: honeytoken-litellm-workspace
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: honeytoken-litellm-workspace}}
  data:
    - match: {secretKey: key, remoteRef: {remoteKey: honeytokens/litellm-workspace, property: key}}
---
apiVersion: external-secrets.io/v1alpha1
