  data:
    - match: {secretKey: key, remoteRef: {remoteKey: honeytokens/litellm-repository, property: key}}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: honeytoken-litellm-escape
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
