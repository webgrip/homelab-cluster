---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-honeytoken-provisioner-apiserver
  namespace: forgejo
  labels:
    app.kubernetes.io/part-of: honeytokens
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: honeytoken-provisioner
  egress:
    - toEntities:
        - kube-apiserver
