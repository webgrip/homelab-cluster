---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-restore-test
spec:
  suspend: false
  schedule: "0 10 * * 5"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: restore-test
              env:
                - name: SOURCE_CLUSTER
                  value: dependency-track-db
                - name: RESTORE_CLUSTER
                  value: dependency-track-db-restore
                - name: EXPECTED_DATABASE
                  value: dependencytrack
                - name: EXPECTED_ROLE
                  value: dependencytrack
                - name: BARMAN_OBJECT_NAME
                  value: dependency-track-db-store
                - name: RESTORE_STORAGE_SIZE
                  value: 20Gi
