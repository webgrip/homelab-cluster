---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-secret
  namespace: security
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "A database login created by CloudNativePG at initdb and copied to OpenBao by its PushSecret; the database keeps the password, so restore the value from OpenBao's history rather than typing a new one. The app's secret.key encrypts stored data too."
    wellhead.dev/fields: "username password secret.key"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "none"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: dependency-track-secret, creationPolicy: Owner}
  dataFrom:
    - extract: {key: dependency-track/db}
