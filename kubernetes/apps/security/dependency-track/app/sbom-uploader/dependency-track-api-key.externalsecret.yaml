---
# dependency-track-api-key now sourced from OpenBao. Replaces secret.sops.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-api-key
  namespace: security
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Dependency-Track API key of the team the SBOM uploader acts as: Dependency-Track, Administration, Access Management, Teams, the team, API Keys. Seeded once from SOPS."
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.api-key: "odt_\\S+|\\S{32}"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: dependency-track-api-key, creationPolicy: Owner}
  data:
    - secretKey: api-key
      remoteRef: {key: dependency-track/api-key, property: api-key}
