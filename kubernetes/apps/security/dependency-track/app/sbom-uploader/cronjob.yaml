---
# Runs every Sunday at 02:00 UTC — scans all running cluster images with
# Trivy and uploads CycloneDX SBOMs to Dependency Track for CVE correlation.
#
# PREREQUISITE: Create an API key in the Dependency Track UI:
#   Settings → Access Management → Teams → Automation → [+] Generate API Key
# Then store it in a SOPS-encrypted secret:
#   kubernetes/apps/security/dependency-track/app/sbom-uploader/secret.sops.yaml
# Template (encrypt with SOPS before committing):
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: dependency-track-api-key
#     namespace: security
#   type: Opaque
#   stringData:
#     api-key: "<paste API key here>"
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-sbom-uploader
  namespace: security
spec:
  schedule: "10 2 * * 0"
  # Bound the miss-count window: without it, >100 missed starts (e.g. behind a wedged Forbid job) halt scheduling forever.
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 14400 # 4h max
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: trivy-sbom-uploader
          restartPolicy: Never
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: false
          initContainers:
            - name: get-images
              image: docker.io/alpine/k8s:1.36.4@sha256:358ddfc2d6ff3f00dd461dbd79aaa6d6738709f225b8da0945bb63bd4dbc304e
              command:
                - "/bin/sh"
                - "/scripts/get-images.sh"
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
          containers:
            - name: upload
              image: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
              command:
                - "/bin/sh"
                - "/scripts/upload.sh"
              env:
                - name: DT_URL
                  value: "http://dependency-track-api-server.security.svc.cluster.local:8080"
                - name: DT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: dependency-track-api-key
                      key: api-key
                - name: TRIVY_CACHE_DIR
                  value: /tmp/trivy-cache
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                - name: trivy-cache
                  mountPath: /tmp/trivy-cache
          volumes:
            - name: work
              emptyDir: {}
            - name: scripts
              configMap:
                name: trivy-sbom-uploader-scripts
                defaultMode: 0755
            - name: trivy-cache
              emptyDir:
                sizeLimit: 8Gi
