---
apiVersion: v1
kind: Pod
metadata:
  name: isolated-worker-pod
  namespace: ploeg
spec:
  automountServiceAccountToken: false
  containers:
    - name: worker
      image: ghcr.io/acme/app:1.0.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - "ALL"
