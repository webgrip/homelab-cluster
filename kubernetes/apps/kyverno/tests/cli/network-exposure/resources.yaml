---
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    kubernetes.io/metadata.name: app
---
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
  labels:
    kubernetes.io/metadata.name: minecraft
---
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    kubernetes.io/metadata.name: default
---
apiVersion: v1
kind: Service
metadata:
  name: nodeport-service
  namespace: app
spec:
  type: NodePort
  selector:
    app: demo
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: external-ips-service
  namespace: app
spec:
  externalIPs:
    - 10.0.0.10
  selector:
    app: demo
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: forbidden-lb-service
  namespace: app
  annotations:
    lbipam.cilium.io/ips: "10.0.0.55"
spec:
  type: LoadBalancer
  selector:
    app: demo
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: missing-ip-lb-service
  namespace: minecraft
  annotations:
    lbipam.cilium.io/ips: ""
spec:
  type: LoadBalancer
  selector:
    app: demo
  ports:
    - port: 25565
      targetPort: 25565
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-listener-route
  namespace: app
spec:
  hostnames:
    - app.__SECRET_DOMAIN__
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  rules:
    - backendRefs:
        - name: app
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-route
  namespace: app
spec:
  hostnames:
    - app.__SECRET_DOMAIN__
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: app
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bad-hostname-route
  namespace: default
spec:
  hostnames:
    - bad.example.net
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: app
          port: 80
---
# MUST PASS. Added 2026-08-05 — the suite was fail-only, so a policy that rejected every
# Service and every HTTPRoute would have looked identical to a working one.
apiVersion: v1
kind: Service
metadata:
  name: compliant-clusterip
  namespace: app
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: compliant-route
  namespace: app
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - "app.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: app
          port: 8080
---
apiVersion: v1
kind: Namespace
metadata:
  name: network
  labels:
    kubernetes.io/metadata.name: network
---
# externalIPs: [] — MUST FAIL. The global anchor keys on presence, not content, so an
# empty list is a violation just like a populated one. A translation reading "absent or
# empty" passes this and looks correct everywhere else.
apiVersion: v1
kind: Service
metadata:
  name: external-ips-empty-service
  namespace: app
spec:
  type: ClusterIP
  externalIPs: []
  ports:
    - port: 80
---
# MUST PASS — a LoadBalancer in an approved namespace WITH the Cilium LB IPAM
# annotation. The counterpart to missing-ip-lb-service: without this pass case, a rule
# that rejected every LoadBalancer would look identical to one that works.
apiVersion: v1
kind: Service
metadata:
  name: compliant-lb-service
  namespace: network
  annotations:
    lbipam.cilium.io/ips: 10.0.0.77
spec:
  type: LoadBalancer
  ports:
    - port: 443
---
# The HTTP->HTTPS redirect route. MUST BE SKIPPED by network-httproute-exposure (it
# attaches to the http listener and has no hostname, so it would fail both of that
# policy's checks) and MUST PASS restrict-external-gateway-attachment, which has no
# exclude and which it satisfies because `network` is an approved namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: network
spec:
  parentRefs:
    - name: envoy-internal
      sectionName: http
---
# MUST FAIL audit-cross-namespace-backends — a backendRef pointing at a Service in
# another namespace, which needs a ReferenceGrant and explicit review.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cross-namespace-route
  namespace: app
spec:
  hostnames:
    - crossns.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      sectionName: https
  rules:
    - backendRefs:
        - name: some-service
          namespace: default
          port: 80
