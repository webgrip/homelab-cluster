---
# MUST PASS — the three approved classes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: approved-general
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-general
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: approved-single
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: approved-longhorn
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# MUST FAIL — `longhorn-cold` is a real StorageClass in this cluster but is
# deliberately NOT on the allowlist (its diskSelector "cold" matches no disk, so
# a PVC on it would sit Pending forever). This is the case that proves the
# allowlist still rejects, i.e. that widening it for longhorn-single did not
# accidentally widen it to any `longhorn-*` name.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unapproved-cold
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-cold
  resources:
    requests:
      storage: 5Gi
---
# MUST FAIL — an arbitrary non-Longhorn class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unapproved-hostpath
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
# MUST FAIL — ReadWriteMany is denied outright, even on an approved class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwx-denied
  namespace: app
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-general
  resources:
    requests:
      storage: 5Gi
---
# ---------------------------------------------------------------------------
# CNPG Cluster cases (added 2026-08-04 with the audit-cnpg-backup-plugin
# replica precondition and the audit-cnpg-redundant-podmonitor rewrite).
# ---------------------------------------------------------------------------
# MUST PASS both CNPG rules — an ordinary primary: barman-cloud plugin declared,
# no per-cluster PodMonitor (the cnpg-monitoring component scrapes it).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: primary-compliant
  namespace: app
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  walStorage:
    size: 2Gi
    storageClass: longhorn
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: app-db-store
---
# MUST FAIL audit-cnpg-backup-plugin — a primary with no WAL archiving at all.
# This is the case the rule exists for; it must survive the replica precondition.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: primary-no-backup
  namespace: app
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  walStorage:
    size: 2Gi
    storageClass: longhorn
---
# MUST PASS audit-cnpg-backup-plugin — a designated REPLICA (the DR-drill shape).
# It has no spec.plugins on purpose: a replica replays the source's WAL rather than
# archiving its own, and pointing barman-cloud at the source's path from here would
# write into the backups the drill exists to verify. Before the precondition this
# resource failed, and "fixing" it would have been actively harmful.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: replica-dr
  namespace: app
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  walStorage:
    size: 2Gi
    storageClass: longhorn
  bootstrap:
    recovery:
      source: dr-source
  replica:
    enabled: true
    source: dr-source
  externalClusters:
    - name: dr-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: app-db-store
          serverName: app-db
---
# MUST FAIL audit-cnpg-redundant-podmonitor — the cnpg-monitoring component already
# scrapes every CNPG pod cluster-wide, so enablePodMonitor duplicates every series.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: duplicate-podmonitor
  namespace: app
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  walStorage:
    size: 2Gi
    storageClass: longhorn
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: app-db-store
---
# ADDED 2026-08-11 with the CEL split. Four of the nine rules had NO fixture at all
# before this — require-cnpg-longhorn-storage, require-scheduledbackup-owner,
# audit-pvc-size-cap and audit-cnpg-walstorage were entirely untested, and the
# file-level coverage gate could not see that because the file was "covered".
#
# MUST FAIL the size cap. approved-single sits at exactly 100Gi and must keep
# passing — the legacy operator was GreaterThan, not GreaterThanOrEqual, and CEL's
# quantity comparison has to reproduce the boundary rather than approximate it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oversized-pvc
  namespace: app
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
---
# MUST FAIL audit-cnpg-walstorage — compliant in every other respect, so a failure
# here can only come from the missing walStorage volume.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: no-walstorage
  namespace: app
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: app-db-store
---
# MUST FAIL require-cnpg-longhorn-storage.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wrong-storageclass-cluster
  namespace: app
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: local-path
  walStorage:
    size: 2Gi
    storageClass: longhorn
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: app-db-store
---
# MUST PASS require-scheduledbackup-owner — the shape every ScheduledBackup in this
# cluster actually uses.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: good-scheduledbackup
  namespace: app
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: app-db
---
# MUST FAIL require-scheduledbackup-owner — no backupOwnerReference and the
# volumeSnapshot method rather than plugin.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bad-scheduledbackup
  namespace: app
spec:
  schedule: "0 0 2 * * *"
  method: volumeSnapshot
  cluster:
    name: app-db
