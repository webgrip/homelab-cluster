---
# Coverage for storage-cnpg-governance (Enforce). Added alongside the
# `longhorn-single` allowlist widening on 2026-07-31 — the policy previously had
# no CLI test at all, so the allowlist could have been widened to anything
# without CI noticing.
#
# Deliberately asserts BOTH directions: the three approved classes pass, and an
# unapproved-but-plausible class (longhorn-cold) still fails. A failure-only test
# cannot tell a working allowlist from a policy that rejects everything.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: storage-governance
policies:
  - ../../policies/storage-cnpg-governance.yaml
resources:
  - resources.yaml
results:
  # --- approved classes admit ---
  - policy: storage-cnpg-governance
    rule: require-approved-pvc-storageclass
    resources:
      - app/approved-general
      - app/approved-single
      - app/approved-longhorn
    kind: PersistentVolumeClaim
    result: pass
  # --- everything else is still rejected ---
  - policy: storage-cnpg-governance
    rule: require-approved-pvc-storageclass
    resources:
      - app/unapproved-cold
      - app/unapproved-hostpath
    kind: PersistentVolumeClaim
    result: fail
  # --- RWX stays denied regardless of class ---
  - policy: storage-cnpg-governance
    rule: disallow-rwx-pvcs
    resources:
      - app/rwx-denied
    kind: PersistentVolumeClaim
    result: fail
  # --- CNPG backup plugin: primaries are checked, replicas are not ---
  # The replica case is the point. A designated replica must NOT carry
  # spec.plugins barman-cloud (it would archive into the source's backup path),
  # so the rule has to skip it rather than report it forever.
  - policy: storage-cnpg-governance
    rule: audit-cnpg-backup-plugin
    resources:
      - app/primary-no-backup
    kind: Cluster
    result: fail
  - policy: storage-cnpg-governance
    rule: audit-cnpg-backup-plugin
    resources:
      - app/primary-compliant
    kind: Cluster
    result: pass
  # `skip`, not `pass` — deliberately. The replica must be excluded by the
  # PRECONDITION, not merely happen to satisfy the check. Asserting `skip` fails
  # if someone removes the precondition and the rule starts evaluating replicas
  # again, which `pass` would not catch.
  - policy: storage-cnpg-governance
    rule: audit-cnpg-backup-plugin
    resources:
      - app/replica-dr
    kind: Cluster
    result: skip
  # --- redundant per-cluster PodMonitor is rejected, absence is fine ---
  - policy: storage-cnpg-governance
    rule: audit-cnpg-redundant-podmonitor
    resources:
      - app/duplicate-podmonitor
    kind: Cluster
    result: fail
  - policy: storage-cnpg-governance
    rule: audit-cnpg-redundant-podmonitor
    resources:
      - app/primary-compliant
      - app/replica-dr
      - app/primary-no-backup
    kind: Cluster
    result: pass
