---
apiVersion: v1
kind: Pod
metadata:
  name: unfold-smoke-test
  namespace: ploeg
  labels:
    app.kubernetes.io/component: test
    app.kubernetes.io/instance: unfold
    app.kubernetes.io/name: unfold-smoke-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: harbor.example.com/ghcr/unfold-hq/unfold:1.0.0@sha256:1111111111111111111111111111111111111111111111111111111111111111
      command:
        - node
        - --version
