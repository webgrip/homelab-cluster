---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: image-supply-chain-enforce
policies:
  - ../../policies/image-supply-chain-enforce.yaml
resources:
  - resources.yaml
results:
  # --- fail cases: the policy must CATCH each violation shape -------------------
  - policy: image-supply-chain-enforce
    rule: disallow-latest-tag-even-with-digest
    resources:
      - app/latest-digest
    kind: Pod
    result: fail
  - policy: image-supply-chain-enforce
    rule: require-fully-qualified-images
    resources:
      - app/implicit-dockerhub-namespace
      - app/bare-library-image
      - app/unqualified-init-container
    kind: Pod
    result: fail
  # --- pass cases: the policy must ADMIT compliant resources --------------------
  # A failure-only suite cannot distinguish a working policy from one that denies
  # everything, so an enforcing policy is only proven by both directions.
  - policy: image-supply-chain-enforce
    rule: disallow-latest-tag-even-with-digest
    resources:
      - app/fully-qualified-versioned
      - app/localhost-registry-with-port
      - app/implicit-dockerhub-namespace
      - app/bare-library-image
    kind: Pod
    result: pass
  - policy: image-supply-chain-enforce
    rule: require-fully-qualified-images
    resources:
      - app/fully-qualified-versioned
      - app/localhost-registry-with-port
      - app/latest-digest
    kind: Pod
    result: pass
  # --- wave 11: require-image-digest -----------------------------------------
  - policy: image-supply-chain-enforce
    rule: require-image-digest
    resources:
      - app/tag-without-digest
    kind: Pod
    result: fail
  - policy: image-supply-chain-enforce
    rule: require-image-digest
    resources:
      - app/fully-qualified-versioned
      - app/localhost-registry-with-port
      - app/latest-digest
    kind: Pod
    result: pass
