---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cert-manager-governance
policies:
  - ../../policies/cert-manager-governance.yaml
resources:
  - resources.yaml
results:
  - policy: cert-manager-governance
    resources:
      - app/wrong-issuer-cert
      - app/wrong-dns-cert
      - app/wrong-commonname-cert
      - app/selfsigned-public-domain-cert
      - app/internal-ca-public-commonname-cert
    kind: Certificate
    result: fail
  - policy: cert-manager-governance
    resources:
      - app/compliant-public-cert
    kind: Certificate
    result: pass
  - policy: cert-manager-governance
    resources:
      - cnpg-system/barman-cloud-client
      - security/internal-ca-webhook-cert
    kind: Certificate
    result: skip
  - policy: cert-manager-certificate-hygiene-audit
    resources:
      - app/compliant-public-cert
    kind: Certificate
    result: pass
  - policy: cert-manager-certificate-hygiene-audit
    resources:
      - cnpg-system/barman-cloud-client
      - security/internal-ca-webhook-cert
    kind: Certificate
    result: skip
  - policy: cert-manager-clusterissuer-zone
    resources:
      - wrong-zone
    kind: ClusterIssuer
    result: fail
  - policy: cert-manager-clusterissuer-zone
    resources:
      - correct-zone
    kind: ClusterIssuer
    result: pass
  - policy: cert-manager-clusterissuer-zone
    resources:
      - selfsigned-issuer
    kind: ClusterIssuer
    result: skip
