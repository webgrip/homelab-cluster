---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cert-manager-governance
policies:
  - ../../policies/cert-manager-governance.yaml
resources:
  - resources.yaml
results:
  - policy: cert-manager-governance
    rule: restrict-certificate-issuer
    resources:
      - app/wrong-issuer-cert
    kind: Certificate
    result: fail
  - policy: cert-manager-governance
    rule: restrict-certificate-dnsnames
    resources:
      - app/wrong-dns-cert
    kind: Certificate
    result: fail
  - policy: cert-manager-governance
    rule: restrict-certificate-commonname
    resources:
      - app/wrong-commonname-cert
    kind: Certificate
    result: fail
  - policy: cert-manager-governance
    rule: restrict-clusterissuer-acme-zone
    resources:
      - wrong-zone
    kind: ClusterIssuer
    result: fail
  # PASS case — proves the rule admits a correctly-scoped ACME issuer rather than
  # rejecting every ClusterIssuer it sees.
  - policy: cert-manager-governance
    rule: restrict-clusterissuer-acme-zone
    resources:
      - correct-zone
    kind: ClusterIssuer
    result: pass
  # SKIP, not pass — the precondition must exclude non-ACME issuers. Asserting `skip`
  # fails if someone removes the precondition; `pass` would not catch it.
  - policy: cert-manager-governance
    rule: restrict-clusterissuer-acme-zone
    resources:
      - selfsigned-issuer
    kind: ClusterIssuer
    result: skip
