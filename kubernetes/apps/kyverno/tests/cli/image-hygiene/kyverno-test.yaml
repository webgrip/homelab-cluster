---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: image-hygiene
policies:
  - ../../policies/image-hygiene-audit.yaml
resources:
  - resources.yaml
results:
  # --- fail cases ---------------------------------------------------------------
  - policy: image-hygiene-audit
    rule: require-image-tag
    resources:
      - app/untagged-image
      - app/untagged-init-container
    kind: Pod
    result: fail
  - policy: image-hygiene-audit
    rule: validate-image-tag
    resources:
      - app/mutable-latest
    kind: Pod
    result: fail
  # --- pass cases ---------------------------------------------------------------
  # An enforcing policy has to be proven in both directions: a failure-only suite
  # cannot tell a working policy from one that rejects everything.
  - policy: image-hygiene-audit
    rule: require-image-tag
    resources:
      - app/versioned-tag
      - app/digest-only
      - app/latest-with-digest
      - app/mutable-latest
    kind: Pod
    result: pass
  - policy: image-hygiene-audit
    rule: validate-image-tag
    resources:
      - app/versioned-tag
      - app/digest-only
      - app/latest-with-digest
      - app/untagged-image
    kind: Pod
    result: pass
