---
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
policies:
  - name: image-verify-harbor-enforce
    rules:
      - name: require-webgrip-signature
        values:
          cosignpub:
            data:
              cosign.pub: |
                -----BEGIN PUBLIC KEY-----
                MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                -----END PUBLIC KEY-----
  - name: image-verify-harbor-audit
    rules:
      - name: verify-webgrip-harbor-images
        values:
          cosignpub:
            data:
              cosign.pub: |-
                -----BEGIN PUBLIC KEY-----
                MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                -----END PUBLIC KEY-----
