---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workload-hygiene
policies:
  - ../../policies/image-supply-chain-audit.yaml
  - ../../policies/require-probes-audit.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  # require-image-digest was asserted here until 2026-08-05. It moved to
  # image-supply-chain-enforce in wave 11, so this assertion named a rule the policy no
  # longer has — and the CLI scores that as Pass/Excluded, i.e. green while proving
  # nothing. Real coverage (fail AND pass) lives in tests/cli/image-supply-chain-enforce;
  # removed rather than repointed because this test does not load that policy.
  # disallow-latest-tag-even-with-digest moved to image-supply-chain-enforce in wave 4;
  # its coverage lives in tests/cli/image-supply-chain-enforce.
  # No `rule:` field -- image-supply-chain-audit is a CEL ValidatingPolicy as of
  # 2026-08-05 and CEL policies have no named rules. Asserting the old
  # `require-approved-registries` name here would silently score as Pass/Excluded.
  - policy: image-supply-chain-audit
    resources:
      - app/unapproved-registry
    kind: Pod
    result: fail
  # PASS case, new: proves the policy still admits a Harbor-hosted image rather than
  # rejecting every Pod. The migration was verified by differential sweep (both dialects
  # report the same 41 failing resources), and this keeps that honest going forward.
  - policy: image-supply-chain-audit
    resources:
      - app/harbor-approved
    kind: Pod
    result: pass
  # CONTROLLER COVERAGE, asserted because it was silently lost once. The policy declared
  # `spec.autogen.podControllers`, Kyverno ignored it, and this file's all-Pod fixtures
  # could not tell: the Deployment below produced no result row at all, which is
  # indistinguishable from a clean pass. Controller kinds are now listed explicitly in
  # matchConstraints, and these two assertions are what keep them there.
  - policy: image-supply-chain-audit
    resources:
      - app/unapproved-registry-deployment
    kind: Deployment
    result: fail
  - policy: image-supply-chain-audit
    resources:
      - app/harbor-approved-statefulset
    kind: StatefulSet
    result: pass
  - policy: require-pod-probes-audit
    rule: validate-probes
    resources:
      - app/missing-probes
    kind: Pod
    result: fail
  # Pass case for the now-ENFORCING probe rule (wave 1).
  - policy: require-pod-probes-audit
    rule: validate-probes
    resources:
      - app/has-readiness-probe
    kind: Pod
    result: pass
