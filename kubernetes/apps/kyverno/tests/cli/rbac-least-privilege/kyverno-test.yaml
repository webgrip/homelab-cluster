---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rbac-least-privilege
policies:
  - ../../policies/rbac-least-privilege-audit.yaml
  - ../../policies/rbac-least-privilege-enforce.yaml
resources:
  - resources.yaml
results:
  - policy: rbac-least-privilege-audit
    rule: disallow-wildcards-in-app-roles
    resources:
      - app/wildcard-reader
      - app/wildcard-in-second-rule
    kind: Role
    result: fail
  # The pass case that exposes a rule which denies everything.
  - policy: rbac-least-privilege-audit
    rule: disallow-wildcards-in-app-roles
    resources:
      - app/specific-reader
      - app/specific-with-resourcenames
    kind: Role
    result: pass
  - policy: rbac-least-privilege-enforce
    rule: disallow-default-serviceaccount-rolebindings
    resources:
      - app/default-sa-binding
    kind: RoleBinding
    result: fail
  - policy: rbac-least-privilege-enforce
    rule: disallow-cluster-admin-rolebindings
    resources:
      - app/cluster-admin-binding
    kind: RoleBinding
    result: fail
  - policy: rbac-least-privilege-enforce
    rule: disallow-default-serviceaccount-clusterbindings
    resources:
      - default-sa-clusterbinding
    kind: ClusterRoleBinding
    result: fail
  - policy: rbac-least-privilege-enforce
    rule: disallow-cluster-admin-clusterbindings
    resources:
      - app-builder-cluster-admin
    kind: ClusterRoleBinding
    result: fail
  # --- pass cases for the enforcing policy -------------------------------------
  - policy: rbac-least-privilege-enforce
    rule: disallow-default-serviceaccount-rolebindings
    resources:
      - app/named-sa-binding
      - app/cluster-admin-binding
    kind: RoleBinding
    result: pass
  - policy: rbac-least-privilege-enforce
    rule: disallow-cluster-admin-rolebindings
    resources:
      - app/named-sa-binding
      - app/default-sa-binding
    kind: RoleBinding
    result: pass
  - policy: rbac-least-privilege-enforce
    rule: disallow-default-serviceaccount-clusterbindings
    resources:
      - named-sa-clusterbinding
      - app-builder-cluster-admin
    kind: ClusterRoleBinding
    result: pass
  - policy: rbac-least-privilege-enforce
    rule: disallow-cluster-admin-clusterbindings
    resources:
      - named-sa-clusterbinding
      - default-sa-clusterbinding
    kind: ClusterRoleBinding
    result: pass
