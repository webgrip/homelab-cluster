---
# Restructured for the CEL migration (2026-08-09). CEL ValidatingPolicies have no named
# rules, so results carry `policy` but no `rule`, and every assertion is ONE VERDICT PER
# RESOURCE. A leftover `rule:` would not fail loudly — it scores Pass/Excluded, green
# while asserting nothing.
#
# The collapse is visible here: `app/cluster-admin-binding` used to be recorded twice —
# fail on disallow-cluster-admin-rolebindings, pass on
# disallow-default-serviceaccount-rolebindings. At policy level it is a single FAIL,
# because any failing validation fails the policy. Same for `app/default-sa-binding`,
# `default-sa-clusterbinding` and `app-builder-cluster-admin`. Per-rule attribution is no
# longer expressible; the differential over all 374 live RBAC objects is what establishes
# the two dialects agree (227-resource intersection, zero disagreements).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rbac-least-privilege
policies:
  - ../../policies/rbac-least-privilege-enforce.yaml
resources:
  - resources.yaml
results:
  # --- fail cases -----------------------------------------------------------------
  - policy: rbac-least-privilege-enforce
    resources:
      - app/wildcard-reader
      - app/wildcard-in-second-rule
    kind: Role
    result: fail
  - policy: rbac-least-privilege-enforce
    resources:
      - app/default-sa-binding
      - app/cluster-admin-binding
    kind: RoleBinding
    result: fail
  - policy: rbac-least-privilege-enforce
    resources:
      - default-sa-clusterbinding
      - app-builder-cluster-admin
    kind: ClusterRoleBinding
    result: fail
  # --- pass cases -----------------------------------------------------------------
  # These are not decoration. The original wildcards rule used `operator: AnyIn` with
  # `value: ["*"]`, which Kyverno treats as a GLOB — it denied EVERY Role in the cluster
  # and read as "0 fails" because no PolicyReport covered Role at the time. A policy that
  # rejects everything satisfies a fail-case-only gate perfectly.
  - policy: rbac-least-privilege-enforce
    resources:
      - app/specific-reader
      - app/specific-with-resourcenames
    kind: Role
    result: pass
  - policy: rbac-least-privilege-enforce
    resources:
      - app/named-sa-binding
    kind: RoleBinding
    result: pass
  - policy: rbac-least-privilege-enforce
    resources:
      - named-sa-clusterbinding
      - no-subjects-clusterbinding
    kind: ClusterRoleBinding
    result: pass
