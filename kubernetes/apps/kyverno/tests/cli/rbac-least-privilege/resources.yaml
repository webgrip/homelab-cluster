---
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    kubernetes.io/metadata.name: app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-builder
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wildcard-reader
  namespace: app
rules:
  - apiGroups:
      - ""
    resources:
      - "*"
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-sa-binding
  namespace: app
subjects:
  - kind: ServiceAccount
    name: default
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wildcard-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-admin-binding
  namespace: app
subjects:
  - kind: ServiceAccount
    name: app-builder
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: default-sa-clusterbinding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-builder-cluster-admin
subjects:
  - kind: ServiceAccount
    name: app-builder
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
# PASS: binds a NAMED ServiceAccount (not `default`) to a non-cluster-admin Role.
# Required so the enforcing policy is proven to ADMIT compliant RBAC, not just to
# reject bad RBAC — a failure-only suite cannot tell those two apart.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: named-sa-binding
  namespace: app
subjects:
  - kind: ServiceAccount
    name: app-builder
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wildcard-reader
---
# PASS: cluster-scoped binding for a NAMED ServiceAccount onto a read-only ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: named-sa-clusterbinding
subjects:
  - kind: ServiceAccount
    name: app-builder
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
# PASS disallow-wildcards-in-app-roles. This case is the whole point: the rule previously
# used `operator: AnyIn` with `value: ["*"]`, and Kyverno treats `*` on the value side as a
# GLOB, so it denied every Role ever written. A fail-only suite could not see that — this
# ordinary, fully-specific Role is what makes the difference visible.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: specific-reader
  namespace: app
rules:
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    verbs:
      - "get"
      - "watch"
---
# PASS: the CNPG-operator shape — specific verbs plus resourceNames. 55 live Roles look
# like this and every one of them was being flagged.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: specific-with-resourcenames
  namespace: app
rules:
  - apiGroups:
      - "postgresql.cnpg.io"
    resourceNames:
      - "demo-db"
    resources:
      - "clusters"
    verbs:
      - "get"
      - "list"
      - "watch"
---
# FAIL: wildcard only in the SECOND rule — proves the foreach walks every entry rather
# than short-circuiting on the first.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wildcard-in-second-rule
  namespace: app
rules:
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    verbs:
      - "get"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "*"
