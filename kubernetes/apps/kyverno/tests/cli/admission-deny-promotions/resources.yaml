---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: exec-role
rules:
  - apiGroups:
      - ""
    resources:
      - "pods/exec"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portforward-role
  namespace: app
rules:
  - apiGroups:
      - ""
    resources:
      - "pods/portforward"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-reader
rules:
  - apiGroups:
      - ""
    resources:
      - "pods"
      - "pods/log"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnative-pg
rules:
  - apiGroups:
      - ""
    resources:
      - "pods"
      - "pods/exec"
    verbs:
      - "create"
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-lister
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: everything-reader
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: custom-resources-reader
rules:
  - apiGroups:
      - "cert-manager.io"
      - "kustomize.toolkit.fluxcd.io"
    resources:
      - "*"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-getter
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-controller
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
---
apiVersion: v1
kind: Pod
metadata:
  name: runtime-default-pod
  namespace: app
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: harbor.example.com/x@sha256:1111111111111111111111111111111111111111111111111111111111111111
---
apiVersion: v1
kind: Pod
metadata:
  name: localhost-container-pod
  namespace: app
spec:
  containers:
    - name: app
      image: harbor.example.com/x@sha256:1111111111111111111111111111111111111111111111111111111111111111
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/app.json
---
apiVersion: v1
kind: Pod
metadata:
  name: unconfined-container-pod
  namespace: app
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: harbor.example.com/x@sha256:1111111111111111111111111111111111111111111111111111111111111111
      securityContext:
        seccompProfile:
          type: Unconfined
---
apiVersion: v1
kind: Pod
metadata:
  name: no-profile-pod
  namespace: app
spec:
  containers:
    - name: app
      image: harbor.example.com/x@sha256:1111111111111111111111111111111111111111111111111111111111111111
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-unconfined-pod
  namespace: app
spec:
  securityContext:
    seccompProfile:
      type: Unconfined
  containers:
    - name: app
      image: harbor.example.com/x@sha256:1111111111111111111111111111111111111111111111111111111111111111
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: forgejo-unconfined-pod
  namespace: forgejo
spec:
  securityContext:
    seccompProfile:
      type: Unconfined
  containers:
    - name: app
      image: harbor.example.com/x@sha256:1111111111111111111111111111111111111111111111111111111111111111
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: app
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: other
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  namespace: observability
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator
  namespace: app
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: kube-system
automountServiceAccountToken: true
---
apiVersion: v1
kind: Pod
metadata:
  name: default-sa-token-pod
  namespace: other
spec:
  automountServiceAccountToken: true
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: harbor.example.com/x@sha256:1111111111111111111111111111111111111111111111111111111111111111
---
apiVersion: v1
kind: Pod
metadata:
  name: own-sa-token-pod
  namespace: other
spec:
  serviceAccountName: operator
  automountServiceAccountToken: true
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: harbor.example.com/x@sha256:1111111111111111111111111111111111111111111111111111111111111111
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: null-rules-role
  namespace: app
rules: null
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: null-rules-clusterrole
rules: null
