---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-rbac-secret-read-cel
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      Waives restrict-secret-read-verbs for the operator ClusterRoles reviewed on
      2026-10-18 whose job is to watch Secrets across namespaces (ADR-0074): Alloy
      (secret-backed discovery), cert-manager (certificate and issuer Secrets), Cilium
      operator, CloudNativePG and its barman plugin, Flux (source credentials and the
      Flux Operator's unbound web UI roles), Envoy Gateway (TLS), External Secrets,
      grafana-operator, KEDA (trigger auth), kube-state-metrics (Secret metadata
      metrics), Longhorn (backup targets), Reloader, renovate-operator, tofu-controller
      and the VictoriaMetrics operator. Exact names, ClusterRole-only; a new operator
      needs a reviewed addition here.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: restrict-secret-read-verbs
  matchConditions:
    - name: reviewed-secret-watching-operators
      expression: >-
        object.kind == 'ClusterRole' &&
        object.metadata.name in [
        'alloy-agent', 'alloy-gateway',
        'cert-manager-cainjector', 'cert-manager-controller-certificates',
        'cert-manager-controller-challenges', 'cert-manager-controller-clusterissuers',
        'cert-manager-controller-issuers', 'cert-manager-controller-orders',
        'cilium-operator',
        'cloudnative-pg', 'plugin-barman-cloud',
        'crd-controller-flux-system', 'flux-web-admin', 'flux-web-user',
        'envoy-gateway-gateway-helm-envoy-gateway-role',
        'external-secrets-cert-controller', 'external-secrets-controller',
        'grafana-operator',
        'keda-operator',
        'kube-state-metrics',
        'longhorn-role',
        'reloader-role',
        'renovate-operator',
        'tf-runner-role', 'tofu-cluster-reconciler-role', 'tofu-manager-role',
        'vm-operator-victoria-metrics-operator']
