---
# CEL-dialect waivers for the secrets-observability-ops-audit split (2026-08-11).
#
# Only two of that policy's five rules were ever waived, and both waivers cross the
# migration boundary:
#   exception-envoy-gateway-controller  configmap-keys + ha-pdb + topology-spread
#   exception-prometheus-rulefiles      configmap-keys
#
# ha-pdb is NOT migrated (it uses a `context`/`apiCall` that has no verified CEL
# equivalent yet — Phase 1F), so exception-envoy-gateway.yaml KEEPS its legacy entry for
# that single rule while the other two move here. That is the one place in this migration
# where a single logical waiver is deliberately split across both dialects, and it stays
# that way until the apiCall spike lands.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-envoy-gateway-controller-cel
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      Envoy Gateway renders its own ConfigMaps and Deployments; the ConfigMaps carry
      key names that trip the secret-like-key heuristic, and the Deployments are
      scheduled by the gateway controller rather than by our topology rules. Waives
      secrets-configmap-keys-audit and workload-topology-spread-audit. The
      require-ha-pdb waiver stays in the legacy exception until that rule migrates.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: secrets-configmap-keys-audit
    - kind: ValidatingPolicy
      name: workload-topology-spread-audit
  matchConditions:
    # Legacy paired each kind with the same two names, so one expression covers both.
    # The kind test is kept rather than dropped: without it the waiver would also cover
    # any future envoy-external/envoy-internal object of another kind in that namespace.
    - name: envoy-gateway-rendered-objects
      expression: >-
        object.metadata.namespace == 'network' &&
        object.kind in ['ConfigMap', 'Deployment'] &&
        object.metadata.name in ['envoy-external', 'envoy-internal']
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-prometheus-rulefiles-cel
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      vmalert renders its rule files into generated ConfigMaps whose keys include
      recording/alerting rule names that match the secret-like-key heuristic. Waives
      secrets-configmap-keys-audit for those generated ConfigMaps only.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: secrets-configmap-keys-audit
  matchConditions:
    # Legacy used a `names:` glob, `vm-vmalert-rulefiles-*`. startsWith is the exact
    # equivalent and sidesteps the wildcard-in-names question that exception-governance
    # polices elsewhere.
    - name: vmalert-generated-rulefiles
      expression: >-
        object.kind == 'ConfigMap' &&
        object.metadata.namespace == 'observability' &&
        object.metadata.name.startsWith('vm-vmalert-rulefiles-')
