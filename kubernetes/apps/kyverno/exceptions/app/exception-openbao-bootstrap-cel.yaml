---
# The openbao-init bootstrap CronJob's entire purpose is a Kubernetes API write:
# it initialises a fresh/wiped OpenBao and stores the unseal key by
# kubectl-applying the openbao-keys Secret under the openbao-bootstrap
# ServiceAccount (kubernetes/apps/security/openbao/bootstrap/init-cronjob.yaml).
# workload-advanced-baseline-audit asks pods to set
# automountServiceAccountToken: false "unless they call the Kubernetes API" —
# this one does, so the flag every 5-minute run produced was pure event noise
# drowning real warnings.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-openbao-bootstrap-cel
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      openbao-init exists to write the openbao-keys Secret via the API, so its
      pods legitimately mount the openbao-bootstrap ServiceAccount token.
      Waives workload-advanced-baseline-audit for exactly that CronJob's
      workload chain in the security namespace.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: workload-advanced-baseline-audit
  matchConditions:
    - name: openbao-init-workloads
      expression: >-
        object.metadata.?namespace.orValue('') == 'security' &&
        object.kind in ['CronJob', 'Job', 'Pod'] &&
        (object.metadata.name == 'openbao-init' ||
        object.metadata.name.startsWith('openbao-init-'))
