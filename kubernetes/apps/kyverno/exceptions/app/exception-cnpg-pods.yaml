---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kyverno.io/policyexception_v2.json
# Exception for CNPG-managed Pod resources (cluster pods like *-db-1).
# These pods are created and managed by the CNPG operator — their securityContext
# and image selection cannot be overridden via Helm values.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: exception-cnpg-pods
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      CNPG-operator-managed PostgreSQL instance pods (e.g. freshrss-db-1) use
      the official CloudNative-PG image from ghcr.io. These pods are not pinned
      to image digests in their CRD spec and the operator sets resource requests
      internally. Tracking issue: when CNPG supports digest-pinned images via
      the Cluster spec, this exception should be removed.
spec:
  exceptions:
    - policyName: workload-hardening-audit
      ruleNames:
        - validate-resources
        - autogen-validate-resources
    - policyName: image-supply-chain-audit
      ruleNames:
        - require-image-digest
        - autogen-require-image-digest
  match:
    any:
      - resources:
          kinds:
            - Pod
          namespaces:
            - freshrss
          names:
            - freshrss-db-1
      - resources:
          kinds:
            - Pod
          namespaces:
            - n8n
          names:
            - n8n-db-1
      - resources:
          kinds:
            - Pod
          namespaces:
            - sparkyfitness
          names:
            - sparkyfitness-db-1
      - resources:
          kinds:
            - Pod
          namespaces:
            - backstage
          names:
            - backstage-db-1
      - resources:
          kinds:
            - Pod
          namespaces:
            - authentik
          names:
            - authentik-db-1
      - resources:
          kinds:
            - Pod
          namespaces:
            - forgejo
          names:
            - forgejo-db-1
      - resources:
          kinds:
            - Pod
          namespaces:
            - harbor
          names:
            - harbor-db-1
      - resources:
          kinds:
            - Pod
          namespaces:
            - vikunja
          names:
            - vikunja-db-1
            - vikunja-db-2
      # Added 2026-08-04 for wave 11 (require-image-digest -> Enforce). These three were
      # missing from the list purely because they were created after it was last touched;
      # they are the same operator-managed shape as the nine above — CNPG sets
      # cloudnative-pg, postgresql and plugin-barman-cloud-sidecar images itself, by tag,
      # and the Cluster CRD offers no way to pin them by digest.
      - resources:
          kinds:
            - Pod
          namespaces:
            - ai
          names:
            - litellm-db-1
      - resources:
          kinds:
            - Pod
          namespaces:
            - ploeg
          names:
            - ploeg-db-1
            - ploeg-db-2
