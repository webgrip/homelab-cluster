---
# CEL-dialect twin of exception-flux-bootstrap-kustomization (2026-08-11).
#
# LANDED AHEAD OF THE FLIP, DELIBERATELY. Both dialects run side by side right now
# (flux-governance-cel.yaml stage 1), so this waiver is live against the CEL policy
# while that policy is still Audit — which is exactly the window in which a waiver
# can be proven without being able to break anything. The legacy exception stays in
# place until the legacy policy is deleted; they reference different policy kinds and
# do not overlap.
#
# It must land BEFORE the Deny flip rather than with it. kyverno/exceptions/ks.yaml
# depends on kyverno-policies, so a single commit doing both would reconcile the
# policy first and leave a window where flux-kustomization-source denies the
# flux-system Kustomization with no waiver in force. That is the GitOps deadlock
# recorded in that ks.yaml — the resource being rejected is the one that delivers the
# fix. Ordering the waiver first removes the window entirely.
#
# References ONLY flux-kustomization-source. That policy exists as a separate object
# precisely so this waiver cannot reach the four other Enforce rules: a CEL
# PolicyException has no ruleNames, so had the rules stayed merged, exempting the
# bootstrap Kustomization from the sourceRef check would also have exempted it from
# the prune requirement.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-flux-bootstrap-kustomization-cel
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      The flux-system/flux-system Kustomization is created by `flux bootstrap` and is
      not part of the in-repo app tree (no gotk-sync.yaml is committed), so its
      sourceRef omits the explicit namespace that flux-kustomization-source expects.
      It already reconciles from the flux-system GitRepository in the flux-system
      namespace (the implicit default) — this is the legitimately-special bootstrap
      root, not a tenant Kustomization. The in-repo cluster-apps Kustomization is
      fully compliant.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: flux-kustomization-source
  matchConditions:
    # No kind guard needed: the referenced policy matches kustomizations and nothing
    # else, so namespace/name alone cannot widen past the intended single object.
    - name: bootstrap-kustomization
      expression: >-
        object.metadata.namespace == 'flux-system' &&
        object.metadata.name == 'flux-system'
