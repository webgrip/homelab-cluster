---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kyverno.io/policyexception_v2.json
# guac-db is a DELIBERATE Tier-4 database: no barman WAL archiving, nightly pg_dump instead.
# This is a recorded design decision, not a gap — see docs/techdocs/docs/general/database-backup-tiers.md
# and the header of kubernetes/apps/security/guac/app/database/cluster.yaml.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: exception-guac-db-backup-tier
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      guac-db intentionally runs without the barman-cloud WAL archive plugin. WAL archiving
      was dropped because the SBOM ingest pipeline generated roughly 4 GiB of WAL per day
      for a graph that is fully rebuildable by re-ingesting the SBOMs it was built from —
      the cost was real and the recovery value was not. Its off-box backup path is the
      nightly guac-db-backup CronJob (pg_dump -> gzip -> Garage S3 under _db-backups/),
      which is the Tier-4 pattern in database-backup-tiers.md.

      Without this exception audit-cnpg-backup-plugin reports guac-db as a violation on
      every scan, which trains the reader to ignore the rule — the deferral is deliberate,
      so it is recorded here rather than left as permanent noise. Remove this exception if
      guac-db is ever promoted to a WAL-archiving tier.
spec:
  exceptions:
    - policyName: storage-cnpg-governance
      ruleNames:
        # Both rules follow from the same Tier-4 decision: no barman plugin, and
        # therefore no ScheduledBackup to schedule against it. audit-cnpg-scheduledbackup
        # uses an apiCall context, so it reports as `error` in an offline sweep and never
        # as `fail` — it would have gone on quietly flagging guac-db forever.
        - audit-cnpg-backup-plugin
        - audit-cnpg-scheduledbackup
  match:
    any:
      - resources:
          kinds:
            - Cluster
          namespaces:
            - security
          names:
            - guac-db
