---
# trivy-operator generates its scan Jobs itself and wires the registry
# credentials it needs (TRIVY_USERNAME/TRIVY_PASSWORD/TRIVY_TOKEN…) as
# env[].valueFrom.secretKeyRef — the exact shape disallow-secrets-from-env-vars
# flags. The template is upstream-generated and not ours to reshape (no chart
# knob for envFrom), and the secrets are the operator's own short-TTL scan
# secrets (scanSecretTTL 15m), not app credentials. Every scan of a private
# image warned twice (Job + Pod), which drowned the Warning event stream.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-trivy-scanjob-secrets-cel
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      trivy-operator's generated scan workloads mount their short-lived scan
      secrets as individual env vars by upstream design (no envFrom option).
      Waives disallow-secrets-from-env-vars for those generated Jobs/Pods only,
      matched by the operator's managed-by label and the scan-job name prefix.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-secrets-from-env-vars
  matchConditions:
    # scanJobsInSameNamespace is false, so every scan workload lands in the
    # operator's namespace. Label AND name-prefix must both hold — a workload
    # merely named scan-… without the operator label stays governed.
    - name: trivy-operator-scan-workloads
      expression: >-
        object.metadata.?namespace.orValue('') == 'security' &&
        object.kind in ['Job', 'Pod'] &&
        object.metadata.name.startsWith('scan-') &&
        has(object.metadata.labels) &&
        'app.kubernetes.io/managed-by' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'trivy-operator'
