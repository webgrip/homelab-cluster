---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-weave-gitops-local-admin-cel
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      The Weave GitOps chart binds its own local user wego-admin so its built-in
      login can read the cluster. That user is an application credential, not a
      person, and the access plane does not render it (ADR-0059). The route is
      gated by the broker at the gateway (ADR-0060), so the local login is only
      reachable by someone the broker already admitted. Waives the provenance
      rule for exactly the two bindings the chart creates in flux-system.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: rbac-human-bindings-audit
  matchConditions:
    - name: weave-gitops-chart-bindings
      expression: >-
        object.metadata.name in ['wego-admin-user-read-resources', 'wego-admin-user-read-resources-cr'] &&
        object.?subjects.orValue([]).all(s, s.kind == 'User' && s.name == 'wego-admin')
