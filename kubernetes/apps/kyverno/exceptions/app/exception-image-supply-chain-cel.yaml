---
# CEL-dialect waivers for the image-supply-chain-enforce split (2026-08-11).
#
# The cnpg-pods waiver is NOT here — it covers exactly the same Pods as its
# workload-resources twin, so it became an extra policyRef on
# exception-cnpg-pods-resources-cel rather than a duplicated pod list. Duplicating
# that list is precisely how the ploeg-db-2 / vikunja-db-2 divergence happened.
#
# base vs autogen IS THE WHOLE POINT HERE, and the two halves live in different
# objects with different scopes:
#   exception-third-party-images-pods-base   waived the BASE rule only
#                                            -> Pod, excalidraw, by label
#   exception-third-party-image-supply-chain waived AUTOGEN rules only
#                                            -> Deployment, 10 named workloads
# A CEL policy covers Pods and controllers under one matchConstraints, so each
# expression below carries an explicit object.kind test. Without it the excalidraw
# waiver would silently extend to its Deployment, and the ten Deployment waivers
# would extend to every Pod they own — including the digest and fully-qualified
# rules, which those Pods have never been waived from.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-third-party-images-pods-base-cel
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      The excalidraw image is published only under a floating tag. Waives
      image-supply-chain-no-latest for its PODS ONLY, matching the legacy
      base-rule-only waiver. The Deployment half is covered separately and does
      NOT include this rule at Pod level.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: image-supply-chain-no-latest
  matchConditions:
    - name: excalidraw-pods
      expression: >-
        object.kind == 'Pod' &&
        object.metadata.namespace == 'excalidraw' &&
        'app.kubernetes.io/name' in object.metadata.?labels.orValue({}) &&
        object.metadata.labels['app.kubernetes.io/name'] == 'excalidraw'
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-third-party-image-supply-chain-cel
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      Third-party Deployments whose upstream images are not digest-pinned, not
      fully qualified, or float on a tag. Waives all three image-supply-chain
      policies for the CONTROLLER only — the legacy entry waived autogen-* rules
      exclusively, so the Pods these own were never covered and still are not.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: image-supply-chain-digest-pinned
    - kind: ValidatingPolicy
      name: image-supply-chain-no-latest
    - kind: ValidatingPolicy
      name: image-supply-chain-fully-qualified
  matchConditions:
    # Every legacy entry was kind Deployment — no StatefulSets, despite the policy
    # autogenerating for them. The kind test preserves that and doubles as the
    # autogen-only guard.
    - name: third-party-deployments
      expression: >-
        object.kind == 'Deployment' &&
        (object.metadata.namespace + '/' + object.metadata.name) in [
          'ai/litellm',
          'ploeg/ploeg-work-items-exporter',
          'backstage/backstage',
          'drawio/drawio', 'drawio/drawio-plantuml-server',
          'excalidraw/excalidraw',
          'freshrss/freshrss',
          'invoiceninja/invoiceninja', 'invoiceninja/invoiceninja-mariadb',
          'minecraft/minecraft',
          'n8n/n8n',
          'sparkyfitness/sparkyfitness-frontend',
          'sparkyfitness/sparkyfitness-server']
