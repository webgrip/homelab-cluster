---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
spec:
  interval: 1h
  chart:
    spec:
      chart: policy-reporter
      version: 3.7.4
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: security
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: policy-reporter

    # Digest-pinned: the chart defaults to the bare appVersion tag, which
    # image-verify-audit flags on every reconcile (missing digest). Keep tag and
    # digest together so a Renovate chart bump that forgets this block fails
    # loudly in the policy report rather than silently drifting.
    image:
      registry: ghcr.io
      repository: kyverno/policy-reporter
      tag: 3.7.4@sha256:58de668b8ae427e661801a97447b5422abf433b763829d5a35ad480086396bb8

    # Off the soyo control-planes (2026-07-11 placement audit); reporting only,
    # not in the admission path, so worker-pinning has no recovery impact.
    nodeSelector:
      node.webgrip.io/pool: worker

    replicaCount: 2

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1234
      runAsGroup: 1234
      fsGroup: 1234
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    # Expose policyreport_result{namespace,policy,rule,kind,name,status,severity,category,source} metrics
    metrics:
      enabled: true
      mode: detailed

    # Wire ServiceMonitor into kube-prometheus-stack Prometheus
    monitoring:
      enabled: true
      serviceMonitor:
        labels:
          release: kube-prometheus-stack
        interval: 60s
        scrapeTimeout: 55s
        # Preserve namespace/name labels from the metric itself (not the scrape target)
        honorLabels: true

    # Exclude only core Kubernetes namespaces so security and application reports stay visible.
    reportFilter:
      namespaces:
        exclude:
          - flux-system
          - kube-system
          - kube-public
          - kube-node-lease

    leaderElection:
      enabled: true
