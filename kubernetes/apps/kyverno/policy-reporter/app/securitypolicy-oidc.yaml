---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: policy-reporter-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: policy-reporter
  oidc:
    provider:
      issuer: https://authentik.${SECRET_DOMAIN}/application/o/cluster-dashboards/
    clientIDRef:
      name: authentik-dashboards-oidc
    clientSecret:
      name: authentik-dashboards-oidc
    scopes:
      - openid
      - email
      - profile
      - offline_access
    redirectURL: https://policy-reporter.${SECRET_DOMAIN}/oauth2/callback
    logoutPath: /logout
    defaultTokenTTL: 12h
    defaultRefreshTokenTTL: 168h
    cookieConfig:
      sameSite: Lax
