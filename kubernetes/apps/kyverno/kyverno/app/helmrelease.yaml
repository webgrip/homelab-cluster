---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  chartRef:
    kind: OCIRepository
    name: kyverno
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    fullnameOverride: kyverno

    # Govern the `security` namespace like every other namespace.
    #
    # Kyverno is deployed INTO `security`, and the chart's default
    # excludeKyvernoNamespace=true does exactly two things with that fact:
    #   1. prepends [*/*,security,*] to resourceFilters
    #   2. adds `security` to the webhook namespaceSelector
    # Between them, NO policy of any kind applied to anything in that namespace
    # — openbao, dependency-track, trivy and all seven guac services were outside
    # pod-security, image verification and supply-chain enforcement entirely, and
    # it failed silently: no PolicyReport, no event, no admission decision.
    # Discovered 2026-08-01 while debugging why a mutate rule skipped OpenBao.
    #
    # Turning it off does NOT remove Kyverno's protection from itself. The ~70
    # fine-grained self-exclusions (Pod,security,kyverno-admission-controller-*
    # and friends) come from config.resourceFilters, which is a separate value
    # and is unaffected.
    #
    # Verified before enabling: every Enforce policy was dry-run against all 38
    # pods and 63 other resources in the namespace using the LIVE (envsubst'd)
    # policies — 152 + 148 pass, 0 fail. Nothing in `security` violates anything,
    # so this changes governance without changing admissibility.
    config:
      excludeKyvernoNamespace: false
      # Restated because excludeKyvernoNamespace=false means the chart uses this
      # verbatim — and the objectSelector is the part that matters.
      #
      # The resource webhooks are failurePolicy=Fail. Without an objectSelector,
      # dropping `security` from the namespaceSelector would mean that if every
      # admission-controller replica were down at once, the API server could not
      # reach the webhook and would refuse to admit the very pods needed to
      # recover — a self-inflicted deadlock in the one namespace that cannot
      # tolerate it. The resourceFilters above do not help there, because they
      # are evaluated by a Kyverno that is not running.
      #
      # Excluding Kyverno's own workloads by LABEL moves that decision into the
      # API server, where it holds whether or not Kyverno is up. The label
      # matches exactly Kyverno's 6 pods and nothing else cluster-wide.
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
        objectSelector:
          matchExpressions:
            - key: app.kubernetes.io/part-of
              operator: NotIn
              values:
                - kyverno

    global:
      priorityClassName: system-cluster-critical

    grafana:
      enabled: true

    features:
      admissionReports:
        enabled: true
      aggregateReports:
        enabled: true
      policyReports:
        enabled: true
      validatingAdmissionPolicyReports:
        enabled: true
      reporting:
        validate: true
        mutate: true
        mutateExisting: true
        imageVerify: true
        generate: true
      backgroundScan:
        enabled: true
        backgroundScanWorkers: 4
        # Daily instead of hourly: the hourly re-scan was re-emitting ~12k audit
        # PolicyViolation events/hour (events have a 1h TTL), inflating etcd and the
        # apiservers' watch caches (soyo apiserver was using 3.4Gi). Violations are
        # still recorded in PolicyReports; only the redundant event churn shrinks.
        backgroundScanInterval: 24h
        skipResourceFilters: false
      generateValidatingAdmissionPolicy:
        enabled: true
      policyExceptions:
        enabled: true
        namespace: security
      logging:
        format: json
        verbosity: 2

    admissionController:
      replicas: 3
      apiPriorityAndFairness: true
      # NOTE THE `container:` LEVEL — it is load-bearing and unique to this
      # controller. The admission controller's deployment template reads
      # `.Values.admissionController.container.resources`, while
      # background/cleanup/reports read `.Values.<controller>.resources`
      # directly. These values sat one level too high and were SILENTLY IGNORED:
      # the chart's own defaults (128Mi request / 384Mi limit) won instead, which
      # is exactly what the live deployment carried on 2026-08-02 while git
      # claimed 256Mi/512Mi.
      #
      # That was not cosmetic. With 22 ClusterPolicies the admission controller
      # sits at ~272Mi steady state, so a 384Mi ceiling leaves almost nothing for
      # the reload spike a policy change causes — two of the three pods were
      # OOMKilled (exit 137) on 2026-08-02, and while the webhook was down Flux
      # failed the forgejo Kustomization with
      # `failed calling webhook "validate.kyverno.svc-fail": ... EOF`. A webhook
      # that gates every admission in the cluster must not be the tightest
      # cgroup in it.
      #
      # Verify a change here actually took, rather than trusting the manifest:
      #   kubectl -n security get deploy kyverno-admission-controller \
      #     -o jsonpath='{.spec.template.spec.containers[0].resources}'
      #
      # If exit-137s recur, raise the limit rather than reverting — 512Mi is the
      # figure this repo had already chosen, now merely made effective, and it
      # has not yet been observed under a sustained policy-churn spike.
      container:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
      rbac:
        serviceAccount:
          automountServiceAccountToken: false
        clusterRole:
          extraResources:
            - apiGroups:
                - admissionregistration.k8s.io
              resources:
                - validatingadmissionpolicies
                - validatingadmissionpolicybindings
              verbs:
                - create
                - delete
                - get
                - list
                - patch
                - update
                - watch
      certManager:
        enabled: true
      podDisruptionBudget:
        enabled: true
        minAvailable: 2
        unhealthyPodEvictionPolicy: AlwaysAllow
      # Recovery-set placement made EXPLICIT: kyverno belongs on the soyos (ADR-0002;
      # the 2026-07-11 audit kept it there only passively, by worker-pinning everything
      # else). Left unconstrained, a restarted replica drifted onto fringe-workstation
      # (pool=worker) and its webhook calls timed out whenever that node thrashed —
      # 2026-07-17 this blocked the kyverno-policies Kustomization cluster-wide, since
      # the policy-validate webhook is svc-fail. With 3 soyos + the hostname spread
      # below this pins exactly one replica per soyo; during a single-soyo drain one
      # replica goes Pending, which the PDB (minAvailable 2) tolerates.
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.webgrip.io/pool
                  operator: In
                  values:
                    - soyo
      topologySpreadConstraints:
        # DoNotSchedule, not ScheduleAnyway: the svc-fail webhooks make co-located
        # replicas a cluster-wide Flux outage risk if that one node degrades
        # (2026-06-12: 2 of 3 replicas sat on soyo-1 through a starvation wave).
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: admission-controller
              app.kubernetes.io/instance: kyverno
      service:
        trafficDistribution: PreferClose
      metricsService:
        trafficDistribution: PreferClose
      serviceMonitor:
        enabled: true
        # Drop the per-rule policy-execution latency histogram (~10.5k series, unused here).
        metricRelabelings:
          - action: drop
            sourceLabels:
              - __name__
            regex: "kyverno_policy_execution_duration_seconds_bucket"
      tracing:
        enabled: true
        address: alloy-gateway.observability.svc.cluster.local
        port: 4317

    backgroundController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      rbac:
        serviceAccount:
          automountServiceAccountToken: false
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
        unhealthyPodEvictionPolicy: AlwaysAllow
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: background-controller
              app.kubernetes.io/instance: kyverno
      metricsService:
        trafficDistribution: PreferClose
      serviceMonitor:
        enabled: true
        # Drop the per-rule policy-execution latency histogram (~10.5k series, unused here).
        metricRelabelings:
          - action: drop
            sourceLabels:
              - __name__
            regex: "kyverno_policy_execution_duration_seconds_bucket"
      tracing:
        enabled: true
        address: alloy-gateway.observability.svc.cluster.local
        port: 4317

    cleanupController:
      # 2, not 1: the chart ships a PDB with minAvailable: 1, so a single
      # replica means ALLOWED DISRUPTIONS 0 — a permanent drain-blocker that
      # stalled the soyo-2 Talos upgrade on 2026-08-12 (every eviction of the
      # lone pod is refused until the drain times out). Two replicas make the
      # PDB satisfiable during node maintenance. ~64Mi extra request.
      replicas: 2
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
      rbac:
        serviceAccount:
          automountServiceAccountToken: false
        clusterRole:
          extraResources:
            - apiGroups:
                - ""
              resources:
                - "pods"
              verbs:
                - "get"
                - "list"
                - "watch"
                - "delete"
            - apiGroups:
                - "batch"
              resources:
                - "jobs"
              verbs:
                - "get"
                - "list"
                - "watch"
                - "delete"
      certManager:
        enabled: true
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
        unhealthyPodEvictionPolicy: AlwaysAllow
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: cleanup-controller
              app.kubernetes.io/instance: kyverno
      metricsService:
        trafficDistribution: PreferClose
      serviceMonitor:
        enabled: true
        # Drop the per-rule policy-execution latency histogram (~10.5k series, unused here).
        metricRelabelings:
          - action: drop
            sourceLabels:
              - __name__
            regex: "kyverno_policy_execution_duration_seconds_bucket"
      tracing:
        enabled: true
        address: alloy-gateway.observability.svc.cluster.local
        port: 4317

    reportsController:
      replicas: 1
      apiPriorityAndFairness: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      rbac:
        serviceAccount:
          automountServiceAccountToken: false
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
        unhealthyPodEvictionPolicy: AlwaysAllow
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: reports-controller
              app.kubernetes.io/instance: kyverno
      metricsService:
        trafficDistribution: PreferClose
      serviceMonitor:
        enabled: true
        # Drop the per-rule policy-execution latency histogram (~10.5k series, unused here).
        metricRelabelings:
          - action: drop
            sourceLabels:
              - __name__
            regex: "kyverno_policy_execution_duration_seconds_bucket"
      tracing:
        enabled: true
        address: alloy-gateway.observability.svc.cluster.local
        port: 4317
