---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: agent-plane-process-isolation
  annotations:
    policies.kyverno.io/title: Agent Plane — Process Isolation
    policies.kyverno.io/category: Pod Security, Agent Plane
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: 1.19.1
    policies.kyverno.io/description: >-
      Pods in the ploeg namespace may not share a process namespace or add
      SYS_PTRACE (or ALL). Ploeg ADR-0034 keeps a Run's credentials in the
      non-dumpable ploeg-worker process, which holds only while nothing in the
      pod can read another process's memory.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - ploeg
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "pods"
      - apiGroups:
          - "apps"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "deployments"
          - "statefulsets"
          - "daemonsets"
      - apiGroups:
          - "batch"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "jobs"
          - "cronjobs"
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec : (object.kind == 'CronJob' ?
        object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
    - name: allContainers
      expression: >-
        variables.podSpec.?containers.orValue([]) +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: "!variables.podSpec.?shareProcessNamespace.orValue(false)"
      message: >-
        shareProcessNamespace is disallowed in the agent plane: it lets one container
        read the ploeg-worker process that holds the Run's credentials (Ploeg ADR-0034).
    - expression: >-
        variables.allContainers.all(c,
          !c.?securityContext.?capabilities.?add.orValue([]).exists(cap,
            cap in ['SYS_PTRACE', 'CAP_SYS_PTRACE', 'ALL']))
      message: >-
        Adding SYS_PTRACE or ALL is disallowed in the agent plane: it lets the harness
        read the ploeg-worker process that holds the Run's credentials (Ploeg ADR-0034).
