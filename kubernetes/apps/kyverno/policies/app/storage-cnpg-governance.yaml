---
# REMNANT OF THE CEL SPLIT (2026-08-11). Eight of this policy's nine rules moved to
# storage-cnpg-governance-cel.yaml as three ValidatingPolicies. ONE rule stays here.
#
# audit-cnpg-scheduledbackup resolves a `context.apiCall` to count ScheduledBackups
# belonging to each Cluster, and CEL has no equivalent yet — that translation is the
# Phase 1F spike (rfc-kyverno-cel-migration.md), which covers the four apiCall rules
# across three policies together rather than inventing a one-off here.
#
# This file therefore still carries a `kyverno.io/v1` ClusterPolicy, which the v1.20
# removal will delete. It must not be forgotten because it looks migrated: the policy
# name is unchanged and most of its content is gone.
#
# The second document below, stateful-delete-protection-enforce, is untouched — it is
# DELETE-triggered and becomes a DeletingPolicy in Phase 1E.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: storage-cnpg-governance
  annotations:
    policies.kyverno.io/title: CNPG ScheduledBackup Presence (Audit)
    policies.kyverno.io/category: Storage, Database, Disaster Recovery
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Cluster
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Audit that each CNPG cluster has at least one ScheduledBackup. Sole surviving
      rule of the original policy; the rest migrated to CEL.
spec:
  # AUDIT AT SPEC LEVEL NOW, changed with the split. It read `Enforce` while every one
  # of the nine rules that needed enforcement carried it, and the sole survivor sets
  # `failureAction: Audit` on itself — rule-level wins, so the effective action never
  # changed here. What changed is that the declaration is no longer misleading, and a
  # rule added later without an explicit failureAction will now inherit Audit rather
  # than silently start denying CNPG Clusters.
  #
  # It also stops the coverage gate demanding a CLI test for an enforcing policy that
  # cannot have a meaningful one: this rule resolves a context apiCall, which errors
  # offline and reports `error` rather than `pass` or `fail`. A test would be green
  # while asserting nothing.
  validationFailureAction: Audit
  background: true
  rules:
    - name: audit-cnpg-scheduledbackup
      match:
        any:
          - resources:
              kinds:
                - Cluster
      # Replicas excluded (2026-08-04): a designated replica has nothing of its own to
      # back up. This rule uses an apiCall context, so it surfaces as `error` in an
      # offline sweep and never as `fail` — which is exactly how it hid five false
      # positives that the backup-plugin rule reported openly. Verified by direct
      # query: the only clusters without a ScheduledBackup are the five replicas and
      # guac-db (Tier 4, waived).
      preconditions:
        all:
          - key: "{{ request.object.spec.replica.enabled || `false` }}"
            operator: Equals
            value: false
      context:
        - name: scheduledbackups
          apiCall:
            urlPath: /apis/postgresql.cnpg.io/v1/namespaces/{{ request.object.metadata.namespace }}/scheduledbackups
            jmesPath: items[?spec.cluster.name == '{{ request.object.metadata.name }}'] | length(@)
      validate:
        failureAction: Audit
        message: "CNPG clusters should have at least one ScheduledBackup."
        deny:
          conditions:
            any:
              - key: "{{ scheduledbackups }}"
                operator: Equals
                value: 0
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: stateful-delete-protection-enforce
  annotations:
    policies.kyverno.io/title: Stateful Delete Protection Enforce
    policies.kyverno.io/category: Storage, Database, Disaster Recovery
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: PersistentVolumeClaim,Cluster
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Require an explicit break-glass annotation before deleting PVCs or CNPG
      clusters.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: protect-pvc-delete
      match:
        any:
          - resources:
              kinds:
                - PersistentVolumeClaim
              operations:
                - DELETE
      validate:
        message: "PVC deletion requires policy.webgrip.io/allow-stateful-delete=true."
        deny:
          conditions:
            any:
              - key: '{{ request.oldObject.metadata.annotations."policy.webgrip.io/allow-stateful-delete" || "false" }}'
                operator: NotEquals
                value: "true"
    - name: protect-cnpg-cluster-delete
      match:
        any:
          - resources:
              kinds:
                - Cluster
              operations:
                - DELETE
      validate:
        message: "CNPG Cluster deletion requires policy.webgrip.io/allow-stateful-delete=true."
        deny:
          conditions:
            any:
              - key: '{{ request.oldObject.metadata.annotations."policy.webgrip.io/allow-stateful-delete" || "false" }}'
                operator: NotEquals
                value: "true"
