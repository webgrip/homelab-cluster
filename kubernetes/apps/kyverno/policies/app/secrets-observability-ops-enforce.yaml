---
# MIGRATED to the CEL policy family 2026-08-08 (rfc-kyverno-cel-migration.md).
# Fourth policy onto CEL, after image-supply-chain-audit (pilot), image-hygiene-audit and
# namespace-tenancy-enforce.
#
# Wave 7 of the audit->enforce campaign (ADR-0032): the three monitor-label rules, split
# out of secrets-observability-ops-audit so they can enforce.
#
# Every ServiceMonitor, PodMonitor and PrometheusRule must carry app.kubernetes.io/name.
# Without it a scrape target or alert rule is unattributable — you get a firing alert and
# no way to tell which app owns it.
#
# NOTE: these rules carry NO namespaceSelector, so this enforces CLUSTER-WIDE, including
# platform namespaces (flux-system, cnpg-system, network, observability, renovate,
# security). That is deliberate — an unattributable alert is no better in a platform
# namespace — but it means chart-rendered monitors must be labelled at the source. Two
# were: guac via the chart's serviceMonitor.labels values block, and renovate-operator
# via a HelmRelease postRenderer because its chart exposes no such block.
#
# Gate evidence: kyverno-CLI sweep over all 85 in-scope ServiceMonitors, PodMonitors and
# PrometheusRules. 19 failures found and ALL remediated in the same commit (11 repo
# manifests + the two chart-rendered ones above) — not waived. Note that none of these
# 19 appeared in any PolicyReport: the background scanner emits no reports for
# ServiceMonitor, PodMonitor or PrometheusRule, so this policy read "0 fails" throughout.
#
# 1:1 — no split needed. The three rules are one requirement applied to three kinds, and
# NONE is waived by any PolicyException, so the CEL whole-policy waiver model loses
# nothing. No autogen concern: these are CRDs, not pod controllers.
#
# THE THREE VALIDATIONS BELOW ARE ONE RULE, KEPT APART ONLY FOR THE MESSAGE. A single
# expression over all three kinds would be shorter and would behave identically, but it
# would report "monitors should include app identity labels" for every kind. Kyverno
# surfaces the message of the failing validation at admission, so keeping them separate
# preserves the exact per-kind wording the legacy rules produced — which is what someone
# hitting this at 3am actually reads.
#
# NOTE: CEL policies have no named rules. Reports carry `policy` and
# `source: KyvernoValidatingPolicy` but no `rule`, so CLI tests must omit `rule:`.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: secrets-observability-ops-enforce
  annotations:
    policies.kyverno.io/title: Observability Monitor Labels (Enforced)
    policies.kyverno.io/category: Observability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ServiceMonitor,PodMonitor,PrometheusRule
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Enforced observability attribution: every ServiceMonitor, PodMonitor and
      PrometheusRule must carry an app.kubernetes.io/name label. Split from
      secrets-observability-ops-audit in wave 7 of the audit->enforce campaign.
spec:
  # `Deny` is the CEL spelling of validationFailureAction: Enforce.
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    # Only the monitoring.coreos.com kinds, matching the legacy rules. This cluster also
    # runs the VictoriaMetrics operator's own VMServiceScrape / VMPodScrape / VMRule
    # (operator.victoriametrics.com), converted from these. The legacy policy never
    # matched those and neither does this one — widening scope is a behaviour change, not
    # a dialect migration, and the converted copies inherit labels from their source.
    resourceRules:
      - apiGroups:
          - "monitoring.coreos.com"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "servicemonitors"
          - "podmonitors"
          - "prometheusrules"
  variables:
    # The legacy pattern `app.kubernetes.io/name: "?*"` means the label must EXIST and be
    # non-empty ("?" is one character, "*" is zero or more). Both halves matter: a label
    # present but set to "" failed the legacy pattern and must still fail here.
    #
    # `in` tests key membership without risking the "no such key" error a direct index
    # would raise on a resource carrying no labels at all — and every object here reaches
    # this expression, including ones with no metadata.labels map.
    - name: hasAppName
      expression: >-
        'app.kubernetes.io/name' in object.metadata.?labels.orValue({}) &&
        object.metadata.labels['app.kubernetes.io/name'] != ''
  validations:
    - expression: "object.kind != 'ServiceMonitor' || variables.hasAppName"
      message: "ServiceMonitors should include app identity labels."
    - expression: "object.kind != 'PodMonitor' || variables.hasAppName"
      message: "PodMonitors should include app identity labels."
    - expression: "object.kind != 'PrometheusRule' || variables.hasAppName"
      message: "PrometheusRules should include app identity labels."
