---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kyverno.io/clusterpolicy_v1.json
# Wave 7 of the audit->enforce campaign (ADR-0032): the three monitor-label rules, split
# out of secrets-observability-ops-audit so they can enforce.
#
# Every ServiceMonitor, PodMonitor and PrometheusRule must carry app.kubernetes.io/name.
# Without it a scrape target or alert rule is unattributable — you get a firing alert and
# no way to tell which app owns it.
#
# NOTE: these rules carry NO namespaceSelector, so this enforces CLUSTER-WIDE, including
# platform namespaces (flux-system, cnpg-system, network, observability, renovate,
# security). That is deliberate — an unattributable alert is no better in a platform
# namespace — but it means chart-rendered monitors must be labelled at the source. Two
# were: guac via the chart's serviceMonitor.labels values block, and renovate-operator
# via a HelmRelease postRenderer because its chart exposes no such block.
#
# Gate evidence: kyverno-CLI sweep over all 85 in-scope ServiceMonitors, PodMonitors and
# PrometheusRules. 19 failures found and ALL remediated in the same commit (11 repo
# manifests + the two chart-rendered ones above) — not waived. Note that none of these
# 19 appeared in any PolicyReport: the background scanner emits no reports for
# ServiceMonitor, PodMonitor or PrometheusRule, so this policy read "0 fails" throughout.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: secrets-observability-ops-enforce
  annotations:
    policies.kyverno.io/title: Observability Monitor Labels (Enforced)
    policies.kyverno.io/category: Observability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ServiceMonitor,PodMonitor,PrometheusRule
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Enforced observability attribution: every ServiceMonitor, PodMonitor and
      PrometheusRule must carry an app.kubernetes.io/name label. Split from
      secrets-observability-ops-audit in wave 7 of the audit->enforce campaign.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-servicemonitor-labels
      match:
        any:
          - resources:
              kinds:
                - ServiceMonitor
      validate:
        message: "ServiceMonitors should include app identity labels."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
    - name: require-podmonitor-labels
      match:
        any:
          - resources:
              kinds:
                - PodMonitor
      validate:
        message: "PodMonitors should include app identity labels."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
    - name: require-prometheusrule-labels
      match:
        any:
          - resources:
              kinds:
                - PrometheusRule
      validate:
        message: "PrometheusRules should include app identity labels."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
