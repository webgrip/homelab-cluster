---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kyverno.io/policyexception_v2.json
# Exception for ploeg worker pods that carry a privileged docker:dind native
# sidecar (ploeg namespace) — OpenHands' sandbox and the repo quality gates
# need a daemon at DOCKER_HOST=tcp://localhost:2376. Same waiver shape and
# rationale as exception-forgejo-runner-privileged.
#
# KEYED ON THE HAZARD, NOT THE WORKLOAD. The ploeg chart emits
# `ploeg.webgrip.dev/privileged-dind: "true"` on precisely the pods that render
# the privileged sidecar, and this exception matches that and nothing else.
# Two reasons it is written that way:
#
#   * Scope. The previous Pod match was `app.kubernetes.io/name: ploeg-worker`
#     — the label EVERY worker pod carries — so a team running `dind: false`
#     (copper today; every reader Role under Shifts) was waived for
#     privileged-containers, run-as-non-root and drop-all-capabilities while
#     running no privileged container at all. Matching the hazard makes the
#     waiver strictly narrower: no dind, no exception.
#
#   * Drift. Ploeg is moving to one workload per (team, Role), so a name-keyed
#     exception would need a new entry here for every writer Role added in
#     another repo. A waiver that must be edited to keep working is a waiver
#     that eventually gets copy-pasted wider than it needs to be. The hazard
#     label is a function of what the pod actually does.
#
# exception-governance forbids wildcard resources.names[]; it places no
# constraint on label selectors, and this exception uses no names at all. The
# label is emitted only by that chart's templates and guarded by committed
# golden renders in webgrip/ploeg (scripts/helm-golden.sh, run in CI), so
# widening it cannot land without appearing in a reviewed diff.
#
# Tracking: this exception exists only because dockerd requires privileged.
# Revisit together with exception-forgejo-runner and exception-forgejo-dind if
# the fleet moves to a rootless or sysbox daemon — at which point the waiver
# disappears rather than merely getting narrower.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: exception-ploeg-worker-privileged
  namespace: security
  labels:
    owner: platform-team
  annotations:
    policies.kyverno.io/description: >-
      Ploeg worker pods that run a privileged docker:dind native sidecar, so
      agent runs get a real Docker daemon for the harness sandbox and the repo
      quality gates. Matched by the ploeg.webgrip.dev/privileged-dind label the
      chart emits on exactly those pods — not by workload name — so the waiver
      tracks the privilege rather than the roster: worker Roles that need no
      Docker (readers, and any team with harness.dind false) carry no label and
      stay under the full baseline. dind's privileged:true inherently trips the
      baseline privileged-containers rule plus the hardening audits at the pod
      level; the worker-bin init container and the worker main container are
      hardened, but Kyverno waives per-resource, not per-container. Revisit
      alongside the forgejo runners if DinD moves to a rootless/sysbox setup.
spec:
  exceptions:
    - policyName: pod-security-baseline-enforce
      ruleNames:
        - privileged-containers
        - autogen-privileged-containers
    - policyName: workload-hardening-audit
      ruleNames:
        - privilege-escalation
        - run-as-non-root
        - check-seccomp-strict
    - policyName: workload-advanced-hardening-audit
      ruleNames:
        - require-drop-all-capabilities
  match:
    any:
      # The resource the webhook actually rejects: the KEDA-generated worker
      # Job. Its pod template carries the label, so the Job selector sees it.
      - resources:
          kinds:
            - Job
          namespaces:
            - ploeg
          selector:
            matchLabels:
              ploeg.webgrip.dev/privileged-dind: "true"
      # The ephemeral worker Pod the Job spawns, carrying the same label. KEDA
      # generates random pod names, so a label match is the only stable handle.
      - resources:
          kinds:
            - Pod
          namespaces:
            - ploeg
          selector:
            matchLabels:
              ploeg.webgrip.dev/privileged-dind: "true"

    # The two Job entries and the broad `app.kubernetes.io/name: ploeg-worker`
    # Pod match that used to sit here are GONE, and the removal criterion
    # this file carried was itself wrong. It said to wait until
    #   kubectl -n ploeg get job -l ploeg.webgrip.dev/privileged-dind=true
    # returned the running Jobs — but the chart puts the hazard label on the
    # POD TEMPLATE, not on the Job's own metadata, so that command returns
    # nothing and always will. Verified on rc.12: the silver worker POD
    # carries the label, its Job does not, and copper (dind: false) carries
    # it on neither, which is exactly the precision the label was added for.
    #
    # The Job entries could not have mattered anyway: pod-security-baseline-
    # enforce matches `kinds: [Pod]` only, carries no autogen-controllers
    # annotation, and its live rule list contains `privileged-containers`
    # with no `autogen-` sibling. Kyverno never evaluates the Job at all.
    #
    # Dropping the broad Pod match is what finally narrows the waiver: it
    # covered EVERY worker pod, so every dind-less reader Role added by the
    # Shift plans would have been silently waived for privileged-containers,
    # run-as-non-root and drop-all-capabilities while taking no privilege.
