---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-pod-exec-verbs
  annotations:
    policies.kyverno.io/title: Restrict pods/exec and pods/attach
    policies.kyverno.io/category: CIS Kubernetes Benchmark, Least Privilege
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Role, ClusterRole
    policies.kyverno.io/description: >-
      `pods/exec` and `pods/attach` give a shell inside any matching container,
      inheriting its ServiceAccount, mounts and network identity. It is the
      cheapest lateral-movement primitive in Kubernetes and it bypasses every
      admission control we have — the pod was already admitted.

      Kubescape C-0002 found 94 findings; the estate had no control at all.
      `pods/portforward` is included: it tunnels straight past NetworkPolicy.
      Reviewed holders are waived in exception-rbac-pod-exec-cel (ADR-0074).
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - "rbac.authorization.k8s.io"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "roles"
          - "clusterroles"
  matchConditions:
    - name: exclude-kubernetes-builtins
      expression: >-
        !object.metadata.name.startsWith('system:') &&
        !(object.metadata.name in ['admin', 'edit', 'view', 'cluster-admin'])
  validations:
    - expression: >-
        object.?rules.orValue([]).all(r, !r.?resources.orValue([]).exists(res,
        res in ['pods/exec', 'pods/attach', 'pods/portforward']))
      message: >-
        Roles must not grant pods/exec, pods/attach or pods/portforward — each
        gives a shell or a tunnel inside an already-admitted pod.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-secret-read-verbs
  annotations:
    policies.kyverno.io/title: Restrict Cluster-Wide Secret Reads
    policies.kyverno.io/category: Secrets, Least Privilege
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ClusterRole
    policies.kyverno.io/description: >-
      A ClusterRole that can list or watch Secrets can read every secret in the
      cluster, which defeats the ESO + OpenBao delivery model entirely — the
      secret is protected in transit and at rest, then readable by anything
      holding this verb. Kubescape C-0015 found 142.

      `get` is deliberately NOT flagged: controllers legitimately fetch named
      secrets. `list` and `watch` are the bulk-read verbs and are what matters.
      A wildcard resource counts only in the core API group, where Secrets live;
      `resources: ["*"]` on a custom API group cannot reach a Secret.
      Reviewed operators are waived in exception-rbac-secret-read-cel (ADR-0074).
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - "rbac.authorization.k8s.io"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "clusterroles"
  matchConditions:
    - name: exclude-kubernetes-builtins
      expression: >-
        !object.metadata.name.startsWith('system:') &&
        !(object.metadata.name in ['admin', 'edit', 'view', 'cluster-admin'])
  validations:
    - expression: >-
        object.?rules.orValue([]).all(r,
        !(r.?apiGroups.orValue(['']).exists(g, g in ['', '*']) &&
        r.?resources.orValue([]).exists(res, res in ['secrets', '*']) &&
        r.?verbs.orValue([]).exists(v, v in ['list', 'watch', '*'])))
      message: >-
        ClusterRoles must not list or watch Secrets cluster-wide; scope to a
        namespaced Role, or use get on named secrets.
