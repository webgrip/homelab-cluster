---
# Enrol named volumes into Longhorn's recurring off-cluster backup jobs.
#
# THE GAP THIS CLOSES:
# `gitops-backup` (…/longhorn/app/recurringjob.yaml) backs up any volume carrying
# `recurring-job-group.longhorn.io/gitops-backup=enabled`. That label lives on the
# longhorn.io Volume CR, which the CSI driver creates at bind time — so nothing in
# git owned it and enrolment was a one-off `kubectl label` per volume, recorded in
# a runbook. Predictably, only four volumes were ever enrolled; an audit on
# 2026-08-01 found 25 attached volumes with no backup of any kind, including
# invoiceninja's MariaDB (financial records, and NOT a CNPG cluster, so barman
# does not cover it) and OpenBao's storage.
#
# WHY THE TRIGGER IS THE PersistentVolume:
# Longhorn Volume CRs are named `pvc-<uuid>`, so they cannot be listed in git by
# name. Something stable and human-meaningful has to name the enrolled set, and
# then point at the Volume CR. The obvious candidate is the PVC — but triggering
# on the PVC fails in two ways that were both hit on 2026-08-01 and are both
# invisible without reading the background controller's logs:
#
#   1. Kyverno records the trigger resource's NAME in a label on the UpdateRequest
#      it creates. Labels cap at 63 characters. The Prometheus PVC name is 91,
#      truncates to a string ending in "-", and UR creation fails outright with
#      "a valid label must be ... alphanumeric". Any PVC over 63 chars is affected.
#   2. Kyverno is deployed into the `security` namespace, so the chart adds
#      `*/*,security,*` to resourceFilters to avoid mutating itself. That excludes
#      EVERY resource in `security` from all policy processing — so the PVC for
#      OpenBao produced no UpdateRequest and, worse, no error at all.
#
# The PersistentVolume has neither problem: it is cluster-scoped (so no namespace
# filter applies), it is named `pvc-<uuid>` at 40 characters (so no label
# truncation), it is low-churn (so this does not put a webhook on a hot path), and
# its name is IDENTICAL to the Longhorn Volume CR's name — which is precisely the
# target this policy needs. spec.claimRef then names the PVC for the list below.
#
# mutateExistingOnPolicyUpdate re-runs this over every existing PV whenever this
# object changes, so editing the lists below is sufficient — no imperative step,
# and if Longhorn ever recreates a Volume CR the label returns on the next update.
#
# ALWAYS VERIFY ENROLMENT AFTER CHANGING THE LISTS. A partial enrolment looks
# exactly like a complete one; the failure mode is a volume nobody is backing up:
#   kubectl -n longhorn-system get volumes.longhorn.io \
#     -l recurring-job-group.longhorn.io/gitops-backup=enabled \
#     -o custom-columns=NS:.status.kubernetesStatus.namespace,PVC:.status.kubernetesStatus.pvcName
#
# REQUIRES kyverno:longhorn-volume-label (rbac-longhorn-volume-label.yaml). Without
# that RBAC this policy patches nothing and reports no error.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: longhorn-backup-enrollment
  annotations:
    policies.kyverno.io/title: Longhorn backup enrolment
    policies.kyverno.io/category: Storage
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Stamps the recurring-job-group labels onto the longhorn.io Volume CRs behind
      an explicit list of PVCs, so off-cluster backup enrolment is declared in git
      rather than applied by hand.
    # Bump to force a re-run without otherwise altering the policy.
    webgrip.io/enrolment-revision: "5"
spec:
  # Mutate-only policy: it never rejects anything, so there is no Enforce/Audit
  # distinction to make here.
  mutateExistingOnPolicyUpdate: true
  rules:
    # ---------------------------------------------------------------------------
    # Tier 1 — irreplaceable, small (~6 GiB total). Daily, retain 7.
    # ---------------------------------------------------------------------------
    - name: enrol-irreplaceable
      match:
        any:
          - resources:
              kinds:
                - PersistentVolume
      preconditions:
        any:
          - key: "{{ request.object.spec.claimRef.namespace || '' }}/{{ request.object.spec.claimRef.name || '' }}"
            operator: AnyIn
            value:
              # User avatars and branding uploaded through the UI; not in any blueprint.
              - authentik/authentik-media
              # invoiceninja-mariadb is the DATABASE. It is MariaDB, not CNPG, so
              # none of the barman tooling touches it — it had no backup at all.
              - invoiceninja/invoiceninja-storage
              - invoiceninja/invoiceninja-mariadb
              # Uploads + the app's own dump directory. Postgres side is CNPG-backed.
              - sparkyfitness/sparkyfitness-uploads
              - sparkyfitness/sparkyfitness-backup
              # File attachments. The DB is CNPG-backed, but attachments live only
              # here, and the roadmap board is in Vikunja (ADR-0043).
              - vikunja/vikunja
              # Config, extensions and per-user state; the DB is CNPG-backed.
              - freshrss/freshrss
              # n8n's /home/node/.n8n — at-rest config and any local files. The
              # workflows and credentials live in CNPG (DB_TYPE=postgresdb) and
              # N8N_ENCRYPTION_KEY comes from OpenBao via ESO, so this tree is
              # recoverable-but-not-disposable. It was enrolled in NOTHING until
              # 2026-08-02. Names the REPLACEMENT claim: the original `n8n` PVC is
              # being retired because its PV's WFFC-era nodeAffinity excluded both
              # workers (see kubernetes/apps/n8n/n8n/app/pvc-data.yaml).
              - n8n/n8n-data
              # OpenBao's raft store — every secret ESO serves. Raft snapshots
              # exist, but they land on this same volume. Only reachable at all
              # because the trigger is the PV: the PVC is in `security`, which
              # Kyverno excludes wholesale (see the header).
              - security/data-openbao-0
              # World save. Regenerable only in the sense that a new world is a world.
              - minecraft/minecraft
              - ai/omnigraph-state
      mutate:
        targets:
          - apiVersion: longhorn.io/v1beta2
            kind: Volume
            # PV name == Longhorn Volume CR name. This is the whole reason the
            # PersistentVolume is the right trigger.
            name: "{{ request.object.metadata.name }}"
            namespace: longhorn-system
        patchStrategicMerge:
          metadata:
            labels:
              recurring-job-group.longhorn.io/gitops-backup: enabled
    # ---------------------------------------------------------------------------
    # Tier 2 — observability history (~78 GiB). Daily, retain 2, NOT 7.
    #
    # Separate tier on purpose. These are high-churn time-series volumes: block
    # compaction rewrites large regions, so each incremental is far bigger than the
    # data actually added that day. At retain 7 the backup target would grow by a
    # multiple of the 78 GiB live size, on a 477 GiB off-site box that also has to
    # hold Immich (70 GB) and the CNPG backups. Two days is enough to survive the
    # cluster-loss case this protects against, which is the point of backing up
    # metrics at all.
    # ---------------------------------------------------------------------------
    - name: enrol-observability-bulk
      match:
        any:
          - resources:
              kinds:
                - PersistentVolume
      preconditions:
        any:
          - key: "{{ request.object.spec.claimRef.namespace || '' }}/{{ request.object.spec.claimRef.name || '' }}"
            operator: AnyIn
            value:
              # 91 characters — the name that broke the PVC-triggered version.
              - observability/prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
              - observability/vmsingle-vmsingle
              - observability/vlsingle-victorialogs
              - observability/vtsingle-victoriatraces
      mutate:
        targets:
          - apiVersion: longhorn.io/v1beta2
            kind: Volume
            name: "{{ request.object.metadata.name }}"
            namespace: longhorn-system
        patchStrategicMerge:
          metadata:
            labels:
              recurring-job-group.longhorn.io/gitops-backup-bulk: enabled
