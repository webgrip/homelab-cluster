---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: workload-seccomp-enforce
  annotations:
    policies.kyverno.io/title: Require a Confining seccomp Profile
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Backstop for seccomp-default-mutate. That mutation gives every new Pod without a
      profile RuntimeDefault; this policy refuses a new Pod whose containers still run
      Unconfined or without a profile, so opting out needs a reviewed PolicyException.
      Same scope as the mutation: Pods with a privileged container, and the forgejo,
      kube-system and longhorn-system namespaces, are left alone (ADR-0074).
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
        resources:
          - "pods"
  variables:
    - name: allContainers
      expression: >-
        object.spec.?containers.orValue([]) +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: podProfile
      expression: >-
        object.spec.?securityContext.?seccompProfile.?type.orValue('')
  matchConditions:
    - name: outside-unconfined-namespaces
      expression: >-
        !(object.metadata.?namespace.orValue('') in ['forgejo', 'kube-system', 'longhorn-system'])
    - name: no-privileged-container
      expression: >-
        !(object.spec.?containers.orValue([]) + object.spec.?initContainers.orValue([])).exists(c,
        c.?securityContext.?privileged.orValue(false) == true)
  validations:
    - expression: >-
        variables.allContainers.all(c,
        c.?securityContext.?seccompProfile.?type.orValue(variables.podProfile) in
        ['RuntimeDefault', 'Localhost'])
      message: >-
        Every container must run under the RuntimeDefault or a Localhost seccomp
        profile; Unconfined, or no profile at all, needs a PolicyException (ADR-0074).
