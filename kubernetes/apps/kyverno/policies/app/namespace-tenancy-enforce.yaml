---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kyverno.io/clusterpolicy_v1.json
# Wave 5 of the audit->enforce campaign (ADR-0032): the three NetworkPolicy SHAPE rules,
# split out of namespace-tenancy-audit so they can enforce while the Namespace-scoped
# require-* rules stay Audit (those are wave 12).
#
# These rules are narrow by construction: they only bite on NetworkPolicies actually
# NAMED `default-deny` or `allow-dns`. Enforcing them does not require every namespace to
# have such a policy — it requires that when one exists, it has the shape its name
# promises. A `default-deny` that silently covers only Ingress is worse than no policy at
# all, because it reads as protection in review while leaving egress wide open.
#
# Deliberately left behind at Audit: require-namespace-ownership-labels,
# require-resourcequota, require-networkpolicy and the add-application-psa-labels mutate.
# Those are wave 12; require-namespace-ownership-labels still has one live failure (the
# `drawio` namespace carries no webgrip.io/exposure label).
#
# Gate evidence: kyverno-CLI sweep over every in-scope NetworkPolicy and Namespace —
# 341 assertions, and the only failure was require-namespace-ownership-labels, which is
# staying behind. NetworkPolicy is one of the few kinds the background scanner DOES
# report on (107 reports live), so here the PolicyReport count independently agreed with
# the sweep — unlike the RBAC and monitor-label waves, where it cannot.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: namespace-tenancy-enforce
  annotations:
    policies.kyverno.io/title: Namespace Tenancy — NetworkPolicy Shape (Enforced)
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: NetworkPolicy
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Enforced NetworkPolicy shape rules: a NetworkPolicy named `default-deny` must cover
      both Ingress and Egress, and one named `allow-dns` must actually allow port 53
      egress. Split from namespace-tenancy-audit in wave 5 of the audit->enforce campaign.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-default-deny-ingress
      match:
        any:
          - resources:
              kinds:
                - NetworkPolicy
      validate:
        message: "Default deny NetworkPolicies should cover ingress."
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.name }}"
                operator: Equals
                value: default-deny
              - key: Ingress
                operator: AnyNotIn
                value: "{{ request.object.spec.policyTypes[] || `[]` }}"
    - name: require-default-deny-egress
      match:
        any:
          - resources:
              kinds:
                - NetworkPolicy
      validate:
        message: "Default deny NetworkPolicies should cover egress."
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.name }}"
                operator: Equals
                value: default-deny
              - key: Egress
                operator: AnyNotIn
                value: "{{ request.object.spec.policyTypes[] || `[]` }}"
    - name: require-dns-egress-policy-shape
      match:
        any:
          - resources:
              kinds:
                - NetworkPolicy
      validate:
        message: "DNS allow NetworkPolicies should explicitly allow TCP and UDP 53 egress."
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.name }}"
                operator: Equals
                value: allow-dns
              - key: 53
                operator: AnyNotIn
                value: "{{ request.object.spec.egress[].ports[].port || `[]` }}"
