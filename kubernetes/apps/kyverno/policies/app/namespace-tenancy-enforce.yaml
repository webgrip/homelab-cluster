---
# MIGRATED to the CEL policy family 2026-08-08 (rfc-kyverno-cel-migration.md).
# Third policy after image-supply-chain-audit (pilot) and image-hygiene-audit.
#
# Wave 5 of the audit->enforce campaign (ADR-0032): the three NetworkPolicy SHAPE rules,
# split out of namespace-tenancy-audit so they can enforce while the Namespace-scoped
# require-* rules stay Audit (those are wave 12).
#
# These rules are narrow by construction: they only bite on NetworkPolicies actually
# NAMED `default-deny` or `allow-dns`. Enforcing them does not require every namespace to
# have such a policy — it requires that when one exists, it has the shape its name
# promises. A `default-deny` that silently covers only Ingress is worse than no policy at
# all, because it reads as protection in review while leaving egress wide open.
#
# Deliberately left behind at Audit: require-namespace-ownership-labels,
# require-resourcequota, require-networkpolicy and the add-application-psa-labels mutate.
# Those are wave 12.
#
# WAVE-12 BACKLOG, MEASURED 2026-08-09. This block previously claimed the only live
# failure was "the `drawio` namespace carries no webgrip.io/exposure label". That was
# stale and had been carried forward unchecked through the CEL migration: `drawio` is
# SUSPENDED in kubernetes/apps/kustomization.yaml and the namespace does not exist, so
# it cannot fail anything. The real backlog is 15 failures — five namespaces, each
# failing all three rules:
#
#   cilium-secrets     0 objects, NOT Flux-owned (Cilium creates it)
#   external-secrets   0 objects, Flux-owned
#   kyverno            0 objects, Flux-owned
#   default            8 objects, Kubernetes built-in
#   keda               21 objects, a real workload
#
# That changes what "fixing" means. Three of the five are EMPTY SHELLS — Kyverno and
# ESO both run in the `security` namespace, so `kyverno` and `external-secrets` look
# vestigial from before that move. For those the honest remedy is probably deletion
# (which clears 6 of the 15) rather than adding ownership labels, a NetworkPolicy and
# a ResourceQuota to namespaces holding nothing. `cilium-secrets` is not Flux-owned
# and is managed by Cilium, so it wants an exclusion, not governance. Only `default`
# and `keda` are genuine candidates for the wave-12 treatment.
#
# VERIFIED 2026-08-09 — `kyverno` and `external-secrets` really are orphans, but
# NOT by the check you would reach for first. `kubectl get all -n kyverno` returns
# nothing, and that is a lie: sweeping every namespaced kind finds 2 configmaps,
# 4 TLS secrets, 1 serviceaccount, 2 policyreports and 5 LEASES. Leases are leader
# election, so "5 leases" reads as an actively-held namespace and argues against
# deletion — the opposite conclusion to `get all`.
#
# The renewal timestamps settle it: all five were last renewed 2026-05-27, ~2.5
# months stale, and their holders (kyverno-admission-controller-54cf7d5b7d-*) no
# longer exist — Kyverno now runs as 69788ff4b5-* in the `security` namespace.
# They are abandoned from before that move. The TLS secrets are the same vintage:
# every live admission webhook resolves to cert-manager, cnpg-system, keda,
# longhorn-system or security, and nothing references kyverno-svc.kyverno.svc.
# Nothing in the repo declares either namespace (only CLI/chainsaw test fixtures
# match) and nothing sets targetNamespace to either.
#
# So deletion is correct — but it is IMPERATIVE, not GitOps: there is no manifest
# to remove, the namespaces are unmanaged leftovers carrying a stale
# kustomize.toolkit.fluxcd.io/name label. That makes it a deliberate hand-run step
# (`kubectl delete namespace kyverno external-secrets`) rather than a commit, and
# it is left undone on purpose — clearing 6 of 15 audit findings does not justify
# an unreviewed destructive action on a namespace whose emptiness two different
# standard checks disagreed about.
#
# 1:1 — no split needed. All three rules share one scope (kind NetworkPolicy, all
# namespaces) and NONE is waived by any PolicyException, so the CEL whole-policy waiver
# model loses nothing. No autogen concern either: NetworkPolicy is not a pod controller,
# which is what made this the safest policy to migrate after image-hygiene-audit.
#
# NOTE: CEL policies have no named rules. PolicyReport results carry `policy` and
# `source: KyvernoValidatingPolicy` but no `rule`, so CLI tests must omit `rule:` and
# assert one verdict per resource. `app/default-deny` therefore reads as a single policy
# fail here, where the legacy test recorded it as fail on require-default-deny-egress and
# pass on require-default-deny-ingress.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: namespace-tenancy-enforce
  annotations:
    policies.kyverno.io/title: Namespace Tenancy — NetworkPolicy Shape (Enforced)
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: NetworkPolicy
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Enforced NetworkPolicy shape rules: a NetworkPolicy named `default-deny` must cover
      both Ingress and Egress, and one named `allow-dns` must actually allow port 53
      egress. Split from namespace-tenancy-audit in wave 5 of the audit->enforce campaign.
spec:
  # `Deny` is the CEL spelling of validationFailureAction: Enforce.
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    # No namespaceSelector: the legacy policy applied to every namespace including
    # kube-system, and the test corpus asserts exactly that (kube-system/default-deny is
    # an in-scope PASS, not an exclusion). Narrowing scope here would be a behaviour
    # change smuggled into a dialect migration.
    resourceRules:
      - apiGroups:
          - "networking.k8s.io"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "networkpolicies"
  validations:
    # Each expression must be TRUE to pass — the inverse of the legacy `deny.conditions`,
    # which denied when the name matched AND the shape was wrong. The leading name
    # inequality is what keeps these scoped by NAME: any NetworkPolicy called something
    # else short-circuits to true and is none of this policy's business.
    - expression: >-
        object.metadata.name != 'default-deny' ||
        'Ingress' in object.spec.?policyTypes.orValue([])
      message: "Default deny NetworkPolicies should cover ingress."
    - expression: >-
        object.metadata.name != 'default-deny' ||
        'Egress' in object.spec.?policyTypes.orValue([])
      message: "Default deny NetworkPolicies should cover egress."
    # The legacy rule flattened spec.egress[].ports[].port and asked whether 53 appeared
    # anywhere in it. The nested exists() below is that same flatten-then-search.
    #
    # BEHAVIOUR PRESERVED, INCLUDING ITS WEAKNESS. The message promises "TCP and UDP",
    # but the check only ever required that 53 appear ONCE, in either protocol — a
    # UDP-only allow-dns has always passed. Tightening it to demand both protocols is a
    # real improvement and a REAL BEHAVIOUR CHANGE: 36 in-scope NetworkPolicies are live,
    # and a migration commit must be provably behaviour-preserving or the differential
    # proves nothing. Tracked separately rather than fixed here.
    #
    # `port` is an IntOrString, so it is compared via string() rather than `== 53`. A
    # named port (`port: dns`) would make an integer comparison raise a type error, which
    # under validationActions: [Deny] fails admission on a policy ERROR rather than a
    # policy verdict — a far worse failure than simply not matching.
    - expression: >-
        object.metadata.name != 'allow-dns' ||
        object.spec.?egress.orValue([]).exists(e,
          e.?ports.orValue([]).exists(p, has(p.port) && string(p.port) == '53'))
      message: "DNS allow NetworkPolicies should explicitly allow TCP and UDP 53 egress."
