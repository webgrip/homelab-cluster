---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: namespace-tenancy-audit
  annotations:
    policies.kyverno.io/title: Namespace Tenancy Audit
    policies.kyverno.io/category: Multi-Tenancy, Pod Security Admission, Networking
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace,NetworkPolicy,ResourceQuota
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Add future namespace security defaults and audit namespace readiness for ownership, resource controls, and network isolation.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: add-application-psa-labels
      match:
        any:
          - resources:
              kinds:
                - Namespace
      preconditions:
        all:
          - key: "{{ request.object.metadata.name }}"
            operator: AnyNotIn
            value:
              - cert-manager
              - cilium-secrets
              - cnpg-system
              - default
              - external-secrets
              - flux-system
              - keda
              - kube-node-lease
              - kube-public
              - kube-system
              - kyverno
              - longhorn-system
              - network
              - observability
              - renovate
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              +(pod-security.kubernetes.io/enforce): baseline
              # PIN THE ENFORCE VERSION, LEAVE warn/audit FLOATING (2026-08-09).
              # Omitting this label means `latest`, so the meaning of `baseline` is
              # whatever the running control plane says it is — a Kubernetes upgrade
              # can silently tighten the checks and start REJECTING workloads that
              # were admitted the day before. Pinning makes that a reviewed change.
              # warn/audit deliberately stay unpinned so the warnings surface what a
              # future version WOULD enforce, before it does.
              #
              # v1.36 matches the cluster (v1.36.1). PSA versions are Kubernetes minor
              # versions, not artifacts — there is no digest to pin, and a value newer
              # than the control plane is rejected. Bump this in lockstep with a Talos
              # /Kubernetes upgrade, after checking the PSS changelog for that minor.
              #
              # SCOPE: this fires at Namespace admission, so it lands on namespaces as
              # they are created or re-applied. Existing namespaces pick it up on the
              # next Flux reconcile of their manifest, not instantly.
              +(pod-security.kubernetes.io/enforce-version): "v1.36"
              +(pod-security.kubernetes.io/audit): restricted
              +(pod-security.kubernetes.io/warn): restricted
    - name: require-namespace-ownership-labels
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          # Label-driven, replacing a hand-maintained 16-name list (2026-08-04). The list
          # was EXACTLY the set of namespaces carrying no `webgrip.io/tier` label, i.e. it
          # duplicated a label that already existed and had to be edited by hand every time
          # a namespace was added. Same scope today, but it can no longer drift: a new
          # infrastructure namespace is out of scope by virtue of not being a tenant, and a
          # new tenant namespace is in scope the moment it declares its tier.
          - resources:
              selector:
                matchExpressions:
                  - key: webgrip.io/tier
                    operator: DoesNotExist
      validate:
        message: "Application namespaces should declare owner, tier, and exposure labels."
        pattern:
          metadata:
            labels:
              webgrip.io/owner: "?*"
              webgrip.io/tier: "platform | app | game | data"
              webgrip.io/exposure: "internal | external | private"
    - name: require-resourcequota
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          # Label-driven, replacing a hand-maintained 16-name list (2026-08-04). The list
          # was EXACTLY the set of namespaces carrying no `webgrip.io/tier` label, i.e. it
          # duplicated a label that already existed and had to be edited by hand every time
          # a namespace was added. Same scope today, but it can no longer drift: a new
          # infrastructure namespace is out of scope by virtue of not being a tenant, and a
          # new tenant namespace is in scope the moment it declares its tier.
          - resources:
              selector:
                matchExpressions:
                  - key: webgrip.io/tier
                    operator: DoesNotExist
      context:
        - name: resourcequotas
          apiCall:
            urlPath: /api/v1/namespaces/{{ request.object.metadata.name }}/resourcequotas
            jmesPath: items[] | length(@)
      validate:
        message: "Application namespaces should have at least one ResourceQuota."
        deny:
          conditions:
            any:
              - key: "{{ resourcequotas }}"
                operator: Equals
                value: 0
    - name: require-networkpolicy
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          # Label-driven, replacing a hand-maintained 16-name list (2026-08-04). The list
          # was EXACTLY the set of namespaces carrying no `webgrip.io/tier` label, i.e. it
          # duplicated a label that already existed and had to be edited by hand every time
          # a namespace was added. Same scope today, but it can no longer drift: a new
          # infrastructure namespace is out of scope by virtue of not being a tenant, and a
          # new tenant namespace is in scope the moment it declares its tier.
          - resources:
              selector:
                matchExpressions:
                  - key: webgrip.io/tier
                    operator: DoesNotExist
      context:
        - name: networkpolicies
          apiCall:
            urlPath: /apis/networking.k8s.io/v1/namespaces/{{ request.object.metadata.name }}/networkpolicies
            jmesPath: items[] | length(@)
      validate:
        message: "Application namespaces should have at least one NetworkPolicy."
        deny:
          conditions:
            any:
              - key: "{{ networkpolicies }}"
                operator: Equals
                value: 0
