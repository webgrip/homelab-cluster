---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: rbac-least-privilege-audit
  annotations:
    policies.kyverno.io/title: RBAC Least Privilege Audit
    policies.kyverno.io/category: CIS Kubernetes Benchmark, NIST SP 800-190, Least Privilege
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Role
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Audit wildcard RBAC permissions in application namespaces.
spec:
  # The four RoleBinding/ClusterRoleBinding rules were split out to
  # rbac-least-privilege-enforce in wave 3 (ADR-0032). What remains here is
  # disallow-wildcards-in-app-roles, which is wave 10 and NOT clean: 55 in-scope Roles
  # still fail it, nearly all generated by the CNPG operator. Note that none of those
  # 55 show up in a PolicyReport — Kyverno's background scanner emits no reports for
  # Role/RoleBinding/ClusterRoleBinding, so this policy reads "0 fails" regardless.
  # Gate wave 10 on a kyverno-CLI sweep, never on the report count.
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-wildcards-in-app-roles
      match:
        any:
          - resources:
              kinds:
                - Role
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
      validate:
        message: >-
          Roles in application namespaces should not use wildcard apiGroups, resources, verbs, or nonResourceURLs.
        # Uses JMESPath contains(), NOT `operator: AnyIn` with `value: ["*"]`.
        #
        # Kyverno's In/AnyIn family treats `*` on the VALUE side as a GLOB, not as the
        # literal string. `value: ["*"]` therefore matches every apiGroup, resource and
        # verb, so the previous form failed EVERY Role — including
        # `apiGroups: [""], resources: ["configmaps"], verbs: ["get"]`. Verified with the
        # kyverno CLI on 2026-08-04: 3/3 sample Roles denied, wildcard or not.
        #
        # It went unnoticed because the policy runs Audit and this rule's kind (Role) is
        # one the background scanner emits NO PolicyReports for, so the 100% false-positive
        # rate showed up as a clean "0 fails". Promoting it (wave 10) would have denied
        # every Role create/update in every application namespace.
        #
        # contains() compares literally and is safe on a missing field via `|| []`.
        foreach:
          - list: request.object.rules[]
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.apiGroups || `[]`, '*') }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.resources || `[]`, '*') }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.verbs || `[]`, '*') }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.nonResourceURLs || `[]`, '*') }}"
                    operator: Equals
                    value: true
