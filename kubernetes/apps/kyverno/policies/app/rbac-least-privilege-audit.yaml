---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: rbac-least-privilege-audit
  annotations:
    policies.kyverno.io/title: RBAC Least Privilege Audit
    policies.kyverno.io/category: CIS Kubernetes Benchmark, NIST SP 800-190, Least Privilege
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Role
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Audit wildcard RBAC permissions in application namespaces.
spec:
  # The four RoleBinding/ClusterRoleBinding rules were split out to
  # rbac-least-privilege-enforce in wave 3 (ADR-0032). What remains here is
  # disallow-wildcards-in-app-roles, which is wave 10 and NOT clean: 55 in-scope Roles
  # still fail it, nearly all generated by the CNPG operator. Note that none of those
  # 55 show up in a PolicyReport — Kyverno's background scanner emits no reports for
  # Role/RoleBinding/ClusterRoleBinding, so this policy reads "0 fails" regardless.
  # Gate wave 10 on a kyverno-CLI sweep, never on the report count.
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-wildcards-in-app-roles
      match:
        any:
          - resources:
              kinds:
                - Role
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
      validate:
        message: >-
          Roles in application namespaces should not use wildcard apiGroups, resources, verbs, or nonResourceURLs.
        foreach:
          - list: request.object.rules[]
            deny:
              conditions:
                any:
                  - key: "{{ element.apiGroups[] || `[]` }}"
                    operator: AnyIn
                    value:
                      - "*"
                  - key: "{{ element.resources[] || `[]` }}"
                    operator: AnyIn
                    value:
                      - "*"
                  - key: "{{ element.verbs[] || `[]` }}"
                    operator: AnyIn
                    value:
                      - "*"
                  - key: "{{ element.nonResourceURLs[] || `[]` }}"
                    operator: AnyIn
                    value:
                      - "*"
