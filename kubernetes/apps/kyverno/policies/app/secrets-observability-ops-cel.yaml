---
# CEL migration of secrets-observability-ops-audit (2026-08-11) — FOUR of its five rules.
#
# PARTIAL ON PURPOSE. require-ha-pdb-for-replicated-deployments uses a `context` +
# `apiCall` to list PodDisruptionBudgets in the workload's namespace, and there is no
# verified CEL equivalent in this cluster yet. It STAYS in the legacy ClusterPolicy, which
# is therefore reduced to that single rule rather than deleted. Migrating it is Phase 1F
# (the apiCall spike) — three other rules across two policies are blocked on the same
# question, so it is worth solving once rather than guessing here.
#
# ONE POLICY PER RULE, not the two the waiver sets strictly require. The four rules have
# three distinct waiver sets:
#   disallow-sensitive-configmap-keys    {envoy-gateway-controller, prometheus-rulefiles}
#   require-topology-spread              {envoy-gateway-controller}
#   require-cronjob-operational-limits   {}
#   require-httproute-backed-probes      {}
# The last two could share a policy since neither is waived, but they govern unrelated
# concerns on unrelated kinds (CronJob vs HTTPRoute). Keeping them apart costs nothing
# today and avoids a second split the first time either one earns a waiver.
#
# All four are Audit, as they were. Nothing here can deny a workload.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: secrets-configmap-keys-audit
  annotations:
    policies.kyverno.io/title: No Secret-like ConfigMap Keys (Audit)
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ConfigMap
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      ConfigMaps must not carry secret-like key names; use an ExternalSecret or a
      SOPS-managed Secret. CEL split of secrets-observability-ops-audit.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "configmaps"
  validations:
    # The legacy rule used `operator: AnyIn` with values like `*password*`. Here the glob
    # is INTENTIONAL — Kyverno treats `*` on the value side as a wildcard, which is
    # exactly the substring match wanted. (Contrast rbac-least-privilege-enforce, where
    # that same behaviour was an accident and denied every Role in the cluster.)
    # contains() is the literal equivalent and, like Kyverno's globs, is case-sensitive.
    #
    # binaryData is deliberately NOT checked — the legacy rule looked only at `data`.
    - expression: >-
        object.?data.orValue({}).all(k,
          !(k.contains('password') || k.contains('passwd') || k.contains('secret') ||
            k.contains('token') || k.contains('apikey') || k.contains('api-key') ||
            k.contains('credential')))
      message: "ConfigMaps should not contain secret-like key names; use SOPS-managed Secrets."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: ops-cronjob-limits-audit
  annotations:
    policies.kyverno.io/title: CronJob Operational Limits (Audit)
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: CronJob
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      CronJobs must forbid concurrent runs and bound their job history. CEL split of
      secrets-observability-ops-audit.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - "batch"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "cronjobs"
  validations:
    # The two history limits carry API-server defaults (3 and 1), so in practice they are
    # always present and `has()` is close to a tautology — same as the legacy `?*`. The
    # load-bearing half is concurrencyPolicy == Forbid.
    - expression: >-
        object.spec.?concurrencyPolicy.orValue('') == 'Forbid' &&
        has(object.spec.successfulJobsHistoryLimit) &&
        has(object.spec.failedJobsHistoryLimit)
      message: "CronJobs should set concurrencyPolicy and history limits."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: workload-topology-spread-audit
  annotations:
    policies.kyverno.io/title: Topology Spread for Replicated Workloads (Audit)
    policies.kyverno.io/category: Availability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment,StatefulSet
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Workloads with more than one replica should spread across topology or declare pod
      anti-affinity. CEL split of secrets-observability-ops-audit.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - "apps"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "deployments"
          - "statefulsets"
  variables:
    - name: podSpec
      expression: "object.spec.template.spec"
    - name: antiAffinity
      expression: "variables.podSpec.?affinity.orValue({}).?podAntiAffinity.orValue({})"
  validations:
    # The legacy replicas>1 gate was a `precondition`, which yields a SKIP result rather
    # than a pass. It is folded into the expression instead: a single-replica workload
    # short-circuits to true and is reported as a pass. That keeps one row per resource
    # and avoids a phantom diff against the legacy skip rows during migration.
    #
    # anyPattern alternative 1 = topologySpreadConstraints present, every entry with a
    # maxSkew. Alternative 2 = podAntiAffinity present; its two arms are BOTH optional in
    # the legacy pattern, so an empty podAntiAffinity satisfies it. Preserved as-is —
    # tightening that is a behaviour change, not a dialect migration.
    - expression: >-
        object.spec.?replicas.orValue(1) <= 1
        ||
        (has(variables.podSpec.topologySpreadConstraints) &&
         variables.podSpec.topologySpreadConstraints.all(t, has(t.maxSkew)))
        ||
        (has(variables.podSpec.affinity) &&
         has(variables.podSpec.affinity.podAntiAffinity) &&
         variables.antiAffinity.?preferredDuringSchedulingIgnoredDuringExecution
           .orValue([]).all(p, has(p.weight)) &&
         variables.antiAffinity.?requiredDuringSchedulingIgnoredDuringExecution
           .orValue([]).all(r, has(r.labelSelector)))
      message: "Replicated workloads should define topology spread constraints or pod anti-affinity."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: ops-httproute-probes-audit
  annotations:
    policies.kyverno.io/title: HTTPRoute Synthetic Check Coverage (Audit)
    policies.kyverno.io/category: Observability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: HTTPRoute
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Externally routed apps should be covered by a synthetic check or blackbox probe.
      CEL split of secrets-observability-ops-audit.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - "gateway.networking.k8s.io"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "httproutes"
  validations:
    # Two ways to opt in, as before: the LABEL must be exactly "true", while the
    # ANNOTATION only has to be non-empty (`?*`). Both reads are `in`-guarded — indexing a
    # missing key raises, and a raised expression under Audit still pollutes the report
    # with an error instead of a verdict.
    - expression: >-
        ('monitoring.webgrip.io/synthetic-check' in object.metadata.?labels.orValue({}) &&
         object.metadata.labels['monitoring.webgrip.io/synthetic-check'] == 'true')
        ||
        ('monitoring.webgrip.io/synthetic-check' in
           object.metadata.?annotations.orValue({}) &&
         object.metadata.annotations['monitoring.webgrip.io/synthetic-check'] != '')
      message: "HTTPRoute-backed apps should be covered by synthetic checks or blackbox probes."
