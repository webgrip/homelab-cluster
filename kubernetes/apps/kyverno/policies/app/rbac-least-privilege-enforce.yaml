---
# MIGRATED to the CEL policy family 2026-08-09 (rfc-kyverno-cel-migration.md).
#
# Wave 3 of the audit->enforce campaign (ADR-0032): the four RBAC rules that are already
# clean cluster-wide, split out of rbac-least-privilege-audit so they can enforce while
# disallow-wildcards-in-app-roles stays Audit.
#
# WAVE 10 merged in 2026-08-04: disallow-wildcards-in-app-roles now enforces here too,
# and rbac-least-privilege-audit is retired (it had no rules left).
#
# Its "55 failing Roles" turned out to be a bug in the rule, not a backlog. It tested for
# a literal `*` with `operator: AnyIn, value: ["*"]`, and Kyverno treats `*` on the value
# side as a GLOB — so it denied every Role in existence. Fixed to use JMESPath contains();
# all 55 in-scope Roles now pass, none of them ever had a wildcard.
#
# Note on the gate: those 55 failures do NOT appear in any PolicyReport. Kyverno's
# background scanner produces no reports for Role, RoleBinding or ClusterRoleBinding at
# all, so every rule in this policy reads "0 fails" whether it is clean or not. The gate
# for this promotion was therefore a direct kyverno-CLI sweep over all 371 in-scope RBAC
# objects, not a report count — 344 assertions, and every one of the 55 failures landed
# on the wildcards rule that is staying behind.
#
# (The reporting blindness has since been FIXED — kyverno:rbac-kinds-read grants the
# read permissions Kyverno was missing. Reports for these kinds now populate.)
#
# The kyverno-rbac-least-privilege dashboard was repointed from the retired
# ...-audit policy name to this one in the same commit; otherwise every panel would
# have gone blank. `metadata.name` is UNCHANGED by this migration, so those panels are
# unaffected — only the `rule` label disappears (CEL policies have no named rules).
#
# 1:1 — NO SPLIT NEEDED. All five rules are Enforce, and NONE is waived by any
# PolicyException, so neither of the two split drivers applies: the CEL whole-policy
# waiver model loses nothing, and one policy-level `validationActions` covers every rule.
#
# NAMESPACE SELECTOR AND CLUSTER-SCOPED KINDS. The legacy policy put the 12-namespace
# exclusion on the three NAMESPACED rules (RoleBinding ×2, Role) and omitted it from the
# two ClusterRoleBinding rules, which instead filter on each SUBJECT's namespace. One
# policy-level namespaceSelector reproduces that exactly: per the admission-webhook
# contract, namespaceSelector has NO EFFECT on a cluster-scoped resource other than
# Namespace, so ClusterRoleBindings still match while RoleBindings and Roles in platform
# namespaces are excluded. The subject-level namespace filtering is kept in the
# expressions, including the empty-string case for subjects that carry no namespace.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: rbac-least-privilege-enforce
  annotations:
    policies.kyverno.io/title: RBAC Least Privilege (Enforced)
    policies.kyverno.io/category: CIS Kubernetes Benchmark, NIST SP 800-190, Least Privilege
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Role,RoleBinding,ClusterRoleBinding
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Enforced RBAC least-privilege rules: application namespaces may not use wildcard
      Roles, bind the default ServiceAccount, or grant cluster-admin. Waves 3 and 10 of
      the audit->enforce campaign.
spec:
  # `Deny` is the CEL spelling of validationFailureAction: Enforce.
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - arc-systems
            - cert-manager
            - cnpg-system
            - flux-system
            - kube-node-lease
            - kube-public
            - kube-system
            - longhorn-system
            - network
            - observability
            - renovate
            - security
    resourceRules:
      - apiGroups:
          - "rbac.authorization.k8s.io"
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "rolebindings"
          - "clusterrolebindings"
          - "roles"
  variables:
    # The same 12 platform namespaces, plus "" for subjects that declare no namespace —
    # carried over verbatim from the two ClusterRoleBinding rules' subject filters.
    - name: platformNamespaces
      expression: >-
        ['arc-systems','cert-manager','cnpg-system','flux-system','kube-node-lease',
         'kube-public','kube-system','longhorn-system','network','observability',
         'renovate','security','']
    - name: subjects
      expression: "object.?subjects.orValue([])"
  validations:
    # Each expression is guarded on object.kind so it applies to exactly the kind its
    # legacy rule matched — the three resourceRules above are one match block, so without
    # the guard every rule would evaluate against all three kinds.
    - expression: >-
        object.kind != 'RoleBinding' ||
        !variables.subjects.exists(s,
          s.?kind.orValue('') == 'ServiceAccount' && s.?name.orValue('') == 'default')
      message: >-
        RoleBindings in application namespaces should not grant permissions to the default ServiceAccount.
    - expression: >-
        object.kind != 'RoleBinding' ||
        !(object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'cluster-admin')
      message: >-
        Application namespaces should not bind the cluster-admin ClusterRole.
    - expression: >-
        object.kind != 'ClusterRoleBinding' ||
        !variables.subjects.exists(s,
          s.?kind.orValue('') == 'ServiceAccount' &&
          s.?name.orValue('') == 'default' &&
          !(s.?namespace.orValue('') in variables.platformNamespaces))
      message: >-
        ClusterRoleBindings should not grant cluster-wide permissions to default ServiceAccounts in application namespaces.
    - expression: >-
        object.kind != 'ClusterRoleBinding' ||
        !(object.roleRef.kind == 'ClusterRole' &&
          object.roleRef.name == 'cluster-admin' &&
          variables.subjects.exists(s,
            s.?kind.orValue('') == 'ServiceAccount' &&
            !(s.?namespace.orValue('') in variables.platformNamespaces)))
      message: >-
        Application ServiceAccounts should not receive cluster-admin via ClusterRoleBindings.
    # CEL's `in` on a list is a LITERAL membership test, which is what the legacy
    # JMESPath contains() was reaching for. It cannot reproduce the original bug: the
    # first version of this rule used `operator: AnyIn, value: ["*"]`, and Kyverno treats
    # `*` on the value side as a GLOB, so it denied every Role in existence — invisibly,
    # because the background scanner emitted no reports for Role at the time.
    - expression: >-
        object.kind != 'Role' ||
        object.?rules.orValue([]).all(r,
          !('*' in r.?apiGroups.orValue([])) &&
          !('*' in r.?resources.orValue([])) &&
          !('*' in r.?verbs.orValue([])) &&
          !('*' in r.?nonResourceURLs.orValue([])))
      message: >-
        Roles in application namespaces should not use wildcard apiGroups, resources, verbs, or nonResourceURLs.
