---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kyverno.io/clusterpolicy_v1.json
# Wave 3 of the audit->enforce campaign (ADR-0032): the four RBAC rules that are already
# clean cluster-wide, split out of rbac-least-privilege-audit so they can enforce while
# disallow-wildcards-in-app-roles stays Audit.
#
# WAVE 10 merged in 2026-08-04: disallow-wildcards-in-app-roles now enforces here too,
# and rbac-least-privilege-audit is retired (it had no rules left).
#
# Its "55 failing Roles" turned out to be a bug in the rule, not a backlog. It tested for
# a literal `*` with `operator: AnyIn, value: ["*"]`, and Kyverno treats `*` on the value
# side as a GLOB — so it denied every Role in existence. Fixed to use JMESPath contains();
# all 55 in-scope Roles now pass, none of them ever had a wildcard.
#
# Note on the gate: those 55 failures do NOT appear in any PolicyReport. Kyverno's
# background scanner produces no reports for Role, RoleBinding or ClusterRoleBinding at
# all, so every rule in this policy reads "0 fails" whether it is clean or not. The gate
# for this promotion was therefore a direct kyverno-CLI sweep over all 371 in-scope RBAC
# objects, not a report count — 344 assertions, and every one of the 55 failures landed
# on the wildcards rule that is staying behind.
#
# The kyverno-rbac-least-privilege dashboard was repointed from the retired
# ...-audit policy name to this one in the same commit; otherwise every panel would
# have gone blank.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: rbac-least-privilege-enforce
  annotations:
    policies.kyverno.io/title: RBAC Least Privilege (Enforced)
    policies.kyverno.io/category: CIS Kubernetes Benchmark, NIST SP 800-190, Least Privilege
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Role,RoleBinding,ClusterRoleBinding
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Enforced RBAC least-privilege rules: application namespaces may not use wildcard
      Roles, bind the default ServiceAccount, or grant cluster-admin. Waves 3 and 10 of
      the audit->enforce campaign.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-default-serviceaccount-rolebindings
      match:
        any:
          - resources:
              kinds:
                - RoleBinding
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
      validate:
        message: >-
          RoleBindings in application namespaces should not grant permissions to the default ServiceAccount.
        foreach:
          - list: request.object.subjects[]
            deny:
              conditions:
                all:
                  - key: "{{ element.kind || '' }}"
                    operator: Equals
                    value: ServiceAccount
                  - key: "{{ element.name || '' }}"
                    operator: Equals
                    value: default
    - name: disallow-cluster-admin-rolebindings
      match:
        any:
          - resources:
              kinds:
                - RoleBinding
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
      validate:
        message: >-
          Application namespaces should not bind the cluster-admin ClusterRole.
        deny:
          conditions:
            all:
              - key: "{{ request.object.roleRef.kind || '' }}"
                operator: Equals
                value: ClusterRole
              - key: "{{ request.object.roleRef.name || '' }}"
                operator: Equals
                value: cluster-admin
    - name: disallow-default-serviceaccount-clusterbindings
      match:
        any:
          - resources:
              kinds:
                - ClusterRoleBinding
      validate:
        message: >-
          ClusterRoleBindings should not grant cluster-wide permissions to default ServiceAccounts in application namespaces.
        foreach:
          - list: request.object.subjects[]
            deny:
              conditions:
                all:
                  - key: "{{ element.kind || '' }}"
                    operator: Equals
                    value: ServiceAccount
                  - key: "{{ element.name || '' }}"
                    operator: Equals
                    value: default
                  - key: "{{ element.namespace || '' }}"
                    operator: NotIn
                    value:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
                      - ""
    - name: disallow-cluster-admin-clusterbindings
      match:
        any:
          - resources:
              kinds:
                - ClusterRoleBinding
      validate:
        message: >-
          Application ServiceAccounts should not receive cluster-admin via ClusterRoleBindings.
        foreach:
          - list: request.object.subjects[]
            deny:
              conditions:
                all:
                  - key: "{{ request.object.roleRef.kind || '' }}"
                    operator: Equals
                    value: ClusterRole
                  - key: "{{ request.object.roleRef.name || '' }}"
                    operator: Equals
                    value: cluster-admin
                  - key: "{{ element.kind || '' }}"
                    operator: Equals
                    value: ServiceAccount
                  - key: "{{ element.namespace || '' }}"
                    operator: NotIn
                    value:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
                      - ""
    - name: disallow-wildcards-in-app-roles
      match:
        any:
          - resources:
              kinds:
                - Role
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
      validate:
        message: >-
          Roles in application namespaces should not use wildcard apiGroups, resources, verbs, or nonResourceURLs.
        # Uses JMESPath contains(), NOT `operator: AnyIn` with `value: ["*"]`.
        #
        # Kyverno's In/AnyIn family treats `*` on the VALUE side as a GLOB, not as the
        # literal string. `value: ["*"]` therefore matches every apiGroup, resource and
        # verb, so the previous form failed EVERY Role — including
        # `apiGroups: [""], resources: ["configmaps"], verbs: ["get"]`. Verified with the
        # kyverno CLI on 2026-08-04: 3/3 sample Roles denied, wildcard or not.
        #
        # It went unnoticed because the policy runs Audit and this rule's kind (Role) is
        # one the background scanner emits NO PolicyReports for, so the 100% false-positive
        # rate showed up as a clean "0 fails". Promoting it (wave 10) would have denied
        # every Role create/update in every application namespace.
        #
        # contains() compares literally and is safe on a missing field via `|| []`.
        foreach:
          - list: request.object.rules[]
            deny:
              conditions:
                any:
                  - key: "{{ contains(element.apiGroups || `[]`, '*') }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.resources || `[]`, '*') }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.verbs || `[]`, '*') }}"
                    operator: Equals
                    value: true
                  - key: "{{ contains(element.nonResourceURLs || `[]`, '*') }}"
                    operator: Equals
                    value: true
