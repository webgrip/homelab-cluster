---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kyverno.io/clusterpolicy_v1.json
# Wave 3 of the audit->enforce campaign (ADR-0032): the four RBAC rules that are already
# clean cluster-wide, split out of rbac-least-privilege-audit so they can enforce while
# disallow-wildcards-in-app-roles stays Audit.
#
# disallow-wildcards-in-app-roles is deliberately LEFT BEHIND. It is wave 10, and it is
# nowhere near clean: 55 in-scope Roles still fail it, nearly all of them generated by
# the CNPG operator (*-db, *-barman-cloud, cnpg-restore-test, cnpg-disaster-recovery).
#
# Note on the gate: those 55 failures do NOT appear in any PolicyReport. Kyverno's
# background scanner produces no reports for Role, RoleBinding or ClusterRoleBinding at
# all, so every rule in this policy reads "0 fails" whether it is clean or not. The gate
# for this promotion was therefore a direct kyverno-CLI sweep over all 371 in-scope RBAC
# objects, not a report count — 344 assertions, and every one of the 55 failures landed
# on the wildcards rule that is staying behind.
#
# Dashboard note: kyverno-rbac-least-privilege selects on
# policy="rbac-least-privilege-audit", so it will keep tracking the wildcards rule but
# not these four. Wire it to both names when wave 10 lands and the split is reversed.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: rbac-least-privilege-enforce
  annotations:
    policies.kyverno.io/title: RBAC Least Privilege (Enforced)
    policies.kyverno.io/category: CIS Kubernetes Benchmark, NIST SP 800-190, Least Privilege
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: RoleBinding,ClusterRoleBinding
    kyverno.io/kyverno-version: 1.18.1
    policies.kyverno.io/description: >-
      Enforced RBAC least-privilege rules: application namespaces may not bind the
      default ServiceAccount, and may not grant cluster-admin. Split from
      rbac-least-privilege-audit in wave 3 of the audit->enforce campaign.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-default-serviceaccount-rolebindings
      match:
        any:
          - resources:
              kinds:
                - RoleBinding
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
      validate:
        message: >-
          RoleBindings in application namespaces should not grant permissions to the default ServiceAccount.
        foreach:
          - list: request.object.subjects[]
            deny:
              conditions:
                all:
                  - key: "{{ element.kind || '' }}"
                    operator: Equals
                    value: ServiceAccount
                  - key: "{{ element.name || '' }}"
                    operator: Equals
                    value: default
    - name: disallow-cluster-admin-rolebindings
      match:
        any:
          - resources:
              kinds:
                - RoleBinding
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
      validate:
        message: >-
          Application namespaces should not bind the cluster-admin ClusterRole.
        deny:
          conditions:
            all:
              - key: "{{ request.object.roleRef.kind || '' }}"
                operator: Equals
                value: ClusterRole
              - key: "{{ request.object.roleRef.name || '' }}"
                operator: Equals
                value: cluster-admin
    - name: disallow-default-serviceaccount-clusterbindings
      match:
        any:
          - resources:
              kinds:
                - ClusterRoleBinding
      validate:
        message: >-
          ClusterRoleBindings should not grant cluster-wide permissions to default ServiceAccounts in application namespaces.
        foreach:
          - list: request.object.subjects[]
            deny:
              conditions:
                all:
                  - key: "{{ element.kind || '' }}"
                    operator: Equals
                    value: ServiceAccount
                  - key: "{{ element.name || '' }}"
                    operator: Equals
                    value: default
                  - key: "{{ element.namespace || '' }}"
                    operator: NotIn
                    value:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
                      - ""
    - name: disallow-cluster-admin-clusterbindings
      match:
        any:
          - resources:
              kinds:
                - ClusterRoleBinding
      validate:
        message: >-
          Application ServiceAccounts should not receive cluster-admin via ClusterRoleBindings.
        foreach:
          - list: request.object.subjects[]
            deny:
              conditions:
                all:
                  - key: "{{ request.object.roleRef.kind || '' }}"
                    operator: Equals
                    value: ClusterRole
                  - key: "{{ request.object.roleRef.name || '' }}"
                    operator: Equals
                    value: cluster-admin
                  - key: "{{ element.kind || '' }}"
                    operator: Equals
                    value: ServiceAccount
                  - key: "{{ element.namespace || '' }}"
                    operator: NotIn
                    value:
                      - arc-systems
                      - cert-manager
                      - cnpg-system
                      - flux-system
                      - kube-node-lease
                      - kube-public
                      - kube-system
                      - longhorn-system
                      - network
                      - observability
                      - renovate
                      - security
                      - ""
