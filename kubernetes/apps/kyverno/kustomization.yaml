---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security

components:
  - ../../components/sops

resources:
  - ./kyverno/ks.yaml
  - ./policies/ks.yaml
  # PolicyExceptions reconcile AFTER the policies that judge them — see the
  # header in exceptions/ks.yaml for the deadlock this ordering prevents.
  - ./exceptions/ks.yaml
  - ./policy-reporter/ks.yaml
