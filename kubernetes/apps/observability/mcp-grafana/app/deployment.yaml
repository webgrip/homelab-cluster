---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grafana
  labels:
    app.kubernetes.io/name: mcp-grafana
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-grafana
    spec:
      nodeSelector:
        node.webgrip.io/pool: worker
      tolerations:
        - key: dedicated
          operator: Equal
          value: fringe
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mcp-grafana
          image: docker.io/grafana/mcp-grafana:0.17.2@sha256:d5b51db0c8eaafc6ed3fede5bfcc8d67b2384a40cf3d493086e378855ceba882
          args:
            - --transport=streamable-http
            - --address=0.0.0.0:8000
            # Trimmed to the read/query tools used from Claude Code. Dropped:
            # admin (privileged), rendering (needs image-renderer plugin),
            # annotations/navigation/runpanelquery/examples (niche).
            # OnCall/Incident/Sift/Asserts are Grafana Cloud features — omitted.
            - --enabled-tools=search,datasource,dashboard,prometheus,alerting
            # 0.15+ validates the Host header on EVERY route incl. /healthz
            # (DNS-rebinding protection; default allowlist = loopback only).
            # Without this list the kubelet probe (Host: <podIP>:8000) and the
            # gateway traffic (Host: mcp-grafana.<domain>) both get 403 — the
            # 0.17.2 rollout crashlooped for 5 days on exactly that. Probes
            # override their Host to localhost:8000 below.
            - --allowed-hosts=localhost:8000,127.0.0.1:8000,mcp-grafana.observability.svc.cluster.local:8000,mcp-grafana.${SECRET_DOMAIN}
          env:
            - name: GRAFANA_URL
              value: "http://grafana-service.observability.svc.cluster.local:3000"
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-grafana-token
                  key: token
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost:8000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost:8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
