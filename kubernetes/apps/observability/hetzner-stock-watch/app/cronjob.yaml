---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hetzner-stock-watch
  labels:
    app.kubernetes.io/name: hetzner-stock-watch
spec:
  schedule: "17 * * * *"
  timeZone: Europe/Amsterdam
  startingDeadlineSeconds: 1800
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hetzner-stock-watch
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: watch
              image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -I
                - /scripts/watch.py
              env:
                - {name: PRODUCTS, value: "ex44,ax41"}
                - {name: DATACENTERS, value: "FSN1,NBG1,HEL1"}
                - {name: METRICS_URL, value: 'http://vmagent-vmagent.observability.svc.cluster.local:8429/api/v1/import/prometheus?extra_label=job=hetzner-stock-watch'}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 5m, memory: 32Mi}
                limits: {memory: 64Mi}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
          volumes:
            - name: script
              configMap:
                name: hetzner-stock-watch-script
