---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hetzner-stock-watch-egress
  labels:
    app.kubernetes.io/name: hetzner-stock-watch
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hetzner-stock-watch
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: www.hetzner.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8429"
              protocol: TCP
