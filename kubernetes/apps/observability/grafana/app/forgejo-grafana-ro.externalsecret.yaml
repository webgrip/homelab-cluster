---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-grafana-ro
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-grafana-ro
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: forgejo/grafana-ro
