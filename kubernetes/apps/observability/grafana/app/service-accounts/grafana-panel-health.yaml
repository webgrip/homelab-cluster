---
# yaml-language-server: $schema=https://raw.githubusercontent.com/grafana/grafana-operator/v5.24.0/config/crd/bases/grafana.integreatly.org_grafanaserviceaccounts.yaml
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: grafana-panel-health
spec:
  instanceName: grafana
  name: grafana-panel-health
  role: Viewer
  isDisabled: false
  tokens:
    - name: grafana-panel-health-token
      secretName: grafana-panel-health-token
