---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-grafana-ro
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: vikunja-grafana-ro
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: vikunja/grafana-ro
