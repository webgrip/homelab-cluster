          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(last_over_time(github_mirror_model_drift{job=\"github-mirrors\"}[1h]) == 1) or vector(0)",
              "instant": true
