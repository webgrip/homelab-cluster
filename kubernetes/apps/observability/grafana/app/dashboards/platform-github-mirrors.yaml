---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: platform-github-mirrors
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  allowCrossNamespaceImport: false
  folderRef: platform
  json: |-
    {
      "schemaVersion": 39,
      "title": "GitHub Mirrors / Drift",
      "uid": "platform-github-mirrors",
      "timezone": "browser",
      "tags": [
        "github",
        "forgejo",
        "mirrors",
        "repo-config"
      ],
      "editable": false,
      "graphTooltip": 0,
      "refresh": "5m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Tracked mirrors",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "last_over_time(github_mirror_model_tracked_mirrors{job=\"github-mirrors\"}[1h])",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "description": "Active GitHub push mirrors in the repo-config model (webgrip/<name> with mirror_of, not archived)."
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Mirrors behind Forgejo",
