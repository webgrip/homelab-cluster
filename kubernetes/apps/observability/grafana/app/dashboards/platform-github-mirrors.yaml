          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "job": true,
                  "__name__": true
                },
                "renameByName": {
                  "repository": "Repository",
                  "Value #A": "Head matches",
                  "Value #B": "Since last mirror sync",
                  "Value #C": "Mirror error",
                  "Value #D": "Tags missing",
                  "Value #E": "Releases missing",
                  "Value #F": "Releases only on GitHub",
                  "Value #G": "Releases copied (24h)",
                  "Value #H": "App can write",
                  "Value #I": "Mirror status readable"
                },
                "indexByName": {
                  "repository": 0,
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4,
                  "Value #E": 5,
                  "Value #F": 6,
                  "Value #G": 7,
                  "Value #H": 8,
                  "Value #I": 9
