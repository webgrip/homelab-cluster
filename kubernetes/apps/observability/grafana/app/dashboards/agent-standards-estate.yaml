---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agent-standards-estate
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  allowCrossNamespaceImport: false
  folderRef: engineering-experience
  json: |-
    {
      "schemaVersion": 39,
      "title": "Agent standard / Estate",
      "uid": "agent-standards-estate",
      "timezone": "browser",
      "tags": [
        "engineering-experience",
        "agents"
      ],
      "editable": false,
      "graphTooltip": 1,
      "refresh": "1h",
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "description": "Which repositories are on the agent standard and on which agent-standards release. Fed daily by the agent-standards estate workflow (job agent-standards-estate).",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "On the standard",
          "description": "Repositories that pin agent-standards packages (agent-standards itself included).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(last_over_time(agentstd_repository{adopted=\"true\"}[2d]))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Repositories",
          "description": "Every repository of the organisation on Forgejo, private ones included.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(last_over_time(agentstd_repository[2d]))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "On the latest release",
          "description": "Repositories that pin the newest agent-standards release.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(last_over_time(agentstd_repository{current=\"true\"}[2d]))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Behind",
          "description": "Repositories on an older release; Renovate opens the bump.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(last_over_time(agentstd_repository{status=\"behind\"}[2d]))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "orange"
              },
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Not on the standard",
          "description": "Profiles, the notes vault and benchmark worlds stay off on purpose.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(last_over_time(agentstd_repository{adopted=\"false\"}[2d]))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Latest release",
          "description": "The newest agent-standards tag.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "last_over_time(agentstd_latest_release[2d])",
              "instant": true,
              "legendFormat": "{{release}}"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "colorMode": "none",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "bargauge",
          "title": "Repositories by status",
          "description": "Pinned agent-standards release compared with the latest.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by (status) (last_over_time(agentstd_repository[2d]))",
              "instant": true,
              "legendFormat": "{{status}}"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "bargauge",
          "title": "Packages in use",
          "description": "How many repositories pin each agent-standards package.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sort_desc(count by (package) (last_over_time(agentstd_repository_package[2d])))",
              "instant": true,
              "legendFormat": "{{package}}"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Every repository",
          "description": "One row per repository: status, pinned release, visibility.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 14,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "last_over_time(agentstd_repository[2d])",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "adopted": true,
                  "current": true
                },
                "indexByName": {
                  "repository": 0,
                  "status": 1,
                  "ref": 2,
                  "private": 3
                },
                "renameByName": {
                  "repository": "Repository",
                  "status": "Status",
                  "ref": "Pinned release",
                  "private": "Private"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Status"
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Status"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "current": {
                            "color": "green"
                          },
                          "source": {
                            "color": "green"
                          },
                          "behind": {
                            "color": "orange"
                          },
                          "not adopted": {
                            "color": "text"
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Adoption over time",
          "description": "Repositories on the standard and on the latest release, per daily report.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(last_over_time(agentstd_repository{adopted=\"true\"}[1d]))",
              "legendFormat": "on the standard"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(last_over_time(agentstd_repository{current=\"true\"}[1d]))",
              "legendFormat": "on the latest release"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "drawStyle": "line",
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
