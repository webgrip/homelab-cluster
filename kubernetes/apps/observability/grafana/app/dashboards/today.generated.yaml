            {
              "refId": "FEED",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "forgejo-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH pushes AS ( SELECT a.id, a.created_unix, a.act_user_id, r.id AS repo_id, r.name AS repo, a.ref_name, a.content::json AS c FROM action a JOIN repository r ON r.id = a.repo_id WHERE a.user_id = r.owner_id AND a.op_type = 5 AND a.ref_name = 'refs/heads/' || r.default_branch AND a.content LIKE '{%' AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror AND a.created_unix > extract(epoch FROM now() - interval '30 days') ORDER BY a.id DESC LIMIT 6 ) SELECT p.created_unix AS at, p.repo, cm.value->>'Sha1' AS sha, cm.value->>'Message' AS title, cm.value->>'AuthorName' AS author, u.lower_name AS pusher, coalesce((u.type = 4 OR u.lower_name ~ '^(renovate.*|agent-.+|ploeg.*|glide.*|webgrip-ci|.+-bot|.+\\[bot\\])$$'), false) AS agent, cm.ordinality = 1 AS head, (SELECT CASE WHEN count(*) = 0 THEN NULL WHEN bool_or(x.status = 2) THEN 'failure' WHEN bool_or(x.status IN (5, 6, 7)) THEN 'running' WHEN bool_and(x.status IN (1, 4)) THEN 'success' ELSE 'cancelled' END FROM (SELECT DISTINCT ON (ar.workflow_id) ar.status FROM action_run ar WHERE ar.repo_id = p.repo_id AND ar.commit_sha = cm.value->>'Sha1' AND ar.ref = p.ref_name ORDER BY ar.workflow_id, ar.status = 3, ar.id DESC) x) AS ci FROM pushes p CROSS JOIN LATERAL json_array_elements(p.c->'Commits') WITH ORDINALITY cm LEFT JOIN \"user\" u ON u.id = p.act_user_id ORDER BY p.id DESC, cm.ordinality LIMIT 6"
            },
            {
              "refId": "WEEK",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "forgejo-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH b AS (SELECT extract(epoch FROM date_trunc('week', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam')::bigint AS ws, extract(epoch FROM now())::bigint AS now_s), ev AS ( SELECT a.op_type, a.repo_id, a.created_unix >= b.ws AS this_week, a.created_unix < b.ws AND a.created_unix < b.now_s - 604800 AS last_week_so_far, coalesce((u.type = 4 OR u.lower_name ~ '^(renovate.*|agent-.+|ploeg.*|glide.*|webgrip-ci|.+-bot|.+\\[bot\\])$$'), false) AS agent, CASE WHEN a.op_type = 5 THEN (a.content::json->>'Len')::int ELSE 0 END AS commits, CASE WHEN a.op_type = 5 THEN (a.content::json->>'Len')::int ELSE 0 END > 100 AS import FROM action a JOIN repository r ON r.id = a.repo_id CROSS JOIN b LEFT JOIN \"user\" u ON u.id = a.act_user_id WHERE a.user_id = r.owner_id AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror AND a.created_unix >= b.ws - 604800 AND (((a.op_type = 5 AND a.ref_name = 'refs/heads/' || r.default_branch AND a.content LIKE '{%')) OR a.op_type IN (11, 24, 27)) ) SELECT (SELECT ws FROM b) AS week_start, coalesce(sum(commits) FILTER (WHERE this_week AND NOT import), 0) AS commits, coalesce(sum(commits) FILTER (WHERE last_week_so_far AND NOT import), 0) AS last_week, coalesce(sum(commits) FILTER (WHERE this_week AND agent AND NOT import), 0) AS agent_commits, coalesce(sum(commits) FILTER (WHERE this_week AND import), 0) AS imported, count(DISTINCT repo_id) FILTER (WHERE this_week AND op_type = 5) AS repos, count(*) FILTER (WHERE this_week AND op_type IN (11, 27)) AS merged, count(*) FILTER (WHERE this_week AND op_type = 24) AS releases FROM ev"
            },
            {
              "refId": "WINS",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "forgejo-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH graded AS ( SELECT ar.repo_id, ar.workflow_id, ar.id, ar.status, max(ar.id) FILTER (WHERE ar.status = 2) OVER (PARTITION BY ar.repo_id, ar.workflow_id) AS last_red FROM action_run ar JOIN repository r ON r.id = ar.repo_id WHERE ar.event = 'push' AND ar.ref = 'refs/heads/' || r.default_branch AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror AND ar.status IN (1, 2) ) SELECT 'streak' AS kind, r.name AS repo, g.workflow_id AS workflow, count(*) AS value FROM graded g JOIN repository r ON r.id = g.repo_id WHERE g.status = 1 AND g.id > coalesce(g.last_red, 0) GROUP BY r.name, g.workflow_id ORDER BY value DESC, r.name LIMIT 1"
            },
            {
              "refId": "PULLS",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "forgejo-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT r.name AS repo, i.index AS number, i.name AS title, u.lower_name AS poster, coalesce((u.type = 4 OR u.lower_name ~ '^(renovate.*|agent-.+|ploeg.*|glide.*|webgrip-ci|.+-bot|.+\\[bot\\])$$'), false) AS agent, i.created_unix AS opened, (SELECT CASE WHEN count(*) = 0 THEN NULL WHEN bool_or(x.status = 2) THEN 'failure' WHEN bool_or(x.status IN (5, 6, 7)) THEN 'running' WHEN bool_and(x.status IN (1, 4)) THEN 'success' ELSE 'cancelled' END FROM (SELECT DISTINCT ON (ar.workflow_id) ar.status FROM action_run ar WHERE ar.repo_id = r.id AND ar.ref = 'refs/pull/' || i.index || '/head' ORDER BY ar.workflow_id, ar.status = 3, ar.id DESC) x) AS ci FROM issue i JOIN repository r ON r.id = i.repo_id LEFT JOIN \"user\" u ON u.id = i.poster_id WHERE i.is_pull AND NOT i.is_closed AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror ORDER BY i.created_unix ASC LIMIT 200"
            },
            {
              "refId": "STAGES",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "vikunja-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH t AS ( SELECT t.id, t.project_id, t.done, t.updated, coalesce(bool_or(l.title = 'review'), false) AS review, coalesce(bool_or(l.title LIKE 'agent/%'), false) AS claimed, coalesce(bool_or(l.title = 'ready'), false) AS ready, coalesce(bool_or(l.title = 'do-next'), false) AS do_next FROM tasks t LEFT JOIN label_tasks lt ON lt.task_id = t.id LEFT JOIN labels l ON l.id = lt.label_id WHERE t.project_id IN (3, 6, 9, 10) AND (NOT t.done OR t.done_at >= date_trunc('week', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam') GROUP BY t.id, t.project_id, t.done, t.updated ) SELECT project_id AS board, count(*) FILTER (WHERE NOT done AND NOT review AND NOT claimed AND NOT ready) AS backlog, count(*) FILTER (WHERE NOT done AND NOT review AND NOT claimed AND ready) AS todo, count(*) FILTER (WHERE NOT done AND NOT review AND claimed) AS doing, count(*) FILTER (WHERE NOT done AND review) AS reviewing, count(*) FILTER (WHERE done) AS done, count(*) FILTER (WHERE NOT done AND do_next) AS do_next, (min(extract(epoch FROM updated)) FILTER (WHERE NOT done AND review))::bigint AS oldest_review FROM t GROUP BY project_id ORDER BY project_id"
            },
            {
              "refId": "TRUNK_RED",
              "expr": "(time() - (max by (repo, workflow, ref) (forgejo_ci_last_success_timestamp_seconds) > 0) or max by (repo, workflow, ref) (forgejo_ci_consecutive_failures) * 0 - 1) and on (repo, workflow, ref) ((max by (repo, workflow, ref) (forgejo_ci_last_run_status{status=\"failure\"}) == 1) and on (repo, workflow, ref) (time() - max by (repo, workflow, ref) (forgejo_ci_last_run_timestamp_seconds) < 604800))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            },
            {
              "refId": "CI_AGE",
              "expr": "time() - max(forgejo_ci_last_refresh_timestamp_seconds)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            },
            {
              "refId": "PROBES",
              "expr": "min(probe_success) or on() vector(-1)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            },
            {
              "refId": "FLUX",
              "expr": "count(flux_resource_info{ready=\"False\", suspended=\"False\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            },
            {
              "refId": "GLIDE",
              "expr": "sum by (state) (ploeg_work_items_count{state=~\"needs_human|awaiting_review\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            },
            {
              "refId": "ALERTS",
              "datasource": {
                "type": "yesoreyeram-infinity-datasource",
                "uid": "alertmanager-api"
              },
              "type": "json",
              "source": "url",
              "format": "table",
              "parser": "backend",
              "url": "http://vmalertmanager-vmalertmanager.observability.svc.cluster.local:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&unprocessed=false",
              "url_options": {
                "method": "GET",
                "data": ""
              },
              "root_selector": "[{ \"critical\": $$count($$[labels.alertname != \"Watchdog\" and ($$not($$exists(labels.job)) or labels.job != \"opencost\") and labels.severity = \"critical\"]), \"warning\": $$count($$[labels.alertname != \"Watchdog\" and ($$not($$exists(labels.job)) or labels.job != \"opencost\") and labels.severity = \"warning\"]) }]",
              "columns": [
                {
                  "selector": "critical",
                  "text": "critical",
                  "type": "number"
                },
                {
                  "selector": "warning",
                  "text": "warning",
                  "type": "number"
                }
              ]
            },
            {
              "refId": "FLOW",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "vikunja-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT t.project_id AS board, count(*) FILTER (WHERE t.created >= date_trunc('week', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam') AS arrived, count(*) FILTER (WHERE t.created >= date_trunc('week', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam' - interval '7 days' AND t.created < now() - interval '7 days') AS arrived_last, count(*) FILTER (WHERE t.done AND t.done_at >= date_trunc('week', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam') AS closed, count(*) FILTER (WHERE t.done AND t.done_at >= date_trunc('week', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam' - interval '7 days' AND t.done_at < now() - interval '7 days') AS closed_last, (percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM t.done_at - t.created)) FILTER (WHERE t.done AND t.done_at >= now() - interval '28 days'))::bigint AS lead_p50, (percentile_cont(0.85) WITHIN GROUP (ORDER BY extract(epoch FROM t.done_at - t.created)) FILTER (WHERE t.done AND t.done_at >= now() - interval '28 days'))::bigint AS lead_p85, count(*) FILTER (WHERE t.done AND t.done_at >= now() - interval '28 days') AS lead_sample FROM tasks t WHERE t.project_id IN (3, 6, 9, 10) GROUP BY t.project_id ORDER BY t.project_id"
            },
            {
              "refId": "AGING",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "vikunja-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH held AS ( SELECT t.project_id AS board, t.id, t.title, CASE WHEN bool_or(l.title = 'review') THEN 'reviewing' ELSE 'doing' END AS stage, extract(epoch FROM now() - min(lt.created))::bigint AS in_stage FROM tasks t JOIN label_tasks lt ON lt.task_id = t.id JOIN labels l ON l.id = lt.label_id WHERE NOT t.done AND t.project_id IN (3, 6, 9, 10) AND (l.title = 'review' OR l.title LIKE 'agent/%') GROUP BY t.project_id, t.id, t.title ) SELECT DISTINCT ON (board, stage) board, stage, in_stage AS oldest, id AS ticket, title FROM held ORDER BY board, stage, in_stage DESC"
            },
            {
              "refId": "AGENTS",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT coalesce(r.role, 'other') AS role, count(*) AS runs, count(*) FILTER (WHERE r.state = 'running') AS running, count(*) FILTER (WHERE r.outcome IN ('pr_opened', 'pr_updated')) AS delivered, count(*) FILTER (WHERE r.outcome IN ('failed', 'stuck')) AS failed, count(*) FILTER (WHERE r.state = 'finished') AS finished, count(DISTINCT r.work_item_id) AS work_items FROM agent_runs r WHERE r.started_at >= date_trunc('week', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam' OR r.state = 'running' GROUP BY 1 ORDER BY runs DESC"
            },
            {
              "refId": "RUN_KEYS",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT 'ploeg-' || left(r.run_token, 12) AS alias, r.team, coalesce(nullif(w.target_repo, ''), r.team) AS project FROM agent_runs r JOIN work_items w ON w.id = r.work_item_id WHERE r.run_token IS NOT NULL AND (r.started_at >= date_trunc('week', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam' - interval '1 day' OR r.state = 'running')"
            },
            {
              "refId": "SPEND",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "litellm-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT coalesce(metadata->>'user_api_key_alias', '(none)') AS alias, coalesce(sum(spend), 0) AS usd, coalesce(sum(spend) FILTER (WHERE \"startTime\" >= date_trunc('day', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam'), 0) AS usd_today, coalesce(sum(total_tokens), 0) AS tokens, count(*) AS calls, count(*) FILTER (WHERE coalesce(metadata->>'status', 'success') <> 'success') AS failed FROM \"LiteLLM_SpendLogs\" WHERE \"startTime\" >= date_trunc('week', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam' GROUP BY 1"
            },
            {
              "refId": "AGENT_PRS",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "forgejo-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "WITH b AS (SELECT extract(epoch FROM date_trunc('week', now() AT TIME ZONE 'Europe/Amsterdam') AT TIME ZONE 'Europe/Amsterdam')::bigint AS ws), prs AS ( SELECT i.created_unix, i.is_closed, pr.has_merged, pr.merged_unix, r.name AS repo, i.index, i.name AS title FROM issue i JOIN pull_request pr ON pr.issue_id = i.id JOIN \"user\" u ON u.id = i.poster_id JOIN repository r ON r.id = i.repo_id WHERE u.lower_name IN ('agent-builder') AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror ) SELECT count(*) FILTER (WHERE created_unix >= b.ws) AS opened, count(*) FILTER (WHERE has_merged AND merged_unix >= b.ws) AS merged, count(*) FILTER (WHERE has_merged AND merged_unix >= b.ws - 604800 AND merged_unix < b.ws) AS merged_last, count(*) FILTER (WHERE NOT is_closed) AS open_now, count(*) FILTER (WHERE has_merged AND merged_unix >= b.ws - 2419200) AS merged_28d, count(*) FILTER (WHERE is_closed AND NOT has_merged AND created_unix >= b.ws - 2419200) AS closed_28d, (SELECT repo || ' #' || index || ' ' || title FROM prs WHERE has_merged ORDER BY merged_unix DESC LIMIT 1) AS last_merged FROM prs CROSS JOIN b GROUP BY b.ws"
            },
            {
              "refId": "CI_NOW",
              "expr": "label_replace((sum(forgejo_ci_tasks_active{status=\"running\"})) or on() vector(0), \"k\", \"running\", \"\", \"\") or label_replace((max(keda_scaler_metrics_value{scaledObject=\"forgejo-runner\"})) or on() vector(0), \"k\", \"queued\", \"\", \"\") or label_replace((sum(kube_pod_status_phase{job=\"kube-state-metrics\", exported_namespace=\"forgejo\", exported_pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\", phase=\"Running\"})) or on() vector(0), \"k\", \"runners\", \"\", \"\") or label_replace((sum(kube_pod_status_phase{job=\"kube-state-metrics\", exported_namespace=\"forgejo\", exported_pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\", phase=\"Pending\"})) or on() vector(0), \"k\", \"pending\", \"\", \"\")",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            },
            {
              "refId": "CI_FAILED",
              "expr": "sum(increase(forgejo_ci_jobs_total{status=\"failure\"}[7d])) / sum(increase(forgejo_ci_jobs_total{status=~\"success|failure\"}[7d]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ]
        }
      ]
    }
