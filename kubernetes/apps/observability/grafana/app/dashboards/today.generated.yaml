            "styles": "--ground: #0e1420;\n--panel: #151d2c;\n--line: #233047;\n--ink: #eef1f6;\n--ink-2: #9aa7bd;\n--ink-3: #5e6b83;\n--backlog: #8b98b4;\n--todo: #5fb7ff;\n--doing: #c6a8ff;\n--review: #ffb45e;\n--done: #4fd59a;\n--warm: #ffb45e;\n--win: #ffd166;\n--alarm: #ff7a6b;\n--display: \"Bricolage Grotesque\", \"Avenir Next\", \"Segoe UI\", sans-serif;\n--body: \"IBM Plex Sans\", \"Helvetica Neue\", Arial, sans-serif;\n--mono: \"JetBrains Mono\", \"SFMono-Regular\", Menlo, monospace;\nbackground: var(--ground);\ncolor: var(--ink);\nfont-family: var(--body);\ncontainer-type: size;\noverflow: hidden !important;\nborder-radius: 6px;\n\n.dt-row { padding: 0; margin: 0; border: 0; height: 100%; }\n* { box-sizing: border-box; }\na { color: inherit; text-decoration: none; }\na:hover { color: var(--ink); }\na:focus-visible { outline: 2px solid var(--todo); outline-offset: 3px; }\n\n.wall {\n  height: 100%;\n  font-size: 14.5px;\n  font-size: clamp(9px, min(0.77cqw, 1.6cqh), 22px);\n  line-height: 1.35;\n  padding: 0.8em 1.6em 0.6em;\n  display: grid;\n  grid-template-rows: auto auto auto minmax(0, 1fr) auto;\n  gap: 0.85em;\n  overflow: hidden;\n}\n\n.h { font-family: var(--display); font-weight: 700; font-size: 1.3em; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 0.7em; margin: 0 0 0.45em; white-space: nowrap; }\n.h em { font-style: normal; font-family: var(--body); font-weight: 400; font-size: 0.62em; color: var(--ink-3); }\n.calm { color: var(--ink-3); font-size: 0.95em; padding: 0.3em 0.1em; }\n.calm.pad { padding: 0.9em 1.2em; }\n.notice { color: var(--warm); font-size: 1.4em; padding: 2em; grid-row: span 2; }\n\n.top { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1.5em; align-items: end; }\n.team { font-family: var(--display); font-weight: 800; font-size: 4em; line-height: 0.95; letter-spacing: -0.02em; text-transform: capitalize; }\n.team small { display: block; font-family: var(--body); font-weight: 500; font-size: 0.245em; color: var(--ink-2); letter-spacing: 0; margin-top: 0.55em; text-transform: none; }\n.days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.35em; margin-top: 0.85em; max-width: 36em; }\n.day { display: block; height: 0.7em; border-radius: 0.2em; background: var(--line); }\n.day.done { background: var(--ink-2); }\n.day.today { background: var(--ink); box-shadow: 0 0 0 0.2em rgba(238, 241, 246, 0.15); }\n.dayslabel { display: flex; justify-content: space-between; max-width: 36em; font-size: 0.8em; color: var(--ink-3); margin-top: 0.4em; font-family: var(--mono); }\n\n.shipped { display: grid; gap: 0.7em; justify-items: end; text-align: right; }\n.shipped .big { font-family: var(--display); font-weight: 800; font-size: 6.2em; line-height: 1.05; letter-spacing: -0.03em; }\n.shipped .big span { font-size: 0.26em; font-weight: 600; color: var(--ink-2); letter-spacing: 0; margin-left: 0.6em; }\n.facts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.5em; }\n.fact { font-size: 0.88em; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 0.3em 0.85em; white-space: nowrap; }\n.fact b { color: var(--ink); font-weight: 600; font-family: var(--mono); }\n.fact.agent b { color: var(--win); }\n.fact.muted { color: var(--ink-3); }\n.fact.muted b { color: var(--ink-2); }\n\n.band2, .band3 { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr); gap: 1.5em; min-height: 0; }\n.band2 > div, .band3 > div { min-height: 0; overflow: hidden; }\n.legend { display: flex; gap: 1em; font-family: var(--body); font-weight: 400; font-size: 0.6em; color: var(--ink-2); letter-spacing: 0; }\n.legend i { display: inline-block; width: 0.75em; height: 0.75em; border-radius: 50%; margin-right: 0.45em; }\n.legend .lb { background: var(--backlog); } .legend .lt { background: var(--todo); } .legend .ld { background: var(--doing); } .legend .lr { background: var(--review); } .legend .lp { background: var(--done); }\n\n.boards { display: grid; gap: 0.45em; align-content: start; }\n.board { background: var(--panel); border: 1px solid var(--line); border-radius: 0.9em; padding: 0.5em 1.1em; display: grid; grid-template-columns: 13em minmax(0, 1fr); gap: 1.1em; align-items: center; }\n.bname { display: grid; font-family: var(--display); font-weight: 700; font-size: 1.15em; line-height: 1.1; min-width: 0; }\n.board-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.bname small { display: block; font-family: var(--body); font-weight: 400; font-size: 0.62em; color: var(--ink-3); margin-top: 0.3em; white-space: nowrap; }\n\n.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; }\n.track::before { content: \"\"; position: absolute; left: 0.4em; right: calc(20% - 0.9em); top: 0.8em; height: 2px; background: linear-gradient(90deg, var(--backlog), var(--todo) 25%, var(--doing) 50%, var(--review) 75%, var(--done)); opacity: 0.35; }\n.st { position: relative; display: grid; gap: 0.3em; justify-items: start; }\n.st .node { width: 1.75em; height: 1.75em; border-radius: 50%; background: var(--ground); border: 2px solid var(--c); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 0.9em; color: var(--c); }\n.st.empty .node { border-color: var(--line); color: var(--ink-3); }\n.st.full .node { background: var(--c); color: var(--ground); box-shadow: 0 0 0 0.3em var(--glow); }\n.st .lbl { font-size: 0.7em; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }\n.st.b { --c: var(--backlog); --glow: rgba(139, 152, 180, 0.18); }\n.st.t { --c: var(--todo); --glow: rgba(95, 183, 255, 0.18); }\n.st.d { --c: var(--doing); --glow: rgba(198, 168, 255, 0.18); }\n.st.r { --c: var(--review); --glow: rgba(255, 180, 94, 0.18); }\n.st.p { --c: var(--done); --glow: rgba(79, 213, 154, 0.18); }\n.quiet { font-size: 0.85em; color: var(--ink-3); padding: 0.15em 0.3em 0; }\n.quiet b { color: var(--ink-2); font-weight: 500; }\n\n.wins { display: grid; gap: 0.45em; align-content: start; }\n.wins .h { margin-bottom: 0; }\n.win { border-radius: 0.9em; padding: 0.45em 1em; background: linear-gradient(160deg, #1f2430, var(--panel) 60%); border: 1px solid #3b3a35; display: grid; gap: 0.2em; }\n.win .k { font-size: 0.72em; letter-spacing: 0.08em; text-transform: uppercase; color: var(--win); }\n.win .v { font-family: var(--display); font-weight: 800; font-size: 1.75em; line-height: 1; letter-spacing: -0.02em; }\n.win .v span { font-size: 0.47em; font-weight: 600; color: var(--ink-2); margin-left: 0.4em; letter-spacing: 0; }\n.win .s { font-size: 0.85em; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.streak { display: flex; gap: 0.2em; margin-top: 0.1em; }\n.streak i { width: 0.45em; height: 0.7em; border-radius: 2px; background: var(--done); opacity: 0.85; }\n\n.feed { background: var(--panel); border: 1px solid var(--line); border-radius: 0.9em; padding: 0.2em 0; }\n.row { display: grid; grid-template-columns: 5.4em 2.1em 4.6em minmax(0, 1fr) 7.6em; gap: 0.8em; align-items: center; padding: 0.24em 1.1em; border-top: 1px solid var(--line); }\n.row:first-child { border-top: 0; }\n.row .t { font-family: var(--mono); font-size: 0.8em; color: var(--ink-3); white-space: nowrap; }\n.av { width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; font-size: 0.72em; font-weight: 600; background: #2b3a57; color: var(--ink); position: relative; }\n.av.ai::after { content: \"✦\"; position: absolute; right: -0.35em; bottom: -0.25em; font-size: 0.95em; color: var(--win); }\n.chip { font-family: var(--mono); font-size: 0.74em; font-weight: 600; padding: 0.2em 0.5em; border-radius: 0.4em; text-align: center; background: rgba(139, 152, 180, 0.16); color: var(--backlog); }\n.chip.feat { background: rgba(95, 183, 255, 0.14); color: var(--todo); }\n.chip.fix { background: rgba(255, 180, 94, 0.14); color: var(--warm); }\n.chip.ci, .chip.build { background: rgba(198, 168, 255, 0.14); color: var(--doing); }\n.chip.test, .chip.perf { background: rgba(79, 213, 154, 0.14); color: var(--done); }\n.title { min-width: 0; line-height: 1.25; }\n.title b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.title small { display: block; color: var(--ink-3); font-size: 0.8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.state { font-size: 0.74em; font-weight: 600; letter-spacing: 0.04em; padding: 0.3em 0.6em; border-radius: 999px; text-align: center; white-space: nowrap; }\n.state.ok { color: var(--done); background: rgba(79, 213, 154, 0.14); }\n.state.bad { color: var(--warm); background: rgba(255, 180, 94, 0.14); }\n.state.wait { color: var(--ink-2); background: rgba(94, 107, 131, 0.16); }\n\n.hand { display: grid; gap: 0.4em; align-content: start; }\n.hand .h { margin-bottom: 0.05em; }\n.ask { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warm); border-radius: 0.75em; padding: 0.3em 0.9em; display: grid; gap: 0; min-width: 0; line-height: 1.3; }\n.ask .k { font-size: 0.7em; letter-spacing: 0.08em; text-transform: uppercase; color: var(--warm); }\n.ask .v { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.ask .s { font-size: 0.82em; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.ask.alarm { border-left-color: var(--alarm); }\n.ask.alarm .k { color: var(--alarm); }\n.chips { display: flex; flex-wrap: wrap; gap: 0.3em; margin-top: 0.15em; max-height: 3.6em; overflow: hidden; }\n.chips span { font-size: 0.78em; background: var(--ground); border: 1px solid var(--line); border-radius: 999px; padding: 0.1em 0.6em; color: var(--ink-2); }\n.chips b { color: var(--ink); font-family: var(--mono); }\n\n.foot { font-size: 0.8em; color: var(--ink-3); display: flex; justify-content: space-between; gap: 1em; border-top: 1px solid var(--line); padding-top: 0.5em; white-space: nowrap; overflow: hidden; }\n.foot .warn { color: var(--warm); }\n.foot .alarm { color: var(--alarm); font-weight: 600; }\n\n@media (prefers-reduced-motion: no-preference) {\n  .st.full .node { animation: wall-breathe 3.2s ease-in-out infinite; }\n}\n@keyframes wall-breathe { 50% { box-shadow: 0 0 0 0.55em transparent; } }\n\n.flow { font-family: var(--body); font-weight: 400; font-size: 0.62em; color: var(--ink-2); margin-top: 0.3em; white-space: nowrap; }\n.flow b { font-family: var(--mono); color: var(--ink); font-weight: 600; }\n.flow.warn b:first-child { color: var(--warm); }\n.bname small.lead { margin-top: 0.15em; }\n.st .age { font-family: var(--mono); font-size: 0.66em; color: var(--ink-3); white-space: nowrap; }\n.st .age.late { color: var(--warm); font-weight: 600; }\n\n.machine { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr); gap: 0.9em; }\n.mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 0.9em; padding: 0.5em 1em; display: grid; gap: 0.2em; align-content: start; min-width: 0; }\n.mcard .k { font-size: 0.72em; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }\n.mcard .v { font-family: var(--display); font-weight: 800; font-size: 1.75em; line-height: 1.05; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.mcard .v span { font-family: var(--body); font-size: 0.42em; font-weight: 500; color: var(--ink-2); margin-left: 0.5em; letter-spacing: 0; }\n.mcard .s { font-size: 0.82em; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.mcard .s.warn { color: var(--warm); }\n.bars { display: grid; gap: 0.18em; margin-top: 0.1em; }\n.bar { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 0.6em; align-items: center; font-size: 0.8em; }\n.bar .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }\n.bar .fill { height: 0.55em; background: var(--ground); border-radius: 999px; overflow: hidden; }\n.bar .fill i { display: block; height: 100%; background: var(--todo); border-radius: 999px; opacity: 0.8; }\n.bar .amt { font-family: var(--mono); color: var(--ink-2); white-space: nowrap; }\n.rate { display: grid; grid-template-columns: 7em auto minmax(0, 1fr); gap: 0.6em; align-items: baseline; font-size: 0.9em; }\n.rate .rk { color: var(--ink-2); }\n.rate b { font-family: var(--mono); font-size: 1.15em; color: var(--ink); }\n.rate small { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.rate.warn b { color: var(--warm); }\n.rate.alarm b { color: var(--alarm); }\n",
