          "options": {
            "mode": "markdown",
            "content": "**Unfold's front door.** A Work Item from the Vikunja board gets a **Shift** (the whole attempt); each Shift runs one or more **Runs** (a Role such as builder or reviewer, in a Round). A good Shift ends with a pull request **awaiting review** by you. Money is model spend in **US dollars** as LiteLLM reports it. Hover a panel title for what it counts.\n\n[Unfold](https://unfold.webgrip.dev) · [Command Center](/d/dark-factory-command-center) · [Dispatch Plane](/d/dark-factory-dispatch-plane) · [Run Explorer](/d/dark-factory-run-explorer) · [Spend & Attribution](/d/dark-factory-spend-attribution) · [Runner Fleet](/d/dark-factory-runner-fleet) · [LLM Traffic](/d/dark-factory-llm-traffic) · [Forge & Board](/d/dark-factory-forge-board) · [KPI definitions](https://forgejo.webgrip.dev/webgrip/unfold/src/branch/development/docs/reference/kpis.md)"
