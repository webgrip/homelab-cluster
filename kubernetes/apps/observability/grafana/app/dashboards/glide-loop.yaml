                "uid": "ploeg-db"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT 'US' || chr(36) || ' ' || translate(to_char(round(coalesce(sum(COALESCE(a.reconciled_spend, a.observed_spend, CASE WHEN jsonb_typeof(r.usage->'costUsd') = 'number' THEN (r.usage->>'costUsd')::numeric END)), 0)::numeric, 2), 'FM999G999G990D00'), ',.', '.,') AS spend FROM agent_runs r LEFT JOIN run_llm_accounts a ON a.run_token = r.run_token WHERE coalesce(r.finished_at, r.started_at) >= date_trunc('day', now(), 'Europe/Amsterdam') AND r.team IN ($$team)"
