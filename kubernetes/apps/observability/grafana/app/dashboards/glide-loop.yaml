        {
          "id": 24,
          "type": "table",
          "title": "Runs, last 24 hours",
          "description": "Every Run that is pending or running, or started or finished in the last 24 hours. Role and Round come from the Shift plan; Verdict is the reviewer's; Cost is its model spend (US dollars); LLM account shows whether that spend is reconciled with LiteLLM; Node is where the worker pod ran. Workers set no RuntimeClass, so none is shown.",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT coalesce(r.started_at, r.finished_at) AS \"Started\",\n       r.id AS \"Run\",\n       CASE WHEN w.provider = 'vikunja' THEN 'vikunja #' || w.external_id WHEN w.provider = 'manual' THEN 'unfold ' || left(split_part(w.external_id, ':', 2), 8) ELSE w.provider || ' ' || w.external_id END AS \"Work Item\",\n       CASE WHEN w.provider = 'vikunja' THEN 'https://vikunja.webgrip.dev/tasks/' || w.external_id ELSE coalesce(nullif(w.url, ''), 'https://unfold.webgrip.dev') END AS work_item_url,\n       coalesce(nullif(r.role, ''), '(pre-Shift)') AS \"Role\",\n       r.round AS \"Round\",\n       r.state AS \"State\",\n       coalesce(nullif(r.outcome, ''), CASE WHEN r.state = 'finished' THEN '(none)' ELSE '' END) AS \"Outcome\",\n       coalesce(r.failure_reason, '') AS \"Failure reason\",\n       coalesce(r.verdict, '') AS \"Verdict\",\n       'US' || chr(36) || ' ' || translate(to_char(round(coalesce(COALESCE(a.reconciled_spend, a.observed_spend, CASE WHEN jsonb_typeof(r.usage->'costUsd') = 'number' THEN (r.usage->>'costUsd')::numeric END), 0)::numeric, 2), 'FM999G999G990D00'), ',.', '.,') AS \"Cost\",\n       coalesce(a.state, '') AS \"LLM account\",\n       extract(epoch FROM coalesce(r.finished_at, now()) - r.started_at) AS \"Duration\",\n       coalesce(n.node_name, '') AS \"Node\"\nFROM agent_runs r\nJOIN work_items w ON w.id = r.work_item_id\nLEFT JOIN run_llm_accounts a ON a.run_token = r.run_token\nLEFT JOIN LATERAL (\n  SELECT c.node_name FROM checkpoints c\n  WHERE c.work_item_id = r.work_item_id AND c.node_name <> '' AND c.created_at >= r.started_at\n    AND c.created_at <= coalesce(r.finished_at, now())\n  ORDER BY c.created_at LIMIT 1\n) n ON true\nWHERE r.team IN ($$team) AND (r.state IN ('pending', 'running') OR coalesce(r.finished_at, r.started_at) >= now() - interval '24 hours')\nORDER BY r.id DESC"
            }
          ],
