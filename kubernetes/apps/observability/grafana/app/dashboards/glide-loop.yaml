        {
          "id": 20,
          "type": "table",
          "title": "Needs attention",
          "description": "Work Items waiting for a person (needs_human, with the reason Ploeg recorded), Shifts open over 2 hours, LLM accounts stuck in blocked (spend not settled), expired leases, and Runs that failed or got stuck in the selected range.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT * FROM (\n  SELECT w.updated_at AS \"Since\", 'Work Item needs a person' AS \"What\", CASE WHEN w.provider = 'vikunja' THEN 'vikunja #' || w.external_id WHEN w.provider = 'manual' THEN 'unfold ' || left(split_part(w.external_id, ':', 2), 8) ELSE w.provider || ' ' || w.external_id END AS \"Work Item\", CASE WHEN w.provider = 'vikunja' THEN 'https://vikunja.webgrip.dev/tasks/' || w.external_id ELSE coalesce(nullif(w.url, ''), 'https://unfold.webgrip.dev') END AS work_item_url,\n         coalesce((SELECT l.detail->>'reason' FROM audit_log l WHERE l.work_item_id = w.id AND l.action = 'work_item.needs_human' ORDER BY l.at DESC, l.id DESC LIMIT 1),\n                  (SELECT nullif(s.close_reason, '') FROM shifts s WHERE s.work_item_id = w.id ORDER BY s.opened_at DESC LIMIT 1), '') AS \"Reason\"\n  FROM work_items w WHERE w.state = 'needs_human' AND w.team IN ($$team)\n  UNION ALL\n  SELECT s.opened_at, 'Shift open over 2 hours', CASE WHEN w.provider = 'vikunja' THEN 'vikunja #' || w.external_id WHEN w.provider = 'manual' THEN 'unfold ' || left(split_part(w.external_id, ':', 2), 8) ELSE w.provider || ' ' || w.external_id END, CASE WHEN w.provider = 'vikunja' THEN 'https://vikunja.webgrip.dev/tasks/' || w.external_id ELSE coalesce(nullif(w.url, ''), 'https://unfold.webgrip.dev') END, 'round ' || s.round || ', spent ' || 'US' || chr(36) || ' ' || translate(to_char(round(coalesce(s.spent, 0)::numeric, 2), 'FM999G999G990D00'), ',.', '.,') || ' of ' || 'US' || chr(36) || ' ' || translate(to_char(round(coalesce(s.budget, 0)::numeric, 2), 'FM999G999G990D00'), ',.', '.,')\n  FROM shifts s JOIN work_items w ON w.id = s.work_item_id\n  WHERE s.closed_at IS NULL AND s.opened_at < now() - interval '2 hours' AND s.team IN ($$team)\n  UNION ALL\n  SELECT a.updated_at, 'LLM account blocked, spend not settled', CASE WHEN w.provider = 'vikunja' THEN 'vikunja #' || w.external_id WHEN w.provider = 'manual' THEN 'unfold ' || left(split_part(w.external_id, ':', 2), 8) ELSE w.provider || ' ' || w.external_id END, CASE WHEN w.provider = 'vikunja' THEN 'https://vikunja.webgrip.dev/tasks/' || w.external_id ELSE coalesce(nullif(w.url, ''), 'https://unfold.webgrip.dev') END, a.alias || ', observed ' || 'US' || chr(36) || ' ' || translate(to_char(round(coalesce(a.observed_spend, 0)::numeric, 2), 'FM999G999G990D00'), ',.', '.,')\n  FROM run_llm_accounts a JOIN agent_runs r ON r.run_token = a.run_token JOIN work_items w ON w.id = r.work_item_id\n  WHERE a.state = 'blocked' AND r.team IN ($$team)\n  UNION ALL\n  SELECT l.expires_at, 'Lease expired, not reclaimed', CASE WHEN w.provider = 'vikunja' THEN 'vikunja #' || w.external_id WHEN w.provider = 'manual' THEN 'unfold ' || left(split_part(w.external_id, ':', 2), 8) ELSE w.provider || ' ' || w.external_id END, CASE WHEN w.provider = 'vikunja' THEN 'https://vikunja.webgrip.dev/tasks/' || w.external_id ELSE coalesce(nullif(w.url, ''), 'https://unfold.webgrip.dev') END, 'expired ' || to_char(l.expires_at, 'YYYY-MM-DD HH24:MI') || ' UTC'\n  FROM leases l JOIN work_items w ON w.id = l.work_item_id WHERE l.expires_at < now() AND l.team IN ($$team)\n  UNION ALL\n  SELECT r.finished_at, 'Run ' || r.outcome || ' (' || coalesce(nullif(r.role, ''), 'pre-Shift') || ')', CASE WHEN w.provider = 'vikunja' THEN 'vikunja #' || w.external_id WHEN w.provider = 'manual' THEN 'unfold ' || left(split_part(w.external_id, ':', 2), 8) ELSE w.provider || ' ' || w.external_id END, CASE WHEN w.provider = 'vikunja' THEN 'https://vikunja.webgrip.dev/tasks/' || w.external_id ELSE coalesce(nullif(w.url, ''), 'https://unfold.webgrip.dev') END,\n         coalesce(nullif(r.failure_reason, '') || ': ', '') || coalesce(nullif(r.stuck_reason, ''), left(r.summary, 120), '')\n  FROM agent_runs r JOIN work_items w ON w.id = r.work_item_id\n  WHERE r.outcome IN ('failed', 'stuck') AND r.team IN ($$team) AND $$__timeFilter(r.finished_at)\n) x ORDER BY \"Since\" DESC NULLS LAST"
            }
