        {
          "id": 8,
          "type": "stat",
          "title": "Spend today",
          "description": "Model spend of Runs that finished (or started) since midnight, Amsterdam time. Per Run: reconciled LiteLLM spend, else observed spend, else what the harness reported. US dollars.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 4
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
