        {
          "id": 22,
          "type": "table",
          "title": "Recent Work Items",
          "description": "Work Items touched in the selected range, newest first. Shift close reason is from the latest Shift; Pull request is the latest PR link a Run reported; Spend sums all its Runs (US dollars); Shift duration is the latest Shift, still counting if open. Click the Work Item or PR to open it.",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT w.updated_at AS \"Updated\",\n       CASE WHEN w.provider = 'vikunja' THEN 'vikunja #' || w.external_id WHEN w.provider = 'manual' THEN 'unfold ' || left(split_part(w.external_id, ':', 2), 8) ELSE w.provider || ' ' || w.external_id END AS \"Work Item\",\n       CASE WHEN w.provider = 'vikunja' THEN 'https://vikunja.webgrip.dev/tasks/' || w.external_id ELSE coalesce(nullif(w.url, ''), 'https://unfold.webgrip.dev') END AS work_item_url,\n       left(w.title, 70) AS \"Title\",\n       w.state AS \"State\",\n       w.team AS \"Team\",\n       coalesce(nullif(w.target_repo, ''), '') AS \"Repo\",\n       CASE WHEN s.id IS NULL THEN '' WHEN s.closed_at IS NULL THEN 'open (round ' || s.round || ')' ELSE coalesce(nullif(s.close_reason, ''), 'closed') END AS \"Shift close reason\",\n       coalesce(pr.url, '') AS \"Pull request\",\n       'US' || chr(36) || ' ' || translate(to_char(round(coalesce(sp.cost, 0)::numeric, 2), 'FM999G999G990D00'), ',.', '.,') AS \"Spend\",\n       extract(epoch FROM coalesce(s.closed_at, now()) - s.opened_at) AS \"Shift duration\",\n       sp.runs AS \"Runs\"\nFROM work_items w\nLEFT JOIN LATERAL (SELECT * FROM shifts s WHERE s.work_item_id = w.id ORDER BY s.opened_at DESC LIMIT 1) s ON true\nLEFT JOIN LATERAL (\n  SELECT u.link AS url FROM agent_runs r, unnest(r.links) AS u(link)\n  WHERE r.work_item_id = w.id AND u.link LIKE '%/pulls/%' ORDER BY r.id DESC LIMIT 1\n) pr ON true\nLEFT JOIN LATERAL (\n  SELECT sum(COALESCE(a.reconciled_spend, a.observed_spend, CASE WHEN jsonb_typeof(r.usage->'costUsd') = 'number' THEN (r.usage->>'costUsd')::numeric END)) AS cost, count(*) AS runs\n  FROM agent_runs r LEFT JOIN run_llm_accounts a ON a.run_token = r.run_token WHERE r.work_item_id = w.id\n) sp ON true\nWHERE w.team IN ($$team) AND $$__timeFilter(w.updated_at)\nORDER BY w.updated_at DESC\nLIMIT 50"
            }
          ],
