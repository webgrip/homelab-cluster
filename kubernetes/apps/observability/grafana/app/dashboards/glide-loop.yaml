              "rawSql": "WITH shift_settle AS (\n  SELECT s.id AS shift_id, s.work_item_id, s.team, s.branch, s.opened_at, s.closed_at, s.close_reason,\n         st.at AS settled_at, substr(st.action, 11) AS settled_state\n  FROM shifts s\n  JOIN work_items w ON w.id = s.work_item_id AND NOT w.operator_owned\n  CROSS JOIN LATERAL (\n    SELECT l.at, l.action FROM audit_log l\n    WHERE l.work_item_id = s.work_item_id AND l.actor = 'ploegd:shift-engine'\n      AND l.action LIKE 'work_item.%' AND l.at >= s.closed_at\n    ORDER BY l.at, l.id LIMIT 1\n  ) st\n  WHERE s.closed_at IS NOT NULL AND s.team IN ($$team)\n)\n, reviewed AS (\n  SELECT ss.shift_id, ss.branch, ss.settled_at, rv.at AS reviewed_at, rv.detail->>'reason' AS reason\n  FROM shift_settle ss\n  CROSS JOIN LATERAL (\n    SELECT l.at, l.detail FROM audit_log l\n    WHERE l.work_item_id = ss.work_item_id AND l.actor = 'ploegd:review' AND l.at > ss.settled_at\n    ORDER BY l.at, l.id LIMIT 1\n  ) rv\n  WHERE ss.settled_state = 'awaiting_review'\n)\nSELECT count(*) FILTER (WHERE reason = 'pull request merged' AND NOT EXISTS (\n         SELECT 1 FROM audit_log f WHERE f.action = 'forge.review_submitted' AND f.detail->>'branch' = reviewed.branch\n           AND f.at BETWEEN reviewed.settled_at AND reviewed.reviewed_at))::numeric / NULLIF(count(*), 0) AS clean_merge_rate\nFROM reviewed WHERE $$__timeFilter(reviewed_at)"
