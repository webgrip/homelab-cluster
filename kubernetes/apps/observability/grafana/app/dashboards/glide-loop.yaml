        {
          "id": 26,
          "type": "table",
          "title": "Why Shifts did not reach review",
          "description": "Settled Shifts in the range grouped by how the Work Item settled and the Shift's close reason (K1 breakdown).",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 44
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "WITH shift_settle AS (\n  SELECT s.id AS shift_id, s.work_item_id, s.team, s.branch, s.opened_at, s.closed_at, s.close_reason,\n         st.at AS settled_at, substr(st.action, 11) AS settled_state\n  FROM shifts s\n  JOIN work_items w ON w.id = s.work_item_id AND NOT w.operator_owned\n  CROSS JOIN LATERAL (\n    SELECT l.at, l.action FROM audit_log l\n    WHERE l.work_item_id = s.work_item_id AND l.actor = 'ploegd:shift-engine'\n      AND l.action LIKE 'work_item.%' AND l.at >= s.closed_at\n    ORDER BY l.at, l.id LIMIT 1\n  ) st\n  WHERE s.closed_at IS NOT NULL AND s.team IN ($$team)\n)\nSELECT settled_state AS \"Settled as\", coalesce(nullif(close_reason, ''), '(none)') AS \"Shift close reason\", count(*) AS \"Shifts\"\nFROM shift_settle WHERE $$__timeFilter(settled_at)\nGROUP BY 1, 2 ORDER BY 3 DESC"
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            },
            "sortBy": []
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true,
                "cellOptions": {
                  "type": "auto"
                }
              },
              "noValue": "No Shift settled"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Settled as"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "awaiting_review": {
                            "color": "green",
                            "index": 0
                          },
                          "done": {
                            "color": "text",
                            "index": 1
                          },
                          "needs_human": {
                            "color": "red",
                            "index": 2
                          },
                          "queued": {
                            "color": "blue",
                            "index": 3
                          },
                          "leased": {
                            "color": "orange",
