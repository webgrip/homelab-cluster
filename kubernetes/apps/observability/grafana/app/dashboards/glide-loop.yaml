        {
          "id": 10,
          "type": "stat",
          "title": "First-pass ready rate",
          "description": "Settled Shifts that reached awaiting_review with no fix Round (no reviewer request_changes followed by a rewrite) ÷ all settled Shifts, in the selected time range. Excludes Unfold operator sessions.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 4
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "WITH shift_settle AS (\n  SELECT s.id AS shift_id, s.work_item_id, s.team, s.branch, s.opened_at, s.closed_at, s.close_reason,\n         st.at AS settled_at, substr(st.action, 11) AS settled_state\n  FROM shifts s\n  JOIN work_items w ON w.id = s.work_item_id AND NOT w.operator_owned\n  CROSS JOIN LATERAL (\n    SELECT l.at, l.action FROM audit_log l\n    WHERE l.work_item_id = s.work_item_id AND l.actor = 'ploegd:shift-engine'\n      AND l.action LIKE 'work_item.%' AND l.at >= s.closed_at\n    ORDER BY l.at, l.id LIMIT 1\n  ) st\n  WHERE s.closed_at IS NOT NULL AND s.team IN ($$team)\n)\nSELECT count(*) FILTER (WHERE ss.settled_state = 'awaiting_review' AND (SELECT count(DISTINCT v.round) FROM agent_runs v\n          WHERE v.shift_id = ss.shift_id AND v.verdict = 'request_changes'\n            AND EXISTS (SELECT 1 FROM agent_runs f WHERE f.shift_id = v.shift_id AND f.writes AND f.round > v.round)) = 0)::numeric\n       / NULLIF(count(*), 0) AS first_pass_ready_rate\nFROM shift_settle ss WHERE $$__timeFilter(ss.settled_at)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
