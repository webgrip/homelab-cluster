              "rawSql": "WITH shift_settle AS (\n  SELECT s.id AS shift_id, s.work_item_id, s.team, s.branch, s.opened_at, s.closed_at, s.close_reason,\n         st.at AS settled_at, substr(st.action, 11) AS settled_state\n  FROM shifts s\n  JOIN work_items w ON w.id = s.work_item_id AND NOT w.operator_owned\n  CROSS JOIN LATERAL (\n    SELECT l.at, l.action FROM audit_log l\n    WHERE l.work_item_id = s.work_item_id AND l.actor = 'ploegd:shift-engine'\n      AND l.action LIKE 'work_item.%' AND l.at >= s.closed_at\n    ORDER BY l.at, l.id LIMIT 1\n  ) st\n  WHERE s.closed_at IS NOT NULL AND s.team IN ($$team)\n)\n, run_cost AS (\n  SELECT a.state AS account_state, COALESCE(a.reconciled_spend, a.observed_spend, CASE WHEN jsonb_typeof(r.usage->'costUsd') = 'number' THEN (r.usage->>'costUsd')::numeric END) AS cost_usd\n  FROM agent_runs r\n  JOIN work_items w ON w.id = r.work_item_id AND NOT w.operator_owned\n  LEFT JOIN run_llm_accounts a ON a.run_token = r.run_token\n  WHERE r.state = 'finished' AND r.shift_id IS NOT NULL AND r.team IN ($$team) AND $$__timeFilter(r.finished_at)\n)\nSELECT 'US' || chr(36) || ' ' || translate(to_char(round(coalesce((SELECT sum(cost_usd) FROM run_cost) / NULLIF((SELECT count(*) FROM shift_settle WHERE settled_state = 'awaiting_review' AND $$__timeFilter(settled_at)), 0), 0)::numeric, 2), 'FM999G999G990D00'), ',.', '.,') AS cost_per_ready_pr"
