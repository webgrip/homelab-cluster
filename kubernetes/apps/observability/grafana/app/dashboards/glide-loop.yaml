              "rawSql": "WITH shift_settle AS (\n  SELECT s.id AS shift_id, s.work_item_id, s.team, s.branch, s.opened_at, s.closed_at, s.close_reason,\n         st.at AS settled_at, substr(st.action, 11) AS settled_state\n  FROM shifts s\n  JOIN work_items w ON w.id = s.work_item_id AND NOT w.operator_owned\n  CROSS JOIN LATERAL (\n    SELECT l.at, l.action FROM audit_log l\n    WHERE l.work_item_id = s.work_item_id AND l.actor = 'ploegd:shift-engine'\n      AND l.action LIKE 'work_item.%' AND l.at >= s.closed_at\n    ORDER BY l.at, l.id LIMIT 1\n  ) st\n  WHERE s.closed_at IS NOT NULL AND s.team IN ($$team)\n)\n, ready AS (\n  SELECT ss.*, (SELECT count(DISTINCT v.round) FROM agent_runs v\n          WHERE v.shift_id = ss.shift_id AND v.verdict = 'request_changes'\n            AND EXISTS (SELECT 1 FROM agent_runs f WHERE f.shift_id = v.shift_id AND f.writes AND f.round > v.round)) AS fix_rounds,\n         EXISTS (SELECT 1 FROM audit_log q WHERE q.work_item_id = ss.work_item_id AND q.actor LIKE 'webhook:%'\n                 AND q.action = 'work_item.queued' AND q.at > ss.settled_at AND q.at <= ss.settled_at + interval '14 days') AS reassigned\n  FROM shift_settle ss WHERE ss.settled_state = 'awaiting_review' AND $$__timeFilter(ss.settled_at)\n)\nSELECT count(*) FILTER (WHERE fix_rounds > 0)::numeric / NULLIF(count(*), 0) AS \"Fix-Round share\",\n       count(*) FILTER (WHERE reassigned)::numeric / NULLIF(count(*), 0) AS \"Re-assignment rate\"\nFROM ready"
