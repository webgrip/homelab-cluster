            {
              "refId": "D",
              "expr": "max by (uid) (last_over_time(kube_pod_status_ready_time{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"(sbx-)?ploeg-worker-($$team)-.+\"}[$$__range]) - last_over_time(kube_pod_status_scheduled_time{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"(sbx-)?ploeg-worker-($$team)-.+\"}[$$__range]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "id": 8
        },
        {
          "type": "table",
          "title": "Runs per outcome per team · this range",
          "description": "How every Run that finished in the selected range ended, per team. pr_opened and pr_updated are the product. no_change_needed is a reviewer's approval or a builder that found nothing to do. failed and stuck bought nothing. Failed share is amber from 20 % and vermillion from 50 %.",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 31
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "No Run finished in this range."
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "failed"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#d55e00",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "stuck"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#e69f00",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Failed share"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#e69f00",
                          "value": 0.2
                        },
                        {
                          "color": "#d55e00",
                          "value": 0.5
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {},
                "indexByName": {}
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT team AS \"Team\", count(*) AS \"Runs\", count(*) FILTER (WHERE outcome = 'pr_opened') AS \"pr_opened\", count(*) FILTER (WHERE outcome = 'pr_updated') AS \"pr_updated\", count(*) FILTER (WHERE outcome = 'no_change_needed') AS \"no_change_needed\", count(*) FILTER (WHERE outcome = 'failed') AS \"failed\", count(*) FILTER (WHERE outcome = 'stuck') AS \"stuck\", count(*) FILTER (WHERE outcome NOT IN ('pr_opened', 'pr_updated', 'no_change_needed', 'failed', 'stuck')) AS \"other\", count(*) FILTER (WHERE outcome = 'failed')::numeric / NULLIF(count(*), 0) AS \"Failed share\" FROM agent_runs WHERE state = 'finished' AND team IN ($$team) AND $$__timeFilter(finished_at) GROUP BY team ORDER BY team"
            }
          ],
          "id": 9
        },
        {
          "type": "table",
          "title": "Failures by reason per team · this range",
          "description": "Failed Runs split by team, role and failure_reason, with how many were idle-timeout kills and what the failed Runs spent on the model. A reason that repeats for one role is a pattern: timeout on builders usually means the agent loops without printing, infra_node means pods are being evicted.",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 31
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "No Run failed in this range."
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Spent"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "currencyUSD"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Reason"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 130
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {},
                "indexByName": {}
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT r.team AS \"Team\", coalesce(nullif(r.role, ''), 'pre-Shift') AS \"Role\", coalesce(nullif(r.failure_reason, ''), 'unclassified') AS \"Reason\", count(*) AS \"Runs\", count(*) FILTER (WHERE r.failure_reason = 'timeout' AND r.summary ILIKE '%idle timeout%') AS \"Idle kills\", sum(COALESCE(a.reconciled_spend, a.observed_spend, CASE WHEN jsonb_typeof(r.usage->'costUsd') = 'number' THEN (r.usage->>'costUsd')::numeric END)) AS \"Spent\" FROM agent_runs r LEFT JOIN run_llm_accounts a ON a.run_token = r.run_token WHERE r.outcome = 'failed' AND r.team IN ($$team) AND $$__timeFilter(r.finished_at) GROUP BY 1, 2, 3 ORDER BY 4 DESC"
            }
          ],
          "id": 10
        },
        {
          "type": "table",
          "title": "Where the wait goes, per team and role · this range",
          "description": "How long Runs waited between being queued and a worker claiming them, and how long they then ran, per team and role (p50 is the median). A long queue on one slot usually means the previous Run of the same slot was still running: each slot runs one Run at a time. Pod-level detail is on Unfold · Kata overhead.",
          "gridPos": {
            "h": 7,
            "w": 14,
            "x": 0,
            "y": 37
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "No Run finished in this range."
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Queued p50"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Queued max"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ran p50"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ran max"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {},
                "indexByName": {}
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT r.team AS \"Team\", coalesce(nullif(r.role, ''), 'pre-Shift') AS \"Role\", count(*) AS \"Runs\", percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM r.started_at - q.at)) AS \"Queued p50\", max(extract(epoch FROM r.started_at - q.at)) AS \"Queued max\", percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM r.finished_at - r.started_at)) AS \"Ran p50\", max(extract(epoch FROM r.finished_at - r.started_at)) AS \"Ran max\" FROM agent_runs r LEFT JOIN LATERAL (SELECT max(l.at) AS at FROM audit_log l WHERE l.action IN ('round.opened', 'round.reopened') AND l.detail->>'shift' = r.shift_id::text AND l.detail->>'round' = r.round::text AND l.at <= coalesce(r.started_at, now())) q ON true WHERE r.state = 'finished' AND r.team IN ($$team) AND $$__timeFilter(r.finished_at) GROUP BY 1, 2 ORDER BY 1, 2"
            }
          ],
          "id": 11
        },
        {
          "type": "timeseries",
          "title": "Worker pods without room, over time",
          "description": "Worker and sandbox pods the scheduler could not place, per team, over the selected range. Bars that keep coming back mean the Kata nodes are full: see node headroom on Unfold · Kata overhead.",
          "gridPos": {
            "h": 7,
            "w": 10,
            "x": 14,
            "y": 37
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 80,
                "showPoints": "never",
                "pointSize": 6,
                "drawStyle": "bars",
                "lineInterpolation": "linear",
                "spanNulls": false,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (team) (label_replace(label_replace(label_replace(kube_pod_status_unschedulable{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"(sbx-)?ploeg-worker-($$team)-.+\"}, \"pod\", \"$$1\", \"exported_pod\", \"(.+)\"), \"team\", \"$$1\", \"pod\", \"(?:sbx-)?ploeg-worker-([a-z0-9]+)-.+\"), \"role\", \"$$1\", \"pod\", \"(?:sbx-)?ploeg-worker-[a-z0-9]+-(.+)-[a-z0-9]{5}-[a-z0-9]{5}\"))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{team}}"
            }
          ],
          "id": 12
        }
      ]
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: glide-kata
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: boards
  json: |-
    {
      "uid": "glide-kata",
      "title": "Unfold · Kata overhead",
      "description": "What running Unfold's agents inside Kata virtual machines costs compared with plain runc containers: CPU and memory used against what is reserved, node room on the three Kata nodes, and how long a sandbox takes to start. Each panel says what it cannot measure.",
      "tags": [
        "board",
        "glide",
        "ploeg",
        "kata"
      ],
      "schemaVersion": 39,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "timezone": "browser",
      "links": [
        {
          "title": "Unfold · Runs",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/glide-runs",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Unfold · Plant",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/glide-plant",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "type": "dashboards",
          "tags": [
            "board"
          ],
          "title": "Boards",
          "asDropdown": true,
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "targetBlank": false,
          "tooltip": "",
          "url": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "team",
            "label": "Team",
            "type": "query",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "ploeg-db"
            },
            "query": "SELECT DISTINCT team FROM work_items WHERE team <> '' ORDER BY 1",
            "definition": "SELECT DISTINCT team FROM work_items WHERE team <> '' ORDER BY 1",
            "multi": true,
            "includeAll": true,
            "refresh": 1,
            "sort": 1,
            "hide": 0,
            "current": {
              "text": "All",
              "value": "$$__all"
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Run pods in this range",
          "description": "How many Run pods each runtime ran in the selected range. Kata sandboxes are the sbx-ploeg-worker pods: each Run gets its own small virtual machine. runc workers are ordinary containers sharing the node's kernel. The launcher pods Kata teams also start are not counted.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(max by (pod) (label_replace(last_over_time(kube_pod_runtimeclass_name_info{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"sbx-ploeg-worker-($$team)-.+\"}[$$__range]), \"pod\", \"$$1\", \"exported_pod\", \"(.+)\"))) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "kata sandboxes",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "expr": "count(max by (pod) (label_replace(last_over_time(kube_pod_container_info{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_container=\"worker\", exported_pod=~\"ploeg-worker-($$team)-.+\"}[$$__range]), \"pod\", \"$$1\", \"exported_pod\", \"(.+)\"))) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "runc workers",
              "instant": true,
              "range": false
            }
          ],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Kata overhead reserved per pod",
          "description": "What Kubernetes added to the newest Kata sandbox's reservation on top of its own requests, read from the pod's spec.overhead, which the kata RuntimeClass sets (100m CPU and 160 MiB since 2026-09-29; older sandboxes carried 250m CPU, and the per-pod table shows each pod's own). The scheduler counts it when it looks for room, so a Kata Run needs this much more free space than the same Run on runc.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no sandbox in range",
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU cores"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "memory"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(max by (uid) (last_over_time(kube_pod_overhead_cpu_cores{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"sbx-ploeg-worker-($$team)-.+\"}[$$__range])) and on (uid) topk(1, max by (uid) (last_over_time(kube_pod_created{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"sbx-ploeg-worker-($$team)-.+\"}[$$__range]))))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "CPU cores",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "expr": "max(max by (uid) (last_over_time(kube_pod_overhead_memory_bytes{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"sbx-ploeg-worker-($$team)-.+\"}[$$__range])) and on (uid) topk(1, max by (uid) (last_over_time(kube_pod_created{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"sbx-ploeg-worker-($$team)-.+\"}[$$__range]))))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "memory",
              "instant": true,
              "range": false
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Kata CPU spent outside the pod",
          "description": "CPU time Kata's own helper processes (the shim and the hypervisor threads, in the host cgroup /kata_overhead) used, as a share of the CPU time used inside the sandbox pods. This is overhead the pod's own numbers do not show. The memory those helpers hold cannot be measured here: cAdvisor reports zero memory for /kata_overhead because the memory controller is not enabled on it.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no sandbox in range",
              "unit": "percentunit",
              "decimals": 1,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (id) (max_over_time(container_cpu_usage_seconds_total{job=\"cadvisor\", namespace=\"ploeg\", id=~\"/kata_overhead/.+\", pod=~\"sbx-ploeg-worker-($$team)-.+\"}[$$__range]))) / sum(max by (pod) (max_over_time(container_cpu_usage_seconds_total{job=\"cadvisor\", namespace=\"ploeg\", container=\"\", id=~\"/kubepods(/[a-z]+)?/pod[^/]+\", pod=~\"sbx-ploeg-worker-($$team)-.+\"}[$$__range])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 3
        },
        {
          "type": "text",
          "title": "What this board cannot see",
          "gridPos": {
            "h": 10,
            "w": 7,
            "x": 17,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "- **Kata helper memory.** The shim and hypervisor run in the host cgroup `/kata_overhead`; cAdvisor reports CPU for it but zero memory, because the memory controller is not enabled there. The 160 MiB reserved overhead is a promise, not a measurement.\n- **Containers inside a sandbox.** cAdvisor sees a Kata pod as one virtual machine. Per-container CPU and memory inside the guest would need an exporter inside the sandbox.\n- **Guest memory is host memory.** A Kata pod's working set counts the guest kernel and guest page cache. That is the real cost to the node, but it is not what the agent process itself used.\n- **Which Run a pod served** is known only through the checkpoint a worker writes after cloning; a Run that dies before that has no pod on record. The per-Run join lives on Unfold · Runs."
          },
          "id": 4
        },
