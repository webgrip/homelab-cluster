              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT r.finished_at AS \"Finished\", r.id AS \"Run\", r.team AS \"Team\", coalesce(nullif(r.role, ''), 'pre-Shift') AS \"Role\", r.round AS \"Round\", CASE WHEN w.provider = 'vikunja' THEN 'vikunja #' || w.external_id WHEN w.provider = 'manual' THEN 'vloer ' || left(split_part(w.external_id, ':', 2), 8) ELSE w.provider || ' ' || w.external_id END AS \"Work Item\", CASE WHEN w.provider = 'vikunja' THEN 'https://vikunja.webgrip.dev/tasks/' || w.external_id ELSE coalesce(nullif(w.url, ''), 'https://vloer.webgrip.dev') END AS work_item_url, coalesce(substring(r.summary from '^([a-z0-9_-]+) run '), '') AS \"Harness\", coalesce(r.outcome, '') AS \"Outcome\", coalesce(r.failure_reason, '') AS \"Failure reason\", coalesce(cp.node_name, '') AS \"Node\", coalesce(cp.pod_uid, 'run-' || r.id) AS uid, extract(epoch FROM r.started_at - q.at) AS \"Queued → claimed\", extract(epoch FROM r.finished_at - r.started_at) AS \"Ran for\", COALESCE(a.reconciled_spend, a.observed_spend, CASE WHEN jsonb_typeof(r.usage->'costUsd') = 'number' THEN (r.usage->>'costUsd')::numeric END) AS \"Spent\", r.authorized AS \"Authorized\", left(r.summary, 140) AS \"Summary\" FROM agent_runs r JOIN work_items w ON w.id = r.work_item_id LEFT JOIN run_llm_accounts a ON a.run_token = r.run_token LEFT JOIN LATERAL (SELECT max(l.at) AS at FROM audit_log l WHERE l.action IN ('round.opened', 'round.reopened') AND l.detail->>'shift' = r.shift_id::text AND l.detail->>'round' = r.round::text AND l.at <= coalesce(r.started_at, now())) q ON true LEFT JOIN LATERAL (SELECT c.node_name, c.pod_uid FROM checkpoints c WHERE c.work_item_id = r.work_item_id AND c.pod_uid <> '' AND c.created_at >= r.started_at AND c.created_at <= coalesce(r.finished_at, now()) ORDER BY c.created_at DESC LIMIT 1) cp ON true WHERE r.state = 'finished' AND r.team IN ($$team) AND $$__timeFilter(r.finished_at) ORDER BY r.finished_at DESC LIMIT 100"
            },
            {
              "refId": "B",
              "expr": "max by (uid, runtime) (label_replace(last_over_time(kube_pod_runtimeclass_name_info{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"sbx-ploeg-worker-($$team)-.+\"}[$$__range]), \"runtime\", \"kata\", \"\", \"\")) or on (uid) max by (uid, runtime) (label_replace(last_over_time(kube_pod_container_info{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"ploeg-worker-($$team)-.+\"}[$$__range]), \"runtime\", \"runc\", \"\", \"\"))",
