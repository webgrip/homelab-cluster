---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: glide-runs
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: boards
  json: |-
    {
      "uid": "glide-runs",
      "title": "Unfold · Runs",
      "description": "Per-Run view of Unfold: what is running now, what just finished and how, where the time went from queued to finished, and why Runs fail. Built from Ploeg's database and Kubernetes.",
      "tags": [
        "board",
        "glide",
        "ploeg"
      ],
      "schemaVersion": 39,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "links": [
        {
          "title": "Unfold · Plant",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/glide-plant",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Unfold · Kata overhead",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/glide-kata",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Unfold Loop",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/glide-loop",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "type": "dashboards",
          "tags": [
            "board"
          ],
          "title": "Boards",
          "asDropdown": true,
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "targetBlank": false,
          "tooltip": "",
          "url": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "team",
            "label": "Team",
            "type": "query",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "ploeg-db"
            },
            "query": "SELECT DISTINCT team FROM work_items WHERE team <> '' ORDER BY 1",
            "definition": "SELECT DISTINCT team FROM work_items WHERE team <> '' ORDER BY 1",
            "multi": true,
            "includeAll": true,
            "refresh": 1,
            "sort": 1,
            "hide": 0,
            "current": {
              "text": "All",
              "value": "$$__all"
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Runs right now",
          "description": "Straight from Ploeg's database. Running is a Run a worker has claimed and not finished. Waiting for a worker is a Run Ploeg has queued (a Round opened) that no worker pod has picked up yet. Each team and role has one worker slot, so a second Run for the same slot waits here by design.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT count(*) FILTER (WHERE state = 'running') AS \"running\", count(*) FILTER (WHERE state = 'pending') AS \"waiting for a worker\" FROM agent_runs WHERE state IN ('running', 'pending') AND team IN ($$team)"
            }
          ],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Worker pods waiting for room",
          "description": "Worker and sandbox pods Kubernetes has not started yet. No node has room means the scheduler looked at every node and none had enough unreserved CPU or memory (or the right Kata label): the Run waits until something finishes. Pending, any reason also counts pods that are only pulling their image. Amber from one pod without room.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 5,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "no node has room"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#e69f00",
                          "value": 1
                        },
                        {
                          "color": "#d55e00",
                          "value": 3
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_unschedulable{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"(sbx-)?ploeg-worker-($$team)-.+\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "no node has room",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "expr": "sum(kube_pod_status_phase{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"(sbx-)?ploeg-worker-($$team)-.+\", phase=\"Pending\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "pending, any reason",
              "instant": true,
              "range": false
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Idle-timeout kills · 24 h",
          "description": "Runs the worker stopped in the last 24 hours because the agent went quiet. No output for too long is PLOEG_HARNESS_IDLE_TIMEOUT (45 minutes on the builders): the harness printed nothing, so the worker killed it. Hit the hard limit is PLOEG_HARNESS_TIMEOUT, the total time cap. Both are failure_reason timeout; the split reads the Run's summary text. Every kill still spent money on the model.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 11,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 1
                  },
                  {
                    "color": "#d55e00",
                    "value": 3
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT count(*) FILTER (WHERE r.failure_reason = 'timeout' AND r.summary ILIKE '%idle timeout%') AS \"no output for too long\", count(*) FILTER (WHERE r.failure_reason = 'timeout' AND NOT (r.failure_reason = 'timeout' AND r.summary ILIKE '%idle timeout%')) AS \"hit the hard limit\" FROM agent_runs r WHERE r.finished_at > now() - interval '24 hours' AND r.team IN ($$team)"
            }
          ],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Failed Runs by reason · this range",
          "description": "Why failed Runs ended, over the selected time range. infra_node: the pod or node went away. infra_llm: the model gateway failed. timeout: the idle or total time limit. agent_error: the agent program crashed. budget: the Run hit its token ceiling. lease_lost: the Run stopped renewing its lock and the sweeper took it back.",
          "gridPos": {
            "h": 5,
            "w": 7,
            "x": 17,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^(count|kills)$$/",
              "values": true
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no failed Run",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#d55e00"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT coalesce(nullif(failure_reason, ''), 'unclassified') AS reason, count(*) AS count FROM agent_runs WHERE outcome = 'failed' AND team IN ($$team) AND $$__timeFilter(finished_at) GROUP BY 1 ORDER BY 2 DESC"
            }
          ],
          "id": 4
        },
        {
          "type": "table",
          "title": "Runs in flight",
          "description": "Every Run Ploeg has queued or started and not finished. Waited for a worker is from the Round opening to a worker claiming the Run: it covers the KEDA poll, pod scheduling, the pod booting and the worker starting. Node comes from the checkpoint the worker writes once it has cloned the repository, so a Run still starting shows none yet. Authorized is the most this Run may spend; the live spend per key is in the table beside Worker pods now, matched by Key. Harness is not stored per Run in Ploeg.",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "ploeg-db"
          },
          "options": {
            "showHeader": true,
            "cellHeight": "md",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "No Run is running or waiting."
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Work Item"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 120
                  },
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open the ticket",
                        "url": "$${__data.fields.work_item_url}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "work_item_url"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "State"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "running": {
                            "text": "running",
                            "color": "#56b4e9"
                          },
                          "pending": {
                            "text": "waiting",
                            "color": "#e69f00"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 90
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Queued for"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.width",
                    "value": 100
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Waited for a worker"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#e69f00",
                          "value": 600
                        },
                        {
                          "color": "#d55e00",
                          "value": 3600
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Running for"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.width",
                    "value": 110
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Authorized"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "currencyUSD"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "custom.width",
                    "value": 100
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Run"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 60
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Round"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 70
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Team"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {},
                "indexByName": {}
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "ploeg-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT r.id AS \"Run\", r.team AS \"Team\", coalesce(nullif(r.role, ''), 'pre-Shift') AS \"Role\", r.round AS \"Round\", CASE WHEN w.provider = 'vikunja' THEN 'vikunja #' || w.external_id WHEN w.provider = 'manual' THEN 'vloer ' || left(split_part(w.external_id, ':', 2), 8) ELSE w.provider || ' ' || w.external_id END AS \"Work Item\", CASE WHEN w.provider = 'vikunja' THEN 'https://vikunja.webgrip.dev/tasks/' || w.external_id ELSE coalesce(nullif(w.url, ''), 'https://vloer.webgrip.dev') END AS work_item_url, left(w.title, 60) AS \"Title\", r.state AS \"State\", extract(epoch FROM now() - q.at) AS \"Queued for\", extract(epoch FROM coalesce(r.started_at, now()) - q.at) AS \"Waited for a worker\", extract(epoch FROM now() - r.started_at) AS \"Running for\", coalesce(cp.node_name, '') AS \"Node\", r.authorized AS \"Authorized\", 'ploeg-' || left(r.run_token, 12) AS \"Key\" FROM agent_runs r JOIN work_items w ON w.id = r.work_item_id LEFT JOIN LATERAL (SELECT max(l.at) AS at FROM audit_log l WHERE l.action IN ('round.opened', 'round.reopened') AND l.detail->>'shift' = r.shift_id::text AND l.detail->>'round' = r.round::text AND l.at <= coalesce(r.started_at, now())) q ON true LEFT JOIN LATERAL (SELECT c.node_name, c.pod_uid FROM checkpoints c WHERE c.work_item_id = r.work_item_id AND c.pod_uid <> '' AND c.created_at >= r.started_at AND c.created_at <= coalesce(r.finished_at, now()) ORDER BY c.created_at DESC LIMIT 1) cp ON true WHERE r.state IN ('pending', 'running') AND r.team IN ($$team) ORDER BY r.state DESC, q.at"
            }
          ],
          "id": 5
        },
        {
          "type": "table",
          "title": "Worker pods now",
          "description": "Worker pods that are pending or running now. A Run on a Kata team uses two pods: a small launcher (ploeg-worker-...) on the normal runtime and the sandbox (sbx-ploeg-worker-...) that does the work in a Kata virtual machine. Runtime is blank for normal (runc) pods. No room is yes while the scheduler cannot find a node with enough unreserved CPU or memory. Memory now is what the pod's cgroup holds; for a Kata sandbox that is the whole virtual machine.",
          "gridPos": {
            "h": 7,
            "w": 14,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "showHeader": true,
            "cellHeight": "md",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "No worker pod is pending or running."
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Age"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Memory now"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.width",
                    "value": 100
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Runtime"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "kata": {
                            "text": "kata",
                            "color": "#56b4e9"
                          },
                          "runc": {
                            "text": "runc",
                            "color": "#898781"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "No room"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#d55e00",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "no"
                          },
                          "1": {
                            "text": "yes"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Phase"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Pending": {
                            "text": "Pending",
                            "color": "#e69f00"
                          },
                          "Running": {
                            "text": "Running",
                            "color": "#56b4e9"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 85
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value #A": true,
                  "Value #B": true,
                  "Value #C": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "team": "Team",
                  "role": "Role",
                  "node": "Node",
                  "phase": "Phase",
                  "runtime": "Runtime",
                  "Value #D": "Age",
                  "Value #E": "No room",
                  "Value #F": "Memory now"
                },
                "indexByName": {
                  "Pod": 0,
                  "Team": 1,
                  "Role": 2,
