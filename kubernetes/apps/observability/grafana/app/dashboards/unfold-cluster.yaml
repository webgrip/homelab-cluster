---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: unfold-cluster
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  allowCrossNamespaceImport: false
  folderRef: unfold
  json: |-
    {
      "schemaVersion": 39,
      "title": "Unfold cluster",
      "uid": "unfold-cluster",
      "timezone": "browser",
      "tags": [
        "unfold",
        "kubernetes",
        "talos"
      ],
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "links": [
        {
          "title": "Unfold cloud costs",
          "type": "link",
          "url": "/d/unfold-cloud-costs"
        }
      ],
      "panels": [
        {
          "id": 2,
          "type": "row",
          "title": "Cluster",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Nodes Ready",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "sum(kube_node_status_condition{cluster=\"unfold\",condition=\"Ready\",status=\"true\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Nodes",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "count(kube_node_info{cluster=\"unfold\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "API servers answering",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "sum(up{cluster=\"unfold\",job=\"apiserver\"}) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "etcd has a leader",
          "description": "Needs the Talos patch that serves etcd metrics on port 2381.",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "min(etcd_server_has_leader{cluster=\"unfold\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "No",
                      "color": "red"
                    },
                    "1": {
                      "text": "Yes",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Flux resources not Ready",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "count(flux_resource_info{cluster=\"unfold\",ready=\"False\"}) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Newest sample age",
          "description": "How old the most recent sample from Unfold is. Above a few minutes the remote write over the tailnet is failing or lagging.",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "time() - max(timestamp(up{cluster=\"unfold\"}))",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 120
                  },
                  {
                    "color": "red",
                    "value": 600
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Pods not running",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "sum(kube_pod_status_phase{cluster=\"unfold\",phase=~\"Pending|Failed|Unknown\"}) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Container restarts, 1h",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{cluster=\"unfold\"}[1h])) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 3
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Scrape targets down",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "count(up{cluster=\"unfold\"} == 0) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Last etcd backup",
          "description": "Time since the etcd-backup CronJob last succeeded. It runs every 6 hours; the alert fires at 7.",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "time() - max(kube_cronjob_status_last_successful_time{cluster=\"unfold\",namespace=\"etcd-backup\",cronjob=\"etcd-backup\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 25200
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Spend this month",
          "description": "Hetzner project unfold, net, from the homelab's hcloud-cost-exporter.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(hcloud_cost_resource_month_to_date_eur{project=\"unfold\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2,
              "links": [
                {
                  "title": "Unfold cloud costs",
                  "url": "/d/unfold-cloud-costs"
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Projected month",
          "description": "If every resource lives to the end of the month. The cap in RFC 0001 is 185 EUR.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(hcloud_cost_resource_projected_month_eur{project=\"unfold\"})",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 150
                  },
                  {
                    "color": "red",
                    "value": 185
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2,
              "links": [
                {
                  "title": "Unfold cloud costs",
                  "url": "/d/unfold-cloud-costs"
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          }
        },
        {
          "id": 15,
          "type": "row",
          "title": "Nodes",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "panels": []
        },
        {
          "id": 16,
          "type": "table",
          "title": "Nodes",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "unfold-prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "max by (node) (kube_node_status_condition{cluster=\"unfold\",condition=\"Ready\",status=\"true\"})",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "1 - avg by (node) (rate(node_cpu_seconds_total{cluster=\"unfold\",mode=\"idle\"}[5m]))",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "1 - sum by (node) (node_memory_MemAvailable_bytes{cluster=\"unfold\"}) / sum by (node) (node_memory_MemTotal_bytes{cluster=\"unfold\"})",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "1 - max by (node) (node_filesystem_avail_bytes{cluster=\"unfold\",mountpoint=\"/var\"}) / max by (node) (node_filesystem_size_bytes{cluster=\"unfold\",mountpoint=\"/var\"})",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{cluster=\"unfold\",resource=\"cpu\"}) / sum by (node) (kube_node_status_allocatable{cluster=\"unfold\",resource=\"cpu\"})",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "F",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{cluster=\"unfold\",resource=\"memory\"}) / sum by (node) (kube_node_status_allocatable{cluster=\"unfold\",resource=\"memory\"})",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "G",
              "datasource": {
                "type": "prometheus",
                "uid": "unfold-prometheus"
              },
              "expr": "count by (node) (kube_pod_info{cluster=\"unfold\"})",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "Ready",
                  "Value #B": "CPU used",
                  "Value #C": "Memory used",
                  "Value #D": "/var used",
                  "Value #E": "CPU requested",
                  "Value #F": "Memory requested",
                  "Value #G": "Pods"
                },
                "indexByName": {
                  "node": 0,
                  "Ready": 1,
                  "CPU used": 2,
                  "Memory used": 3,
                  "/var used": 4,
                  "CPU requested": 5,
                  "Memory requested": 6,
                  "Pods": 7
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU used"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Memory used"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "/var used"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU requested"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 1
