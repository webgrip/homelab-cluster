          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 87
          },
          "panels": [
            {
              "type": "logs",
              "title": "ploegd warnings and errors",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "description": "Ploeg's controller at WARN and ERROR.",
              "options": {
                "showTime": true,
                "wrapLogMessage": true,
                "sortOrder": "Descending",
                "enableLogDetails": true,
                "dedupStrategy": "exact"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "{namespace=\"ploeg\", container=\"ploegd\"} ~\"level=(WARN|ERROR)\"",
                  "queryType": "instant",
                  "datasource": {
                    "type": "victoriametrics-logs-datasource",
                    "uid": "victorialogs"
                  }
                }
              ],
              "gridPos": {
                "h": 10,
                "w": 24,
                "x": 0,
