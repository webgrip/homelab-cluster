apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: wall-glide
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: walls
  json: |-
    {
      "uid": "wall-glide",
      "title": "Wall · Unfold",
      "description": "The Unfold plant board's first screen, for a TV.",
      "tags": [
        "wall",
        "glide"
      ],
      "schemaVersion": 39,
      "editable": false,
      "graphTooltip": 0,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "timepicker": {
        "hidden": true
      },
      "links": [
        {
          "title": "Unfold · Plant",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/glide-plant",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "team",
            "label": "Team",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(ploeg_work_items_count, team)",
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$$__all"
            },
            "options": [],
            "allValue": ".*",
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Runs, right now",
          "description": "Running is Runs Ploeg has started and not finished (the work-items exporter reads `finished_at IS NULL`). Waiting for a pod is KEDA's read of pending Runs across every ploeg-worker ScaledJob: above zero for long means the node pool has no room for a worker. Worker pods is pods in phase Running. Failed pods is worker pods left in phase Failed, amber from one: open the pod's events, it is usually an OOM kill or a sandbox that never started.",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "waiting for a pod"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#e69f00",
                          "value": 1
                        },
                        {
                          "color": "#d55e00",
                          "value": 4
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "failed pods"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#e69f00",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ploeg_agent_runs_count{outcome=\"running\", team=~\"$$team\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "running",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "expr": "sum(keda_scaler_metrics_value{scaledObject=~\"ploeg-worker-.+\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "waiting for a pod",
              "instant": true,
              "range": false
            },
            {
              "refId": "C",
              "expr": "sum(kube_pod_status_phase{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"ploeg-worker-.+\", phase=\"Running\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "worker pods",
              "instant": true,
              "range": false
            },
            {
              "refId": "D",
              "expr": "sum(kube_pod_status_phase{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"ploeg-worker-.+\", phase=\"Failed\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "failed pods",
              "instant": true,
              "range": false
            }
          ],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Waiting on a person",
          "description": "Work Items no agent will move until a person does. Review is a pull request ready for you; needs a human is a Work Item an agent gave up on or could not start, with the reason in Unfold. Amber from one, because both are the queue in front of the owner, not in front of the machine.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ploeg_work_items_count{state=\"awaiting_review\", team=~\"$$team\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "review",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "expr": "sum(ploeg_work_items_count{state=\"needs_human\", team=~\"$$team\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "needs a human",
              "instant": true,
              "range": false
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Oldest queued Work Item",
          "description": "Age of the oldest Work Item in state queued, per team. Queued means assigned and not yet leased: a worker should pick it up within minutes. Amber from an hour, vermillion from six. A Work Item Unfold owns (operator_owned) also counts here but is started from Unfold, not by KEDA, so an old one on the unfold team is a person who has not pressed start.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 13,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "nothing queued",
              "unit": "s",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 3600
                  },
                  {
                    "color": "#d55e00",
                    "value": 21600
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (team) (ploeg_work_items_oldest_age_seconds{state=\"queued\", team=~\"$$team\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{team}}",
              "instant": true,
              "range": false
            }
          ],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Expired leases",
          "description": "Writer leases past their expiry that the sweep has not reclaimed. The sweep runs every 15 seconds, so one here means the sweep itself is stuck and a Work Item is locked against every other writer.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "valueSize": 48
            }
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ploeg_leases_expired_not_reclaimed{team=~\"$$team\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 4
        },
        {
          "type": "stat",
          "title": "Ploeg DB seen",
          "description": "Whether ploeg-work-items-exporter can query the Ploeg database. At no every Ploeg number on this board is frozen at its last value.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 21,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "valueSize": 48
            }
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 0
                  },
                  {
                    "color": "#898781",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "no"
                    },
                    "1": {
                      "text": "yes"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(pg_up{job=\"ploeg-work-items-exporter\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 5
        },
        {
          "type": "table",
          "title": "Failed and stuck Runs · 30 days",
          "description": "Every Run in the exporter's 30-day window whose outcome was failed or stuck, newest first, with what its per-Run model key spent. The same ticket failing several times is a Work Item the agents cannot do as written: refine it or take it back. Failure reasons are in Ploeg's database (agent_runs.failure_reason); the Unfold Loop board reads them.",
          "gridPos": {
            "h": 10,
            "w": 14,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "showHeader": true,
            "cellHeight": "md",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "No Run failed or got stuck in 30 days."
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Started"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  },
                  {
                    "id": "custom.width",
                    "value": 130
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ran for"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.width",
                    "value": 90
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Spent"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "currencyUSD"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Outcome"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "failed": {
                            "text": "failed",
                            "color": "#d55e00"
                          },
                          "stuck": {
                            "text": "stuck",
                            "color": "#e69f00"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 90
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "team": "Team",
                  "outcome": "Outcome",
                  "ticket": "Ticket",
                  "provider": "Tracker",
                  "Value #A": "Ran for",
                  "Value #B": "Started",
                  "Value #C": "Spent",
                  "key_alias": "Key"
                },
                "indexByName": {
                  "Started": 0,
                  "Team": 1,
                  "Outcome": 2,
                  "Tracker": 3,
                  "Ticket": 4,
                  "Ran for": 5,
                  "Spent": 6,
                  "Key": 7
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Started",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "max by (key_alias, team, outcome, ticket, provider) (ploeg_run_duration_seconds{outcome=~\"failed|stuck\", team=~\"$$team\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "max by (key_alias) (ploeg_run_started_epoch{outcome=~\"failed|stuck\", team=~\"$$team\"}) * 1000",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "C",
              "expr": "max by (key_alias) (litellm_run_spend{key_alias=~\"ploeg-.*\"}) and on (key_alias) max by (key_alias) (ploeg_run_duration_seconds{outcome=~\"failed|stuck\", team=~\"$$team\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "id": 6
        },
        {
          "type": "timeseries",
          "title": "Runs waiting for a pod, per ScaledJob",
          "description": "Pending Runs per team and role as KEDA reads them, against running worker pods. A pool that stays above zero while pods do not rise is capacity: the node pool is full or the ScaledJob is paused.",
          "gridPos": {
            "h": 10,
            "w": 10,
            "x": 14,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 6,
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "spanNulls": false,
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "worker pods running"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#898781"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (scaledObject) (keda_scaler_metrics_value{scaledObject=~\"ploeg-worker-.+\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{scaledObject}}"
            },
            {
              "refId": "B",
              "expr": "sum(kube_pod_status_phase{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"ploeg-worker-.+\", phase=\"Running\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "worker pods running"
            }
          ],
          "id": 7
        },
        {
          "type": "bargauge",
          "title": "Run outcomes · 30 days",
          "description": "How the Runs of the last 30 days ended. pr_opened and pr_updated are the product; no_change_needed is an honest answer that still cost money; failed and stuck are the ones to read. Neutral bars: this is a mix to watch drift in, not a tile to act on.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 7,
            "x": 0,
            "y": 15
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "valueMode": "text",
            "namePlacement": "left",
            "showUnfilled": true,
            "sizing": "auto",
            "minVizWidth": 8,
            "minVizHeight": 12,
            "maxVizHeight": 26,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "text": {
              "titleSize": 13,
              "valueSize": 18
            }
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "noValue": "no data",
              "color": {
                "mode": "fixed",
                "fixedColor": "#3987e5"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (outcome) (ploeg_agent_runs_count{outcome!=\"running\", team=~\"$$team\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{outcome}}",
              "instant": true,
              "range": false
            }
          ],
          "id": 8
        },
        {
          "type": "stat",
          "title": "Model spend today, per provider",
          "description": "What LiteLLM has recorded as spent today per provider, every caller included (Unfold, Omnigraph, chat). Grey: Unfold's own per-Run budgets are enforced in Ploeg, and the SLO rules alert on budget hits.",
          "gridPos": {
            "h": 4,
            "w": 7,
            "x": 7,
            "y": 15
          },
          "datasource": {
