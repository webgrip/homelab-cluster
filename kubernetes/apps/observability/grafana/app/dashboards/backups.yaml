---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: backups
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  allowCrossNamespaceImport: false
  folderRef: storage
  json: |-
    {
      "schemaVersion": 39,
      "title": "Backups",
      "uid": "backups",
      "timezone": "browser",
      "tags": [
        "backups",
        "storage",
        "dr"
      ],
      "editable": false,
      "graphTooltip": 0,
      "refresh": "5m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Datasets",
          "description": "Datasets in the backup inventory (recording rule backup:dataset_copies).",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(backup:dataset_copies) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Datasets with a drill",
          "description": "Inventory datasets whose restore is drilled (drill=weekly or daily).",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(backup:dataset_copies{drill=~\"weekly|daily\"}) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Verified in window",
          "description": "Drilled datasets whose last verified restore is inside the drill window: 8 days for weekly drills, 2 days for daily ones.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count((backup:dataset_copies{drill=\"weekly\"} and on (dataset) ((time() - backup:restore_last_success_timestamp_seconds) < 691200)) or (backup:dataset_copies{drill=\"daily\"} and on (dataset) ((time() - backup:restore_last_success_timestamp_seconds) < 172800))) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Datasets with 0 or 1 off-site copy",
          "description": "Datasets with fewer than two independent off-site copies. The 3-2-1-1-0 target is zero.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 10,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(backup:dataset_copies <= 1) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "garage-fsn1 free",
          "description": "Free space on the off-site Garage host's data volume.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 14,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(garage_local_disk_avail{job=\"garage-offsite\", volume=\"data\"})",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "decbytes",
              "decimals": 1,
              "noValue": "no data",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 50000000000.0
                  },
                  {
                    "color": "green",
                    "value": 100000000000.0
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "garage-fsn1 time to full",
          "description": "Free space divided by the 7-day shrink rate. Below 14 days a human must act (quota, retention or capacity).",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 17,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(garage_local_disk_avail{job=\"garage-offsite\", volume=\"data\"}) / clamp_min(-deriv(min(garage_local_disk_avail{job=\"garage-offsite\", volume=\"data\"})[7d:1h]), 0.001)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "noValue": "no data",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1209600
                  },
                  {
                    "color": "green",
                    "value": 2592000
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Backup alerts firing",
          "description": "Firing alerts about backups, restore drills and the off-site target.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\", alertname=~\"Backup.*|CNPG(BackupFailed|NoRecentBackup|WALArchivingFailed|RestoreTest.*|DisasterRecoveryCheckStale)|Longhorn(BackupFailed|VolumeBackupStale)|OpenBaoSnapshotStale|HomelabEtcdBackupStale|GarageOffsite.*\"}) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Datasets",
          "description": "One row per dataset: last completed backup, last verified restore and independent off-site copies. Red: backup older than 36 h, verified restore older than 8 days or never, no off-site copy.",
          "gridPos": {
            "h": 18,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (dataset, kind, tier, drill, targets) (backup:dataset_copies)",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "max by (dataset) (time() - backup:last_success_timestamp_seconds)",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "expr": "max by (dataset) (time() - backup:restore_last_success_timestamp_seconds)",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "dataset",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true
                },
                "indexByName": {
                  "dataset": 0,
                  "kind": 1,
                  "tier": 2,
                  "Value #B": 3,
                  "Value #C": 4,
                  "Value #A": 5,
                  "drill": 6,
                  "targets": 7
                },
                "renameByName": {
                  "dataset": "Dataset",
                  "kind": "Kind",
                  "tier": "Tier",
                  "drill": "Drill",
                  "targets": "Targets",
                  "Value #A": "Off-site copies",
                  "Value #B": "Last backup (age)",
                  "Value #C": "Last verified restore (age)"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Tier"
                  },
                  {
                    "field": "Dataset"
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last backup (age)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 129600
                        }
                      ]
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "special",
                        "options": {
                          "match": "null",
                          "result": {
                            "text": "never",
                            "color": "red",
                            "index": 0
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last verified restore (age)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 691200
                        }
                      ]
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "special",
                        "options": {
                          "match": "null",
                          "result": {
                            "text": "never",
                            "color": "red",
                            "index": 0
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Off-site copies"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "green",
                          "value": 2
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Planned monthly cost by target",
          "description": "Static plan from recording rule backup:target_monthly_cost_eur (euro per month, excl. VAT). Phase 2 is designed, not bought.",
          "gridPos": {
            "h": 6,
            "w": 16,
            "x": 0,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (target, phase) (backup:target_monthly_cost_eur)",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "target": 0,
                  "phase": 1,
                  "Value": 2
                },
                "renameByName": {
                  "target": "Target",
                  "phase": "Phase",
                  "Value": "EUR / month"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Phase"
                  },
                  {
                    "field": "Target"
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": true,
              "reducer": [
                "sum"
              ],
              "fields": [
                "EUR / month"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "EUR / month"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "currencyEUR"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Planned total per month",
          "description": "Sum of every target in the cost plan, euro per month excl. VAT.",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(backup:target_monthly_cost_eur) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2,
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        }
      ]
    }
