---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: unfold-cloud-costs
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  allowCrossNamespaceImport: false
  folderRef: executive
  json: |-
    {
      "schemaVersion": 39,
      "title": "Unfold cloud costs",
      "uid": "unfold-cloud-costs",
      "timezone": "browser",
      "tags": [
        "finops",
        "cost",
        "hetzner",
        "unfold"
      ],
      "editable": true,
      "graphTooltip": 0,
      "refresh": "5m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "links": [
        {
          "title": "FinOps & Cost",
          "url": "/d/exec-finops",
          "type": "link",
          "icon": "dashboard"
        }
      ],
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**Hetzner Cloud project Unfold** (unfold-cluster). Net EUR, VAT reverse-charged. Hetzner bills every started hour at the hourly price and never more than the monthly price per resource per calendar month (UTC); snapshots bill per GB per month. Figures cover resources that exist now: something deleted earlier this month is on the invoice but not here. Source: `hcloud-cost-exporter`, refreshed every 5 minutes. Runbook: hetzner-cloud-costs."
          }
        },
        {
          "id": 2,
          "type": "row",
          "title": "Spend this month",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "panels": []
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Month to date",
          "description": "Started hours this month x hourly price, capped at each resource's monthly price.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (kind, id) (hcloud_cost_resource_month_to_date_eur{project=\"unfold\"}))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Projected end of month",
          "description": "Month to date plus every current resource running until the 1st, each capped at its monthly price. Budget alert at EUR 50.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (kind, id) (hcloud_cost_resource_projected_month_eur{project=\"unfold\"}))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 40
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Full-month run-rate",
          "description": "Sum of monthly caps: what a whole month of the current inventory costs.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (kind, id) (hcloud_cost_resource_monthly_cap_eur{project=\"unfold\"}))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Burn rate per hour",
          "description": "Sum of hourly prices of the current inventory.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(max by (kind, id) (hcloud_cost_resource_hourly_eur{project=\"unfold\"}))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyEUR",
              "decimals": 4,
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Servers",
          "description": "Servers in the project.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(max by (kind, id) (hcloud_cost_resource_hourly_eur{project=\"unfold\",kind=\"server\"}))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Servers outside unfold-main",
          "description": "Servers without the label cluster=unfold-main (leftover upload servers, hand-made servers). Alert after 2h.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(max by (kind, id) (hcloud_cost_resource_hourly_eur{project=\"unfold\",kind=\"server\",hcloud_cluster!=\"unfold-main\"})) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Primary IPv4s",
          "description": "Billed primary IPs (IPv6 is free and not listed).",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(max by (kind, id) (hcloud_cost_resource_hourly_eur{project=\"unfold\",kind=\"primary_ip\"})) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Snapshots and backups",
          "description": "Snapshot and backup images, billed per GB per month.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(max by (kind, id) (hcloud_cost_resource_hourly_eur{project=\"unfold\",kind=~\"snapshot|backup\"})) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Volumes and load balancers",
          "description": "Block volumes and load balancers.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(max by (kind, id) (hcloud_cost_resource_hourly_eur{project=\"unfold\",kind=~\"volume|load_balancer|floating_ip\"})) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "no data"
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "API token",
          "description": "1 = token mounted and accepted by Hetzner. 0 = not seeded yet or rejected.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(hcloud_cost_token_configured{project=\"unfold\"} * hcloud_cost_api_authorized{project=\"unfold\"})",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Last refresh age",
          "description": "Time since the exporter last read the Hetzner API successfully.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - max(hcloud_cost_last_success_timestamp_seconds{project=\"unfold\"} > 0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 900
                  },
                  {
                    "color": "red",
                    "value": 1800
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Exporter scrape",
          "description": "1 = VictoriaMetrics scrapes hcloud-cost-exporter.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(up{job=\"hcloud-cost-exporter\"})",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 15,
          "type": "row",
          "title": "By role",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "panels": []
        },
        {
          "id": 16,
          "type": "table",
          "title": "Cost per role",
          "description": "Role comes from the Hetzner label role on each server; primary IPs inherit the role of their server; images show as image.",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (role) (max by (kind, id, role) (hcloud_cost_resource_month_to_date_eur{project=\"unfold\"}))",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "sum by (role) (max by (kind, id, role) (hcloud_cost_resource_projected_month_eur{project=\"unfold\"}))",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "expr": "sum by (role) (max by (kind, id, role) (hcloud_cost_resource_monthly_cap_eur{project=\"unfold\"}))",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "D",
              "expr": "count by (role) (max by (kind, id, role) (hcloud_cost_resource_hourly_eur{project=\"unfold\"}))",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "Month to date EUR",
                  "Value #B": "Projected month EUR",
                  "Value #C": "Full month EUR",
                  "Value #D": "Resources"
                },
                "indexByName": {}
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": true,
              "reducer": [
                "sum"
              ],
              "fields": [
                "Month to date EUR",
                "Projected month EUR",
                "Full month EUR"
              ]
            },
            "sortBy": [
              {
                "displayName": "Projected month EUR",
                "desc": true
              }
            ]
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*EUR.*"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "currencyEUR"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Hourly EUR"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 4
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 17,
          "type": "row",
          "title": "By resource",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "panels": []
        },
        {
          "id": 18,
          "type": "table",
          "title": "Cost per resource",
          "description": "One row per billed Hetzner resource. Billable hours = started hours this month.",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (kind, id, name, role, hcloud_cluster, type, location) (hcloud_cost_resource_hourly_eur{project=\"unfold\"})",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "max by (kind, id, name, role, hcloud_cluster, type, location) (hcloud_cost_resource_monthly_cap_eur{project=\"unfold\"})",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "expr": "max by (kind, id, name, role, hcloud_cluster, type, location) (hcloud_cost_resource_billable_hours{project=\"unfold\"})",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "D",
              "expr": "max by (kind, id, name, role, hcloud_cluster, type, location) (hcloud_cost_resource_month_to_date_eur{project=\"unfold\"})",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "E",
              "expr": "max by (kind, id, name, role, hcloud_cluster, type, location) (hcloud_cost_resource_projected_month_eur{project=\"unfold\"})",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "id": true
                },
                "renameByName": {
                  "Value #A": "Hourly EUR",
                  "Value #B": "Monthly cap EUR",
                  "Value #C": "Billable hours",
                  "Value #D": "Month to date EUR",
                  "Value #E": "Projected month EUR",
                  "hcloud_cluster": "cluster"
                },
                "indexByName": {}
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": true,
              "reducer": [
                "sum"
              ],
              "fields": [
                "Monthly cap EUR",
                "Month to date EUR",
                "Projected month EUR",
                "Hourly EUR"
              ]
            },
            "sortBy": [
              {
                "displayName": "Projected month EUR",
                "desc": true
              }
            ]
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*EUR.*"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "currencyEUR"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
