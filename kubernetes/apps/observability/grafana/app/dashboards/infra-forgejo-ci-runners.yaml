            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum_over_time((sum(((sum by (node) ((sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=\"forgejo\", pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\", image!=\"\"}[$$__rate_interval]))) * on (namespace, pod) group_left(node) max by (namespace, pod, node) (label_replace(label_replace(label_replace(kube_pod_info{exported_namespace=\"forgejo\", exported_pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\"}, \"pod\", \"$$1\", \"exported_pod\", \"(.+)\"), \"namespace\", \"$$1\", \"exported_namespace\", \"(.+)\"), \"container\", \"$$1\", \"exported_container\", \"(.+)\")))) / on (node) group_left() clamp_min(sum by (node) (kube_node_status_allocatable{resource=\"cpu\"}), 1) * on (node) group_left() sum by (node) (label_replace(kepler_node_cpu_watts{zone=\"package\"}, \"node\", \"$$1\", \"node_name\", \"(.+)\")))) or vector(0))[$$__range:1m]) * 60 / 3600"
            }
