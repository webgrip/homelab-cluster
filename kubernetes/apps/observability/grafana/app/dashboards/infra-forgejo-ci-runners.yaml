        {
          "id": 22,
          "type": "table",
          "title": "Runner pods right now — and what each one is building",
          "description": "The pod-to-job join this cluster actually has. All runner pods share ONE Forgejo registration (`one-job --uuid`), so the Actions API cannot say which pod holds which task. The runner's own log line `task <id> repo is <owner/repo>` is the authoritative mapping, so this table merges three sources on `pod` and `task`: VictoriaLogs for pod→task, kube-state-metrics/cAdvisor for the pod's node and resource use, and the exporter for what that task is. A pod with no task is a warm-pool runner blocked on `one-job --wait`.",
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "pod age"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "running for"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
