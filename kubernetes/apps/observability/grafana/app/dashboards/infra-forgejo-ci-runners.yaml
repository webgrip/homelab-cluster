              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "running for",
                "desc": true
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "expr": "{namespace=\"forgejo\", container=\"runner\"} ~\"repo is\" | extract_regexp \"task (?P<task>[0-9]+) repo is (?P<repo_path>\\\\S+)\" | filter -task:\"\" | stats by (pod, task, repo_path) count() as picked",
              "queryType": "stats",
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (pod, node) (label_replace(label_replace(label_replace(kube_pod_info{exported_namespace=\"forgejo\", exported_pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\"}, \"pod\", \"$$1\", \"exported_pod\", \"(.+)\"), \"namespace\", \"$$1\", \"exported_namespace\", \"(.+)\"), \"container\", \"$$1\", \"exported_container\", \"(.+)\"))",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - max by (pod) (label_replace(label_replace(label_replace(kube_pod_start_time{exported_namespace=\"forgejo\", exported_pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\"}, \"pod\", \"$$1\", \"exported_pod\", \"(.+)\"), \"namespace\", \"$$1\", \"exported_namespace\", \"(.+)\"), \"container\", \"$$1\", \"exported_container\", \"(.+)\"))",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"forgejo\", pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\", image!=\"\"}[$$__rate_interval]))",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"forgejo\", pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\", image!=\"\"})",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "F",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (task, repo, workflow, ci_job, status, ref, url) (forgejo_ci_task_info)",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "G",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (task) (forgejo_ci_task_running_seconds)",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
                  "Time 6": true,
                  "Time 7": true,
                  "picked": true,
                  "Value #B": true,
                  "Value #F": true
                },
                "renameByName": {
                  "pod": "runner pod",
                  "node": "node",
                  "task": "task",
                  "repo_path": "repo (from log)",
                  "repo": "repo",
                  "workflow": "workflow",
                  "ci_job": "job",
                  "status": "status",
                  "ref": "branch",
                  "url": "run",
                  "Value #C": "pod age",
                  "Value #D": "CPU",
                  "Value #E": "memory",
                  "Value #G": "running for"
                }
              }
            },
            {
              "id": "filterByValue",
              "options": {
                "match": "all",
                "type": "include",
                "filters": [
                  {
                    "fieldName": "pod age",
                    "config": {
                      "id": "isNotNull",
                      "options": {}
                    }
                  }
                ]
              }
            }
          ]
        },
