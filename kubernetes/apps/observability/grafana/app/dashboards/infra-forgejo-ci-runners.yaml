        {
          "id": 60,
          "type": "stat",
          "title": "CI power draw now (modelled)",
          "description": "Kepler reports real power per NODE but is not resolving per-pod attribution on this cluster (kepler_container_* has produced no samples since mid-September). This panel therefore models CI's draw as each node's measured package power scaled by the share of that node's CPU the runner pods are using. It is an estimate, and it is labelled as one.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 162
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(((sum by (node) ((sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=\"forgejo\", pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\", image!=\"\"}[$$__rate_interval]))) * on (namespace, pod) group_left(node) max by (namespace, pod, node) (label_replace(label_replace(label_replace(kube_pod_info{exported_namespace=\"forgejo\", exported_pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\"}, \"pod\", \"$$1\", \"exported_pod\", \"(.+)\"), \"namespace\", \"$$1\", \"exported_namespace\", \"(.+)\"), \"container\", \"$$1\", \"exported_container\", \"(.+)\")))) / on (node) group_left() clamp_min(sum by (node) (kube_node_status_allocatable{resource=\"cpu\"}), 1) * on (node) group_left() sum by (node) (label_replace(kepler_node_cpu_watts{zone=\"package\"}, \"node\", \"$$1\", \"node_name\", \"(.+)\")))) or vector(0)"
            }
          ]
        },
