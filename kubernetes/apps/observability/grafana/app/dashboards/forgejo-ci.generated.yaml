                  "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"forgejo\", pod=~\"forgejo-dind-.+\", container=\"dind\"}[5m]))",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "legendFormat": "{{pod}}"
                }
              ],
              "id": 32
            },
            {
              "type": "timeseries",
              "title": "dind CPU throttling",
              "description": "Share of CFS periods in which dind hit its CPU limit. Sustained above a quarter, builds are waiting on the limit rather than on work.",
              "gridPos": {
                "h": 8,
                "w": 8,
                "x": 8,
                "y": 88
