              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "custom": {
                    "lineWidth": 2,
                    "fillOpacity": 0,
                    "showPoints": "never",
                    "pointSize": 6,
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "spanNulls": false,
                    "axisSoftMin": 0,
                    "thresholdsStyle": {
                      "mode": "line"
                    }
                  },
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "#898781",
                        "value": null
                      },
                      {
                        "color": "#e69f00",
                        "value": 0.25
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"forgejo\", pod=~\"forgejo-dind-.+\", container=\"dind\"}[5m]) / clamp_min(rate(container_cpu_cfs_periods_total{namespace=\"forgejo\", pod=~\"forgejo-dind-.+\", container=\"dind\"}[5m]), 1e-9))",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
