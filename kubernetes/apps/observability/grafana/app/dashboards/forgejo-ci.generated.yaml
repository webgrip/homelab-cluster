apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: wall-ci
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: walls
  json: |-
    {
      "uid": "wall-ci",
      "title": "Wall · Forgejo CI",
      "description": "The Forgejo CI board's first screen, for a TV.",
      "tags": [
        "wall",
        "ci"
      ],
      "schemaVersion": 39,
      "editable": false,
      "graphTooltip": 0,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "timepicker": {
        "hidden": true
      },
      "links": [
        {
          "title": "Forgejo CI",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/forgejo-ci",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "repo",
            "label": "Repository",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(forgejo_ci_consecutive_failures, repo)",
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$$__all"
            },
            "options": [],
            "allValue": ".*",
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Runners, right now",
