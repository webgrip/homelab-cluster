                  "legendFormat": "{{pod}}"
                }
              ],
              "id": 33
            },
            {
              "type": "bargauge",
              "title": "Image pulls by dind, this range, per registry",
              "description": "Pulls dind logged, by the registry host. Anything other than harbor.webgrip.dev bypasses the proxy cache.",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "gridPos": {
                "h": 8,
                "w": 8,
                "x": 16,
                "y": 88
              },
              "options": {
                "orientation": "horizontal",
                "displayMode": "basic",
                "valueMode": "text",
                "namePlacement": "left",
                "showUnfilled": true,
                "sizing": "auto",
                "minVizWidth": 8,
                "minVizHeight": 12,
                "maxVizHeight": 26,
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "values": false
                },
                "text": {
                  "titleSize": 13,
                  "valueSize": 18
                }
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "noValue": "no pulls logged",
                  "color": {
                    "mode": "fixed",
                    "fixedColor": "#3987e5"
                  },
                  "decimals": 0
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "namespace:forgejo container:dind \"image pulled\" | extract_regexp \"remote=\\\"(?P<registry>[^/\\\"]+)/\" from _msg | stats by (registry) count() as pulls",
                  "queryType": "stats",
                  "datasource": {
                    "type": "victoriametrics-logs-datasource",
                    "uid": "victorialogs"
                  },
                  "legendFormat": "{{registry}}"
                }
              ],
              "id": 34
            },
            {
              "type": "timeseries",
              "title": "Harbor requests by status",
              "description": "Harbor core requests per second by HTTP status. 401s are anonymous token handshakes and normal; 5xx is Harbor failing pulls for every build.",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 96
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
