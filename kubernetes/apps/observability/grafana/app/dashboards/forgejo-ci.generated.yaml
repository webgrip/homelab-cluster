        {
          "type": "stat",
          "title": "Jobs by outcome, this range",
          "description": "Finished jobs in the dashboard range, by the outcome Forgejo recorded. Failure is amber from one: each is a push somebody has to look at. Success, skipped and cancelled stay grey; a cancelled job is usually a newer push superseding an older one.",
          "gridPos": {
