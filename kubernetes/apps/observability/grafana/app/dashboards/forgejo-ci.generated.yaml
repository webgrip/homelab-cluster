                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "custom": {
                    "lineWidth": 0,
                    "fillOpacity": 80,
                    "showPoints": "never",
                    "pointSize": 6,
                    "drawStyle": "bars",
                    "lineInterpolation": "linear",
                    "spanNulls": false,
                    "axisSoftMin": 0,
