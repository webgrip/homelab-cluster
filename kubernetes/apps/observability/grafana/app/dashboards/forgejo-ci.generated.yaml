              "expr": "max by (task) (forgejo_ci_task_running_seconds) * on (task) group_right() (max by (task, repo, workflow, ci_job, event, ref, url) (forgejo_ci_task_info{status=\"running\", repo=~\"$$repo\"}) * 0 + 1)",
