              "refId": "A",
              "expr": "(sum(kube_daemonset_status_desired_number_scheduled{job=\"kube-state-metrics\", exported_namespace=\"forgejo\", daemonset=\"forgejo-dind\"}) - sum(kube_daemonset_status_number_ready{job=\"kube-state-metrics\", exported_namespace=\"forgejo\", daemonset=\"forgejo-dind\"}))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 10
        },
        {
          "type": "stat",
          "title": "Busiest dind against its CPU limit",
          "description": "The busier docker daemon's CPU as a share of its own limit, five-minute rate. Builds run inside dind, not in the runner pod, so this is where image builds queue on CPU. Amber from 80 %, vermillion from 95 %, where builds slow for every repository on that node.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 21,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "unit": "percentunit",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 0.8
                  },
                  {
                    "color": "#d55e00",
                    "value": 0.95
