        {
          "type": "stat",
          "title": "dind daemons missing",
          "description": "Nodes where the shared forgejo-dind daemon is wanted but not ready. Every docker build and every `container:` job on that node talks to it, so a missing daemon fails those jobs with a docker socket error that names no cluster component. Vermillion from one.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 18,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "dind not reported",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
