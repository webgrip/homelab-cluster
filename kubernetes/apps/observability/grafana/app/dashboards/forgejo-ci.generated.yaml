              "expr": "max(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"forgejo\", pod=~\"forgejo-dind-.+\", container=\"dind\"}[5m])) / on (pod) label_replace(max by (exported_pod) (kube_pod_container_resource_limits{job=\"kube-state-metrics\", exported_namespace=\"forgejo\", exported_pod=~\"forgejo-dind-.+\", exported_container=\"dind\", resource=\"cpu\"}), \"pod\", \"$$1\", \"exported_pod\", \"(.+)\"))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
