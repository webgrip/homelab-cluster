          "id": 11
        },
        {
          "type": "stat",
          "title": "Pulls around Harbor, this range",
          "description": "Image pulls dind made from a registry other than harbor.webgrip.dev, counted from dind's own `image pulled` log lines. Each one skips the proxy cache and spends the anonymous Docker Hub rate limit; the usual culprit is buildx pulling `moby/buildkit` for a docker-container builder. Amber from one. Log lines are duplicated when the node agent restarts, so read this as a floor on the problem, not an exact count.",
