                  "expr": "sum by (node) (rate(container_cpu_usage_seconds_total{namespace=\"forgejo\", image!=\"\"}[5m]) * on (namespace, pod) group_left(node) max by (namespace, pod, node) (label_replace(label_replace(kube_pod_info{job=\"kube-state-metrics\", exported_namespace=\"forgejo\"}, \"namespace\", \"$$1\", \"exported_namespace\", \"(.+)\"), \"pod\", \"$$1\", \"exported_pod\", \"(.+)\")))",
                  "datasource": {
