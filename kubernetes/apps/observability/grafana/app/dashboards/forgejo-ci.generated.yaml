                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (code) (rate(harbor_core_http_request_total[5m]))",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "legendFormat": "{{code}}"
                }
              ],
              "id": 35
            },
            {
              "type": "timeseries",
