---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: forgejo-ci
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: boards
  json: |-
    {
      "uid": "forgejo-ci",
      "title": "Forgejo CI",
      "description": "Is CI keeping up, is trunk green, and where does the time go. Runners, queue, red trunks and the builders on the first screen; pipelines, durations, fleet, builders, nodes, logs and the exporter in the collapsed rows.",
      "tags": [
        "board",
        "ci",
        "forgejo"
      ],
      "schemaVersion": 39,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "links": [
        {
          "title": "Forgejo Actions",
          "type": "link",
          "icon": "external link",
          "url": "https://forgejo.webgrip.dev/webgrip/homelab-cluster/actions",
          "targetBlank": true,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Runner deep dive",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/infra-forgejo-ci-runners",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "CI telemetry",
          "type": "link",
          "icon": "doc",
          "url": "https://forgejo.webgrip.dev/webgrip/homelab-cluster/src/branch/main/docs/techdocs/docs/general/forgejo-ci-telemetry.md",
          "targetBlank": true,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "type": "dashboards",
          "tags": [
            "board"
          ],
          "title": "Boards",
          "asDropdown": true,
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "targetBlank": false,
          "tooltip": "",
          "url": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "repo",
            "label": "Repository",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(forgejo_ci_consecutive_failures, repo)",
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$$__all"
            },
            "options": [],
            "allValue": ".*"
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Runners, right now",
          "description": "Busy is tasks Forgejo says are running (the exporter polls every 5 minutes, so it trails). Pods is runner pods in phase Running, busy or warm. Pending is runner pods the scheduler could not place: the real ceiling is node room, not the ScaledJob's maxReplicaCount of 6, so a Pending runner is the capacity limit showing itself and turns amber. Waiting is KEDA's own read of queued docker-label jobs. Ceiling and the warm floor are read from the ScaledJob manifest in git when this board is generated (1 warm, 6 max).",
          "gridPos": {
            "h": 5,
            "w": 7,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "pending"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#e69f00",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "waiting"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#e69f00",
                          "value": 1
                        },
                        {
                          "color": "#d55e00",
                          "value": 6
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(forgejo_ci_tasks_active{status=\"running\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "busy",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "expr": "sum(kube_pod_status_phase{job=\"kube-state-metrics\", exported_namespace=\"forgejo\", exported_pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\", phase=\"Running\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "pods",
              "instant": true,
              "range": false
            },
            {
              "refId": "C",
              "expr": "sum(kube_pod_status_phase{job=\"kube-state-metrics\", exported_namespace=\"forgejo\", exported_pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\", phase=\"Pending\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "pending",
              "instant": true,
              "range": false
            },
            {
              "refId": "D",
              "expr": "max(keda_scaler_metrics_value{scaledObject=\"forgejo-runner\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "waiting",
              "instant": true,
              "range": false
            },
            {
              "refId": "E",
              "expr": "vector(6)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "ceiling",
              "instant": true,
              "range": false
            }
          ],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Queue wait p95, last hour",
          "description": "How long the slowest twentieth of runs waited between Forgejo creating them and a runner starting them, trailing hour. Run level: Forgejo stamps a task with its run's start, so there is no honest per-job queue number. Amber from one minute, vermillion from five, when a push has stopped feeling like CI and started feeling like waiting. The buckets end at 30 minutes, so a p95 past that reads as 30 minutes.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 7,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no runs queued in the last hour",
              "unit": "s",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 60
                  },
                  {
                    "color": "#d55e00",
                    "value": 300
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(forgejo_ci_run_queue_seconds_bucket[1h])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Trunks red",
          "description": "Default-branch workflows (main, master, development) whose latest run failed and that ran in the last seven days. A red trunk is a broken main: everything merged on top of it ships unverified. Vermillion from one; the table beside it names them and how many runs in a row failed.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "valueSize": 56
            }
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count((max by (repo, workflow, ref) (forgejo_ci_last_run_status{status=\"failure\", repo=~\"$$repo\"}) == 1) and on (repo, workflow, ref) (time() - max by (repo, workflow, ref) (forgejo_ci_last_run_timestamp_seconds) < 604800)) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Run wall-clock · 7 days",
          "description": "Median and 95th percentile wall-clock of a whole workflow run, created to stopped, trailing seven days, every outcome and every event: the exporter's run histogram carries repo and workflow only, so this is not a success-only time to green. Grey: it is a trend to read, not an alarm.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 15,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "unit": "s",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(forgejo_ci_run_duration_seconds_bucket{repo=~\"$$repo\"}[7d])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "p50",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(forgejo_ci_run_duration_seconds_bucket{repo=~\"$$repo\"}[7d])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "p95",
              "instant": true,
              "range": false
            }
          ],
          "id": 4
        },
        {
          "type": "stat",
          "title": "CI data age",
          "description": "Seconds since forgejo-ci-exporter last finished a poll of the Actions API. It polls every 300 s, so up to about 360 s is normal. Amber from 15 minutes, vermillion from 30, where ForgejoCIOutcomeExporterStale fires: every outcome number on this board is that old.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "exporter not reporting",
              "unit": "s",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 900
                  },
                  {
                    "color": "#d55e00",
                    "value": 1800
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - max(forgejo_ci_last_refresh_timestamp_seconds)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 5
        },
        {
          "type": "table",
          "title": "Red trunks",
          "description": "Each red trunk, how many runs in a row failed, and how long since its last green run. An empty Red for means the last green run is older than the exporter's window: red longer than it can see. ForgejoCITrunkPipelineFailing fires at three in a row. Fix or revert on the trunk first; anything merged meanwhile is untested.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "showHeader": true,
            "cellHeight": "md",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "Every trunk that ran this week is green."
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Failed in a row"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#e69f00",
                          "value": 1
                        },
                        {
                          "color": "#d55e00",
                          "value": 3
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 130
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Red for"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.width",
                    "value": 110
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "repo": "Repository",
                  "workflow": "Workflow",
                  "ref": "Branch",
                  "Value #A": "Failed in a row",
                  "Value #B": "Red for"
                },
                "indexByName": {
                  "Repository": 0,
                  "Workflow": 1,
                  "Branch": 2,
                  "Failed in a row": 3,
                  "Red for": 4
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Failed in a row",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "max by (repo, workflow, ref) (forgejo_ci_consecutive_failures) * on (repo, workflow, ref) group_left() ((max by (repo, workflow, ref) (forgejo_ci_last_run_status{status=\"failure\", repo=~\"$$repo\"}) == 1) and on (repo, workflow, ref) (time() - max by (repo, workflow, ref) (forgejo_ci_last_run_timestamp_seconds) < 604800))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "(time() - (max by (repo, workflow, ref) (forgejo_ci_last_success_timestamp_seconds) > 0)) and on (repo, workflow, ref) ((max by (repo, workflow, ref) (forgejo_ci_last_run_status{status=\"failure\", repo=~\"$$repo\"}) == 1) and on (repo, workflow, ref) (time() - max by (repo, workflow, ref) (forgejo_ci_last_run_timestamp_seconds) < 604800))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "id": 6
        },
        {
          "type": "timeseries",
          "title": "Demand against runner capacity",
          "description": "Busy tasks, queued jobs, runner pods and Pending pods over the range, against the ScaledJob's ceiling. Waiting above zero while pods sit at the same level for long stretches, with Pending pods under it, is the node pool out of room: the fix is less CI work per push or another node, not a higher maxReplicaCount.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "pointSize": 6,
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "spanNulls": false,
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "busy (Forgejo)"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#56b4e9"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "waiting (KEDA)"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#e69f00"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "runner pods"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#898781"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "pending pods"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d55e00"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "ceiling"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#5b5a56"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "ceiling"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        8,
                        6
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(forgejo_ci_tasks_active{status=\"running\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "busy (Forgejo)"
            },
            {
              "refId": "B",
              "expr": "max(keda_scaler_metrics_value{scaledObject=\"forgejo-runner\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "waiting (KEDA)"
            },
            {
              "refId": "C",
              "expr": "sum(kube_pod_status_phase{job=\"kube-state-metrics\", exported_namespace=\"forgejo\", exported_pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\", phase=\"Running\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "runner pods"
            },
            {
              "refId": "D",
              "expr": "sum(kube_pod_status_phase{job=\"kube-state-metrics\", exported_namespace=\"forgejo\", exported_pod=~\"forgejo-runner-[a-z0-9]{5}-[a-z0-9]{5}\", phase=\"Pending\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "pending pods"
            },
            {
              "refId": "E",
              "expr": "vector(6)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "ceiling"
            }
          ],
          "id": 7
        },
        {
          "type": "table",
          "title": "Running now",
