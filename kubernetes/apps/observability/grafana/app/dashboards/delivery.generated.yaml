              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT repo, number, title, author, waits_on, age, url FROM ( WITH open_prs AS ( SELECT r.name AS repo, i.index AS number, i.name AS title, coalesce(u.lower_name, '?') AS author, 'https://forgejo.webgrip.dev/webgrip/' || r.name || '/pulls/' || i.index AS url, extract(epoch FROM now())::bigint - i.created_unix AS age, coalesce(u.lower_name LIKE 'renovate%', false) AS renovate, EXISTS (SELECT 1 FROM issue_label il JOIN label l ON l.id = il.label_id WHERE il.issue_id = i.id AND l.name = 'automerge') AS automerge, EXISTS (SELECT 1 FROM review rv WHERE rv.issue_id = i.id AND rv.type = 1 AND rv.official AND NOT rv.dismissed) AS approved, (SELECT CASE WHEN count(*) = 0 THEN NULL WHEN bool_or(x.status = 2) THEN 'failure' WHEN bool_or(x.status IN (5, 6, 7)) THEN 'running' WHEN bool_and(x.status IN (1, 4)) THEN 'success' ELSE 'cancelled' END FROM (SELECT DISTINCT ON (ar.workflow_id) ar.status FROM action_run ar WHERE ar.repo_id = r.id AND ar.ref = 'refs/pull/' || i.index || '/head' ORDER BY ar.workflow_id, ar.status = 3, ar.id DESC) x) AS ci FROM issue i JOIN repository r ON r.id = i.repo_id LEFT JOIN \"user\" u ON u.id = i.poster_id WHERE i.is_pull AND NOT i.is_closed AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror ) SELECT *, CASE WHEN ci = 'failure' THEN 'red checks' WHEN ci = 'running' THEN 'checks running' WHEN ci IS NULL THEN 'no checks ran' WHEN automerge AND renovate THEN 'automerge due' WHEN approved THEN 'approved, not merged' ELSE 'waiting for review' END AS waits_on FROM open_prs ) q"
