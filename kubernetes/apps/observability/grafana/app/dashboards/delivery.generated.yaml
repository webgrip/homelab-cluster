                      "renovate_median": "Renovate median",
                      "people_merged": "others merged",
                      "people_median": "others median"
                    },
                    "indexByName": {
                      "repo": 0,
                      "renovate_merged": 1,
                      "renovate_median": 2,
                      "people_merged": 3,
                      "people_median": 4
                    }
                  }
