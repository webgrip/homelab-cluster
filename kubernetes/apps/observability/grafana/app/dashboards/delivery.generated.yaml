                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "forgejo-db"
                  },
                  "editorMode": "code",
                  "format": "table",
                  "rawQuery": true,
                  "rawSql": "SELECT r.name AS repo, count(*) FILTER (WHERE NOT rl.is_prerelease) AS stable, count(*) FILTER (WHERE rl.is_prerelease) AS candidates, (array_agg(rl.tag_name ORDER BY rl.created_unix DESC))[1] AS last_tag, max(rl.created_unix) * 1000 AS last_at FROM release rl JOIN repository r ON r.id = rl.repo_id WHERE NOT rl.is_draft AND rl.created_unix > extract(epoch FROM now() - interval '30 days') AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror GROUP BY r.name"
