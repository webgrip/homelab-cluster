                    "indexByName": {
                      "repo": 0,
                      "pending_approval": 1,
                      "dashboard_updated": 2
                    }
                  }
                },
                {
                  "id": "sortBy",
                  "options": {
                    "sort": [
                      {
                        "field": "pending_approval",
                        "desc": true
                      }
                    ]
                  }
                }
              ],
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "forgejo-db"
                  },
                  "editorMode": "code",
                  "format": "table",
                  "rawQuery": true,
                  "rawSql": "SELECT r.name AS repo, (SELECT count(*) FROM regexp_matches(i.content, 'approve-branch=', 'g')) AS pending_approval, i.updated_unix * 1000 AS dashboard_updated, 'https://forgejo.webgrip.dev/webgrip/' || r.name || '/issues/' || i.index AS url FROM issue i JOIN repository r ON r.id = i.repo_id WHERE NOT i.is_pull AND NOT i.is_closed AND i.name LIKE '%Dependency Dashboard%' AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror"
                }
