          "icon": "dashboard",
          "url": "/d/platform-renovate-operator",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Agent standard estate",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/agent-standards-estate",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Today",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/today",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Delivery estate",
          "type": "link",
          "icon": "doc",
          "url": "https://forgejo.webgrip.dev/webgrip/homelab-cluster/src/branch/main/docs/techdocs/docs/general/delivery-estate.md",
          "targetBlank": true,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "type": "dashboards",
          "tags": [
            "board"
          ],
          "title": "Boards",
          "asDropdown": true,
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "targetBlank": false,
          "tooltip": "",
          "url": ""
        }
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "stat",
          "title": "Active repositories",
          "description": "Repositories in the webgrip organisation on Forgejo that are neither archived nor a pull mirror, as the repo-config inventory read them within the last two hours. Each is a row in the estate table.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count((last_over_time(repo_config_repository_info{job=\"repo-config-inventory\"}[2h]) and (tlast_over_time(repo_config_repository_info{job=\"repo-config-inventory\"}[2h]) > scalar(max(tlast_over_time(repo_config_inventory_last_success_timestamp_seconds{job=\"repo-config-inventory\"}[2h]))) - 900)))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Repositories behind a shared package",
          "description": "Repositories whose oldest pin of workflows, renovate-config, agent-standards or semantic-release-config is older than that package's newest stable release. The estate table shows which pin and by how many releases. A large number here with few open Renovate PRs means the bumps are majors waiting for a person, or the repository has no Renovate.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(count by (repository) ((last_over_time(repo_config_shared_pin_releases_behind{job=\"repo-config-inventory\"}[2h]) and (tlast_over_time(repo_config_shared_pin_releases_behind{job=\"repo-config-inventory\"}[2h]) > scalar(max(tlast_over_time(repo_config_inventory_last_success_timestamp_seconds{job=\"repo-config-inventory\"}[2h]))) - 900)) > 0))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Unversioned shared pins",
          "description": "Pins of a shared package with no version Renovate can read: a workflow call by SHA without a `# vX.Y.Z` comment, a branch name, or a preset without `#vX.Y.Z`. Renovate never moves these. Amber from one: add the version comment or the tag.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count((last_over_time(repo_config_shared_pin_unversioned{job=\"repo-config-inventory\"}[2h]) and (tlast_over_time(repo_config_shared_pin_unversioned{job=\"repo-config-inventory\"}[2h]) > scalar(max(tlast_over_time(repo_config_inventory_last_success_timestamp_seconds{job=\"repo-config-inventory\"}[2h]))) - 900)))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Open PRs waiting on a person",
          "description": "Open pull requests whose checks passed (or never ran) and that will not merge by themselves: no approval yet, approved but not merged, or no CI on pull requests at all. Renovate PRs with the automerge label are not counted; Renovate merges them on its next run. Amber from 5, vermillion from 15: review or close from the queue table below.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 9,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "forgejo-db"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 5
                  },
                  {
                    "color": "#d55e00",
                    "value": 15
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "forgejo-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT count(*) AS value FROM ( WITH open_prs AS ( SELECT r.name AS repo, i.index AS number, i.name AS title, coalesce(u.lower_name, '?') AS author, 'https://forgejo.webgrip.dev/webgrip/' || r.name || '/pulls/' || i.index AS url, extract(epoch FROM now())::bigint - i.created_unix AS age, coalesce(u.lower_name LIKE 'renovate%', false) AS renovate, EXISTS (SELECT 1 FROM issue_label il JOIN label l ON l.id = il.label_id WHERE il.issue_id = i.id AND l.name = 'automerge') AS automerge, EXISTS (SELECT 1 FROM review rv WHERE rv.issue_id = i.id AND rv.type = 1 AND rv.official AND NOT rv.dismissed) AS approved, (SELECT CASE WHEN count(*) = 0 THEN NULL WHEN bool_or(x.status = 2) THEN 'failure' WHEN bool_or(x.status IN (5, 6, 7)) THEN 'running' WHEN bool_and(x.status IN (1, 4)) THEN 'success' ELSE 'cancelled' END FROM (SELECT DISTINCT ON (ar.workflow_id) ar.status FROM action_run ar WHERE ar.repo_id = r.id AND ar.ref = 'refs/pull/' || i.index || '/head' ORDER BY ar.workflow_id, ar.status = 3, ar.id DESC) x) AS ci FROM issue i JOIN repository r ON r.id = i.repo_id LEFT JOIN \"user\" u ON u.id = i.poster_id WHERE i.is_pull AND NOT i.is_closed AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror ) SELECT *, CASE WHEN ci = 'failure' THEN 'red checks' WHEN ci = 'running' THEN 'checks running' WHEN ci IS NULL THEN 'no checks ran' WHEN automerge AND renovate THEN 'automerge due' WHEN approved THEN 'approved, not merged' ELSE 'waiting for review' END AS waits_on FROM open_prs ) q WHERE waits_on IN ('waiting for review', 'approved, not merged', 'no checks ran')"
            }
          ],
          "id": 4
        },
        {
          "type": "stat",
          "title": "Open PRs with red checks",
          "description": "Open pull requests whose latest run of some workflow failed on the PR head. A red Renovate PR blocks its whole group branch. Amber from one, vermillion from ten.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 13,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "forgejo-db"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 1
                  },
                  {
                    "color": "#d55e00",
                    "value": 10
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "forgejo-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT count(*) AS value FROM ( WITH open_prs AS ( SELECT r.name AS repo, i.index AS number, i.name AS title, coalesce(u.lower_name, '?') AS author, 'https://forgejo.webgrip.dev/webgrip/' || r.name || '/pulls/' || i.index AS url, extract(epoch FROM now())::bigint - i.created_unix AS age, coalesce(u.lower_name LIKE 'renovate%', false) AS renovate, EXISTS (SELECT 1 FROM issue_label il JOIN label l ON l.id = il.label_id WHERE il.issue_id = i.id AND l.name = 'automerge') AS automerge, EXISTS (SELECT 1 FROM review rv WHERE rv.issue_id = i.id AND rv.type = 1 AND rv.official AND NOT rv.dismissed) AS approved, (SELECT CASE WHEN count(*) = 0 THEN NULL WHEN bool_or(x.status = 2) THEN 'failure' WHEN bool_or(x.status IN (5, 6, 7)) THEN 'running' WHEN bool_and(x.status IN (1, 4)) THEN 'success' ELSE 'cancelled' END FROM (SELECT DISTINCT ON (ar.workflow_id) ar.status FROM action_run ar WHERE ar.repo_id = r.id AND ar.ref = 'refs/pull/' || i.index || '/head' ORDER BY ar.workflow_id, ar.status = 3, ar.id DESC) x) AS ci FROM issue i JOIN repository r ON r.id = i.repo_id LEFT JOIN \"user\" u ON u.id = i.poster_id WHERE i.is_pull AND NOT i.is_closed AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror ) SELECT *, CASE WHEN ci = 'failure' THEN 'red checks' WHEN ci = 'running' THEN 'checks running' WHEN ci IS NULL THEN 'no checks ran' WHEN automerge AND renovate THEN 'automerge due' WHEN approved THEN 'approved, not merged' ELSE 'waiting for review' END AS waits_on FROM open_prs ) q WHERE waits_on = 'red checks'"
            }
          ],
          "id": 5
        },
        {
          "type": "stat",
          "title": "Oldest open Renovate PR",
          "description": "Age of the oldest open pull request Renovate opened. Amber from a week, vermillion from two: a dependency PR that old is either blocked on a person or abandoned and keeps the repository behind.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 17,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "forgejo-db"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "none open",
              "unit": "s",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 604800
                  },
                  {
                    "color": "#d55e00",
                    "value": 1209600
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "forgejo-db"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT max(age) AS value FROM ( WITH open_prs AS ( SELECT r.name AS repo, i.index AS number, i.name AS title, coalesce(u.lower_name, '?') AS author, 'https://forgejo.webgrip.dev/webgrip/' || r.name || '/pulls/' || i.index AS url, extract(epoch FROM now())::bigint - i.created_unix AS age, coalesce(u.lower_name LIKE 'renovate%', false) AS renovate, EXISTS (SELECT 1 FROM issue_label il JOIN label l ON l.id = il.label_id WHERE il.issue_id = i.id AND l.name = 'automerge') AS automerge, EXISTS (SELECT 1 FROM review rv WHERE rv.issue_id = i.id AND rv.type = 1 AND rv.official AND NOT rv.dismissed) AS approved, (SELECT CASE WHEN count(*) = 0 THEN NULL WHEN bool_or(x.status = 2) THEN 'failure' WHEN bool_or(x.status IN (5, 6, 7)) THEN 'running' WHEN bool_and(x.status IN (1, 4)) THEN 'success' ELSE 'cancelled' END FROM (SELECT DISTINCT ON (ar.workflow_id) ar.status FROM action_run ar WHERE ar.repo_id = r.id AND ar.ref = 'refs/pull/' || i.index || '/head' ORDER BY ar.workflow_id, ar.status = 3, ar.id DESC) x) AS ci FROM issue i JOIN repository r ON r.id = i.repo_id LEFT JOIN \"user\" u ON u.id = i.poster_id WHERE i.is_pull AND NOT i.is_closed AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror ) SELECT *, CASE WHEN ci = 'failure' THEN 'red checks' WHEN ci = 'running' THEN 'checks running' WHEN ci IS NULL THEN 'no checks ran' WHEN automerge AND renovate THEN 'automerge due' WHEN approved THEN 'approved, not merged' ELSE 'waiting for review' END AS waits_on FROM open_prs ) q WHERE renovate"
            }
          ],
          "id": 6
        },
        {
          "type": "stat",
          "title": "CI queue wait p95",
          "description": "How long the slowest twentieth of runs waited between Forgejo creating them and a runner starting them, trailing hour. Run level: Forgejo stamps a task with its run's start, so there is no honest per-job queue number. Amber from one minute, vermillion from five, when a push has stopped feeling like CI and started feeling like waiting. The buckets end at 30 minutes, so a p95 past that reads as 30 minutes.",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no runs queued in the last hour",
              "unit": "s",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 60
                  },
                  {
                    "color": "#d55e00",
                    "value": 300
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(forgejo_ci_run_queue_seconds_bucket[1h])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "links": [
            {
              "title": "Open Forgejo CI",
              "url": "/d/forgejo-ci"
            }
          ],
          "id": 7
        },
        {
          "type": "table",
          "title": "Estate: how each repository builds, releases and ships",
          "description": "One row per active repository. kind, branching (staged or trunk), core and GitHub mirror come from the repo-config model; everything else is read from the repository's default branch every hour. Renovate gate is the gate its renovate.json extends (reviewed, unattended), presets when it composes presets without a gate, own when it has config but no shared preset, none without a config. releases says whether a workflow calls the shared semantic-release workflow, runs semantic-release itself, or neither. ships lists what the workflows publish (cloudflare, image, chart, npm, docs), from shared workflow calls and well-known publish steps. Pins show every version found; amber when the oldest is behind the newest stable release, vermillion when one has no version at all.",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "workflows"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": ".*behind$$",
                          "result": {
                            "color": "#e69f00"
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "^unversioned.*",
                          "result": {
                            "color": "#d55e00"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "renovate_config"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": ".*behind$$",
                          "result": {
                            "color": "#e69f00"
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "^unversioned.*",
                          "result": {
                            "color": "#d55e00"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "agent_standards"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": ".*behind$$",
                          "result": {
                            "color": "#e69f00"
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "^unversioned.*",
                          "result": {
                            "color": "#d55e00"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "semantic_release_config"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
