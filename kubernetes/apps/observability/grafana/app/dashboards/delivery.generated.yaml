  folderRef: boards
  json: |-
    {
      "uid": "delivery-estate",
      "title": "Delivery estate",
      "description": "How each repository builds, releases and ships, which version of each shared package it runs, and where pull requests wait. Repository facts come from the repo-config inventory; pull requests, merges and releases from the Forgejo database.",
      "tags": [
        "board",
        "delivery",
        "renovate",
        "forgejo"
      ],
      "schemaVersion": 39,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "5m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "links": [
        {
          "title": "Forgejo CI",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/forgejo-ci",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Renovate operator",
