              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "forgejo-db"
                  },
                  "editorMode": "code",
                  "format": "table",
                  "rawQuery": true,
                  "rawSql": "SELECT r.name AS repo, count(*) FILTER (WHERE u.lower_name LIKE 'renovate%') AS renovate_merged, percentile_cont(0.5) WITHIN GROUP (ORDER BY pr.merged_unix - i.created_unix) FILTER (WHERE u.lower_name LIKE 'renovate%') AS renovate_median, count(*) FILTER (WHERE NOT u.lower_name LIKE 'renovate%') AS people_merged, percentile_cont(0.5) WITHIN GROUP (ORDER BY pr.merged_unix - i.created_unix) FILTER (WHERE NOT u.lower_name LIKE 'renovate%') AS people_median FROM issue i JOIN pull_request pr ON pr.issue_id = i.id JOIN repository r ON r.id = i.repo_id JOIN \"user\" u ON u.id = i.poster_id WHERE i.is_pull AND pr.has_merged AND pr.merged_unix > extract(epoch FROM now() - interval '30 days') AND r.owner_name = 'webgrip' AND NOT r.is_archived AND NOT r.is_mirror GROUP BY r.name"
                }
              ],
              "id": 17
            },
            {
              "type": "table",
              "title": "Updates waiting for a dashboard tick",
              "description": "Updates Renovate found but will not open a pull request for until someone ticks them on the repository's Dependency Dashboard issue: third-party majors and the always-review list. Read from the dashboard issue's text, so it is only as fresh as Renovate's last run on that repository (dashboard updated).",
