---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: unfold-health
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: boards
  json: |-
    {
      "uid": "unfold-health",
      "title": "Unfold · Health",
      "description": "Is the Unfold application itself healthy: up, which release, crashes, server errors, the Ploeg link, Asks and their cost, background deliveries and audit checkpoints. Ploeg's Runs and workers are on Unfold · Plant. Unfold logs no rate-limit refusals and no job queue depth yet, so neither is shown.",
      "tags": [
        "board",
        "glide",
        "unfold"
      ],
      "schemaVersion": 39,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "links": [
        {
          "title": "Unfold · Plant",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/glide-plant",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Unfold Loop",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/glide-loop",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Unfold · Needs-you insight",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/unfold-insight",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Unfold docs",
          "type": "link",
          "icon": "doc",
          "url": "https://docs.webgrip.dev/glide/",
          "targetBlank": true,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "type": "dashboards",
          "tags": [
            "board"
          ],
          "title": "Boards",
          "asDropdown": true,
          "keepTime": true,
          "includeVars": false,
          "icon": "external link",
          "targetBlank": false,
          "tooltip": "",
          "url": ""
        }
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "stat",
          "title": "Unfold up",
          "description": "How many Unfold pods are ready to answer right now, from Kubernetes. Unfold runs one pod, so 1 is healthy and 0 (red, shown as down) means nobody can open Unfold.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "valueSize": 48
            }
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 0
                  },
                  {
                    "color": "#898781",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "down"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(kube_deployment_status_replicas_available{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", deployment=\"unfold\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Running release",
          "description": "The Unfold release tag of the newest pod, and the Ploeg release it connected to, read from the line Unfold logs when it finds Ploeg compatible (ploeg.contract_compatible) shortly after it starts. Looks back 30 days, so a pod that has run longer than that shows nothing here.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 3,
            "y": 0
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no start logged in 30 days",
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "namespace:=ploeg container:=workbench pod:unfold* event:=\"ploeg.contract_compatible\" | first 1 by (_time desc) | stats by (unfold, ploeg) count() as pods",
              "queryType": "stats",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "legendFormat": "Unfold {{unfold}} · Ploeg {{ploeg}}"
            }
          ],
          "timeFrom": "30d",
          "id": 2
        },
        {
          "type": "stat",
          "title": "Reachable through the gateway",
          "description": "Share of the 15-second blackbox checks of Unfold's /healthz, through the internal gateway, that succeeded in this time range. Amber below 99.9 %, red below 99 %.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": -1e+18
                  },
                  {
                    "color": "#e69f00",
                    "value": 0.99
                  },
                  {
                    "color": "#898781",
                    "value": 0.999
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg_over_time(probe_success{endpoint=\"unfold\"}[$$__range])",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Pods started",
          "description": "Unfold pods created in this time range. A release or a configuration change starts one or two; more means pods keep dying and being replaced, which a person sees as Unfold dropping out. Amber from 4, red from 10.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 4
                  },
                  {
                    "color": "#d55e00",
                    "value": 10
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(max by (exported_pod) (max_over_time(kube_pod_created{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"unfold-.+\"}[$$__range])) > time() - $$__range_s) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 4
        },
        {
          "type": "stat",
          "title": "Container restarts",
          "description": "Times Kubernetes restarted the Unfold container inside a pod in this time range, usually after a crash or a failed health check. Amber from 1, red from 5.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 15,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 1
                  },
                  {
                    "color": "#d55e00",
                    "value": 5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "round(sum(increase(kube_pod_container_status_restarts_total{job=\"kube-state-metrics\", exported_namespace=\"ploeg\", exported_pod=~\"unfold-.+\", exported_container=\"workbench\"}[$$__range])) or on() vector(0))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 5
        },
        {
          "type": "stat",
          "title": "Failed starts",
          "description": "Times Unfold gave up while starting (startup.failed), for example because its data volume or database could not be opened. Red from 1: read the message in VictoriaLogs with `namespace:=ploeg container:=workbench event:=\"startup.failed\"`. Each line counts once per timestamp, because the log shipper sometimes delivers the same line more than once.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "namespace:=ploeg container:=workbench pod:unfold* event:=\"startup.failed\" | stats count_uniq(_time) as failed",
              "queryType": "stats",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              }
            }
          ],
          "id": 6
        },
        {
          "type": "stat",
          "title": "Server errors",
          "description": "Requests Unfold answered with a 5xx error in this time range, from the error report it logs for each one (error.reported, feature http). 4xx answers are not counted: Unfold does not log them. Amber from 1, red from 20. Each line counts once per timestamp, because the log shipper sometimes delivers the same line more than once.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 21,
            "y": 0
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 1
                  },
                  {
                    "color": "#d55e00",
                    "value": 20
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "namespace:=ploeg container:=workbench pod:unfold* event:=\"error.reported\" feature:=http | stats count_uniq(_time) as errors",
              "queryType": "stats",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              }
            }
          ],
          "id": 7
        },
        {
          "type": "table",
          "title": "Server errors by code and route",
          "description": "Every 5xx answer in this time range, grouped by the error code from Unfold's error catalogue and the route shape. A code that is not in the catalogue (for example ERR_SQLITE_ERROR) is a raw failure Unfold did not translate, usually its database or disk. Each line counts once per timestamp, because the log shipper sometimes delivers the same line more than once.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "No server errors in this range."
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Errors"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Code"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 190
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns",
                "valueLabel": "__name__"
              }
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "code": "Code",
                  "route": "Route",
                  "reports": "Errors"
                },
                "indexByName": {
                  "Code": 0,
                  "Route": 1,
                  "Errors": 2
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Errors",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "namespace:=ploeg container:=workbench pod:unfold* event:=\"error.reported\" feature:=http | stats by (code, route) count_uniq(_time) as reports",
              "queryType": "stats",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              }
            }
          ],
          "id": 8
        },
        {
          "type": "stat",
          "title": "Ploeg link",
          "description": "How Unfold's connection to Ploeg went in this time range. Contract refused (red from 1) means Ploeg stopped serving a contract version this Unfold needs and Unfold refuses to act through it. Version unreadable (amber) means Unfold could not ask Ploeg which contracts it serves and kept its last answer. Ploeg unavailable (amber) counts requests that failed because Ploeg did not answer. Each line counts once per timestamp, because the log shipper sometimes delivers the same line more than once.",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 5
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "contract refused"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#d55e00",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "namespace:=ploeg container:=workbench pod:unfold* event:=\"ploeg.contract_incompatible\" | stats count_uniq(_time) as incompatible",
              "queryType": "stats",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "legendFormat": "contract refused"
            },
            {
              "refId": "B",
              "expr": "namespace:=ploeg container:=workbench pod:unfold* event:=\"ploeg.version_unreadable\" | stats count_uniq(_time) as unreadable",
              "queryType": "stats",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "legendFormat": "version unreadable"
            },
            {
              "refId": "C",
              "expr": "namespace:=ploeg container:=workbench pod:unfold* event:=\"error.reported\" code:=ploeg_unavailable | stats count_uniq(_time) as unavailable",
              "queryType": "stats",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "legendFormat": "Ploeg unavailable"
            }
          ],
          "id": 9
        },
        {
          "type": "bargauge",
          "title": "Error reports by area",
          "description": "Error reports by the part of Unfold that raised them: http is a failed request, ask a failed Ask, process an uncaught crash, store the database upkeep. Neutral bars: compare the mix, then read the table beside it. Each line counts once per timestamp, because the log shipper sometimes delivers the same line more than once.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 5
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "valueMode": "text",
            "namePlacement": "left",
            "showUnfilled": true,
            "sizing": "auto",
            "minVizWidth": 8,
            "minVizHeight": 12,
            "maxVizHeight": 26,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "text": {
              "titleSize": 13,
              "valueSize": 18
            }
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "noValue": "No error reports in this range.",
              "color": {
                "mode": "fixed",
                "fixedColor": "#3987e5"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "namespace:=ploeg container:=workbench pod:unfold* event:=\"error.reported\" | stats by (feature) count_uniq(_time) as reports",
              "queryType": "stats",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "victorialogs"
              },
              "legendFormat": "{{feature}}"
            }
          ],
          "id": 10
        },
        {
          "type": "bargauge",
          "title": "Ask Runs by outcome",
          "description": "How the Ask Runs Ploeg finished in this time range ended, from ploegd's own counter. An answered Ask ends as other; failed is the one to read. Counts restart from zero when ploegd restarts, so read this as a floor.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 0,
            "y": 13
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "valueMode": "text",
            "namePlacement": "left",
            "showUnfilled": true,
            "sizing": "auto",
            "minVizWidth": 8,
            "minVizHeight": 12,
            "maxVizHeight": 26,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "text": {
              "titleSize": 13,
              "valueSize": 18
            }
          },
