            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count((min_over_time(kube_pod_status_phase{job=\"kube-state-metrics\", phase=\"Pending\"}[15m]) == 1) and on (uid) (kube_pod_created{job=\"kube-state-metrics\"} < time() - 900)) or on() vector(0)",
