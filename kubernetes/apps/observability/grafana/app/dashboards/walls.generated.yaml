---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: wall-now
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: walls
  json: |-
    {
      "uid": "wall-now",
      "title": "Wall · Homelab now",
      "description": "The homelab in one screen: what is firing, whether git is what runs, whether nodes, endpoints, storage and backups are whole, and the error budgets.",
      "tags": [
        "wall"
      ],
      "schemaVersion": 39,
      "editable": false,
      "graphTooltip": 0,
      "refresh": "30s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "timepicker": {
        "hidden": true
      },
      "links": [
        {
          "title": "Alerts · Everything",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/alerts-all",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Information radiators",
          "type": "link",
          "icon": "doc",
          "url": "https://forgejo.webgrip.dev/webgrip/homelab-cluster/src/branch/main/docs/techdocs/docs/general/information-radiators.md",
          "targetBlank": true,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        }
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "stat",
          "title": "Critical firing",
          "description": "Critical alerts firing now in this group, as Alertmanager holds them. Silenced and inhibited alerts are not counted, and neither are the copies OpenCost's scrape of kube-state-metrics series produces. Vermillion from one: a critical alert means someone acts now.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "alertmanager-api"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "valueSize": 64
            }
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "yesoreyeram-infinity-datasource",
                "uid": "alertmanager-api"
              },
              "type": "json",
              "source": "url",
              "format": "table",
              "parser": "backend",
              "url": "http://vmalertmanager-vmalertmanager.observability.svc.cluster.local:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&unprocessed=false",
              "url_options": {
                "method": "GET",
                "data": ""
              },
              "root_selector": "[{ \"n\": $$count($$[labels.alertname != \"Watchdog\" and ($$not($$exists(labels.job)) or labels.job != \"opencost\") and labels.severity = \"critical\"]) }]",
              "columns": [
                {
                  "selector": "n",
                  "text": "n",
                  "type": "number"
                }
              ]
            }
          ],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Warning firing",
          "description": "Warning alerts firing now in this group, silenced, inhibited and duplicate-scrape alerts left out. Amber from one: someone should look today.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "alertmanager-api"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "valueSize": 64
            }
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "yesoreyeram-infinity-datasource",
                "uid": "alertmanager-api"
              },
              "type": "json",
              "source": "url",
              "format": "table",
              "parser": "backend",
              "url": "http://vmalertmanager-vmalertmanager.observability.svc.cluster.local:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&unprocessed=false",
              "url_options": {
                "method": "GET",
                "data": ""
              },
              "root_selector": "[{ \"n\": $$count($$[labels.alertname != \"Watchdog\" and ($$not($$exists(labels.job)) or labels.job != \"opencost\") and labels.severity = \"warning\"]) }]",
              "columns": [
                {
                  "selector": "n",
                  "text": "n",
                  "type": "number"
                }
              ]
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Flux not ready",
          "description": "Flux objects (Kustomizations, HelmReleases, sources) reporting Ready=False. Git is no longer what runs. `flux get all -A --status-selector ready=false` names them and the reason.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(flux_resource_info{ready=\"False\", suspended=\"False\"}) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Nodes not ready",
          "description": "Kubernetes nodes whose Ready condition is not true. Anything on them is being evicted or is already gone; the Talos node-drain playbook covers the recovery.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_node_info{job=\"kube-state-metrics\"}) - sum(kube_node_status_condition{job=\"kube-state-metrics\", condition=\"Ready\", status=\"true\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 4
        },
        {
          "type": "stat",
          "title": "Endpoints down",
          "description": "Blackbox probes whose last check failed: an endpoint unreachable end to end, through the gateway and TLS. This is the one tile that means a person using the service sees it broken.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(probe_success == 0) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 5
        },
        {
          "type": "stat",
          "title": "Alerting pipeline",
          "description": "The Watchdog heartbeat as Alertmanager receives it: 1 means vmalert evaluates rules and Alertmanager receives them. Vermillion at 0, because then every other number on this wall is silent for the wrong reason: check vmalert and Alertmanager in the observability namespace.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "alertmanager-api"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "valueSize": 64
            }
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": 0
                  },
                  {
                    "color": "#898781",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "yesoreyeram-infinity-datasource",
                "uid": "alertmanager-api"
              },
              "type": "json",
              "source": "url",
              "format": "table",
              "parser": "backend",
              "url": "http://vmalertmanager-vmalertmanager.observability.svc.cluster.local:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&unprocessed=false",
              "url_options": {
                "method": "GET",
                "data": ""
              },
              "root_selector": "[{ \"n\": $$count($$[labels.alertname = \"Watchdog\"]) }]",
              "columns": [
                {
                  "selector": "n",
                  "text": "n",
                  "type": "number"
                }
              ]
            }
          ],
          "id": 6
        },
        {
          "type": "stat",
          "title": "Longhorn volumes",
          "description": "Longhorn volumes by robustness. Faulted is a volume with no healthy replica, data at risk now, vermillion from one. Degraded is running on fewer replicas than asked for and rebuilding, amber from one: normal for minutes after a node restart, a problem for hours.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "faulted"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#d55e00",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "degraded"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#e69f00",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(longhorn_volume_robustness{state=\"faulted\"} == 1) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "faulted",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "expr": "count(longhorn_volume_robustness{state=\"degraded\"} == 1) or on() vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "degraded",
              "instant": true,
              "range": false
            }
          ],
          "id": 7
        },
        {
          "type": "stat",
          "title": "Backups late",
          "description": "CloudNativePG clusters whose newest base backup, and backup or snapshot CronJobs whose last success, is older than 26 hours. Everything here runs daily, so late means a night was missed. The Data wall names which.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
                    "value": 1
                  },
                  {
                    "color": "#d55e00",
                    "value": 3
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "((count(max by (namespace) (time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 93600)) or on() vector(0)) + ((count(time() - max by (exported_namespace, cronjob) (kube_cronjob_status_last_successful_time{job=\"kube-state-metrics\", cronjob=~\".*(backup|snapshot).*\"}) > 93600)) or on() vector(0))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 8
        },
        {
          "type": "stat",
          "title": "Worst SLO error budget",
          "description": "The smallest remaining error budget across every Sloth SLO, this period. Amber under half, vermillion under a tenth; below zero the SLO is broken for the period.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "unit": "percent",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": -1e+18
                  },
                  {
                    "color": "#e69f00",
                    "value": 10
                  },
                  {
                    "color": "#898781",
                    "value": 50
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(100 * slo:period_error_budget_remaining:ratio)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 9
        },
        {
          "type": "stat",
          "title": "Certificate expires in",
          "description": "Time until the first cert-manager certificate expires. Let's Encrypt renews at 30 days left, so under 20 means renewal is stuck (amber); under a day, vermillion.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "unit": "s",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": -1e+18
                  },
                  {
                    "color": "#e69f00",
                    "value": 86400
                  },
                  {
                    "color": "#898781",
                    "value": 1728000
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(certmanager_certificate_expiration_timestamp_seconds - time())",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "instant": true,
              "range": false
            }
          ],
          "id": 10
        },
        {
          "type": "table",
          "title": "Firing now, not silenced",
          "description": "Every alert firing now for this wall, read from Alertmanager's API with silenced and inhibited alerts left out, so a silence clears the wall at the next refresh. Critical first, then warning, then the rest, newest first within each. `about` is the service, node, namespace, object and repo the alert names, whichever it carries. Click an alert name to open its runbook.",
          "gridPos": {
            "h": 14,
            "w": 15,
            "x": 0,
            "y": 10
          },
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "alertmanager-api"
          },
          "options": {
            "showHeader": true,
            "cellHeight": "lg",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                }
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "Nothing is firing for anything."
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "runbook"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "severity"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "critical": {
                            "text": "critical",
                            "color": "#d55e00",
                            "index": 0
                          },
                          "warning": {
                            "text": "warning",
                            "color": "#e69f00",
                            "index": 1
                          },
                          "info": {
                            "text": "info",
                            "color": "#898781",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 120
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "alert"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 320
                  },
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open the runbook for this alert",
                        "url": "$${__data.fields.runbook}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "about"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 320
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "since"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  },
                  {
                    "id": "custom.width",
                    "value": 160
                  }
                ]
              }
            ]
          },
          "transformations": [],
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "yesoreyeram-infinity-datasource",
                "uid": "alertmanager-api"
              },
              "type": "json",
              "source": "url",
              "format": "table",
              "parser": "backend",
              "url": "http://vmalertmanager-vmalertmanager.observability.svc.cluster.local:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&unprocessed=false",
              "url_options": {
                "method": "GET",
                "data": ""
              },
              "root_selector": "( $$rank := function($$a) { $$a.labels.severity = \"critical\" ? 0 : ($$a.labels.severity = \"warning\" ? 1 : 2) }; $$in := $$[labels.alertname != \"Watchdog\" and ($$not($$exists(labels.job)) or labels.job != \"opencost\")]; [$$map($$sort($$in, function($$l, $$r) { $$rank($$l) = $$rank($$r) ? $$l.startsAt > $$r.startsAt : $$rank($$l) > $$rank($$r) }), function($$a) { { \"severity\": $$a.labels.severity, \"alert\": $$a.labels.alertname, \"summary\": $$a.annotations.summary, \"about\": $$join([$$a.labels.service, $$a.labels.node, $$exists($$a.labels.exported_namespace) ? $$a.labels.exported_namespace : $$a.labels.namespace, $$a.labels.name, $$a.labels.repo], \" · \"), \"since\": $$a.startsAt, \"runbook\": $$a.annotations.runbook_url } })] )",
              "columns": [
                {
                  "selector": "severity",
                  "text": "severity",
                  "type": "string"
                },
                {
                  "selector": "alert",
                  "text": "alert",
                  "type": "string"
                },
                {
                  "selector": "summary",
                  "text": "summary",
                  "type": "string"
                },
                {
                  "selector": "about",
                  "text": "about",
                  "type": "string"
                },
                {
                  "selector": "since",
                  "text": "since",
                  "type": "timestamp"
                },
                {
                  "selector": "runbook",
                  "text": "runbook",
                  "type": "string"
                }
              ]
            }
          ],
          "id": 11
        },
        {
          "type": "bargauge",
          "title": "SLO error budget left",
          "description": "Remaining error budget per SLO this period, lowest first to read. Amber under half, vermillion under a tenth.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 14,
            "w": 9,
            "x": 15,
            "y": 10
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "valueMode": "text",
            "namePlacement": "left",
            "showUnfilled": true,
            "sizing": "auto",
            "minVizWidth": 8,
            "minVizHeight": 12,
            "maxVizHeight": 26,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "text": {
              "titleSize": 13,
              "valueSize": 18
            }
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "noValue": "no data",
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#d55e00",
                    "value": -1e+18
                  },
                  {
                    "color": "#e69f00",
                    "value": 10
                  },
                  {
                    "color": "#898781",
                    "value": 50
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "unit": "percent",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * max by (sloth_service, sloth_slo) (slo:period_error_budget_remaining:ratio)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{sloth_service}} · {{sloth_slo}}",
              "instant": true,
              "range": false
            }
          ],
          "id": 12
        }
      ]
    }
