apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: wall-nodes
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: walls
  json: |-
    {
      "uid": "wall-nodes",
      "title": "Wall · Nodes",
      "description": "Are the Talos nodes whole and do they have room.",
      "tags": [
        "wall"
      ],
      "schemaVersion": 39,
      "editable": false,
      "graphTooltip": 0,
      "refresh": "1m",
      "time": {
