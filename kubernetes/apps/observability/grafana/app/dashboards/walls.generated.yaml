apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: wall-data
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: walls
  json: |-
    {
      "uid": "wall-data",
      "title": "Wall · Data and backups",
      "description": "Are volumes whole, did last night's backups land, and does Garage have room.",
      "tags": [
        "wall"
      ],
      "schemaVersion": 39,
      "editable": false,
      "graphTooltip": 0,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "timepicker": {
        "hidden": true
      },
      "links": [
        {
          "title": "Longhorn",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/longhorn-storage-health",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "CNPG backups",
          "type": "link",
          "icon": "dashboard",
          "url": "/d/cnpg-backups-dr",
          "targetBlank": false,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        },
        {
          "title": "Information radiators",
          "type": "link",
          "icon": "doc",
          "url": "https://forgejo.webgrip.dev/webgrip/homelab-cluster/src/branch/main/docs/techdocs/docs/general/information-radiators.md",
          "targetBlank": true,
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "tooltip": ""
        }
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "stat",
          "title": "Longhorn volumes",
          "description": "Longhorn volumes by robustness. Faulted is a volume with no healthy replica, data at risk now, vermillion from one. Degraded is running on fewer replicas than asked for and rebuilding, amber from one: normal for minutes after a node restart, a problem for hours.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#898781"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "faulted"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#898781",
                          "value": null
                        },
                        {
                          "color": "#d55e00",
                          "value": 1
