              "rawQuery": true,
              "rawSql": "SELECT CASE t.project_id WHEN 3 THEN 'Homelab Roadmap' WHEN 6 THEN 'Vellum' WHEN 9 THEN 'CI/CD' WHEN 10 THEN 'Glide' END AS project, count(DISTINCT t.id) FILTER (WHERE l.title = 'do-next') AS do_next, count(DISTINCT t.id) FILTER (WHERE l.title = 'ready') AS ready, count(DISTINCT t.id) FILTER (WHERE l.title LIKE 'agent/%') AS doing, count(DISTINCT t.id) FILTER (WHERE l.title = 'review') AS reviewing, count(DISTINCT t.id) FILTER (WHERE l.title = 'needs-refinement') AS refine FROM tasks t LEFT JOIN label_tasks lt ON lt.task_id = t.id LEFT JOIN labels l ON l.id = lt.label_id WHERE NOT t.done AND t.project_id IN (3, 6, 9, 10) GROUP BY t.project_id ORDER BY t.project_id"
