        },
        {
          "type": "stat",
          "title": "Memory outside kubepods, worst node",
          "description": "Resident memory on a node that no pod accounts for. Above 5 GiB for an hour is the dind cgroup escape NodeMemoryOutsideKubepods fires on: pod restarts do not free it, a node reboot does.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "no data",
              "unit": "bytes",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#898781",
                    "value": null
                  },
                  {
                    "color": "#e69f00",
