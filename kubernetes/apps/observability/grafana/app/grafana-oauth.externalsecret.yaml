---
# grafana-oauth now sourced from OpenBao. Replaces grafana-oauth.sops.yaml. Authentik-minted
# client secret preserved (not rotated) — verify SSO login after swap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: observability
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The OIDC client of Grafana in Authentik: the client id the access-plane broker registers and a client secret of your choice (leave it empty to generate). The broker reads both from here and configures Authentik with them, so a new value takes effect on its next run."
    wellhead.dev/plain: "GF_AUTH_GENERIC_OAUTH_CLIENT_ID"
    wellhead.dev/generate: "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "\\S{32,}"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: grafana-oauth, creationPolicy: Owner}
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef: {key: grafana/oauth, property: GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef: {key: grafana/oauth, property: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
