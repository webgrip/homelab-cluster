---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "Grafana's admin login, kept in Grafana's own database since its first start and copied to OpenBao by the PushSecret grafana-admin. A new value here does not change Grafana's password: restore the value from OpenBao's history instead."
    wellhead.dev/plain: "admin-user"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.admin-password: "\\S{12,}"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: grafana-admin, creationPolicy: Owner}
  data:
    - {secretKey: admin-user, remoteRef: {key: grafana/admin, property: admin-user}}
    - {secretKey: admin-password, remoteRef: {key: grafana/admin, property: admin-password}}
