---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: unfold-prometheus
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    name: VictoriaMetrics (Unfold)
    type: prometheus
    uid: unfold-prometheus
    editable: true
    access: proxy
    url: http://vmsingle-unfold.observability.svc.cluster.local:8429
    isDefault: false
