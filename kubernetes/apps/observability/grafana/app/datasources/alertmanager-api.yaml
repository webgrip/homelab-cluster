---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager-api
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    name: Alertmanager API
    type: yesoreyeram-infinity-datasource
    uid: alertmanager-api
    editable: true
    access: proxy
    jsonData:
      allowedHosts:
        - http://vmalertmanager-vmalertmanager.observability.svc.cluster.local:9093
