---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: playlist-wall-homelab
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: 10m
  template:
    apiVersion: playlist.grafana.app/v1
    kind: Playlist
    metadata:
      name: wall-homelab
    spec:
      title: "Wall · Homelab"
      interval: 1m
      items:
        - type: dashboard_by_uid
          value: wall-now
        - type: dashboard_by_uid
          value: today
        - type: dashboard_by_uid
          value: alerts-all
        - type: dashboard_by_uid
          value: wall-ci
        - type: dashboard_by_uid
          value: wall-now
        - type: dashboard_by_uid
          value: wall-glide
        - type: dashboard_by_uid
          value: wall-gitops
        - type: dashboard_by_uid
          value: wall-now
        - type: dashboard_by_uid
          value: wall-data
        - type: dashboard_by_uid
          value: wall-nodes
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: playlist-wall-delivery
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: 10m
  template:
    apiVersion: playlist.grafana.app/v1
    kind: Playlist
    metadata:
      name: wall-delivery
    spec:
      title: "Wall · Delivery"
      interval: 1m
      items:
        - type: dashboard_by_uid
          value: today
        - type: dashboard_by_uid
          value: wall-ci
        - type: dashboard_by_uid
          value: wall-glide
        - type: dashboard_by_uid
          value: today
        - type: dashboard_by_uid
          value: alerts-delivery
        - type: dashboard_by_uid
          value: wall-gitops
        - type: dashboard_by_uid
          value: alerts-ai
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: playlist-incident
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: 10m
  template:
    apiVersion: playlist.grafana.app/v1
    kind: Playlist
    metadata:
      name: incident
    spec:
      title: "Incident · Platform"
      interval: 30s
      items:
        - type: dashboard_by_uid
          value: alerts-all
        - type: dashboard_by_uid
          value: wall-now
        - type: dashboard_by_uid
          value: wall-nodes
        - type: dashboard_by_uid
          value: wall-edge
        - type: dashboard_by_uid
          value: wall-data
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: playlist-weekly-review
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: 10m
  template:
    apiVersion: playlist.grafana.app/v1
    kind: Playlist
    metadata:
      name: weekly-review
    spec:
      title: "Weekly · Review"
      interval: 2m
      items:
        - type: dashboard_by_uid
          value: today
        - type: dashboard_by_uid
          value: wall-roadmap
        - type: dashboard_by_uid
          value: wall-ci
        - type: dashboard_by_uid
          value: wall-glide
        - type: dashboard_by_uid
          value: wall-gitops
        - type: dashboard_by_uid
          value: wall-data
        - type: dashboard_by_uid
          value: wall-edge
        - type: dashboard_by_uid
          value: wall-nodes
        - type: dashboard_by_uid
          value: alerts-security
