---
# grafana-github-api now sourced from OpenBao (seeded by the PushSecret). Replaces
# grafana-github-api.sops.yaml. Same Secret name + key, so the GitHub datasource is unchanged.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-github-api
  namespace: observability
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A GitHub token for Grafana's GitHub data source, made by a person on GitHub (Settings, Developer settings, Personal access tokens) with read-only access to the repositories the dashboards show."
    wellhead.dev/verify: "github-token"
    wellhead.dev/verify.github-token.field: "token"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: grafana-github-api
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: grafana/github-api
        property: token
