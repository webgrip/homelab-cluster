---
# grafana-db-secret now sourced from OpenBao. Replaces SOPS. Value-preserving (CNPG bootstrap secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-secret
  namespace: observability
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "Grafana's database login, created by CloudNativePG at initdb and copied to OpenBao by the PushSecret grafana-db-secret. Restore the value from OpenBao's history; a new one locks Grafana out of its database."
    wellhead.dev/fields: "username password"
    wellhead.dev/plain: "username"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.password: "\\S{16,}"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: grafana-db-secret, creationPolicy: Owner}
  dataFrom:
    - extract: {key: grafana/db}
