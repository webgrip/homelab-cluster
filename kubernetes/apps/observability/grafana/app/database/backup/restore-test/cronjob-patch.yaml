---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-restore-test
spec:
  suspend: false
  schedule: "0 13 * * 4"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: restore-test
              env:
                - name: SOURCE_CLUSTER
                  value: grafana-db
                - name: RESTORE_CLUSTER
                  value: grafana-db-restore
                - name: EXPECTED_DATABASE
                  value: grafana
                - name: EXPECTED_ROLE
                  value: grafana
                - name: BARMAN_OBJECT_NAME
                  value: grafana-db-store
