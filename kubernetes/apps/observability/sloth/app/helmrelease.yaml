---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sloth
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: sloth
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: slok-sloth
        namespace: observability
  values:
    nodeSelector:
      node.webgrip.io/pool: worker
    tolerations:
      - key: dedicated
        operator: Equal
        value: fringe
        effect: NoSchedule

    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        # CPU limit dropped 2026-08-02: sloth was throttled 22% of its scheduling
        # periods on fringe-workstation. It regenerates SLO rules in bursts, so a
        # 500m ceiling is hit exactly when it has work to do, stretching each
        # regeneration and holding the container busy longer than necessary.
        # CPU limits throttle; the 25m request is what reserves capacity.
        memory: 256Mi
