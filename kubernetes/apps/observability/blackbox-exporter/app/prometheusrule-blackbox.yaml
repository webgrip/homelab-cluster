---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackbox-synthetic
  namespace: observability
  labels:
    app.kubernetes.io/name: blackbox-exporter
    release: kube-prometheus-stack
spec:
  groups:
    - name: blackbox.synthetic
      rules:
        - alert: SyntheticEndpointSlow
          expr: |
            probe_duration_seconds{endpoint=~"grafana|prometheus|alertmanager"} > 2
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: synthetics
          annotations:
            summary: "Synthetic probe slow ({{ $labels.endpoint }})"
            description: |
              What's happening:
              - Blackbox probe duration >2s for 10m for endpoint {{ $labels.endpoint }}.

              Impact/risk:
              - Users may see slow access to the endpoint; may be early signal of degradation.

              Likely causes:
              - Endpoint is slow/unhealthy (upstream latency)
              - Network/DNS issues from the prober
              - Prober resource pressure

              First actions:
              - Check endpoint latency and error rate in Grafana
              - Verify DNS/connectivity from within the cluster
              - Check blackbox-exporter pods for restarts/resource pressure
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#synthetic-probes-blackbox"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/synthetic-blackbox/synthetic-blackbox"
        - alert: OmnigraphUnreachable
          expr: |
            probe_success{endpoint="omnigraph"} == 0
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "Omnigraph health endpoint not answering (endpoint {{ $labels.endpoint }})"
            description: |
              What's happening:
              - The blackbox probe of omnigraph /healthz through envoy-internal has failed for 10m.

              Impact/risk:
              - Agents, the brain CLI and meeting ingestion cannot read or write any graph.

              Likely causes:
              - The init container refused to start: an unapproved graph deletion or a bundle that fails cluster apply
              - The pod is crash-looping after an image bump whose storage format needs omnigraph upgrade
              - The omnigraph-state Longhorn volume is not attaching
              - envoy-internal or the omnigraph HTTPRoute is broken

              First actions:
              - kubectl -n ai logs deploy/omnigraph -c apply-and-optimize
              - kubectl -n ai get pods,pvc -l app=omnigraph
              - Read the omnigraph runbook upgrade and forget-a-client sections
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/"
        - alert: OmnigraphExplorerBackendDown
          expr: |
            probe_success{endpoint="omnigraph-explorer"} == 0
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: omnigraph-explorer
          annotations:
            summary: "Omnigraph explorer cannot read a graph through its proxy (endpoint {{ $labels.endpoint }})"
            description: |
              What's happening:
              - The blackbox probe of /og/graphs/memory/branches on the omnigraph-explorer Service has failed for 10m.

              Impact/risk:
              - graph.<domain> loads, but every graph load fails; nobody can browse the graphs.

              Likely causes:
              - The explorer pod is not ready, or refused to start without its act-explorer token
              - omnigraph itself is down (check OmnigraphUnreachable first)
              - tokens.json no longer carries act-explorer, or its policy lost the explorers rule (403)
              - The omnigraph-explorer NetworkPolicy or omnigraph-ingress changed

              First actions:
              - kubectl -n ai get pods -l app.kubernetes.io/name=omnigraph-explorer; kubectl -n ai logs deploy/omnigraph-explorer
              - kubectl -n ai get externalsecret omnigraph-explorer-upstream omnigraph-tokens
              - Read the Explorer section of the omnigraph runbook
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/"
        - alert: OpenWebUIBackendDown
          expr: |
            probe_success{endpoint="open-webui-backend"} == 0
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: open-webui
          annotations:
            summary: "Open WebUI does not answer its health check (endpoint {{ $labels.endpoint }})"
            description: |
              What's happening:
              - The blackbox probe of /health on the open-webui Service has failed for 10m.

              Impact/risk:
              - chat.<domain> is down; the brain and memory graphs are still reachable through Claude Code and the LiteLLM MCP gateway.

              Likely causes:
              - The pod is not ready: the open-webui-data Longhorn volume is not attaching, or a database migration failed after an image bump
              - A Secret it reads (open-webui-secret, open-webui-oidc, open-webui-litellm) is missing, so the container cannot start
              - The open-webui NetworkPolicy changed

              First actions:
              - kubectl -n ai get pods,pvc -l app.kubernetes.io/name=open-webui; kubectl -n ai logs deploy/open-webui
              - kubectl -n ai get externalsecret open-webui-secret open-webui-oidc open-webui-litellm
              - Read the open-webui runbook
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/open-webui/"
        - alert: OmnigraphExplorerGateOpen
          expr: |
            probe_success{endpoint="omnigraph-explorer-gate"} == 0
          for: 10m
          labels:
            severity: critical
            owner: platform
            service: omnigraph-explorer
          annotations:
            summary: "Omnigraph explorer route is not sending anonymous visitors to Authentik (endpoint {{ $labels.endpoint }})"
            description: |
              What's happening:
              - An anonymous request to graph.<domain> through envoy-internal did not get a 302 to the Authentik authorize endpoint for 10m.

              Impact/risk:
              - If the route answers 200, the brain and client meeting graphs are readable by anyone on the LAN.
              - If it answers 500 or nothing, nobody can open the explorer.

              Likely causes:
              - The omnigraph-explorer-oidc SecurityPolicy was deleted or is not Accepted
              - The omnigraph-explorer-oidc Secret is missing (Envoy fails closed with 500)
              - The HTTPRoute or envoy-internal is broken

              First actions:
              - kubectl -n ai get securitypolicy omnigraph-explorer-oidc -o yaml; check status.ancestors conditions
              - kubectl -n ai get externalsecret omnigraph-explorer-oidc
              - curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: graph.<domain>' https://10.0.0.27/
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/"
        - alert: OmnigraphReviewGateOpen
          expr: |
            probe_success{endpoint="omnigraph-review-gate"} == 0
          for: 10m
          labels:
            severity: critical
            owner: platform
            service: omnigraph-explorer
          annotations:
            summary: "Omnigraph review route is not sending anonymous visitors to the omnigraph-review Authentik client"
            description: |
              What's happening:
              - An anonymous request to graph-review.<domain> through envoy-internal did not get a 302 to Authentik's authorize endpoint with client_id=omnigraph-review for 10m.

              Impact/risk:
              - The review route writes to main on brain, memory and webgrip as act-review. If it answers 200, anyone on the LAN can merge, reject and resolve branches.
              - If it redirects to another client, members of that client's group reach the review actions.

              Likely causes:
              - The omnigraph-review-oidc SecurityPolicy was deleted, edited or is not Accepted
              - The omnigraph-review-oidc Secret is missing (Envoy fails closed with 500)
              - The omnigraph-review HTTPRoute or envoy-internal is broken

              First actions:
              - kubectl -n ai get securitypolicy omnigraph-review-oidc -o yaml; check status.ancestors conditions
              - kubectl -n ai get externalsecret omnigraph-review-oidc
              - curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: graph-review.<domain>' https://10.0.0.27/
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#review-mode"
        - alert: OmnigraphExplorerServesReview
          expr: |
            probe_success{endpoint="omnigraph-explorer-no-review"} == 0
          for: 10m
          labels:
            severity: critical
            owner: platform
            service: omnigraph-explorer
          annotations:
            summary: "The read-only explorer port answers something other than 404 under /review/api/"
            description: |
              What's happening:
              - GET http://omnigraph-explorer.ai.svc:8080/review/api/session did not answer 404 for 10m.

              Impact/risk:
              - Port 8080 is the one graph.<domain> routes to, gated only to knowledge-graph-viewers. If it serves the review API, a viewer who is not a reviewer can merge and reject branches.
              - If the probe cannot connect, the explorer itself is down.

              Likely causes:
              - An explorer image whose nginx config lost the 404 for /review/ on port 8080
              - The omnigraph-explorer pod is down

              First actions:
              - kubectl -n ai get pods -l app.kubernetes.io/name=omnigraph-explorer
              - kubectl -n ai logs deploy/omnigraph-explorer -c explorer --tail=50
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#review-mode"
        - alert: RenovateWebhookGateOpen
          expr: |
            probe_success{endpoint="renovate-operator-webhook"} == 0
          for: 10m
          labels:
            severity: critical
            owner: platform
            service: renovate-operator
          annotations:
            summary: "Renovate webhook is not refusing an unauthenticated schedule request (endpoint {{ $labels.endpoint }})"
            description: |
              What's happening:
              - An unauthenticated POST /webhook/v1/schedule for webgrip/homelab-cluster through envoy-internal did not get 401 unauthorized for 10m.

              Impact/risk:
              - If it answers 200, anyone on the LAN can schedule Renovate runs on any project of that RenovateJob.
              - If it answers 404, the probe project left the webgrip-forgejo job, so the gate is no longer being checked.
              - If it answers 5xx or nothing, Forgejo dashboard ticks no longer trigger immediate runs.

              Likely causes:
              - spec.webhook.authentication was removed or disabled on RenovateJob webgrip-forgejo
              - The renovate-webhook-auth Secret is missing or empty (the operator answers 500)
              - webgrip/homelab-cluster lost the renovate topic and dropped out of the job's projects
              - The operator pod, its Service, or the HTTPRoute is down

              First actions:
              - kubectl -n renovate get renovatejob webgrip-forgejo -o jsonpath='{.spec.webhook}'
              - kubectl -n renovate get externalsecret renovate-webhook-auth
              - curl -sk -X POST -w ' %{http_code}' -H 'Host: renovate-webhook.<domain>' 'https://10.0.0.27/webhook/v1/schedule?namespace=renovate&job=webgrip-forgejo&project=webgrip/homelab-cluster'
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/renovate/"
        - alert: AuthentikLoginFlowBroken
          expr: |
            probe_success{endpoint="authentik-login"} == 0
          for: 5m
          labels:
            severity: critical
            owner: platform
            service: authentik
          annotations:
            summary: "Authentik login flow not answering (endpoint {{ $labels.endpoint }})"
            description: |
              What's happening:
              - The blackbox probe of the login flow executor through envoy-internal has failed for 5m.

              Impact/risk:
              - Nobody can sign in to any application behind the broker; existing sessions keep working until they expire.

              Likely causes:
              - Authentik server or worker down, or its database unavailable
              - The brand points at a flow that no longer exists (a bad access-plane apply)
              - envoy-internal or the HTTPRoute for authentik broken

              First actions:
              - kubectl -n authentik get pods; check the authentik-db CNPG cluster
              - kubectl -n security get terraform access-broker; read the last plan for flow or brand changes
              - Open /if/flow/homelab-authentication/ directly; it is the break-glass flow and must still render
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/authentik-oidc-login/"
        - alert: SyntheticRouteDown
          expr: |
            probe_success{synthetic="route"} == 0
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: synthetics
          annotations:
            summary: "Route probe failing through the gateway (endpoint {{ $labels.endpoint }})"
            description: |
              What's happening:
              - The blackbox probe blackbox-{{ $labels.endpoint }} of {{ $labels.instance }} has failed for 10m.
              - The probe sends the app's Host header to the envoy gateway Service, so it walks the same gateway, HTTPRoute and backend a browser does.

              Impact/risk:
              - Users of {{ $labels.endpoint }} get an error page or nothing; anything that calls it by hostname fails the same way.

              Likely causes:
              - The backend pods are not ready or are crash-looping (envoy answers 503)
              - The app is up but its health endpoint reports a failed dependency such as its database (non-200, or a body that no longer matches)
              - The HTTPRoute was renamed, removed or lost its parentRef (envoy answers 404)
              - For a gate probe, the OIDC SecurityPolicy stopped redirecting to Authentik
              - The envoy gateway itself is down; then every route probe fires together

              First actions:
              - kubectl -n observability get probe blackbox-{{ $labels.endpoint }} -o jsonpath='{.spec.module}'
              - kubectl -n observability exec deploy/blackbox-exporter -- wget -qO- 'http://127.0.0.1:9115/probe?debug=true&module=<module>&target={{ $labels.instance }}'
              - kubectl get httproute -A | grep {{ $labels.endpoint }}; then check the backend pods and events in that namespace
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/synthetic-probes-blackbox/#route-probes"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/synthetic-blackbox/synthetic-blackbox"
        - alert: SyntheticOidcGateOpen
          expr: |
            (probe_http_status_code{gate="oidc"} >= 200 < 300) and on (job, instance) (probe_success{gate="oidc"} == 0)
          for: 5m
          labels:
            severity: critical
            owner: platform
            service: synthetics
          annotations:
            summary: "OIDC-gated route answers anonymous requests (endpoint {{ $labels.endpoint }})"
            description: |
              What's happening:
              - An anonymous request to {{ $labels.endpoint }} through the gateway got HTTP {{ $value }} instead of a 302 to Authentik for 5m.

              Impact/risk:
              - The app behind this route is readable, and possibly writable, by anyone who can reach the gateway, with no login.

              Likely causes:
              - The route's gateway OIDC SecurityPolicy was deleted, renamed or no longer targets this HTTPRoute
              - The SecurityPolicy is not Accepted, so envoy serves the route without the filter
              - The HTTPRoute was recreated under a new name the SecurityPolicy does not target

              First actions:
              - kubectl get securitypolicy -A; find the one whose targetRefs names this route and read status.ancestors
              - curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: <hostname from the HTTPRoute>' https://10.0.0.27/
              - Close the exposure first: drop the HTTPRoute from its kustomization in git and reconcile, then restore the SecurityPolicy
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/synthetic-probes-blackbox/#route-probes"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/synthetic-blackbox/synthetic-blackbox"
