---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackbox-synthetic
  namespace: observability
  labels:
    app.kubernetes.io/name: blackbox-exporter
    release: kube-prometheus-stack
spec:
  groups:
    - name: blackbox.synthetic
      rules:
        - alert: SyntheticEndpointSlow
          expr: |
            probe_duration_seconds{namespace="observability", endpoint=~"grafana|prometheus|alertmanager"} > 2
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: synthetics
          annotations:
            summary: "Synthetic probe slow ({{ $labels.endpoint }})"
            description: |
              What's happening:
              - Blackbox probe duration >2s for 10m for endpoint {{ $labels.endpoint }}.

              Impact/risk:
              - Users may see slow access to the endpoint; may be early signal of degradation.

              Likely causes:
              - Endpoint is slow/unhealthy (upstream latency)
              - Network/DNS issues from the prober
              - Prober resource pressure

              First actions:
              - Check endpoint latency and error rate in Grafana
              - Verify DNS/connectivity from within the cluster
              - Check blackbox-exporter pods for restarts/resource pressure
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#synthetic-probes-blackbox"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/synthetic-blackbox/synthetic-blackbox"
        - alert: OmnigraphUnreachable
          expr: |
            probe_success{namespace="observability", endpoint="omnigraph"} == 0
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "Omnigraph health endpoint not answering (endpoint {{ $labels.endpoint }})"
            description: |
              What's happening:
              - The blackbox probe of omnigraph /healthz through envoy-internal has failed for 10m.

              Impact/risk:
              - Agents, the brain CLI and meeting ingestion cannot read or write any graph.

              Likely causes:
              - The init container refused to start: an unapproved graph deletion or a bundle that fails cluster apply
              - The pod is crash-looping after an image bump whose storage format needs omnigraph upgrade
              - The omnigraph-state Longhorn volume is not attaching
              - envoy-internal or the omnigraph HTTPRoute is broken

              First actions:
              - kubectl -n ai logs deploy/omnigraph -c apply-and-optimize
              - kubectl -n ai get pods,pvc -l app=omnigraph
              - Read the omnigraph runbook upgrade and forget-a-client sections
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/"
        - alert: AuthentikLoginFlowBroken
          expr: |
            probe_success{namespace="observability", endpoint="authentik-login"} == 0
          for: 5m
          labels:
            severity: critical
            owner: platform
            service: authentik
          annotations:
            summary: "Authentik login flow not answering (endpoint {{ $labels.endpoint }})"
            description: |
              What's happening:
              - The blackbox probe of the login flow executor through envoy-internal has failed for 5m.

              Impact/risk:
              - Nobody can sign in to any application behind the broker; existing sessions keep working until they expire.

              Likely causes:
              - Authentik server or worker down, or its database unavailable
              - The brand points at a flow that no longer exists (a bad access-plane apply)
              - envoy-internal or the HTTPRoute for authentik broken

              First actions:
              - kubectl -n authentik get pods; check the authentik-db CNPG cluster
              - kubectl -n security get terraform access-broker; read the last plan for flow or brand changes
              - Open /if/flow/homelab-authentication/ directly; it is the break-glass flow and must still render
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/authentik-oidc-login/"
