---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-omnigraph
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  interval: 60s
  module: http_omnigraph_gateway
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://envoy-internal.network.svc.cluster.local/healthz
      labels:
        endpoint: omnigraph
