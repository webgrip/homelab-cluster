---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-renovate-operator-webhook
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  interval: 60s
  module: http_renovate_webhook_gateway
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://envoy-internal.network.svc.cluster.local/webhook/v1/schedule?namespace=renovate&job=webgrip-forgejo&project=webgrip/homelab-cluster
      labels:
        endpoint: renovate-operator-webhook
        synthetic: route
