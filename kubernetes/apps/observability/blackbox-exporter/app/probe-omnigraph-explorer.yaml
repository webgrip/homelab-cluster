---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-omnigraph-explorer
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  interval: 60s
  module: http_omnigraph_explorer_backend
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://omnigraph-explorer.ai.svc.cluster.local:8080/og/graphs/memory/branches
      labels:
        endpoint: omnigraph-explorer
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-omnigraph-explorer-gate
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  interval: 60s
  module: http_omnigraph_explorer_gate
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://envoy-internal.network.svc.cluster.local/
      labels:
        endpoint: omnigraph-explorer-gate
