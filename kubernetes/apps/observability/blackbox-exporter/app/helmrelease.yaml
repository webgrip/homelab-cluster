---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.18.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  values:
    fullnameOverride: blackbox-exporter
    nodeSelector:
      node.webgrip.io/pool: worker

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - "HTTP/1.1"
              - "HTTP/2.0"
            follow_redirects: true
            preferred_ip_protocol: "ip4"
        http_grafana_gateway:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - "HTTP/1.1"
              - "HTTP/2.0"
            follow_redirects: true
            preferred_ip_protocol: "ip4"
            tls_config:
              insecure_skip_verify: true
            headers:
              Host: grafana.${SECRET_DOMAIN}
        http_authentik_login:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - "HTTP/1.1"
              - "HTTP/2.0"
            valid_status_codes:
              - 200
            follow_redirects: false
            preferred_ip_protocol: "ip4"
            tls_config:
              insecure_skip_verify: true
            headers:
              Host: authentik.${SECRET_DOMAIN}
        http_prometheus_gateway:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - "HTTP/1.1"
              - "HTTP/2.0"
            valid_status_codes:
              - 302
            follow_redirects: false
            preferred_ip_protocol: "ip4"
            tls_config:
              insecure_skip_verify: true
            headers:
              Host: prometheus.${SECRET_DOMAIN}
            fail_if_header_not_matches:
              - header: Location
                regexp: '^https://authentik\..+/application/o/authorize/'
        http_alertmanager_gateway:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - "HTTP/1.1"
              - "HTTP/2.0"
            valid_status_codes:
              - 302
            follow_redirects: false
            preferred_ip_protocol: "ip4"
            tls_config:
              insecure_skip_verify: true
            headers:
              Host: alertmanager.${SECRET_DOMAIN}
            fail_if_header_not_matches:
              - header: Location
                regexp: '^https://authentik\..+/application/o/authorize/'
        http_omnigraph_gateway:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - "HTTP/1.1"
              - "HTTP/2.0"
            valid_status_codes:
              - 200
            follow_redirects: false
            preferred_ip_protocol: "ip4"
            tls_config:
              insecure_skip_verify: true
            headers:
              Host: omnigraph.${SECRET_DOMAIN}
        http_omnigraph_explorer_backend:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - "HTTP/1.1"
            valid_status_codes:
              - 200
            follow_redirects: false
            preferred_ip_protocol: "ip4"
            fail_if_body_not_matches_regexp:
              - '"branches"'
        http_omnigraph_explorer_gate:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - "HTTP/1.1"
              - "HTTP/2.0"
            valid_status_codes:
