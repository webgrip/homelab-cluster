            fail_if_header_not_matches:
              - header: Location
                regexp: '^https://authentik\..+/application/o/authorize/.*client_id=omnigraph-review(&|$)'
        http_omnigraph_explorer_no_review:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - "HTTP/1.1"
            valid_status_codes:
