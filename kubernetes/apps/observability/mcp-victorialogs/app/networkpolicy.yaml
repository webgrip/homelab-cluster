---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-victorialogs-allow-ingress
  labels:
    app.kubernetes.io/part-of: mcp-victorialogs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-victorialogs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 8081
