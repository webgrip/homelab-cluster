---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-ci-exporter-token
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: forgejo-ci-exporter-token
    creationPolicy: Owner
  data:
    - {secretKey: token, remoteRef: {key: forgejo/ci-exporter, property: token}}
