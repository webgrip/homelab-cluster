---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-ci-exporter-token
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Forgejo access token for the CI exporter, made by a person in Forgejo (Settings, Applications) with read access to repositories and organisations only."
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/homelab-cluster/src/branch/main/docs/techdocs/docs/general/forgejo-ci-telemetry.md"
    wellhead.dev/verify: "http"
    wellhead.dev/verify.http.url: "https://forgejo.webgrip.dev/api/v1/user"
    wellhead.dev/verify.http.auth: "bearer:token"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: forgejo-ci-exporter-token
    creationPolicy: Owner
  data:
    - {secretKey: token, remoteRef: {key: forgejo/ci-exporter, property: token}}
