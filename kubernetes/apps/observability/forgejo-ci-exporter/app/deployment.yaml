---
# CI-OUTCOME metrics for the Forgejo Actions fleet. The platform-forgejo-ci alert
# group watches runner SUPPLY — scaler errors, queue depth, pending pods, warm
# floor — and none of it sees a job that fails instantly on a healthy fleet.
# ploeg's release job failed that way seven times across nine days in 2026-08
# (a composite action pinned at a SHA that was amended off its branch); every
# `checks` job stayed green, no queue formed, and nothing alerted. It was found
# by hand. This exporter is the missing half: outcomes, not capacity.
#
# Stock python + the logic in a ConfigMap, deliberately, rather than a
# first-party image: the script is stdlib-only, so there is nothing to build,
# publish, scan or renovate, and a read-only rootfs needs no package install.
# The ploeg work-items exporter next door takes the same shape with a stock
# postgres-exporter.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-ci-exporter
  labels:
    app.kubernetes.io/name: forgejo-ci-exporter
    app.kubernetes.io/part-of: observability
  annotations:
    # The script is read once at startup, so an edit needs a restart.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-ci-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-ci-exporter
        app.kubernetes.io/part-of: observability
    spec:
      # Off the soyo control planes, onto the worker pool (ADR-0002).
      nodeSelector:
        node.webgrip.io/pool: worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # Harbor pull-through proxy-cache (ADR-0025) rather than docker.io direct.
          # The proxy is content-addressable, so the digest is Docker Hub's own.
          image: harbor.webgrip.dev/dockerhub/python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
          command:
            - "python3"
            - "-u"
            - "/opt/exporter/exporter.py"
          env:
            # In-cluster service, NOT https://forgejo.webgrip.dev — that hostname
            # resolves to the shared ingress VIP, and a pod reaching its own
            # cluster's VIP is DNAT'd before NetworkPolicy is evaluated. Same
            # reasoning as ploeg's tracker URL.
            - name: FORGEJO_BASE_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: FORGEJO_ORG
              value: webgrip
            # Optional by design: absent, the exporter polls anonymously and sees
            # public repos only. Provision the Secret (see the ExternalSecret
            # note in the PR) and private repos start reporting with no manifest
            # change. `optional: true` keeps the pod schedulable until then.
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-ci-exporter-token
                  key: token
                  optional: true
            - name: SCRAPE_INTERVAL_SECONDS
              value: "300"
            # 26 repos x 1 call each; the whole refresh measured 7.6s against the
            # live instance, so a 300s cycle is ~2.5% duty on one connection.
            - name: RUN_WINDOW
              value: "30"
            # Reusable (`workflow_call`-only) workflows in webgrip/workflows are
            # scheduled by Forgejo on push and release events anyway and fail
            # instantly — 74 permanently-red series from one repo, which would
            # storm the alert below. Muted here, NOT globally: a global pattern
            # would also hide a legitimately-named workflow in another repo. The
            # count stays exported as forgejo_ci_pipelines_excluded so the muting
            # is visible, and that repo's real on_*.yml pipelines still report.
            # The underlying Forgejo behaviour is worth fixing at source.
            - name: EXCLUDE_PIPELINES
              value: "workflows:^(?!on_)"
          ports:
            - name: metrics
              containerPort: 9800
          volumeMounts:
            - name: script
              mountPath: /opt/exporter
              readOnly: true
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: forgejo-ci-exporter-script
