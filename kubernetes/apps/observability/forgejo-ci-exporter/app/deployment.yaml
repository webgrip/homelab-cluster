---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-ci-exporter
  labels:
    app.kubernetes.io/name: forgejo-ci-exporter
    app.kubernetes.io/part-of: observability
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-ci-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-ci-exporter
        app.kubernetes.io/part-of: observability
    spec:
      nodeSelector:
        node.webgrip.io/pool: worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
          command:
            - "python3"
            - "-u"
            - "/opt/exporter/exporter.py"
          env:
            - name: FORGEJO_BASE_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: FORGEJO_ORG
              value: webgrip
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-ci-exporter-token
                  key: token
                  optional: true
            - name: SCRAPE_INTERVAL_SECONDS
              value: "300"
            - name: RUN_WINDOW
              value: "100"
            - name: TASK_WINDOW
              value: "100"
            - name: TASK_DETAIL
              value: "200"
            - name: MAX_JOB_SECONDS
              value: "21600"
            - name: FRESH_WINDOW_SECONDS
              value: "3600"
            - name: EXCLUDE_PIPELINES
              value: "workflows:^(?!on_)"
          ports:
            - name: metrics
              containerPort: 9800
          volumeMounts:
            - name: script
              mountPath: /opt/exporter
              readOnly: true
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: forgejo-ci-exporter-script
