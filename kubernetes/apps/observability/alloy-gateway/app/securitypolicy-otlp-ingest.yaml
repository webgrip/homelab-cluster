---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: alloy-gateway-otlp-ingest
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alloy-gateway-otlp-ingest
  apiKeyAuth:
    credentialRefs:
      - kind: Secret
        name: alloy-gateway-otlp-ingest
    extractFrom:
      - headers:
          - x-otlp-token
    forwardClientIDHeader: x-otlp-client
    sanitize: true
