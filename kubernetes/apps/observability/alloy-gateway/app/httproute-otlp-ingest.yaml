---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy-gateway-otlp-ingest
  annotations:
    monitoring.webgrip.io/synthetic-check: blackbox-alloy-gateway-otlp-ingest
spec:
  hostnames:
    - otlp-ingest.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/traces
        - path:
            type: Exact
            value: /v1/metrics
        - path:
            type: Exact
            value: /v1/logs
      backendRefs:
        - name: alloy-gateway
          namespace: observability
          port: 4318
