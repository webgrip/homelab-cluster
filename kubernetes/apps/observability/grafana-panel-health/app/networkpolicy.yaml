---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-panel-health-egress
  labels:
    app.kubernetes.io/name: grafana-panel-health
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-panel-health
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
