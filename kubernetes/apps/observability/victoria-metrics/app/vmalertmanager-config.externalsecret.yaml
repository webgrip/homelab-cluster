---
# The FULL Alertmanager routing config, git-owned, rendered by ESO into Secret
# vmalertmanager-config (key alertmanager.yaml) with only credentials injected
# from OpenBao. VMAlertmanager consumes it via spec.configSecret (see
# vmalertmanager.yaml — configRawYaml would take precedence and must stay deleted).
#
# Delivery legs (RFC alert-delivery / roadmap #64-66):
#   ntfy (in-cluster URL: publishing survives tunnel outages; messages queue in
#   ntfy's 72h cache) · deadman = self-hosted uptime-kuma Push monitor on the
#   proxmox box (outside the cluster; healthchecks.io was rejected — no SaaS;
#   the ping URL lives in OpenBao alertmanager/healthchecks).
#   Telegram leg DEFERRED 2026-07-11 (no bot exists yet): when created, re-add
#   the two alertmanager/telegram data entries + a telegram_configs block on
#   the critical receiver (bot_token, unquoted integer chat_id, parse_mode HTML).
# Grafana forwards its alerts here too (grafana/app/alerting/), so this tree is
# the single routing decision for both alerting planes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmalertmanager-config
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: vmalertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            # Fallback: alerts with no/unknown severity still reach a human.
            receiver: ntfy-warning
            group_by:
              - alertname
              - namespace
              - severity
              - service
              - owner
              - project
              - pod
              - job
              # kube_job_status_failed's distinguishing label is job_name; `job` is the scrape job
              # (kube-state-metrics) and is identical for every failed Job. Without this, all of
              # them collapse into ONE group — 355 alerts in a single webhook POST, which ntfy
              # rejects with 413, and Alertmanager treats 413 as unrecoverable and drops the whole
              # batch. That is what took the entire warning leg down on 2026-08-26 and forced the
              # KubeJobFailed quarantine below. Grouping per Job is the payload bound that comment
              # asks for. Alerts without the label group exactly as before.
              - job_name
              - instance
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              # Deadman: uptime-kuma Push monitor (interval 300s, retries 1) —
              # the Watchdog's ~2m beat keeps it Up; SILENCE pages.
              - receiver: deadman
                matchers:
                  - alertname="Watchdog"
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 2m
              # Day-1 noise quarantine: standing security-hygiene backlog (DT CVEs,
              # Kyverno violations) — ALL severities, else the two standing criticals
              # dual-page every 12h. Re-tighten once the backlog is triaged (ADR).
              - receiver: ntfy-digest
                matchers:
                  - team="security"
                  - slo=~"supply-chain|admission-control"
                repeat_interval: 24h
              # KubeJobFailed quarantine (2026-08-26): this one alert was
              # silently killing the ENTIRE warning leg. It fires per failed
              # Job, but `job_name` is not in group_by (the `job` label is the
              # scrape job, kube-state-metrics), so every failed Job in the
              # cluster collapses into ONE group — 355 alerts in a single
              # webhook POST, which ntfy rejects:
              #   ntfy-warning/webhook[0]: unrecoverable error, status 413
              #   {"code":41303,"http":413,"error":"JSON body too large"}
              # Alertmanager treats 413 as unrecoverable and drops the batch,
              # so HarborProxyReconcileStale (firing 11.4 days), the ploeg SLOs
              # and every other warning went undelivered.
              # There is a feedback loop here worth remembering: an expired
              # Harbor pull credential makes image-pulling CronJobs fail every
              # run, which floods this group, which drops the very alert that
              # would have told us the credential expired.
              # Same day-1 quarantine shape as the security route above —
              # still delivered, just on the low-priority digest leg. Ploeg's
              # own worker-failure SLO stays on the warning leg, so agent-fleet
              # failures still page.
              # NOTE: this bounds the known offender, not the class. Any group
              # that grows past ntfy's body limit fails the same way; the
              # durable fix is bounding payload size (ntfy message-size-limit
              # or a group_by that keeps batches small).
              # 2026-09-21: job_name added to the top-level group_by, which is that durable fix for
              # this alert — a failed Job is now its own group instead of one 355-alert batch. This
              # quarantine is deliberately left in place until a real wave is observed delivering;
              # lifting both at once is how the warning leg broke the first time.
              - receiver: ntfy-digest
                matchers:
                  - alertname="KubeJobFailed"
                repeat_interval: 24h
              - receiver: critical
                matchers:
                  - severity="critical"
              - receiver: ntfy-warning
                matchers:
                  - severity="warning"
              - receiver: "null"
                matchers:
                  - severity=~"info|none"
          receivers:
            - name: "null"
            - name: critical
              webhook_configs:
                - url: "http://ntfy.observability.svc.cluster.local:8080/alerts-critical?template=alertmanager&priority=urgent"
                  max_alerts: 20
                  http_config:
                    authorization:
                      type: Bearer
                      credentials: "{{ .ntfy_token }}"
              # telegram_configs: deferred — see header (no bot yet).
            - name: ntfy-warning
              webhook_configs:
                - url: "http://ntfy.observability.svc.cluster.local:8080/alerts-warning?template=alertmanager"
                  max_alerts: 20
                  http_config:
                    authorization:
                      type: Bearer
                      credentials: "{{ .ntfy_token }}"
            - name: ntfy-digest
              webhook_configs:
                - url: "http://ntfy.observability.svc.cluster.local:8080/alerts-digest?template=alertmanager&priority=low"
                  max_alerts: 20
                  http_config:
                    authorization:
                      type: Bearer
                      credentials: "{{ .ntfy_token }}"
            - name: deadman
              webhook_configs:
                - url: "{{ .healthchecks_ping_url }}"
                  send_resolved: false
                  max_alerts: 1
          inhibit_rules:
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity="warning"
              equal:
                - namespace
                - alertname
  data:
    - {secretKey: ntfy_token, remoteRef: {key: ntfy/auth, property: alertmanager_token}}
    - {secretKey: healthchecks_ping_url, remoteRef: {key: alertmanager/healthchecks, property: ping_url}}
