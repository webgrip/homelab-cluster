---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: vmsingle
spec:
  # 15d local retention — matches the Prometheus this replaces (Mimir long-term
  # store is disabled). Query + ingest endpoint: vmsingle-vmsingle:8429.
  retentionPeriod: "15d"
  replicaCount: 1
  removePvcAfterDelete: false
  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
    resources:
      requests:
        storage: 50Gi
  podMetadata:
    annotations:
      reloader.stakater.com/auto: "true"
  # ram: high = worker-1. The metrics DB was running on the memory-saturated fringe
  # workstation (1.2GB RSS, PSI-stall epicenter) — meaning observability degraded
  # exactly when the node misbehaved. Move is a Longhorn RWO reattach; vmagent's
  # persistent queue buffers scrapes across the gap (VIK-331 slice 1).
  # (Old dedicated=fringe toleration removed — that taint was retired 2026-06-19,
  # ADR-0002; it was dead config.)
  # HARD pool=worker (ADR-0002), SOFT ram=high. ram=high resolves to worker-1
  # ALONE, and hard-pinning the metrics TSDB there is a large part of why
  # worker-1 sat at ~98% CPU requests for 14 days. Measured peak is 1883Mi — the
  # biggest of the seven ram=high consumers, and still comfortable on any worker.
  # The preference is kept because a TSDB grows; the requirement is not, because
  # "Pending forever if worker-1 is full" is a worse failure than "runs on
  # worker-2". ADR-0002 rejected soft *pool* placement, not soft secondary tiers.
  nodeSelector:
    node.webgrip.io/pool: worker
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.webgrip.io/ram
                operator: In
                values:
                  - "high"
  # Right-sized down from Prometheus's mirrored 400m/3Gi after measuring steady
  # state: VMSingle uses ~1Gi RAM / ~120m CPU for this workload (~390k active
  # series, ~8.7k samples/s). Request 1.5Gi (~50% headroom); 4Gi limit absorbs
  # query spikes. Frees ~1.5Gi of reservation on worker-1.
  # (Storage stays 50Gi — Longhorn can't shrink a PVC online; ~6x oversized for
  # 15d but harmless.)
  resources:
    requests:
      cpu: 200m
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 4Gi
