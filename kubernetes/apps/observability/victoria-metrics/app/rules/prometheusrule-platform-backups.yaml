            drill: daily
            targets: garage-fsn1
        - record: backup:target_monthly_cost_eur
          expr: vector(3.20)
          labels:
            target: hetzner-storage-box-bx11
            phase: phase-2
        - record: backup:target_monthly_cost_eur
          expr: vector(2.10)
          labels:
            target: ovh-object-storage-1az-300gb
            phase: phase-2
    - name: platform.backups-recordings
      rules:
        - record: backup:last_success_timestamp_seconds
          expr: |
            max by (dataset) (
              label_join(
                label_replace(
                  barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0,
                  "dataset_name", "$$1", "pod", "(.+)-[0-9]+"
                ),
                "dataset", "/", "namespace", "dataset_name"
              )
            )
          labels:
            kind: cnpg
        - record: backup:last_success_timestamp_seconds
          expr: |
            max by (dataset) (
              label_join(longhorn_volume_last_backup_at > 0, "dataset", "/", "pvc_namespace", "pvc")
            )
          labels:
            kind: longhorn
        - record: backup:last_success_timestamp_seconds
          expr: |
            label_replace(
              max(kube_cronjob_status_last_successful_time{job="kube-state-metrics", exported_namespace="security", cronjob="openbao-snapshot"} > 0),
              "dataset", "security/openbao-raft", "", ""
            )
          labels:
            kind: openbao
        - record: backup:last_success_timestamp_seconds
          expr: |
            label_replace(
              max(kube_cronjob_status_last_successful_time{job="kube-state-metrics", exported_namespace="backup", cronjob="etcd-backup"} > 0),
              "dataset", "talos/homelab-etcd", "", ""
            )
          labels:
            kind: etcd
        - record: backup:restore_last_success_timestamp_seconds
          expr: |
            max by (dataset, kind) (
              label_join(
                label_replace(
                  kube_configmap_created{job="kube-state-metrics"}
                  * on (exported_namespace, configmap) group_left (label_backup_webgrip_io_namespace, label_backup_webgrip_io_name, label_backup_webgrip_io_kind)
                    kube_configmap_labels{job="kube-state-metrics", label_backup_webgrip_io_restore_verified="true"},
                  "kind", "$$1", "label_backup_webgrip_io_kind", "(.+)"
                ),
                "dataset", "/", "label_backup_webgrip_io_namespace", "label_backup_webgrip_io_name"
              )
            )
    - name: platform.backups
      rules:
        - alert: BackupRestoreVerificationStale
          expr: |
            (
              time() - max by (dataset, kind) (backup:restore_last_success_timestamp_seconds)
              > on (dataset) group_left (tier, drill)
              (
                max by (dataset, tier, drill) (backup:dataset_copies{drill="weekly"}) * 0 + 8 * 86400
                or
                max by (dataset, tier, drill) (backup:dataset_copies{drill="daily"}) * 0 + 2 * 86400
              )
            )
          for: 1h
          labels:
            severity: warning
            owner: platform
            service: backup
          annotations:
            summary: "Backup restore not verified within its drill window ({{ $labels.dataset }})"
            description: |
              What's happening:
              - The last verified restore of {{ $labels.dataset }} ({{ $labels.kind }}, tier {{ $labels.tier }}) is older than its {{ $labels.drill }} drill window.

              Impact/risk:
              - The backup may no longer restore; this is found out during the incident instead of now.

              Likely causes:
              - The drill CronJob failed or is suspended
              - The backup it restores is stale or corrupt
              - The drill's credentials or network path broke

              First actions:
              - kubectl get cronjobs -A -l backup.webgrip.io/drill=true
              - Read the newest drill Job's log in the dataset's namespace
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/backup-restore-drills/"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/backups/backups"
        - alert: BackupRestoreNeverVerified
          expr: |
            max by (dataset, kind, tier, drill) (backup:dataset_copies{drill=~"weekly|daily"})
            unless on (dataset)
            max by (dataset) (backup:restore_last_success_timestamp_seconds)
          for: 8d
          labels:
            severity: warning
            owner: platform
            service: backup
          annotations:
            summary: "Backup has a drill but no verified restore ({{ $labels.dataset }})"
            description: |
              What's happening:
              - {{ $labels.dataset }} ({{ $labels.kind }}, tier {{ $labels.tier }}) is registered with a {{ $labels.drill }} restore drill, and no drill has recorded a verified restore for 8 days.

              Impact/risk:
              - Nothing proves this backup restores.

              Likely causes:
              - The drill was never deployed or never succeeded
              - The drill's restore-verified ConfigMap lacks its backup.webgrip.io labels

              First actions:
              - kubectl get configmaps -A -l backup.webgrip.io/restore-verified=true
              - kubectl get cronjobs -A -l backup.webgrip.io/drill=true
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/backup-restore-drills/"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/backups/backups"
        - alert: BackupDatasetNeverBackedUp
          expr: |
            max by (dataset, kind, tier) (backup:dataset_copies{kind=~"cnpg|longhorn|openbao|etcd", drill!="hibernated"})
            unless on (dataset)
            max by (dataset) (backup:last_success_timestamp_seconds)
          for: 36h
          labels:
            severity: critical
            owner: platform
            service: backup
          annotations:
            summary: "Registered dataset has no completed backup ({{ $labels.dataset }})"
            description: |
              What's happening:
              - {{ $labels.dataset }} ({{ $labels.kind }}, tier {{ $labels.tier }}) is in the backup inventory, and no completed backup of it has been reported for 36 hours.

              Impact/risk:
              - Its data exists only on the cluster. A volume that lost its enrolment, or a database whose backups never started, looks exactly like this.

              Likely causes:
              - A Longhorn volume was recreated and is not in the longhorn-backup-enrollment policy
              - A CNPG cluster has no ScheduledBackup or its WAL archiving is broken
              - The backup CronJob never succeeded

              First actions:
              - kubectl -n longhorn-system get volumes.longhorn.io -l recurring-job-group.longhorn.io/gitops-backup=enabled
              - kubectl get backups.postgresql.cnpg.io -A
              - Compare the inventory in prometheusrule-platform-backups.yaml with the enrolment policy
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/backup-restore-drills/"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/backups/backups"
        - alert: HomelabEtcdBackupStale
          expr: |
            time() - max by (dataset) (backup:last_success_timestamp_seconds{dataset="talos/homelab-etcd"}) > 14 * 3600
          for: 30m
          labels:
            severity: warning
            owner: platform
            service: backup
          annotations:
            summary: "Homelab etcd snapshot older than 14 hours (talos/homelab-etcd)"
            description: |
              What's happening:
              - The newest encrypted etcd snapshot shipped to garage-fsn1 is older than 14 hours; the job runs every 6 hours.

              Impact/risk:
              - A full control-plane loss would lose every Kubernetes object written since, including generated Secrets that are not in git.

              Likely causes:
              - The Talos API access feature is not applied to the control planes
              - The write-only Garage key or the age recipients are missing
              - garage-fsn1 is full or unreachable

              First actions:
              - kubectl -n backup get jobs -l app.kubernetes.io/name=etcd-backup
              - kubectl -n backup logs job/<newest etcd-backup job>
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/backup-restore-drills/#homelab-etcd"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/backups/backups"
