---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: finops
  namespace: observability
  labels:
    app.kubernetes.io/name: finops
    release: kube-prometheus-stack
spec:
  groups:
    - name: finops.inputs
      interval: 1m
      rules:
        - record: finops:eur_per_kwh
          expr: vector(0.30)
          labels:
            source: nl-all-in-tariff-estimate-2026-10

        - record: finops:monthly_cost_lines_expected
          expr: vector(7)

        - record: finops:eur_per_usd
          expr: 1 / max(ecb_reference_rate{currency="USD"})
          labels:
            source: ecb-euro-reference-rate

    - name: finops.monthly
      interval: 1m
      rules:
        - record: finops:monthly_cost_eur
          expr: |
            sum(kepler_node_cpu_watts{zone=~"package|dram"}) / 1000 * 730
            * on () group_left () last_over_time(finops:eur_per_kwh[10m])
          labels:
            line: electricity
            source: kepler-cpu-dram-floor

        - record: finops:monthly_cost_eur
          expr: sum(hcloud:projected_month_eur:sum)
          labels:
            line: hetzner-cloud
            source: hcloud-cost-exporter

        - record: finops:monthly_cost_eur
          expr: |
            sum(rate(litellm_spend_metric_total[7d])) * 86400 * 30.44
            * on () group_left () last_over_time(finops:eur_per_usd[10m])
          labels:
            line: model-spend
            source: litellm-7d-run-rate

        - record: finops:monthly_cost_eur
          expr: vector(59.70)
          labels:
            line: offsite-garage
            source: hetzner-online-invoice-080001293212-2026-10-net

        - record: finops:monthly_cost_eur
          expr: vector(180.00)
          labels:
            line: subscriptions
            source: anthropic-max-20x-receipt-2164-3196-7452-2026-10-net

        - record: finops:monthly_cost_eur
          expr: |
            vector(7.18 / 12)
            * on () group_left () last_over_time(finops:eur_per_usd[10m])
          labels:
            line: domains
            source: namecheap-webgrip-dev-order-185680953-2025-11

    - name: finops.totals
      interval: 1m
      rules:
        - record: finops:monthly_total_eur
          expr: sum(last_over_time(finops:monthly_cost_eur[10m]))

        - record: finops:monthly_cost_lines_missing
          expr: |-
            scalar(last_over_time(finops:monthly_cost_lines_expected[10m]))
            - count(count by (line) (last_over_time(finops:monthly_cost_eur[10m])))
