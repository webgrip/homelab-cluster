---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-longhorn-rules
  namespace: observability
  labels:
    app.kubernetes.io/name: longhorn
    release: kube-prometheus-stack
spec:
  groups:
    - name: platform.longhorn
      rules:
        # longhorn_volume_robustness is ONE-HOT, not an enum: Longhorn emits one
        # series per state (healthy/degraded/faulted/unknown) valued 0 or 1. The
        # old `== 2` could therefore never match — it was silently dark through
        # the 2026-07-29 rebuild storm (56 degraded volumes, zero alerts).
        # Verified against that window: `== 2` -> 0, the expr below -> 29..57.
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness{state="degraded"} == 1
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: longhorn
          annotations:
            summary: "Longhorn volume degraded ({{$labels.volume}})"
            description: |
              What's happening:
              - Longhorn volume {{$labels.volume}} is degraded for 10m.

              Impact/risk:
              - Reduced redundancy; higher risk of data loss if another replica fails.

              Likely causes:
              - Replica failed or stuck rebuilding
              - Node/disk pressure or network issues between replicas
              - Engine/image manager issues

              First actions:
              - Inspect the volume state/replicas in Longhorn UI
              - Check Longhorn manager logs and node/disk health
              - Verify underlying PVC workload health and node readiness
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#platform-longhorn"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-longhorn-health/longhorn-storage-health"

        # One-hot, as above — `== 3` could never match.
        - alert: LonghornVolumeFault
          expr: longhorn_volume_robustness{state="faulted"} == 1
          for: 5m
          labels:
            severity: critical
            owner: platform
            service: longhorn
          annotations:
            summary: "Longhorn volume fault ({{$labels.volume}})"
            description: |
              What's happening:
              - Longhorn volume {{$labels.volume}} is in fault state.

              Impact/risk:
              - High risk of data unavailability or data loss; affected workloads may be down.

              Likely causes:
              - Multiple replica failures or unrecoverable rebuild
              - Node/disk failure impacting replicas
              - Longhorn engine failure

              First actions:
              - Check the volume details and replica states in Longhorn UI
              - Inspect Longhorn events/logs for the volume and impacted nodes
              - Stabilize storage/nodes before attempting recovery actions
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#platform-longhorn"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-longhorn-health/longhorn-storage-health"

        - alert: LonghornNodeNotReady
          expr: longhorn_node_status{condition="ready"} == 0
          for: 10m
          labels:
            severity: critical
            owner: platform
            service: longhorn
          annotations:
            summary: "Longhorn node not ready ({{$labels.node}})"
            description: |
              What's happening:
              - Longhorn reports node {{$labels.node}} not ready for 10m.

              Impact/risk:
              - Replicas on this node may be unavailable; storage resiliency reduced.

              Likely causes:
              - Node NotReady / kubelet issues
              - Disk pressure or Longhorn daemon issues
              - Network partition to the node

              First actions:
              - Check node status/conditions and recent events
              - Check Longhorn manager/instance-manager pods on the node
              - Verify disk mounts/capacity and node connectivity
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#platform-longhorn"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-longhorn-health/longhorn-storage-health"

        # KSM series are relabelled here: the scrape does not set honorLabels, so
        # `namespace` is always the scrape ns (observability) and the workload's
        # real labels live in exported_namespace/exported_pod/exported_container.
        # The plain-label form below matched nothing, so this rule was dark. See
        # the file header of dark-factory-runner-fleet.yaml for the same caveat.
        - alert: LonghornManagerOOMKilled
          expr: |
            increase(kube_pod_container_status_restarts_total{exported_namespace="longhorn-system", exported_container="longhorn-manager"}[15m]) > 0
            and on (exported_namespace, exported_pod, exported_container)
            (kube_pod_container_status_last_terminated_reason{exported_namespace="longhorn-system", exported_container="longhorn-manager", reason="OOMKilled"} == 1)
          for: 1m
          labels:
            severity: critical
            owner: platform
            service: longhorn
          annotations:
            summary: "Longhorn manager OOMKilled ({{$labels.exported_pod}})"
            description: |
              What's happening:
              - The longhorn-manager container on {{$labels.exported_pod}} was OOMKilled.

              Impact/risk:
              - The storage control plane flaps; this is the root trigger of the
                2026-06-09 rebuild-storm incident (degraded volumes, stuck disks,
                blocked PVC resizes). Volume I/O survives (instance-manager) but
                orchestration does not.

              Likely causes:
              - Node memory pressure (RAM-tight nodes) killing the manager
              - A load spike (rebuild storm, mass snapshot purge) on a tight node

              First actions:
              - Check node memory (`kubectl top nodes`) and recent OOM events
              - Confirm the manager has Guaranteed QoS (requests==limits); if it
                reverted to BestEffort, the postRenderer in the HelmRelease is not
                applying
              - If volumes are degraded, see the incident runbook (pause rebuilds,
                stabilise, then heal)
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/incidents/2026-06-09-longhorn-oom-cascade/"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-longhorn-health/longhorn-storage-health"

        # exported_* labels — see the KSM caveat on LonghornManagerOOMKilled.
        - alert: LonghornManagerRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{exported_namespace="longhorn-system", exported_container="longhorn-manager"}[1h]) >= 3
          for: 5m
          labels:
            severity: warning
            owner: platform
            service: longhorn
          annotations:
            summary: "Longhorn manager restarting ({{$labels.exported_pod}})"
            description: |
              What's happening:
              - longhorn-manager on {{$labels.exported_pod}} restarted >=3 times in the last hour.

              Impact/risk:
              - Storage control-plane instability; precursor to rebuild/scheduling
                problems even when individual restarts are not OOM.

              Likely causes:
              - OOM kills (see LonghornManagerOOMKilled), leader-election churn,
                liveness-probe failures, or node pressure

              First actions:
              - `kubectl -n longhorn-system describe pod {{$labels.exported_pod}}` for the
                last-terminated reason
              - Check node memory/CPU pressure and Longhorn node readiness
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/incidents/2026-06-09-longhorn-oom-cascade/"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-longhorn-health/longhorn-storage-health"

        - alert: PVCVolumeAlmostFull
          expr: |
            (
              (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.10
            )
            and on (namespace, persistentvolumeclaim)
            (kube_persistentvolumeclaim_info == 1)
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: longhorn
          annotations:
            summary: "PVC almost full ({{$labels.namespace}}/{{$labels.persistentvolumeclaim}})"
            description: |
              What's happening:
              - PVC {{$labels.namespace}}/{{$labels.persistentvolumeclaim}} has <10% free space for 15m.

              Impact/risk:
              - Writes may fail soon; pods may crash or become unhealthy.

              Likely causes:
              - Log/data growth (unexpected retention)
              - Stuck compaction/cleanup or backups writing locally
              - Under-provisioned PVC size

              First actions:
              - Identify top disk consumers in the workload/pod using the PVC
              - Consider expanding the PVC/Longhorn volume
              - Reduce retention/cleanup data to restore headroom
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#platform-longhorn"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-pvc-usage/storage-pvc-longhorn"

        - alert: PVCVolumeFillingFast
          expr: |
            (
              predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0
            )
            and on (namespace, persistentvolumeclaim)
            (kube_persistentvolumeclaim_info == 1)
          for: 30m
          labels:
            severity: warning
            owner: platform
            service: longhorn
          annotations:
            summary: "PVC filling fast ({{$labels.namespace}}/{{$labels.persistentvolumeclaim}})"
            description: |
              What's happening:
              - PVC {{$labels.namespace}}/{{$labels.persistentvolumeclaim}} is predicted to run out of space within 24h.

              Impact/risk:
              - Imminent write failures and workload disruption if growth continues.

              Likely causes:
              - Sudden data/log growth
              - Missing/failed cleanup or retention policy change
              - Under-sized PVC for current workload

              First actions:
              - Confirm growth rate and identify What's writing to the volume
              - Expand the PVC/Longhorn volume to buy time
              - Mitigate growth (retention/cleanup) to stabilize
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#platform-longhorn"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-pvc-usage/storage-pvc-longhorn"

        - alert: LonghornBackupFailed
          expr: count by (volume) (longhorn_backup_state == 4) > 0
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: longhorn
          annotations:
            summary: "Longhorn backup in Error state ({{$labels.volume}})"
            description: |
              What's happening:
              - {{ $value }} Backup CR(s) of volume {{$labels.volume}} are in state Error.
              - The BackupTarget can still report AVAILABLE while every backup fails, so this is
                the signal to trust.

              Impact/risk:
              - The volume has no fresh off-site copy; a restore would use an older backup.

              Likely causes:
              - The off-site Garage rejects writes (disk full, quota, outage)
              - Credentials in the longhorn-backup-s3 Secret no longer valid
              - The volume was busy or detached during the recurring job

              First actions:
              - kubectl -n longhorn-system get backups.longhorn.io -o wide and read .status.error
              - Check GarageDown / GarageOffsiteDiskCritical and the off-site Garage runbook
              - Failed Backup CRs age out after the failed-backup-ttl setting (1440 min); delete
                stale ones in the Longhorn UI once the cause is fixed
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/garage-offsite/#longhorn-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-longhorn-health/longhorn-storage-health"

        - alert: LonghornVolumeBackupStale
          expr: |
            (
              (time() - longhorn_volume_last_backup_at) > 36 * 3600
              and longhorn_volume_last_backup_at > 0
            )
            and on (volume)
            (max by (volume) (longhorn_volume_state{state="attached"}) == 1)
          for: 1h
          labels:
            severity: warning
            owner: platform
            service: longhorn
          annotations:
            summary: "Longhorn volume without a backup for 36h ({{$labels.pvc_namespace}}/{{$labels.pvc}})"
            description: |
              What's happening:
              - Attached volume {{$labels.volume}} ({{$labels.pvc_namespace}}/{{$labels.pvc}}) last
                completed a backup more than 36h ago; every backup recurring job runs daily.

              Impact/risk:
              - Data written since the last good backup exists only on the cluster.

              Likely causes:
              - Backups failing (see LonghornBackupFailed)
              - The volume left its recurring-job group

              First actions:
              - kubectl -n longhorn-system get backups.longhorn.io -l backup-volume={{$labels.volume}}
              - Check the recurring job group labels on the Longhorn volume
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/garage-offsite/#longhorn-backups"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-longhorn-health/longhorn-storage-health"
