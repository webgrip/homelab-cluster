---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: apps-rules
  namespace: observability
  labels:
    app.kubernetes.io/name: apps
    release: kube-prometheus-stack
spec:
  groups:
    - name: apps.namespace.baseline
      rules:
        - alert: AppDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"}
            >
            kube_deployment_status_replicas_available{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"}
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: apps
          annotations:
            summary: "Deployment replicas unavailable ({{$labels.namespace}}/{{$labels.deployment}})"
            description: |
              What's happening:
              - Available replicas are below spec for 10m for {{$labels.namespace}}/{{$labels.deployment}}.

              Impact/risk:
              - Reduced capacity; requests may be slower or error if load increases.

              Likely causes:
              - Pod crashlooping or failing readiness
              - Scheduling issues (insufficient resources, node pressure, affinity)
              - Rollout stalled (bad image/config)

              First actions:
              - Check Deployment status and recent events for {{$labels.namespace}}/{{$labels.deployment}}
              - Check pods for CrashLoopBackOff/ImagePullBackOff/NotReady
              - Verify cluster capacity (CPU/memory) and node readiness
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#apps-baseline"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/k8s-workloads-capacity/kubernetes-workloads-capacity"

        - alert: AppDeploymentDown
          expr: |
            kube_deployment_spec_replicas{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"} > 0
            and
            kube_deployment_status_replicas_available{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"} == 0
          for: 10m
          labels:
            severity: critical
            owner: platform
            service: apps
          annotations:
            summary: "Deployment is down ({{$labels.namespace}}/{{$labels.deployment}})"
            description: |
              What's happening:
              - No available replicas for 10m for {{$labels.namespace}}/{{$labels.deployment}}.

              Impact/risk:
              - Service is likely unavailable or severely degraded.

              Likely causes:
              - Bad rollout/config causing all pods to fail
              - Scheduling failure (no nodes/resources/taints/affinity)
              - Image pull failures or missing secrets/configmaps

              First actions:
              - Check Deployment status/events and ReplicaSet history
              - Inspect pods for failure reasons and read recent logs
              - Roll back the last change if a recent deploy caused the outage
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#apps-baseline"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/k8s-workloads-capacity/kubernetes-workloads-capacity"

        - alert: AppStatefulSetReplicasMismatch
          expr: |
            kube_statefulset_status_replicas{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"}
            >
            kube_statefulset_status_replicas_ready{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"}
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: apps
          annotations:
            summary: "StatefulSet replicas unavailable ({{$labels.namespace}}/{{$labels.statefulset}})"
            description: |
              What's happening:
              - Ready replicas are below desired for 10m for {{$labels.namespace}}/{{$labels.statefulset}}.

              Impact/risk:
              - Reduced capacity; stateful services may be degraded.

              Likely causes:
              - Pod crashlooping or failing readiness
              - PVC not bound / volume attach problems
              - Scheduling constraints preventing pods from starting

              First actions:
              - Check StatefulSet status and pod events
              - Verify PVCs are Bound and volumes are healthy
              - Inspect failing pod logs and readiness probes
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#apps-baseline"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/k8s-workloads-capacity/kubernetes-workloads-capacity"

        - alert: AppCrashLoopBackOff
          expr: |
            max by (namespace, pod, container) (
              kube_pod_container_status_waiting_reason{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)", reason="CrashLoopBackOff"}
            ) > 0
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: apps
          annotations:
            summary: "CrashLoopBackOff ({{$labels.namespace}})"
            description: |
              What's happening:
              - Container {{$labels.container}} in pod {{$labels.pod}} has been in CrashLoopBackOff for 15m.

              Impact/risk:
              - The workload may be partially unavailable or failing requests.

              Likely causes:
              - App crash due to config/secret/env mismatch
              - OOMKilled or resource limits too low
              - Dependency unavailable (DB/API/DNS) or failing startup checks

              First actions:
              - Check pod events and last termination reason for {{$labels.pod}}
              - Review previous container logs for {{$labels.container}}
              - Verify recent deploy/config changes and dependent services
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#apps-baseline"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/k8s-cluster-health/kubernetes-cluster-health"

        # Counter-based companion to AppCrashLoopBackOff above. That rule keys on
        # kube_pod_container_status_waiting_reason, which only samples INSTANTANEOUS
        # state — a container that crashes, restarts and returns to Running is
        # rarely in CrashLoopBackOff at scrape time, so the series can read empty
        # through an entire incident. Verified 2026-09-04: over the 24h in which
        # vikunja/mcp-vikunja was crashing on every client connection, the
        # waiting_reason series for that namespace returned NO DATA AT ALL, and
        # AppCrashLoopBackOff never fired.
        #
        # This is the same blind spot PlatformContainerCrashLooping
        # (prometheusrule-platform-kubernetes.yaml) was added for after the
        # 2026-07-29 cilium loop — but that rule EXCLUDES app namespaces, so app
        # workloads had no counter-based coverage at all. This closes that half.
        #
        # Window/threshold are NOT copied from the platform rule (>=5 over [1h]):
        # connection-triggered crashes are sparse, and mcp-vikunja peaked at only
        # 2/hour while reaching 5 per 6h. Measured over 7d of real data, >=3 per
        # [6h] selects exactly the same 3 containers as >=5 (mcp-vikunja,
        # keda-operator, authentik/server) — nothing sits in the 3-4 band — so the
        # lower threshold buys sensitivity to slower loops at no extra noise.
        #
        # exported_* labels: the KSM scrape does not set honorLabels, so
        # `namespace` is the scrape ns (observability) and real labels are exported_*.
        - alert: AppContainerCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{exported_namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"}[6h]) >= 3
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: apps
          annotations:
            summary: "App container crash looping ({{ $labels.exported_namespace }}/{{ $labels.exported_pod }})"
            description: |
              What's happening:
              - Container {{ $labels.exported_container }} in
                {{ $labels.exported_namespace }}/{{ $labels.exported_pod }} restarted
                >=3 times in the last 6h.

              Impact/risk:
              - The workload is losing in-flight requests and connection state on every
                restart. It may still report Ready between crashes, so this can be
                invisible to readiness-based alerting and to `kubectl get pods`.

              Likely causes:
              - An uncaught error on a specific request or client (the 2026-09-04
                mcp-vikunja case: one unsupported protocol header killed the process)
              - OOMKilled under a periodic spike; check last terminated reason
              - A dependency that fails intermittently rather than continuously

              First actions:
              - kubectl -n {{ $labels.exported_namespace }} describe pod {{ $labels.exported_pod }}
              - kubectl -n {{ $labels.exported_namespace }} logs {{ $labels.exported_pod }} --previous
              - Correlate restart times with client/request activity before assuming resources
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#apps-baseline"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/k8s-cluster-health/kubernetes-cluster-health"

        - alert: AppContainerMemoryNearLimit
          expr: |
            max by (namespace, pod, container) (
              container_memory_working_set_bytes{container!="", container!="POD", namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"}
            )
            / on (namespace, pod, container)
            (
              max by (namespace, pod, container) (
                container_spec_memory_limit_bytes{container!="", container!="POD"}
              ) > 0
            )
            > 0.85
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: apps
          annotations:
            summary: "App container memory > 85% of its limit ({{ $labels.namespace }}/{{ $labels.pod }})"
            description: |
              What's happening:
              - Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}
                has held its working set above 85% of its memory limit for 15m.

              Impact/risk:
              - The next allocation spike OOMKills it (exit 137), dropping every in-flight
                request. A restart resets the curve, so the restart-count alerts only see
                this after the damage.

              Likely causes:
              - A leak: memory that steps up with traffic and never comes back down
                (2026-09-27 mcp-vikunja: supergateway 3.4.3 kept one child per request)
              - A limit set below the real working set

              First actions:
              - Plot container_memory_working_set_bytes for the container over 7d: steps
                that plateau between bursts are a leak, spikes that fall back are load
              - Find the owning app's runbook before raising the limit
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#apps-baseline"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/k8s-workloads-capacity/kubernetes-workloads-capacity"

        - alert: AppPersistentVolumeLowFree
          expr: |
            (
              kubelet_volume_stats_available_bytes{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"}
              /
              kubelet_volume_stats_capacity_bytes{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"}
            ) < 0.15
            and
            kubelet_volume_stats_capacity_bytes{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"} > 0
          for: 30m
          labels:
            severity: warning
            owner: platform
            service: apps
          annotations:
            summary: "PVC low free space (<15%) ({{$labels.namespace}}/{{$labels.persistentvolumeclaim}})"
            description: |
              What's happening:
              - PVC {{$labels.namespace}}/{{$labels.persistentvolumeclaim}} has had <15% free space for 30m.

              Impact/risk:
              - Writes may fail; pods may crash or become unhealthy.

              Likely causes:
              - Data/log growth (retention too high)
              - Cleanup/compaction not running
              - PVC under-sized for current workload

              First actions:
              - Identify what is writing to the volume and top disk consumers
              - Expand the PVC/volume to restore headroom
              - Reduce retention/cleanup old data to stabilize
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#apps-baseline"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-pvc-usage/storage-pvc-longhorn"

        - alert: AppPersistentVolumeCriticallyLowFree
          expr: |
            (
              kubelet_volume_stats_available_bytes{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"}
              /
              kubelet_volume_stats_capacity_bytes{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"}
            ) < 0.05
            and
            kubelet_volume_stats_capacity_bytes{namespace!~"(kube-system|flux-system|observability|cert-manager|cnpg-system|longhorn-system|network)"} > 0
          for: 15m
          labels:
            severity: critical
            owner: platform
            service: apps
          annotations:
            summary: "PVC critically low free space (<5%) ({{$labels.namespace}}/{{$labels.persistentvolumeclaim}})"
            description: |
              What's happening:
              - PVC {{$labels.namespace}}/{{$labels.persistentvolumeclaim}} has had <5% free space for 15m.

              Impact/risk:
              - Imminent write failures and service disruption.

              Likely causes:
              - Rapid data/log growth
              - Cleanup/retention failure
              - PVC severely under-provisioned

              First actions:
              - Expand the PVC/volume immediately to avoid outages
              - Identify and stop the growth source (logs/data retention)
              - Confirm the workload recovers once space is available
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#apps-baseline"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/storage-pvc-usage/storage-pvc-longhorn"
