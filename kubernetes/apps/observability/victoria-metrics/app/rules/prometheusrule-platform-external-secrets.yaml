---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-external-secrets-rules
  namespace: observability
  labels:
    app.kubernetes.io/name: external-secrets
    release: kube-prometheus-stack
spec:
  groups:
    - name: platform.external-secrets
      rules:
        # exported_namespace, not namespace: the ESO metrics scrape does not set
        # honorLabels, so `namespace` is the SCRAPE namespace (always "security")
        # and the object's real namespace is exported_namespace. Grouping by
        # `namespace` made every one of these alerts read "security/<name>" and
        # handed out a kubectl command with the wrong -n. Fixed 2026-09-04.
        - alert: ExternalSecretNotReady
          expr: |
            max by (exported_namespace, name) (
              externalsecret_status_condition{condition="Ready", status="False"}
            ) == 1
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: external-secrets
          annotations:
            summary: "ExternalSecret not Ready ({{ $labels.exported_namespace }}/{{ $labels.name }})"
            description: |
              What's happening:
              - ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} has reported
                Ready=False for 15m, so its target Secret is missing or stale.

              Impact/risk:
              - Workloads consuming this Secret may fail to start, run with stale
                credentials, or lose access to their backend (DB, S3, OIDC).

              Likely causes:
              - The OpenBao KV path is unpopulated, or OpenBao is sealed/unreachable.
              - ClusterSecretStore auth (token/role) expired or was revoked.
              - A typo in the remoteRef key/property.

              First actions:
              - kubectl -n {{ $labels.exported_namespace }} get externalsecret {{ $labels.name }} -o yaml | yq '.status'
              - Check ClusterSecretStore health (see ClusterSecretStoreNotReady) and OpenBao seal state.
              - Populate/repair the OpenBao path, then let ESO refresh (or force a sync).
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#external-secrets"

        - alert: ClusterSecretStoreNotReady
          expr: |
            max by (name) (
              clustersecretstore_status_condition{condition="Ready", status="False"}
            ) == 1
          for: 10m
          labels:
            severity: critical
            owner: platform
            service: external-secrets
          annotations:
            summary: "ClusterSecretStore not Ready ({{ $labels.name }})"
            description: |
              What's happening:
              - ClusterSecretStore {{ $labels.name }} has reported Ready=False for 10m.

              Impact/risk:
              - Every ExternalSecret backed by this store stops syncing cluster-wide;
                new/rotated secrets will not materialise.

              Likely causes:
              - OpenBao is sealed, down, or unreachable from the ESO controller.
              - The store's auth (Kubernetes auth role / token) is invalid or expired.

              First actions:
              - Check OpenBao pods and seal state (namespace=security).
              - kubectl get clustersecretstore {{ $labels.name }} -o yaml | yq '.status'
              - Restore the backend/auth; confirm dependent ExternalSecrets recover.
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#external-secrets"

        - alert: ExternalSecretSyncErrors
          expr: |
            sum by (exported_namespace, name) (
              increase(externalsecret_sync_calls_error[15m])
            ) > 0
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: external-secrets
          annotations:
            summary: "ExternalSecret sync errors ({{ $labels.exported_namespace }}/{{ $labels.name }})"
            description: |
              What's happening:
              - ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} has logged sync
                errors over the last 15m (the Secret may still be serving a stale value).

              Impact/risk:
              - Rotation/refresh is failing; the Secret drifts from the source of truth.

              Likely causes:
              - Transient OpenBao connectivity, a permissions change, or a malformed remoteRef.

              First actions:
              - Inspect external-secrets controller logs (namespace=security) for this object.
              - Verify the OpenBao path/permissions; confirm errors stop after the fix.
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#external-secrets"

        # PushSecrets had NO alerting whatsoever until 2026-09-04, despite being the
        # write path INTO OpenBao (rotation artifacts pushed back as the new source
        # of truth). forgejo/cloudflare-deploy-rolled sat Ready=False for 2d4h and
        # 459 warning events with nothing firing. A stuck PushSecret means a rotated
        # credential never reaches the backend, so consumers keep serving the old
        # value until it is revoked — a silent expiry, not a loud failure.
        - alert: PushSecretNotReady
          expr: |
            max by (exported_namespace, name) (
              pushsecret_status_condition{condition="Ready", status="False"}
            ) == 1
          for: 30m
          labels:
            severity: warning
            owner: platform
            service: external-secrets
          annotations:
            summary: "PushSecret not Ready ({{ $labels.exported_namespace }}/{{ $labels.name }})"
            description: |
              What's happening:
              - PushSecret {{ $labels.exported_namespace }}/{{ $labels.name }} has reported
                Ready=False for 30m, so its value is not reaching the OpenBao backend.

              Impact/risk:
              - Whatever this PushSecret publishes is stale in OpenBao. If it carries a
                rotated credential, every downstream ExternalSecret keeps serving the
                PREVIOUS value — which fails only once the old credential is revoked.

              Likely causes:
              - The source k8s Secret does not exist yet ("could not get source secret"):
                its owning Job/CronJob has not run, or ran and failed.
              - The openbao-push ClusterSecretStore lost write permission on the path.
              - A typo in the remoteRef remoteKey/property.

              First actions:
              - kubectl -n {{ $labels.exported_namespace }} describe pushsecret {{ $labels.name }}
              - Confirm the SOURCE Secret exists: kubectl -n {{ $labels.exported_namespace }} get secret
              - If a CronJob owns the source, check it has actually run (LAST SCHEDULE)
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/#external-secrets"
