---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-metrics
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: home-assistant-metrics
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: home-assistant/prometheus
        property: token
