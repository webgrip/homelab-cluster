---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kubernetes-mcp-server
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.webgrip.dev/ghcr/containers/charts/kubernetes-mcp-server
  ref:
    tag: "0.1.0"
    digest: sha256:9f559d036282092b45e5a5cc467ec2cd816a5d084e9e2eca80cbeca03072401a
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kubernetes-mcp-server
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      # Routed through the Harbor pull-through proxy-cache (ADR-0025) instead of quay.io direct.
      # Digest unchanged — the proxy is content-addressable (verified against the Harbor manifest
      # endpoint before landing). depName must track the Harbor path too: quay.io reports no
      # release timestamps, so a quay depName leaves `renovate/stability-days` pending forever and
      # the PR can never automerge (this is what wedged #491).
      registry: harbor.webgrip.dev
      repository: quay/containers/kubernetes_mcp_server
      # renovate: datasource=docker depName=harbor.webgrip.dev/quay/containers/kubernetes_mcp_server
      version: v0.0.67
    # Read-only at the app layer (belt). The real guarantee is RBAC below.
    config:
      read_only: true
      denied_resources:
        - group: ""
          version: v1
          kind: Secret
    serviceAccount:
      create: true
      automountToken: true
    rbac:
      create: true
      extraClusterRoles:
        - name: reader
          rules:
            - apiGroups:
                - ""
              resources:
                - bindings
                - configmaps
                - endpoints
                - events
                - limitranges
                - namespaces
                - namespaces/status
                - persistentvolumeclaims
                - persistentvolumeclaims/status
                - pods
                - pods/status
                - replicationcontrollers
                - replicationcontrollers/scale
                - replicationcontrollers/status
                - resourcequotas
                - resourcequotas/status
                - serviceaccounts
                - services
                - services/status
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - events.k8s.io
              resources:
                - events
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - discovery.k8s.io
              resources:
                - endpointslices
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - apps
              resources:
                - controllerrevisions
                - daemonsets
                - daemonsets/status
                - deployments
                - deployments/scale
                - deployments/status
                - replicasets
                - replicasets/scale
                - replicasets/status
                - statefulsets
                - statefulsets/scale
                - statefulsets/status
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - autoscaling
              resources:
                - horizontalpodautoscalers
                - horizontalpodautoscalers/status
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - batch
              resources:
                - cronjobs
                - cronjobs/status
                - jobs
                - jobs/status
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - policy
              resources:
                - poddisruptionbudgets
                - poddisruptionbudgets/status
              verbs:
                - get
                - list
                - watch
            - apiGroups:
                - networking.k8s.io
              resources:
                - ingresses
                - ingresses/status
                - networkpolicies
              verbs:
                - get
                - list
                - watch
      extraClusterRoleBindings:
        - name: reader
          roleRef:
            name: reader
        - name: custom-resources
          roleRef:
            name: human-reader-custom-resources
            external: true
    podLabels:
      mcp.webgrip.io/access: litellm-gateway-only
    ingress:
      enabled: false
    httpRoute:
      enabled: false
    # Keep off the shared etcd control-plane disk; run on the worker like mcp-grafana.
    nodeSelector:
      node.webgrip.io/pool: worker
    tolerations:
      - key: dedicated
        operator: Equal
        value: fringe
        effect: NoSchedule
    podAnnotations:
      reloader.stakater.com/auto: "true"
