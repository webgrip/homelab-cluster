---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
  # Standalone replacement for the kube-state-metrics subchart that
  # kube-prometheus-stack used to bundle. Provides kube_* (consumed by half the
  # platform/security rules, OpenCost and the dashboards). Values ported from the
  # old subchart config.
  values:
    # kube_pod_status_reason (~1.6k series) is unused by any dashboard/rule here.
    metricDenylist:
      - kube_pod_status_reason
    metricLabelsAllowlist:
      - nodes=[node.webgrip.io/pet]
      - configmaps=[backup.webgrip.io/restore-verified,backup.webgrip.io/namespace,backup.webgrip.io/name,backup.webgrip.io/kind]
    rbac:
      extraRules:
        - apiGroups:
            - infra.contrib.fluxcd.io
          resources:
            - terraforms
          verbs:
            - list
            - watch
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
            - groupVersionKind:
                group: infra.contrib.fluxcd.io
                version: v1alpha2
                kind: Terraform
              metricNamePrefix: tofu
              labelsFromPath:
                terraform_name:
                  - metadata
                  - name
                terraform_namespace:
                  - metadata
                  - namespace
              metrics:
                - name: terraform_status_condition
                  help: Condition status of a tofu-controller Terraform object.
                  each:
                    type: StateSet
                    stateSet:
                      path:
                        - status
                        - conditions
                      labelName: status
                      labelsFromPath:
                        type:
                          - type
                        reason:
                          - reason
                      valueFrom:
                        - status
                      list:
                        - "True"
                        - "False"
                        - "Unknown"
    podAnnotations:
      reloader.stakater.com/auto: "true"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    nodeSelector:
      node.webgrip.io/pool: worker
    tolerations:
      - key: dedicated
        operator: Equal
        value: fringe
        effect: NoSchedule
    # Emit a ServiceMonitor; the VM operator converts it to a VMServiceScrape and
    # VMAgent (selectAllByDefault) scrapes it. The release label is a no-op now.
    prometheus:
      monitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
