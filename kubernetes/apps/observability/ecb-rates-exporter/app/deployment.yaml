---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecb-rates-exporter
  labels:
    app.kubernetes.io/name: ecb-rates-exporter
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ecb-rates-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecb-rates-exporter
        app.kubernetes.io/part-of: observability
    spec:
      nodeSelector:
        node.webgrip.io/pool: worker
      serviceAccountName: ecb-rates-exporter
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
          command:
            - python3
            - -u
            - /opt/exporter/exporter.py
          env:
            - name: REFRESH_INTERVAL_SECONDS
              value: "3600"
            - name: LISTEN_PORT
              value: "9803"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: metrics
              containerPort: 9803
          volumeMounts:
            - name: script
              mountPath: /opt/exporter
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
      volumes:
        - name: script
          configMap:
            name: ecb-rates-exporter-script
