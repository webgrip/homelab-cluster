---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-gateway-tailnet-key
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: unfold-gateway-tailnet-key
    creationPolicy: Owner
  data:
    - secretKey: authkey
      remoteRef:
        key: unfold/tailnet-homelab-gateway
        property: authkey
