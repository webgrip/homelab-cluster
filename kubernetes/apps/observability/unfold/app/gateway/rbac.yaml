---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unfold-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unfold-gateway
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "unfold-gateway-tailscale-state"
    verbs:
      - "get"
      - "update"
      - "patch"
  - apiGroups:
      - ""
    resources:
      - "events"
    verbs:
      - "create"
      - "patch"
      - "get"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unfold-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unfold-gateway
subjects:
  - kind: ServiceAccount
    name: unfold-gateway
    namespace: observability
