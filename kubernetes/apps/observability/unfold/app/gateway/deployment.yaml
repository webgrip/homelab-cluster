---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unfold-gateway
  labels:
    app.kubernetes.io/name: unfold-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unfold-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unfold-gateway
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: unfold-gateway
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmauth
          image: harbor.webgrip.dev/dockerhub/victoriametrics/vmauth:v1.147.0@sha256:93ff53c9ce2b1a9e54064b5158657de141588337e95a6bce7928dd205c73ce8d
          args:
            - -httpListenAddr=:8427
            - -auth.config=/config/vmauth.yaml
            - -maxRequestBodySizeToRetry=0
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 8427
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
        - name: tailscale
          image: harbor.webgrip.dev/ghcr/tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_KUBE_SECRET
              value: unfold-gateway-tailscale-state
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_HOSTNAME
              value: homelab-gateway
            - name: TS_EXTRA_ARGS
              value: --login-server=https://headscale.${SECRET_DOMAIN} --accept-dns=false --accept-routes
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
            - name: TS_ENABLE_METRICS
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: "[::]:9002"
            - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
              value: 127.0.0.1:1055
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: unfold-gateway-tailnet-key
                  key: authkey
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: ts-metrics
              containerPort: 9002
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: unfold-query
          image: harbor.webgrip.dev/dockerhub/victoriametrics/vmauth:v1.147.0@sha256:93ff53c9ce2b1a9e54064b5158657de141588337e95a6bce7928dd205c73ce8d
          args:
            - -httpListenAddr=:8481
            - -auth.config=/config/unfold-query.yaml
            - -loggerFormat=json
          env:
            - name: HTTPS_PROXY
              value: http://127.0.0.1:1055
            - name: NO_PROXY
              value: localhost,127.0.0.1,.svc,.svc.cluster.local
            - name: UNFOLD_QUERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: unfold-query-token
                  key: token
          ports:
            - name: query
              containerPort: 8481
          readinessProbe:
            httpGet:
              path: /health
              port: query
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: unfold-gateway
        - name: tmp
          emptyDir: {}
