---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./rbac.yaml
  - ./deployment.yaml
  - ./vmpodscrape.yaml
configMapGenerator:
  - name: unfold-gateway
    files:
      - vmauth.yaml
      - serve.json
      - unfold-query.yaml
    options:
      labels:
        app.kubernetes.io/name: unfold-gateway
generatorOptions:
  disableNameSuffixHash: true
