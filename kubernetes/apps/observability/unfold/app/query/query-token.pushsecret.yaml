---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-query-token
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: unfold-query-token
  data:
    - match: {secretKey: token, remoteRef: {remoteKey: unfold-main/observability/query-token, property: token}}
