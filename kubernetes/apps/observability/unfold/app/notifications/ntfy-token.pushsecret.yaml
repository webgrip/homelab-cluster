---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-alertmanager-ntfy
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-push
  selector:
    secret:
      name: unfold-alertmanager-ntfy
  data:
    - match: {secretKey: token, remoteRef: {remoteKey: unfold-main/alertmanager/ntfy, property: token}}
