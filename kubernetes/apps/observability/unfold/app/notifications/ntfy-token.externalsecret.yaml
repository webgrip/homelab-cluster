---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-alertmanager-ntfy
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The alertmanager_token field of secret/ntfy/auth, written by just ntfy-auth-cred together with ntfy's users and tokens. Use that recipe."
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.alertmanager_token: "tk_[a-z0-9]{29}"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: unfold-alertmanager-ntfy
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ntfy/auth
        property: alertmanager_token
