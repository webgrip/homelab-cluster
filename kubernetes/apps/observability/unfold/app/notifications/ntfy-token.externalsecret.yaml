---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-alertmanager-ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: unfold-alertmanager-ntfy
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ntfy/auth
        property: alertmanager_token
