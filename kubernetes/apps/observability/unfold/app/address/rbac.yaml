---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unfold-gateway-address
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unfold-gateway-address
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "unfold-gateway-tailscale-state"
    verbs:
      - "get"
  - apiGroups:
      - "externaldns.k8s.io"
    resources:
      - "dnsendpoints"
    resourceNames:
      - "unfold-gateway"
    verbs:
      - "get"
      - "patch"
  - apiGroups:
      - "externaldns.k8s.io"
    resources:
      - "dnsendpoints"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unfold-gateway-address
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unfold-gateway-address
subjects:
  - kind: ServiceAccount
    name: unfold-gateway-address
    namespace: observability
