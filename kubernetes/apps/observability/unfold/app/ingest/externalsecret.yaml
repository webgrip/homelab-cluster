---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-ingest-tailnet-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: unfold-ingest-tailnet-key
    creationPolicy: Owner
  data:
    - secretKey: authkey
      remoteRef:
        key: unfold/tailnet-homelab-ingest
        property: authkey
