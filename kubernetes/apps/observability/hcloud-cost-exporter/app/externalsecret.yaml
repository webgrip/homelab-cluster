---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hcloud-unfold-readonly
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hcloud-unfold-readonly
    creationPolicy: Owner
  data:
    - secretKey: HCLOUD_TOKEN
      remoteRef:
        key: hetzner/unfold-readonly
        property: HCLOUD_TOKEN
