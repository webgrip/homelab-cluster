---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hcloud-unfold-readonly
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A read-only Hetzner Cloud API token of the Unfold project: Hetzner Console, the project, Security, API tokens, Read."
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/homelab-cluster/src/branch/main/docs/techdocs/docs/runbooks/hetzner-cloud-costs.md"
    wellhead.dev/verify: "http"
    wellhead.dev/verify.http.url: "https://api.hetzner.cloud/v1/servers"
    wellhead.dev/verify.http.auth: "bearer:HCLOUD_TOKEN"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: hcloud-unfold-readonly
    creationPolicy: Owner
  data:
    - secretKey: HCLOUD_TOKEN
      remoteRef:
        key: hetzner/unfold-readonly
        property: HCLOUD_TOKEN
