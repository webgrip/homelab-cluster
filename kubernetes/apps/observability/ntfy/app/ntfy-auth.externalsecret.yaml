---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-auth
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "Written by just ntfy-auth-cred, which asks for the phone user's password and generates the rest (bcrypt hashes, the alertmanager token). Use that recipe rather than typing these fields."
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.users: "alertmanager:\\$2[aby]\\$\\S+:user,phone:\\$2[aby]\\$\\S+:user"
    wellhead.dev/verify.format.tokens: "alertmanager:tk_[a-z0-9]{29}:alertmanager-publish"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: ntfy-auth
    creationPolicy: Owner
  data:
    # users:  "<name>:<bcrypt-hash>:<role>[,...]"  — bcrypt hashes are secrets-adjacent
    # tokens: "<name>:tk_<29 lowercase alnum>[:label][,...]"
    - secretKey: NTFY_AUTH_USERS
      remoteRef:
        key: ntfy/auth
        property: users
    - secretKey: NTFY_AUTH_TOKENS
      remoteRef:
        key: ntfy/auth
        property: tokens
