---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: 1.11.2
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    defaultSettings:
      defaultDataPath: "/var/lib/longhorn"
      # NOTE: the backup target is set via the `default` BackupTarget CR
      # (backuptarget.yaml), NOT here — Longhorn 1.11 ignores the deprecated
      # defaultSettings.backupTarget. Creds: backup-s3.externalsecret.yaml.
      replicaDiskSoftAntiAffinity: false
      createDefaultDiskLabeledNodes: false
      defaultDataLocality: best-effort
      defaultLonghornStaticStorageClass: longhorn
      # 2-replica ceiling (ADR-0008): only 2 schedulable storage nodes — worker-1
      # and worker-2 since 2026-08-02 (fringe is `allowScheduling=false` after the
      # 08-01/02 memory incident) — with HARD anti-affinity, so 2 is the max anyway.
      #
      # NOTE: the chart-created default `longhorn` StorageClass still carries
      # numberOfReplicas=3 from persistence.defaultClassReplicaCount (an immutable
      # SC param — not changed here, since Helm would have to delete and recreate
      # the class out from under every bound PVC). This global only applies when a
      # class OMITS the parameter, and that one does not — so it does not save you.
      #
      # The runtime reduction done by hand on 2026-06-19 regressed exactly as you
      # would expect: every newly-provisioned PVC came back at 3, and by 2026-08-02
      # 18 volumes were permanently `degraded` waiting on a third replica that can
      # never schedule. The convergence is now enforced by the Kyverno policy
      # `longhorn-replica-ceiling` (kyverno/policies/app/longhorn-replica-ceiling.yaml),
      # which is self-healing where a `kubectl edit` was not.
      defaultReplicaCount: "2"
      defaultSharedVolumeType: nfs
      # guaranteedEngineManagerCPU/guaranteedReplicaManagerCPU are ignored since the
      # v1.5 instance-manager merge — the cluster was silently running the 12% default
      # while starvation waves killed instance-managers (2026-06-12 cascade). 20% of
      # node CPU as an explicit request keeps IMs schedulable-guaranteed under load.
      # Danger-zone setting: applies per-node once its volumes detach, not immediately.
      # 12 (Longhorn's own default) instead of 20: on the 8-core fringe node the
      # 20% reservation was 1590m of phantom booking on an idle-ish IM (VIK-595
      # rebalance 2026-07-25). Applies as instance-manager pods recreate — not
      # instant on nodes with attached volumes.
      guaranteedInstanceManagerCPU: "12"
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      orphanAutoDeletion: true
      # Disabled 2026-06-09: best-effort auto-balance generated a rebuild storm
      # after the capacity cleanup that OOM-killed the (BestEffort-QoS)
      # longhorn-manager under memory spikes, cascading into FailedRebuilding +
      # a stuck WAL-PVC resize (dependency-track-db down). These nodes are RAM
      # -tight; keep replica placement static and rebalance manually if needed.
      replicaAutoBalance: disabled
      replicaReplenishmentWaitInterval: "120"
      concurrentReplicaRebuildPerNodeLimit: "1"
      rebuildConcurrentSyncLimit: "2"
      storageMinimalAvailablePercentage: "10"
      storageReservedPercentageForDefaultDisk: "10"
      # Volumes are heavily thin/over-provisioned: ~541Gi reserved vs ~109Gi
      # actually used (one copy) — every CNPG DB reserves 20-30Gi for <0.5Gi of
      # data. To get BOTH replicas off the soyos (ADR-0008) the second copy must
      # reserve onto fringe's 236Gi SSD, which can't fit 541Gi at the default
      # 100%. Raise to 300% so the thin volumes schedule there; real usage stays
      # ~46% of fringe's SSD. WATCH fringe SSD free — the only unbounded growers
      # are prometheus (50Gi cap) and WAL (capped by walStorage + Garage archive).
      # Durable fix is right-sizing the volumes / adding the fringe HDD (ADR-0009).
      storageOverProvisioningPercentage: "300"
      # Allow system-managed components (like longhorn-csi-plugin) to run on the tainted fringe node.
      taintToleration: "dedicated=fringe:NoSchedule"
    ingress:
      enabled: false
    metrics:
      serviceMonitor:
        enabled: true
        interval: 60s
        scrapeTimeout: 30s
        metricRelabelings:
          - action: drop
            sourceLabels:
              - __name__
            regex: longhorn_rest_client_rate_limiter_latency_seconds_bucket

    # Allow the Longhorn manager DaemonSet to run on the tainted fringe node.
    longhornManager:
      tolerations:
        - key: dedicated
          operator: Equal
          value: fringe
          effect: NoSchedule
    # UI + driver-deployer off the soyo control-planes (2026-07-11 placement
    # audit). Only these two — longhornManager is a DaemonSet (all nodes) and
    # the csi-* controllers stay unconstrained (volume attach during recovery).
    longhornUI:
      nodeSelector:
        node.webgrip.io/pool: worker
    longhornDriver:
      nodeSelector:
        node.webgrip.io/pool: worker
  # Give longhorn-manager Guaranteed QoS (requests==limits on BOTH containers) so
  # the kernel does not OOM-kill it first under node memory pressure — the root
  # cause of the 2026-06-09 incident (it ran BestEffort). Observed usage is
  # ~370Mi / 40m; limits are generous headroom to avoid self-OOM during storms.
  # The chart only exposes longhornManager.resources (the manager container), so
  # the sidecar must be patched too or the pod stays Burstable. See
  # docs/techdocs/docs/incidents/2026-06-09-longhorn-oom-cascade.md.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: longhorn-manager
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: longhorn-manager
                        # Right-sized 2026-08-01 against measured usage across all 5 nodes:
                        # 10-24m CPU, 348-417Mi memory. 250m/1Gi reserved ~10x the CPU and ~2.5x
                        # the memory actually used, on every node, permanently — 1.25Gi and 0.5
                        # CPU of cluster-wide phantom booking that helped make worker-1
                        # unschedulable at 3947m/3950m requested while using 660m.
                        #
                        # 150m = 6x headroom over the observed peak; 768Mi = ~84% headroom.
                        # requests == limits deliberately: this is the storage control plane, and
                        # Guaranteed QoS keeps it last in line for eviction under node memory
                        # pressure. Dropping requests below limits would have reclaimed slightly
                        # more and made it evictable, which is the wrong trade for Longhorn.
                        resources:
                          requests:
                            cpu: 150m
                            memory: 768Mi
                          limits:
                            cpu: 150m
                            memory: 768Mi
                      - name: pre-pull-share-manager-image
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            cpu: 10m
                            memory: 64Mi
