---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-longhorn-oidc
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-longhorn-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: longhorn
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: authentik/longhorn-oidc
        property: client_secret
