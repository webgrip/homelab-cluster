---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ADR-0010 consolidated StorageClass set. `general` is the canonical 2-replica
  # SSD/default tier (it IS the "hot" tier — no separate longhorn-hot class).
  - ./general.yaml
  - ./snapshot.yaml
  - ./rwx.yaml
  # Single-replica tier for regenerable/offsite-backed bulk data (in-cluster
  # Garage). Retire once a third storage node makes 2 replicas affordable again.
  - ./single.yaml
  # ADR-0009 cold tier (inert until the fringe HDD is wiped + tagged `cold`).
  # NOTE: longhorn-gitops was RETIRED 2026-06-21 — the soyo-replica design for
  # forgejo/openbao was dropped (soyos stay Longhorn-free; DR is via external
  # Garage S3 backups + a future GitHub fallback Flux source). See ADR-0008.
  - ./cold.yaml
