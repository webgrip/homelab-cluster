---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-secrets-bridge
  labels:
    app.kubernetes.io/name: github-secrets-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-secrets-bridge
  labels:
    app.kubernetes.io/name: github-secrets-bridge
rules:
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    resourceNames:
      - "github-secrets-bridge-state"
      - "github-secrets-bridge-state-ploeg-release-consumer-github-app-id"
      - "github-secrets-bridge-state-ploeg-release-consumer-github-app-private-key"
      - "github-secrets-bridge-state-unfold-cloudflare-api-token"
      - "github-secrets-bridge-state-unfold-cloudflare-account-id"
      - "github-secrets-bridge-state-unfold-cloudflare-dns-read-token"
      - "github-secrets-bridge-state-unfold-dockerhub-username"
      - "github-secrets-bridge-state-unfold-dockerhub-token"
    verbs:
      - "get"
      - "update"
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-secrets-bridge
  labels:
    app.kubernetes.io/name: github-secrets-bridge
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: github-secrets-bridge}
subjects:
  - {kind: ServiceAccount, name: github-secrets-bridge, namespace: github-secrets-bridge}
