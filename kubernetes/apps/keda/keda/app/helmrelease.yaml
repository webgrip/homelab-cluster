---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/helm-controller/main/docs/api/v2/helmrelease.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  interval: 1h
  chart:
    spec:
      chart: keda
      version: 2.21.0
      sourceRef:
        kind: HelmRepository
        name: keda
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # KEDA bundles its CRDs in the chart.
    crds:
      install: true
    # Scaler HTTP timeout 3s -> 30s (chart templates this into KEDA_HTTP_DEFAULT_TIMEOUT — do
    # NOT also add it via `env:`, that renders a duplicate env key and the upgrade fails SSA).
    # Forgejo's /api/v1/admin/runners/jobs (the forgejo-runner scaler's metric) answers slower
    # than KEDA's 3s default once the Actions queue is deep, so every poll timed out, the scaler
    # read "0 pending", and the runner pool NEVER burst past the warm floor — a vicious cycle
    # observed 2026-07-18 (30+ queued jobs, 2 runners, releases waiting 60+ min; keda-operator
    # log: "Client.Timeout exceeded" every 15s). Applies to all KEDA scalers; this cluster's
    # only latency-sensitive one is forgejo-runner.
    http:
      timeout: 30000
    # Route the chart's default ghcr.io/kedacore/* images through the Harbor
    # pull-through proxy-cache (ADR-0025) instead of ghcr.io direct. The chart
    # has no dedicated digest field, so digests are appended inline onto tag
    # (repo:tag@digest) -- same pattern as gitea-mirror. Digests verified live
    # (running pod imageIDs) and via `docker manifest inspect` against Harbor
    # before landing. VIK-241/242.
    # KEEP THESE IN LOCKSTEP WITH THE CHART VERSION: the chart's operator flags
    # track the app (chart 2.20.2 passes --http-max-idle-conns, which image
    # 2.20.0 rejects with "unknown flag" + usage dump → crashloop → upgrade
    # timeout → rollback; exactly this wedged the forgejo-runner dependency
    # chain on 2026-08-29 when Renovate automerged the chart bump alone).
    image:
      keda:
        registry: harbor.webgrip.dev/ghcr
        repository: kedacore/keda
        tag: "2.21.0@sha256:81fe6547ce8d1cc29273f887b76507e9b853e5bc1f875ec23fe60061a38ed809"
      metricsApiServer:
        registry: harbor.webgrip.dev/ghcr
        repository: kedacore/keda-metrics-apiserver
        tag: "2.21.0@sha256:255375037fe592732eeb554743aae360c2da88cf0b9b1258d0a987ef885f0881"
      webhooks:
        registry: harbor.webgrip.dev/ghcr
        repository: kedacore/keda-admission-webhooks
        tag: "2.21.0@sha256:e1969628cca6123e32eea13c47c75817091af2657fa68d9d0d58a8620d1b75b1"
    operator:
      replicaCount: 1
    metricsServer:
      replicaCount: 1
    resources:
      operator:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      metricServer:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    prometheus:
      operator:
        enabled: true
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
      metricServer:
        enabled: true
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
