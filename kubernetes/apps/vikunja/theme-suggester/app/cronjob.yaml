---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: theme-suggester
  namespace: vikunja
  labels:
    app.kubernetes.io/name: theme-suggester
spec:
  schedule: "20 * * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2700
      template:
        metadata:
          labels:
            app.kubernetes.io/name: theme-suggester
        spec:
          serviceAccountName: theme-suggester
          imagePullSecrets:
            - name: theme-suggester-harbor-pull
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: suggest
              image: harbor.webgrip.dev/webgrip/laya-serve:0.1.0@sha256:026bccb4517785507907e68728d674d9a7129aeed1606de4055ff8e4ddba1d7e
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /etc/theme-suggester/theme_suggester.py
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
                - {name: VIKUNJA_URL, value: "http://vikunja.vikunja.svc.cluster.local:3456/api/v1"}
                - {name: VIKUNJA_TOKEN_FILE, value: /run/secrets/vikunja/token}
                - {name: LAYA_URL, value: "http://laya.ai.svc.cluster.local:8000"}
                - {name: LAYA_MODEL, value: typed-decisions}
                - {name: PROJECTS, value: "3,5,6,9,10"}
                - {name: MODE, value: shadow}
                - {name: APPLY_THRESHOLD, value: "0.9"}
                - {name: MIN_THEME_TICKETS, value: "3"}
                - {name: LOOKBACK_DAYS, value: "30"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - {name: script, mountPath: /etc/theme-suggester, readOnly: true}
                - {name: token, mountPath: /run/secrets/vikunja, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap:
                name: theme-suggester
            - name: token
              secret:
                secretName: theme-suggester-token
                optional: true
                defaultMode: 0440
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
