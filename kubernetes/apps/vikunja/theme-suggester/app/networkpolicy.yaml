---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: theme-suggester-to-laya
  namespace: vikunja
  labels:
    app.kubernetes.io/part-of: theme-suggester
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: theme-suggester
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: laya
      ports:
        - protocol: TCP
          port: 8000
