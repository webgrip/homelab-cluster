---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: theme-suggester-token
  namespace: vikunja
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: theme-suggester-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: vikunja/mcp
        property: api_token
