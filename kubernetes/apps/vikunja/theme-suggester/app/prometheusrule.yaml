---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: theme-suggester
  namespace: vikunja
  labels:
    app.kubernetes.io/name: theme-suggester
spec:
  groups:
    - name: theme-suggester.rules
      rules:
        - alert: ThemeSuggesterStale
          expr: |
            time() - max(
              (kube_cronjob_status_last_successful_time{exported_namespace="vikunja", cronjob="theme-suggester"} > 0)
              or
              kube_cronjob_created{exported_namespace="vikunja", cronjob="theme-suggester"}
            ) > 10800
            or
            absent(kube_cronjob_created{exported_namespace="vikunja", cronjob="theme-suggester"})
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: vikunja
          annotations:
            summary: "Board theme suggestions have not run successfully in over 3h (vikunja/theme-suggester)"
            description: |
              What's happening:
              - The theme-suggester CronJob runs every hour and has not completed a run for more than 3h, or it has never succeeded since it was created, or it no longer exists.

              Impact/risk:
              - In shadow mode: no agreement data is collected, so the apply threshold cannot be tuned.
              - In apply mode: new tickets stay without a theme suggestion or label.

              Likely causes:
              - No Vikunja token at secret/vikunja/theme-suggester yet, or it was revoked (log: "no_vikunja_token").
              - The Laya server in ai/laya is down, or answered the built-in control question wrongly (log: "control_failed").
              - The bot user cannot see the boards, so the scan was empty (log: "empty_scan").

              First actions:
              - kubectl -n vikunja get cronjob,jobs -l app.kubernetes.io/name=theme-suggester
              - kubectl -n vikunja logs job/<latest job>
              - kubectl -n ai get deploy,pods -l app.kubernetes.io/name=laya
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/theme-suggester/"
