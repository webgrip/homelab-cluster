---
# Vikunja MCP for Claude Code: supergateway bridges the stdio-only
# @aimbitgmbh/vikunja-mcp npm server to streamable HTTP at /mcp (the npm
# ecosystem has no native-HTTP Vikunja MCP). An initContainer npm-installs the
# pinned package (with the MCP SDK pinned via overrides — see below) into the
# /tmp emptyDir at pod start — hence the internet-egress NetworkPolicy
# carve-out; runtime child spawns run offline from that install.
# WRITE-CAPABLE: acts as the token owner's Vikunja user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-vikunja
  labels:
    app.kubernetes.io/name: mcp-vikunja
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Single replica pinned to worker-1: RollingUpdate would need BOTH pods on
  # that node at once, which wedged Pending (Insufficient cpu) once VMSingle +
  # litellm moved there. Recreate releases the request first; brief gap is fine.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0 # Recreate semantics without the strategy-flip apply
      maxUnavailable: 1 # conflict: old pod frees worker-1 before the new one
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-vikunja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-vikunja
    spec:
      # Pinned to worker-1 — co-located with the vikunja API + DB primary
      # (vikunja-db-1). The oversubscribed fringe-workstation node was
      # CPU-throttling this bridge into ~17s responses and exit-1 crashes
      # (9 restarts / 9h, 2026-07-18); worker-1 keeps the whole request path
      # (mcp → API → primary) on one node.
      nodeSelector:
        kubernetes.io/hostname: worker-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Install the child ONCE per pod with @modelcontextprotocol/sdk pinned via
        # npm overrides. `npx -y` re-resolved vikunja-mcp's `^1.25.1` SDK range on
        # every pod start; SDK 1.30.0 (2026-07-27) made the child answer initialize
        # with protocolVersion 2025-11-25 instead of echoing the client's requested
        # version, which Claude Code rejects ("Unsupported protocol version", max
        # 2025-06-18) — the aborted connection then crashed supergateway's stateless
        # bridge ("No connection established for request ID"), 39 restarts in 16d.
        # 1.29.0 is the newest SDK that predates the regression and satisfies
        # ^1.25.1 (zod v4 support landed in 1.25.x, so no API skew). Installing in
        # an initContainer also removes the per-request npx race of stateless mode.
        - name: prepare-vikunja-mcp
          image: docker.io/supercorp/supergateway:3.4.3@sha256:095acf4471e142553c1a5514aa5e480abbc5885d00549d4a3481cc70eac53889
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /tmp/app
              cd /tmp/app
              npm init -y >/dev/null
              npm pkg set 'overrides.@modelcontextprotocol/sdk=1.29.0'
              npm install --no-audit --no-fund --loglevel=error @aimbitgmbh/vikunja-mcp@0.1.0
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/npm-cache
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: mcp-vikunja
          image: docker.io/supercorp/supergateway:3.4.3@sha256:095acf4471e142553c1a5514aa5e480abbc5885d00549d4a3481cc70eac53889
          args:
            - --stdio
            # The initContainer above installed this with the SDK override; running
            # node directly (no npx) makes stateless per-request child spawns fast
            # and deterministic.
            - node /tmp/app/node_modules/@aimbitgmbh/vikunja-mcp/dist/index.js
            - --outputTransport
            - streamableHttp
            - --port
            - "8000"
            # STATELESS (2026-07-18, VIK-314/VIK-263): a fresh vikunja-mcp child
            # per request, npx warm from the /tmp cache (~1-2s/call). Stateful
            # session mode broke TWO consumer classes: strict MCP SDK clients
            # (LiteLLM gateway: "Session termination failed: 400" →
            # BrokenResourceError on list_tools) and the 2026-07-12 session-leak
            # OOM. Stateless trades per-call latency for correctness — bulk
            # board scripts get slower but reliable.
            # Real health endpoint (supergateway returns "ok") so the probes can
            # catch a functionally-dead gateway, not just an open TCP port.
            - --healthEndpoint
            - /healthz
          env:
            # In-cluster direct to the app Service — no gateway hairpin.
            # The trailing /api/v1 is required by vikunja-mcp.
            - name: VIKUNJA_URL
              value: "http://vikunja.vikunja.svc.cluster.local:3456/api/v1"
            # Hard deletes for projects/tasks stay off (vikunja-mcp safe mode):
            # project_delete archives, task_delete completes — Vikunja has no
            # trash/undo. Label deletes ARE enabled: a label delete only unlinks
            # metadata (tasks keep their other labels), and board hygiene needs
            # it (duplicate-label dedup).
            - name: ENABLE_LABEL_DELETE
              value: "true"
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/npm-cache
          envFrom:
            - secretRef:
                name: mcp-vikunja-token # VIKUNJA_API_TOKEN
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # httpGet /healthz (supergateway --healthEndpoint): a tcpSocket probe
          # only checks the port is open, so it reported Ready while the gateway
          # was serving 17s responses and never restarted a wedged child.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              # 25m starved the bridge under node contention; give it a real
              # CPU floor so it is not throttled to 17s latencies.
              cpu: 100m
              # Steady state is ~27Mi; the request only needs to cover the idle
              # bridge, so it stays small and does not hold worker-1 hostage.
              memory: 128Mi
            limits:
              cpu: 500m
              # OOMKilled (exit 137) 6x on 2026-07-18 at the old 768Mi ceiling while
              # idling at 27Mi -- a transient SPIKE, not a leak: supergateway relays each
              # message several times over (Child → StreamableHttp, then → Child twice),
              # so one large tool payload -- e.g. a long HTML task comment -- is buffered
              # repeatedly and briefly dwarfs steady state. The kills land mid-handshake,
              # which is what stops MCP clients from ever completing initialize.
              #
              # Then OOMKilled 4x more the same day AT 2Gi under CONCURRENT agent
              # sessions (multiple Claude streams doing board CRUD with multi-KB HTML
              # payloads simultaneously) -- the spike multiplies per active session.
              # 3Gi covers the observed worst case; if it hits THIS ceiling, stop
              # raising and profile supergateway's buffering instead (candidate: SSE
              # replay/session history growing unbounded).
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
