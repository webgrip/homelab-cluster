---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-vikunja
  labels:
    app.kubernetes.io/name: mcp-vikunja
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-vikunja
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-vikunja
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: prepare-vikunja-mcp
          image: docker.io/supercorp/supergateway:4.0.0@sha256:407344de762a449f129c576fa1e3934b63c43fef417322687972ffc43ec675df
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /tmp/app
              cd /tmp/app
              npm init -y >/dev/null
              npm install --no-audit --no-fund --loglevel=error \
                supergateway@4.0.0 @aimbitgmbh/vikunja-mcp@0.1.0
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/npm-cache
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: mcp-vikunja
          image: docker.io/supercorp/supergateway:4.0.0@sha256:407344de762a449f129c576fa1e3934b63c43fef417322687972ffc43ec675df
          command:
            - node
            - /tmp/app/node_modules/supergateway/dist/index.js
          args:
            - --stdio
            - node /tmp/app/node_modules/@aimbitgmbh/vikunja-mcp/dist/index.js
            - --outputTransport
            - streamableHttp
            - --port
            - "8000"
            - --healthEndpoint
            - /healthz
          env:
            - name: VIKUNJA_URL
              value: "http://vikunja.vikunja.svc.cluster.local:3456/api/v1"
            - name: ENABLE_LABEL_DELETE
              value: "true"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/npm-cache
          envFrom:
            - secretRef:
                name: mcp-vikunja-token
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
