---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-vikunja-allow-ingress
  labels:
    app.kubernetes.io/part-of: vikunja
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-vikunja
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-vikunja-allow-egress
  labels:
    app.kubernetes.io/part-of: vikunja
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-vikunja
  policyTypes:
    - Egress
  egress:
    # npm registry: npx fetches the pinned vikunja-mcp package when a MCP
    # session spawns (cached in /tmp afterwards). Vikunja itself is reached
    # in-cluster via the namespace-wide intra-ns allow, not this rule.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
