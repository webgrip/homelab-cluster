---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-vikunja-token
  annotations:
    wellhead.dev/origin: "projected"
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: mcp-vikunja-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VIKUNJA_API_TOKEN: "{{ .api_token }}"
  data:
    - secretKey: api_token
      remoteRef: {key: vikunja/mcp, property: api_token}
