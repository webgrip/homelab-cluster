---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-restore-test
spec:
  suspend: false
  schedule: "0 10 * * 2"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: restore-test
              env:
                - name: SOURCE_CLUSTER
                  value: vikunja-db
                - name: RESTORE_CLUSTER
                  value: vikunja-db-restore
                - name: EXPECTED_DATABASE
                  value: app
                - name: EXPECTED_ROLE
                  value: app
                - name: BARMAN_OBJECT_NAME
                  value: vikunja-db-store
