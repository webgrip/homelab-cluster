---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vikunja-db
  namespace: vikunja
  labels:
    monitoring.webgrip.io/enabled: "true"
spec:
  instances: 2
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  # Pin the DB off the soyo control-planes onto the worker pool (ADR-0002).
  affinity:
    nodeSelector:
      node.webgrip.io/pool: worker
    # CNPG's default anti-affinity is `preferred`, and until worker-2 joined on
    # 2026-08-02 exactly ONE node satisfied pool=worker — so both instances of
    # this 2-replica cluster ran on worker-1 and the PDB reported ALLOWED
    # DISRUPTIONS: 0. Two replicas, one failure domain: HA in name only. This one
    # matters more than most — the roadmap board lives here (ADR-0043).
    # `required` is satisfiable now that the pool has three nodes.
    enablePodAntiAffinity: true
    podAntiAffinityType: required
  inheritedMetadata:
    annotations:
      reloader.stakater.com/auto: "true"
  storage:
    resizeInUseVolumes: true
    size: 5Gi
    storageClass: longhorn
  walStorage:
    resizeInUseVolumes: true
    size: 5Gi
    storageClass: longhorn
  postgresql:
    shared_preload_libraries:
      - pg_stat_statements
    parameters:
      # Backup-tier policy (Tier 2): compress WAL full-page images to shrink the
      # S3 archive and local WAL. See docs/techdocs/docs/general/database-backup-tiers.md
      wal_compression: "zstd"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: false
      parameters:
        barmanObjectName: vikunja-db-store
        serverName: vikunja-db
  managed:
    roles:
      # Read-only role for Grafana's vikunja-db datasource. inRoles: [pg_read_all_data]
      # (PG14+ predefined role) grants SELECT everywhere — incl. users/task bodies;
      # accepted: Grafana is Authentik-gated (revisit with per-table GRANTs if the
      # viewer base widens). Password generated in-cluster (grafana-ro.externalsecret.yaml).
      - name: grafana_ro
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        bypassrls: false
        inRoles:
          - pg_read_all_data
        passwordSecret:
          name: vikunja-grafana-ro
  bootstrap:
    initdb:
      database: app
      owner: app
