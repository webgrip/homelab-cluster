---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-metrics
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0" # generate once
  target:
    name: vikunja-metrics
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: "metrics"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
