---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-oidc
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: vikunja-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTSECRET: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef: {key: vikunja/oidc, property: client_secret}
