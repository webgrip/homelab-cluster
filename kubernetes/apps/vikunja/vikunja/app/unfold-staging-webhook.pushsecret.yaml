---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-staging-vikunja-webhook
spec:
  refreshInterval: 10m
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: unfold-staging-vikunja-webhook}}
  data:
    - match: {secretKey: webhook-secret, remoteRef: {remoteKey: unfold-main/staging/vikunja, property: webhook-secret}}
