---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vikunja-unfold-staging-webhook-egress
  labels:
    app.kubernetes.io/part-of: vikunja
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vikunja
      app.kubernetes.io/controller: vikunja
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: staging-app.unfoldhq.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
