---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-secret
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0" # generate once
  target:
    name: vikunja-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: "password", target: "VIKUNJA_SERVICE_SECRET"}
