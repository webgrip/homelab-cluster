---
# De Vloer: the dispatch console (human seat) of the dark factory. A
# single-file SPA on the Vikunja REST API, served same-origin under
# vikunja.<domain>/vloer so it reuses the stock UI's login session (same-origin
# localStorage JWT) — the Vellum pattern (../board). nginx additionally
# proxies read-only ploegd queue snapshots for the floor view.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja-vloer
  labels:
    app.kubernetes.io/name: vikunja-vloer
    app.kubernetes.io/part-of: vikunja
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja-vloer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja-vloer
    spec:
      nodeSelector:
        node.webgrip.io/pool: worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Same Harbor-proxied pin as the board (ADR-0025).
          image: harbor.webgrip.dev/dockerhub/nginxinc/nginx-unprivileged:1.31.3-alpine@sha256:a6c3ec0c0d249d68b0682df854d4a9e222b90fb607dc3fcf2f1d2fcbc85d347e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /var/www/vloer
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # unprivileged image keeps pid + temp files under /tmp
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 48Mi
      volumes:
        - name: html
          configMap:
            name: vikunja-vloer-html
        - name: nginx-conf
          configMap:
            name: vikunja-vloer-nginx
        - name: tmp
          emptyDir: {}
