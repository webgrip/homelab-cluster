---
# Additive rules scoped to the vloer pod, on top of the namespace-wide vikunja
# default-deny (which grants intra-ns + DNS). Unlike the board (zero egress),
# this pod proxies read-only ploegd queue snapshots for the floor view, so it
# gets exactly one egress: ploeg namespace port 8080 (ploeg's own ingress
# policy already admits the vikunja namespace on 8080 for the webhook path).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vikunja-vloer
  labels:
    app.kubernetes.io/part-of: vikunja
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vikunja-vloer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # gateway (network ns) + LAN (gateway traffic can masquerade to a node IP)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            cidr: 127.0.0.0/8
        - ipBlock:
            cidr: fd00::/8
        - ipBlock:
            cidr: ::1/128
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ploeg
      ports:
        - protocol: TCP
          port: 8080
