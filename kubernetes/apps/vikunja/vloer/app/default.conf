server {
    listen 8080;
    server_name _;
    server_tokens off;
    # TLS terminates at envoy: absolute redirects would leak this pod's
    # listen port/scheme (http://…:8080). Relative Location headers let the
    # browser keep https://…/443.
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /vloer {
        return 301 /vloer/;
    }

    # Read-only ploegd operator snapshots for the floor view. GET only —
    # ploegd's mutating surface (webhook, run API) stays unreachable from
    # the browser.
    location /vloer/ploeg/ {
        limit_except GET { deny all; }
        proxy_pass http://ploeg.ploeg.svc.cluster.local:8080/api/v1/;
        proxy_http_version 1.1;
    }

    # The SPA is a single file; any sub-path falls back to it.
    location /vloer/ {
        alias /var/www/vloer/;
        index index.html;
        try_files $uri /vloer/index.html;
    }

    # Only /vloer is routed here by the HTTPRoute, but be a good citizen anyway.
    location / {
        return 302 /vloer/;
    }
}
