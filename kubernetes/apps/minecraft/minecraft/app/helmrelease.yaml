---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft
  interval: 1h
  timeout: 20m
  install:
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
      strategy: uninstall
  values:
    controllers:
      minecraft:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 0
        strategy: Recreate
        pod:
          nodeSelector:
            node.webgrip.io/pool: worker
          tolerations:
            - key: dedicated
              operator: Equal
              value: fringe
              effect: NoSchedule
          terminationGracePeriodSeconds: 120
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          geyser-config-sync:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - sh
              - -c
              - |
                set -eu
                src_file=/config/geyser/config.yml
                dst_dir=/data/plugins/Geyser-Spigot
                dst_file="$dst_dir/config.yml"
                mkdir -p "$dst_dir"
                cp -f "$src_file" "$dst_file"
          bluemap-config-sync:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - sh
              - -c
              - |
                set -eu
                src_dir=/config/bluemap
                dst_dir=/data/plugins/BlueMap
                mkdir -p "$dst_dir"
                cp -f "$src_dir/core.conf" "$dst_dir/core.conf"
                cp -f "$src_dir/webserver.conf" "$dst_dir/webserver.conf"
        containers:
          app:
            image:
              # Through the Harbor pull-through proxy and digest-pinned. `java21` is a
              # rolling tag — it moves on every upstream rebuild, so the tag alone says
              # nothing about what actually runs. The digest is the multi-arch INDEX
              # digest (`docker buildx imagetools inspect`), not the per-platform one
              # `docker manifest inspect .manifests[0]` reports; pinning the latter would
              # silently arch-lock the image.
              repository: harbor.webgrip.dev/dockerhub/itzg/minecraft-server
              tag: java21@sha256:d2f7ea9dbd0a5a4ca5e7be38b0b5afa3cfe7c2e661b598898aa03b27d4155335
            envFrom:
              - configMapRef:
                  name: minecraft-config
            ports:
              - name: game
                containerPort: &gamePort 25565
                protocol: TCP
              - name: bedrock
                containerPort: &bedrockPort 19132
                protocol: UDP
              - name: map
                containerPort: &mapPort 8100
                protocol: TCP
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - mc-monitor
                      - status
                      - --host
                      - 127.0.0.1
                      - --port
                      - "25565"
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - mc-monitor
                      - status
                      - --host
                      - 127.0.0.1
                      - --port
                      - "25565"
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 12
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - mc-monitor
                      - status
                      - --host
                      - 127.0.0.1
                      - --port
                      - "25565"
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 8Gi

    service:
      app:
        type: LoadBalancer
        annotations:
          # Moved off .30 on 2026-08-02 to vacate the .30-.39 Talos worker
          # block (fringe takes .30). Reached by name via k8s-gateway, so
          # minecraft.${SECRET_DOMAIN} follows; a client that saved the raw
          # IP needs re-pointing once.
          lbipam.cilium.io/ips: "10.0.0.10"
          coredns.io/hostname: "minecraft.${SECRET_DOMAIN}"
        externalTrafficPolicy: Cluster
        ports:
          game:
            port: *gamePort
            targetPort: game
            protocol: TCP
          bedrock:
            port: *bedrockPort
            targetPort: bedrock
            protocol: UDP
          map:
            port: *mapPort
            targetPort: map
            protocol: TCP

    persistence:
      data:
        existingClaim: minecraft
        globalMounts:
          - path: /data
            readOnly: false
      geyser-config:
        type: configMap
        name: geyser-config
        globalMounts:
          - path: /config/geyser
            readOnly: true
      bluemap-config:
        type: configMap
        name: bluemap-config
        globalMounts:
          - path: /config/bluemap
            readOnly: true
