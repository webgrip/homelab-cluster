---
# forgejo-runner-scaler-token now sourced from OpenBao. Replaces forgejo-runner-scaler-token.sops.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-scaler-token
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Forgejo access token that KEDA uses to read pending Actions jobs, made by a person in Forgejo (Settings, Applications) with read access only."
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/homelab-cluster/src/branch/main/docs/techdocs/docs/runbooks/forgejo-runner.md"
    wellhead.dev/verify: "http"
    wellhead.dev/verify.http.url: "https://forgejo.webgrip.dev/api/v1/user"
    wellhead.dev/verify.http.auth: "bearer:token"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-runner-scaler-token, creationPolicy: Owner}
  data:
    - secretKey: token
      remoteRef: {key: forgejo/runner-scaler, property: token}
