---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
nameSuffix: -infra
images:
  - name: harbor.webgrip.dev/webgrip/ci-runner
    newName: harbor.webgrip.dev/webgrip/infra-runner
    newTag: "0.1.0"
    digest: sha256:d98987878aa40983b26ac4aa23dde1f105edd72dc4721d85fa18436b5db07140
patches:
  - target:
      kind: ScaledJob
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 0
      - op: replace
        path: /spec/maxReplicaCount
        value: 1
      - op: test
        path: /spec/triggers/0/metadata/labels
        value: docker
      - op: replace
        path: /spec/triggers/0/metadata/labels
        value: unfold-infra
      - op: replace
        path: /spec/triggers/0/metadata/name
        value: forgejo-runner-infra-k8s
      - op: test
        path: /spec/jobTargetRef/template/spec/volumes/0/name
        value: config
      - op: replace
        path: /spec/jobTargetRef/template/spec/volumes/0/configMap/name
        value: forgejo-runner-config-infra
      - op: test
        path: /spec/jobTargetRef/template/spec/volumes/1/name
        value: registration
      - op: replace
        path: /spec/jobTargetRef/template/spec/volumes/1
        value:
          name: registration
          projected:
            sources:
              - secret:
                  name: forgejo-runner-infra-secret
                  items:
                    - {key: uuid, path: uuid}
                    - {key: token, path: token}
              - secret:
                  name: forgejo-runner-secret
                  items:
                    - {key: cache-secret, path: cache-secret}
      - op: test
        path: /spec/jobTargetRef/template/spec/containers/0/name
        value: runner
      - op: add
        path: /spec/jobTargetRef/template/spec/containers/0/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
      - op: test
        path: /spec/jobTargetRef/template/spec/volumes/5/name
        value: ci-shared
      - op: replace
        path: /spec/jobTargetRef/template/spec/volumes/5
        value:
          name: ci-shared
          emptyDir: {}
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/metadata
        value:
          labels:
            app.kubernetes.io/name: forgejo-runner-provisioner
            app.kubernetes.io/instance: infra
      - op: test
        path: /spec/template/spec/containers/0/env/3/name
        value: SECRET_NAME
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: forgejo-runner-infra-secret
      - op: test
        path: /spec/template/spec/containers/0/env/4/name
        value: RUNNER_NAME
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: keda-unfold-cluster-infra
      - op: test
        path: /spec/template/spec/containers/0/env/7/name
        value: REGISTER_PATH
      - op: replace
        path: /spec/template/spec/containers/0/env/7/value
        value: repos/webgrip/unfold-cluster/actions/runners
