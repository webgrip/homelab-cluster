---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-github-pat
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A GitHub personal access token of the CI account, made by a person on GitHub (Settings, Developer settings, Personal access tokens) with the scopes the mirrors and releases need."
    wellhead.dev/plain: "username"
    wellhead.dev/verify.github-token.field: "token"
    wellhead.dev/verify: "github-token"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-github-pat, creationPolicy: Owner}
  data:
    - {secretKey: GHCR_USERNAME, remoteRef: {key: github/ci-pat, property: username}}
    - {secretKey: GHCR_TOKEN, remoteRef: {key: github/ci-pat, property: token}}
    - {secretKey: GH_RELEASE_TOKEN, remoteRef: {key: github/ci-pat, property: token}}
