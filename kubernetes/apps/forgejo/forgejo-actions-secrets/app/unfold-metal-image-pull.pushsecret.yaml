---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-metal-image-pull
  namespace: forgejo
spec:
  refreshInterval: 1h
  deletionPolicy: Delete
  secretStoreRefs:
    - {kind: SecretStore, name: openbao-push}
  selector: {secret: {name: unfold-metal-image-pull}}
  data:
    - match: {secretKey: username, remoteRef: {remoteKey: unfold-cluster/metal-image-pull, property: username}}
    - match: {secretKey: token, remoteRef: {remoteKey: unfold-cluster/metal-image-pull, property: token}}
