---
# Seed the provisioner-minted agent-reviewer token into OpenBao KV
# (secret/forgejo/agent-reviewer) so the ploeg namespace can hand it to
# reading Roles. It is read:repository + write:issue only (HAZ-05): a
# reviewer can clone and comment but never push. push.hcl already grants
# write on secret/data/* + secret/metadata/*.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: agent-reviewer-token
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: agent-reviewer-token}}
  data:
    - match: {secretKey: FORGEJO_TOKEN, remoteRef: {remoteKey: forgejo/agent-reviewer, property: FORGEJO_TOKEN}}
