---
# Replicate the Cloudflare deploy credential set from OpenBao into the forgejo
# namespace so the forgejo-actions-secrets provisioner can publish it as Forgejo
# org-level Actions secrets (consumed by twente.dev's and webgrip.nl's wrangler
# deploys). Source of truth is secret/cloudflare/deploy, seeded once at
# bootstrap (see webgrip.nl docs/runbooks/go-live.md) and thereafter rotated
# in-cluster by the cloudflare-token-roller CronJob via the
# cloudflare-deploy-rolled PushSecret:
#   CLOUDFLARE_API_TOKEN       account-owned API token — Workers Scripts:Edit,
#                              Account Settings:Read, Workers Routes:Edit on
#                              the twente.dev + webgrip.nl zones
#   CLOUDFLARE_ACCOUNT_ID      non-secret, but rides along so every consumer
#                              reads one path
#   CLOUDFLARE_DEPLOY_TOKEN_ID the token's own id — write-once; the roller
#                              needs it to roll the value (roll keeps the id)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-cloudflare-deploy
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "rolled"
    wellhead.dev/how: "Seeded once by just cloudflare-deploy-cred (a Cloudflare API token that may deploy Workers and Pages, its account id and token id); after that the token roller rotates it and the PushSecret cloudflare-deploy-rolled writes each new value here."
    wellhead.dev/plain: "CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_DEPLOY_TOKEN_ID"
    wellhead.dev/verify: "cloudflare-token"
    wellhead.dev/verify.cloudflare-token.field: "CLOUDFLARE_API_TOKEN"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-cloudflare-deploy, creationPolicy: Owner}
  data:
    - {secretKey: CLOUDFLARE_API_TOKEN, remoteRef: {key: cloudflare/deploy, property: CLOUDFLARE_API_TOKEN}}
    - {secretKey: CLOUDFLARE_ACCOUNT_ID, remoteRef: {key: cloudflare/deploy, property: CLOUDFLARE_ACCOUNT_ID}}
    - {secretKey: CLOUDFLARE_DEPLOY_TOKEN_ID, remoteRef: {key: cloudflare/deploy, property: CLOUDFLARE_DEPLOY_TOKEN_ID}}
