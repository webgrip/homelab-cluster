---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-cloudflare-deploy
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "rolled"
    wellhead.dev/how: "Seeded once by just cloudflare-deploy-cred (a Cloudflare API token that may deploy Workers and Pages, its account id and token id); after that the token roller rotates it and the PushSecret cloudflare-deploy-rolled writes each new value here."
    wellhead.dev/plain: "CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_DEPLOY_TOKEN_ID"
    wellhead.dev/verify: "cloudflare-token"
    wellhead.dev/verify.cloudflare-token.field: "CLOUDFLARE_API_TOKEN"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-cloudflare-deploy, creationPolicy: Owner}
  data:
    - {secretKey: CLOUDFLARE_API_TOKEN, remoteRef: {key: cloudflare/deploy, property: CLOUDFLARE_API_TOKEN}}
    - {secretKey: CLOUDFLARE_ACCOUNT_ID, remoteRef: {key: cloudflare/deploy, property: CLOUDFLARE_ACCOUNT_ID}}
    - {secretKey: CLOUDFLARE_DEPLOY_TOKEN_ID, remoteRef: {key: cloudflare/deploy, property: CLOUDFLARE_DEPLOY_TOKEN_ID}}
