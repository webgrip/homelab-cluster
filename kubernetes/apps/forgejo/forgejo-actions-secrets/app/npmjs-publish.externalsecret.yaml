---
# Replicate the npmjs.com publish token from OpenBao into the forgejo namespace
# so the forgejo-actions-secrets provisioner can publish it as the Forgejo
# org-level Actions secret NPMJS_TOKEN (consumed by webgrip/frontend-toolkit's
# release trains, which publish the @webgrip packages publicly to npmjs.com).
#
# Seed once: an npm Automation token (classic; bypasses 2FA for CI publish),
# minted by the npmjs org owner, at OpenBao secret/npmjs/publish with key
# NPMJS_TOKEN. npm has no roll API, so rotation is manual: mint a new token,
# overwrite the OpenBao value, revoke the old one — the hourly provisioner
# republishes and validates automatically.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-npmjs-publish
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: forgejo-npmjs-publish, creationPolicy: Owner}
  data:
    - {secretKey: NPMJS_TOKEN, remoteRef: {key: npmjs/publish, property: NPMJS_TOKEN}}
