---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-npmjs-publish
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "An npm Automation token minted by the npmjs organisation owner (npmjs.com, Access Tokens, Generate New Token, Automation)."
    wellhead.dev/verify.http.url: "https://registry.npmjs.org/-/whoami"
    wellhead.dev/verify.http.auth: "bearer:NPMJS_TOKEN"
    wellhead.dev/verify: "http"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-npmjs-publish, creationPolicy: Owner}
  data:
    - {secretKey: NPMJS_TOKEN, remoteRef: {key: npmjs/publish, property: NPMJS_TOKEN}}
