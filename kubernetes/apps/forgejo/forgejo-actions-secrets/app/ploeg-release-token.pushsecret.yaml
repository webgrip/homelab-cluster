---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ploeg-release-token
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: SecretStore, name: openbao-push}
  selector: {secret: {name: ploeg-release-token}}
  data:
    - match: {secretKey: token, remoteRef: {remoteKey: forgejo/ploeg-release, property: token}}
