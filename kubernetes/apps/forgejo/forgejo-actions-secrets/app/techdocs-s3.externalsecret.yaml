---
# Replicate the TechDocs S3 PUBLISH key (read+write) from OpenBao into the forgejo
# namespace so the forgejo-actions-secrets provisioner can publish it as Forgejo
# org-level Actions secrets for the techdocs-deploy-backstage-s3 workflow
# (ADR-0039). Source of truth is secret/garage/techdocs, minted in-cluster by the
# garage-techdocs-bootstrap Job and mirrored to OpenBao — nothing here is ever
# human-typed. The read-only half goes to Backstage, not through here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-techdocs-s3
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: forgejo-techdocs-s3, creationPolicy: Owner}
  data:
    - {secretKey: TECHDOCS_S3_ACCESS_KEY_ID, remoteRef: {key: garage/techdocs, property: publish_access_key_id}}
    - {secretKey: TECHDOCS_S3_SECRET_ACCESS_KEY, remoteRef: {key: garage/techdocs, property: publish_secret_access_key}}
