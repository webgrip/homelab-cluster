---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-agent-standards-model-key
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "projected"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-agent-standards-model-key, creationPolicy: Owner}
  data:
    - {secretKey: key, remoteRef: {key: litellm/keys/agent-standards-survey, property: key}}
