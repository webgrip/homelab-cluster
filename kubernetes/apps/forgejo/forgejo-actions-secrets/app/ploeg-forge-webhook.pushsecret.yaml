---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ploeg-forge-webhook
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: ploeg-forge-webhook}}
  data:
    - match: {secretKey: PLOEG_FORGEJO_SECRET, remoteRef: {remoteKey: forgejo/ploeg-forge-webhook, property: PLOEG_FORGEJO_SECRET}}
