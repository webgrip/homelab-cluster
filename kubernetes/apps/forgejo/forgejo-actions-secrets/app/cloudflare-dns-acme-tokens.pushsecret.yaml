---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cloudflare-dns-acme-tokens
  namespace: forgejo
spec:
  refreshInterval: 10m
  secretStoreRefs:
    - {kind: SecretStore, name: openbao-push}
  selector: {secret: {name: cloudflare-dns-tokens}}
  data:
    - match: {secretKey: unfoldhq-dev-acme, remoteRef: {remoteKey: unfold-main/cert-manager/cloudflare-dns01, property: api-token}}
