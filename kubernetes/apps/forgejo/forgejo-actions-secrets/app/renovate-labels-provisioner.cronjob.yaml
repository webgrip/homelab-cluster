---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate-labels-provisioner
  namespace: forgejo
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-labels-provisioner
  namespace: forgejo
spec:
  schedule: "17 * * * *"
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate-labels-provisioner
        spec:
          serviceAccountName: renovate-labels-provisioner
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: provision
              image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              imagePullPolicy: IfNotPresent
              command:
                - "/bin/sh"
                - "/scripts/renovate-labels-provisioner.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: CURL_TIMEOUT, value: "30"}
                - {name: FORGEJO_URL, value: 'http://forgejo-http.forgejo.svc.cluster.local:3000'}
                - {name: ORG, value: webgrip}
                - {name: LABELS_FILE, value: /scripts/renovate-labels.json}
                - name: ADMIN_USERNAME
                  valueFrom: {secretKeyRef: {name: forgejo-admin-secret, key: username}}
                - name: ADMIN_PASSWORD
                  valueFrom: {secretKeyRef: {name: forgejo-admin-secret, key: password}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: script, mountPath: /scripts, readOnly: true}
          volumes:
            - name: tmp
              emptyDir: {}
            - name: script
              configMap:
                name: renovate-labels-provisioner-script
