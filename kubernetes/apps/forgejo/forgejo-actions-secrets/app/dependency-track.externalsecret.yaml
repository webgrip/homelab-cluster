---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-dependency-track
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "projected"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-dependency-track, creationPolicy: Owner}
  data:
    - {secretKey: DT_API_KEY, remoteRef: {key: dependency-track/api-key, property: api-key}}
