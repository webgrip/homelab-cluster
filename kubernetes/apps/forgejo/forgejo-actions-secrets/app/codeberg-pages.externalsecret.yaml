---
# Codeberg Pages publish token, surfaced from OpenBao so the forgejo-actions-secrets CronJob can
# publish it as the `webgrip` org Actions secret CODEBERG_TOKEN. Consumed by the .forgejo reusable
# techdocs-deploy-codeberg (ADR-0038) to force-push the built TechDocs site to Codeberg's pages
# branch. Seed once: a Codeberg PAT (scope write:repository) at OpenBao secret/codeberg/pages key `token`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-codeberg
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Codeberg access token for publishing Pages, made by a person on codeberg.org (Settings, Applications) with write access to the pages repository."
    wellhead.dev/verify.http.url: "https://codeberg.org/api/v1/user"
    wellhead.dev/verify.http.auth: "bearer:token"
    wellhead.dev/verify: "http"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-codeberg, creationPolicy: Owner}
  data:
    - {secretKey: CODEBERG_TOKEN, remoteRef: {key: codeberg/pages, property: token}}
