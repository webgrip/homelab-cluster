---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dns-reconciler-tokens
  namespace: forgejo
spec:
  refreshInterval: 10m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: dns-reconciler-tokens, creationPolicy: Owner}
  data:
    - {secretKey: unfoldhq-dev-rw, remoteRef: {key: cloudflare/dns/unfoldhq-dev-rw, property: token}}
    - {secretKey: twente-dev-rw, remoteRef: {key: cloudflare/dns/twente-dev-rw, property: token}}
    - {secretKey: webgrip-nl-rw, remoteRef: {key: cloudflare/dns/webgrip-nl-rw, property: token}}
    - {secretKey: account-id, remoteRef: {key: cloudflare/dns/unfoldhq-dev-rw, property: account_id}}
