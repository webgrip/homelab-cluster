---
# Stable, in-cluster-generated password for the Forgejo `unfold-reports` bot, which files
# Unfold's Report a problem issues. Nobody types or knows it; it exists so the provisioner can
# basic-auth as the bot and mint its token. generate-once + Retain, like agent-reviewer-password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-reports-password
  namespace: forgejo
spec:
  refreshInterval: "0" # generate once
  target:
    name: unfold-reports-password
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: "password", target: "password"}
