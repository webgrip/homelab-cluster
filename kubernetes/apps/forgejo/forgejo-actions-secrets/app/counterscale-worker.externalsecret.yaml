---
# The store-backed half of the counterscale Worker runtime secrets. Lives in this
# app (and this namespace) for two reasons:
#   1. The transport credential the reconciler needs — CLOUDFLARE_API_TOKEN with
#      Workers Scripts:Edit — already exists as k8s Secret forgejo-cloudflare-deploy
#      in namespace forgejo, and a CronJob can only read a Secret from its OWN
#      namespace. Housing this elsewhere would mean duplicating that credential
#      into a second namespace, which is strictly worse than co-locating.
#   2. There is precedent: cloudflare-token-roller.cronjob.yaml already lives here
#      and talks only to Cloudflare, never to Forgejo.
#
#   CF_ACCOUNT_ID     reused from secret/cloudflare/deploy — the account id has ONE
#                     record in OpenBao; a counterscale-local copy would be a second
#                     one to drift.
#   CF_BEARER_TOKEN   a SECOND Cloudflare token, distinct from the deploy token:
#                     Account Analytics:Read, so the Worker can query the Analytics
#                     Engine SQL API for its own dashboard. Human-seeded.
#   CF_PASSWORD_HASH  bcrypt hash of the dashboard password. Human-seeded.
# CF_JWT_SECRET is pure entropy and is NOT here — see counterscale-jwt.externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: counterscale-worker
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: counterscale-worker, creationPolicy: Owner}
  data:
    - {secretKey: CF_ACCOUNT_ID, remoteRef: {key: cloudflare/deploy, property: CLOUDFLARE_ACCOUNT_ID}}
    - {secretKey: CF_BEARER_TOKEN, remoteRef: {key: counterscale/worker, property: CF_BEARER_TOKEN}}
    - {secretKey: CF_PASSWORD_HASH, remoteRef: {key: counterscale/worker, property: CF_PASSWORD_HASH}}
