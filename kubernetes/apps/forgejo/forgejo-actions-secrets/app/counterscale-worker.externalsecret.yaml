---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: counterscale-worker
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "CF_BEARER_TOKEN and CF_PASSWORD_HASH for the Counterscale Worker, written by a person with bao kv put secret/counterscale/worker (the forgejo-actions-secrets CronJob logs the exact command while they are missing); CLOUDFLARE_ACCOUNT_ID comes from secret/cloudflare/deploy."
    wellhead.dev/verify.format.CF_BEARER_TOKEN: "\\S{20,}"
    wellhead.dev/verify.format.CF_PASSWORD_HASH: "\\S{20,}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: counterscale-worker, creationPolicy: Owner}
  data:
    - {secretKey: CF_ACCOUNT_ID, remoteRef: {key: cloudflare/deploy, property: CLOUDFLARE_ACCOUNT_ID}}
    - {secretKey: CF_BEARER_TOKEN, remoteRef: {key: counterscale/worker, property: CF_BEARER_TOKEN}}
    - {secretKey: CF_PASSWORD_HASH, remoteRef: {key: counterscale/worker, property: CF_PASSWORD_HASH}}
