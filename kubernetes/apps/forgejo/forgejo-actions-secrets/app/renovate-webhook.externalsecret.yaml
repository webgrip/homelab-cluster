---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-renovate-webhook
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "projected"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: forgejo-renovate-webhook
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RENOVATE_WEBHOOK_TOKEN: '{{ .token | splitList "," | first }}'
  data:
    - {secretKey: token, remoteRef: {key: renovate/webhook-auth, property: token}}
