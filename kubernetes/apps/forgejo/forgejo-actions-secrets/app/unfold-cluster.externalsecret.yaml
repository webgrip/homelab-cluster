---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-unfold-cluster-vars
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "Repository variables of webgrip/unfold-cluster, not secrets: the state bucket, admin CIDRs, the owner's SSH key, the etcd backup age recipient and check, and the staging edge switches. unfold-cluster's README lists each value."
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/unfold-cluster/src/branch/main/README.md"
    wellhead.dev/fields: "STATE_BUCKET STATE_ENDPOINT STATE_REGION ADMIN_CIDRS ADMIN_SSH_PUBLIC_KEY ETCD_BACKUP_AGE_RECIPIENT ETCD_BACKUP_CHECK"
    wellhead.dev/plain: "STATE_BUCKET STATE_ENDPOINT STATE_REGION ADMIN_CIDRS ADMIN_SSH_PUBLIC_KEY ETCD_BACKUP_AGE_RECIPIENT ETCD_BACKUP_CHECK"
    wellhead.dev/verify: "none"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-unfold-cluster-vars, creationPolicy: Owner}
  dataFrom:
    - extract: {key: unfold-cluster/vars}
