---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-unfold-cluster-vars
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: forgejo-unfold-cluster-vars, creationPolicy: Owner}
  dataFrom:
    - extract: {key: unfold-cluster/vars}
