---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-unfold-cluster-hetzner-tofu
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: forgejo-unfold-cluster-hetzner-tofu, creationPolicy: Owner}
  dataFrom:
    - extract: {key: hetzner/unfold-tofu}
