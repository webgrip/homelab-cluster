---
apiVersion: batch/v1
kind: Job
metadata:
  name: glide-distribution-bootstrap
  namespace: forgejo
  labels:
    cleanup.webgrip.io/retry-failed: 'true'
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: forgejo-actions-secrets
      automountServiceAccountToken: false
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
          env:
            - name: FORGEJO_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-secret
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-secret
                  key: password
            - name: GHCR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-github-pat
                  key: GHCR_USERNAME
            - name: GHCR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-github-pat
                  key: GHCR_TOKEN
            - name: OVSX_PAT
              valueFrom:
                secretKeyRef:
                  name: forgejo-openvsx-publish
                  key: OVSX_PAT
          command:
            - /bin/sh
            - -ceu
            - |
              gh() {
                curl -fsS --max-time 45 -H "Authorization: Bearer $GHCR_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "$@"
              }
              fj() {
                curl -fsS --max-time 45 -u "$ADMIN_USERNAME:$ADMIN_PASSWORD" -H 'Content-Type: application/json' "$@"
              }
              repo=https://api.github.com/repos/webgrip/unfold
              status="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GHCR_TOKEN" "$repo")"
              case "$status" in
                404) gh -X POST --data '{"name":"unfold","private":false,"auto_init":false,"description":"Vloer and Ploeg. Forgejo is the source of truth.","homepage":"https://docs.webgrip.dev/glide/"}' https://api.github.com/orgs/webgrip/repos >/dev/null; echo 'created GitHub webgrip/unfold' ;;
                200) echo 'GitHub webgrip/unfold already exists' ;;
                *) echo "GitHub repository lookup returned HTTP $status"; exit 1 ;;
              esac
              gh -X PUT --data '{"enabled":false}' "$repo/actions/permissions" >/dev/null
              api="$FORGEJO_URL/api/v1/repos/webgrip/unfold"
              mirrors="$(fj "$api/push_mirrors")"
              mirror="$(printf '%s' "$mirrors" | jq -c '[.[] | select((.remote_address == "ssh://github.com/webgrip/unfold.git" or .remote_address == "ssh://github.com/webgrip/glide.git") and ((.public_key // "") | length > 0))][0] // empty')"
              if [ -z "$mirror" ]; then
                mirror="$(fj -X POST --data '{"remote_address":"ssh://git@github.com/webgrip/unfold.git","use_ssh":true,"interval":"8h0m0s","sync_on_commit":true}' "$api/push_mirrors")"
              fi
              public_key="$(printf '%s' "$mirror" | jq -er '.public_key | select(length > 0)')"
              keys="$(gh "$repo/keys")"
              if ! printf '%s' "$keys" | jq -e --arg key "$public_key" 'any(.[]; (.key | split(" ")[0:2]) == ($key | split(" ")[0:2]) and .read_only == false)' >/dev/null; then
                jq -nc --arg key "$public_key" '{title:"Forgejo Unfold push mirror",key:$key,read_only:false}' | gh -X POST --data-binary @- "$repo/keys" >/dev/null
              fi
              keep="$(printf '%s' "$mirror" | jq -r '.remote_name // empty')"
              obsolete="$(printf '%s' "$mirrors" | jq -r --arg keep "$keep" '.[] | select(.remote_name != $keep) | select(.remote_address == "https://github.com/webgrip/glide.git" or .remote_address == "ssh://github.com/webgrip/glide.git" or .remote_address == "ssh://github.com/webgrip/unfold.git") | .remote_name')"
              for name in $obsolete; do
                fj -X DELETE "$api/push_mirrors/$name" >/dev/null
              done
              echo 'configured repository-scoped SSH mirror'
              fj -X POST "$api/push_mirrors-sync" >/dev/null
              jq -nc --arg value "$OVSX_PAT" '{data:$value}' | fj -X PUT --data-binary @- "$api/actions/secrets/OVSX_PAT" >/dev/null
              echo 'bridged Unfold Open VSX credential'
              i=0
              until gh -X PATCH --data '{"default_branch":"development"}' "$repo" >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -lt 30 ] || { echo 'GitHub mirror has not received development'; exit 1; }
                sleep 5
              done
              echo 'Unfold GitHub mirror provisioned; Actions disabled; trunk development'
              for entry in de-vloer:52afa4a583fbf47d52081c9a2a95c4cb4c372100 ploeg:6f19c25fcc48f2335ad39237d06642adef1a5fcc; do
                old_repo="$(printf '%s' "$entry" | cut -d: -f1)"
                expected="$(printf '%s' "$entry" | cut -d: -f2)"
                old_api="$FORGEJO_URL/api/v1/repos/webgrip/$old_repo"
                current="$(fj "$old_api/branches/development" | jq -r '.commit.id')"
                [ "$current" = "$expected" ] || { echo "$old_repo changed since cutover qualification; stop and reconcile source"; exit 1; }
                if fj "$old_api" | jq -e '.has_actions == true' >/dev/null; then
                  fj "$old_api/actions/runs" | jq -e '[.workflow_runs[] | select(.status == "running" or .status == "waiting" or .status == "blocked")] | length == 0' >/dev/null
                  fj -X PATCH --data '{"has_actions":false}' "$old_api" >/dev/null
                fi
                gh_status="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GHCR_TOKEN" "https://api.github.com/repos/webgrip/$old_repo")"
                case "$gh_status" in
                  200) gh -X PUT --data '{"enabled":false}' "https://api.github.com/repos/webgrip/$old_repo/actions/permissions" >/dev/null ;;
                  404) echo "$old_repo has no accessible legacy GitHub repository" ;;
                  *) echo "GitHub legacy lookup returned HTTP $gh_status"; exit 1 ;;
                esac
                echo "$old_repo legacy Actions retired; source and existing releases retained"
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
