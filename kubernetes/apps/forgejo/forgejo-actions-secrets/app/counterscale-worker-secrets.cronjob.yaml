---
# Publishes the four counterscale Worker RUNTIME secrets to Cloudflare, so they stop
# being a `wrangler secret put` from somebody's laptop and become GitOps state:
#
#   OpenBao secret/counterscale/worker + secret/cloudflare/deploy
#     -> counterscale-worker ExternalSecret        (hourly)
#   ClusterGenerator/password-generator-32
#     -> counterscale-jwt ExternalSecret           (generate-once, Retain)
#     -> this CronJob PUTs all four onto the Worker (hourly)
#
# It lives in the forgejo namespace beside cloudflare-token-roller because the
# transport credential it needs (CLOUDFLARE_API_TOKEN, Workers Scripts:Edit) is
# already here as Secret forgejo-cloudflare-deploy, and a CronJob can only read a
# Secret from its own namespace — the alternative is duplicating that token into a
# second namespace. Like the roller, it never touches Forgejo; it is Cloudflare-facing
# machinery that happens to share a namespace with its credential.
#
# Two Cloudflare tokens are in play and they are not interchangeable:
# CLOUDFLARE_API_TOKEN writes Worker secrets (Workers Scripts:Edit); CF_BEARER_TOKEN
# is what the Worker itself later uses to read the Analytics Engine (Account
# Analytics:Read). The second one is validated against the SQL API BEFORE anything is
# written — a dead analytics token must fail this job, not a dashboard weeks later.
#
# Fail-soft on inputs, fail-loud on Cloudflare: a value not yet seeded exits 0 and
# waits for the next tick (never a crashloop), an API rejection exits 1 (alertable).
# It needs no k8s API at all, so no token is mounted. Values are never logged — only
# names and outcomes. Flux does not substitute this path (the parent ks has no
# postBuild.substituteFrom), so ${VAR} in the script below is shell, not Flux.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: counterscale-worker-secrets
  namespace: forgejo
spec:
  schedule: "47 * * * *" # hourly, offset from forgejo-actions-secrets (:23)
  # Bound the miss-count window: without it, >100 missed starts halt scheduling forever.
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 21600 # GC finished jobs after 6h
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false # only talks to the Cloudflare HTTP API, never the k8s API
          # Keep this hourly Job off the soyo control-planes (ADR-0002)
          # (AppsTierWorkloadSpilledToControlPlane).
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: publish
              # alpine/k8s ships curl + jq + a shell (same image as the roller).
              image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
                - name: WORKER_NAME
                  value: counterscale
                # Transport: the token that is allowed to write Worker secrets.
                - name: CLOUDFLARE_API_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-cloudflare-deploy, key: CLOUDFLARE_API_TOKEN, optional: true}
                - name: CLOUDFLARE_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef: {name: forgejo-cloudflare-deploy, key: CLOUDFLARE_ACCOUNT_ID, optional: true}
                # Payload: what the Worker itself runs on.
                - name: CF_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef: {name: counterscale-worker, key: CF_ACCOUNT_ID, optional: true}
                - name: CF_BEARER_TOKEN
                  valueFrom:
                    secretKeyRef: {name: counterscale-worker, key: CF_BEARER_TOKEN, optional: true}
                - name: CF_PASSWORD_HASH
                  valueFrom:
                    secretKeyRef: {name: counterscale-worker, key: CF_PASSWORD_HASH, optional: true}
                - name: CF_JWT_SECRET
                  valueFrom:
                    secretKeyRef: {name: counterscale-jwt, key: CF_JWT_SECRET, optional: true}
              command:
                - /bin/sh
                - -ceu
                - |
                  api="https://api.cloudflare.com/client/v4"
                  log="[counterscale-worker-secrets]"

                  # Fail-soft until OpenBao and the generator have seeded everything.
                  missing=""
                  [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="${missing} CLOUDFLARE_API_TOKEN"
                  [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="${missing} CLOUDFLARE_ACCOUNT_ID"
                  [ -n "${CF_ACCOUNT_ID:-}" ] || missing="${missing} CF_ACCOUNT_ID"
                  [ -n "${CF_BEARER_TOKEN:-}" ] || missing="${missing} CF_BEARER_TOKEN"
                  [ -n "${CF_PASSWORD_HASH:-}" ] || missing="${missing} CF_PASSWORD_HASH"
                  [ -n "${CF_JWT_SECRET:-}" ] || missing="${missing} CF_JWT_SECRET"
                  if [ -n "${missing}" ]; then
                    echo "${log} not seeded yet:${missing} — exiting 0, will retry next hour (seed with: bao kv put secret/counterscale/worker CF_BEARER_TOKEN=… CF_PASSWORD_HASH=…)"
                    exit 0
                  fi

                  # Prove CF_BEARER_TOKEN can actually read the Analytics Engine before
                  # publishing anything. A token that cannot answer SELECT 1 is a dead
                  # dashboard, and this job is where that must surface.
                  probe="$(curl -sS -X POST -o /dev/null -w '%{http_code}' \
                    -H "Authorization: Bearer ${CF_BEARER_TOKEN}" \
                    --data-binary 'SELECT 1' \
                    "${api}/accounts/${CF_ACCOUNT_ID}/analytics_engine/sql")" || probe="000"
                  if [ "${probe}" != "200" ]; then
                    echo "${log} ERROR: CF_BEARER_TOKEN cannot query the Analytics Engine SQL API for account CF_ACCOUNT_ID (HTTP ${probe}) — it needs Account Analytics:Read; nothing was written"
                    exit 1
                  fi
                  echo "${log} CF_BEARER_TOKEN validated against the Analytics Engine SQL API"

                  # jq builds the body, so a bcrypt hash's $ and / never reach the shell
                  # or a log line. Only the NAME is ever printed.
                  put_worker_secret() {
                    _name="$1"
                    _resp="$(jq -n --arg name "${_name}" --arg text "$2" \
                      '{name: $name, text: $text, type: "secret_text"}' \
                      | curl -sS -X PUT \
                          -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                          -H 'Content-Type: application/json' \
                          --data-binary @- \
                          "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets")" || return 1
                    if [ "$(echo "${_resp}" | jq -r '.success // false')" = "true" ]; then
                      return 0
                    fi
                    echo "${log} ${_name}: Cloudflare rejected the write (error codes: $(echo "${_resp}" | jq -r '[.errors[]?.code] | join(",") | if . == "" then "none" else . end'))"
                    return 1
                  }

                  # One failure must not hide the state of the other three, so the
                  # return code accumulates instead of short-circuiting.
                  rc=0
                  publish() {
                    if put_worker_secret "$1" "$2"; then
                      echo "${log} published $1"
                    else
                      echo "${log} ERROR: failed to publish $1"
                      rc=1
                    fi
                  }
                  publish CF_ACCOUNT_ID "${CF_ACCOUNT_ID}"
                  publish CF_BEARER_TOKEN "${CF_BEARER_TOKEN}"
                  publish CF_PASSWORD_HASH "${CF_PASSWORD_HASH}"
                  publish CF_JWT_SECRET "${CF_JWT_SECRET}"

                  if [ "${rc}" -eq 0 ]; then
                    echo "${log} all four runtime secrets are current on Worker ${WORKER_NAME}"
                  else
                    echo "${log} ERROR: at least one secret did not reach Worker ${WORKER_NAME}"
                  fi
                  exit "${rc}"
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {}
