---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-harbor-robot-talos
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-harbor-robot-talos, creationPolicy: Owner}
  data:
    - {secretKey: CI_USER, remoteRef: {key: harbor/robot-talos, property: CI_USER}}
    - {secretKey: CI_TOKEN, remoteRef: {key: harbor/robot-talos, property: CI_TOKEN}}
