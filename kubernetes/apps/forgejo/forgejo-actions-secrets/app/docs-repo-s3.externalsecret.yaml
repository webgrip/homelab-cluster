---
# Replicate the per-repo docs publish keys (estate item #2) from OpenBao into the
# forgejo namespace so the forgejo-actions-secrets provisioner can publish each
# pair as REPO-level TECHDOCS_S3_* Actions secrets (repo-level shadows the
# org-level pair, so the reusable workflows need no wiring change — a repo's
# publish simply stops being able to touch any bucket but its own).
# Source of truth: secret/garage/docs-repo-keys, minted in-cluster by the
# garage-techdocs-bootstrap Job. dataFrom.extract keeps this manifest fixed while
# REPOS grows in the bootstrap Job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-docs-repo-keys
  namespace: forgejo
spec:
  refreshInterval: 5m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: forgejo-docs-repo-keys, creationPolicy: Owner}
  dataFrom:
    - extract:
        key: garage/docs-repo-keys
