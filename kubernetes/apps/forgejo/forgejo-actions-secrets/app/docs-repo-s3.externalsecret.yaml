---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-docs-repo-keys
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 5m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-docs-repo-keys, creationPolicy: Owner}
  dataFrom:
    - extract:
        key: garage/docs-repo-keys
