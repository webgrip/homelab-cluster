---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: repo-config-inventory-token
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: SecretStore, name: openbao-push}
  selector: {secret: {name: repo-config-inventory-token}}
  data:
    - match: {secretKey: FORGEJO_TOKEN, remoteRef: {remoteKey: forgejo/repo-config-inventory, property: FORGEJO_TOKEN}}
