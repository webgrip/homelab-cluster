---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cloudflare-edge-tokens
  namespace: forgejo
spec:
  refreshInterval: 10m
  secretStoreRefs:
    - {kind: SecretStore, name: openbao-push}
  selector: {secret: {name: cloudflare-dns-tokens}}
  data:
    - match: {secretKey: unfoldhq-dev-edge, remoteRef: {remoteKey: cloudflare/unfold-tunnel, property: api-token}}
    - match: {secretKey: account-id, remoteRef: {remoteKey: cloudflare/unfold-tunnel, property: account-id}}
    - match: {secretKey: unfoldhq-dev-zone-id, remoteRef: {remoteKey: cloudflare/unfold-tunnel, property: zone-id}}
