---
# Write the freshly rolled Cloudflare deploy-token value back into OpenBao
# (secret/cloudflare/deploy, property CLOUDFLARE_API_TOKEN) — the same
# property-level push the agent-builder token uses; push.hcl already grants
# write on secret/data/*. The k8s Secret cloudflare-deploy-rolled is owned by
# the cloudflare-token-roller CronJob. From OpenBao the new value fans out on
# the hourly ticks: forgejo-cloudflare-deploy ExternalSecret (≤1h) → the
# forgejo-actions-secrets publisher (≤1h) → Forgejo org secret. Worst-case
# ~2h/month with the old (already invalidated) value in Forgejo — a deploy in
# that window fails loudly on auth and succeeds on re-run; accepted, the
# roller runs at 04:41 on the 1st when nobody deploys.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cloudflare-deploy-rolled
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: cloudflare-deploy-rolled}}
  data:
    - match: {secretKey: CLOUDFLARE_API_TOKEN, remoteRef: {remoteKey: cloudflare/deploy, property: CLOUDFLARE_API_TOKEN}}
