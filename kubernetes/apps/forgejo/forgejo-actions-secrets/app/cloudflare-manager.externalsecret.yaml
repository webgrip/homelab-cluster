---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-cloudflare-manager
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Cloudflare API token that may create and roll other API tokens (API Tokens Write), made by a person in the Cloudflare dashboard (My Profile, API Tokens) and written with just cloudflare-deploy-cred."
    wellhead.dev/verify.cloudflare-token.field: "CLOUDFLARE_MANAGER_TOKEN"
    wellhead.dev/verify: "cloudflare-token"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-cloudflare-manager, creationPolicy: Owner}
  data:
    - {secretKey: CLOUDFLARE_MANAGER_TOKEN, remoteRef: {key: cloudflare/token-manager, property: CLOUDFLARE_MANAGER_TOKEN}}
