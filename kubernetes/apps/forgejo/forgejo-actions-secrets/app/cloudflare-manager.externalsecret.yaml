---
# The Cloudflare token-manager credential for the cloudflare-token-roller
# CronJob: an account-owned API token whose ONLY permission is managing other
# account tokens (Account → Account API Tokens → Edit). It can roll the deploy
# token's value without being able to deploy anything itself.
#
# This token is the rotation anchor and is deliberately NOT auto-rolled:
# rolling it with itself invalidates the old value mid-flight, and a failed
# write-back after that roll would strand rotation entirely (the deploy token
# would then age out of rotation with nobody able to roll it). Verify-only
# here; rotate it by hand (dashboard roll + `bao kv put`) on its own cadence.
# Source of truth: secret/cloudflare/token-manager (bootstrap-seeded).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-cloudflare-manager
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Cloudflare API token that may create and roll other API tokens (API Tokens Write), made by a person in the Cloudflare dashboard (My Profile, API Tokens) and written with just cloudflare-deploy-cred."
    wellhead.dev/verify.cloudflare-token.field: "CLOUDFLARE_MANAGER_TOKEN"
    wellhead.dev/verify: "cloudflare-token"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-cloudflare-manager, creationPolicy: Owner}
  data:
    - {secretKey: CLOUDFLARE_MANAGER_TOKEN, remoteRef: {key: cloudflare/token-manager, property: CLOUDFLARE_MANAGER_TOKEN}}
