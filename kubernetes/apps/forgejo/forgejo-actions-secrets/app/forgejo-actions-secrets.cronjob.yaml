---
# Publishes webgrip's CI credentials + config as Forgejo ORG-LEVEL Actions secrets/variables for
# the `webgrip` org, so workflows on the in-cluster Forgejo runner can publish + release:
#   secret  HARBOR_ROBOT_USER / HARBOR_ROBOT_TOKEN     push to the private `webgrip` project
#   secret  DT_API_KEY                                 Dependency-Track SBOM upload
#   secret  WEBGRIP_CI_TOKEN                           CI bot token (minted by forgejo-ci-provisioner)
#   secret  CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID   wrangler deploys (twente.dev, webgrip.nl),
#   secret  NPMJS_TOKEN                                   npmjs.com publishes (frontend-toolkit),
#                                                     from OpenBao cloudflare/deploy
#   var     WEBGRIP_CI_BOT_NAME                        bot slug (APP_BOT_SLUG) for the .forgejo reusables
# NB: names are WEBGRIP_-prefixed, NOT FORGEJO_/GITHUB_/GITEA_ — Forgejo Actions reserves those
# prefixes for built-ins and rejects them (secret PUT 400, var POST/PUT 400/404).
# Harbor is LAN-only, so only the in-cluster runner can reach it — hence these live in Forgejo, not
# GitHub. Harbor creds are required; the rest are best-effort. Cosign signing does NOT go through
# here — the runner signs via OpenBao Transit (OIDC), so the signing key is never a Forgejo secret.
#
# There is no ESO push-provider for Forgejo Actions secrets, so this mirrors the
# established "in-cluster Job hits the Forgejo admin API" pattern
# (renovate-forgejo-provisioner). A CronJob (not a one-shot Job) keeps it zero-touch
# and self-healing: it re-converges hourly after a Forgejo DB restore or a robot
# token rotation, with no human in the loop. Idempotent + fail-soft — a missing
# credential or a restarting Forgejo never crashloops or alerts.
#
# Forgejo secret values are write-only over the API (can't be read back), so the
# PUT runs every tick; that is harmless (create-or-update). The token is never
# logged — only secret NAMES are. The robot username's literal `$` (robot$webgrip+ci)
# is carried in the Secret value and JSON-encoded via jq, so no shell re-expansion.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-actions-secrets
  namespace: forgejo
spec:
  schedule: "23 * * * *" # hourly, off the top of the hour
  # Bound the miss-count window: without it, >100 missed starts (e.g. behind a wedged Forbid job) halt scheduling forever.
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 21600 # GC finished jobs after 6h
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: forgejo-actions-secrets
          automountServiceAccountToken: false # only talks to the Forgejo HTTP API, never the k8s API
          # Keep this hourly Job off the soyo control-planes (ADR-0002)
          # (AppsTierWorkloadSpilledToControlPlane).
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: provision
              # alpine/k8s ships curl + jq + a shell (same image family as the other API provisioners).
              image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
                - name: FORGEJO_URL
                  value: http://forgejo-http.forgejo.svc.cluster.local:3000
                - name: ORG
                  value: webgrip
                # Site-admin credentials — the only identity allowed to manage org Actions secrets.
                - name: ADMIN_USERNAME
                  valueFrom:
                    secretKeyRef: {name: forgejo-admin-secret, key: username, optional: true}
                - name: ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: forgejo-admin-secret, key: password, optional: true}
                # Harbor robot credential, replicated from OpenBao into this namespace.
                - name: HARBOR_ROBOT_USER
                  valueFrom:
                    secretKeyRef: {name: forgejo-harbor-robot, key: CI_USER, optional: true}
                - name: HARBOR_ROBOT_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-harbor-robot, key: CI_TOKEN, optional: true}
                # Dependency-Track API key (SBOM upload sink), from OpenBao dependency-track/api-key.
                - name: DT_API_KEY
                  valueFrom:
                    secretKeyRef: {name: forgejo-dependency-track, key: DT_API_KEY, optional: true}
                # CI bot token, minted in-cluster by the forgejo-ci-provisioner Job.
                - name: FORGEJO_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-ci-token, key: FORGEJO_TOKEN, optional: true}
                # Codeberg Pages publish token (techdocs-deploy-codeberg), from OpenBao codeberg/pages.
                - name: CODEBERG_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-codeberg, key: CODEBERG_TOKEN, optional: true}
                # GitHub PAT for Forgejo's GHCR fan-out (push + cosign sign) and the GitHub Release mirror.
                - name: GHCR_USERNAME
                  valueFrom:
                    secretKeyRef: {name: forgejo-github-pat, key: GHCR_USERNAME, optional: true}
                - name: GHCR_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-github-pat, key: GHCR_TOKEN, optional: true}
                - name: GH_RELEASE_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-github-pat, key: GH_RELEASE_TOKEN, optional: true}
                # TechDocs S3 publish key (techdocs-deploy-backstage-s3, ADR-0039),
                # from OpenBao garage/techdocs via the forgejo-techdocs-s3 ExternalSecret.
                - name: TECHDOCS_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: forgejo-techdocs-s3, key: TECHDOCS_S3_ACCESS_KEY_ID, optional: true}
                - name: TECHDOCS_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: forgejo-techdocs-s3, key: TECHDOCS_S3_SECRET_ACCESS_KEY, optional: true}
                # Cloudflare deploy credential (wrangler: twente.dev + webgrip.nl),
                # from OpenBao cloudflare/deploy via the forgejo-cloudflare-deploy
                # ExternalSecret; rotated monthly by cloudflare-token-roller.
                - name: CLOUDFLARE_API_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-cloudflare-deploy, key: CLOUDFLARE_API_TOKEN, optional: true}
                - name: CLOUDFLARE_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef: {name: forgejo-cloudflare-deploy, key: CLOUDFLARE_ACCOUNT_ID, optional: true}
                - name: CLOUDFLARE_TOFU_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-cloudflare-tofu, key: CLOUDFLARE_TOFU_TOKEN, optional: true}
                - name: TOFU_STATE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: forgejo-cloudflare-tofu, key: TOFU_STATE_ACCESS_KEY_ID, optional: true}
                - name: TOFU_STATE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: forgejo-cloudflare-tofu, key: TOFU_STATE_SECRET_ACCESS_KEY, optional: true}
                - name: TOFU_ENCRYPTION_PASSPHRASE
                  valueFrom:
                    secretKeyRef: {name: forgejo-cloudflare-tofu, key: TOFU_ENCRYPTION_PASSPHRASE, optional: true}
                - name: CLOUDFLARE_TOFU_REPO
                  value: cloudflare
                - name: AUTHENTIK_ACCESS_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef: {name: forgejo-cloudflare-access-oidc, key: AUTHENTIK_ACCESS_CLIENT_SECRET, optional: true}
                - name: CLOUDFLARE_DNS_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-cloudflare-dns, key: CLOUDFLARE_DNS_TOKEN, optional: true}
                - name: CLOUDFLARE_DNS_REPOS
                  value: twente.dev
                - name: BREVO_API_KEY
                  valueFrom:
                    secretKeyRef: {name: forgejo-brevo, key: BREVO_API_KEY, optional: true}
                - name: BREVO_REPO
                  value: twente.dev
                # npmjs.com publish token (frontend-toolkit's public @webgrip packages),
                # from OpenBao npmjs/publish via the forgejo-npmjs-publish
                # ExternalSecret; rotation is manual (npm has no roll API).
                - name: NPMJS_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-npmjs-publish, key: NPMJS_TOKEN, optional: true}
                - name: OVSX_PAT
                  valueFrom:
                    secretKeyRef: {name: forgejo-openvsx-publish, key: OVSX_PAT, optional: true}
                - name: VSCODE_EXTENSION_REPO
                  value: de-vloer
                # Org VARIABLES (non-secret) the .forgejo reusable workflows read.
                - name: WEBGRIP_CI_BOT_NAME
                  value: webgrip-ci
                # Docs repos that get their own bucket-scoped S3 key as
                # REPO-level TECHDOCS_S3_* (estate item #2). Must match the
                # REPOS list in garage's techdocs bootstrap Job; the key pairs
                # arrive as files via the forgejo-docs-repo-keys volume below.
                - name: DOCS_REPOS
                  value: >-
                    infrastructure workflows telemetry-service ledgerflow
                    monitoring-platform searxng-application freshrss-application
                    invoiceninja-application action-typescript-template
                    application-template backstage-application twente.dev glide
              command:
                - /bin/sh
                - -ceu
                - |
                  api="${FORGEJO_URL}/api/v1"

                  # Fail-soft: if any input is missing, exit 0 and retry next tick.
                  if [ -z "${ADMIN_USERNAME:-}" ] || [ -z "${ADMIN_PASSWORD:-}" ]; then
                    echo "[forgejo-actions-secrets] forgejo admin creds not present yet; exiting 0 (will retry)"; exit 0
                  fi
                  if [ -z "${HARBOR_ROBOT_USER:-}" ] || [ -z "${HARBOR_ROBOT_TOKEN:-}" ]; then
                    echo "[forgejo-actions-secrets] harbor robot creds not present yet; exiting 0 (will retry)"; exit 0
                  fi
                  admin="${ADMIN_USERNAME}:${ADMIN_PASSWORD}"

                  # Wait for the Forgejo API; fail-soft (exit 0) if it never comes up this tick.
                  i=0
                  until curl -fsS -o /dev/null "${api}/version"; do
                    i=$((i+1))
                    [ "$i" -ge 30 ] && { echo "[forgejo-actions-secrets] forgejo API unreachable after 30 tries; exiting 0"; exit 0; }
                    echo "[forgejo-actions-secrets] waiting for forgejo API ($i/30)..."; sleep 10
                  done

                  # put_secret NAME VALUE -> create-or-update an org Actions secret.
                  # jq builds the JSON body so the value (incl. the literal `$` in the
                  # robot username) is encoded safely; only the NAME is ever logged.
                  put_secret() {
                    _name="$1"; _val="$2"
                    _body="$(jq -nc --arg v "$_val" '{data:$v}')"
                    _code="$(curl -sS -o /dev/null -w '%{http_code}' -u "$admin" \
                      -X PUT -H 'Content-Type: application/json' \
                      -d "$_body" "${api}/orgs/${ORG}/actions/secrets/${_name}")"
                    case "$_code" in
                      201) echo "[forgejo-actions-secrets] created org secret ${ORG}/${_name}" ;;
                      204) echo "[forgejo-actions-secrets] updated org secret ${ORG}/${_name}" ;;
                      *)   echo "[forgejo-actions-secrets] WARN: PUT ${ORG}/${_name} returned HTTP ${_code}"; return 1 ;;
                    esac
                  }

                  # put_var NAME VALUE -> create-or-update an org Actions VARIABLE (non-secret).
                  put_var() {
                    _name="$1"; _val="$2"
                    _body="$(jq -nc --arg v "$_val" '{value:$v}')"
                    _code="$(curl -sS -o /dev/null -w '%{http_code}' -u "$admin" \
                      -X POST -H 'Content-Type: application/json' -d "$_body" "${api}/orgs/${ORG}/actions/variables/${_name}")"
                    case "$_code" in
                      201|204) echo "[forgejo-actions-secrets] set org var ${ORG}/${_name}" ;;
                      *) _code="$(curl -sS -o /dev/null -w '%{http_code}' -u "$admin" \
                           -X PUT -H 'Content-Type: application/json' -d "$_body" "${api}/orgs/${ORG}/actions/variables/${_name}")"
                         case "$_code" in
                           201|204) echo "[forgejo-actions-secrets] updated org var ${ORG}/${_name}" ;;
                           *) echo "[forgejo-actions-secrets] WARN: var ${ORG}/${_name} returned HTTP ${_code}"; return 1 ;;
                         esac ;;
                    esac
                  }

                  rc=0
                  put_secret HARBOR_ROBOT_USER  "$HARBOR_ROBOT_USER"  || rc=1
                  put_secret HARBOR_ROBOT_TOKEN "$HARBOR_ROBOT_TOKEN" || rc=1

                  # DT key is best-effort: a missing one must not block the required Harbor creds.
                  if [ -n "${DT_API_KEY:-}" ]; then
                    put_secret DT_API_KEY "$DT_API_KEY" || rc=1
                  else
                    echo "[forgejo-actions-secrets] dependency-track api key not present yet; skipping (will retry)"
                  fi

                  # Org variable (config) the .forgejo reusable workflows read as APP_BOT_SLUG. Name is
                  # WEBGRIP_-prefixed: Forgejo rejects the reserved FORGEJO_/GITHUB_/GITEA_ prefixes.
                  # (Workflows get the forge URL from the intrinsic github.server_url, not an org var.)
                  put_var WEBGRIP_CI_BOT_NAME "$WEBGRIP_CI_BOT_NAME"  || rc=1

                  # CI bot token (minted by forgejo-ci-provisioner) — best-effort until present.
                  # Published as WEBGRIP_CI_TOKEN: a FORGEJO_-prefixed secret name is rejected, and
                  # secrets.FORGEJO_TOKEN is anyway the built-in per-job token, not this org bot token.
                  if [ -n "${FORGEJO_TOKEN:-}" ]; then
                    put_secret WEBGRIP_CI_TOKEN "$FORGEJO_TOKEN" || rc=1
                  else
                    echo "[forgejo-actions-secrets] CI bot token not minted yet; skipping (will retry)"
                  fi

                  # Codeberg Pages token (techdocs-deploy-codeberg) — best-effort until seeded.
                  # CODEBERG_ is not a reserved prefix, so the secret name needs no remapping.
                  if [ -n "${CODEBERG_TOKEN:-}" ]; then
                    put_secret CODEBERG_TOKEN "$CODEBERG_TOKEN" || rc=1
                  else
                    echo "[forgejo-actions-secrets] codeberg pages token not present yet; skipping (will retry)"
                  fi

                  # TechDocs S3 publish key + bucket config (techdocs-deploy-backstage-s3,
                  # ADR-0039). Best-effort until the garage-techdocs-bootstrap Job has minted
                  # the keys. TECHDOCS_ is not a reserved prefix. The endpoint/bucket/region
                  # are non-secret config, published as org VARIABLES like WEBGRIP_CI_BOT_NAME.
                  if [ -n "${TECHDOCS_S3_ACCESS_KEY_ID:-}" ]; then
                    put_secret TECHDOCS_S3_ACCESS_KEY_ID     "$TECHDOCS_S3_ACCESS_KEY_ID"     || rc=1
                    put_secret TECHDOCS_S3_SECRET_ACCESS_KEY "$TECHDOCS_S3_SECRET_ACCESS_KEY" || rc=1
                    put_var TECHDOCS_S3_ENDPOINT "http://garage-s3.garage.svc.cluster.local:3900" || rc=1
                    put_var TECHDOCS_S3_BUCKET   "techdocs"                                       || rc=1
                    put_var TECHDOCS_S3_REGION   "garage"                                         || rc=1
                  else
                    echo "[forgejo-actions-secrets] techdocs s3 key not minted yet; skipping (will retry)"
                  fi

                  # Cloudflare deploy credential (wrangler deploys for twente.dev + webgrip.nl).
                  # Best-effort until OpenBao cloudflare/deploy is seeded (go-live runbook).
                  # Same validate-don't-just-republish stance as the GHCR PAT below: a rolled
                  # or revoked token must fail THIS job (alertable), not a deploy weeks later.
                  # Verify tries the account-owned endpoint first, /user as fallback, so both
                  # token flavours pass. Values are never logged.
                  if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
                    put_secret CLOUDFLARE_API_TOKEN  "$CLOUDFLARE_API_TOKEN"  || rc=1
                    put_secret CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID" || rc=1

                    _cf="https://api.cloudflare.com/client/v4"
                    _code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                      "${_cf}/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")" || _code=000
                    if [ "$_code" != "200" ]; then
                      _code="$(curl -sS -o /dev/null -w '%{http_code}' \
                        -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                        "${_cf}/user/tokens/verify")" || _code=000
                    fi
                    if [ "$_code" != "200" ]; then
                      echo "[forgejo-actions-secrets] ERROR: CLOUDFLARE_API_TOKEN rejected by Cloudflare (HTTP ${_code}) — expired, revoked, or a stale pre-roll value."
                      echo "[forgejo-actions-secrets]        Check OpenBao secret/cloudflare/deploy and the cloudflare-token-roller job."
                      rc=1
                    else
                      echo "[forgejo-actions-secrets] CLOUDFLARE_API_TOKEN valid"
                    fi
                  else
                    echo "[forgejo-actions-secrets] cloudflare deploy creds not present yet; skipping (will retry)"
                  fi

                  # GitHub PAT -> GHCR push/sign creds + the GitHub Release mirror token. Forgejo is the
                  # sole release authority; these fan out to GHCR + the github.com Releases tab. GHCR_/GH_
                  # are not reserved prefixes. Best-effort until the PAT is seeded in OpenBao.
                  if [ -n "${GHCR_TOKEN:-}" ]; then
                    put_secret GHCR_USERNAME    "${GHCR_USERNAME:-webgrip}"        || rc=1
                    put_secret GHCR_TOKEN       "$GHCR_TOKEN"                      || rc=1
                    put_secret GH_RELEASE_TOKEN "${GH_RELEASE_TOKEN:-$GHCR_TOKEN}" || rc=1

                    # Validate the PAT, don't just republish it. An expired or revoked token
                    # here is invisible until a release fails weeks later: ploeg's GHCR track
                    # was seeded 2026-07-23, parked the same day, and found dead when it was
                    # reopened on 2026-08-24 — the token had lapsed on GitHub's default 30-day
                    # schedule with nothing exercising it in between. Failing this job is the
                    # alertable signal (ForgejoActionsSecretsReconcileStale), the same
                    # mechanism ADR-0046 uses for the Harbor proxy upstreams. The secrets are
                    # published above regardless: rc only marks the job failed, it never skips
                    # the PUTs, so a lapsing token still reconciles while it nags.
                    _hdr="$(mktemp)"
                    _code="$(curl -sS -o /dev/null -D "$_hdr" -w '%{http_code}' \
                      -H "Authorization: token ${GHCR_TOKEN}" https://api.github.com/user)" || _code=000
                    if [ "$_code" != "200" ]; then
                      echo "[forgejo-actions-secrets] ERROR: GHCR_TOKEN rejected by api.github.com (HTTP ${_code}) — expired or revoked."
                      echo "[forgejo-actions-secrets]        Rotate at OpenBao secret/github/ci-pat (classic PAT, scopes: repo + write:packages)."
                      rc=1
                    else
                      # Classic PATs that carry an expiry advertise it in this header; a token
                      # set to never expire omits it, which is the recommended shape here
                      # precisely because this check exists.
                      _exp="$(tr -d '\r' < "$_hdr" | sed -n 's/^[Gg]ithub-[Aa]uthentication-[Tt]oken-[Ee]xpiration: //p')"
                      if [ -n "$_exp" ]; then
                        _days="$(jq -rn --arg e "$_exp" '
                          try (((($e | sub(" *UTC$";"")) | strptime("%Y-%m-%d %H:%M:%S") | mktime) - now) / 86400 | floor)
                          catch empty')"
                        if [ -n "$_days" ] && [ "$_days" -lt 14 ] 2>/dev/null; then
                          echo "[forgejo-actions-secrets] ERROR: GHCR_TOKEN expires in ${_days}d (${_exp}) — rotate at OpenBao secret/github/ci-pat before the release fan-out breaks."
                          rc=1
                        else
                          echo "[forgejo-actions-secrets] GHCR_TOKEN valid; expires ${_exp} (${_days:-?}d left)"
                        fi
                      else
                        echo "[forgejo-actions-secrets] GHCR_TOKEN valid; no expiry set"
                      fi
                    fi

                  # npmjs.com publish token (frontend-toolkit's @webgrip packages).
                  # Best-effort until OpenBao npmjs/publish is seeded. Same
                  # validate-don't-just-republish stance as the blocks above: a revoked
                  # or expired npm token must fail THIS job (alertable), not a package
                  # release weeks later. npmjs's whoami answers 200 for a live token.
                  if [ -n "${NPMJS_TOKEN:-}" ]; then
                    put_secret NPMJS_TOKEN "$NPMJS_TOKEN" || rc=1
                    _code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer ${NPMJS_TOKEN}" \
                      "https://registry.npmjs.org/-/whoami")" || _code=000
                    if [ "$_code" != "200" ]; then
                      echo "[forgejo-actions-secrets] ERROR: NPMJS_TOKEN rejected by npmjs (HTTP ${_code}) — expired or revoked."
                      echo "[forgejo-actions-secrets]        Mint a new Automation token as the npmjs org owner and overwrite OpenBao secret/npmjs/publish."
                      rc=1
                    else
                      echo "[forgejo-actions-secrets] NPMJS_TOKEN valid"
                    fi
                  else
                    echo "[forgejo-actions-secrets] NPMJS_TOKEN not present; skipping (seed OpenBao npmjs/publish)"
                  fi
                    rm -f "$_hdr"
                  else
                    echo "[forgejo-actions-secrets] github PAT not present yet; skipping GHCR/release secrets (will retry)"
                  fi

                  # Per-repo docs S3 keys (estate item #2): repo-level secrets with
                  # the same TECHDOCS_S3_* names — Forgejo resolves repo-level over
                  # org-level, so each docs repo publishes with a key that can only
                  # touch its own docs-<repo>/-trash bucket pair. If precedence
                  # ever regressed to the org key, the publish would 403 (the org
                  # key is read-only on repo buckets) — loud, not silent.
                  # homelab-cluster is deliberately absent: it keeps the org key
                  # (rw docs-site + estate-wide read for the offline bundle).
                  put_repo_secret() {
                    _repo="$1"; _name="$2"; _val="$3"
                    _body="$(jq -nc --arg v "$_val" '{data:$v}')"
                    _code="$(curl -sS -o /dev/null -w '%{http_code}' -u "$admin" \
                      -X PUT -H 'Content-Type: application/json' \
                      -d "$_body" "${api}/repos/${ORG}/${_repo}/actions/secrets/${_name}")"
                    case "$_code" in
                      201|204) echo "[forgejo-actions-secrets] set repo secret ${_repo}/${_name}" ;;
                      *) echo "[forgejo-actions-secrets] WARN: repo secret ${_repo}/${_name} returned HTTP ${_code}"; return 1 ;;
                    esac
                  }
                  keydir=/run/docs-repo-keys
                  for repo in ${DOCS_REPOS}; do
                    akid_file="${keydir}/${repo}_access_key_id"
                    sk_file="${keydir}/${repo}_secret_access_key"
                    if [ -s "${akid_file}" ] && [ -s "${sk_file}" ]; then
                      put_repo_secret "${repo}" TECHDOCS_S3_ACCESS_KEY_ID     "$(cat "${akid_file}")" || rc=1
                      put_repo_secret "${repo}" TECHDOCS_S3_SECRET_ACCESS_KEY "$(cat "${sk_file}")"   || rc=1
                    else
                      echo "[forgejo-actions-secrets] docs key for ${repo} not present yet; skipping (will retry)"
                    fi
                  done

                  if [ -n "${CLOUDFLARE_TOFU_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] \
                    && [ -n "${TOFU_STATE_ACCESS_KEY_ID:-}" ] && [ -n "${TOFU_STATE_SECRET_ACCESS_KEY:-}" ] \
                    && [ -n "${TOFU_ENCRYPTION_PASSPHRASE:-}" ]; then
                    put_repo_secret "${CLOUDFLARE_TOFU_REPO}" CLOUDFLARE_TOFU_TOKEN        "$CLOUDFLARE_TOFU_TOKEN"        || rc=1
                    put_repo_secret "${CLOUDFLARE_TOFU_REPO}" TOFU_STATE_ACCESS_KEY_ID     "$TOFU_STATE_ACCESS_KEY_ID"     || rc=1
                    put_repo_secret "${CLOUDFLARE_TOFU_REPO}" TOFU_STATE_SECRET_ACCESS_KEY "$TOFU_STATE_SECRET_ACCESS_KEY" || rc=1
                    put_repo_secret "${CLOUDFLARE_TOFU_REPO}" TOFU_ENCRYPTION_PASSPHRASE   "$TOFU_ENCRYPTION_PASSPHRASE"   || rc=1

                    _cf="https://api.cloudflare.com/client/v4"
                    _code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer ${CLOUDFLARE_TOFU_TOKEN}" \
                      "${_cf}/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")" || _code=000
                    if [ "$_code" != "200" ]; then
                      _code="$(curl -sS -o /dev/null -w '%{http_code}' \
                        -H "Authorization: Bearer ${CLOUDFLARE_TOFU_TOKEN}" \
                        "${_cf}/user/tokens/verify")" || _code=000
                    fi
                    if [ "$_code" != "200" ]; then
                      echo "[forgejo-actions-secrets] ERROR: CLOUDFLARE_TOFU_TOKEN rejected by Cloudflare (HTTP ${_code}); check OpenBao secret/cloudflare/tofu"
                      rc=1
                    else
                      echo "[forgejo-actions-secrets] CLOUDFLARE_TOFU_TOKEN valid"
                    fi
                  else
                    echo "[forgejo-actions-secrets] cloudflare tofu creds not present yet; skipping (will retry)"
                  fi

                  if [ -n "${AUTHENTIK_ACCESS_CLIENT_SECRET:-}" ]; then
                    put_repo_secret "${CLOUDFLARE_TOFU_REPO}" AUTHENTIK_ACCESS_CLIENT_SECRET "$AUTHENTIK_ACCESS_CLIENT_SECRET" || rc=1
                  else
                    echo "[forgejo-actions-secrets] authentik access client secret not present yet; skipping (will retry)"
                  fi

                  if [ -n "${CLOUDFLARE_DNS_TOKEN:-}" ]; then
                    for _repo in ${CLOUDFLARE_DNS_REPOS}; do
                      put_repo_secret "${_repo}" CLOUDFLARE_DNS_TOKEN "$CLOUDFLARE_DNS_TOKEN" || rc=1
                    done
                    _code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer ${CLOUDFLARE_DNS_TOKEN}" \
                      "https://api.cloudflare.com/client/v4/user/tokens/verify")" || _code=000
                    if [ "$_code" != "200" ]; then
                      echo "[forgejo-actions-secrets] ERROR: CLOUDFLARE_DNS_TOKEN rejected by Cloudflare (HTTP ${_code}); check OpenBao secret/cloudflare/dnscontrol"
                      rc=1
                    else
                      echo "[forgejo-actions-secrets] CLOUDFLARE_DNS_TOKEN valid"
                    fi
                  else
                    echo "[forgejo-actions-secrets] cloudflare dns token not present yet; skipping (seed OpenBao secret/cloudflare/dnscontrol)"
                  fi

                  if [ -n "${BREVO_API_KEY:-}" ]; then
                    put_repo_secret "${BREVO_REPO}" BREVO_API_KEY "$BREVO_API_KEY" || rc=1
                    _code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "api-key: ${BREVO_API_KEY}" https://api.brevo.com/v3/account)" || _code=000
                    if [ "$_code" != "200" ]; then
                      echo "[forgejo-actions-secrets] ERROR: BREVO_API_KEY rejected by Brevo (HTTP ${_code}); rotate at OpenBao secret/brevo/twente-dev"
                      rc=1
                    else
                      echo "[forgejo-actions-secrets] BREVO_API_KEY valid"
                    fi
                  else
                    echo "[forgejo-actions-secrets] brevo key not present yet; skipping (seed OpenBao secret/brevo/twente-dev)"
                  fi

                  if [ -n "${OVSX_PAT:-}" ]; then
                    put_repo_secret "${VSCODE_EXTENSION_REPO}" OVSX_PAT "$OVSX_PAT" || rc=1
                    _code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                      -H 'Content-Type: application/json' -d '{"name":"webgrip"}' \
                      "https://open-vsx.org/api/-/namespace/create?token=${OVSX_PAT}")" || _code=000
                    if [ "$_code" = "401" ] || [ "$_code" = "000" ]; then
                      echo "[forgejo-actions-secrets] ERROR: OVSX_PAT rejected by Open VSX (HTTP ${_code}); rotate at OpenBao secret/openvsx/de-vloer"
                      rc=1
                    else
                      echo "[forgejo-actions-secrets] OVSX_PAT valid"
                    fi
                  else
                    echo "[forgejo-actions-secrets] open vsx token not present yet; skipping (seed OpenBao secret/openvsx/de-vloer)"
                  fi

                  [ "$rc" -eq 0 ] && echo "[forgejo-actions-secrets] reconcile complete" \
                    || echo "[forgejo-actions-secrets] reconcile incomplete; will retry next tick"
                  exit "$rc"
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                # Per-repo docs S3 keys as files (env names cannot carry the
                # hyphens in repo names). optional: the loop skips absent pairs.
                - {name: docs-repo-keys, mountPath: /run/docs-repo-keys, readOnly: true}
          volumes:
            - name: tmp
              emptyDir: {}
            - name: docs-repo-keys
              secret:
                secretName: forgejo-docs-repo-keys
                optional: true
