---
# Seed the provisioner-minted unfold-reports token into OpenBao KV (secret/forgejo/unfold-reports),
# the path ExternalSecret/unfold-reports-token in the ploeg namespace already reads. This replaces
# the hand-seeded value: from here on the cluster owns the token.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-reports-token
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: unfold-reports-token}}
  data:
    - match: {secretKey: FORGEJO_TOKEN, remoteRef: {remoteKey: forgejo/unfold-reports, property: FORGEJO_TOKEN}}
