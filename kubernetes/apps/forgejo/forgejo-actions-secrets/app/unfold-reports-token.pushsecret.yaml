---
# Seed the provisioner-minted unfold-reports token into OpenBao KV at secret/forgejo/unfold-reports-bot,
# which ExternalSecret/unfold-reports-token in the ploeg namespace reads. A new path on purpose: the
# hand-seeded secret/forgejo/unfold-reports carries no external-secrets ownership metadata, so a
# PushSecret refuses to overwrite it ("secret not managed by external-secrets").
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-reports-token
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: unfold-reports-token}}
  data:
    - match: {secretKey: FORGEJO_TOKEN, remoteRef: {remoteKey: forgejo/unfold-reports-bot, property: FORGEJO_TOKEN}}
