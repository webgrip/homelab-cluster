---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-cloudflare-tofu
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "Written by just cloudflare-tofu-cred: the Cloudflare API token and its id that OpenTofu manages the zones with, the S3 keys of its state bucket on the off-site Garage, and the state encryption passphrase."
    wellhead.dev/plain: "CLOUDFLARE_TOFU_TOKEN_ID TOFU_STATE_ACCESS_KEY_ID"
    wellhead.dev/verify.cloudflare-token.field: "CLOUDFLARE_TOFU_TOKEN"
    wellhead.dev/verify.format.TOFU_ENCRYPTION_PASSPHRASE: "\\S{32,}"
    wellhead.dev/verify: "cloudflare-token format"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-cloudflare-tofu, creationPolicy: Owner}
  data:
    - {secretKey: CLOUDFLARE_TOFU_TOKEN, remoteRef: {key: cloudflare/tofu, property: CLOUDFLARE_TOFU_TOKEN}}
    - {secretKey: CLOUDFLARE_TOFU_TOKEN_ID, remoteRef: {key: cloudflare/tofu, property: CLOUDFLARE_TOFU_TOKEN_ID}}
    - {secretKey: TOFU_STATE_ACCESS_KEY_ID, remoteRef: {key: cloudflare/tofu, property: TOFU_STATE_ACCESS_KEY_ID}}
    - {secretKey: TOFU_STATE_SECRET_ACCESS_KEY, remoteRef: {key: cloudflare/tofu, property: TOFU_STATE_SECRET_ACCESS_KEY}}
    - {secretKey: TOFU_ENCRYPTION_PASSPHRASE, remoteRef: {key: cloudflare/tofu, property: TOFU_ENCRYPTION_PASSPHRASE}}
