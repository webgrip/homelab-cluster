---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-cloudflare-dns
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: forgejo-cloudflare-dns, creationPolicy: Owner}
  data:
    - {secretKey: CLOUDFLARE_DNS_TOKEN, remoteRef: {key: cloudflare/dns, property: CLOUDFLARE_DNS_TOKEN}}
