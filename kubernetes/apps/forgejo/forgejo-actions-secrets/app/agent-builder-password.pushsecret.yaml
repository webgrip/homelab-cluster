---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: agent-builder-password
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: agent-builder-password}}
  data:
    - match: {secretKey: password, remoteRef: {remoteKey: forgejo/agent-builder-password, property: password}}
