---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-brevo
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Brevo API key for twente.dev's mail, made by a person in Brevo (SMTP and API, API keys)."
    wellhead.dev/docs: "https://forgejo.webgrip.dev/webgrip/homelab-cluster/src/branch/main/docs/techdocs/docs/adr/adr-0055-one-secrets-model-six-levels.md"
    wellhead.dev/verify.http.url: "https://api.brevo.com/v3/account"
    wellhead.dev/verify.http.auth: "header:api-key:BREVO_API_KEY"
    wellhead.dev/verify: "http"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-brevo, creationPolicy: Owner}
  data:
    - {secretKey: BREVO_API_KEY, remoteRef: {key: brevo/twente-dev, property: BREVO_API_KEY}}
