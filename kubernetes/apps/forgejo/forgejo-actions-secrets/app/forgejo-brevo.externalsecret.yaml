---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-brevo
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: forgejo-brevo, creationPolicy: Owner}
  data:
    - {secretKey: BREVO_API_KEY, remoteRef: {key: brevo/twente-dev, property: BREVO_API_KEY}}
