---
apiVersion: batch/v1
kind: Job
metadata:
  name: glide-docs-secrets-bootstrap
  namespace: forgejo
  labels:
    cleanup.webgrip.io/retry-failed: "true"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: forgejo-actions-secrets
      automountServiceAccountToken: false
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: provision
          image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
          env:
            - name: FORGEJO_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef: {name: forgejo-admin-secret, key: username}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: forgejo-admin-secret, key: password}
            - name: DOCS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: forgejo-docs-repo-keys, key: glide_access_key_id}
            - name: DOCS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: forgejo-docs-repo-keys, key: glide_secret_access_key}
          command:
            - /bin/sh
            - -ceu
            - |
              publish() {
                name="$1"
                value="$2"
                code="$(jq -nc --arg v "$value" '{data:$v}' | curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
                  -u "$ADMIN_USERNAME:$ADMIN_PASSWORD" -X PUT -H 'Content-Type: application/json' \
                  --data-binary @- "$FORGEJO_URL/api/v1/repos/webgrip/unfold/actions/secrets/$name")"
                case "$code" in
                  201|204) echo "set repo secret unfold/$name" ;;
                  *) echo "repo secret unfold/$name returned HTTP $code"; exit 1 ;;
                esac
              }
              publish TECHDOCS_S3_ACCESS_KEY_ID "$DOCS_ACCESS_KEY"
              publish TECHDOCS_S3_SECRET_ACCESS_KEY "$DOCS_SECRET_KEY"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
