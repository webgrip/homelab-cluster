---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-cloudflare-access-oidc
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: forgejo-cloudflare-access-oidc, creationPolicy: Owner}
  data:
    - {secretKey: AUTHENTIK_ACCESS_CLIENT_SECRET, remoteRef: {key: cloudflare/access-oidc, property: client_secret}}
