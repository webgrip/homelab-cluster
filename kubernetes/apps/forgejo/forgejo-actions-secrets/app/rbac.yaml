---
# Identity for the CI-bot provisioner Job. The admin + bot-password Secrets it consumes are
# injected as env vars by the kubelet (secretKeyRef) — that path does NOT use this Role — so the
# only k8s API access it needs is over the ONE Secret it owns, forgejo-ci-token: read it back (to
# reuse a still-valid token) and create-or-update it (kubectl apply). No other authority.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-ci-provisioner
  namespace: forgejo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-ci-provisioner
  namespace: forgejo
rules:
  # Read-back + update of the token Secret this Job owns (kubectl get; kubectl apply patch).
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "forgejo-ci-token"
    verbs:
      - "get"
      - "update"
      - "patch"
  # First-run creation only. RBAC cannot scope `create` by resourceName, so this is
  # namespace-wide on the type — the narrowest grant the API allows.
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-ci-provisioner
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-ci-provisioner
subjects:
  - kind: ServiceAccount
    name: forgejo-ci-provisioner
    namespace: forgejo
---
# Identity for the forgejo-actions-secrets sync CronJob. It only talks to the Forgejo
# HTTP API (see the cronjob's own automountServiceAccountToken: false), never the k8s
# API, so this SA carries no RBAC -- named identity only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-actions-secrets
  namespace: forgejo
automountServiceAccountToken: false
---
# Identity for the cloudflare-token-roller CronJob. Same shape as
# forgejo-ci-provisioner above: get/update/patch on the ONE Secret it owns
# (cloudflare-deploy-rolled, watched by the PushSecret), plus first-run create
# — RBAC cannot scope `create` by resourceName, so that grant is
# namespace-wide on the type, the narrowest the API allows.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflare-token-roller
  namespace: forgejo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudflare-token-roller
  namespace: forgejo
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "cloudflare-deploy-rolled"
    verbs:
      - "get"
      - "update"
      - "patch"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudflare-token-roller
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudflare-token-roller
subjects:
  - kind: ServiceAccount
    name: cloudflare-token-roller
    namespace: forgejo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflare-dns-token-minter
  namespace: forgejo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudflare-dns-token-minter
  namespace: forgejo
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "cloudflare-dns-tokens"
    verbs:
      - "get"
      - "update"
      - "patch"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudflare-dns-token-minter
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudflare-dns-token-minter
subjects:
  - kind: ServiceAccount
    name: cloudflare-dns-token-minter
    namespace: forgejo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-reconciler
  namespace: forgejo
automountServiceAccountToken: false
