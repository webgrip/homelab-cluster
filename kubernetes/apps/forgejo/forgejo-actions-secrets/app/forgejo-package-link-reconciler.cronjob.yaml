---
# Links org packages to their repos, org-wide, forever. Forgejo packages are owner-scoped
# and land UNLINKED — they never show on a repo's /packages page until linked (the
# anonymous API additionally hides links to private repos, so "looks unlinked" is not
# proof). CI links its own packages at publish time (webgrip/workflows
# forgejo-distribute.yml); this CronJob is the org-wide backstop that catches drift:
# pre-existing packages, hand-pushed images, repos whose CI predates the link step.
#
# Matching is deliberately mechanical: a package links to the org repo with the SAME
# name, plus the static alias map below (image/chart names that differ from their repo).
# Unmatched unlinked packages are LOGGED, never guessed — the log line is the
# conformance signal a human (or ticket automation, later) acts on.
#
# Identity: the webgrip-ci bot token (forgejo-ci-token Secret, minted by
# forgejo-ci-provisioner) — linking needs package-owner write, which the bot's org-wide
# `ci` team grants. Same in-cluster fail-soft API pattern as forgejo-actions-secrets:
# an unreachable Forgejo exits 0 and retries next tick. Link API quirk: HTTP 400
# "invalid argument" has exactly two paths — owner mismatch (excluded by construction)
# and already-linked — so 400 is treated as converged.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-package-link-reconciler
  namespace: forgejo
spec:
  schedule: "41 * * * *" # hourly, offset from forgejo-actions-secrets (23 * * * *)
  # Bound the miss-count window: without it, >100 missed starts (e.g. behind a wedged Forbid job) halt scheduling forever.
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 21600 # GC finished jobs after 6h
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false # only talks to the Forgejo HTTP API
          # Keep this hourly Job off the soyo control-planes (ADR-0002).
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: reconcile
              image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
                - name: FORGEJO_URL
                  value: http://forgejo-http.forgejo.svc.cluster.local:3000
                - name: ORG
                  value: webgrip
                # package-name=repo-name pairs for packages whose name differs from
                # their repo (images and charts usually match; daemons often don't).
                - name: ALIASES
                  value: "ploegd=ploeg erfbeeld-backend=erfbeeld erfbeeld-web=erfbeeld"
                - name: FORGEJO_TOKEN
                  valueFrom:
                    secretKeyRef: {name: forgejo-ci-token, key: FORGEJO_TOKEN, optional: true}
              command:
                - /bin/sh
                - -ceu
                - |
                  api="${FORGEJO_URL}/api/v1"

                  # Fail-soft: no token yet, or Forgejo down -> exit 0, retry next tick.
                  if [ -z "${FORGEJO_TOKEN:-}" ]; then
                    echo "[pkg-link] bot token not minted yet; exiting 0 (will retry)"; exit 0
                  fi
                  curl -fsS -o /dev/null "${api}/version" || {
                    echo "[pkg-link] forgejo API unreachable; exiting 0 (will retry)"; exit 0
                  }
                  auth="Authorization: token ${FORGEJO_TOKEN}"

                  # target NAME -> repo to link to: alias map first, else same-name repo.
                  target() {
                    for kv in ${ALIASES}; do
                      [ "${kv%%=*}" = "$1" ] && { echo "${kv#*=}"; return; }
                    done
                    echo "$1"
                  }

                  linked=0; already=0; unmatched=""
                  page=1
                  while :; do
                    batch="$(curl -fsS -H "$auth" "${api}/packages/${ORG}?limit=50&page=${page}")" || break
                    count="$(printf '%s' "$batch" | jq 'length')"
                    [ "$count" = "0" ] && break
                    # One row per DISTINCT unlinked package name (link is per name, not version).
                    for name in $(printf '%s' "$batch" | jq -r '.[] | select(.repository == null) | .name' | sort -u); do
                      repo="$(target "$name")"
                      code="$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "${api}/repos/${ORG}/${repo}")"
                      if [ "$code" != "200" ]; then
                        unmatched="${unmatched} ${name}"
                        continue
                      fi
                      # type is per-row; look it up for this name (container/generic/npm/...).
                      type="$(printf '%s' "$batch" | jq -r --arg n "$name" '[.[] | select(.name == $n)][0].type')"
                      code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "$auth" \
                        "${api}/packages/${ORG}/${type}/${name}/-/link/${repo}")"
                      case "$code" in
                        201|204) echo "[pkg-link] linked ${type}/${name} -> ${ORG}/${repo}"; linked=$((linked+1)) ;;
                        400)     already=$((already+1)) ;; # already linked (or owner mismatch, impossible here)
                        *)       echo "[pkg-link] WARN: link ${type}/${name} -> ${repo} returned HTTP ${code}" ;;
                      esac
                    done
                    page=$((page+1))
                  done

                  # The conformance signal: unlinked packages with no matching repo need a
                  # human decision (new alias, new repo, or delete the package).
                  if [ -n "$unmatched" ]; then
                    echo "[pkg-link] UNMATCHED unlinked packages (add an alias or repo):${unmatched}"
                  fi
                  echo "[pkg-link] reconcile complete: ${linked} linked, ${already} already converged"
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {}
