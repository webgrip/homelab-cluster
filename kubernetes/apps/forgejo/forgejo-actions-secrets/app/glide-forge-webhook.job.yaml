---
apiVersion: batch/v1
kind: Job
metadata:
  name: glide-forge-webhook
  namespace: forgejo
  labels:
    cleanup.webgrip.io/retry-failed: 'true'
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: forgejo-actions-secrets
      automountServiceAccountToken: false
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
          env:
            - name: FORGEJO_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: REPOSITORIES
              value: >-
                webgrip/unfold
                webgrip/homelab-cluster
                webgrip/twente.dev
                webgrip/erfbeeld
                webgrip/omnigraph-explorer
                webgrip/ploeg-bench-world
            - name: TARGET_URL
              value: http://ploeg.ploeg.svc.cluster.local:8080/webhooks/forge/forgejo
            - name: EVENTS
              value: '["pull_request","pull_request_review"]'
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-secret
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-secret
                  key: password
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ploeg-forge-webhook
                  key: PLOEG_FORGEJO_SECRET
          command:
            - /bin/sh
            - -ceu
            - |
              fj() {
                curl -fsS --max-time 45 -u "$ADMIN_USERNAME:$ADMIN_PASSWORD" -H 'Content-Type: application/json' "$@"
              }
              body="$(jq -nc --arg u "$TARGET_URL" --arg s "$WEBHOOK_SECRET" --argjson e "$EVENTS" \
                '{type:"forgejo", active:true, branch_filter:"*", events:$e, config:{url:$u, content_type:"json", http_method:"post", secret:$s}}')"
              failed=0
              for repository in $REPOSITORIES; do
                api="$FORGEJO_URL/api/v1/repos/$repository/hooks"
                if ! hooks="$(fj "$api?limit=50")"; then
                  echo "could not read the webhooks of $repository"
                  failed=1
                  continue
                fi
                hook="$(printf '%s' "$hooks" | jq -r --arg u "$TARGET_URL" '[.[] | select(.config.url == $u) | .id][0] // empty')"
                if [ -z "$hook" ]; then
                  hook="$(printf '%s' "$body" | fj -X POST --data-binary @- "$api" | jq -r '.id // empty')"
                  [ -n "$hook" ] || { echo "could not create a webhook on $repository"; failed=1; continue; }
                  echo "created webhook $hook on $repository"
                else
                  printf '%s' "$body" | jq -c 'del(.type)' | fj -X PATCH --data-binary @- "$api/$hook" >/dev/null || { echo "could not update webhook $hook on $repository"; failed=1; continue; }
                  echo "updated webhook $hook on $repository"
                fi
                if fj "$api/$hook" | jq -e '.active == true and (.events | index("pull_request")) != null and (.events | any(startswith("pull_request_review")))' >/dev/null; then
                  echo "webhook $hook on $repository delivers $EVENTS to $TARGET_URL"
                else
                  echo "webhook $hook on $repository does not carry the expected events"
                  failed=1
                fi
              done
              exit "$failed"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
