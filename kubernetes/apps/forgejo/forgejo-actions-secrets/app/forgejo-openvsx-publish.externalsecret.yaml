---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-openvsx-publish
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "An Open VSX personal access token of the unfold publisher, written by just openvsx-cred, which checks it against open-vsx.org first."
    wellhead.dev/verify.format.OVSX_PAT: "\\S{20,}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-openvsx-publish, creationPolicy: Owner}
  data:
    - {secretKey: OVSX_PAT, remoteRef: {key: openvsx/unfold, property: OVSX_PAT}}
