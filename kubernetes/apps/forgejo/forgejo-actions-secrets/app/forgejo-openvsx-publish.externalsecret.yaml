---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-openvsx-publish
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: forgejo-openvsx-publish, creationPolicy: Owner}
  data:
    - {secretKey: OVSX_PAT, remoteRef: {key: openvsx/unfold, property: OVSX_PAT}}
