---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-release-password
  namespace: forgejo
spec:
  refreshInterval: "0"
  target:
    name: ploeg-release-password
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: "password", target: "password"}
