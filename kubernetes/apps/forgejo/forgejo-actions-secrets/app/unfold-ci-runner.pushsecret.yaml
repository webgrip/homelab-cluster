---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-ci-runner
  namespace: forgejo
spec:
  refreshInterval: 1h
  deletionPolicy: Delete
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: unfold-ci-runner}}
  data:
    - match: {secretKey: registration-token, remoteRef: {remoteKey: unfold-main/ci/forgejo-runner, property: registration-token}}
