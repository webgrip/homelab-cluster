---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: repo-config-provisioner
  namespace: forgejo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: repo-config-provisioner
  namespace: forgejo
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "repo-config-token"
      - "repo-config-inventory-token"
    verbs:
      - "get"
      - "update"
      - "patch"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: repo-config-provisioner
  namespace: forgejo
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: repo-config-provisioner}
subjects:
  - {kind: ServiceAccount, name: repo-config-provisioner, namespace: forgejo}
