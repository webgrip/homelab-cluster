---
# The Worker's dashboard session-signing key. No human ever needs to know this
# value, so it is entropy: generated in-cluster, never hand-entered into OpenBao
# (the external-secrets skill's origin test).
#
# It is a SEPARATE ExternalSecret from counterscale-worker on purpose. Generate-once
# semantics (refreshInterval "0" + deletionPolicy Retain) cannot be mixed into an
# ExternalSecret that refreshes hourly against the store: one spec carries one
# refreshInterval, and a 1h tick over a generator would mint a new key every hour.
#
# Retain is mandatory, not tidiness: CF_JWT_SECRET signs live dashboard sessions, so
# regenerating it logs everyone out and invalidates every issued token. Deleting this
# Secret is therefore a deliberate act with a visible consequence, never a side effect
# of a prune.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: counterscale-jwt
  namespace: forgejo
spec:
  refreshInterval: "0"
  target:
    name: counterscale-jwt
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
      rewrite:
        - regexp: {source: "password", target: "CF_JWT_SECRET"}
