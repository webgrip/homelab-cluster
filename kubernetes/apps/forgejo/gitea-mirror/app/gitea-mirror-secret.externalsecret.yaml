---
# gitea-mirror-secret now sourced from OpenBao (all keys via dataFrom.extract). Replaces SOPS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-mirror-secret
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "gitea-mirror's secrets, written once and copied to OpenBao by the PushSecret gitea-mirror-secret: ENCRYPTION_SECRET encrypts the tokens it stores, BETTER_AUTH_SECRET signs its sessions. Restore the values from OpenBao's history, never new ones."
    wellhead.dev/fields: "BETTER_AUTH_SECRET ENCRYPTION_SECRET"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.ENCRYPTION_SECRET: "\\S{32,}"
    wellhead.dev/verify.format.BETTER_AUTH_SECRET: "\\S{32,}"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: gitea-mirror-secret, creationPolicy: Owner}
  dataFrom:
    - extract: {key: gitea-mirror/app}
