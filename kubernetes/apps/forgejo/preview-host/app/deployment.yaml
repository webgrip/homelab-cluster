---
# preview-host: serves the dark-factory per-branch SPA previews (ADR-0048 iterate loop).
# CI publishes each branch's dist to the webgrip/previews repo under /<branch-slug>/;
# a git-sync sidecar pulls that repo every 30s into a shared emptyDir and nginx serves
# it at preview.${SECRET_DOMAIN}/<slug>/. Git history doubles as the retention story.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-host
  namespace: forgejo
  labels:
    app.kubernetes.io/name: preview-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preview-host
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview-host
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        fsGroup: 65533
      containers:
        - name: git-sync
          # Sync-only sidecar; reads the previews repo as agent-builder (org team `agents`
          # grants read; the token Secret already exists for the runner pool).
          image: registry.k8s.io/git-sync/git-sync:v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717
          env:
            - name: GITSYNC_REPO
              value: http://forgejo-http.forgejo.svc.cluster.local:3000/webgrip/previews.git
            - name: GITSYNC_REF
              value: main
            - name: GITSYNC_PERIOD
              value: 30s
            - name: GITSYNC_ROOT
              value: /data
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_DEPTH
              value: "1"
            # Never give up: the repo may be briefly unreachable during forgejo restarts.
            - name: GITSYNC_MAX_FAILURES
              value: "-1"
            # Exposes git-sync's built-in HTTP endpoint purely so the sidecar has a real
            # health signal; it serves 200 only once a sync has succeeded. Bound to a port
            # the pod does not publish — nginx owns 8080 and this is not a Service target.
            - name: GITSYNC_HTTP_BIND
              value: ":8081"
            - name: GITSYNC_USERNAME
              value: agent-builder
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef: {name: agent-builder-token, key: FORGEJO_TOKEN}
          # Readiness only, no liveness: GITSYNC_MAX_FAILURES is -1 ("never give up", because
          # forgejo restarts make the repo briefly unreachable), and a liveness probe would
          # flatly contradict that by restarting the sidecar for the exact transient this
          # sidecar is configured to ride out. Readiness reports the same fact without acting
          # on it — and it is what require-pod-probes asks for.
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65533
            runAsGroup: 65533
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: data
              mountPath: /data
            # git-sync writes its gitconfig under HOME=/tmp; with readOnlyRootFilesystem
            # that MUST be a mount (crash-looped 11x without it: "can't create gitconfig").
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
        - name: nginx
          image: harbor.webgrip.dev/dockerhub/nginxinc/nginx-unprivileged:1.31.3-alpine@sha256:f972e5322b9797dc2a6b830030094426437b1ae7032e4644496395336ac6fdac
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: nginx-conf
          configMap:
            name: preview-host-nginx
        - name: tmp
          emptyDir: {}
