---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./service.yaml
configMapGenerator:
  - name: ci-console-api
    files:
      - ci_console_api.py=./ci_console_api.py
generatorOptions:
  disableNameSuffixHash: false
