---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-console-api
  labels:
    app.kubernetes.io/name: ci-console-api
    app.kubernetes.io/part-of: forgejo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-console-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-console-api
        app.kubernetes.io/part-of: forgejo
    spec:
      nodeSelector:
        node.webgrip.io/pool: worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
          command:
            - "python3"
            - "-u"
            - "/opt/ci-console/ci_console_api.py"
          env:
            - name: FORGEJO_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: PATH_PREFIX
              value: /-/ci/api
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /opt/ci-console
              readOnly: true
          livenessProbe:
            httpGet:
              path: /-/ci/api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ci/api/healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: ci-console-api
