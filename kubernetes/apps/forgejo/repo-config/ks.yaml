---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-repo-config
spec:
  dependsOn:
    - name: tofu-controller
      namespace: flux-system
    - name: forgejo-actions-secrets
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/forgejo/repo-config/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo
  wait: false
