  ai-skills:
    profile: baseline
  application-template:
    profile: baseline
  backstage-application:
    profile: baseline
  claude-config:
    profile: baseline
    settings:
      has_releases: false
  cloudflare:
    profile: baseline
  common-charts:
    profile: baseline
  counterscale:
    profile: baseline
  freshrss-application:
    profile: baseline
  frontend-toolkit:
    profile: baseline
  homelab-cluster:
    profile: baseline
  infrastructure:
    profile: baseline
  invoiceninja-application:
    profile: baseline
  ledgerflow:
    profile: baseline
  monitoring-platform:
    profile: baseline
  renovate-config:
    profile: baseline
  searxng-application:
    profile: baseline
  seekframe:
    profile: baseline
    settings:
      default_delete_branch_after_merge: false
  semantic-release-config:
    profile: baseline
  telemetry-service:
    profile: baseline
  traefik-local-development:
    profile: baseline
