# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    release: kube-prometheus-stack
spec:
  groups:
    - name: forgejo.rules
      rules:
        - alert: ForgejoDown
          expr: up{job="forgejo-http", namespace="forgejo"} == 0
          for: 5m
          labels:
            severity: critical
            owner: platform
            service: forgejo
          annotations:
            summary: "Forgejo is down (forgejo)"
            description: |
              What's happening:
              - The Forgejo HTTP target has been unscrapable/down for at least 5m.

              Impact/risk:
              - Git over HTTPS, the web UI, the API, packages and LFS are unavailable.

              Likely causes:
              - Pod crashlooping or unschedulable
              - Database (forgejo-db) unreachable
              - Bad config/secret change

              First actions:
              - Check the forgejo Deployment/pod and events in namespace forgejo
              - Review pod logs for DB or config errors
              - Verify forgejo-db is Ready
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/forgejo"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/forgejo/forgejo"

        - alert: ForgejoDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{exported_namespace="forgejo", deployment="forgejo"} < 1
          for: 10m
          labels:
            severity: critical
            owner: platform
            service: forgejo
          annotations:
            summary: "Forgejo deployment has no available replicas (forgejo)"
            description: |
              What's happening:
              - The forgejo Deployment has had zero available replicas for 10m.

              Impact/risk:
              - Forgejo is unavailable to users and CI.

              Likely causes:
              - CreateContainerConfigError (missing/invalid Secret)
              - Failing readiness probe (DB connectivity)
              - Node/resource pressure or volume mount failure

              First actions:
              - kubectl -n forgejo describe deploy/forgejo and the pod
              - Check the forgejo-data PVC is Bound and mounted
              - Review pod logs
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/forgejo"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/forgejo/forgejo"

        - alert: ForgejoPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{exported_namespace="forgejo", exported_container="forgejo"}[1h]) > 3
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: forgejo
          annotations:
            summary: "Forgejo pod restarting repeatedly (forgejo)"
            description: |
              What's happening:
              - The forgejo container restarted more than 3 times in the last hour.

              Impact/risk:
              - Intermittent unavailability; sessions/queue churn.

              Likely causes:
              - OOMKill (raise memory limit)
              - Liveness probe flapping under load
              - Crash on a specific request or migration

              First actions:
              - kubectl -n forgejo logs deploy/forgejo --previous
              - Check container restart reason (OOMKilled?) and resource limits
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/forgejo"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/forgejo/forgejo"

        - alert: ForgejoServerOOMKilled
          # A server restart mid-run is invisible to the CI tooling except as the "every step
          # cancelled at 0s" / "can't connect to forgejo-http:3000" signature; this makes it page.
          # Recurred 2026-07-24 (09:32Z AND 22:29Z, both cgroup-limit OOMKills during CI bursts; the
          # 22:29 kill lost the erfbeeld v1.0.0 image builds), so the 2Gi limit was raised to 4Gi in
          # helmrelease.yaml. Steady state is ~170-260Mi — these are transient burst spikes. If this
          # still fires after 4Gi, watch MemoryNearLimit for a real trend (erfbeeld CI ops runbook).
          expr: kube_pod_container_status_last_terminated_reason{exported_namespace="forgejo", exported_container="forgejo", reason="OOMKilled"} == 1
          for: 2m
          labels:
            severity: critical
            owner: platform
            service: forgejo
          annotations:
            summary: "Forgejo server container was OOMKilled (forgejo)"
            description: |
              What's happening:
              - The forgejo container's last termination reason is OOMKilled.

              Impact/risk:
              - Any in-flight CI run dies WITHOUT error lines — every step shows "cancelled at 0s".
                Operators must not debug the workflow; the run just needs re-pushing.

              Likely causes:
              - A CI burst (many concurrent git/LFS/action-log operations) spiking past the 2Gi limit
              - A genuine memory leak (would show as a rising MemoryNearLimit trend)

              First actions:
              - bin/ci run <id> on the affected run -> confirms the infra_oom_or_restart signal
              - Check the ForgejoServerMemoryNearLimit trend before changing limits
              - Re-push the affected run(s); see the erfbeeld CI operations runbook (OOM signature)
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/forgejo"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/infra-forgejo"

        - alert: ForgejoServerMemoryNearLimit
          # Early-warning that precedes an OOM. This trend is what to consult before deciding whether
          # the 2Gi limit needs raising (verify-then-maybe-bump), not a single kill.
          expr: |
            max(container_memory_working_set_bytes{namespace="forgejo", container="forgejo"})
            / max(kube_pod_container_resource_limits{exported_namespace="forgejo", exported_container="forgejo", resource="memory"})
            > 0.9
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: forgejo
          annotations:
            summary: "Forgejo server memory > 90% of its limit (forgejo)"
            description: |
              What's happening:
              - The forgejo container's working set has exceeded 90% of its memory limit for 10m.

              Impact/risk:
              - An OOMKill is imminent, which silently kills in-flight CI runs.

              Likely causes:
              - Sustained load beyond the current limit (not just a transient burst)

              First actions:
              - Review the 7d working-set trend on the infra-forgejo dashboard
              - If genuinely sustained (not a one-off burst), raise limits.memory in
                kubernetes/apps/forgejo/forgejo/app/helmrelease.yaml (worker-1 is the high-RAM node)
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/forgejo"
            dashboard_url: "https://grafana.${SECRET_DOMAIN}/d/infra-forgejo"
        - alert: ForgejoActionsSecretsReconcileStale
          # The hourly forgejo-actions-secrets CronJob publishes the webgrip org Actions
          # secrets and, since 2026-08-25, VALIDATES the GitHub PAT it publishes — it exits
          # non-zero when api.github.com rejects the token or when it is within 14 days of
          # expiry. A stale last-success is therefore the alertable signal for a credential
          # that is about to break the release fan-out, rather than discovering it from a
          # failed release weeks later (ploeg, 2026-08-25). Same shape as
          # HarborProxyReconcileStale (ADR-0046). >2h spans two hourly cycles, so a single
          # transient blip self-clears.
          expr: |
            time() - kube_cronjob_status_last_successful_time{exported_namespace="forgejo", cronjob="forgejo-actions-secrets"} > 7800
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: forgejo
          annotations:
            summary: "Forgejo org secrets reconcile stale >2h — CI credential likely expired (forgejo)"
            description: |
              What's happening:
              - The hourly forgejo-actions-secrets CronJob has not completed successfully for >2h.
                The job fails when the GitHub PAT it publishes is rejected by api.github.com or
                is within 14 days of expiring, so this most often means an EXPIRED, EXPIRING or
                REVOKED credential — not a crashed job. Check the pod log for the exact reason.

              Impact/risk:
              - The org Actions secrets stop converging: GHCR_USERNAME / GHCR_TOKEN /
                GH_RELEASE_TOKEN, HARBOR_ROBOT_*, WEBGRIP_CI_TOKEN, DT_API_KEY, TECHDOCS_S3_*.
              - With a dead GitHub PAT the release fan-out loses GHCR pushes, the github.com
                ref mirror and GitHub Releases — silently, until the next release runs.

              Likely causes:
              - The GitHub PAT at OpenBao secret/github/ci-pat expired or was revoked.
              - A provider token in another block (Harbor robot, Codeberg, S3) stopped working.
              - CronJob not scheduling (suspended, or nodes unschedulable).

              First actions:
              - kubectl -n forgejo logs job/$(kubectl -n forgejo get job -o name \
                  -l job-name --sort-by=.metadata.creationTimestamp | tail -1 | cut -d/ -f2)
              - Rotate at the provider, then write to OpenBao and force-sync:
                  bao kv patch secret/github/ci-pat token=-        # value on stdin
                  kubectl -n forgejo annotate externalsecret forgejo-github-pat \
                    force-sync="$$(date +%s)" --overwrite
              - Re-run the reconciler AFTER ExternalSecret shows SecretSynced, or the job
                republishes the old value:
                  kubectl -n forgejo create job --from=cronjob/forgejo-actions-secrets ghcr-token-refresh
              - Never edit these in the Forgejo UI; this job overwrites them hourly.
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/secret-break-glass"
