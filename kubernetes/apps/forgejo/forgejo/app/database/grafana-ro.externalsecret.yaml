---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-grafana-ro
spec:
  refreshInterval: "0"
  target:
    name: forgejo-grafana-ro
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: "grafana_ro"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
