---
# yaml-language-server: $schema=../../../../../schemas/cnpg-cluster.schema.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
  labels:
    monitoring.webgrip.io/enabled: "true"
spec:
  instances: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  # Pin the DB off the soyo control-planes onto the worker pool (ADR-0002).
  # gitops-critical soyo replica was dropped 2026-06-21 (ADR-0008) — DR is via
  # external Garage S3 backups, not a live soyo replica.
  affinity:
    nodeSelector:
      node.webgrip.io/pool: worker
  inheritedMetadata:
    annotations:
      reloader.stakater.com/auto: "true"
  storage:
    size: 10Gi
    storageClass: longhorn
  walStorage:
    # 5Gi filled in ~1.5 days when the 2026-07-15 netpol gap broke WAL archiving
    # (barman-cloud plugin lost API access) — expanded live 2026-07-17 per the
    # WAL-full runbook nugget in incidents/2026-06-09-longhorn-oom-cascade.md.
    # NOTE: CNPG does NOT propagate size increases here to an existing PVC; a
    # live `kubectl patch pvc` is required (this value documents/rebuilds only).
    size: 10Gi
    storageClass: longhorn
  postgresql:
    parameters:
      # Backup-tier policy: compress WAL full-page images to shrink the S3 archive
      # and local WAL. See docs/techdocs/docs/database-backup-tiers.md
      wal_compression: "zstd"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-db-store
        serverName: forgejo-db
  managed:
    roles:
      - name: grafana_ro
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        bypassrls: false
        passwordSecret:
          name: forgejo-grafana-ro
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
