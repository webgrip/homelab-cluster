---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oidc-secret
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The OIDC client of Forgejo in Authentik: the client id the access-plane broker registers and a client secret of your choice (leave it empty to generate). The broker reads both from here and configures Authentik with them, so a new value takes effect on its next run."
    wellhead.dev/plain: "key"
    wellhead.dev/generate: "secret"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.secret: "\\S{32,}"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-oidc-secret, creationPolicy: Owner}
  data:
    - secretKey: key
      remoteRef: {key: forgejo/oidc, property: key}
    - secretKey: secret
      remoteRef: {key: forgejo/oidc, property: secret}
