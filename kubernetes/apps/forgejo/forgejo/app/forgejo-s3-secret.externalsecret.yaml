---
# forgejo-s3-secret now sourced from OpenBao. Replaces forgejo-s3-secret.sops.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-s3-secret
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "An access key of the off-site Garage at s3-offsite.webgrip.dev with read and write on Forgejo's bucket, made by a person with garage key create on garage-fsn1."
    wellhead.dev/plain: "MINIO_ACCESS_KEY_ID"
    wellhead.dev/verify.format.MINIO_ACCESS_KEY_ID: "GK[0-9a-f]{24}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-s3-secret, creationPolicy: Owner}
  data:
    - secretKey: MINIO_ACCESS_KEY_ID
      remoteRef: {key: forgejo/s3-offsite, property: MINIO_ACCESS_KEY_ID}
    - secretKey: MINIO_SECRET_ACCESS_KEY
      remoteRef: {key: forgejo/s3-offsite, property: MINIO_SECRET_ACCESS_KEY}
