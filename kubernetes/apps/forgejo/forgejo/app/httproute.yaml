---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    monitoring.webgrip.io/synthetic-check: blackbox-forgejo
spec:
  hostnames:
    - forgejo.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - type: RegularExpression
              name: user-agent
              value: "(?i).*(meta-externalagent|facebookexternalhit).*"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: forgejo-deny-meta-crawlers
    - matches:
        - path:
            type: PathPrefix
            value: /-/ci/api
      backendRefs:
        - name: ci-console-api
          namespace: forgejo
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /-/ci
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /assets/wg/wg-ci.html
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Port
                value: "443"
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: forgejo-http
          namespace: forgejo
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Port
                value: "443"
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: forgejo-http
          namespace: forgejo
          port: 3000
