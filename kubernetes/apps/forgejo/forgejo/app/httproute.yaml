---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    monitoring.webgrip.io/synthetic-check: blackbox-forgejo
spec:
  hostnames:
    - forgejo.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - type: RegularExpression
              name: user-agent
              value: "(?i).*(meta-externalagent|meta-externalfetcher|meta-webindexer|facebookexternalhit|FacebookBot|GPTBot|OAI-SearchBot|OAI-AdsBot|ClaudeBot|Claude-SearchBot|anthropic-ai|Google-Extended|GoogleOther|CCBot|Bytespider|TikTokSpider|Amazonbot|PetalBot|PerplexityBot|Applebot-Extended|cohere-ai|cohere-training-data-crawler|MistralAI-Training|MistralAI-Index|DeepSeekBot|Diffbot|ImagesiftBot|img2dataset|omgili|Timpibot|YouBot|Webzio-Extended|Kangaroo Bot|PanguBot|DuckAssistBot|ICC-Crawler|Crawlspace|SemrushBot|AI2Bot|Ai2Bot-Dolma|DoubaoBot|QwenBot|TongyiBot|ERNIEBot|iaskspider|Brightbot|Awario|Andibot|FriendlyCrawler|LAIONDownloader|laion-huggingface-processor|VelenPublicWebCrawler|wpbot|YandexAdditional|Bravebot|GrokBot|xAI-Grok|KimiBot|MoonshotBot|YiBot|YiyanBot|Hunyuan|ChatGLM-Spider|Scrapy|Crawl4AI|FirecrawlAgent|ApifyBot|ApifyWebsiteContentCrawler|TavilyBot|ExaBot|LinkupBot|Factset_spyderbot|Sidetrade indexer bot|Panscient|MyCentralAIScraperBot).*"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: forgejo-deny-meta-crawlers
    - matches:
        - path:
            type: PathPrefix
            value: /-/ci/api
      backendRefs:
        - name: ci-console-api
          namespace: forgejo
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /-/ci
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /assets/wg/wg-ci.html
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Port
                value: "443"
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: forgejo-http
          namespace: forgejo
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Port
                value: "443"
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: forgejo-http
          namespace: forgejo
          port: 3000
