---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin-secret
  namespace: forgejo
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "Forgejo's admin login, set at install and copied to OpenBao by the PushSecret forgejo-admin-secret. Forgejo keeps the password in its database: restore the value from OpenBao's history rather than typing a new one."
    wellhead.dev/plain: "username email"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "format"
    wellhead.dev/verify.format.password: "\\S{12,}"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: forgejo-admin-secret, creationPolicy: Owner}
  data:
    - {secretKey: username, remoteRef: {key: forgejo/admin, property: username}}
    - {secretKey: password, remoteRef: {key: forgejo/admin, property: password}}
    - {secretKey: email, remoteRef: {key: forgejo/admin, property: email}}
