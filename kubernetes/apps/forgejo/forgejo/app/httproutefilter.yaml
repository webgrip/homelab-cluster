---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: forgejo-deny-meta-crawlers
  namespace: forgejo
spec:
  directResponse:
    statusCode: 403
    body:
      type: Inline
      inline: "Meta's crawlers are refused on this forge; see docs/techdocs/docs/incidents/2026-10-23-forgejo-disk-full-meta-crawler-bundles.md"
