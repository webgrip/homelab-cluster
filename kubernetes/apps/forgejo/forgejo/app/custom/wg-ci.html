<!doctype html>
<html lang="en" data-theme="forgejo-auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>CI · Forgejo</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="/assets/css/index.css">
<link rel="stylesheet" id="wg-ci-theme" href="/assets/css/theme-forgejo-auto.css">
<link rel="stylesheet" href="/assets/wg/wg-ci.css">
<script>
(function () {
  try {
    var theme = JSON.parse(localStorage.getItem('wg-ci-theme') || 'null');
    if (theme && /^[a-z0-9-]+$/.test(theme)) {
      document.getElementById('wg-ci-theme').setAttribute('href', '/assets/css/theme-' + theme + '.css');
      document.documentElement.setAttribute('data-theme', theme);
    }
  } catch (e) { }
})();
</script>
<script defer src="/assets/wg/wg-ci.js"></script>
</head>
<body>
<div id="wg-ci" class="wg-ci"><noscript>The CI console needs JavaScript.</noscript></div>
</body>
</html>
