---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/apps/v1/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-cache-server
  labels:
    app.kubernetes.io/name: forgejo-cache-server
    # Required, not decorative: the forgejo-allow-ingress / forgejo-allow-egress
    # CiliumNetworkPolicies select on this label, so without it the runner pods cannot
    # reach this Service at all.
    app.kubernetes.io/part-of: forgejo
spec:
  replicas: 1
  strategy:
    # Recreate, never RollingUpdate: the cache index is bolthold/bbolt, which mmaps and
    # file-locks its database. Two replicas — even briefly during a rollout — either block
    # or corrupt. This is also why the PVC is RWO and replicas is pinned at 1.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-cache-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-cache-server
        app.kubernetes.io/part-of: forgejo
    spec:
      # Pin to the Longhorn storage nodes (ADR-0008 direction: storage-backed
      # workloads live where the replicas live). History (2026-08-12): the
      # scheduler's free choice put this pod on fringe (engines broken there
      # under Talos v1.13.8 — see talenv.yaml), then on soyo-2/soyo-1 where its
      # engine repeatedly blocked control-plane drains via the instance-manager
      # PDB. On the workers its engine, replicas and data locality all coincide
      # and node maintenance stops chasing it around.
      # Hostname pin, not the storage.webgrip.io/longhorn label: fringe carries
      # that label too (future cold tier) but must not host this engine.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "worker-1"
                      - "worker-2"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cache-server
          # Same pinned runner image the ScaledJob injects its binary from. The cache
          # server is a subcommand of that binary, so it is v1-protocol and MAC-protocol
          # correct by construction — third-party cache servers implementing GitHub's v2
          # twirp API do NOT work with this runner (it speaks only /_apis/artifactcache).
          image: harbor.webgrip.dev/forgejo/forgejo/runner:12.13.2@sha256:eb6e7bc21973382d261e6eb883dbd27b8cb56939d33a3bfd79a1352b7f9a33a0
          command:
            - forgejo-runner
          # -c, not flags: the only secret flag is `--secret`, which takes the literal
          # value and would publish the shared HMAC secret in the process list. The
          # secret itself is minted once by forgejo-runner-provisioner and shared with
          # every runner — a mismatch is a silent 403 on every cache call, because an
          # empty secret makes each runner process generate its own.
          args:
            - cache-server
            - -c
            - /config/config.yaml
          ports:
            - {name: http, containerPort: 8088}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: runner-secret, mountPath: /run/forgejo-runner, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-cache-server-data
        - name: config
          configMap:
            name: forgejo-cache-server-config
        - name: runner-secret
          secret:
            secretName: forgejo-runner-secret
            items:
              - {key: cache-secret, path: cache-secret}
