---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unfold-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unfold
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: unfold-workspaces
      ports:
        - protocol: TCP
          port: 4080
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unfold-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unfold
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unfold-insight-export
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unfold
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: alloy-gateway
      ports:
        - protocol: TCP
          port: 12347
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unfold-run-logs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unfold
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vlsingle
              app.kubernetes.io/instance: victorialogs
      ports:
        - protocol: TCP
          port: 9428
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unfold-session-telemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unfold
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmsingle
              app.kubernetes.io/instance: vmsingle
      ports:
        - protocol: TCP
          port: 8429
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unfold-audit-openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unfold
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unfold-audit-checkpoint-bucket
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unfold
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: s3.gra.io.cloud.ovh.net
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
