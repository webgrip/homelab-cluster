---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-clickup-oauth
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "Unfold's ClickUp OAuth app (ClickUp, Settings, Integrations, ClickUp API, Create an App), seeded with just secret-set clickup/unfold-oauth client_id and client_secret."
    wellhead.dev/plain: "client_id"
    wellhead.dev/verify.format.client_secret: "\\S{20,}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-clickup-oauth
    creationPolicy: Owner
  data:
    - {secretKey: client-id, remoteRef: {key: clickup/unfold-oauth, property: client_id}}
    - {secretKey: client-secret, remoteRef: {key: clickup/unfold-oauth, property: client_secret}}
