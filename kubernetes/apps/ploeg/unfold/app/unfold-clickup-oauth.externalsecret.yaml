---
# ClickUp OAuth app "Unfold" (WebGrip workspace): lets each person link their ClickUp account.
# Seeded by a person with `just secret-set clickup/unfold-oauth client_id` and `... client_secret`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-clickup-oauth
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-clickup-oauth
    creationPolicy: Owner
  data:
    - {secretKey: client-id, remoteRef: {key: clickup/unfold-oauth, property: client_id}}
    - {secretKey: client-secret, remoteRef: {key: clickup/unfold-oauth, property: client_secret}}
