---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-publisher
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-publisher
    creationPolicy: Owner
  data:
    - {secretKey: token, remoteRef: {key: ploeg/unfold-publisher, property: token}}
