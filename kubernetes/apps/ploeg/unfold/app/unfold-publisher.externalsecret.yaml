---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-publisher
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Forgejo access token of the user unfold-publisher (write on twente.dev only), made in Forgejo as that user (Settings, Applications)."
    wellhead.dev/verify.http.url: "https://forgejo.webgrip.dev/api/v1/user"
    wellhead.dev/verify.http.auth: "bearer:token"
    wellhead.dev/verify: "http"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-publisher
    creationPolicy: Owner
  data:
    - {secretKey: token, remoteRef: {key: ploeg/unfold-publisher, property: token}}
