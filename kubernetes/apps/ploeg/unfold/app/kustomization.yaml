---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/placement/worker-pool
  - ../../../../components/gateway-egress
resources:
  - ocirepository.yaml
  - cosign-pubkey.rbac.yaml
  - helmrelease.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - unfold-reports-token.externalsecret.yaml
  - unfold-publisher.externalsecret.yaml
  - unfold-decider.externalsecret.yaml
  - ploeg-mcp-confirmation-key.externalsecret.yaml
  - ploeg-mcp-confirmation-client.externalsecret.yaml
  - ploeg-mcp-exchange-client.externalsecret.yaml
  - unfold-exchange-client.externalsecret.yaml
  - unfold-clickup-oauth.externalsecret.yaml
  - unfold-audit-checkpoints.externalsecret.yaml
  - vmrule-audit-checkpoints.yaml
  - former-host.httproute.yaml
patches:
  - target:
      kind: NetworkPolicy
      name: allow-gateway-egress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-gateway-egress
      spec:
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - unfold
                - ploeg
  - target:
      kind: HelmRelease
      name: unfold
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: unfold
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: unfold
            spec:
              template:
                spec:
                  containers:
                    - name: workbench
                      env:
                        - name: UNFOLD_TASK_VIKUNJA_TOKEN
                          valueFrom:
                            secretKeyRef:
                              name: agent-vikunja-token
                              key: VIKUNJA_API_TOKEN
  # Restart Unfold when the cluster re-mints the Report a problem token (unfold-reports-provisioner in
  # forgejo). Targeted, not reloader auto: Unfold holds at-rest keys that must never trigger a restart.
  # Appended to the worker-pool component's postRenderers, since a postRenderers list in the
  # HelmRelease itself is replaced by that component.
  - target:
      kind: HelmRelease
      name: unfold
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: unfold
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: unfold
              annotations:
                secret.reloader.stakater.com/reload: unfold-reports-token,unfold-audit-checkpoints
  - target:
      kind: HelmRelease
      name: unfold
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: ploeg
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ploeg
            spec:
              template:
                spec:
                  containers:
                    - name: ploegd
                      env:
                        - name: PLOEG_FORGEJO_URL
                          value: https://forgejo.${SECRET_DOMAIN}
                        - name: PLOEG_CLAUDE_ENVIRONMENTS
                          value: "true"
  # Keep Unfold's Longhorn engine next to its replicas and off fringe-workstation: fringe's single SATA SSD is
  # I/O-saturated, kubelet keeps killing its Longhorn CSI plugin and instance-manager, and every engine death turned
  # unfold-data read-only (EIO/EROFS, "database disk image is malformed", pod churn). Same pin as
  # forgejo-cache-server; worker-2 preferred because worker-1 runs near full CPU. A post-render patch, appended after
  # the worker-pool component's, because that component replaces the Deployment's whole affinity and would undo a
  # chart value.
  - target:
      kind: HelmRelease
      name: unfold
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: unfold
          patch: |-
            - op: replace
              path: /spec/template/spec/affinity
              value:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: In
                            values: ["worker-1", "worker-2"]
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      preference:
                        matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: In
                            values: ["worker-2"]
