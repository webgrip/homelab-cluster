---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/placement/worker-pool
  - ../../../../components/gateway-egress
resources:
  - ocirepository.yaml
  - cosign-pubkey.rbac.yaml
  - helmrelease.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - unfold-reports-token.externalsecret.yaml
  - unfold-publisher.externalsecret.yaml
  - unfold-decider.externalsecret.yaml
  - ploeg-mcp-confirmation-key.externalsecret.yaml
  - ploeg-mcp-confirmation-client.externalsecret.yaml
  - former-host.httproute.yaml
patches:
  - target:
      kind: NetworkPolicy
      name: allow-gateway-egress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-gateway-egress
      spec:
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - unfold
                - ploeg
  - target:
      kind: HelmRelease
      name: unfold
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: unfold
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: unfold
            spec:
              template:
                spec:
                  containers:
                    - name: workbench
                      env:
                        - name: UNFOLD_TASK_VIKUNJA_TOKEN
                          valueFrom:
                            secretKeyRef:
                              name: agent-vikunja-token
                              key: VIKUNJA_API_TOKEN
  # Restart Unfold when the cluster re-mints the Report a problem token (unfold-reports-provisioner in
  # forgejo). Targeted, not reloader auto: Unfold holds at-rest keys that must never trigger a restart.
  # Appended to the worker-pool component's postRenderers, since a postRenderers list in the
  # HelmRelease itself is replaced by that component.
  - target:
      kind: HelmRelease
      name: unfold
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: unfold
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: unfold
              annotations:
                secret.reloader.stakater.com/reload: unfold-reports-token
  - target:
      kind: HelmRelease
      name: unfold
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: ploeg
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ploeg
            spec:
              template:
                spec:
                  containers:
                    - name: ploegd
                      env:
                        - name: PLOEG_FORGEJO_URL
                          value: https://forgejo.${SECRET_DOMAIN}
                        - name: PLOEG_CLAUDE_ENVIRONMENTS
                          value: "true"
