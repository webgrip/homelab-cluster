---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-exchange-client
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-exchange-client
    creationPolicy: Owner
  data:
    - {secretKey: client-secret, remoteRef: {key: authentik/unfold-exchange-oidc, property: client_secret}}
