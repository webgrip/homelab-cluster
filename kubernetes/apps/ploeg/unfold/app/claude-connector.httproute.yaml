---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unfold-mcp-through-tunnel
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  hostnames:
    - unfold.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
          headers:
            - type: RegularExpression
              name: cf-connecting-ip
              value: ".+"
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource
          headers:
            - type: RegularExpression
              name: cf-connecting-ip
              value: ".+"
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
          headers:
            - type: RegularExpression
              name: cf-connecting-ip
              value: ".+"
      backendRefs:
        - name: unfold
          port: 4080
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: unfold-mcp-through-tunnel
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: unfold-mcp-through-tunnel
  authorization:
    defaultAction: Deny
    rules:
      - name: anthropic-outbound
        action: Allow
        principal:
          clientCIDRs:
            - 160.79.104.0/21
