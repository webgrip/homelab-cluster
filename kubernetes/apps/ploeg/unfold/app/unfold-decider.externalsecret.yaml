---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-decider
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-decider
    creationPolicy: Owner
  data:
    - {secretKey: key, remoteRef: {key: litellm/keys/unfold-decider, property: key}}
