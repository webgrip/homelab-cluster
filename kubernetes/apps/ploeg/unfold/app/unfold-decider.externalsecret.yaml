---
# Minted by Job/litellm-key-register-unfold-decider (namespace ai) and pushed to OpenBao.
# Unfold's shadow tripwire (Unfold ADR-0042) reads it once the chart's decider values point here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-decider
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-decider
    creationPolicy: Owner
  data:
    - {secretKey: key, remoteRef: {key: litellm/keys/unfold-decider, property: key}}
