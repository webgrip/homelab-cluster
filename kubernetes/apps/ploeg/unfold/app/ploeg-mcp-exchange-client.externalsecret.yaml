---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-mcp-exchange-client
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: ploeg-mcp-exchange-client
    creationPolicy: Owner
  data:
    - {secretKey: client-secret, remoteRef: {key: authentik/ploeg-mcp-exchange-oidc, property: client_secret}}
