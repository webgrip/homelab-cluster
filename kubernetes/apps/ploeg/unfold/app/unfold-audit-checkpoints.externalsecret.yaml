---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-audit-checkpoints
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "OVH Object Storage credentials for Unfold's audit checkpoint bucket: OVHcloud Control Panel, Public Cloud, Object Storage, S3 users, with the bucket's endpoint, name and region."
    wellhead.dev/plain: "S3_ENDPOINT S3_BUCKET S3_REGION S3_ACCESS_KEY_ID"
    wellhead.dev/verify.format.S3_ENDPOINT: "https://\\S+"
    wellhead.dev/verify.format.S3_SECRET_ACCESS_KEY: "\\S{20,}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-audit-checkpoints
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        UNFOLD_AUDIT_CHECKPOINT_URL: "{{ .endpoint }}/{{ .bucket }}"
        UNFOLD_AUDIT_CHECKPOINT_REGION: "{{ .region }}"
        UNFOLD_AUDIT_CHECKPOINT_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        UNFOLD_AUDIT_CHECKPOINT_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - {secretKey: endpoint, remoteRef: {key: s3/ovh-unfold-audit, property: S3_ENDPOINT}}
    - {secretKey: bucket, remoteRef: {key: s3/ovh-unfold-audit, property: S3_BUCKET}}
    - {secretKey: region, remoteRef: {key: s3/ovh-unfold-audit, property: S3_REGION}}
    - {secretKey: accessKeyId, remoteRef: {key: s3/ovh-unfold-audit, property: S3_ACCESS_KEY_ID}}
    - {secretKey: secretAccessKey, remoteRef: {key: s3/ovh-unfold-audit, property: S3_SECRET_ACCESS_KEY}}
