---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unfold
spec:
  chartRef:
    kind: OCIRepository
    name: unfold
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    mode: live
    ploeg:
      enabled: true
      supportProfile: unsupported
      fullnameOverride: ploeg
      instanceOverride: ploeg
      imagePullSecrets:
        - name: harbor-pull
      image:
        repository: harbor.webgrip.dev/ghcr/ploeg-hq/ploegd
      worker:
        image:
          repository: harbor.webgrip.dev/ghcr/ploeg-hq/ploeg-worker
      nodeSelector:
        node.webgrip.io/pool: worker
      database:
        existingSecret:
          name: ploeg-db-app
      knowledgeGraph:
        url: http://omnigraph-next.ai.svc.cluster.local:8080
        notesGraph: webgrip-notes
        conceptsGraph: webgrip-knowledge
        runTokenSecret:
          name: ploeg-omnigraph-run
          key: token
        reviewTokenSecret:
          name: ploeg-omnigraph-review
          key: token
      webhook:
        existingSecret:
          name: ploeg-webhook-secret
          key: PLOEG_VIKUNJA_SECRET
      monitoring:
        serviceMonitor:
          enabled: true
        prometheusRule:
          enabled: true
      operator:
        consumers:
          - name: unfold
            teams:
              - unfold
              - bronze
              - silver
              - copper
              - pewter
            execute: true
            maxBudgetUsd: 1.00
            audiences:
              - ploeg-for-unfold
            tokenSecret:
              name: unfold-operator
              key: PLOEG_OPERATOR_UNFOLD_TOKEN
          - name: mcp-reader
            teams:
              - unfold
              - bronze
              - silver
              - copper
              - pewter
            execute: false
            tokenSecret:
              name: ploeg-mcp-reader
              key: token
          - name: mcp-operator
            teams:
              - unfold
              - bronze
              - silver
              - copper
              - pewter
            execute: true
            maxBudgetUsd: 1.00
            audiences:
              - ploeg-for-ploeg-mcp
            tokenSecret:
              name: ploeg-mcp-operator
              key: token
          - name: unfold-verifier
            teams:
              - unfold
            execute: false
            verify: true
            tokenSecret:
              name: unfold-verifier
              key: token
        personTokens:
          issuer: https://authentik.${SECRET_DOMAIN}/
          jwksUrl: https://authentik.${SECRET_DOMAIN}/application/o/ploeg-for-unfold/jwks/
          maxLifetime: 5m
          subjectNamespace: https://authentik.${SECRET_DOMAIN}/application/o/vloer/
        deliveryPolicies:
          - repositoryId: twente-dev
            policySha256: 879fc94d7927c4917f94740afc9ba8f3d60211ab04ff8df4a74f088dd86611e4
            verifierId: unfold-kubernetes-v1
            minTests: 3
            publicationEnabled: true
      config:
        targets:
          unfold:
            repo: webgrip/unfold
            branch: development
            forge: forgejo
          homelab-cluster:
            repo: webgrip/homelab-cluster
            branch: main
            forge: forgejo
          twente.dev:
            repo: webgrip/twente.dev
            branch: main
            forge: forgejo
          erfbeeld:
            repo: webgrip/erfbeeld
            branch: main
            forge: forgejo
          nuala-nalatenschap:
            repo: webgrip/erfbeeld
            branch: main
            forge: forgejo
        trackers:
          vikunja:
            projects:
              - name: "Ploeg Test"
                id: "11"
                team: unfold
                repo: webgrip/unfold
                branch: development
                forge: forgejo
              - name: "Unfold"
                id: "10"
                default: unfold
                allow:
                  - homelab-cluster
              - name: "Erfbeeld"
                repo: webgrip/erfbeeld
                branch: main
                forge: forgejo
              - name: "Homelab Roadmap"
                repo: webgrip/homelab-cluster
                branch: main
                forge: forgejo
              - name: "CI/CD"
                repo: webgrip/homelab-cluster
                branch: main
                forge: forgejo
              - name: "twente.dev"
                repo: webgrip/twente.dev
                branch: main
                forge: forgejo
              - name: "Omnigraph Explorer"
                repo: webgrip/omnigraph-explorer
                branch: main
                forge: forgejo
              - name: "Ploeg Bench"
                id: "49"
                repo: webgrip/ploeg-bench-world
                branch: bench/pb01-base
                forge: forgejo
        teams:
          bronze:
            assignees:
              - bronze
            forgeFollowUps:
              reworkOnChangesRequested: true
              repairFailedChecks: true
              maxRepairs: 2
              reworkReviewers:
                - ryangr0
            premiseCheck:
              model: hetzner-qwen3-8-27b
          silver:
            assignees:
              - silver
            forgeFollowUps:
              reworkOnChangesRequested: true
              repairFailedChecks: true
              maxRepairs: 2
              reworkReviewers:
                - ryangr0
          copper:
            assignees: []
          pewter:
            assignees:
              - copper
          unfold:
            assignees: []
      tracker:
        url: https://vikunja.${SECRET_DOMAIN}/api/v1
        tokenSecret:
          name: ploeg-vikunja-bot
          key: VIKUNJA_API_TOKEN
      env:
        PLOEG_DEFAULT_TEAM: copper
        PLOEG_LEASE_TTL: 15m
      executor:
        enabled: true
        nodeSelector:
          node.webgrip.io/pool: worker
        dindImage: harbor.webgrip.dev/dockerhub/library/docker:29.8.2-dind@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced
        forge: forgejo
        forgeTokenIsolation: proxy
        litellm:
          baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
          adminUrl: http://litellm.ai.svc.cluster.local:4000
          keyIsolation: proxy
        forgejo:
          url: http://forgejo-http.forgejo.svc.cluster.local:3000
          readTokenSecret:
            name: agent-reviewer-token
            key: FORGEJO_TOKEN
          botPasswordSecret:
            name: agent-builder-password
            key: FORGEJO_BOT_PASSWORD
          webhookSecret:
            name: ploeg-forge-webhook
            key: PLOEG_FORGEJO_SECRET
        workerAuth:
          mode: managed
          signingKeySecret:
            name: ploeg-worker-signing
            key: key
          bootstrapSecret:
            name: ploeg-worker-bootstrap
            registryKey: registry.json
          additionalLLMPolicies:
            - team: unfold
              role: operator
              budgetUsd: 0.25
              models:
                - fireworks-deepseek-v4p1-flash
              ttl: 10m
            - team: unfold
              role: ask
              budgetUsd: 0.02
              models:
                - fireworks-glm-5p3-flash
              ttl: 2m
            - team: bronze
              role: ask
              budgetUsd: 0.02
              models:
                - fireworks-glm-5p3-flash
                - hetzner-qwen3-8-27b
                - hetzner-qwen3-6-35b-a3b
              ttl: 2m
            - team: silver
              role: ask
              budgetUsd: 0.02
              models:
                - fireworks-glm-5p3-flash
              ttl: 2m
            - team: copper
              role: ask
              budgetUsd: 0.02
              models:
                - fireworks-glm-5p3-flash
              ttl: 2m
        harness:
          name: openhands
          dind: false
          telemetry:
            endpoint: http://alloy-gateway.observability.svc.cluster.local:4318
            protocol: http/protobuf
            signals:
              - metrics
              - logs
              - traces
            resourceAttributes:
              service.namespace: ploeg
              deployment.environment: homelab
            logToolDetails: true
          idleTimeout: 45m
          toolchains:
            - name: go
              image: harbor.webgrip.dev/dockerhub/library/golang:1.25.0-alpine@sha256:f18a072054848d87a8077455f0ac8a25886f2397f88bfdd222d6fafbb5bba440
              path:
                - /usr/local/go/bin
              env: {GOTOOLCHAIN: local}
          verify:
            - 'if [ -f apps/unfold/scripts/unified-demo/go.mod ]; then test -z "$(gofmt -l apps/unfold/scripts/unified-demo)"; fi'
        runnerImage: harbor.webgrip.dev/webgrip/agent-runner:1.4.1@sha256:3649001200acbc7708f628403183ce1af93f90a2de339e55dfc70abb2f51f57b
        workerResources:
          requests: {cpu: 100m, memory: 768Mi}
          limits: {cpu: "1", memory: 768Mi}
        scaler:
          host: ploeg-db-rw.ploeg.svc.cluster.local
        pollingInterval: 5
        teams:
          - name: bronze
            model: litellm_proxy/fireworks-deepseek-v4p1-flash
            budget: "9.20"
            repoOwner: webgrip
            repoName: erfbeeld
            baseBranch: main
            maxReplicaCount: 1
            maxFixRounds: 2
            litellmTeamId: ploeg-crews
            executorType: sandbox
            sandbox:
              runtimeClassName: kata
            harness:
              name: acp
              dind: false
              acp:
                profile: openhands
                idleTimeout: 10m
                promptTimeout: 90m
            plan:
              - roles:
                  - {name: builder, writes: true, cap: "2.00"}
              - roles:
                  - name: reviewer
                    writes: false
                    cap: "0.40"
                    model: litellm_proxy/fireworks-glm-5p3-flash
                    harness: {name: acp, dind: false, acp: {profile: openhands, idleTimeout: 10m, promptTimeout: 90m}}
                    workerResources:
                      requests: {cpu: 100m, memory: 768Mi}
                      limits: {cpu: 500m, memory: 768Mi}
                  - name: shadow-reviewer
                    writes: false
                    shadow: true
                    cap: "0.40"
                    model: litellm_proxy/claude-haiku-5-5
                    harness: {name: acp, dind: false, acp: {profile: openhands, idleTimeout: 10m, promptTimeout: 90m}}
                    workerResources:
                      requests: {cpu: 100m, memory: 768Mi}
                      limits: {cpu: 500m, memory: 768Mi}
          - name: silver
            model: litellm_proxy/fireworks-deepseek-v4p1-flash
            budget: "6"
            repoOwner: webgrip
            repoName: unfold
            baseBranch: development
            maxReplicaCount: 1
            maxFixRounds: 1
            plan:
              - roles:
                  - name: builder
                    writes: true
                    cap: "2.50"
                    harness: {name: acp, dind: false, acp: {profile: opencode, idleTimeout: 10m, promptTimeout: 90m}}
              - roles:
                  - name: reviewer
                    writes: false
                    cap: "0.40"
                    model: litellm_proxy/fireworks-glm-5p3-flash
                    harness: {name: acp, dind: false, acp: {profile: opencode, idleTimeout: 10m, promptTimeout: 90m}}
                    workerResources:
                      requests: {cpu: 100m, memory: 768Mi}
                      limits: {cpu: 500m, memory: 768Mi}
          - name: copper
            model: litellm_proxy/fireworks-deepseek-v4p1-flash
            budget: "1"
            repoOwner: webgrip
            repoName: erfbeeld
            baseBranch: main
            maxReplicaCount: 1
            executorType: sandbox
            sandbox:
              runtimeClassName: kata
            harness:
              name: exec
              args:
                - "/bin/sh"
                - "-c"
                - |
                  set -eu
                  spec="$$1"
                  if ! grep -q '"title": "\[canary\]' "$$spec"; then
                    printf '{"outcome":"stuck","summary":"copper only runs canary items","stuckReason":"copper only runs canary items"}\n' > "$$(dirname "$$spec")/outcome.json"
                    exit 0
                  fi
                  briefed=0
                  if [ -n "$${PLOEG_KNOWLEDGE_DIR:-}" ]; then
                    briefed=$$(grep -rl ploeg-canary-note "$$PLOEG_KNOWLEDGE_DIR" | wc -l)
                  fi
                  printf '{"type":"Fact","title":"ploeg-canary-note","description":"Written while a canary Run worked","tags":["ploeg-canary"],"body":"ploeg-canary-note briefed=%s"}\n' "$$briefed" >> "$${PLOEG_NOTES_FILE:?no notes file: live notes are off}"
                  sleep 15
                  printf '{"outcome":"stuck","summary":"ploeg-canary stopped on purpose","stuckReason":"ploeg-canary stops every Run so the stop note is written"}\n' > "$$(dirname "$$spec")/outcome.json"
                - "ploeg-canary"
                - "{taskspec}"
              dind: false
          - name: pewter
            model: litellm_proxy/fireworks-deepseek-v4p1-flash
            budget: "0.10"
            repoOwner: webgrip
            repoName: erfbeeld
            baseBranch: main
            maxReplicaCount: 1
            harness:
              name: claude-environment
              dind: false
              timeout: 100m
              claudeEnvironment:
                environmentId: ccpool_017SvGpGv1jLfduyvyWMRh3F
                loginVolume: pewter-claude-login
      mcp:
        enabled: true
        name: ploeg-mcp
        ploegUrl: http://ploeg.ploeg.svc.cluster.local:8080
        annotations:
          reloader.stakater.com/auto: "true"
        env:
          PLOEG_MCP_RESOURCE: https://mcp-ploeg.${SECRET_DOMAIN}/mcp
          PLOEG_MCP_ISSUER: https://authentik.${SECRET_DOMAIN}/application/o/ploeg-mcp/
          PLOEG_MCP_CLIENT_IDS: ploeg-mcp
          PLOEG_MCP_TOKEN_AUDIENCE: client-id
          PLOEG_MCP_SCOPE: ploeg:read
          PLOEG_MCP_REQUEST_SCOPES: openid ploeg:read offline_access
          PLOEG_MCP_GROUPS: '[{"group":"ploeg-operators","tokenEnv":"PLOEG_MCP_TOKEN_OPERATORS","execute":true},{"group":"ploeg-readers","tokenEnv":"PLOEG_MCP_TOKEN_READERS"}]'
          PLOEG_MCP_SUBJECT_NAMESPACE: https://authentik.${SECRET_DOMAIN}/application/o/vloer/
          PLOEG_MCP_CONFIRMATION_MODE: login
          PLOEG_MCP_CONFIRMATION_ISSUER: https://authentik.${SECRET_DOMAIN}/application/o/ploeg-mcp-confirm/
          PLOEG_MCP_CONFIRMATION_CLIENT_ID: ploeg-mcp-confirm
          PLOEG_MCP_EXCHANGE_TOKEN_URL: https://authentik.${SECRET_DOMAIN}/application/o/token/
          PLOEG_MCP_EXCHANGE_CLIENT_ID: ploeg-mcp-exchange
          PLOEG_MCP_EXCHANGE_AUDIENCE: ploeg-for-ploeg-mcp
        confirmationClientSecret:
          name: ploeg-mcp-confirmation-client
        extraEnv:
          - name: PLOEG_MCP_TOKEN_OPERATORS
            valueFrom:
              secretKeyRef:
                name: ploeg-mcp-operator
                key: token
          - name: PLOEG_MCP_CONFIRMATION_KEY
            valueFrom:
              secretKeyRef:
                name: ploeg-mcp-confirmation-key
                key: key
          - name: PLOEG_MCP_EXCHANGE_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: ploeg-mcp-exchange-client
                key: client-secret
        envFrom:
          - secretRef:
              name: ploeg-mcp-consumers
      claudeRunner:
        enabled: true
        name: claude-runner
        image:
          repository: harbor.webgrip.dev/ghcr/ploeg-hq/claude-runner
        environmentSecret:
          name: claude-runner-environment
        ploegUrl: http://ploeg.ploeg.svc.cluster.local:8080
        runtimeClassName: kata
        extraArgs:
          - --git-host-rewrite
          - forgejo-http.forgejo.svc.cluster.local:3000=forgejo.${SECRET_DOMAIN}
        env:
          DISABLE_ERROR_REPORTING: "1"
          CLAUDE_CODE_ENABLE_TELEMETRY: "1"
          OTEL_METRICS_EXPORTER: otlp
          OTEL_LOGS_EXPORTER: otlp
          OTEL_TRACES_EXPORTER: otlp
          CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy-gateway.observability.svc.cluster.local:4318
          OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
          OTEL_LOG_TOOL_DETAILS: "1"
          OTEL_RESOURCE_ATTRIBUTES: service.namespace=ai,deployment.environment=homelab,client=claude-runner,ploeg.team=pewter
        loginVolumes:
          - name: pewter-claude-login
            size: 1Gi
            storageClassName: longhorn-general
    baseUrl: https://unfold.${SECRET_DOMAIN}
    image:
      repository: harbor.webgrip.dev/webgrip/unfold
      tag: 0.4.0-rc.125
      digest: sha256:a4f82032f144b3d2e5331ce3cdaf6f796a413917e167fd5a652f6e0848098f54
    imagePullSecrets:
      - name: harbor-pull
    tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 45
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 45
    # Keep Unfold's Longhorn engine next to its replicas and off fringe-workstation: fringe's single SATA SSD is
    # I/O-saturated, kubelet keeps killing its Longhorn CSI plugin and instance-manager, and every engine death
    # turned unfold-data read-only (EIO/EROFS, "database disk image is malformed", pod churn). Same pin as
    # forgejo-cache-server; worker-2 preferred because worker-1 runs near full CPU.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - worker-1
                    - worker-2
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - worker-2
    credentialsSecret: unfold-operator
    # Unfold ADR 0042: server errors and failed Asks go to Alloy as OTLP log
    # records (exception.* attributes, event.name=unfold.error), and from there
    # to VictoriaLogs. A dedicated tracker (GlitchTip) can be added later with
    # errorReports.sentry.existingSecret.
    errorReports:
      otlpUrl: http://alloy-gateway.observability.svc.cluster.local:4318/v1/logs
      environment: homelab
    ploegMcp:
      url: https://mcp-ploeg.${SECRET_DOMAIN}/mcp
      clientId: ploeg-mcp
    extraEnv:
      - name: UNFOLD_MCP_RESOURCE
        value: https://unfold.${SECRET_DOMAIN}/mcp
      - name: UNFOLD_MCP_ISSUER
        value: https://authentik.${SECRET_DOMAIN}/application/o/unfold-mcp/
      - name: UNFOLD_MCP_CLIENT_IDS
        value: unfold-mcp
      - name: UNFOLD_MCP_TOKEN_AUDIENCE
        value: client-id
      - name: UNFOLD_MCP_SCOPE
        value: unfold:mcp
      - name: UNFOLD_MCP_REQUEST_SCOPES
        value: openid unfold:mcp offline_access
      - name: UNFOLD_INSIGHT_EXPORT
        value: faro
      - name: UNFOLD_INSIGHT_EXPORT_URL
        value: http://alloy-gateway.observability.svc.cluster.local:12347/collect
      - name: UNFOLD_INSIGHT_EXPORT_LEVEL
        value: events
      - name: UNFOLD_REPORTS_FORGEJO_TOKEN
        valueFrom:
          secretKeyRef:
            name: unfold-reports-token
            key: UNFOLD_REPORTS_FORGEJO_TOKEN
      - name: UNFOLD_VERIFIER_TOKEN
        valueFrom:
          secretKeyRef:
            name: unfold-verifier
            key: token
      - name: UNFOLD_EXCHANGE_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: unfold-exchange-client
            key: client-secret
      - name: UNFOLD_CLICKUP_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: unfold-clickup-oauth
            key: client-id
      - name: UNFOLD_CLICKUP_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: unfold-clickup-oauth
            key: client-secret
      - name: UNFOLD_AUDIT_OPENBAO_ADDR
        value: http://openbao.security.svc.cluster.local:8200
      - name: UNFOLD_AUDIT_OPENBAO_ROLE
        value: unfold-audit
      - name: UNFOLD_AUDIT_CHECKPOINT_URL
        valueFrom:
          secretKeyRef:
            name: unfold-audit-checkpoints
            key: UNFOLD_AUDIT_CHECKPOINT_URL
            optional: true
      - name: UNFOLD_AUDIT_CHECKPOINT_REGION
        valueFrom:
          secretKeyRef:
            name: unfold-audit-checkpoints
            key: UNFOLD_AUDIT_CHECKPOINT_REGION
            optional: true
      - name: UNFOLD_AUDIT_CHECKPOINT_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: unfold-audit-checkpoints
            key: UNFOLD_AUDIT_CHECKPOINT_ACCESS_KEY_ID
            optional: true
      - name: UNFOLD_AUDIT_CHECKPOINT_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: unfold-audit-checkpoints
            key: UNFOLD_AUDIT_CHECKPOINT_SECRET_ACCESS_KEY
            optional: true
    # Governed delivery (ADR 0019/0040): a completed twente.dev session is
    # canonicalized against the approved base, its checks run in kata pods in
    # unfold-verifier, and Ploeg records the receipt under the policy whose
    # digest ploeg's deliveryPolicies pins. The inputs image holds the approved
    # base bundle and check.sh; a new base means a new image, policy and digest.
    # Accept on a verified candidate pushes it to its own branch and opens one
    # pull request as the Forgejo user unfold-publisher (write on twente.dev
    # only); its token is the OpenBao entry ploeg/unfold-publisher.
    delivery:
      enabled: true
      verifierTokenEnv: UNFOLD_VERIFIER_TOKEN
      inputs:
        volume:
          image:
            reference: harbor.webgrip.dev/webgrip/unfold-delivery-inputs:twente-5f82744@sha256:b9c1717a9c6039fb548de1aa331cc15b44ac95304a9e38752eafa7bf191243c1
            pullPolicy: IfNotPresent
      policies:
        - repositoryId: twente-dev
          approvedBaseSha: 5f82744c8ee7c51ee670eaadce476142ac9dabea
          approvedBaseBundle: /var/lib/unfold-delivery/twente/base.bundle
          image: harbor.webgrip.dev/dockerhub/library/node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
          directory: /var/lib/unfold-delivery/twente/policy
          files:
            check.sh: 8f3eea62e6fa068e255aa959ae656e4bba16fd5c091f76a3c604cd835daf8fc7
          protectedPaths:
            - src/lib/ics.test.ts
            - src/lib/tokens.test.ts
            - src/lib/mail/sources.test.ts
          checks:
            - id: ics
              argv:
                - /bin/sh
                - /policy/check.sh
                - src/lib/ics.test.ts
              stdout: "ok\n"
              exitCode: 0
            - id: tokens
              argv:
                - /bin/sh
                - /policy/check.sh
                - src/lib/tokens.test.ts
              stdout: "ok\n"
              exitCode: 0
            - id: mail-sources
              argv:
                - /bin/sh
                - /policy/check.sh
                - src/lib/mail/sources.test.ts
              stdout: "ok\n"
              exitCode: 0
          timeoutMs: 60000
      publisher:
        enabled: true
        apiUrl: https://forgejo.${SECRET_DOMAIN}/api/v1
        username: unfold-publisher
        existingSecret: unfold-publisher
        secretKey: token
      verifier:
        namespace: unfold-verifier
        runtimeClassName: kata
        image: harbor.webgrip.dev/dockerhub/library/busybox:1.37.0-musl@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    storage:
      className: longhorn
      size: 4Gi
    workspaceNamespace: unfold-workspaces
    createWorkspaceNamespace: false
    workspaceProvisioner: pod
    workspacePodRuntimeClassName: kata
    workspaceTransport: pull
    workspaceImage: harbor.webgrip.dev/webgrip/unfold-agent:0.4.0-rc.125@sha256:f225ee0789fb64bd0ebcb38127f09e7df95159213ccc9de4bc4e17d0edbe6daa
    workspaceStorageClass: longhorn
    workspaceStorageSize: 8Gi
    # The retention sweep deletes an idle workspace PVC; Kyverno's
    # stateful-delete-protection-enforce refuses PVC deletes without this annotation.
    workspaceVolumeDeleteAnnotations:
      policy.webgrip.io/allow-stateful-delete: "true"
    workspaceCpu: "1"
    workspaceMemory: 2Gi
    workspaceCpuRequest: 500m
    workspaceMemoryRequest: 1Gi
    workspaceImagePullSecrets:
      - harbor-pull
    workspaceAgentSecrets:
      - workspace-deploy-credentials
    workspaceGitRewrites:
      - url: http://forgejo-http.forgejo.svc.cluster.local:3000/
        insteadOf: https://forgejo.${SECRET_DOMAIN}/
    workspaceEgress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ploeg
            podSelector:
              matchLabels:
                app.kubernetes.io/name: unfold
        ports:
          - protocol: TCP
            port: 4080
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ai
            podSelector:
              matchLabels:
                app.kubernetes.io/name: litellm
        ports:
          - protocol: TCP
            port: 4000
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: forgejo
            podSelector:
              matchLabels:
                app.kubernetes.io/name: forgejo
        ports:
          - protocol: TCP
            port: 3000
    # Unfold ADR 0046: the Run health judge, shadow only, on bronze's Runs.
    # Each verdict is a Ploeg Ask on Hetzner's free EU inference (#780); it
    # can raise a running Run's health badge and never acts on the Run.
    featureFlags:
      flags:
        cards.health.judge:
          targeting:
            if:
              - in:
                  - var: team
                  - - bronze
              - "on"
              - null
        # Unfold ADR-0042: the shadow tripwire scores bronze's tool calls; it never acts on a Run.
        runs.tripwire:
          targeting:
            if:
              - in:
                  - var: team
                  - - bronze
              - "on"
              - null
    # Free EU Qwen through Unfold's own key (Job litellm-key-register-unfold-decider, #811).
    decider:
      enabled: true
      baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
      model: hetzner-qwen3-8-27b
      name: Hetzner Qwen
      requestsPerMinute: 8
      existingSecret: unfold-decider
      secretKey: key
    config:
      maxConcurrentSessions: 1
      maxBudgetUsd: 1.00
      # Unfold's per-address rate limits, sign-in throttles and audit source address read the client
      # from X-Forwarded-For only when the peer is a trusted proxy. The envoy-internal data plane runs
      # as pods, so its peer address is in the pod subnet (talos/patches/global/cluster-network.yaml).
      trustedProxies:
        - 10.42.0.0/16
      auth:
        oidc:
          issuer: https://authentik.${SECRET_DOMAIN}/application/o/unfold/
          subjectNamespace: https://authentik.${SECRET_DOMAIN}/application/o/vloer/
          clientId: unfold
          displayName: Homelab login
          scopes:
            - openid
            - email
            - profile
            - groups
            - offline_access
          groupsClaim: groups
          roles:
            admin:
              - unfold-app-admins
            operator: []
            viewer: []
      ploeg:
        url: http://ploeg.ploeg.svc.cluster.local:8080
        tokenEnv: PLOEG_OPERATOR_UNFOLD_TOKEN
        personTokens:
          tokenUrl: https://authentik.${SECRET_DOMAIN}/application/o/token/
          clientId: unfold-exchange
          clientSecretEnv: UNFOLD_EXCHANGE_CLIENT_SECRET
          audience: ploeg-for-unfold
        teams:
          - unfold
          - bronze
          - silver
          - copper
          - pewter
      observability:
        grafanaUrl: https://grafana.${SECRET_DOMAIN}
        dashboards:
          spend: litellm-spend
          reliability: litellm-reliability
          finops: exec-finops
          claude-code-session: claude-code-session-explorer
        tracesDatasource: victoriatraces-tempo
        logsDatasource: victorialogs
        logsUrl: http://vlsingle-victorialogs.observability.svc.cluster.local:9428
        metricsUrl: http://vmsingle-vmsingle.observability.svc.cluster.local:8429
      execution:
        team: unfold
      litellm:
        baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
        ttl: 10m
        settlementDelayMs: 60000
