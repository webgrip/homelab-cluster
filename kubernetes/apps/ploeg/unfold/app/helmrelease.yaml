---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unfold
spec:
  chartRef:
    kind: OCIRepository
    name: unfold
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    mode: live
    baseUrl: https://unfold.${SECRET_DOMAIN}
    image:
      repository: harbor.webgrip.dev/webgrip/unfold
      tag: 0.4.0-rc.71
      digest: sha256:ef63ffd15622b5dc0a869d62e8865951a663b09f398a048cf31885de7134f648
    imagePullSecrets:
      - name: harbor-pull
    credentialsSecret: unfold-operator
    extraEnv:
      - name: UNFOLD_INSIGHT_EXPORT
        value: faro
      - name: UNFOLD_INSIGHT_EXPORT_URL
        value: http://alloy-gateway.observability.svc.cluster.local:12347/collect
      - name: UNFOLD_INSIGHT_EXPORT_LEVEL
        value: events
      - name: UNFOLD_REPORTS_FORGEJO_TOKEN
        valueFrom:
          secretKeyRef:
            name: unfold-reports-token
            key: UNFOLD_REPORTS_FORGEJO_TOKEN
      - name: UNFOLD_VERIFIER_TOKEN
        valueFrom:
          secretKeyRef:
            name: unfold-verifier
            key: token
    # Governed delivery (ADR 0019/0040): a completed twente.dev session is
    # canonicalized against the approved base, its checks run in kata pods in
    # unfold-verifier, and Ploeg records the receipt under the policy whose
    # digest ploeg's deliveryPolicies pins. The inputs image holds the approved
    # base bundle and check.sh; a new base means a new image, policy and digest.
    # Accept on a verified candidate pushes it to its own branch and opens one
    # pull request as the Forgejo user unfold-publisher (write on twente.dev
    # only); its token is the OpenBao entry ploeg/unfold-publisher.
    delivery:
      enabled: true
      verifierTokenEnv: UNFOLD_VERIFIER_TOKEN
      inputs:
        volume:
          image:
            reference: harbor.webgrip.dev/webgrip/unfold-delivery-inputs:twente-bd84462@sha256:fd46a9406e389f33a028481a6e646002869f36d8514bd562f8aa415408263121
            pullPolicy: IfNotPresent
      policies:
        - repositoryId: twente-dev
          approvedBaseSha: bd84462dd82bb3144aa44b20d0108ea541ed9e63
          approvedBaseBundle: /var/lib/unfold-delivery/twente/base.bundle
          image: harbor.webgrip.dev/dockerhub/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          directory: /var/lib/unfold-delivery/twente/policy
          files:
            check.sh: 8f3eea62e6fa068e255aa959ae656e4bba16fd5c091f76a3c604cd835daf8fc7
          protectedPaths:
            - src/lib/ics.test.ts
            - src/lib/tokens.test.ts
            - src/lib/mail/sources.test.ts
          checks:
            - id: ics
              argv:
                - /bin/sh
                - /policy/check.sh
                - src/lib/ics.test.ts
              stdout: "ok\n"
              exitCode: 0
            - id: tokens
              argv:
                - /bin/sh
                - /policy/check.sh
                - src/lib/tokens.test.ts
              stdout: "ok\n"
              exitCode: 0
            - id: mail-sources
              argv:
                - /bin/sh
                - /policy/check.sh
                - src/lib/mail/sources.test.ts
              stdout: "ok\n"
              exitCode: 0
          timeoutMs: 60000
      publisher:
        enabled: true
        apiUrl: https://forgejo.${SECRET_DOMAIN}/api/v1
        username: unfold-publisher
        existingSecret: unfold-publisher
        secretKey: token
      verifier:
        namespace: unfold-verifier
        runtimeClassName: kata
        image: harbor.webgrip.dev/dockerhub/library/busybox:1.37.0-musl@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    storage:
      className: longhorn
      size: 4Gi
    workspaceNamespace: unfold-workspaces
    createWorkspaceNamespace: false
    workspaceProvisioner: pod
    workspaceTransport: pull
    workspaceImage: harbor.webgrip.dev/webgrip/unfold-agent:0.4.0-rc.71@sha256:c76c5d5aca7e2a3454a425010fac891f5a163b5b488367f5aebc6926d2232ebb
    workspaceStorageClass: longhorn
    workspaceStorageSize: 8Gi
    workspaceCpu: "1"
    workspaceMemory: 2Gi
    workspaceCpuRequest: 500m
    workspaceMemoryRequest: 1Gi
    workspaceImagePullSecrets:
      - harbor-pull
    workspaceAgentSecrets: []
    workspaceEgress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ploeg
            podSelector:
              matchLabels:
                app.kubernetes.io/name: unfold
        ports:
          - protocol: TCP
            port: 4080
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ai
        ports:
          - protocol: TCP
            port: 4000
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: forgejo
        ports:
          - protocol: TCP
            port: 3000
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: network
    config:
      maxConcurrentSessions: 1
      maxBudgetUsd: 0.25
      auth:
        oidc:
          issuer: https://authentik.${SECRET_DOMAIN}/application/o/unfold/
          subjectNamespace: https://authentik.${SECRET_DOMAIN}/application/o/vloer/
          clientId: unfold
          displayName: Homelab login
          scopes:
            - openid
            - email
            - profile
            - groups
          groupsClaim: groups
          roles:
            admin:
              - homelab-admins
            operator: []
            viewer: []
      ploeg:
        url: http://ploeg.ploeg.svc.cluster.local:8080
        tokenEnv: PLOEG_OPERATOR_UNFOLD_TOKEN
        teams:
          - unfold
          - bronze
          - silver
          - copper
          - pewter
      observability:
        grafanaUrl: https://grafana.${SECRET_DOMAIN}
        dashboards:
          spend: litellm-spend
          reliability: litellm-reliability
          finops: exec-finops
        tracesDatasource: victoriatraces-tempo
        logsDatasource: victorialogs
        logsUrl: http://vlsingle-victorialogs.observability.svc.cluster.local:9428
      execution:
        team: unfold
      litellm:
        baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
        ttl: 10m
        settlementDelayMs: 60000
      models:
        - id: fireworks-deepseek-v4p1-flash
          name: DeepSeek V4.1 Flash (Fireworks)
          providerId: litellm
          modelId: fireworks-deepseek-v4p1-flash
      repositories:
        - id: ploeg
          name: Unfold
          description: Unfold development
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/unfold.git
          baseBranch: development
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: erfbeeld
          name: Erfbeeld
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/erfbeeld.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: homelab-cluster
          name: Homelab cluster
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/homelab-cluster.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: twente-dev
          name: twente.dev
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/twente.dev.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: omnigraph-explorer
          name: Omnigraph Explorer
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/omnigraph-explorer.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
      reports:
        provider: forgejo
        baseUrl: https://forgejo.${SECRET_DOMAIN}/api/v1
        project: webgrip/unfold
        tokenEnv: UNFOLD_REPORTS_FORGEJO_TOKEN
      taskSources:
        - id: ploeg-test
          name: Ploeg Test
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "11"
          repositoryId: ploeg
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: unfold
              baseBranch: development
        - id: glide
          name: Unfold
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "10"
          repositoryId: ploeg
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: unfold
              baseBranch: development
        - id: erfbeeld
          name: Erfbeeld
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "4"
          repositoryId: erfbeeld
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: erfbeeld
              baseBranch: main
        - id: homelab-roadmap
          name: Homelab Roadmap
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "3"
          repositoryId: homelab-cluster
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: homelab-cluster
              baseBranch: main
        - id: ci-cd
          name: CI/CD
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "9"
          repositoryId: homelab-cluster
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: homelab-cluster
              baseBranch: main
        - id: dark-factory
          name: Dark Factory
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "5"
          repositoryId: homelab-cluster
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: homelab-cluster
              baseBranch: main
        - id: twente-dev
          name: twente.dev
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "50"
          repositoryId: twente-dev
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: twente.dev
              baseBranch: main
        - id: omnigraph-explorer
          name: Omnigraph Explorer
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "118"
          repositoryId: omnigraph-explorer
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: omnigraph-explorer
              baseBranch: main
