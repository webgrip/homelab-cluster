---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unfold
spec:
  chartRef:
    kind: OCIRepository
    name: unfold
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    mode: live
    baseUrl: https://unfold.${SECRET_DOMAIN}
    image:
      repository: harbor.webgrip.dev/webgrip/unfold
      tag: 0.4.0-rc.40
      digest: sha256:753af3537ee0a4cd9c6bcfb0c842ce8af1d1c813b6ca76dfde92b77ee8b4a8a7
    imagePullSecrets:
      - name: harbor-pull
    credentialsSecret: unfold-operator
    storage:
      className: longhorn
      size: 4Gi
    workspaceNamespace: unfold-workspaces
    createWorkspaceNamespace: false
    workspaceProvisioner: pod
    workspaceTransport: pull
    workspaceImage: harbor.webgrip.dev/webgrip/unfold-agent:0.4.0-rc.40@sha256:40aa486a5b2684bf40193efe21c16f94ecbe19232ad1678d318d174d675c2d97
    workspaceStorageClass: longhorn
    workspaceStorageSize: 8Gi
    workspaceCpu: "1"
    workspaceMemory: 2Gi
    workspaceImagePullSecrets:
      - harbor-pull
    workspaceAgentSecrets: []
    workspaceEgress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ploeg
            podSelector:
              matchLabels:
                app.kubernetes.io/name: unfold
        ports:
          - protocol: TCP
            port: 4080
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ai
        ports:
          - protocol: TCP
            port: 4000
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: forgejo
        ports:
          - protocol: TCP
            port: 3000
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: network
    config:
      maxConcurrentSessions: 1
      maxBudgetUsd: 0.25
      auth:
        oidc:
          issuer: https://authentik.${SECRET_DOMAIN}/application/o/unfold/
          clientId: unfold
          displayName: Homelab login
          scopes:
            - openid
            - email
            - profile
            - groups
          groupsClaim: groups
          roles:
            admin:
              - homelab-admins
            operator: []
            viewer: []
      ploeg:
        url: http://ploeg.ploeg.svc.cluster.local:8080
        tokenEnv: PLOEG_OPERATOR_UNFOLD_TOKEN
        teams:
          - unfold
          - bronze
          - silver
          - copper
      observability:
        grafanaUrl: https://grafana.${SECRET_DOMAIN}
        dashboards:
          spend: litellm-spend
          reliability: litellm-reliability
          finops: exec-finops
        tracesDatasource: victoriatraces-tempo
        logsDatasource: victorialogs
      execution:
        team: unfold
      litellm:
        baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
        ttl: 10m
        settlementDelayMs: 60000
      models:
        - id: fireworks-deepseek-v4p1-flash
          name: DeepSeek V4.1 Flash (Fireworks)
          providerId: litellm
          modelId: fireworks-deepseek-v4p1-flash
      repositories:
        - id: ploeg
          name: Unfold
          description: Unfold development
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/unfold.git
          baseBranch: development
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: erfbeeld
          name: Erfbeeld
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/erfbeeld.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: homelab-cluster
          name: Homelab cluster
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/homelab-cluster.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: twente-dev
          name: twente.dev
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/twente.dev.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: omnigraph-explorer
          name: Omnigraph Explorer
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/omnigraph-explorer.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
      taskSources:
        - id: ploeg-test
          name: Ploeg Test
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "11"
          repositoryId: ploeg
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: unfold
              baseBranch: development
        - id: glide
          name: Unfold
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "10"
          repositoryId: ploeg
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: unfold
              baseBranch: development
        - id: erfbeeld
          name: Erfbeeld
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "4"
          repositoryId: erfbeeld
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: erfbeeld
              baseBranch: main
        - id: homelab-roadmap
          name: Homelab Roadmap
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "3"
          repositoryId: homelab-cluster
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: homelab-cluster
              baseBranch: main
        - id: ci-cd
          name: CI/CD
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "9"
          repositoryId: homelab-cluster
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: homelab-cluster
              baseBranch: main
        - id: dark-factory
          name: Dark Factory
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "5"
          repositoryId: homelab-cluster
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: homelab-cluster
              baseBranch: main
        - id: twente-dev
          name: twente.dev
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "50"
          repositoryId: twente-dev
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: twente.dev
              baseBranch: main
        - id: omnigraph-explorer
          name: Omnigraph Explorer
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "118"
          repositoryId: omnigraph-explorer
          tokenEnv: UNFOLD_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: omnigraph-explorer
              baseBranch: main
