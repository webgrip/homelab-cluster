---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cosign-pub-publisher
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "cosign-webgrip-pub"
    verbs:
      - "get"
      - "update"
      - "patch"
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cosign-pub-publisher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cosign-pub-publisher
subjects:
  - kind: ServiceAccount
    name: cosign-pub-publisher
    namespace: security
