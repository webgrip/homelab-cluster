---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-reports-token
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-reports-token
    creationPolicy: Owner
  data:
    - {secretKey: UNFOLD_REPORTS_FORGEJO_TOKEN, remoteRef: {key: forgejo/unfold-reports-bot, property: FORGEJO_TOKEN}}
