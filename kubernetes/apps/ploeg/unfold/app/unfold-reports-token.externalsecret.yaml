---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-reports-token
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: unfold-reports-token
    creationPolicy: Owner
  data:
    - {secretKey: UNFOLD_REPORTS_FORGEJO_TOKEN, remoteRef: {key: forgejo/unfold-reports, property: FORGEJO_TOKEN}}
