---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-chart-pull
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The GitHub read:packages token Harbor's GHCR proxy already pulls with (harbor/registry-proxy). Flux lists the Unfold chart tags on ghcr.io itself, because Harbor's proxy cache lists only the tags it has cached."
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-chart-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .GHCR_USERNAME }}","password":"{{ .GHCR_TOKEN }}","auth":"{{ printf "%s:%s" .GHCR_USERNAME .GHCR_TOKEN | b64enc }}"}}}
  data:
    - {secretKey: GHCR_USERNAME, remoteRef: {key: harbor/registry-proxy, property: GHCR_USERNAME}}
    - {secretKey: GHCR_TOKEN, remoteRef: {key: harbor/registry-proxy, property: GHCR_TOKEN}}
