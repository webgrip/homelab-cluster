---
apiVersion: v1
kind: Namespace
metadata:
  name: ploeg
  labels:
    webgrip.io/owner: platform
    webgrip.io/tier: app
    webgrip.io/exposure: internal
    # ADR-0053: the agent plane is daemonless. Every team runs `dind: false`,
    # so no pod here is privileged and the old per-namespace PSA carve-out
    # (`enforce: privileged`, needed for the docker:dind sidecar) is gone —
    # this namespace now sits under the same floor as every other app
    # namespace, and the same floor as code14's ploeg namespace. Gates that
    # need containers run in CI, in CI's own images. warn/audit stay
    # `restricted`.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Opt into kyverno-generated default-deny (ingress+egress) + allow-dns.
    # Re-opened selectively by networkpolicy.yaml.
    kyverno.io/default-network-policies: "true"
