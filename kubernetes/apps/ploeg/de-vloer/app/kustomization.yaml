---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/placement/worker-pool
  - ../../../../components/gateway-egress
resources:
  - ocirepository.yaml
  - helmrelease.yaml
  - httproute.yaml
  - networkpolicy.yaml
patches:
  - target:
      kind: NetworkPolicy
      name: allow-gateway-egress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-gateway-egress
      spec:
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - de-vloer
                - ploeg
  - target:
      kind: HelmRelease
      name: de-vloer
    patch: |-
      - op: add
        path: /spec/postRenderers/0/kustomize/patches/-
        value:
          target:
            kind: Deployment
            name: de-vloer
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: de-vloer
            spec:
              template:
                spec:
                  containers:
                    - name: workbench
                      env:
                        - name: VLOER_DATA_DIR
                          value: /data/workbench
                        - name: VLOER_TASK_VIKUNJA_TOKEN
                          valueFrom:
                            secretKeyRef:
                              name: agent-vikunja-token
                              key: VIKUNJA_API_TOKEN
