---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: de-vloer
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
    monitoring.webgrip.io/synthetic-check: blackbox-de-vloer
spec:
  hostnames:
    - vloer.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: de-vloer
          port: 4080
