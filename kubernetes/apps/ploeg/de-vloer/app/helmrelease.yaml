---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: de-vloer
spec:
  chartRef:
    kind: OCIRepository
    name: de-vloer
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    mode: live
    baseUrl: https://vloer.${SECRET_DOMAIN}
    image:
      repository: harbor.webgrip.dev/webgrip/de-vloer
      tag: 0.4.0-rc.30
      digest: sha256:bdd4e41f893a937cf11348a92c62c5017575baaf635c39a750a700cbeb812224
    imagePullSecrets:
      - name: harbor-pull
    credentialsSecret: ploeg-workbench
    storage:
      className: longhorn
      size: 4Gi
    workspaceNamespace: de-vloer-workspaces
    createWorkspaceNamespace: false
    workspaceProvisioner: pod
    workspaceTransport: pull
    workspaceImage: harbor.webgrip.dev/webgrip/de-vloer-agent:0.4.0-rc.30@sha256:329335f3919f90c548eb3818040333914d80c353669aa948178f1fcc17df56fe
    workspaceStorageClass: longhorn
    workspaceStorageSize: 8Gi
    workspaceCpu: "1"
    workspaceMemory: 2Gi
    workspaceImagePullSecrets:
      - harbor-pull
    workspaceAgentSecrets: []
    workspaceEgress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ploeg
            podSelector:
              matchLabels:
                app.kubernetes.io/name: de-vloer
        ports:
          - protocol: TCP
            port: 4080
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ai
        ports:
          - protocol: TCP
            port: 4000
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: forgejo
        ports:
          - protocol: TCP
            port: 3000
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: network
    config:
      maxConcurrentSessions: 1
      maxBudgetUsd: 0.25
      auth:
        oidc:
          issuer: https://authentik.${SECRET_DOMAIN}/application/o/vloer/
          clientId: vloer
          displayName: Homelab login
          scopes:
            - openid
            - email
            - profile
            - groups
          groupsClaim: groups
          roles:
            admin:
              - homelab-admins
            operator: []
            viewer: []
      ploeg:
        url: http://ploeg.ploeg.svc.cluster.local:8080
        tokenEnv: PLOEG_OPERATOR_VLOER_TOKEN
        teams:
          - vloer
          - bronze
          - silver
          - copper
      observability:
        grafanaUrl: https://grafana.${SECRET_DOMAIN}
        dashboards:
          spend: litellm-spend
          reliability: litellm-reliability
          finops: exec-finops
        tracesDatasource: victoriatraces-tempo
        logsDatasource: victorialogs
      execution:
        team: vloer
      litellm:
        baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
        ttl: 10m
        settlementDelayMs: 60000
      models:
        - id: fireworks-deepseek-v4p1-flash
          name: DeepSeek V4.1 Flash (Fireworks)
          providerId: litellm
          modelId: fireworks-deepseek-v4p1-flash
      repositories:
        - id: de-vloer
          name: De Vloer
          description: De Vloer development and cluster test work
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/de-vloer.git
          baseBranch: development
          executionOwner: ploeg
          verify:
            - node
            - --test
            - examples/order-service/test/order.test.js
        - id: ploeg
          name: Glide
          description: Glide development
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/glide.git
          baseBranch: development
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: erfbeeld
          name: Erfbeeld
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/erfbeeld.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: homelab-cluster
          name: Homelab cluster
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/homelab-cluster.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: twente-dev
          name: twente.dev
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/twente.dev.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
        - id: omnigraph-explorer
          name: Omnigraph Explorer
          url: https://forgejo.${SECRET_DOMAIN}/webgrip/omnigraph-explorer.git
          baseBranch: main
          executionOwner: ploeg
          verify:
            - git
            - diff
            - --check
      taskSources:
        - id: ploeg-test
          name: Ploeg Test
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "11"
          repositoryId: ploeg
          tokenEnv: VLOER_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: glide
              baseBranch: development
        - id: glide
          name: Glide
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "10"
          repositoryId: ploeg
          tokenEnv: VLOER_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: glide
              baseBranch: development
        - id: erfbeeld
          name: Erfbeeld
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "4"
          repositoryId: erfbeeld
          tokenEnv: VLOER_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: erfbeeld
              baseBranch: main
        - id: homelab-roadmap
          name: Homelab Roadmap
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "3"
          repositoryId: homelab-cluster
          tokenEnv: VLOER_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: homelab-cluster
              baseBranch: main
        - id: ci-cd
          name: CI/CD
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "9"
          repositoryId: homelab-cluster
          tokenEnv: VLOER_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: homelab-cluster
              baseBranch: main
        - id: dark-factory
          name: Dark Factory
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "5"
          repositoryId: homelab-cluster
          tokenEnv: VLOER_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: homelab-cluster
              baseBranch: main
        - id: twente-dev
          name: twente.dev
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "50"
          repositoryId: twente-dev
          tokenEnv: VLOER_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: twente.dev
              baseBranch: main
        - id: omnigraph-explorer
          name: Omnigraph Explorer
          provider: vikunja
          baseUrl: https://vikunja.${SECRET_DOMAIN}/api/v1
          project: "118"
          repositoryId: omnigraph-explorer
          tokenEnv: VLOER_TASK_VIKUNJA_TOKEN
          executionOwner: ploeg
          ploeg:
            target:
              forge: forgejo
              owner: webgrip
              repo: omnigraph-explorer
              baseBranch: main
