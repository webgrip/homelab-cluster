---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: de-vloer-workspaces
spec:
  dependsOn:
    - name: external-secrets-stores
      namespace: security
  interval: 10m
  path: ./kubernetes/apps/ploeg/de-vloer/workspaces
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: de-vloer-workspaces
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: de-vloer
spec:
  dependsOn:
    - name: ploeg
    - name: de-vloer-workspaces
  interval: 10m
  path: ./kubernetes/apps/ploeg/de-vloer/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ploeg
  wait: false
