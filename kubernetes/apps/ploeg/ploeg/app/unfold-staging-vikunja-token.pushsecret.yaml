---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-staging-vikunja-token
  namespace: ploeg
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: ClusterSecretStore, name: openbao-push}
  selector: {secret: {name: ploeg-vikunja-bot}}
  data:
    - match: {secretKey: VIKUNJA_API_TOKEN, remoteRef: {remoteKey: unfold-main/staging/vikunja, property: api-token}}
