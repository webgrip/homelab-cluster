---
# ClickUp access for ploegd: api_token reads tasks and writes status and
# comments back; webhook_secret verifies deliveries (ClickUp generates it when
# the webhook is registered — `just clickup-webhook` stores it here). Both must
# exist at secret/clickup/ploeg before the HelmRelease references this Secret,
# or ploegd cannot start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-clickup
  namespace: ploeg
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: ploeg-clickup
    creationPolicy: Owner
  data:
    - {secretKey: CLICKUP_TOKEN, remoteRef: {key: clickup/ploeg, property: api_token}}
    - {secretKey: PLOEG_CLICKUP_SECRET, remoteRef: {key: clickup/ploeg, property: webhook_secret}}
