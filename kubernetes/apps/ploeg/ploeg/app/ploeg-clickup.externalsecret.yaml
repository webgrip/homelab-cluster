---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-clickup
  namespace: ploeg
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "api_token is a ClickUp personal API token of the Ploeg bot (ClickUp, Settings, Apps), written by just clickup-token; webhook_secret is written by just clickup-webhook, which registers the Workspace webhook and stores the secret ClickUp generates."
    wellhead.dev/verify.http.url: "https://api.clickup.com/api/v2/user"
    wellhead.dev/verify.http.auth: "header:Authorization:api_token"
    wellhead.dev/verify: "http"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: ploeg-clickup
    creationPolicy: Owner
  data:
    - {secretKey: CLICKUP_TOKEN, remoteRef: {key: clickup/ploeg, property: api_token}}
    - {secretKey: PLOEG_CLICKUP_SECRET, remoteRef: {key: clickup/ploeg, property: webhook_secret}}
