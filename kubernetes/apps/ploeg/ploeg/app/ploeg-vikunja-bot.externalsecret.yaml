---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-vikunja-bot
  namespace: ploeg
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Vikunja API token of bot-ploeg (user id 40) at vikunja.webgrip.dev (its Settings, API Tokens), written with bao kv put secret/vikunja/bot-ploeg api_token=-."
    wellhead.dev/verify.http.url: "https://vikunja.webgrip.dev/api/v1/projects"
    wellhead.dev/verify.http.auth: "bearer:api_token"
    wellhead.dev/expires: "2027-10-17"
    wellhead.dev/verify: "http"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: ploeg-vikunja-bot
    creationPolicy: Owner
  data:
    - {secretKey: VIKUNJA_API_TOKEN, remoteRef: {key: vikunja/bot-ploeg, property: api_token}}
