---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-vikunja-bot
  namespace: ploeg
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: ploeg-vikunja-bot
    creationPolicy: Owner
  data:
    - {secretKey: VIKUNJA_API_TOKEN, remoteRef: {key: vikunja/bot-ploeg, property: api_token}}
