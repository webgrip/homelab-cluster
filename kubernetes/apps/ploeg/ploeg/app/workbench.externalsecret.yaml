---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-workbench
spec:
  refreshInterval: "0"
  target:
    name: ploeg-workbench
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: password, target: PLOEG_OPERATOR_VLOER_TOKEN}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: password, target: VLOER_ADMIN_PASSWORD}
