---
# Admits only the public ClickUp webhook route in `network` to the ploegd
# Service; see kubernetes/apps/network/envoy-gateway/app/ploeg-clickup-webhook.httproute.yaml.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ploeg-clickup-webhook
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: network
  to:
    - group: ""
      kind: Service
      name: ploeg
