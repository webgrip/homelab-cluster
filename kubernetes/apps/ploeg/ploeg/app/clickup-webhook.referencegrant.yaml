---
# Admits the public webhook routes in `network` to the ploegd Service; see
# ploeg-clickup-webhook.httproute.yaml and ploeg-github-webhook.httproute.yaml
# in kubernetes/apps/network/envoy-gateway/app/.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ploeg-clickup-webhook
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: network
  to:
    - group: ""
      kind: Service
      name: ploeg
