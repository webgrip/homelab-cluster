---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: unfold-staging-clickup-token
  namespace: ploeg
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: SecretStore, name: openbao-push}
  selector: {secret: {name: ploeg-clickup}}
  data:
    - match: {secretKey: CLICKUP_TOKEN, remoteRef: {remoteKey: unfold-main/staging/clickup, property: api-token}}
