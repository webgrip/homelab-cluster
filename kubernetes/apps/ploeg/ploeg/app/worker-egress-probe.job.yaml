---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-egress-probe
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    app.kubernetes.io/name: ploeg-worker
    app.kubernetes.io/component: egress-probe
    app.kubernetes.io/part-of: ploeg
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ploeg-worker
        app.kubernetes.io/component: egress-probe
        app.kubernetes.io/part-of: ploeg
    spec:
      serviceAccountName: ploeg-worker
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: probe
          image: harbor.webgrip.dev/dockerhub/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          imagePullPolicy: IfNotPresent
          env:
            - {name: PROBED_POLICY, value: gateway-scoped}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          command:
            - /bin/sh
            - -u
            - -c
            - |
              echo "worker-egress-probe node=$NODE_NAME policy=$PROBED_POLICY"
              failed=0
              reachable() {
                code="$(curl -sS --max-time 15 --retry 2 --retry-connrefused -o /dev/null -w '%{http_code}' "$1")"
                case "$code" in
                  2??) echo "PASS reachable $1 -> $code" ;;
                  *) echo "FAIL expected reachable $1 -> $code"; failed=1 ;;
                esac
              }
              blocked() {
                curl -sSk --connect-timeout 6 --max-time 10 -o /dev/null "$1" 2>/dev/null
                status=$?
                if [ "$status" -eq 28 ]; then
                  echo "PASS blocked $1 (connect timed out)"
                else
                  echo "FAIL expected blocked $1 (curl exit $status)"
                  failed=1
                fi
              }
              reachable http://ploeg.ploeg.svc.cluster.local:8080/healthz
              reachable http://litellm.ai.svc.cluster.local:4000/health/liveliness
              reachable http://forgejo-http.forgejo.svc.cluster.local:3000/api/healthz
              blocked https://k8s-mcp.${SECRET_DOMAIN}/
              blocked https://mcp-grafana.${SECRET_DOMAIN}/
              blocked https://forgejo.${SECRET_DOMAIN}/
              blocked https://vikunja.${SECRET_DOMAIN}/
              blocked https://10.0.0.27/
              blocked https://10.0.0.28/
              blocked http://10.0.0.1/
              blocked http://10.0.0.2/
              blocked https://example.com/
              if [ "$failed" -ne 0 ]; then
                echo "worker-egress-probe FAILED"
                exit 1
              fi
              echo "worker-egress-probe passed"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
