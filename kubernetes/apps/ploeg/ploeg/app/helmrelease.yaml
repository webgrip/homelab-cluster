---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ploeg
spec:
  chartRef:
    kind: OCIRepository
    name: ploeg
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ploeg
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ploeg
              spec:
                template:
                  spec:
                    containers:
                      - name: ploegd
                        env:
                          - name: PLOEG_FORGEJO_URL
                            value: https://forgejo.${SECRET_DOMAIN}
  values:
    imagePullSecrets:
      - name: harbor-pull
    # The tag would default to the chart's appVersion (semantic-release-helm3
    # keeps both in lockstep), which made the OCIRepository ref the single
    # version knob. Pinning the digest buys immutability — a retagged
    # ploegd:0.2.0-rc.12 cannot silently become what runs here — at the cost
    # of a SECOND knob: this line and the OCIRepository tag must move together
    # or the release deploys an image from a different build. Same form the
    # runnerImage below already uses; the digest is the multi-arch index, so
    # both amd64 and arm64 nodes still resolve their own manifest.
    image:
      # Without this annotation Renovate cannot see the SECOND knob the comment
      # above describes. It bumps the OCIRepository (a Flux datasource it knows)
      # and leaves this line behind — which is exactly what rc.27 did on
      # 2026-08-26: the chart moved, the binary stayed on rc.17, the Helm
      # upgrade reported success and the pod never rolled. Automating the chart
      # bump without this would have made that split the DEFAULT outcome rather
      # than a one-off mistake. Same shape kepler uses for its own two knobs
      # (kepler/app/helmrelease.yaml). depName points at Harbor, not the
      # upstream, so the timestamp-optional stability rule in .renovaterc.json5
      # applies — see the kepler note for why a non-Harbor depName wedges
      # stability-days forever.
      # renovate: datasource=docker depName=harbor.webgrip.dev/webgrip/ploegd
      tag: "0.4.0-rc.23@sha256:9db41e004442df49f402842c1aad0ccc35f0081eb42229093559d7bf81b8239d"
    monitoring:
      serviceMonitor:
        enabled: true
    operator:
      consumers:
        - name: de-vloer
          teams:
            - vloer
            - bronze
            - silver
            - copper
          execute: true
          maxBudgetUsd: 0.25
          tokenSecret:
            name: ploeg-workbench
            key: PLOEG_OPERATOR_VLOER_TOKEN
    # Routing and roster as a FILE (mounted at /etc/ploeg/ploeg.yaml), not the
    # PLOEG_TARGET_MAP / PLOEG_TEAM_MAP / PLOEG_TEAM_PLANS env-var DSLs.
    #
    # Projects are NAMED. ploegd asks Vikunja for the id at boot, logs what it
    # resolved, and refuses to start if a name matches nothing — so no bare
    # project number lives in this file, where it would say nothing about which
    # board it is and would silently reroute work the day a project is rebuilt.
    config:
      trackers:
        vikunja:
          # One entry per BOARD, and no `team:` key — so whichever team is
          # assigned, the board decides the repository. This is the shape the
          # chart's own values.yaml calls the target state, and it replaces
          # the previous three-entries-on-one-project arrangement where the
          # TEAM picked the repo. That was the dispatch-topology trap in
          # docs/ops/board.md and it misfired immediately: a ticket asking for
          # an erfbeeld README change was assigned to silver, whose rule
          # pointed at webgrip/ploeg, and the agent dutifully edited the wrong
          # repository's README (PR webgrip/ploeg#30, 2026-07-30).
          #
          # Boards that legitimately touch several repos (Dark Factory,
          # CI/CD) take the repo they touch MOST as the default. A
          # per-ticket override needs the label selector held for rc.14 —
          # ADR-0015 requires a hint to select among pre-registered routes
          # rather than construct one, since tracker text is untrusted input.
          #
          # NOT routed on purpose:
          #   Forgejo Migration — irreducibly multi-repo ("port CI: telemetry-
          #     service, common-charts, …"); any default is wrong more often
          #     than right. Waits for rc.14.
          #   Vellum — describes a real UI product with no repo in the webgrip
          #     org. Nothing to route to yet.
          #   Inbox — triage only.
          #
          # Each routed board also needs its team users shared in and the
          # ploegd webhook registered on it, or assignment 403s (an assignee
          # needs read access) and nothing fires.
          #
          # `forge` names the INSTANCE that holds the repo, and it is stated
          # on every rule rather than left to the default. Omitting it is what
          # broke review publishing: ploegd read PLOEG_TARGET_FORGE twice, with
          # a "forgejo" default for the forge registry and no default for the
          # target resolver, so every Target carried forge="" while the
          # registry was keyed "forgejo" and the lookup missed. A reviewer
          # returned verdict=approve on erfbeeld#9 on 2026-07-30 and the pull
          # request never heard about it. Fixed in ploegd >= rc.16 (empty now
          # resolves to the configured default), and pinned here so the value
          # is visible in the manifest rather than inferred from an env var
          # that appears in no chart, no values file and no doc.
          projects:
            - name: "Ploeg Test"
              id: "11"
              team: vloer
              repo: webgrip/glide
              branch: development
              forge: forgejo
            # One board for all Glide work (Ploeg and Vloer merged into
            # project 10 on 2026-09-29). Pinned by id so a rename of the
            # board cannot fail ploegd's boot.
            - name: "Glide"
              id: "10"
              repo: webgrip/glide
              branch: development
              forge: forgejo
            - name: "Erfbeeld"
              repo: webgrip/erfbeeld
              branch: main
              forge: forgejo
            - name: "Homelab Roadmap"
              repo: webgrip/homelab-cluster
              branch: main
              forge: forgejo
            - name: "CI/CD"
              repo: webgrip/homelab-cluster
              branch: main
              forge: forgejo
            # Product board for the twente.dev community site (Vikunja
            # project "twente.dev", id 50 as of 2026-08-12 — resolved by NAME
            # at boot like every entry here). Routed 2026-08-28 so agent-ready
            # tickets (first: VIK-686, axe-core in CI) can dispatch. The helm
            # entry alone does NOT make assignment fire: the ploegd webhook
            # must be registered on the project and the team user shared in
            # with read access, or assignment 403s silently — rollout tracked
            # in VIK-779.
            - name: "twente.dev"
              repo: webgrip/twente.dev
              branch: main
              forge: forgejo
            - name: "Omnigraph Explorer"
              repo: webgrip/omnigraph-explorer
              branch: main
              forge: forgejo
            # Mode A benchmark board (ploeg-bench). The board decides the repo:
            # a bronze assignment here runs bronze's plan (deepseek, $8 pool)
            # against the PB-01 world, not erfbeeld. The branch is the task's
            # pre-fix base — the graded suites live in hidden branches the
            # agent never sees. One fresh ticket per trial (ticket reuse
            # exercises the re-dispatch path and measures the wrong thing).
            # Webhook + bronze share are wired on the project (id 49,
            # 2026-08-11). Pinned by id: an empty second project 48 carries
            # the same name, so the name alone resolves to two projects.
            - name: "Ploeg Bench"
              id: "49"
              repo: webgrip/ploeg-bench-world
              branch: bench/pb01-base
              forge: forgejo
      teams:
        # The board only ever sees the TEAM user. Roles (builder, reviewer,
        # devops, security) are internal to a Shift and live under
        # executor.teams[].plan — they are not assignable names, and putting
        # them here would be actively harmful: an assignee listed under two
        # teams used to resolve by Go map iteration order, dispatching the
        # same person's tickets to a different team on different boots.
        # ploegd >= 0.2.0-rc.13 refuses to start on that instead.
        #
        # jake/jane are gone. They were invented so a human could "assign a
        # colleague", but neither existed as a Vikunja user, so the mapping
        # could never fire.
        bronze:
          assignees:
            - bronze
          # A person's "request changes" on bronze's pull request sends the Work
          # Item back for a fix Round, and a failed check queues a bounded repair
          # Follow-Up (Forgejo cannot deliver check events yet, Glide #1280).
          forgeFollowUps:
            reworkOnChangesRequested: true
            repairFailedChecks: true
            maxRepairs: 2
        silver:
          assignees:
            - silver
          forgeFollowUps:
            reworkOnChangesRequested: true
            repairFailedChecks: true
            maxRepairs: 2
        copper:
          assignees:
            - copper
        vloer:
          assignees: []
    # Tracker write-backs: how a closed Shift reaches a person with the pull
    # request link (backlog #31). Without both, the provider keeps its logging
    # no-op — runs still finish, the board is simply not updated.
    tracker:
      url: https://vikunja.${SECRET_DOMAIN}/api/v1
      tokenSecret:
        name: agent-vikunja-token
        key: VIKUNJA_API_TOKEN
    env:
      # copper, not bronze: an unmapped assignee falls through to the default
      # team, and copper's exec harness makes no LLM call, opens no PR and
      # exits no_change_needed. A colleague accidentally assigned on a
      # webhook-carrying project costs $0 instead of a live agent run against
      # a real repository. PLOEG_TARGET_STRICT (backlog #108) supersedes this
      # when it ships — refusing to route beats routing somewhere harmless.
      PLOEG_DEFAULT_TEAM: copper
      PLOEG_LEASE_TTL: 15m
      # PLOEG_TEAM_MAP is gone: config.teams[].assignees above is the roster
      # now, and ploegd merges the two. Keeping both meant the same fact in
      # two syntaxes, and the env copy still carried jake/jane after the file
      # dropped them. Unmapped assignees still fall back to
      # PLOEG_DEFAULT_TEAM, so do not assign an unmapped human on a
      # webhook-carrying board unless a copper no-op is what you want.
    executor:
      enabled: true
      forge: forgejo
      # A writer's forge token stays inside ploeg-worker; the harness gets a
      # placeholder and reaches only the Run's own repository through a
      # loopback proxy (Glide VIK-733). Every harness here runs with dind:false,
      # so none pushes from a sidecar that cannot reach it.
      forgeTokenIsolation: proxy
      litellm:
        keyIsolation: proxy
      forgejo:
        url: http://forgejo-http.forgejo.svc.cluster.local:3000
        readTokenSecret:
          name: agent-reviewer-token
          key: FORGEJO_TOKEN
        botPasswordSecret:
          name: agent-builder-password
          key: FORGEJO_BOT_PASSWORD
        webhookSecret:
          name: ploeg-forge-webhook
          key: PLOEG_FORGEJO_SECRET
      workerAuth:
        mode: managed
        signingKeySecret:
          name: ploeg-worker-signing
          key: key
        bootstrapSecret:
          name: ploeg-worker-bootstrap
          registryKey: registry.json
        additionalLLMPolicies:
          - team: vloer
            role: operator
            budgetUsd: 0.25
            models:
              - deepseek-chat
            ttl: 10m
      # ADR-0053: the agent plane is daemonless — dind:false is the ESTATE
      # default here, overriding the chart's own dind:true. This line is
      # load-bearing: bronze's builder role and silver carry no harness block
      # of their own, so before it existed they inherited the chart default
      # and ran privileged DinD sidecars nobody had written down in this
      # file (they were the two names in the now-deleted
      # exception-ploeg-worker-privileged-cel waiver). Gates that need
      # containers run in CI, in CI's own images.
      harness:
        name: openhands
        dind: false
        # OpenHands prints nothing while it thinks and edits, and the idle watchdog
        # counts only harness output: at the 15m default it killed bronze's #555
        # builder (Run 134, 2026-09-27) mid-work after US$0.24 of model calls.
        # The 100m harness timeout still bounds every Run.
        idleTimeout: 45m
        # Glide ADR-0035: the kubelet mounts the toolchain read-only, so a Run
        # can check its work without registry egress. Go matches Glide's mise
        # pin. Module downloads stay blocked by the namespace's egress policy,
        # so the check is gofmt-class only, and only where Glide's Ploeg module
        # exists; ploeg-worker re-runs it after a writer opens a pull request.
        toolchains:
          - name: go
            image: harbor.webgrip.dev/dockerhub/library/golang:1.25.0-alpine@sha256:f18a072054848d87a8077455f0ac8a25886f2397f88bfdd222d6fafbb5bba440
            path:
              - /usr/local/go/bin
            env: {GOTOOLCHAIN: local}
        verify:
          - 'if [ -f apps/ploeg/go.mod ]; then test -z "$(gofmt -l apps/ploeg)"; fi'
      # Workers run under their own identity, ploeg-worker, created by the
      # chart (>= rc.13). Naming none left them on `default`, which trips
      # Kyverno's require-non-default-serviceaccount and makes every workload
      # in the namespace indistinguishable in an audit log.
      #
      # Do NOT set executor.serviceAccountName here. The chart reads that key
      # as "an externally-managed account exists, so do not create one", so
      # naming ploeg-worker — the chart's own default — suppressed creation of
      # the very account the pods then referenced, and every worker Job died
      # with `serviceaccount "ploeg-worker" not found`. Silence gets both the
      # account and the reference. The chart's guard is the wrong shape and
      # wants a create/name split; ticket on the board.
      # Chart default lags a release behind; pin the runner here. 1.0.2 killed
      # ~5 min of startup dead time per run (no public-skills git sync, local
      # LiteLLM cost map — VIK-590); 1.0.3 bakes the version banner; 1.2.0 is
      # the FIRST DAEMONLESS image (ADR-0053: no docker CLI, no daemon wait —
      # runs 426-439 tell the release saga in its Dockerfile header), on the
      # DHI musl base (43/107 -> 6/53 CVEs), with the shared litellm-key
      # helper (env-only key passing, run-attributed admin calls), TERM
      # forwarding + EXIT-trap revoke, and `product-owner` replacing the
      # consolidated `vikunja-product-owner` in the baked skills. ploeg-worker
      # is statically linked, so the musl move cannot break the init copy.
      runnerImage: harbor.webgrip.dev/webgrip/agent-runner:1.3.0@sha256:ab0a56f12a33b2af542663e0f2079261f5b9aca5596a5d497583f211a284684f
      # No dindImage / dindResources: the agent plane is daemonless
      # (ADR-0053). Every team runs dind:false, the ploeg namespace is back at
      # PSA baseline and the privileged Kyverno waiver is deleted — so
      # re-enabling a DinD sidecar is deliberately an MR that has to bring all
      # three back, not a values flip. Gates that need containers run in CI,
      # in CI's own images.
      # (runnerImage above is NOT Renovate-maintained: the custom managers in
      # the shared webgrip/renovate-config preset have no matcher for it, so
      # it is a manual bump today.)
      #
      # Guaranteed QoS stays (requests==limits — ADR-0049 P1), sized down from
      # the chart defaults so a run fits the rebalanced fringe node: worker
      # peak measured 438Mi (run 8).
      # Worker CPU is 1 full core, not 500m: the OpenHands CLI's
      # single-threaded Python cold import took 2m20s at 500m before the
      # agent did anything (silver run 2026-07-27). Both teams at this sizing
      # fit fringe (2×1.5 CPU of 7.95 allocatable).
      # A Run mostly waits on the model: request 250m so it schedules beside
      # CI on the worker pool (a full-CPU request fitted only fringe-workstation
      # on 2026-09-27), and keep the 1-CPU limit for bursts. CPU requests 100m
      # (2026-09-29) so a Run plus Kata's overhead fits beside CI on worker-1,
      # the only Kata node with memory to spare. Memory requests
      # 768Mi (measured peaks 527Mi reviewer, 620Mi builder) so a Run fits a
      # Kata node, and may burst to the 1536Mi limit.
      workerResources:
        requests: {cpu: 100m, memory: 768Mi}
        limits: {cpu: "1", memory: 1536Mi}
      scaler:
        # The KEDA operator resolves this hostname from the keda namespace,
        # so the chart's short in-namespace default never resolves there.
        host: ploeg-db-rw.ploeg.svc.cluster.local
      # Chart default is 30s, which measured as the single largest slice of a
      # cold dispatch: on the 2026-08-26 silver smoke run, `work item queued`
      # 04:17:23 -> pod created 04:17:45 was 21s of pure poll latency, out of
      # 70s total to `ploeg-worker starting` (the other two slices being the
      # worker-bin init + dind sidecar, ~29s, and the OpenHands Python cold
      # import, ~19s — the latter already bought down from 2m20s by giving the
      # worker a full core, see workerResources above).
      # The trigger query is a COUNT(*) over agent_runs' partial index
      # `agent_runs_claimable` (state='pending'), so polling 6x more often is
      # free. Caps the poll slice at 5s instead of 30s.
      pollingInterval: 5
      teams:
        # bronze: cheapest model. `budget` is the SHIFT POOL, not a per-run
        # figure — the comment here used to say "$2/run budget", which was a
        # category error: $2 is the builder Role's cap and the pool is the
        # envelope all Rounds draw from. Raised 3 -> 8 to fund the review loop
        # below (builder 2.00 + reviewer 0.40 = 2.40 per pass, and a fix round
        # is another writer+reader pair).
        #
        # Target repo pinned per team in v0 (repo-from-ticket mapping is a
        # follow-up); erfbeeld is the proven agent-run target (AGENTS.md +
        # team-bronze skill in-repo) and the worker only ever opens PRs, never
        # merges.
        - name: bronze
          model: litellm_proxy/fireworks-deepseek-v4p1-flash
          budget: "8"
          repoOwner: webgrip
          repoName: erfbeeld
          # erfbeeld's real trunk; explicit so a default-branch change can
          # never silently move the working tree (VIK-589, chart >= rc.5).
          # Only a FALLBACK now: the board's routing rule wins, and every
          # board above pins its own branch.
          baseBranch: main
          maxReplicaCount: 1
          # Writer, then one reader. The fan-out to reviewer + devops came off
          # on 2026-07-30 when both readers died with
          #   exec: "opencode": executable file not found in $PATH
          # and the note left here — "SINGLE WRITER until a reader-capable
          # harness exists in the runner image" — was wrong about the cause.
          # openhands is reader-capable on the image we already run: it is the
          # one adapter with the PLOEG_OUTCOME_FILE drop box a review comes
          # back through, and its entrypoint's docker wait is skipped outright
          # when DOCKER_HOST is unset, which dind:false does.
          #
          # The real blockers were in ploegd, and are fixed in >= rc.14: a
          # reader was handed a shallow single-branch clone of the BASE, so it
          # never received the work it was asked to review; it was never told
          # the pull request existed; and it held a full push credential while
          # being told it did not. See webgrip/ploeg#32.
          #
          # One reader, not three: rounds are sequential but a fan-out is
          # concurrent, and three readers at once do not fit the worker pool
          # (fringe ~2.3 CPU / 2.3Gi free, worker-1 at 99% CPU requests).
          #
          # maxFixRounds turns on the arc that makes this a loop rather than a
          # line: a reviewer returning request_changes re-opens the writing
          # Round with its findings in the builder's prompt, then re-reviews.
          # The machinery has been built, tested against a live Postgres and
          # deployed since rc.14 — it was simply never switched on, because
          # MaxFixRounds defaults to 0 and reviewloop.go returns on the first
          # line when it is.
          #
          # 2, not more. ADR-0017 bounds it three ways in this order: money
          # first (the pool above), then this cap, then the verdict — and only
          # a READING Role's verdict counts, so the loop cannot grade its own
          # work.
          #
          # Be precise about the money bound: it reads shifts.spent, which was
          # 0.0000 on every row ever written because the deployed adapters
          # reported no usage — so through rc.14 that first bound was INERT,
          # and the note here said the pool would become real "when ploegd
          # rc.16 lands". It has: rc.16 settles each run's cost from the
          # gateway, so ClaimRole's `budget − spent − reserved` now subtracts a
          # number that moves. Watch the FIRST loop that actually runs to
          # completion on this tag — this bound has never once fired in
          # production, and a Round denied for money looks like a stall.
          #
          # The margin it now has to fit inside is thin but real. The per-run
          # key ceiling LiteLLM enforces (2.00 for the builder, 0.40 for the
          # reviewer) times the round count — 1 writer + 1 reader + 2 fix
          # rounds of the same pair = 6 runs — is a hard worst case of $7.20
          # against the $8 pool. 80 cents, and LiteLLM still enforces the
          # per-run ceiling underneath, so an overrun denies a Round rather
          # than overspending the pool.
          maxFixRounds: 2
          executorType: sandbox
          sandbox:
            runtimeClassName: kata
          # OpenHands over ACP (2026-09-29): the adapter sees every step as a
          # protocol message, so its idle timer resets while the agent works and
          # only a silent agent is stopped. Native headless OpenHands printed
          # nothing until done, and the 45m output watchdog killed 12 busy Runs
          # that day. promptTimeout bounds the whole Run.
          harness:
            name: acp
            dind: false
            acp:
              profile: openhands
              idleTimeout: 10m
              promptTimeout: 90m
          plan:
            - roles:
                - {name: builder, writes: true, cap: "2.00"}
            - roles:
                - name: reviewer
                  writes: false
                  cap: "0.40"
                  model: litellm_proxy/fireworks-glm-5p3-flash
                  # Redundant with the executor-level default since ADR-0053,
                  # kept deliberately: a reader role must never regain a
                  # docker daemon by someone editing the global default.
                  harness: {name: acp, dind: false, acp: {profile: openhands, idleTimeout: 10m, promptTimeout: 90m}}
                  workerResources:
                    requests: {cpu: 100m, memory: 768Mi}
                    limits: {cpu: 500m, memory: 1536Mi}
        - name: silver
          model: litellm_proxy/fireworks-deepseek-v4p1-flash
          budget: "6"
          repoOwner: webgrip
          repoName: glide
          baseBranch: development
          maxReplicaCount: 1
          maxFixRounds: 1
          plan:
            - roles:
                - {name: builder, writes: true, cap: "2.50"}
            - roles:
                - name: reviewer
                  writes: false
                  cap: "0.40"
                  model: litellm_proxy/fireworks-glm-5p3-flash
                  harness: {name: openhands, dind: false}
                  workerResources:
                    requests: {cpu: 100m, memory: 768Mi}
                    limits: {cpu: 500m, memory: 1536Mi}
        # copper: seam-smoke team for the pluggable harness/image work
        # (chart >= rc.5). The exec adapter runs /bin/cat on the generated
        # taskspec.json inside the same agent-runner image and exits 0, so a
        # run proves per-team harness selection, taskspec/task.md composition,
        # per-run key mint/revoke, and the no_change_needed outcome path —
        # without spending a single LLM token. dind: false predates ADR-0053
        # here and is now the estate default; copper proved the sidecar-less
        # pod shape the rest of the plane later standardized on.
        # copper has no `plan:`, so `budget` is its per-run ceiling and not a
        # pool.
        - name: copper
          model: litellm_proxy/deepseek-chat # key scope only; the exec harness never calls the LLM
          budget: "1"
          repoOwner: webgrip
          repoName: erfbeeld
          baseBranch: main
          maxReplicaCount: 1
          executorType: sandbox
          sandbox:
            runtimeClassName: kata
          harness:
            name: exec
            args:
              - "/bin/cat"
              - "{taskspec}"
            dind: false
