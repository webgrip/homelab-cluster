---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ploeg
spec:
  chartRef:
    kind: OCIRepository
    name: ploeg
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    imagePullSecrets:
      - name: harbor-pull
    # The tag would default to the chart's appVersion (semantic-release-helm3
    # keeps both in lockstep), which made the OCIRepository ref the single
    # version knob. Pinning the digest buys immutability — a retagged
    # ploegd:0.2.0-rc.12 cannot silently become what runs here — at the cost
    # of a SECOND knob: this line and the OCIRepository tag must move together
    # or the release deploys an image from a different build. Same form the
    # runnerImage below already uses; the digest is the multi-arch index, so
    # both amd64 and arm64 nodes still resolve their own manifest.
    image:
      tag: "0.2.0-rc.13@sha256:a7d1238707bfaede8d25434f45b8d526eb38f4264544d2e5f01a07ce08620d27"
    # Routing and roster as a FILE (mounted at /etc/ploeg/ploeg.yaml), not the
    # PLOEG_TARGET_MAP / PLOEG_TEAM_MAP / PLOEG_TEAM_PLANS env-var DSLs.
    #
    # Projects are NAMED. ploegd asks Vikunja for the id at boot, logs what it
    # resolved, and refuses to start if a name matches nothing — so no bare
    # project number lives in this file, where it would say nothing about which
    # board it is and would silently reroute work the day a project is rebuilt.
    config:
      trackers:
        vikunja:
          # One entry per BOARD, and no `team:` key — so whichever team is
          # assigned, the board decides the repository. This is the shape the
          # chart's own values.yaml calls the target state, and it replaces
          # the previous three-entries-on-one-project arrangement where the
          # TEAM picked the repo. That was the dispatch-topology trap in
          # docs/ops/board.md and it misfired immediately: a ticket asking for
          # an erfbeeld README change was assigned to silver, whose rule
          # pointed at webgrip/ploeg, and the agent dutifully edited the wrong
          # repository's README (PR webgrip/ploeg#30, 2026-07-30).
          #
          # Boards that legitimately touch several repos (Dark Factory, De
          # Vloer, CI/CD) take the repo they touch MOST as the default. A
          # per-ticket override needs the label selector held for rc.14 —
          # ADR-0015 requires a hint to select among pre-registered routes
          # rather than construct one, since tracker text is untrusted input.
          #
          # NOT routed on purpose:
          #   Forgejo Migration — irreducibly multi-repo ("port CI: telemetry-
          #     service, common-charts, …"); any default is wrong more often
          #     than right. Waits for rc.14.
          #   Vellum — describes a real UI product with no repo in the webgrip
          #     org. Nothing to route to yet.
          #   Inbox — triage only.
          #
          # Each routed board also needs its team users shared in and the
          # ploegd webhook registered on it, or assignment 403s (an assignee
          # needs read access) and nothing fires. Today only Ploeg Test has
          # both.
          projects:
            - name: "Ploeg Test"
              repo: webgrip/ploeg
              branch: development
            - name: "Ploeg"
              repo: webgrip/ploeg
              branch: development
            - name: "Erfbeeld"
              repo: webgrip/erfbeeld
              branch: main
            - name: "Homelab Roadmap"
              repo: webgrip/homelab-cluster
              branch: main
            - name: "CI/CD"
              repo: webgrip/homelab-cluster
              branch: main
            - name: "Dark Factory"
              repo: webgrip/homelab-cluster
              branch: main
            - name: "De Vloer"
              repo: webgrip/homelab-cluster
              branch: main
      teams:
        # The board only ever sees the TEAM user. Roles (builder, reviewer,
        # devops, security) are internal to a Shift and live under
        # executor.teams[].plan — they are not assignable names, and putting
        # them here would be actively harmful: an assignee listed under two
        # teams used to resolve by Go map iteration order, dispatching the
        # same person's tickets to a different team on different boots.
        # ploegd >= 0.2.0-rc.13 refuses to start on that instead.
        #
        # jake/jane are gone. They were invented so a human could "assign a
        # colleague", but neither existed as a Vikunja user, so the mapping
        # could never fire.
        bronze:
          assignees:
            - bronze
        silver:
          assignees:
            - silver
        copper:
          assignees:
            - copper
    # Tracker write-backs: how a closed Shift reaches a person with the pull
    # request link (backlog #31). Without both, the provider keeps its logging
    # no-op — runs still finish, the board is simply not updated.
    tracker:
      # In-cluster service, NOT https://vikunja.webgrip.dev — that hostname
      # resolves to the shared 10.0.0.27 ingress VIP, and a pod reaching its own
      # cluster's VIP is DNAT'd to the backend before NetworkPolicy is evaluated,
      # so the egress rule never matches and the call hangs. Under
      # routing-as-a-file that is fatal, not cosmetic: ploegd resolves the NAMED
      # projects through this same base URL at boot and exits when it times out.
      # Same shape as the forge and litellm URLs above. Safe for links — the
      # provider only ever joins this to API paths, never shows it to a human.
      url: http://vikunja.vikunja.svc.cluster.local:3456/api/v1
      tokenSecret:
        name: agent-vikunja-token
        key: VIKUNJA_API_TOKEN
    env:
      # copper, not bronze: an unmapped assignee falls through to the default
      # team, and copper's exec harness makes no LLM call, opens no PR and
      # exits no_change_needed. A colleague accidentally assigned on a
      # webhook-carrying project costs $0 instead of a live agent run against
      # a real repository. PLOEG_TARGET_STRICT (backlog #108) supersedes this
      # when it ships — refusing to route beats routing somewhere harmless.
      PLOEG_DEFAULT_TEAM: copper
      PLOEG_LEASE_TTL: 15m
      # PLOEG_TEAM_MAP is gone: config.teams[].assignees above is the roster
      # now, and ploegd merges the two. Keeping both meant the same fact in
      # two syntaxes, and the env copy still carried jake/jane after the file
      # dropped them. Unmapped assignees still fall back to
      # PLOEG_DEFAULT_TEAM, so do not assign an unmapped human on a
      # webhook-carrying board unless a copper no-op is what you want.
    executor:
      enabled: true
      # Workers get their own identity (chart >= rc.13). Naming none left them
      # on `default`, which trips Kyverno's require-non-default-serviceaccount
      # and makes every workload in the namespace look the same in an audit
      # log. Empty would take the chart's <fullname>-worker; named here so the
      # value is visible where the RBAC question gets asked. Deliberately not
      # ploegd's account — ploegd holds the LiteLLM master key and the forge
      # admin credential.
      serviceAccountName: ploeg-worker
      # Chart default lags a release behind; pin the runner here. 1.0.2 killed
      # ~5 min of startup dead time per run (no public-skills git sync, local
      # LiteLLM cost map — VIK-590); 1.0.3 bakes the version banner so the
      # entrypoint no longer cold-imports the CLI tree (2m20s at 500m) just to
      # log it, and silences dependency DeprecationWarnings in run logs.
      runnerImage: harbor.webgrip.dev/webgrip/agent-runner:1.0.3@sha256:53a1f11bd80956241a57772d1deb8a4fbd6b91e2e3310087fdd7bb7e6415c6f6
      # The chart's dindImage default is tag-only, so every worker pod failed
      # Kyverno's require-image-digest (Audit, so nothing was blocked — the
      # finding just sat in the PolicyReport). Pinned here rather than waiting
      # on a chart bump. Same digest the forgejo runners already use, so the
      # node has the layers cached.
      #
      # NOT Renovate-maintained. The custom managers live in the shared
      # webgrip/renovate-config preset, and neither this line nor runnerImage
      # above has a matcher there — both are manual bumps today. A marker
      # comment alone would not help: without a separate (?<currentDigest>…)
      # capture group Renovate treats the whole string as an opaque version
      # and never refreshes the digest.
      dindImage: harbor.webgrip.dev/dockerhub/library/docker:29.6.2-dind@sha256:bfec1f5159c63a81ca6fdedbd81404d2c0e16378ed0feec3bb3fbf3998847659
      # Guaranteed QoS stays (requests==limits — ADR-0049 P1), sized down from
      # the chart defaults so a run fits the rebalanced fringe node: worker
      # peak measured 438Mi (run 8), dind must still hold a go build +
      # embedded-postgres for the gates. A build exceeding dind's limit fails
      # THAT build visibly, never the pod.
      # Worker CPU is 1 full core, not 500m: the OpenHands CLI's
      # single-threaded Python cold import took 2m20s at 500m before the
      # agent did anything (silver run 2026-07-27); docker/dind was a red
      # herring — its daemon was up in 13s. Both teams at this sizing fit
      # fringe (2×1.5 CPU of 7.95 allocatable).
      workerResources:
        requests: {cpu: "1", memory: 768Mi}
        limits: {cpu: "1", memory: 768Mi}
      dindResources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: 500m, memory: 1Gi}
      scaler:
        # The KEDA operator resolves this hostname from the keda namespace,
        # so the chart's short in-namespace default never resolves there.
        host: ploeg-db-rw.ploeg.svc.cluster.local
      teams:
        # bronze: cheapest model, $2/run budget. Target repo pinned per team
        # in v0 (repo-from-ticket mapping is a follow-up); erfbeeld is the
        # proven agent-run target (AGENTS.md + team-bronze skill in-repo) and
        # the worker only ever opens PRs, never merges.
        - name: bronze
          model: litellm_proxy/deepseek-chat
          budget: "3"
          repoOwner: webgrip
          repoName: erfbeeld
          # erfbeeld's real trunk; explicit so a default-branch change can
          # never silently move the working tree (VIK-589, chart >= rc.5).
          # Only a FALLBACK now: the board's routing rule wins, and every
          # board above pins its own branch.
          baseBranch: main
          maxReplicaCount: 1
          # Two Rounds: one writer, then the readers who grade it. ADR-0010
          # forbids mixing a writer and readers in a Round, so the fan-out
          # comes after. `plan` is the bare list of Rounds — the Shift pool is
          # the team's `budget` above, which the chart serialises as
          # {pool: budget, rounds: plan}. Per-Role `cap` bounds one Run inside
          # that pool.
          #
          # No maxFixRounds: the chart does not serialise it, so ADR-0017's
          # request_changes loop cannot be turned on from values at all. The
          # plan runs to exhaustion and a reviewer's verdict lands as a PR
          # comment rather than re-opening the writing Round. Chart gap, not a
          # choice — noted for rc.14.
          plan:
            - roles:
                - {name: builder, writes: true, cap: "2.00"}
            - roles:
                - name: reviewer
                  writes: false
                  cap: "0.30"
                  harness: {name: acp, acp: {profile: opencode}, dind: false}
                  workerResources: &readerResources
                    requests: {cpu: 500m, memory: 384Mi}
                    limits: {cpu: 500m, memory: 384Mi}
                - name: devops
                  writes: false
                  cap: "0.30"
                  harness: {name: acp, acp: {profile: opencode}, dind: false}
                  workerResources: *readerResources
        # silver: the ploeg-repo team — the factory working on its own
        # dispatch plane (first job: the per-run key leak, VIK ticket).
        # sonnet-5 at $4/run: real Go surgery, inside the anthropic
        # 5 USD/day router cap (falls back to deepseek-chat if it trips).
        - name: silver
          model: litellm_proxy/claude-sonnet-5
          budget: "6"
          repoOwner: webgrip
          repoName: ploeg
          # ploeg's trunk is development — main was a stale stub that sent
          # run 8 into a parallel universe (VIK-589, chart >= rc.5). Fallback
          # only; the board's rule decides.
          baseBranch: development
          maxReplicaCount: 1
          # Three Rounds: recon, then the write, then a wider review than
          # bronze gets. Readers are deliberately CHEAP and dind-less — they
          # read and grade, they do not build, and three writer-sized pods at
          # once do not fit the worker pool (fringe had ~2.3Gi/2.3 CPU free
          # and worker-1 is at 99% CPU requests). Per-Role sizing needs chart
          # >= rc.13; on an older chart these keys are silently ignored and
          # every reader books a full 1 CPU / 768Mi, which will sit Pending.
          plan:
            - roles:
                - name: analyst
                  writes: false
                  cap: "0.50"
                  harness: {name: claude-code, dind: false}
                  workerResources: &silverReaderResources
                    requests: {cpu: 500m, memory: 384Mi}
                    limits: {cpu: 500m, memory: 384Mi}
            - roles:
                - {name: builder, writes: true, cap: "4.00"}
            - roles:
                - name: reviewer
                  writes: false
                  cap: "0.60"
                  harness: {name: claude-code, dind: false}
                  workerResources: *silverReaderResources
                - name: devops
                  writes: false
                  cap: "0.30"
                  harness: {name: acp, acp: {profile: opencode}, dind: false}
                  workerResources: *silverReaderResources
                - name: security
                  writes: false
                  cap: "0.60"
                  harness: {name: claude-code, dind: false}
                  workerResources: *silverReaderResources
        # copper: seam-smoke team for the pluggable harness/image work
        # (chart >= rc.5). The exec adapter runs /bin/cat on the generated
        # taskspec.json inside the same agent-runner image and exits 0, so a
        # run proves per-team harness selection, taskspec/task.md composition,
        # per-run key mint/revoke, and the no_change_needed outcome path —
        # without spending a single LLM token. dind: false also exercises the
        # sidecar-less pod shape (no privileged container, so this team is
        # outside the DinD PolicyException entirely).
        # ORDERING: on chart rc.4 the harness block is silently ignored and
        # copper would run as a plain OpenHands team — do not assign copper
        # tickets until the rc.5 chart bump lands (Renovate).
        - name: copper
          model: litellm_proxy/deepseek-chat # key scope only; the exec harness never calls the LLM
          budget: "1"
          repoOwner: webgrip
          repoName: erfbeeld
          baseBranch: main
          maxReplicaCount: 1
          harness:
            name: exec
            args:
              - "/bin/cat"
              - "{taskspec}"
            dind: false
