---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ploeg
spec:
  chartRef:
    kind: OCIRepository
    name: ploeg
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  # Image tag defaults to the chart's appVersion (semantic-release-helm3 keeps
  # both in lockstep), so the OCIRepository ref is the single version knob.
  values:
    imagePullSecrets:
      - name: harbor-pull
    # Routing and roster as a FILE (mounted at /etc/ploeg/ploeg.yaml), not the
    # PLOEG_TARGET_MAP / PLOEG_TEAM_MAP / PLOEG_TEAM_PLANS env-var DSLs.
    #
    # Projects are NAMED. ploegd asks Vikunja for the id at boot, logs what it
    # resolved, and refuses to start if a name matches nothing — so no bare
    # project number lives in this file, where it would say nothing about which
    # board it is and would silently reroute work the day a project is rebuilt.
    config:
      trackers:
        vikunja:
          projects:
            # Everything is wired on one project today (the dispatch-topology
            # trap in docs/ops/board.md), so the team decides the repo. One
            # project per repository is the target state; then `team:` goes.
            - name: "Ploeg Test"
              team: bronze
              repo: webgrip/ploeg
              branch: development
            - name: "Ploeg Test"
              team: silver
              repo: webgrip/ploeg
              branch: development
            - name: "Ploeg Test"
              team: copper
              repo: webgrip/erfbeeld
              branch: main
      teams:
        # Named agents: a human assigns a colleague, not an infrastructure
        # tier. Replaces PLOEG_TEAM_MAP.
        bronze:
          assignees:
            - bronze
            - jake
        silver:
          assignees:
            - silver
            - jane
        copper:
          assignees:
            - copper
    # Tracker write-backs: how a closed Shift reaches a person with the pull
    # request link (backlog #31). Without both, the provider keeps its logging
    # no-op — runs still finish, the board is simply not updated.
    tracker:
      url: https://vikunja.webgrip.dev/api/v1
      tokenSecret:
        name: agent-vikunja-token
        key: VIKUNJA_API_TOKEN
    env:
      # copper, not bronze: an unmapped assignee falls through to the default
      # team, and copper's exec harness makes no LLM call, opens no PR and
      # exits no_change_needed. A colleague accidentally assigned on a
      # webhook-carrying project costs $0 instead of a live agent run against
      # a real repository. PLOEG_TARGET_STRICT (backlog #108) supersedes this
      # when it ships — refusing to route beats routing somewhere harmless.
      PLOEG_DEFAULT_TEAM: copper
      PLOEG_LEASE_TTL: 15m
      # Assignee-username -> team routing (ploegd parseTeamMap). Named agents:
      # assigning `jake` dispatches bronze, `jane` dispatches silver — humans
      # assign a colleague, not an infra tier. The bare team usernames stay
      # mapped for the existing tickets/automation. Unmapped assignees fall
      # back to PLOEG_DEFAULT_TEAM, so never assign an unmapped human on a
      # webhook-carrying project unless a bronze run is what they want.
      PLOEG_TEAM_MAP: "bronze=bronze,silver=silver,jake=bronze,jane=silver,copper=copper"
    executor:
      enabled: true
      # Chart default lags a release behind; pin the runner here. 1.0.2 killed
      # ~5 min of startup dead time per run (no public-skills git sync, local
      # LiteLLM cost map — VIK-590); 1.0.3 bakes the version banner so the
      # entrypoint no longer cold-imports the CLI tree (2m20s at 500m) just to
      # log it, and silences dependency DeprecationWarnings in run logs.
      runnerImage: harbor.webgrip.dev/webgrip/agent-runner:1.0.3@sha256:53a1f11bd80956241a57772d1deb8a4fbd6b91e2e3310087fdd7bb7e6415c6f6
      # Guaranteed QoS stays (requests==limits — ADR-0049 P1), sized down from
      # the chart defaults so a run fits the rebalanced fringe node: worker
      # peak measured 438Mi (run 8), dind must still hold a go build +
      # embedded-postgres for the gates. A build exceeding dind's limit fails
      # THAT build visibly, never the pod.
      # Worker CPU is 1 full core, not 500m: the OpenHands CLI's
      # single-threaded Python cold import took 2m20s at 500m before the
      # agent did anything (silver run 2026-07-27); docker/dind was a red
      # herring — its daemon was up in 13s. Both teams at this sizing fit
      # fringe (2×1.5 CPU of 7.95 allocatable).
      workerResources:
        requests: {cpu: "1", memory: 768Mi}
        limits: {cpu: "1", memory: 768Mi}
      dindResources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: 500m, memory: 1Gi}
      scaler:
        # The KEDA operator resolves this hostname from the keda namespace,
        # so the chart's short in-namespace default never resolves there.
        host: ploeg-db-rw.ploeg.svc.cluster.local
      teams:
        # bronze: cheapest model, $2/run budget. Target repo pinned per team
        # in v0 (repo-from-ticket mapping is a follow-up); erfbeeld is the
        # proven agent-run target (AGENTS.md + team-bronze skill in-repo) and
        # the worker only ever opens PRs, never merges.
        - name: bronze
          model: litellm_proxy/deepseek-chat
          budget: "2"
          repoOwner: webgrip
          repoName: erfbeeld
          # erfbeeld's real trunk; explicit so a default-branch change can
          # never silently move the working tree (VIK-589, chart >= rc.5).
          baseBranch: main
          maxReplicaCount: 1
        # silver: the ploeg-repo team — the factory working on its own
        # dispatch plane (first job: the per-run key leak, VIK ticket).
        # sonnet-5 at $4/run: real Go surgery, inside the anthropic
        # 5 USD/day router cap (falls back to deepseek-chat if it trips).
        - name: silver
          model: litellm_proxy/claude-sonnet-5
          budget: "4"
          repoOwner: webgrip
          repoName: ploeg
          # ploeg's trunk is development — main was a stale stub that sent
          # run 8 into a parallel universe (VIK-589, chart >= rc.5).
          baseBranch: development
          maxReplicaCount: 1
        # copper: seam-smoke team for the pluggable harness/image work
        # (chart >= rc.5). The exec adapter runs /bin/cat on the generated
        # taskspec.json inside the same agent-runner image and exits 0, so a
        # run proves per-team harness selection, taskspec/task.md composition,
        # per-run key mint/revoke, and the no_change_needed outcome path —
        # without spending a single LLM token. dind: false also exercises the
        # sidecar-less pod shape (no privileged container, so this team is
        # outside the DinD PolicyException entirely).
        # ORDERING: on chart rc.4 the harness block is silently ignored and
        # copper would run as a plain OpenHands team — do not assign copper
        # tickets until the rc.5 chart bump lands (Renovate).
        - name: copper
          model: litellm_proxy/deepseek-chat # key scope only; the exec harness never calls the LLM
          budget: "1"
          repoOwner: webgrip
          repoName: erfbeeld
          baseBranch: main
          maxReplicaCount: 1
          harness:
            name: exec
            args:
              - "/bin/cat"
              - "{taskspec}"
            dind: false
