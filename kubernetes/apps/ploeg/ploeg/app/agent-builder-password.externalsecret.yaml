---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-builder-password
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: agent-builder-password
    creationPolicy: Owner
  data:
    - {secretKey: FORGEJO_BOT_PASSWORD, remoteRef: {key: forgejo/agent-builder-password, property: password}}
