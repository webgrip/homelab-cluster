---
# The agent-reviewer bot token (minted by forgejo-actions-secrets'
# agent-reviewer-provisioner, seeded to OpenBao by its PushSecret). Ploeg's
# chart requires it as executor.forgejo.readTokenSecret from 0.4.0: a
# reading Role must never receive the read-write builder token (Ploeg
# ADR-0013 tier 1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-reviewer-token
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: agent-reviewer-token
    creationPolicy: Owner
  data:
    - {secretKey: FORGEJO_TOKEN, remoteRef: {key: forgejo/agent-reviewer, property: FORGEJO_TOKEN}}
