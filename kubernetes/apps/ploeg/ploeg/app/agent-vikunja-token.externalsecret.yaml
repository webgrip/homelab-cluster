---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-vikunja-token
  namespace: ploeg
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Vikunja API token of the agent bot user at vikunja.webgrip.dev (its Settings, API Tokens), written with bao kv put secret/vikunja/mcp api_token=-."
    wellhead.dev/verify.http.url: "https://vikunja.webgrip.dev/api/v1/projects"
    wellhead.dev/verify.http.auth: "bearer:api_token"
    wellhead.dev/verify: "http"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: agent-vikunja-token
    creationPolicy: Owner
  data:
    - {secretKey: VIKUNJA_API_TOKEN, remoteRef: {key: vikunja/mcp, property: api_token}}
