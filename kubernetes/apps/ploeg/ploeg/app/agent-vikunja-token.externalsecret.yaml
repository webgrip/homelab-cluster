---
# Vikunja API token for ploegd's tracker write-backs (backlog #31): the comment
# carrying the pull request link when a Shift closes, and the done status.
#
# Same OpenBao credential the mcp-vikunja gateway and the forgejo agent pool
# use. That is a deliberate reuse and also a known compromise: comments will
# appear under the MCP identity rather than a "ploeg" one, so the board cannot
# distinguish the dispatch plane from the other consumers of that token. A
# dedicated Vikunja user is the cleaner shape and needs an OpenBao entry plus a
# board user — worth doing before anyone relies on comment authorship for
# audit.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-vikunja-token
  namespace: ploeg
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: agent-vikunja-token
    creationPolicy: Owner
  data:
    - {secretKey: VIKUNJA_API_TOKEN, remoteRef: {key: vikunja/mcp, property: api_token}}
