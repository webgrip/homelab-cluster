---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ploeg
components:
  - ../../../../../components/cnpg-netpol
  # cnpg-monitoring removed 2026-08-04 — cluster-wide component, one install only
  # (apps/cnpg-system). See the note in vikunja's database kustomization: four copies
  # scraped every CNPG pod 4x and duplicated the CNPG alert rules.
  - ../../../../../components/cnpg-restore-test
  - ../../../../../components/cnpg-disaster-recovery
resources:
  - ./cluster.yaml
  - ./objectstore.yaml
  - ./scheduled-backup.yaml
  - ./scaler-password.externalsecret.yaml
  - ./grafana-ro.externalsecret.yaml
  - ./grafana-ro.pushsecret.yaml
patches:
  - path: ./backup/restore-test/cronjob-patch.yaml
  - path: ./backup/disaster-recovery/cluster-patch.yaml
  - path: ./backup/disaster-recovery/check-patch.yaml
