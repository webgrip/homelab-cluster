---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-disaster-recovery
  annotations:
    cnpg.io/hibernation: "off"
spec:
  externalClusters:
    - name: cnpg-disaster-recovery-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: ploeg-db-store
          serverName: ploeg-db
