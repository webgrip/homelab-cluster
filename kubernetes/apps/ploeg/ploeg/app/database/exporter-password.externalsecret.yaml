---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-exporter
spec:
  refreshInterval: "0"
  target:
    name: ploeg-exporter
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "ploeg_exporter"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
