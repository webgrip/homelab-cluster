---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ploeg-db
  annotations:
    kubectl.kubernetes.io/restartedAt: "2026-10-25T19:44:12Z"
  namespace: ploeg
  labels:
    monitoring.webgrip.io/enabled: "true"
spec:
  instances: 2
  # Burstable, not BestEffort (Talos PSI OOM controller kills BestEffort
  # first). The tables hold user content: run transcripts, uploaded context
  # files, notes, asks and chats.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Pin the DB off the soyo control-planes onto the worker pool (ADR-0002).
  affinity:
    nodeSelector:
      node.webgrip.io/pool: worker
    # CNPG's default anti-affinity is `preferred`, and until worker-2 joined on
    # 2026-08-02 exactly ONE node satisfied pool=worker — so both instances of
    # this 2-replica cluster ran on worker-1 and the PDB reported ALLOWED
    # DISRUPTIONS: 0. Two replicas, one failure domain: HA in name only.
    # `required` is satisfiable now that the pool has three nodes.
    enablePodAntiAffinity: true
    podAntiAffinityType: required
  inheritedMetadata:
    annotations:
      reloader.stakater.com/auto: "true"
  storage:
    resizeInUseVolumes: true
    size: 10Gi
    storageClass: longhorn
  walStorage:
    # 5Gi, not 2Gi: this volume is the buffer that absorbs a stalled archive, and
    # 2Gi is only ~128 WAL segments. Once it fills postgres cannot write WAL and
    # stops — the outage the separate volume exists to prevent. 5Gi is the floor
    # every other cluster already runs; ploeg and devex were the two outliers.
    # Raised ahead of the object store moving off-site, where a transient link
    # failure is a normal event rather than an incident.
    resizeInUseVolumes: true
    size: 5Gi
    storageClass: longhorn
  postgresql:
    shared_preload_libraries:
      - pg_stat_statements
    parameters:
      # Backup-tier policy (Tier 2): compress WAL full-page images.
      wal_compression: "zstd"
      shared_buffers: "128MB"
      effective_cache_size: "320MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ploeg-db-store
        serverName: ploeg-db
  managed:
    roles:
      # The metadata-only read role Ploeg grants to: ploeg_grant_observer()
      # (Ploeg migration 0072) gives it SELECT on the columns dashboards,
      # exporters and autoscalers need, never run tokens or text people,
      # agents or trackers wrote. Ploeg creates no roles, so it lives here.
      # The three readers below keep pg_read_all_data beside it until
      # ploegd runs ploeg_grant_observer() at boot; then that goes.
      - name: ploeg_observer
        ensure: present
        login: false
        superuser: false
        createdb: false
        createrole: false
        bypassrls: false
      # Read-only identity for the KEDA postgresql scaler (backlog item 47:
      # the scaler gets its own role, never the app credential). Password
      # generated in-cluster (scaler-password.externalsecret.yaml).
      - name: ploeg_scaler
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        bypassrls: false
        inRoles:
          - pg_read_all_data
          - ploeg_observer
        passwordSecret:
          name: ploeg-scaler
      # Read-only identity for the ploeg_* postgres-exporter, apart from the
      # KEDA one. Password generated in-cluster (exporter-password.externalsecret.yaml).
      - name: ploeg_exporter
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        bypassrls: false
        inRoles:
          - pg_read_all_data
          - ploeg_observer
        passwordSecret:
          name: ploeg-exporter
      # Read-only identity for Grafana's ploeg-db datasource (dark-factory
      # dispatch-plane dashboard SQL over the columns ploeg_observer reads).
      # Password generated in-cluster (grafana-ro.externalsecret.yaml) and
      # pushed to OpenBao so the observability namespace reads the SAME value.
      - name: grafana_ro
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        bypassrls: false
        inRoles:
          - pg_read_all_data
          - ploeg_observer
        passwordSecret:
          name: ploeg-grafana-ro
  bootstrap:
    initdb:
      database: app
      owner: app
