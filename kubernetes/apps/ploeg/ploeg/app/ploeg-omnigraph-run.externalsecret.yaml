---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-omnigraph-run
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: ploeg-omnigraph-run
    creationPolicy: Owner
  data:
    - {secretKey: token, remoteRef: {key: omnigraph/ploeg-run, property: token}}
