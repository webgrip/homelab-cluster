---
# The run actor's Omnigraph token (minted in namespace ai and pushed to
# OpenBao at omnigraph/ploeg-run). Only ploegd reads it, as
# PLOEG_OMNIGRAPH_RUN_TOKEN: it writes Work Item Notes to webgrip-notes and
# briefs Runs from both Tenant graphs. Worker pods never mount it
# (Ploeg ADR-0087, proposed).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-omnigraph-run
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: ploeg-omnigraph-run
    creationPolicy: Owner
  data:
    - {secretKey: token, remoteRef: {key: omnigraph/ploeg-run, property: token}}
