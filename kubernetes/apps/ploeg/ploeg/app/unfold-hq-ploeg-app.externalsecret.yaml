---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-hq-ploeg-app
  namespace: ploeg
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The GitHub App unfold-hq-ploeg on the unfold-hq organisation, installed on unfold-hq/unfold only: app_id and installation_id from its settings and installation pages, private_key a key generated on its settings page, webhook_secret the value entered as its webhook secret. Stored by the owner with bao kv put, see the runbook github-app-unfold-hq."
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: unfold-hq-ploeg-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        private-key.pem: "{{ .private_key }}"
        PLOEG_GITHUB_FORGE_SECRET: "{{ .webhook_secret }}"
        values.yaml: |
          ploeg:
            tracker:
              github:
                appId: "{{ .app_id }}"
                appPrivateKeySecret:
                  name: unfold-hq-ploeg-app
                  key: private-key.pem
            executor:
              github:
                url: https://github.com
                botLogin: "unfold-hq-ploeg[bot]"
                webhookSecret:
                  name: unfold-hq-ploeg-app
                  key: PLOEG_GITHUB_FORGE_SECRET
  data:
    - {secretKey: app_id, remoteRef: {key: github/unfold-hq-ploeg-app, property: app_id}}
    - {secretKey: private_key, remoteRef: {key: github/unfold-hq-ploeg-app, property: private_key}}
    - {secretKey: webhook_secret, remoteRef: {key: github/unfold-hq-ploeg-app, property: webhook_secret}}
