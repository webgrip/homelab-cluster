---
# Ploeg's first-party chart from the PRIVATE harbor.webgrip.dev/webgrip project.
# Renovate maintains tag+digest (regex manager + update-oci-digests.sh); the
# digest is added on the first Renovate pass after the initial publish.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ploeg
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.webgrip.dev/webgrip/charts/ploeg
  secretRef:
    name: harbor-pull
  ref:
    # HOLD at rc.6 (2026-07-26): rc.7 AND rc.8 both carry the broken worker
    # mint (mis-scoped keys, 422 revoke) — rc.8 is rc.7 + an unrelated CI
    # commit; the actual fix (PR #8, 1edb4af) is NOT yet merged. Roll forward
    # ONLY after `git merge-base --is-ancestor <fix-sha> <tag-sha>` passes for
    # the release being deployed (drill 600 catch #3). VIK-585.
    tag: 0.1.0-rc.6
    digest: sha256:e48ccd4a1d3b61e98227206c10df3c521a327f51dda9aedce57d2c9cfd6ec323
