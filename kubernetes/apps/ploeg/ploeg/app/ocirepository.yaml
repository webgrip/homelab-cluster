---
# Ploeg's first-party chart from the PRIVATE harbor.webgrip.dev/webgrip project.
# Renovate maintains tag+digest (regex manager + update-oci-digests.sh); the
# digest is added on the first Renovate pass after the initial publish.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ploeg
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.webgrip.dev/webgrip/charts/ploeg
  secretRef:
    name: harbor-pull
  ref:
    # rc.13 closes the write-back hole found in the 2026-07-30 e2e: a Shift
    # that opened a pull request settled `done` and told the board nothing,
    # because the notify was gated on needs_human. Also adds the two chart
    # keys this HelmRelease now sets — executor.serviceAccountName and
    # per-Role workerResources — so the tag and the values MUST move together;
    # on rc.12 the roles[].workerResources keys fail schema validation
    # outright (planRole is additionalProperties:false).
    tag: 0.2.0-rc.13
    # Read straight off the Harbor registry (HEAD /v2/…/manifests/0.2.0-rc.13)
    # after the Publish Helm chart (Harbor) job went green. Not the Forgejo
    # mirror's digest — that registry re-runs `helm package`, which is not
    # byte-reproducible, so it publishes the same chart under a different
    # digest (rc.10: 2f28764a there vs 754ce7a0 here). Kyverno's
    # require-ocirepository-digest makes this line mandatory, so it must move
    # with every tag bump.
    digest: sha256:9411f33cb0c9337b212cd9c90a4b6818a0fbbff600fc97629d3d0a7a8e48844e
