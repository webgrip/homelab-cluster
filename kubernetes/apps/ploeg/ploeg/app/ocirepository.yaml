---
# Ploeg's first-party chart from the PRIVATE harbor.webgrip.dev/webgrip project.
# Renovate maintains tag+digest (regex manager + update-oci-digests.sh); the
# digest is added on the first Renovate pass after the initial publish.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ploeg
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.webgrip.dev/webgrip/charts/ploeg
  secretRef:
    name: harbor-pull
  ref:
    tag: 0.2.0-rc.12
    # Read from the rc.12 release's own `helm push` output (run 132, Publish
    # Helm chart (Harbor)). Not the Forgejo mirror's digest — that registry
    # re-runs `helm package`, which is not byte-reproducible, so it publishes
    # the same chart under a different digest (rc.10: 2f28764a there vs
    # 754ce7a0 here). Kyverno's require-ocirepository-digest makes this line
    # mandatory, so it must move with every tag bump.
    digest: sha256:e90f4c50f32579f4a7354b3585ef38d9afcad52e2c9e3af49120611ebe2c29b7
