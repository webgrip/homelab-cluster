---
# Ploeg's first-party chart from the PRIVATE harbor.webgrip.dev/webgrip project.
# Renovate maintains tag+digest (regex manager + update-oci-digests.sh); the
# digest is added on the first Renovate pass after the initial publish.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ploeg
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.webgrip.dev/webgrip/charts/ploeg
  secretRef:
    name: harbor-pull
  ref:
    # 0.2.0-rc.3 (2026-07-27): layer-2 key revocation lands in ploegd — sweeper
    # revoke on lease expiry + boot orphan sweep (VIK-594, PR #13 merge 355910b;
    # chart wires LITELLM_ADMIN_URL + master key into ploegd from
    # executor.litellm). Also cosign sign/attest on the ploegd image (d85f084).
    # 0.2.0-rc.4: VIK-596 infra-failure classification + backoff (PR #14).
    # 0.2.0-rc.5: pluggable harness/agent-image/LLM-broker seams (PR #16) —
    # per-team `harness:` block; on older charts it is silently ignored.
    # 0.2.0-rc.6: VIK-597 run forensics — node+pod identity on checkpoints,
    # failure_reason taxonomy, scoped VIK-586 LLM-dead detection (PR #15).
    # Ancestry-verified via `git merge-base --is-ancestor` for 9a61909 before
    # this bump (drill 600 catch #3 rule). Digest from the release-90 chart
    # push log.
    # 0.2.0-rc.7: Work Target on the work item (migration 0007) — WITHOUT this
    # the work_items.route_rule column does not exist and no routing resolves.
    # 0.2.0-rc.8/9: Shifts end to end — engine, role-partitioned workloads,
    # Forgejo + Vikunja providers, findings on the PR, forge webhook route.
    #
    # !! FILL IN BEFORE MERGE !! The `config:` block in helmrelease.yaml needs
    # the chart that mounts it, which ships in the release cut from
    # webgrip/ploeg#<config-and-tier2>. Set the tag to that release and the
    # digest from its chart push log, then ancestry-verify with
    # `git merge-base --is-ancestor` per the drill-600 catch #3 rule.
    # Merging with rc.6 pinned leaves `config:` inert and routing unresolved.
    tag: 0.2.0-rc.6
    digest: sha256:6dda8ae2ce9f22bac67665bee5ad489f894dbc0e3251ce9a3e0574315023447c
