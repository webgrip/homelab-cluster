---
# Ploeg's first-party chart from the PRIVATE harbor.webgrip.dev/webgrip project.
# Renovate maintains tag+digest (regex manager + update-oci-digests.sh); the
# digest is added on the first Renovate pass after the initial publish.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ploeg
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.webgrip.dev/webgrip/charts/ploeg
  secretRef:
    name: harbor-pull
  ref:
    # rc.14 makes a reading Role able to review. Before it, a reader was
    # handed a shallow single-branch clone of the BASE — so it never received
    # the work it was asked to review — was never told the pull request
    # existed, and held a full push credential while the prompt told it it did
    # not (webgrip/ploeg#32). It also stops a successful Shift announcing
    # itself on the board as a stoppage.
    #
    # Tag and values move together: rc.14 is what the reviewer Role below
    # needs, and on an older chart roles[].workerResources fails schema
    # validation outright (planRole is additionalProperties:false).
    tag: 0.2.0-rc.14
    # Read straight off the Harbor registry (HEAD /v2/…/manifests/0.2.0-rc.14)
    # after the Publish Helm chart (Harbor) job went green. Not the Forgejo
    # mirror's digest — that registry re-runs `helm package`, which is not
    # byte-reproducible, so it publishes the same chart under a different
    # digest (rc.10: 2f28764a there vs 754ce7a0 here). Kyverno's
    # require-ocirepository-digest makes this line mandatory, so it must move
    # with every tag bump.
    digest: sha256:b8bccc91757da738d6a5313adc792dd1c84cfa9601bac42b85954078ecf16407
