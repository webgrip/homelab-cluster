---
# Ploeg's first-party chart from the PRIVATE harbor.webgrip.dev/webgrip project.
# Renovate maintains tag+digest (regex manager + update-oci-digests.sh); the
# digest is added on the first Renovate pass after the initial publish.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ploeg
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.webgrip.dev/webgrip/charts/ploeg
  secretRef:
    name: harbor-pull
  ref:
    # rc.17 closes the loop reviews were falling out of. Everything that
    # matters here landed in rc.15 and rc.16; rc.17 adds only a CI pin change,
    # and is taken because it is the tip, not for anything it carries. Three
    # fixes since rc.14, all found by running it here:
    #   - rc.15 settles spend. Without it `spent` stays 0 forever, and
    #     ClaimRole authorizes `budget − spent − reserved` — so the only thing
    #     holding a team to its pool was whatever happened to be running
    #     concurrently. This is the one with a live blast radius.
    #   - a reading Run's review now survives every harness (the drop box,
    #     ADR-0018): the outcome used to depend on which harness ran.
    #   - a failed writing Run re-opens its Round instead of stranding it.
    #
    # Tag and values move together, and this bump needs no values change: the
    # only schema movement since rc.14 is an additive optional
    # teams[].perRunBudget, and no migration file was added (0011 is still the
    # head), so the values below validate unchanged on rc.17.
    tag: 0.2.0-rc.17
    # Read straight off the Harbor registry (HEAD /v2/…/manifests/0.2.0-rc.17)
    # after the Publish Helm chart (Harbor) job went green. Not the Forgejo
    # mirror's digest — that registry re-runs `helm package`, which is not
    # byte-reproducible, so it publishes the same chart under a different
    # digest (rc.10: 2f28764a there vs 754ce7a0 here). Kyverno's
    # require-ocirepository-digest makes this line mandatory, so it must move
    # with every tag bump.
    digest: sha256:147fd681b5889395ddf7a699f76ff425730f823ac30253f1d6480f2dc12969b6
