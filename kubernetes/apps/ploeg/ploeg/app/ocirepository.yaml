---
# Ploeg's first-party chart from the PRIVATE harbor.webgrip.dev/webgrip project.
# Renovate maintains tag+digest (regex manager + update-oci-digests.sh); the
# digest is added on the first Renovate pass after the initial publish.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ploeg
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.webgrip.dev/webgrip/charts/ploeg
  secretRef:
    name: harbor-pull
  ref:
    tag: 0.2.0-rc.12
    # No digest: the rc.10 pin that used to sit here (sha256:754ce7a0…) belongs
    # to a DIFFERENT artifact, and Flux verifies tag against digest — leaving it
    # under this tag makes the fetch fail outright rather than pull the wrong
    # chart. rc.12's digest needs a credentialed read of the private Harbor
    # project, so Renovate's postUpgradeTask re-pins it on the next pass, the
    # same way this line first appeared.
