---
# Ploeg's first-party chart from the PRIVATE harbor.webgrip.dev/webgrip project.
# Renovate maintains tag+digest (regex manager + update-oci-digests.sh); the
# digest is added on the first Renovate pass after the initial publish.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ploeg
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.webgrip.dev/webgrip/charts/ploeg
  secretRef:
    name: harbor-pull
  ref:
    # ROLLBACK rc.7 -> rc.6 (2026-07-25): rc.7's worker-owned key mint scopes
    # keys to the unstripped "litellm_proxy/<model>" name, so every run's LLM
    # call 401s (can_key_call_model) — the factory cannot fix its own bug while
    # running the bug. rc.6 = entrypoint minting (works) + Guaranteed QoS.
    # Roll forward when rc.8 lands with both wire-format fixes (VIK-585).
    tag: 0.1.0-rc.6
    digest: sha256:e48ccd4a1d3b61e98227206c10df3c521a327f51dda9aedce57d2c9cfd6ec323
