---
# Ploeg's first-party chart from the PRIVATE harbor.webgrip.dev/webgrip project.
# Renovate maintains tag+digest (regex manager + update-oci-digests.sh); the
# digest is added on the first Renovate pass after the initial publish.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ploeg
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.webgrip.dev/webgrip/charts/ploeg
  secretRef:
    name: harbor-pull
  ref:
    # 0.2.0-rc.1 (2026-07-27): first tag carrying the worker key-lifecycle fix
    # (1edb4af, VIK-585) — ancestry-verified via `git merge-base --is-ancestor`
    # before this bump (drill 600 catch #3 rule; rc.7–rc.10 predate the fix).
    # Digest from the release-65 chart push log.
    tag: 0.2.0-rc.1
    digest: sha256:edee30199819cf52a7bacd30fb9acf8f458a1338b0f46ab8782e3e826a944106
