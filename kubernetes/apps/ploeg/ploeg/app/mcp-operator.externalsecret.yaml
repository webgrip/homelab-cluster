---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-mcp-operator
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0"
  target:
    name: ploeg-mcp-operator
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: password, target: token}
