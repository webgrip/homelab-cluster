---
# ploeg-mcp's execute-capable Operator Consumer (Ploeg ADR-0108): its bearer
# token is generated in the cluster and read by both ploegd (consumer
# mcp-operator) and ploeg-mcp (PLOEG_MCP_TOKEN_OPERATORS), so no person ever
# handles it. refreshInterval "0" keeps the first generated value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-mcp-operator
spec:
  refreshInterval: "0"
  target:
    name: ploeg-mcp-operator
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: password, target: token}
