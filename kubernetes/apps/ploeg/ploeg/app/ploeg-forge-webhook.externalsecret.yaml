---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-forge-webhook
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: ploeg-forge-webhook
    creationPolicy: Owner
  data:
    - {secretKey: PLOEG_FORGEJO_SECRET, remoteRef: {key: forgejo/ploeg-forge-webhook, property: PLOEG_FORGEJO_SECRET}}
