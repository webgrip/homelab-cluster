---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-worker-bootstrap
spec:
  refreshInterval: "0"
  refreshPolicy: OnChange
  target:
    name: ploeg-worker-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        bronze--builder: "{{ .bronze_builder }}"
        bronze--reviewer: "{{ .bronze_reviewer }}"
        silver--builder: "{{ .silver_builder }}"
        silver--reviewer: "{{ .silver_reviewer }}"
        copper--default: "{{ .copper_default }}"
        registry.json: >-
          [{"team":"bronze","role":"builder","token":{{ .bronze_builder | toJson }}},
          {"team":"bronze","role":"reviewer","token":{{ .bronze_reviewer | toJson }}},
          {"team":"silver","role":"builder","token":{{ .silver_builder | toJson }}},
          {"team":"silver","role":"reviewer","token":{{ .silver_reviewer | toJson }}},
          {"team":"copper","role":"","token":{{ .copper_default | toJson }}}]
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: password, target: bronze_builder}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: password, target: bronze_reviewer}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: password, target: silver_builder}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: password, target: silver_reviewer}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
      rewrite:
        - regexp: {source: password, target: copper_default}
