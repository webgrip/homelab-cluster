---
# Egress for ADR-0084, on top of the namespace's default-deny. The runner
# reaches Anthropic (queue, session stream, inference, JWKS), the public
# Forgejo host through the external gateway (split DNS resolves it to
# envoy-external) and ploegd in-namespace. pewter's workers additionally
# reach Anthropic to log in and dispatch; they already reach the forge and
# ploegd through ploeg-allow-egress. Session code is model-directed, so
# nothing else is open.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-runner-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: claude-runner
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.anthropic.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/instance: alloy-gateway
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pewter-worker-anthropic-egress
spec:
  endpointSelector:
    matchLabels:
      ploeg.webgrip.dev/team: pewter
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: platform.claude.com
        - matchName: console.anthropic.com
        - matchName: claude.ai
        - matchName: claude.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
