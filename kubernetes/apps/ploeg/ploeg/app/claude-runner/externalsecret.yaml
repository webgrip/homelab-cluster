---
# Ploeg ADR-0084. The self-hosted Claude environment's key: it registers the
# runner with the environment `unfold-spike` in the WebGrip Team org. Seeded
# by a person from the claude.ai admin page (shown once, valid 365 days).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-runner-environment
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: claude-runner-environment
    creationPolicy: Owner
  data:
    - {secretKey: SELF_HOSTED_RUNNER_ENVIRONMENT_SECRET, remoteRef: {key: anthropic/claude-runner, property: SELF_HOSTED_RUNNER_ENVIRONMENT_SECRET}}
---
# The Team member login the pewter workers dispatch sessions with: a
# `claude auth login` refresh token and its scopes. Anthropic caps the
# session-control scope at 30 days, so a person renews it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pewter-claude-login
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: pewter-claude-login
    creationPolicy: Owner
  data:
    - {secretKey: refreshToken, remoteRef: {key: anthropic/claude-team-login, property: refreshToken}}
    - {secretKey: scopes, remoteRef: {key: anthropic/claude-team-login, property: scopes}}
