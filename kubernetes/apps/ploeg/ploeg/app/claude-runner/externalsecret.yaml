---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-runner-environment
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The self-hosted Claude environment key for the environment unfold-spike in the WebGrip Team org, from the claude.ai admin page (shown once, valid 365 days)."
    wellhead.dev/verify.format.SELF_HOSTED_RUNNER_ENVIRONMENT_SECRET: "\\S{20,}"
    wellhead.dev/lifetime: "365d"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: claude-runner-environment
    creationPolicy: Owner
  data:
    - {secretKey: SELF_HOSTED_RUNNER_ENVIRONMENT_SECRET, remoteRef: {key: anthropic/claude-runner, property: SELF_HOSTED_RUNNER_ENVIRONMENT_SECRET}}
