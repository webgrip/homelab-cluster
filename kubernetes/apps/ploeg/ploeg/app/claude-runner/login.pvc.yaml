---
# The Team member login pewter's workers dispatch with: a Claude config
# directory a person signs in to once (`claude auth login`, recipe in
# ploeg-hq/ploeg ops/claude-runner/README.md). The CLI refreshes it in place;
# Anthropic caps the login at 30 days, so a person signs in again. One
# pewter worker at a time (maxReplicaCount: 1) shares it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pewter-claude-login
  labels:
    app.kubernetes.io/part-of: ploeg
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-general
