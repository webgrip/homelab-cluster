---
# Zero-trust for ploeg. The namespace label generates default-deny
# (ingress+egress) + allow-dns. Flow: vikunja webhook -> ploegd:8080 -> db:5432
# (CNPG); the KEDA operator polls ploeg-db directly for the ScaledJob triggers.
# API-server egress for CNPG comes from components/cnpg-netpol (identity-based —
# never an ipBlock, the Cilium reserved-identity trap).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ploeg-allow-ingress
  labels:
    app.kubernetes.io/part-of: ploeg
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # intra-namespace: ploegd -> db, workers -> ploegd, db replication
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ploeg
    # Vikunja (webhook sender) -> ploegd
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vikunja
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
      ports:
        - protocol: TCP
          port: 8080
    # KEDA operator -> ploeg-db (postgresql scaler poll). A silently blocked
    # scaler poll crashloops the keda operator (forgejo netpol incident).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 5432
    # Prometheus (observability ns) scraping db metrics (cnpg-monitoring)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
    # CNPG operator (cnpg-system) -> instance status (8000) + Postgres (5432).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ploeg-allow-egress
  labels:
    app.kubernetes.io/part-of: ploeg
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # intra-namespace: ploegd -> db, workers -> ploegd, db replication
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ploeg
    # OpenHands workers -> LiteLLM (ai ns, in-cluster: proxy /v1 + admin key
    # mint/revoke on the same port).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
      ports:
        - protocol: TCP
          port: 4000
    # OpenHands workers -> Forgejo (clone/push as agent-builder, PR API).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
      ports:
        - protocol: TCP
          port: 3000
    # ploegd -> Vikunja API. NOT optional: with routing-as-a-file the projects
    # are NAMED, and ploegd resolves those names to ids at boot and exits when
    # the lookup fails — so without this rule the daemon cannot start at all, it
    # does not merely lose write-backs. The LAN ipBlock above does not cover it:
    # the 10.0.0.27 ingress VIP is DNAT'd to a backend pod before policy is
    # evaluated, so the packet is matched against a 10.42.x.x pod IP that no rule
    # allows. Hence the in-cluster service, same shape as ai/forgejo above.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vikunja
      ports:
        - protocol: TCP
          port: 3456
