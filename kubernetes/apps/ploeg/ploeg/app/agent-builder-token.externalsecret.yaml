---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-builder-token
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: agent-builder-token
    creationPolicy: Owner
  data:
    - {secretKey: FORGEJO_TOKEN, remoteRef: {key: forgejo/agent-builder, property: FORGEJO_TOKEN}}
