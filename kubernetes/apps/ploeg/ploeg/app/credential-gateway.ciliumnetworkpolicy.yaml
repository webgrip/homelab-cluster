---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-credential-gateway-apiserver
spec:
  endpointSelector:
    matchExpressions:
      - key: ploeg.webgrip.dev/component
        operator: In
        values:
          - daemon
          - credential-gateway
          - claude-runner-orchestrator
  egress:
    - toEntities:
        - kube-apiserver
