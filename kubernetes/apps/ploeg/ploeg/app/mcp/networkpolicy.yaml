---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ploeg-mcp-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ploeg-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
      ports:
        - protocol: TCP
          port: 8090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ploeg-mcp-gateway-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ploeg-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
