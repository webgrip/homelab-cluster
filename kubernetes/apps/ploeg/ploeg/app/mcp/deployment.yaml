---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ploeg-mcp
  labels:
    app.kubernetes.io/name: ploeg-mcp
    app.kubernetes.io/part-of: ploeg
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ploeg-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ploeg-mcp
        app.kubernetes.io/part-of: ploeg
    spec:
      nodeSelector:
        node.webgrip.io/pool: worker
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ploeg-mcp
          # renovate: datasource=docker depName=harbor.webgrip.dev/ghcr/ploeg-hq/ploegd
          image: harbor.webgrip.dev/ghcr/ploeg-hq/ploegd:0.2.0-rc.23@sha256:7837c980d8e274c36ced2978cfb8e147d42c0aa43c1076ebb163419e300ee819
          command: ["/usr/local/bin/ploeg-mcp"]
          args: ["http"]
          env:
            - name: PLOEG_URL
              value: http://ploeg.ploeg.svc.cluster.local:8080
            - name: PLOEG_MCP_LISTEN
              value: ":8090"
            - name: PLOEG_MCP_RESOURCE
              value: https://mcp-ploeg.${SECRET_DOMAIN}/mcp
            - name: PLOEG_MCP_ISSUER
              value: https://authentik.${SECRET_DOMAIN}/application/o/ploeg-mcp/
            - name: PLOEG_MCP_CLIENT_IDS
              value: ploeg-mcp
            - name: PLOEG_MCP_SCOPE
              value: ploeg:read
            - name: PLOEG_MCP_REQUEST_SCOPES
              value: openid ploeg:read offline_access
            - name: PLOEG_MCP_GROUPS
              value: '[{"group":"ploeg-operators","tokenEnv":"PLOEG_MCP_TOKEN_OPERATORS","execute":true},{"group":"ploeg-readers","tokenEnv":"PLOEG_MCP_TOKEN_READERS"}]'
            # Name people with the namespace their person id was first recorded
            # under, so one person is one id across every Operator Consumer.
            - name: PLOEG_MCP_SUBJECT_NAMESPACE
              value: https://authentik.${SECRET_DOMAIN}/application/o/vloer/
            - name: PLOEG_MCP_TOKEN_OPERATORS
              valueFrom:
                secretKeyRef:
                  name: ploeg-mcp-operator
                  key: token
          envFrom:
            - secretRef:
                name: ploeg-mcp-consumers
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
