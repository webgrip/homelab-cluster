---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-mcp-consumers
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: ploeg-mcp-consumers
    creationPolicy: Owner
  data:
    - {secretKey: PLOEG_MCP_TOKEN_READERS, remoteRef: {key: ploeg/mcp-reader, property: PLOEG_MCP_TOKEN}}
