---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-mcp-reader
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: ploeg-mcp-reader
    creationPolicy: Owner
  data:
    - {secretKey: token, remoteRef: {key: ploeg/mcp-reader, property: PLOEG_MCP_TOKEN}}
