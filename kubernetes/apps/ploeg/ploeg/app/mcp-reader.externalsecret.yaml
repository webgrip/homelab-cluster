---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-mcp-reader
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The bearer token of ploeg-mcp's read-only operator consumer: any long random value, typed or left empty to generate. ploegd and ploeg-mcp both read it."
    wellhead.dev/generate: "PLOEG_MCP_TOKEN"
    wellhead.dev/verify.format.PLOEG_MCP_TOKEN: "\\S{32,}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target:
    name: ploeg-mcp-reader
    creationPolicy: Owner
  data:
    - {secretKey: token, remoteRef: {key: ploeg/mcp-reader, property: PLOEG_MCP_TOKEN}}
