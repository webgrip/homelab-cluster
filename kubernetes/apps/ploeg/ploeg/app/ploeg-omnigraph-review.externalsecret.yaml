---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ploeg-omnigraph-review
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: ploeg-omnigraph-review
    creationPolicy: Owner
  data:
    - {secretKey: token, remoteRef: {key: omnigraph/ploeg-review, property: token}}
