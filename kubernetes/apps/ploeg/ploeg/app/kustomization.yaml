---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./harbor-pull.externalsecret.yaml
  - ./agent-vikunja-token.externalsecret.yaml
  - ./webhook-secret.externalsecret.yaml
  - ./ploeg-omnigraph-run.externalsecret.yaml
  - ./agent-builder-token.externalsecret.yaml
  - ./agent-reviewer-token.externalsecret.yaml
  - ./agent-builder-password.externalsecret.yaml
  - ./ploeg-forge-webhook.externalsecret.yaml
  - ./agent-litellm-master.externalsecret.yaml
  - ./worker-signing.externalsecret.yaml
  - ./worker-bootstrap.externalsecret.yaml
  - ./unfold-operator.externalsecret.yaml
  - ./unfold-verifier.externalsecret.yaml
  # Ploeg ADR-0084: team pewter's Runs execute on a self-hosted Claude runner.
  - ./claude-runner/externalsecret.yaml
  - ./claude-runner/login.pvc.yaml
  - ./claude-runner/deployment.yaml
  - ./claude-runner/networkpolicy.yaml
  - ./mcp-reader.externalsecret.yaml
  - ./mcp-operator.externalsecret.yaml
  - ./mcp/externalsecret.yaml
  - ./mcp/deployment.yaml
  - ./mcp/service.yaml
  - ./mcp/httproute.yaml
  - ./mcp/networkpolicy.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./tracker-wiring.cronjob.yaml
  - ./sandbox-launcher.ciliumnetworkpolicy.yaml
  - ./kata-clusterip-probe.job.yaml
  - ./runc-clusterip-probe.job.yaml
  - ./worker-egress-probe.job.yaml
  # postgres-exporter over the dispatch DB — ploeg_* metrics for the dark-factory
  # dashboards + alerts (ploegd ships no /metrics of its own). Reads via the
  # existing read-only ploeg_scaler role; observability->:9187 and exporter->db
  # egress are both already covered by the namespace's netpol.
  - ./exporter/exporter-queries.configmap.yaml
  - ./exporter/deployment.yaml
  - ./exporter/service.yaml
  - ./exporter/vmservicescrape.yaml
  # ./database is reconciled by its own Kustomization (ploeg-db in ks.yaml)
  # so the app layer can depend on a HEALTHY database, not just applied CRs.
