---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freshrss-secrets
  namespace: freshrss
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "App secrets written once and copied to OpenBao by their PushSecret; they include an at-rest key the app encrypts its data with. Restore the values from OpenBao's history, never new ones. FreshRSS keeps its admin login in its own database."
    wellhead.dev/fields: "FRESHRSS_ADMIN_EMAIL FRESHRSS_ADMIN_PASSWORD FRESHRSS_BASE_URL FRESHRSS_DEFAULT_USER FRESHRSS_EXTENSIONS_ARCHIVE_URL FRESHRSS_EXTENSIONS_VERSION POSTGRES_DB POSTGRES_HOST POSTGRES_PASSWORD POSTGRES_SUPERUSER_PASSWORD POSTGRES_USER"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "none"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: freshrss-secrets, creationPolicy: Owner}
  dataFrom:
    - extract: {key: freshrss/app}
