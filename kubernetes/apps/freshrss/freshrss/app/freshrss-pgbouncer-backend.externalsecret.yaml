---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freshrss-pgbouncer-backend
  namespace: freshrss
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao-db}
  target:
    name: freshrss-pgbouncer-backend
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/ignore: "true"
      data:
        databases.ini: |
          [databases]
          freshrss = host=freshrss-db-rw.freshrss.svc.cluster.local port=5432 dbname=freshrss user={{ .username }} password={{ .password }}
  dataFrom:
    - extract:
        key: creds/freshrss
