---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freshrss-vault-admin
  namespace: freshrss
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: freshrss-vault-admin, creationPolicy: Owner}
  dataFrom:
    - extract: {key: db-admin/freshrss}
