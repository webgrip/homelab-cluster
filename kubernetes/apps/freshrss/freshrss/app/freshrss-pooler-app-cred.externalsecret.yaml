---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freshrss-pooler-app-cred
  namespace: freshrss
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0" # generate once, never rotate (stable app<->pooler identity)
  target:
    name: freshrss-pooler-app-cred
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        userlist.txt: |
          "freshrss" "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
