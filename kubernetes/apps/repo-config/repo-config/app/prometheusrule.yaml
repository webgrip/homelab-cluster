---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forgejo-repo-config
  labels:
    app.kubernetes.io/name: forgejo-repo-config
    release: kube-prometheus-stack
spec:
  groups:
    - name: forgejo-repo-config.rules
      rules:
        - alert: ForgejoRepoConfigNotReady
          expr: |
            max by (terraform_namespace, terraform_name) (
              tofu_terraform_status_condition{
                terraform_namespace="repo-config",
                terraform_name="repo-config",
                type="Ready",
                status!="True",
                reason!="TerraformAppliedSucceed"
              }
            ) == 1
          for: 3h
          labels:
            severity: warning
            owner: platform
            service: forgejo
          annotations:
            summary: "Forgejo repo-config Terraform not Ready for 3h (repo-config/repo-config)"
            description: |-
              What's happening:
              - The repo-config Terraform object in namespace repo-config has not been Ready for three hourly reconciles.
              - Plans apply automatically (approvePlan auto); the hour after an apply reads Ready Unknown with reason TerraformAppliedSucceed and is excluded.

              Impact/risk:
              - Repository settings and branch protection drift in Forgejo is neither planned nor corrected.

              Likely causes:
              - OpenBao login failed (role forgejo-repo-config, secret/forgejo/repo-config missing)
              - The bot token was revoked or lost repo admin (team repo-config)
              - A model edit that fails a precondition, prevent_destroy, or the provider schema
              - registry.opentofu.org unreachable during tofu init

              First actions:
              - kubectl -n repo-config get terraform repo-config -o yaml
              - kubectl -n repo-config logs -l app.kubernetes.io/part-of=forgejo-repo-config
              - kubectl -n forgejo logs job/repo-config-provisioner
              - docs/techdocs/docs/rfc/rfc-forgejo-repo-config-gitops.md
        - alert: ForgejoRepoConfigApplyChangedSomething
          expr: |
            max by (terraform_namespace, terraform_name) (
              tofu_terraform_status_condition{
                terraform_namespace="repo-config",
                terraform_name="repo-config",
                type="Ready",
                reason="TerraformAppliedSucceed"
              }
            ) == 1
          for: 5m
          labels:
            severity: info
            owner: platform
            service: forgejo
          annotations:
            summary: "Forgejo repo-config applied a non-empty plan (repo-config/repo-config)"
            description: |-
              What's happening:
              - The last hourly reconcile of the repo-config Terraform object applied changes to Forgejo.
              - A plan with no changes is never applied, so this fires only when tofu changed a repository setting, a branch protection rule, or the renovate_policy_drift output.

              Impact/risk:
              - Expected right after a model commit. Without one, somebody changed Forgejo by hand and tofu reverted it.

              Likely causes:
              - A model change in kubernetes/apps/repo-config/repo-config/model was merged
              - A hand edit in the Forgejo UI or API (forgejo-sync.sh, a PATCH) drifted a setting tofu owns
              - The renovate_policy_drift output changed (state only, nothing written to Forgejo): a repo's Renovate extends drifted from the model or lost its pin, or came back in line

              First actions:
              - git log -3 -- kubernetes/apps/repo-config/repo-config
              - kubectl -n repo-config get configmap tfplan-default-repo-config -o jsonpath='{.data}'
              - docs/techdocs/docs/general/delivery-chain-external-state.md
        - alert: ForgejoRepositoryNotInRepoConfigModel
          expr: |
            last_over_time(repo_config_unmodelled_repository{job="repo-config-inventory"}[2h]) == 1
          for: 2h
          labels:
            severity: warning
            owner: platform
            service: forgejo
          annotations:
            summary: "Forgejo repository {{ $labels.repository }} is outside the repo-config model (repo-config/{{ $labels.repository }})"
            description: |-
              What's happening:
              - webgrip/{{ $labels.repository }} on Forgejo is neither archived nor a mirror, and kubernetes/apps/repo-config/repo-config/model/repos.yaml has no entry for it.
              - The repo-config-inventory CronJob reads the organisation hourly with a read-only token, so private repositories count too.

              Impact/risk:
              - tofu gives the repository no branch protection, no tag protection and no settings: anyone with write access pushes main directly.

              Likely causes:
              - A repository was created in the Forgejo UI or by an agent without a model entry
              - A repository was unarchived or converted from a mirror

              First actions:
              - Add the repository to repos.yaml with its kind (see the Forgejo branch protection runbook), or archive it
              - kubectl -n repo-config logs job/<latest repo-config-inventory job>
        - alert: ForgejoRepoInventoryStale
          expr: |
            (
              time() - max(last_over_time(repo_config_inventory_last_success_timestamp_seconds{job="repo-config-inventory"}[1d]))
              > 3 * 3600
            )
            or
            absent_over_time(repo_config_inventory_last_success_timestamp_seconds{job="repo-config-inventory"}[1d])
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: forgejo
          annotations:
            summary: "The Forgejo repository inventory has not succeeded for three hours (repo-config/repo-config-inventory)"
            description: |-
              What's happening:
              - The hourly CronJob repo-config/repo-config-inventory has not pushed a successful result to vmagent for more than three hours, or never did.

              Impact/risk:
              - ForgejoRepositoryNotInRepoConfigModel goes blind: a new repository outside the model gets no branch protection and nobody hears about it.

              Likely causes:
              - Secret repo-config-inventory-forgejo is empty: OpenBao has no secret/forgejo/repo-config-inventory yet (job forgejo/repo-config-provisioner mints it)
              - The token sees no private repository (scopes or team repo-config membership lost)
              - Forgejo or vmagent unreachable, or a network policy blocks the pod
              - The CronJob is suspended or cannot schedule on the worker pool

              First actions:
              - kubectl -n repo-config get cronjob,jobs -l app.kubernetes.io/name=repo-config-inventory
              - kubectl -n repo-config logs job/<latest repo-config-inventory job>
              - kubectl -n forgejo logs job/repo-config-provisioner
              - kubectl -n repo-config create job --from=cronjob/repo-config-inventory repo-config-inventory-manual
        - alert: AgentStandardsPinBehindForADay
          expr: |
            last_over_time(repo_config_shared_pin_releases_behind{job="repo-config-inventory", package="agent-standards"}[2h]) > 0
          for: 24h
          labels:
            severity: warning
            owner: platform
            service: forgejo
          annotations:
            summary: "webgrip/{{ $labels.repository }} has pinned an older agent-standards release for a day (repo-config/{{ $labels.repository }})"
            description: |-
              What's happening:
              - The hourly repo-config inventory has read an agent-standards pin in apm.yml or mise.toml on the default branch of webgrip/{{ $labels.repository }} that is {{ $value }} release(s) behind, without a break, for 24 hours.
              - Every repository is meant to run the newest agent-standards release within a day: the reviewed and unattended gates of webgrip/renovate-config open the bump without a dashboard tick and merge it on green.

              Impact/risk:
              - Agents in that repository work from older rules, skills and hooks than the rest of the estate.

              Likely causes:
              - The bump pull request is open and waits for an approval (a core repository) or a red check
              - The repository's renovate.json extends no gate, so the bump waits for a dashboard tick
              - The post-upgrade agentstd install failed, so Renovate produced no branch

              First actions:
              - Open the repository's Renovate Dependency Dashboard issue and its open chore(agents) pull request
              - kubectl -n renovate get jobs --sort-by=.metadata.creationTimestamp, then the logs of the latest webgrip-forgejo job for {{ $labels.repository }}
              - docs/techdocs/docs/general/delivery-estate.md
