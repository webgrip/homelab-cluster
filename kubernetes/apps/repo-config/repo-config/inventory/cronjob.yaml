---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: repo-config-inventory
  labels:
    app.kubernetes.io/name: repo-config-inventory
spec:
  schedule: "17 * * * *"
  timeZone: Europe/Amsterdam
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: repo-config-inventory
        spec:
          serviceAccountName: repo-config-inventory
          automountServiceAccountToken: false
          restartPolicy: Never
          priorityClassName: background-batch
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: inventory
              image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
              imagePullPolicy: IfNotPresent
              command:
                - "python3"
                - "-I"
                - "/scripts/repo_config_inventory.py"
              env:
                - {name: FORGEJO_URL, value: 'http://forgejo-http.forgejo.svc.cluster.local:3000'}
                - {name: FORGEJO_OWNER, value: webgrip}
                - {name: FORGEJO_TOKEN_PATH, value: /forgejo/FORGEJO_TOKEN}
                - {name: MODEL_PATH, value: /model/repos.yaml}
                - {name: METRICS_URL, value: 'http://vmagent-vmagent.observability.svc.cluster.local:8429/api/v1/import/prometheus?extra_label=job=repo-config-inventory'}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: script, mountPath: /scripts, readOnly: true}
                - {name: model, mountPath: /model, readOnly: true}
                - {name: forgejo, mountPath: /forgejo, readOnly: true}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 16Mi}
            - name: script
              configMap:
                name: repo-config-inventory-script
            - name: model
              configMap:
                name: repo-config-model
            - name: forgejo
              secret:
                secretName: repo-config-inventory-forgejo
                optional: true
