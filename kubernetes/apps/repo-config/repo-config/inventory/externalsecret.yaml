---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-config-inventory-forgejo
  labels:
    app.kubernetes.io/name: repo-config-inventory
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: repo-config-inventory-forgejo, creationPolicy: Owner}
  data:
    - {secretKey: FORGEJO_TOKEN, remoteRef: {key: forgejo/repo-config-inventory, property: FORGEJO_TOKEN}}
