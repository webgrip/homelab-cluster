---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: repo-config-inventory-allow-forgejo-and-vmagent
  labels:
    app.kubernetes.io/name: repo-config-inventory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: repo-config-inventory
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo
              app.kubernetes.io/instance: forgejo
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8429
