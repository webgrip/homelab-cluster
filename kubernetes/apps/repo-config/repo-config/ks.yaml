---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: repo-config
spec:
  dependsOn:
    - name: tofu-controller
      namespace: flux-system
    - name: forgejo-actions-secrets
      namespace: forgejo
    - name: external-secrets-stores
      namespace: security
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/repo-config/repo-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: repo-config
  wait: false
