---
# yaml-language-server: $schema=./schema/repos.schema.json
apiVersion: repo-config.webgrip.io/v1alpha1
kind: RepoSet
forgejo:
  owner: webgrip
github:
  owners:
    ploeg-hq:
      app_secret_path: github/ploeg-hq-app
    webgrip:
      app_secret_path: github/webgrip-app
repos:
  ".profile":
    forge: forgejo
    kind: none
    renovate:
      absent: true
  action-typescript-template:
    forge: forgejo
    settings:
      archived: true
  agent-standards:
    forge: forgejo
    kind: package
    core: true
    settings:
      default_delete_branch_after_merge: false
    branches:
      main:
        status_checks:
          - "CI / Packages install, compile and audit (pull_request)"
  ai-skills:
    forge: forgejo
    kind: package
    core: true
    branches:
      main:
        status_checks:
          - "CI / Manifests, dist & plugin tests (pull_request)"
  application-template:
    forge: forgejo
    settings:
      archived: true
  backstage-application:
    forge: forgejo
    settings:
      archived: true
  claude-config:
    forge: forgejo
    settings:
      archived: true
      has_releases: false
    branches:
      main:
        status_checks: []
  cloudflare:
    forge: forgejo
    kind: config
    renovate:
      gate: reviewed
  compyutah:
    forge: forgejo
    kind: none
    staged: true
    renovate:
      absent: true
    settings:
      private: true
  common-charts:
    forge: forgejo
    settings:
      archived: true
  counterscale:
    forge: forgejo
    kind: site
    staged: true
  discord-moon:
    forge: forgejo
    settings:
      archived: true
  erfbeeld:
    forge: forgejo
    kind: service
    staged: true
    settings:
      private: true
  fogbell:
    forge: forgejo
    kind: service
    staged: true
    renovate:
      config_file: renovate.json5
      presets:
        - "local>webgrip/renovate-config:reviewed"
        - "local>webgrip/renovate-config:golang"
  freshrss-application:
    forge: forgejo
    settings:
      archived: true
  frontend-toolkit:
    forge: forgejo
    kind: package
    core: true
  homelab-cluster:
    forge: forgejo
    kind: config
    core: true
    renovate:
      config_file: ".renovaterc.json5"
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:gitops"
        - "local>webgrip/renovate-config:apm"
        - "docker:enableMajor"
        - ":automergePr"
    branches:
      main:
        status_checks:
          - "e2e / Lint & static validation (pull_request)"
          - "e2e / Flux-local render (pull_request)"
          - "e2e / Kyverno Chainsaw (KinD) (pull_request)"
          - "e2e / Validate Renovate config (pull_request)"
  infrastructure:
    forge: forgejo
    kind: image-set
    core: true
    staged: true
  invoiceninja-application:
    forge: forgejo
    settings:
      archived: true
  ledgerflow:
    forge: forgejo
    settings:
      archived: true
  monitoring-platform:
    forge: forgejo
    settings:
      archived: true
  obsidian-vault:
    forge: forgejo
    kind: none
    writer: ryangr0
    renovate:
      absent: true
    settings:
      private: true
      default_delete_branch_after_merge: false
  omnigraph-explorer:
    forge: forgejo
    kind: service
    staged: true
    settings:
      private: true
    branches:
      main:
        status_checks:
          - "On Pull Request / checks (pull_request)"
  ploeg-bench:
    forge: forgejo
    kind: none
    renovate:
      absent: true
    settings:
      private: true
  ploeg-bench-world:
    forge: forgejo
    kind: none
    renovate:
      absent: true
    settings:
      private: true
  previews:
    forge: forgejo
    kind: none
    writer: agent-builder
    renovate:
      absent: true
    settings:
      private: true
  renovate-config:
    forge: forgejo
    kind: package
    core: true
    staged: true
    branches:
      main:
        status_checks:
          - "Validate Renovate presets / validate all presets (pull_request)"
          - "Validate Renovate presets / presets are generated and behave (pull_request)"
  searxng-application:
    forge: forgejo
    settings:
      archived: true
  seekframe:
    forge: forgejo
    kind: service
    staged: true
  semantic-release-config:
    forge: forgejo
    kind: package
    core: true
    staged: true
    renovate:
      presets:
        - "local>webgrip/renovate-config:unattended"
        - "local>webgrip/renovate-config:platform-automerge"
    branches:
      main:
        status_checks:
          - "* / gate (pull_request)"
      development:
        status_checks:
          - "* / gate (pull_request)"
  talos-kata-extension:
    forge: forgejo
    kind: image-set
    settings:
      private: true
    branches:
      main:
        status_checks:
          - "\\[Workflow\\] On Source Change / checks (pull_request)"
  techdocs-builder:
    forge: forgejo
    settings:
      archived: true
  techdocs-runner:
    forge: forgejo
    settings:
      archived: true
  telemetry-service:
    forge: forgejo
    settings:
      archived: true
  traefik-local-development:
    forge: forgejo
    settings:
      archived: true
  twente.dev:
    forge: forgejo
    kind: site
    staged: true
    settings:
      allow_squash_merge: false
  unfold:
    forge: forgejo
    kind: service
    staged: true
    renovate:
      presets:
        - "local>webgrip/renovate-config:unattended"
        - "local>webgrip/renovate-config:platform-automerge"
    branches:
      main:
        status_checks:
          - "* / gate (pull_request)"
      development:
        push: []
        merge:
          - ryangr0
          - yon
          - renovate
          - ploeg-release
        status_checks:
          - "* / gate (pull_request)"
  unfold-cluster:
    forge: forgejo
    kind: config
    core: true
    renovate:
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:gitops"
        - "local>webgrip/renovate-config:forgejo"
        - "local>webgrip/renovate-config:apm"
        - "local>webgrip/renovate-config:first-party"
    branches:
      main:
        push: []
        merge:
          - ryangr0
        status_checks:
          - "infra-check / check (pull_request)"
          - "infra-check / token-mask-canary (pull_request)"
          - "infra-check / token-mask-proof (pull_request)"
          - "admission-policies-check / fixtures (pull_request)"
          - "runtime-security-check / checks (pull_request)"
          - "supply-chain-check / image-signatures (pull_request)"
          - "supply-chain-check / trivy-report-shipper (pull_request)"
  webgrip.nl:
    forge: forgejo
    kind: site
    staged: true
  whisperx-application:
    forge: forgejo
    settings:
      archived: true
  workflows:
    forge: forgejo
    kind: package
    core: true
    staged: true
    branches:
      main:
        status_checks: []
  ploeg-hq/ploeg:
    forge: github
    kind: service
    renovate:
      config_file: renovate.json5
      presets:
        - "github>webgrip/renovate-config"
        - "github>webgrip/renovate-config:golang"
        - "github>webgrip/renovate-config:automerge-non-major"
    settings:
      default_branch: development
      has_discussions: true
    rulesets:
      protect-development:
        id: 24451069
        name: Protect development
        target: branch
        include:
          - refs/heads/development
        deletion: true
        non_fast_forward: true
        update: false
        required_status_checks:
          - context: verify
            integration_id: 15368
          - context: dco
            integration_id: 15368
          - context: "cve-budget (ploegd)"
            integration_id: 15368
          - context: "cve-budget (claude-runner)"
            integration_id: 15368
          - context: "cve-budget (ploeg-worker)"
            integration_id: 15368
          - context: cve-gate-self-test
            integration_id: 15368
          - context: govulncheck
            integration_id: 15368
          - context: analyze
            integration_id: 15368
        bypass_repository_role_ids:
          - 5
      protect-main:
        id: 24445411
        name: Protect main
        target: branch
        include:
          - refs/heads/main
        deletion: true
        non_fast_forward: true
        update: false
        required_status_checks:
          - context: verify
            integration_id: 15368
        bypass_repository_role_ids:
          - 5
      release-tags-immutable:
        id: 24445407
        name: Release tags are immutable
        target: tag
        include:
          - refs/tags/v*
        deletion: true
        non_fast_forward: true
        update: true
        required_status_checks: []
        bypass_repository_role_ids: []
    release_consumers: >-
      [{"forge":"forgejo","url":"https://forgejo.webgrip.dev","repo":"webgrip/unfold","base":"development","recipe":"scripts/consume-ploeg-release.sh","message":"fix(ploeg): update Ploeg to {version}","merge":"by-consumer"}]
  webgrip/action-typescript-template:
    forge: github
    mirror_of: action-typescript-template
    settings:
      archived: true
  webgrip/ai-skills:
    forge: github
    mirror_of: ai-skills
  webgrip/application-template:
    forge: github
    mirror_of: application-template
    settings:
      archived: true
  webgrip/backstage-application:
    forge: github
    mirror_of: backstage-application
    settings:
      archived: true
  webgrip/common-charts:
    forge: github
    mirror_of: common-charts
    settings:
      archived: true
  webgrip/discord-moon:
    forge: github
    managed: false
    mirror_of: discord-moon
    settings:
      archived: true
  webgrip/fogbell:
    forge: github
    mirror_of: fogbell
  webgrip/freshrss-application:
    forge: github
    mirror_of: freshrss-application
    settings:
      archived: true
  webgrip/homelab-cluster:
    forge: github
    mirror_of: homelab-cluster
  webgrip/infrastructure:
    forge: github
    mirror_of: infrastructure
  webgrip/invoiceninja-application:
    forge: github
    mirror_of: invoiceninja-application
    settings:
      archived: true
  webgrip/ledgerflow:
    forge: github
    mirror_of: ledgerflow
    settings:
      archived: true
  webgrip/monitoring-platform:
    forge: github
    mirror_of: monitoring-platform
    settings:
      archived: true
  webgrip/renovate-config:
    forge: github
    mirror_of: renovate-config
  webgrip/searxng-application:
    forge: github
    mirror_of: searxng-application
    settings:
      archived: true
  webgrip/techdocs-builder:
    forge: github
    managed: false
    mirror_of: techdocs-builder
    settings:
      archived: true
  webgrip/techdocs-runner:
    forge: github
    managed: false
    mirror_of: techdocs-runner
    settings:
      archived: true
  webgrip/telemetry-service:
    forge: github
    mirror_of: telemetry-service
    settings:
      archived: true
  webgrip/traefik-local-development:
    forge: github
    mirror_of: traefik-local-development
    settings:
      archived: true
  webgrip/twente.dev:
    forge: github
    mirror_of: twente.dev
  webgrip/twitch_exporter:
    forge: github
    settings:
      archived: true
  webgrip/unfold:
    forge: github
    mirror_of: unfold
  webgrip/unfold-cluster:
    forge: github
    mirror_of: unfold-cluster
  webgrip/webgrip.nl:
    forge: github
    managed: false
    settings:
      archived: true
  webgrip/whisperx-application:
    forge: github
    mirror_of: whisperx-application
    settings:
      archived: true
  webgrip/workflows:
    forge: github
    mirror_of: workflows
