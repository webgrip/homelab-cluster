---
# yaml-language-server: $schema=./schema/repos.schema.json
apiVersion: repo-config.webgrip.io/v1alpha1
kind: RepoSet
owner: webgrip
repos:
  ".profile":
    profile: baseline
  action-typescript-template:
    profile: baseline
  ai-skills:
    profile: baseline
  application-template:
    profile: baseline
  backstage-application:
    profile: baseline
    settings:
      archived: true
  claude-config:
    profile: baseline
    settings:
      has_releases: false
    branches:
      main:
        status_checks: []
  cloudflare:
    profile: baseline
  common-charts:
    profile: baseline
  counterscale:
    profile: baseline
  freshrss-application:
    profile: baseline
    settings:
      archived: true
  frontend-toolkit:
    profile: baseline
  homelab-cluster:
    profile: homelab
  infrastructure:
    profile: baseline
  invoiceninja-application:
    profile: baseline
    settings:
      archived: true
  ledgerflow:
    profile: baseline
    settings:
      archived: true
  monitoring-platform:
    profile: baseline
    settings:
      archived: true
  renovate-config:
    profile: baseline
  searxng-application:
    profile: baseline
    settings:
      archived: true
  seekframe:
    profile: baseline
    settings:
      default_delete_branch_after_merge: false
  semantic-release-config:
    profile: baseline
  telemetry-service:
    profile: baseline
  traefik-local-development:
    profile: baseline
    settings:
      archived: true
  twente.dev:
    profile: baseline
    settings:
      allow_squash_merge: false
  unfold:
    profile: baseline
    branches:
      main:
        status_checks:
          - "\\[Workflow\\] On Pull Request / checks (pull_request)"
          - "\\[Workflow\\] On Pull Request / release-policy (pull_request)"
          - "\\[Workflow\\] On Pull Request / ploeg-pin (pull_request)"
      development:
        status_checks:
          - "\\[Workflow\\] On Pull Request / checks (pull_request)"
          - "\\[Workflow\\] On Pull Request / release-policy (pull_request)"
          - "\\[Workflow\\] On Pull Request / ploeg-pin (pull_request)"
          - "\\[Workflow\\] On Pull Request / ploeg-docs (pull_request)"
  webgrip.nl:
    profile: baseline
  whisperx-application:
    profile: baseline
    settings:
      archived: true
  workflows:
    profile: baseline
    branches:
      main:
        status_checks: []
