---
# yaml-language-server: $schema=./schema/repos.schema.json
apiVersion: repo-config.webgrip.io/v1alpha1
kind: RepoSet
forgejo:
  owner: webgrip
github:
  owners:
    ploeg-hq:
      app_secret_path: github/ploeg-hq-app
    webgrip:
      app_secret_path: github/webgrip-app
repos:
  ".profile":
    forge: forgejo
    profile: protected
    kind: none
    renovate:
      presets:
        - "local>webgrip/renovate-config"
  action-typescript-template:
    forge: forgejo
    profile: protected
    kind: package
    renovate:
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:apm"
  agent-standards:
    forge: forgejo
    profile: protected-core
    kind: package
    renovate:
      presets:
        - "local>webgrip/renovate-config:profile-library"
        - "local>webgrip/renovate-config:apm"
    settings:
      default_delete_branch_after_merge: false
  ai-skills:
    forge: forgejo
    profile: protected
    kind: package
    renovate:
      profile: profile-library
  application-template:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
  backstage-application:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
  claude-config:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
      has_releases: false
    branches:
      main:
        status_checks: []
  cloudflare:
    forge: forgejo
    profile: protected
    kind: config
    renovate:
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:safe-automerge"
        - "local>webgrip/renovate-config:apm"
  compyutah:
    forge: forgejo
    profile: protected
    kind: none
    renovate:
      absent: true
    settings:
      private: true
  common-charts:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
  counterscale:
    forge: forgejo
    profile: protected
    kind: site
    renovate:
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:apm"
  erfbeeld:
    forge: forgejo
    profile: protected
    kind: service
    renovate:
      presets:
        - "local>webgrip/renovate-config:profile-app"
    settings:
      private: true
  freshrss-application:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
  frontend-toolkit:
    forge: forgejo
    profile: protected
    kind: package
    renovate:
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:safe-automerge"
        - "local>webgrip/renovate-config:apm"
  homelab-cluster:
    forge: forgejo
    profile: protected-core
    kind: config
    renovate:
      config_file: ".renovaterc.json5"
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:gitops"
        - "local>webgrip/renovate-config:apm"
        - "docker:enableMajor"
        - ":automergePr"
    branches:
      main:
        status_checks:
          - "e2e / Lint & static validation (pull_request)"
          - "e2e / Flux-local render (pull_request)"
          - "e2e / Kyverno Chainsaw (KinD) (pull_request)"
          - "e2e / Validate Renovate config (pull_request)"
  infrastructure:
    forge: forgejo
    profile: protected
    kind: image-set
    renovate:
      profile: profile-image-set
  invoiceninja-application:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
  ledgerflow:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
  monitoring-platform:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
  omnigraph-explorer:
    forge: forgejo
    profile: protected
    kind: service
    renovate:
      presets:
        - "local>webgrip/renovate-config:profile-app"
        - "local>webgrip/renovate-config:apm"
    settings:
      private: true
  ploeg-bench:
    forge: forgejo
    profile: protected
    kind: none
    renovate:
      absent: true
    settings:
      private: true
  ploeg-bench-world:
    forge: forgejo
    profile: protected
    kind: none
    renovate:
      absent: true
    settings:
      private: true
  renovate-config:
    forge: forgejo
    profile: protected-core
    kind: package
    renovate:
      profile: profile-library
  searxng-application:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
  seekframe:
    forge: forgejo
    profile: protected
    kind: package
    renovate:
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:apm"
    settings:
      default_delete_branch_after_merge: false
  semantic-release-config:
    forge: forgejo
    profile: protected
    kind: package
    renovate:
      profile: profile-library
  talos-kata-extension:
    forge: forgejo
    profile: protected
    kind: image-set
    renovate:
      presets:
        - "local>webgrip/renovate-config:apm"
    settings:
      private: true
    branches:
      main:
        status_checks:
          - "\\[Workflow\\] On Source Change / checks (pull_request)"
  telemetry-service:
    forge: forgejo
    profile: protected
    kind: package
    renovate:
      presets:
        - "local>webgrip/renovate-config:profile-app"
        - "local>webgrip/renovate-config:apm"
  traefik-local-development:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
  twente.dev:
    forge: forgejo
    profile: protected
    kind: site
    renovate:
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:safe-automerge"
    settings:
      allow_squash_merge: false
  unfold:
    forge: forgejo
    profile: protected
    kind: service
    renovate:
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:automerge-non-major"
        - "local>webgrip/renovate-config:first-party"
        - "local>webgrip/renovate-config:apm"
        - "local>webgrip/renovate-config:platform-automerge"
    branches:
      main:
        status_checks:
          - "* / gate (pull_request)"
      development:
        push: []
        merge:
          - ryangr0
          - yon
          - renovate
          - ploeg-release
        status_checks:
          - "* / gate (pull_request)"
  unfold-cluster:
    forge: forgejo
    profile: protected-core
    kind: config
    renovate:
      presets:
        - "local>webgrip/renovate-config"
        - "local>webgrip/renovate-config:gitops"
        - "local>webgrip/renovate-config:forgejo"
        - "local>webgrip/renovate-config:apm"
    branches:
      main:
        push: []
        merge:
          - ryangr0
        status_checks:
          - "infra-check / check (pull_request)"
          - "infra-check / token-mask-canary (pull_request)"
          - "infra-check / token-mask-proof (pull_request)"
          - "admission-policies-check / fixtures (pull_request)"
          - "runtime-security-check / checks (pull_request)"
          - "supply-chain-check / image-signatures (pull_request)"
          - "supply-chain-check / trivy-report-shipper (pull_request)"
  webgrip.nl:
    forge: forgejo
    profile: protected
    kind: site
    renovate:
      profile: profile-site
  whisperx-application:
    forge: forgejo
    profile: baseline
    settings:
      archived: true
  workflows:
    forge: forgejo
    profile: protected-core
    kind: package
    renovate:
      profile: profile-library
    branches:
      main:
        status_checks: []
  ploeg-hq/ploeg:
    forge: github
    profile: baseline
    kind: service
    renovate:
      config_file: renovate.json5
      presets:
        - "github>webgrip/renovate-config"
        - "github>webgrip/renovate-config:golang"
        - "github>webgrip/renovate-config:automerge-non-major"
    settings:
      default_branch: development
      has_discussions: true
    rulesets:
      protect-development:
        id: 24451069
        name: Protect development
        target: branch
        include:
          - refs/heads/development
        deletion: true
        non_fast_forward: true
        update: false
        required_status_checks:
          - context: verify
            integration_id: 15368
          - context: dco
            integration_id: 15368
          - context: "cve-budget (ploegd)"
            integration_id: 15368
          - context: "cve-budget (claude-runner)"
            integration_id: 15368
          - context: "cve-budget (ploeg-worker)"
            integration_id: 15368
          - context: cve-gate-self-test
            integration_id: 15368
          - context: govulncheck
            integration_id: 15368
          - context: analyze
            integration_id: 15368
        bypass_repository_role_ids:
          - 5
      protect-main:
        id: 24445411
        name: Protect main
        target: branch
        include:
          - refs/heads/main
        deletion: true
        non_fast_forward: true
        update: false
        required_status_checks:
          - context: verify
            integration_id: 15368
        bypass_repository_role_ids:
          - 5
      release-tags-immutable:
        id: 24445407
        name: Release tags are immutable
        target: tag
        include:
          - refs/tags/v*
        deletion: true
        non_fast_forward: true
        update: true
        required_status_checks: []
        bypass_repository_role_ids: []
    release_consumers: >-
      [{"forge":"forgejo","url":"https://forgejo.webgrip.dev","repo":"webgrip/unfold","base":"development","recipe":"scripts/consume-ploeg-release.sh","message":"fix(ploeg): update Ploeg to {version}"}]
  webgrip/action-typescript-template:
    forge: github
    profile: baseline
    mirror_of: action-typescript-template
  webgrip/ai-skills:
    forge: github
    profile: baseline
    mirror_of: ai-skills
  webgrip/application-template:
    forge: github
    profile: baseline
    mirror_of: application-template
    settings:
      archived: true
  webgrip/backstage-application:
    forge: github
    profile: baseline
    mirror_of: backstage-application
    settings:
      archived: true
  webgrip/common-charts:
    forge: github
    profile: baseline
    mirror_of: common-charts
    settings:
      archived: true
  webgrip/freshrss-application:
    forge: github
    profile: baseline
    mirror_of: freshrss-application
    settings:
      archived: true
  webgrip/homelab-cluster:
    forge: github
    profile: baseline
    mirror_of: homelab-cluster
  webgrip/infrastructure:
    forge: github
    profile: baseline
    mirror_of: infrastructure
  webgrip/invoiceninja-application:
    forge: github
    profile: baseline
    mirror_of: invoiceninja-application
    settings:
      archived: true
  webgrip/ledgerflow:
    forge: github
    profile: baseline
    mirror_of: ledgerflow
    settings:
      archived: true
  webgrip/monitoring-platform:
    forge: github
    profile: baseline
    mirror_of: monitoring-platform
    settings:
      archived: true
  webgrip/renovate-config:
    forge: github
    profile: baseline
    mirror_of: renovate-config
  webgrip/searxng-application:
    forge: github
    profile: baseline
    mirror_of: searxng-application
    settings:
      archived: true
  webgrip/telemetry-service:
    forge: github
    profile: baseline
    mirror_of: telemetry-service
  webgrip/traefik-local-development:
    forge: github
    profile: baseline
    mirror_of: traefik-local-development
    settings:
      archived: true
  webgrip/twente.dev:
    forge: github
    profile: baseline
    mirror_of: twente.dev
  webgrip/twitch_exporter:
    forge: github
    profile: baseline
    settings:
      archived: true
  webgrip/unfold:
    forge: github
    profile: baseline
    mirror_of: unfold
  webgrip/unfold-cluster:
    forge: github
    profile: baseline
    mirror_of: unfold-cluster
  webgrip/whisperx-application:
    forge: github
    profile: baseline
    mirror_of: whisperx-application
    settings:
      archived: true
  webgrip/workflows:
    forge: github
    profile: baseline
    mirror_of: workflows
