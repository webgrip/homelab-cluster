---
# yaml-language-server: $schema=./schema/profiles.schema.json
apiVersion: repo-config.webgrip.io/v1alpha1
kind: ProfileSet
profiles:
  baseline:
    forgejo:
      settings:
        has_actions: true
        has_pull_requests: true
        has_releases: true
        default_merge_style: merge
        default_delete_branch_after_merge: true
        allow_fast_forward_only_merge: true
        allow_squash_merge: true
    github:
      settings:
        visibility: public
        has_issues: true
        has_projects: true
        has_wiki: true
        has_discussions: false
        allow_merge_commit: true
        allow_squash_merge: true
        allow_rebase_merge: true
        allow_auto_merge: true
        allow_update_branch: false
        delete_branch_on_merge: true
        web_commit_signoff_required: false
        squash_merge_commit_title: COMMIT_OR_PR_TITLE
        squash_merge_commit_message: COMMIT_MESSAGES
        merge_commit_title: MERGE_MESSAGE
        merge_commit_message: PR_TITLE
        actions_enabled: true
        allowed_actions: all
        default_workflow_permissions: read
        can_approve_pull_request_reviews: false
  homelab:
    forgejo:
      settings:
        has_actions: true
        has_pull_requests: true
        has_releases: true
        default_merge_style: merge
        default_delete_branch_after_merge: true
        allow_fast_forward_only_merge: true
        allow_squash_merge: true
      branches:
        main:
          push:
            - ryangr0
          merge:
            - ryangr0
            - renovate
          status_checks:
            - "e2e / Lint & static validation (pull_request)"
            - "e2e / Flux-local render (pull_request)"
            - "e2e / Kyverno Chainsaw (KinD) (pull_request)"
            - "e2e / Validate Renovate config (pull_request)"
