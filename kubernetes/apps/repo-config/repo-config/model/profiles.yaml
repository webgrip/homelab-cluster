---
# yaml-language-server: $schema=./schema/profiles.schema.json
apiVersion: repo-config.webgrip.io/v1alpha1
kind: ProfileSet
profiles:
  baseline:
    settings:
      has_actions: true
      has_pull_requests: true
      has_releases: true
      default_merge_style: merge
      default_delete_branch_after_merge: true
      allow_fast_forward_only_merge: true
      allow_squash_merge: true
  homelab:
    settings:
      has_actions: true
      has_pull_requests: true
      has_releases: true
      default_merge_style: merge
      default_delete_branch_after_merge: true
      allow_fast_forward_only_merge: true
      allow_squash_merge: true
    branches:
      main:
        push:
          - ryangr0
        merge:
          - ryangr0
          - renovate
        status_checks:
          - "e2e / Lint & static validation (pull_request)"
          - "e2e / Flux-local render (pull_request)"
          - "e2e / Kyverno Chainsaw (KinD) (pull_request)"
          - "e2e / Validate Renovate config (pull_request)"
