---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tei-embeddings
  namespace: ai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tei-embeddings
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
