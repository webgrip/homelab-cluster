---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laya
  namespace: ai
  labels:
    app.kubernetes.io/name: laya
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: laya
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laya
    spec:
      serviceAccountName: laya
      imagePullSecrets:
        - name: laya-harbor-pull
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.webgrip.io/cpu
                    operator: In
                    values:
                      - high
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - fringe-workstation
      containers:
        - name: laya
          image: harbor.webgrip.dev/webgrip/laya-serve:0.1.0@sha256:026bccb4517785507907e68728d674d9a7129aeed1606de4055ff8e4ddba1d7e
          imagePullPolicy: IfNotPresent
          env:
            - name: LAYA_THREADS
              value: "4"
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 1000m, memory: 2304Mi}
            limits: {memory: 3Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
