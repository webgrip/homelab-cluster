---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./open-webui-secret.externalsecret.yaml
  - ./open-webui-oidc.externalsecret.yaml
  - ./open-webui-litellm.externalsecret.yaml
  - ./pvc.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./securitypolicy-oidc.yaml
  - ./networkpolicy.yaml
components:
  - ../../../../components/gateway-egress
patches:
  - target:
      kind: NetworkPolicy
      name: allow-gateway-egress
    patch: |-
      - op: replace
        path: /metadata/name
        value: open-webui-allow-gateway-egress
      - op: replace
        path: /spec/podSelector
        value:
          matchLabels:
            app.kubernetes.io/name: open-webui
