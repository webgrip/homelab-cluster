---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-litellm
  namespace: ai
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: open-webui-litellm
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEY: "{{ .key }}"
        RAG_OPENAI_API_KEY: "{{ .key }}"
        TOOL_SERVER_CONNECTIONS: '[{"type":"mcp","url":"http://litellm.ai.svc.cluster.local:4000/mcp/","path":"","auth_type":"bearer","key":"{{ .key }}","config":{"enable":true,"access_grants":[]},"info":{"id":"omnigraph","name":"Omnigraph","description":"The memory and brain graphs through the LiteLLM MCP gateway"}}]'
  data:
    - secretKey: key
      remoteRef:
        key: litellm/keys/open-webui
        property: key
