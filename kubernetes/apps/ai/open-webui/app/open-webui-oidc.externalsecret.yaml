---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oidc
  namespace: ai
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: open-webui-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: open-webui
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: authentik/open-webui-oidc
        property: client_secret
