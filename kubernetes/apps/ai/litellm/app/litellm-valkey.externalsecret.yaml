---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-valkey
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0" # generate once; rotation would need a coordinated restart of both pods
  target:
    name: litellm-valkey
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
