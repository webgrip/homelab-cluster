---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-openai
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "An OpenAI API key from platform.openai.com (API keys), in the project whose usage LiteLLM meters."
    wellhead.dev/verify.http.url: "https://api.openai.com/v1/models"
    wellhead.dev/verify.http.auth: "bearer:OPENAI_API_KEY"
    wellhead.dev/verify: "http"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: litellm-openai
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai/litellm
        property: OPENAI_API_KEY
