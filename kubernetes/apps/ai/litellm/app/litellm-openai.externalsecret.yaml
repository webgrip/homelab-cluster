---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-openai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: litellm-openai
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai/litellm
        property: OPENAI_API_KEY
