---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-omnigraph-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: litellm-omnigraph-mcp
    creationPolicy: Owner
  data:
    - secretKey: OMNIGRAPH_MCP_BRAIN_AGENT_TOKEN
      remoteRef:
        key: omnigraph/brain-agent
        property: token
    - secretKey: OMNIGRAPH_MCP_AGENT_TOKEN
      remoteRef:
        key: omnigraph/agent
        property: token
    - secretKey: OMNIGRAPH_MCP_BRAIN_EVAL_TOKEN
      remoteRef:
        key: omnigraph/brain-eval
        property: token
    - secretKey: OMNIGRAPH_MCP_GLIDE_TOKEN
      remoteRef:
        key: omnigraph/glide
        property: token
    - secretKey: OMNIGRAPH_MCP_COMPANY_TOKEN
      remoteRef:
        key: omnigraph/company-reader
        property: token
