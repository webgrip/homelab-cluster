---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-omnigraph-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: litellm-omnigraph-mcp
    creationPolicy: Owner
  data:
    - secretKey: OMNIGRAPH_MCP_BRAIN_AGENT_TOKEN
      remoteRef:
        key: omnigraph/brain-agent
        property: token
