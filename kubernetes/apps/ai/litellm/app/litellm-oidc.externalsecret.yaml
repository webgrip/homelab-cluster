---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-oidc
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: litellm-oidc
    creationPolicy: Owner
  data:
    - secretKey: GENERIC_CLIENT_SECRET
      remoteRef:
        key: litellm/oidc
        property: client_secret
