---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  chartRef:
    kind: OCIRepository
    name: litellm
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    controllers:
      litellm:
        annotations:
          reloader.stakater.com/auto: "true" # restart on ESO/config rotation
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
          surge: 1
        pod:
          # HARD pool=worker (ADR-0002 — off the soyo control planes), SOFT
          # ram=high. litellm drifted onto the memory-saturated fringe workstation
          # during the 2026-07-17 valkey rollout (~1GB app + 794MB prisma engine
          # on a node with <2GB available) — VIK-331 slice 1 — and the fix was a
          # hard ram=high pin. But ram=high resolves to worker-1 ALONE, so that
          # pin is a large part of why worker-1 sat at ~98% CPU requests for 14
          # days. Measured peak is 996Mi, which fits any worker. Preferring the
          # 24Gi node keeps the original intent; requiring it caused the problem.
          # ADR-0002 rejected soft *pool* placement, not soft secondary tiers —
          # the pool pin stays hard.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.webgrip.io/pool
                        operator: In
                        values:
                          - "worker"
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node.webgrip.io/ram
                        operator: In
                        values:
                          - "high"
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          install-omnigraph-mcp:
            image:
              repository: harbor.webgrip.dev/dockerhub/supercorp/supergateway
              tag: 3.4.3@sha256:095acf4471e142553c1a5514aa5e480abbc5885d00549d4a3481cc70eac53889
            command:
              - sh
              - -cu
              - >-
                if cp /etc/omnigraph-mcp/package.json /etc/omnigraph-mcp/package-lock.json /opt/omnigraph-mcp/
                && cd /opt/omnigraph-mcp
                && npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error
                && test -f node_modules/@modernrelay/omnigraph-mcp/dist/bin.js;
                then echo "installed @modernrelay/omnigraph-mcp from the lockfile";
                else echo "omnigraph-mcp install failed; the omnigraph_memory MCP server lists no tools until the next LiteLLM restart" >&2;
                fi
            env:
              HOME: /tmp
              npm_config_cache: /tmp/npm-cache
              npm_config_update_notifier: "false"
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm-database
              tag: v1.102.1@sha256:c38fe5eff11874941a21f5630ceb842f640dee7d5d5cde440b60ed0a71798f33
            # The -database image runs `prisma migrate deploy` against DATABASE_URL
            # at startup, then serves the proxy on :4000 with our mounted config.
            args:
              - "--config"
              - "/etc/litellm/config.yaml"
              - "--port"
              - "4000"
              - "--prometheus_metrics_port"
              - "4001"
            env:
              STORE_MODEL_IN_DB: "True"
              LITELLM_LOG: "INFO"
              # --- VIK-261: OTEL export target for the otel callback in
              # litellm-config — alloy-gateway OTLP gRPC, on to VictoriaTraces. ---
              OTEL_EXPORTER: otlp_grpc
              OTEL_ENDPOINT: "http://alloy-gateway.observability.svc.cluster.local:4317"
              OTEL_SERVICE_NAME: litellm
              # --- Admin UI SSO via Authentik (generic OIDC). Non-secret half;
              # the client secret arrives via envFrom (litellm-oidc ExternalSecret).
              # Callback is <PROXY_BASE_URL>/sso/callback — registered as the strict
              # redirect_uri in Authentik blueprint 38-oidc-litellm. Free tier allows
              # SSO for up to 5 users (Enterprise-gated beyond that). ---
              PROXY_BASE_URL: "https://litellm.${SECRET_DOMAIN}"
              GENERIC_CLIENT_ID: litellm
              GENERIC_AUTHORIZATION_ENDPOINT: "https://authentik.${SECRET_DOMAIN}/application/o/authorize/"
              GENERIC_TOKEN_ENDPOINT: "https://authentik.${SECRET_DOMAIN}/application/o/token/"
              GENERIC_USERINFO_ENDPOINT: "https://authentik.${SECRET_DOMAIN}/application/o/userinfo/"
              # litellm_role is the custom scope/claim emitted by the blueprint's
              # role scope mapping; GENERIC_USER_ROLE_ATTRIBUTE tells LiteLLM to read
              # it, elevating homelab-admins to proxy_admin (everyone else internal_user).
              GENERIC_SCOPE: "openid email profile litellm_role"
              GENERIC_USER_ROLE_ATTRIBUTE: litellm_role
              # Connection string for the keys/spend ledger — the whole point of
              # ADR-0044 (budgets + per-key spend). Sourced from the CNPG-generated
              # secret, never inlined.
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: litellm-db-app
                    key: uri
              # --- Valkey (redis-protocol) for auth cache, router tpm/rpm
              # counters, and opt-in response caching. Referenced from
              # config.yaml via os.environ/REDIS_* (see litellm-config). ---
              REDIS_HOST: litellm-valkey.ai.svc.cluster.local
              REDIS_PORT: "6379"
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: litellm-valkey
                    key: password
              # Graceful-drain auth (VIK-277) — generator-minted, see
              # litellm-drain.externalsecret.yaml.
              DRAIN_ENDPOINT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: litellm-drain
                    key: password
            # LITELLM_MASTER_KEY + ANTHROPIC_API_KEY + FIREWORKS_AI_API_KEY (ESO → OpenBao secret/litellm).
            # GENERIC_CLIENT_SECRET (Admin UI SSO) from the litellm-oidc ExternalSecret.
            envFrom:
              - secretRef:
                  name: litellm-secret
              - secretRef:
                  name: litellm-oidc
              - secretRef:
                  name: litellm-omnigraph-memory
              - secretRef:
                  name: litellm-omnigraph-brain
              - secretRef:
                  name: litellm-omnigraph-glide
              - secretRef:
                  name: litellm-omnigraph-brain-eval
              - secretRef:
                  name: litellm-openai
                  optional: true
              - secretRef:
                  name: litellm-google
                  optional: true
              - secretRef:
                  name: litellm-hetzner
                  optional: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 50m
                # LiteLLM's boot (prisma migrate + provider-SDK imports) spikes
                # well past steady-state (~500Mi). A 1Gi limit OOMKilled it mid-boot
                # (exit 137) before it could bind :4000. 2Gi covers the spike;
                # worker-1 has ~13Gi free so the modest request keeps it schedulable.
                memory: 640Mi
              limits:
                memory: 2Gi
            probes:
              # Decouple slow boot from liveness: the startup probe grants ~5 min
              # for prisma migrate + first listen before liveness/readiness engage.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 4000
                  initialDelaySeconds: 45
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 3
          # Sidecar: postgres-exporter over LiteLLM's own spend ledger — the
          # metrics path ADR-0044 needs (OSS LiteLLM has no Prometheus /metrics).
          # In the litellm Deployment so the existing kyverno third-party-image
          # exception covers it (no new exception needed — that exception is still
          # required regardless, for litellm's own ghcr.io/berriai image).
          exporter:
            image:
              # Harbor pull-through proxy-cache (ADR-0025) instead of quay.io direct; digest
              # unchanged, proxy is content-addressable. Keeps the dep on the Harbor path so
              # Renovate's soak can actually clear — quay.io reports no release timestamps.
              repository: harbor.webgrip.dev/quay/prometheuscommunity/postgres-exporter
              tag: v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
            # The wal collector needs pg_monitor (pg_ls_waldir) — the app user lacks
            # it and we only want the custom litellm_* queries anyway. Silence it.
            args:
              - "--no-collector.wal"
            env:
              DATA_SOURCE_URI: litellm-db-rw.ai.svc.cluster.local:5432/litellm?sslmode=require
              DATA_SOURCE_USER:
                valueFrom:
                  secretKeyRef:
                    name: litellm-db-app
                    key: username
              DATA_SOURCE_PASS:
                valueFrom:
                  secretKeyRef:
                    name: litellm-db-app
                    key: password
              PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pg-exporter/queries.yaml
              PG_EXPORTER_DISABLE_DEFAULT_METRICS: "true"
              PG_EXPORTER_DISABLE_SETTINGS_METRICS: "true"
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 65534
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 96Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9187
                  initialDelaySeconds: 20
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9187
                  initialDelaySeconds: 20
                  periodSeconds: 30
    service:
      app:
        controller: litellm
        ports:
          http:
            port: 4000
          metrics:
            port: 9187
          native-metrics:
            port: 4001
    persistence:
      config:
        type: configMap
        name: litellm-config
        globalMounts:
          - path: /etc/litellm
            readOnly: true
      # Runtime monkeypatches (SSO timeout + MCP protocol-version cap), see
      # litellm-runtime-patches.configmap.yaml. subPath mounts just this one
      # file so it doesn't shadow the rest of the venv's site-packages.
      runtime-patches:
        type: configMap
        name: litellm-runtime-patches
        advancedMounts:
          litellm:
            app:
              - path: /app/.venv/lib/python3.13/site-packages/sitecustomize.py
                subPath: sitecustomize.py
                readOnly: true
      exporter-queries:
        type: configMap
        name: litellm-exporter-queries
        advancedMounts:
          litellm:
            exporter:
              - path: /etc/pg-exporter
                readOnly: true
      omnigraph-mcp:
        type: emptyDir
        advancedMounts:
          litellm:
            install-omnigraph-mcp:
              - path: /opt/omnigraph-mcp
            app:
              - path: /opt/omnigraph-mcp
                readOnly: true
      omnigraph-mcp-lock:
        type: configMap
        name: litellm-omnigraph-mcp
        advancedMounts:
          litellm:
            install-omnigraph-mcp:
              - path: /etc/omnigraph-mcp
                readOnly: true
      omnigraph-mcp-tmp:
        type: emptyDir
        advancedMounts:
          litellm:
            install-omnigraph-mcp:
              - path: /tmp
