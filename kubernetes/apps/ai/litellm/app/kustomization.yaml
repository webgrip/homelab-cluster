---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./litellm-config.configmap.yaml
  - ./litellm-exporter-queries.configmap.yaml
  - ./litellm-runtime-patches.configmap.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./networkpolicy.yaml
  - ./litellm-secret.externalsecret.yaml
  - ./litellm-oidc.externalsecret.yaml
  - ./litellm-valkey.externalsecret.yaml
  - ./litellm-drain.externalsecret.yaml
  - ./litellm-omnigraph-memory.externalsecret.yaml
  - ./litellm-omnigraph-brain.externalsecret.yaml
  - ./litellm-omnigraph-glide.externalsecret.yaml
  - ./litellm-omnigraph-brain-eval.externalsecret.yaml
  - ./litellm-valkey.yaml
  - ./vmservicescrape.yaml
  - ./grafana-dashboard.yaml
  - ./grafana-dashboard-reliability.yaml
configMapGenerator:
  - name: litellm-omnigraph-mcp
    files:
      - ./omnigraph-mcp/package.json
      - ./omnigraph-mcp/package-lock.json
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
components:
  # Server-side OIDC to authentik hairpins through the envoy-internal VIP, which under a
  # default-deny needs an IDENTITY allow (not a CIDR or port rule) — see the component
  # header and ADR-0005. litellm does OIDC (litellm-oidc.externalsecret), so this is
  # required the moment the namespace opts into default-deny.
  - ../../../../components/gateway-egress
patches:
  - target:
      kind: NetworkPolicy
      name: allow-gateway-egress
    patch: |-
      - op: replace
        path: /metadata/name
        value: litellm-allow-gateway-egress
      - op: replace
        path: /spec/podSelector
        value:
          matchLabels:
            app.kubernetes.io/name: litellm
