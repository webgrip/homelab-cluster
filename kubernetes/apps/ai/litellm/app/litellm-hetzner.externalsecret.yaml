---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-hetzner
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Hetzner inference API token, made by a person in the Hetzner Console (the inference project, Security, API tokens)."
    wellhead.dev/verify.format.HETZNER_INFERENCE_API_KEY: "\\S{20,}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: litellm-hetzner
    creationPolicy: Owner
  data:
    - secretKey: HETZNER_INFERENCE_API_KEY
      remoteRef:
        key: hetzner/litellm
        property: HETZNER_INFERENCE_API_KEY
