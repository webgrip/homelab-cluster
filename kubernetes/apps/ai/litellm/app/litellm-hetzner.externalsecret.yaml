---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-hetzner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: litellm-hetzner
    creationPolicy: Owner
  data:
    - secretKey: HETZNER_INFERENCE_API_KEY
      remoteRef:
        key: hetzner/litellm
        property: HETZNER_INFERENCE_API_KEY
