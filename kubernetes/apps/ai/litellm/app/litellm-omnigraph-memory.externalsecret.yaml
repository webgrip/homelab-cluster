---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-omnigraph-memory
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: litellm-omnigraph-memory
    creationPolicy: Owner
  data:
    - secretKey: OMNIGRAPH_MEMORY_TOKEN
      remoteRef:
        key: omnigraph/agent
        property: token
