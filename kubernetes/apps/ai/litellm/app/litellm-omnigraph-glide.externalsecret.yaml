---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-omnigraph-glide
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: litellm-omnigraph-glide
    creationPolicy: Owner
  data:
    - secretKey: OMNIGRAPH_GLIDE_TOKEN
      remoteRef:
        key: omnigraph/glide
        property: token
