---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secret
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "LiteLLM's master key (an sk- value of your choice; it mints the virtual keys, so the key-register Jobs need the same one) and the upstream provider keys: ANTHROPIC_API_KEY from console.anthropic.com (API keys) and FIREWORKS_AI_API_KEY from the Fireworks AI console (API Keys). Real billing."
    wellhead.dev/verify.http.url: "https://api.fireworks.ai/inference/v1/models"
    wellhead.dev/verify.http.auth: "bearer:FIREWORKS_AI_API_KEY"
    wellhead.dev/verify.format.LITELLM_MASTER_KEY: "sk-\\S{16,}"
    wellhead.dev/verify.format.ANTHROPIC_API_KEY: "sk-ant-\\S+"
    wellhead.dev/verify: "http format"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: litellm-secret
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm
        property: LITELLM_MASTER_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: litellm
        property: ANTHROPIC_API_KEY
    - secretKey: FIREWORKS_AI_API_KEY
      remoteRef:
        key: litellm
        property: FIREWORKS_AI_API_KEY
