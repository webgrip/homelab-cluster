---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-drain
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0" # generate once; the token has no at-rest data to corrupt
  target:
    name: litellm-drain
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
