---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-grafana-ro
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - {kind: SecretStore, name: openbao-push}
  selector: {secret: {name: litellm-grafana-ro}}
  data:
    - match: {secretKey: username, remoteRef: {remoteKey: litellm/grafana-ro, property: username}}
    - match: {secretKey: password, remoteRef: {remoteKey: litellm/grafana-ro, property: password}}
