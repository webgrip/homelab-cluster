---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-google
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Gemini API key from Google AI Studio (Get API key), in the project whose billing LiteLLM meters."
    wellhead.dev/verify.http.url: "https://generativelanguage.googleapis.com/v1beta/models"
    wellhead.dev/verify.http.auth: "header:x-goog-api-key:GEMINI_API_KEY"
    wellhead.dev/verify: "http"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: litellm-google
    creationPolicy: Owner
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: google/litellm
        property: GEMINI_API_KEY
