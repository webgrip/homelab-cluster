---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-brain-tools
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: litellm-key-brain-tools
  data:
    - match: {secretKey: key, remoteRef: {remoteKey: litellm/keys/brain-tools, property: key}}
