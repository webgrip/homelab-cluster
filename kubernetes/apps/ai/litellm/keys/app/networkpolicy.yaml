---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-key-register-egress
  namespace: ai
  labels:
    app.kubernetes.io/part-of: litellm
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [litellm-key-register, litellm-team-register]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
