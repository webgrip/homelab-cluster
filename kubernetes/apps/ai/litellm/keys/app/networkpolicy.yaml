---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-key-register-egress
  namespace: ai
  labels:
    app.kubernetes.io/part-of: litellm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm-key-register
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
