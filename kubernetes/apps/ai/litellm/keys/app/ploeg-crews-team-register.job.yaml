---
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-team-register-ploeg-crews
  namespace: ai
  labels:
    app.kubernetes.io/name: litellm-team-register
    app.kubernetes.io/instance: ploeg-crews
    cleanup.webgrip.io/retry-failed: "true"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-team-register
        app.kubernetes.io/instance: ploeg-crews
    spec:
      serviceAccountName: litellm-key-register
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: register
          image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - /scripts/register-team.sh
          env:
            - {name: HOME, value: /tmp}
            - {name: LITELLM_URL, value: "http://litellm.ai.svc.cluster.local:4000"}
            - {name: TEAM_ID, value: ploeg-crews}
            - {name: TEAM_ALIAS, value: ploeg-crews}
            - {name: MCP_ACCESS_GROUPS, value: '["observability"]'}
            - {name: TEAM_OWNER, value: ryan}
            - {name: TEAM_PURPOSE, value: "ploeg-crews: bounds Ploeg Run keys to the read-only observability MCP group (Ploeg ADR-0078); no team budget, rpm or tpm, because ploegd caps every Run key itself"}
            - {name: MASTER_KEY_FILE, value: /run/secrets/litellm/LITELLM_MASTER_KEY}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: master-key, mountPath: /run/secrets/litellm, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap:
            name: litellm-key-register
        - name: master-key
          secret:
            secretName: litellm-secret
            items:
              - key: LITELLM_MASTER_KEY
                path: LITELLM_MASTER_KEY
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
