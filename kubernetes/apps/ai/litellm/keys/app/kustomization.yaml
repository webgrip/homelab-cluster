---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./open-webui-key.externalsecret.yaml
  - ./open-webui-key.pushsecret.yaml
  - ./claude-code-key.externalsecret.yaml
  - ./claude-code-key.pushsecret.yaml
  - ./omnigraph-distill-key.externalsecret.yaml
  - ./omnigraph-distill-key.pushsecret.yaml
  - ./omnigraph-eval-key.externalsecret.yaml
  - ./omnigraph-eval-key.pushsecret.yaml
  - ./brain-tools-key.externalsecret.yaml
  - ./brain-tools-key.pushsecret.yaml
  - ./serviceaccount.yaml
  - ./open-webui-key-register.job.yaml
  - ./claude-code-key-register.job.yaml
  - ./omnigraph-distill-key-register.job.yaml
  - ./omnigraph-eval-key-register.job.yaml
  - ./brain-tools-key-register.job.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: litellm-key-register
    files:
      - ./register-key.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
