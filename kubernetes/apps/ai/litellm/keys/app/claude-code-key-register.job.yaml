---
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-key-register-claude-code
  namespace: ai
  labels:
    app.kubernetes.io/name: litellm-key-register
    app.kubernetes.io/instance: claude-code
    cleanup.webgrip.io/retry-failed: "true"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-key-register
        app.kubernetes.io/instance: claude-code
    spec:
      serviceAccountName: litellm-key-register
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: register
          image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - /scripts/register-key.sh
          env:
            - {name: HOME, value: /tmp}
            - {name: LITELLM_URL, value: "http://litellm.ai.svc.cluster.local:4000"}
            - {name: KEY_ALIAS, value: claude-code}
            - {name: MODELS, value: '["no-default-models"]'}
            - {name: MCP_ACCESS_GROUPS, value: '["memory","brain","brain-dogfood"]'}
            - {name: MAX_BUDGET, value: "1"}
            - {name: BUDGET_DURATION, value: 30d}
            - {name: RPM_LIMIT, value: "120"}
            - {name: TPM_LIMIT, value: "100000"}
            - {name: KEY_OWNER, value: ryan}
            - {name: KEY_PURPOSE, value: "Claude Code on Ryan's workstation, MCP tools only"}
            - {name: VIRTUAL_KEY_FILE, value: /run/secrets/virtual-key/key}
            - {name: MASTER_KEY_FILE, value: /run/secrets/litellm/LITELLM_MASTER_KEY}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: virtual-key, mountPath: /run/secrets/virtual-key, readOnly: true}
            - {name: master-key, mountPath: /run/secrets/litellm, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap:
            name: litellm-key-register
        - name: virtual-key
          secret:
            secretName: litellm-key-claude-code
            items:
              - key: key
                path: key
        - name: master-key
          secret:
            secretName: litellm-secret
            items:
              - key: LITELLM_MASTER_KEY
                path: LITELLM_MASTER_KEY
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
