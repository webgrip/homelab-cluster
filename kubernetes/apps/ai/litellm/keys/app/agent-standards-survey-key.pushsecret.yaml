---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-agent-standards-survey
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-push
  selector:
    secret:
      name: litellm-key-agent-standards-survey
  data:
    - match: {secretKey: key, remoteRef: {remoteKey: litellm/keys/agent-standards-survey, property: key}}
