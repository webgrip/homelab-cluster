---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-unfold-decider
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-push
  selector:
    secret:
      name: litellm-key-unfold-decider
  data:
    - match: {secretKey: key, remoteRef: {remoteKey: litellm/keys/unfold-decider, property: key}}
