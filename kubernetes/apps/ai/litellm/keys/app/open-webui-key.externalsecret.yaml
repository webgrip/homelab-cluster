---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-key-open-webui
  namespace: ai
spec:
  refreshInterval: "0"
  target:
    name: litellm-key-open-webui
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        key: "sk-{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
