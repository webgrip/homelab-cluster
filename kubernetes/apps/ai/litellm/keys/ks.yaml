---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-keys
spec:
  dependsOn:
    - name: external-secrets-stores
      namespace: security
    - name: litellm
  force: true
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/keys/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
