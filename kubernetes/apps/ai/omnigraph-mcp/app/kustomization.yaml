---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yaml
  - ./omnigraph-mcp-memory.externalsecret.yaml
  - ./omnigraph-mcp-brain.externalsecret.yaml
  - ./omnigraph-mcp-brain-eval.externalsecret.yaml
  - ./omnigraph-mcp-glide.externalsecret.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: omnigraph-mcp-lockfile
    files:
      - ./bridge/package.json
      - ./bridge/package-lock.json
    options:
      labels:
        app.kubernetes.io/name: omnigraph-mcp
        app.kubernetes.io/part-of: omnigraph
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
components:
  - ../../../../components/placement/worker-pool
