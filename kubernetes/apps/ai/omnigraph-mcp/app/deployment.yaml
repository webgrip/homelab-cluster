          startupProbe:
            httpGet: {path: /healthz, port: brain}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: brain}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: brain}
            periodSeconds: 30
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: bridge, mountPath: /opt/omnigraph-mcp, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: brain-eval
          image: harbor.webgrip.dev/dockerhub/supercorp/supergateway:4.0.0@sha256:407344de762a449f129c576fa1e3934b63c43fef417322687972ffc43ec675df
          imagePullPolicy: IfNotPresent
