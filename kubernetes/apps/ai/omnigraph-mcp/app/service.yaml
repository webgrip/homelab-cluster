---
apiVersion: v1
kind: Service
metadata:
  name: omnigraph-mcp
  labels:
    app.kubernetes.io/name: omnigraph-mcp
    app.kubernetes.io/part-of: omnigraph
    mcp.webgrip.io/access: litellm-gateway-only
spec:
  selector:
    app.kubernetes.io/name: omnigraph-mcp
  ports:
    - name: memory
      port: 8001
      targetPort: memory
      protocol: TCP
    - name: brain
      port: 8002
      targetPort: brain
      protocol: TCP
    - name: brain-eval
      port: 8003
      targetPort: brain-eval
      protocol: TCP
    - name: glide-memory
      port: 8004
      targetPort: glide-memory
      protocol: TCP
    - name: glide-brain
      port: 8005
      targetPort: glide-brain
      protocol: TCP
    - name: glide-webgrip
      port: 8006
      targetPort: glide-webgrip
      protocol: TCP
