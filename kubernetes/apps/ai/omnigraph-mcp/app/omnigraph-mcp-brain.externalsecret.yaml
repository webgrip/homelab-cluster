---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-mcp-brain
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: omnigraph-mcp-brain
    creationPolicy: Owner
  data:
    - secretKey: OMNIGRAPH_TOKEN
      remoteRef:
        key: omnigraph/brain-agent
        property: token
