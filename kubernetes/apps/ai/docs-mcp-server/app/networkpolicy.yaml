---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docs-mcp-server-ingress
  namespace: ai
  labels:
    app.kubernetes.io/part-of: docs-mcp-server
spec:
  podSelector:
    matchLabels:
      app: docs-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
      ports:
        - protocol: TCP
          port: 6280
