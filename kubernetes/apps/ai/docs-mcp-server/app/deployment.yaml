---
# Keyword-only search over the indexed docs estate (no embedding provider env =
# no external calls). Index sources are registered once via the web UI / MCP
# scrape_docs tool and persist in /data (Longhorn).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-mcp-server
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume
  selector:
    matchLabels:
      app: docs-mcp-server
  template:
    metadata:
      labels:
        app: docs-mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs-mcp-server
          # renovate: datasource=docker depName=ghcr.io/arabold/docs-mcp-server
          image: harbor.webgrip.dev/ghcr/arabold/docs-mcp-server:3.1.0@sha256:5bf22439746680e064db7cd1979fc192f9733f312ab9ce1c98ea0e7aa453a1f7
          imagePullPolicy: IfNotPresent
          args:
            - "--protocol"
            - "http"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "6280"
          env:
            # The scraper's SSRF guard rejects hosts resolving to private IPs;
            # an allowlisted hostname is authoritative (its DNS answers are
            # trusted even when private) — required because docs.<domain> IS a
            # LAN address by design. Blocked every seed job until set (2026-08-11).
            - name: DOCS_MCP_SCRAPER_SECURITY_NETWORK_ALLOWED_HOSTS
              value: docs.${SECRET_DOMAIN}
          ports:
            - name: http
              containerPort: 6280
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          readinessProbe:
            httpGet: {path: /, port: 6280}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 6280}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: docs-mcp-server-data
