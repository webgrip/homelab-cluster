---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-explorer-upstream
  namespace: ai
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: omnigraph-explorer-upstream
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - {secretKey: token, remoteRef: {key: omnigraph/explorer, property: token}}
