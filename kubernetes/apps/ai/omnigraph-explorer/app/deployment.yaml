---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigraph-explorer
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-explorer
    app.kubernetes.io/part-of: omnigraph
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: omnigraph-explorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnigraph-explorer
        app.kubernetes.io/part-of: omnigraph
    spec:
      serviceAccountName: omnigraph-explorer
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: omnigraph-explorer-harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: explorer
          # renovate: datasource=docker depName=harbor.webgrip.dev/webgrip/omnigraph-explorer
          image: harbor.webgrip.dev/webgrip/omnigraph-explorer:0.0.3@sha256:99d97bfd4a1e976f48c3faa869c7207bccc8893c3e85becd510c0b570b875d28
          imagePullPolicy: IfNotPresent
          env:
            - name: OMNIGRAPH_UPSTREAM
              value: omnigraph.ai.svc.cluster.local:8080
            - name: OMNIGRAPH_TOKEN_FILE
              value: /run/secrets/omnigraph-explorer/token
            - name: OMNIGRAPH_EXPLORER_GRAPHS
              value: brain,memory,webgrip
            - name: OMNIGRAPH_EXPLORER_HEAVY_TYPES
              value: Chunk,Passage
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          volumeMounts:
            - {name: upstream-token, mountPath: /run/secrets/omnigraph-explorer, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: upstream-token
          secret:
            secretName: omnigraph-explorer-upstream
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
