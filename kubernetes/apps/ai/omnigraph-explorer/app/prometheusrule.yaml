---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: omnigraph-review
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-explorer
spec:
  groups:
    - name: omnigraph-review.rules
      rules:
        - alert: OmnigraphReviewBacklog
          expr: |
            max by (graph, branch) (omnigraph_branch_age_seconds) > 3 * 86400
          for: 15m
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "Omnigraph branch {{ $labels.branch }} on {{ $labels.graph }} has waited for review for more than 3 days"
            description: |
              What's happening:
              - The branch's oldest own commit (or its first sighting, when it has none) is more than 3 days old.

              Impact/risk:
              - Every open branch blocks schema changes on its graph, and a schema apply with a branch open stops every graph.
              - At 14 days the review service archives the branch to S3 and deletes it.

              Likely causes:
              - A Glide run or ingest finished and nobody reviewed it
              - A run failed without deleting its branch

              First actions:
              - Open graph-review.<domain>, pick the branch, and merge or reject it
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#review-mode"
        - alert: OmnigraphBranchNotSwept
          expr: |
            max by (graph, branch) (omnigraph_branch_age_seconds) > 15 * 86400
          for: 1h
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "Omnigraph branch {{ $labels.branch }} on {{ $labels.graph }} is past the 14-day sweep and still open"
            description: |
              What's happening:
              - The review service should have archived and deleted this branch a day ago.

              Impact/risk:
              - Schema changes on the graph stay blocked.

              Likely causes:
              - The archive write to Garage fails, so the sweeper refuses to delete (nothing is deleted without an archive)
              - The archive keys are missing from the pod

              First actions:
              - kubectl -n ai logs deploy/omnigraph-explorer -c review | grep -E 'sweep_failed|archive'
              - kubectl -n ai get externalsecret omnigraph-explorer-review-archive
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#review-mode"
        - alert: OmnigraphBranchesPileUp
          expr: |
            sum by (graph) (omnigraph_branches_open{prefix!="preview"}) > 10
          for: 1h
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "{{ $value }} branches are open on the {{ $labels.graph }} graph"
            description: |
              What's happening:
              - More than 10 non-main branches have been open on one graph for an hour.

              Impact/risk:
              - Runs write faster than review; schema work on the graph is blocked.

              Likely causes:
              - A Ploeg role writing on every run, or a loop of retried runs

              First actions:
              - Open graph-review.<domain> and drain the graph; pause the Glide roles in Ploeg if it keeps growing
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#review-mode"
        - alert: OmnigraphBranchMonitorStale
          expr: |
            time() - max(omnigraph_review_refresh_success_timestamp_seconds) > 1800
            or absent(omnigraph_review_refresh_success_timestamp_seconds)
          for: 10m
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "The Omnigraph branch monitor has not read every graph for 30 minutes"
            description: |
              What's happening:
              - The review container's refresh has not completed over brain, memory and webgrip for 30 minutes, or it is not scraped at all.

              Impact/risk:
              - Branch age alerts and the 14-day sweep stop; a silent monitor looks like an empty inbox.

              Likely causes:
              - The review container is crashing or cannot reach omnigraph:8080
              - The act-review token was rotated or is missing from tokens.json (every call answers 401)

              First actions:
              - kubectl -n ai logs deploy/omnigraph-explorer -c review --tail=50
              - kubectl -n ai get externalsecret omnigraph-explorer-review-upstream omnigraph-tokens
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#review-mode"
