---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: omnigraph-review
  namespace: ai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: omnigraph-explorer
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 20s
      metricRelabelConfigs:
        - action: keep
          sourceLabels:
            - __name__
          regex: "omnigraph_.*"
