---
apiVersion: v1
kind: Service
metadata:
  name: omnigraph-explorer
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-explorer
    app.kubernetes.io/part-of: omnigraph
spec:
  selector:
    app.kubernetes.io/name: omnigraph-explorer
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: review
      port: 8081
      targetPort: review
    - name: metrics
      port: 9464
      targetPort: metrics
