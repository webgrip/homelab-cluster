---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-explorer-review-archive
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: omnigraph-explorer-review-archive
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - {secretKey: access_key_id, remoteRef: {key: garage/omnigraph-archive, property: access_key_id}}
    - {secretKey: secret_access_key, remoteRef: {key: garage/omnigraph-archive, property: secret_access_key}}
