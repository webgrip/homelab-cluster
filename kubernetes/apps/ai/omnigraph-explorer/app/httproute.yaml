---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omnigraph-explorer
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-explorer
    app.kubernetes.io/part-of: omnigraph
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
    monitoring.webgrip.io/synthetic-check: blackbox-omnigraph-explorer
spec:
  hostnames:
    - graph.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: omnigraph-explorer
          namespace: ai
          port: 8080
