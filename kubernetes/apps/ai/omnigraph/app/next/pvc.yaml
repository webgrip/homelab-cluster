---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigraph-014-state
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigraph-next-state
  namespace: ai
  annotations:
    policy.webgrip.io/allow-stateful-delete: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
