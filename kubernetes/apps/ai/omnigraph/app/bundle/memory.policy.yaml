---
version: 1
protected_branches:
  - main
groups:
  admins:
    - act-admin
    - act-ryan
  agents:
    - act-agent
  readers:
    - act-reader
  explorers:
    - act-explorer
  glide:
    - act-glide
  reviewers:
    - act-review
rules:
  - id: everyone-reads
    allow:
      actors: {group: readers}
      actions:
        - read
        - export
      branch_scope: any
  - id: agents-read
    allow:
      actors: {group: agents}
      actions:
        - read
      branch_scope: any
  - id: everyone-invokes-queries
    allow:
      actors: {group: readers}
      actions:
        - invoke_query
  - id: agents-invoke-queries
    allow:
      actors: {group: agents}
      actions:
        - invoke_query
  - id: admins-invoke-queries
    allow:
      actors: {group: admins}
      actions:
        - invoke_query
  - id: agents-write-own-branches
    allow:
      actors: {group: agents}
      actions:
        - change
      branch_scope: unprotected
  - id: agents-manage-own-branches
    allow:
      actors: {group: agents}
      actions:
        - branch_create
        - branch_delete
      target_branch_scope: unprotected
  - id: admins-everything
    allow:
      actors: {group: admins}
      actions:
        - read
        - export
        - change
      branch_scope: any
  - id: admins-manage-branches
    allow:
      actors: {group: admins}
      actions:
        - branch_create
        - branch_delete
      target_branch_scope: any
  - id: admins-merge-into-main
    allow:
      actors: {group: admins}
      actions:
        - branch_merge
      target_branch_scope: any
  - id: explorers-read-and-export
    allow:
      actors: {group: explorers}
      actions:
        - read
        - export
      branch_scope: any
  - id: glide-reads-every-branch
    allow:
      actors: {group: glide}
      actions:
        - read
      branch_scope: any
  - id: glide-writes-run-branches
    allow:
      actors: {group: glide}
      actions:
        - change
      branch_scope: unprotected
  - id: glide-manages-run-branches
    allow:
      actors: {group: glide}
      actions:
        - branch_create
        - branch_delete
      target_branch_scope: unprotected
  - id: glide-invokes-queries
    allow:
      actors: {group: glide}
      actions:
        - invoke_query
  - id: reviewers-read-and-write-everywhere
    allow:
      actors: {group: reviewers}
      actions:
        - read
        - change
      branch_scope: any
  - id: reviewers-manage-and-merge-branches
    allow:
      actors: {group: reviewers}
      actions:
        - branch_create
        - branch_delete
        - branch_merge
      target_branch_scope: any
  - id: reviewers-invoke-queries
    allow:
      actors: {group: reviewers}
      actions:
        - invoke_query
