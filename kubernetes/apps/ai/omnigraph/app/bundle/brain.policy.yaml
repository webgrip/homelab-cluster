---
version: 1
protected_branches:
  - main
groups:
  owners:
    - act-ryan
  assistants:
    - act-brain-agent
  explorers:
    - act-explorer
  importers:
    - act-vault-import
    - act-forge-import
    - act-distill
  glide:
    - act-glide
  reviewers:
    - act-review
  readers:
    - act-brain-reader
  evaluators:
    - act-brain-eval
  scribes:
    - act-brain-scribe
rules:
  - id: owners-read-and-write-everywhere
    allow:
      actors: {group: owners}
      actions:
        - read
        - export
        - change
      branch_scope: any
  - id: owners-manage-and-merge-branches
    allow:
      actors: {group: owners}
      actions:
        - branch_create
        - branch_delete
        - branch_merge
      target_branch_scope: any
  - id: owners-invoke-queries
    allow:
      actors: {group: owners}
      actions:
        - invoke_query
  - id: assistants-read-and-write-everywhere
    allow:
      actors: {group: assistants}
      actions:
        - read
        - change
      branch_scope: any
  - id: assistants-manage-proposal-branches
    allow:
      actors: {group: assistants}
      actions:
        - branch_create
        - branch_delete
      target_branch_scope: unprotected
  - id: assistants-invoke-queries
    allow:
      actors: {group: assistants}
      actions:
        - invoke_query
  - id: explorers-read-and-export
    allow:
      actors: {group: explorers}
      actions:
        - read
        - export
      branch_scope: any
  - id: importers-read-and-write-everywhere
    allow:
      actors: {group: importers}
      actions:
        - read
        - change
      branch_scope: any
  - id: importers-invoke-queries
    allow:
      actors: {group: importers}
      actions:
        - invoke_query
  - id: glide-reads-every-branch
    allow:
      actors: {group: glide}
      actions:
        - read
      branch_scope: any
  - id: glide-writes-run-branches
    allow:
      actors: {group: glide}
      actions:
        - change
      branch_scope: unprotected
  - id: glide-manages-run-branches
    allow:
      actors: {group: glide}
      actions:
        - branch_create
        - branch_delete
      target_branch_scope: unprotected
  - id: glide-invokes-queries
    allow:
      actors: {group: glide}
      actions:
        - invoke_query
  - id: reviewers-read-and-write-everywhere
    allow:
      actors: {group: reviewers}
      actions:
        - read
        - change
      branch_scope: any
  - id: reviewers-manage-and-merge-branches
    allow:
      actors: {group: reviewers}
      actions:
        - branch_create
        - branch_delete
        - branch_merge
      target_branch_scope: any
  - id: reviewers-invoke-queries
    allow:
      actors: {group: reviewers}
      actions:
        - invoke_query
  - id: readers-read-every-branch
    allow:
      actors: {group: readers}
      actions:
        - read
      branch_scope: any
  - id: readers-invoke-queries
    allow:
      actors: {group: readers}
      actions:
        - invoke_query
  - id: evaluators-read-and-export-every-branch
    allow:
      actors: {group: evaluators}
      actions:
        - read
        - export
      branch_scope: any
  - id: evaluators-invoke-queries
    allow:
      actors: {group: evaluators}
      actions:
        - invoke_query
  - id: scribes-read-and-write-main
    allow:
      actors: {group: scribes}
      actions:
        - read
        - change
      branch_scope: protected
