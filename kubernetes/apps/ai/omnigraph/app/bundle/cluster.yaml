---
version: 1
metadata:
  name: homelab-memory
storage: file:///var/lib/omnigraph/state
graphs:
  memory:
    schema: memory.pg
    queries:
      - memory.gq
  brain:
    schema: brain.pg
    queries:
      - brain.gq
      - brain.capture.gq
  webgrip:
    schema: meetings.pg
    queries:
      - meetings.gq
policies:
  memory-access:
    file: memory.policy.yaml
    applies_to:
      - memory
  brain-access:
    file: brain.policy.yaml
    applies_to:
      - brain
  webgrip-access:
    file: webgrip.policy.yaml
    applies_to:
      - webgrip
  server-access:
    file: server.policy.yaml
    applies_to:
      - cluster
