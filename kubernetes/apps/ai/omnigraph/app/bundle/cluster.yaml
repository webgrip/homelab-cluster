---
version: 1
metadata:
  name: homelab-memory
storage: file:///var/lib/omnigraph/state
graphs:
  memory:
    schema: memory.pg
    queries:
      - memory.gq
policies:
  memory-access:
    file: memory.policy.yaml
    applies_to:
      - memory
  server-access:
    file: server.policy.yaml
    applies_to:
      - cluster
