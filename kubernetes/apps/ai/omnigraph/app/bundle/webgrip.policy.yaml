---
version: 1
protected_branches:
  - main
groups:
  admins:
    - act-admin
    - act-ryan
  ingest:
    - act-ingest
  explorers:
    - act-explorer
  glide:
    - act-glide
  reviewers:
    - act-review
rules:
  - id: ingest-forks-review-branches
    allow:
      actors: {group: ingest}
      actions:
        - branch_create
      target_branch_scope: unprotected
  - id: ingest-writes-review-branches
    allow:
      actors: {group: ingest}
      actions:
        - change
      branch_scope: unprotected
  - id: admins-read-export-change
    allow:
      actors: {group: admins}
      actions:
        - read
        - export
        - change
      branch_scope: any
  - id: admins-invoke-queries
    allow:
      actors: {group: admins}
      actions:
        - invoke_query
  - id: admins-manage-branches
    allow:
      actors: {group: admins}
      actions:
        - branch_create
        - branch_delete
        - branch_merge
      target_branch_scope: any
  - id: explorers-read-and-export
    allow:
      actors: {group: explorers}
      actions:
        - read
        - export
      branch_scope: any
  - id: glide-reads-every-branch
    allow:
      actors: {group: glide}
      actions:
        - read
      branch_scope: any
  - id: glide-writes-run-branches
    allow:
      actors: {group: glide}
      actions:
        - change
      branch_scope: unprotected
  - id: glide-manages-run-branches
    allow:
      actors: {group: glide}
      actions:
        - branch_create
        - branch_delete
      target_branch_scope: unprotected
  - id: glide-invokes-queries
    allow:
      actors: {group: glide}
      actions:
        - invoke_query
  - id: reviewers-read-and-write-everywhere
    allow:
      actors: {group: reviewers}
      actions:
        - read
        - change
      branch_scope: any
  - id: reviewers-manage-and-merge-branches
    allow:
      actors: {group: reviewers}
      actions:
        - branch_create
        - branch_delete
        - branch_merge
      target_branch_scope: any
  - id: reviewers-invoke-queries
    allow:
      actors: {group: reviewers}
      actions:
        - invoke_query
