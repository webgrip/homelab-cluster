---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: omnigraph-explorer-token
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: omnigraph-explorer-token
  data:
    - match: {secretKey: token, remoteRef: {remoteKey: omnigraph/explorer, property: token}}
