---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: omnigraph-actor-tokens
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: omnigraph-actor-tokens
  data:
    - match: {secretKey: admin_token, remoteRef: {remoteKey: omnigraph/admin, property: token}}
    - match: {secretKey: agent_token, remoteRef: {remoteKey: omnigraph/agent, property: token}}
    - match: {secretKey: reader_token, remoteRef: {remoteKey: omnigraph/reader, property: token}}
    - match: {secretKey: ingest_token, remoteRef: {remoteKey: omnigraph/ingest, property: token}}
    - match: {secretKey: brain_agent_token, remoteRef: {remoteKey: omnigraph/brain-agent, property: token}}
    - match: {secretKey: webgrip_hmac_key, remoteRef: {remoteKey: omnigraph/webgrip-hmac, property: key}}
