---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: omnigraph-ploeg-run-token
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-push
  selector:
    secret:
      name: omnigraph-ploeg-run-token
  data:
    - match: {secretKey: token, remoteRef: {remoteKey: omnigraph/ploeg-run, property: token}}
