---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigraph-ingress
  namespace: ai
  labels:
    app.kubernetes.io/part-of: omnigraph
spec:
  podSelector:
    matchLabels:
      app: omnigraph
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: omnigraph-maintenance-restart-apiserver
  namespace: ai
  labels:
    app.kubernetes.io/part-of: omnigraph
spec:
  endpointSelector:
    matchLabels:
      app: omnigraph-maintenance-restart
  egress:
    - toEntities:
        - kube-apiserver
