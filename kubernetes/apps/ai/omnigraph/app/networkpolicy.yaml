---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigraph-ingress
  namespace: ai
  labels:
    app.kubernetes.io/part-of: omnigraph
spec:
  podSelector:
    matchLabels:
      app: omnigraph
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omnigraph-explorer
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omnigraph-vault-import
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omnigraph-forge-import
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: omnigraph-maintenance-restart-apiserver
  namespace: ai
  labels:
    app.kubernetes.io/part-of: omnigraph
spec:
  endpointSelector:
    matchLabels:
      app: omnigraph-maintenance-restart
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigraph-egress
  namespace: ai
  labels:
    app.kubernetes.io/part-of: omnigraph
spec:
  podSelector:
    matchLabels:
      app: omnigraph
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
