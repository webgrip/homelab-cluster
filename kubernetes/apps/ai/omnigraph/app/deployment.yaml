---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigraph
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omnigraph
  template:
    metadata:
      labels:
        app: omnigraph
        app.kubernetes.io/name: omnigraph
    spec:
      serviceAccountName: omnigraph
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: apply-and-optimize
          # renovate: datasource=docker depName=docker.io/modernrelay/omnigraph-server
          image: harbor.webgrip.dev/dockerhub/modernrelay/omnigraph-server:v0.11.0@sha256:db0911099d93e738641b637a911b83b4ae2b179fe4f0719de4e3eb45a81d50b0
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "/etc/omnigraph/bundle/bootstrap.sh"
          env:
            - name: OMNIGRAPH_BUNDLE_DIR
              value: /var/lib/omnigraph/bundle
            - name: OMNIGRAPH_STATE_DIR
              value: /var/lib/omnigraph/state
            - name: OMNIGRAPH_OPERATOR_ACTOR
              value: act-gitops
            - name: NO_COLOR
              value: "1"
            - name: OMNIGRAPH_EMBED_PROVIDER
              value: openai-compatible
            - name: OMNIGRAPH_EMBED_BASE_URL
              value: http://litellm.ai.svc.cluster.local:4000/v1
            - name: OMNIGRAPH_EMBED_MODEL
              value: granite-embedding-97m-multilingual-r2
            - name: OMNIGRAPH_EMBED_DEADLINE_MS
              value: "20000"
            - name: OMNIGRAPH_EMBED_TIMEOUT_MS
              value: "10000"
            - name: OMNIGRAPH_EMBED_RETRY_ATTEMPTS
              value: "4"
            - name: OMNIGRAPH_EMBED_RETRY_BACKOFF_MS
              value: "500"
            - name: OMNIGRAPH_BACKFILL_MAX_ROWS
              value: "500"
            - name: OMNIGRAPH_BACKFILL_PART_ROWS
              value: "100"
            - name: OMNIGRAPH_BACKFILL_DEADLINE_SECONDS
              value: "150"
          envFrom:
            - secretRef:
                name: omnigraph-embed-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: bundle-source, mountPath: /etc/omnigraph/bundle, readOnly: true}
            - {name: bundle, mountPath: /var/lib/omnigraph/bundle}
            - {name: state, mountPath: /var/lib/omnigraph/state}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: omnigraph
          # renovate: datasource=docker depName=docker.io/modernrelay/omnigraph-server
          image: harbor.webgrip.dev/dockerhub/modernrelay/omnigraph-server:v0.11.0@sha256:db0911099d93e738641b637a911b83b4ae2b179fe4f0719de4e3eb45a81d50b0
          imagePullPolicy: IfNotPresent
          command:
            - "omnigraph-server"
          args:
            - --cluster
            - /var/lib/omnigraph/bundle
            - --bind
            - 0.0.0.0:8080
            - --require-all-graphs
          env:
            - name: OMNIGRAPH_SERVER_BEARER_TOKENS_FILE
              value: /run/secrets/omnigraph/tokens.json
            - name: OMNIGRAPH_SHUTDOWN_GRACE_SECONDS
              value: "25"
            - name: NO_COLOR
              value: "1"
            - name: OMNIGRAPH_EMBED_DEADLINE_MS
              value: "10000"
            - name: OMNIGRAPH_EMBED_TIMEOUT_MS
              value: "5000"
            - name: OMNIGRAPH_EMBED_RETRY_ATTEMPTS
              value: "3"
            - name: OMNIGRAPH_EMBED_RETRY_BACKOFF_MS
              value: "200"
          envFrom:
            - secretRef:
                name: omnigraph-embed-key
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: bundle, mountPath: /var/lib/omnigraph/bundle, readOnly: true}
            - {name: state, mountPath: /var/lib/omnigraph/state}
            - {name: tokens, mountPath: /run/secrets/omnigraph, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: bundle-source
          configMap:
            name: omnigraph-bundle
        - name: bundle
          emptyDir:
            sizeLimit: 16Mi
        - name: state
          persistentVolumeClaim:
            claimName: omnigraph-state
        - name: tokens
          secret:
            secretName: omnigraph-tokens
            items:
              - key: tokens.json
                path: tokens.json
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
