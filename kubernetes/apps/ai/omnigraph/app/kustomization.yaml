---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yaml
  - ./omnigraph-actor-tokens.externalsecret.yaml
  - ./omnigraph-actor-tokens.pushsecret.yaml
  - ./omnigraph-explorer-token.externalsecret.yaml
  - ./omnigraph-explorer-token.pushsecret.yaml
  - ./omnigraph-vault-import-token.externalsecret.yaml
  - ./omnigraph-vault-import-token.pushsecret.yaml
  - ./omnigraph-forge-import-token.externalsecret.yaml
  - ./omnigraph-forge-import-token.pushsecret.yaml
  - ./omnigraph-distill-token.externalsecret.yaml
  - ./omnigraph-distill-token.pushsecret.yaml
  - ./omnigraph-glide-token.externalsecret.yaml
  - ./omnigraph-glide-token.pushsecret.yaml
  - ./omnigraph-review-token.externalsecret.yaml
  - ./omnigraph-review-token.pushsecret.yaml
  - ./omnigraph-ryan-token.externalsecret.yaml
  - ./omnigraph-ryan-token.pushsecret.yaml
  - ./omnigraph-brain-reader-token.externalsecret.yaml
  - ./omnigraph-brain-reader-token.pushsecret.yaml
  - ./omnigraph-brain-eval-token.externalsecret.yaml
  - ./omnigraph-brain-eval-token.pushsecret.yaml
  - ./omnigraph-brain-scribe-token.externalsecret.yaml
  - ./omnigraph-brain-scribe-token.pushsecret.yaml
  - ./omnigraph-tokens.externalsecret.yaml
  - ./omnigraph-embed-key.externalsecret.yaml
  - ./pvc.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./networkpolicy.yaml
  - ./maintenance-restart.rbac.yaml
  - ./maintenance-restart.cronjob.yaml
configMapGenerator:
  - name: omnigraph-bundle
    files:
      - ./bundle/cluster.yaml
      - ./bundle/memory.pg
      - ./bundle/memory.gq
      - ./bundle/memory.policy.yaml
      - ./bundle/brain.pg
      - ./bundle/brain.gq
      - ./bundle/brain.capture.gq
      - ./bundle/brain.topics.gq
      - ./bundle/brain.retrieval.gq
      - ./bundle/brain.policy.yaml
      - ./bundle/meetings.pg
      - ./bundle/meetings.gq
      - ./bundle/webgrip.policy.yaml
      - ./bundle/server.policy.yaml
      - ./bundle/approved-deletions
      - ./bundle/bootstrap.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
components:
  - ../../../../components/placement/worker-pool
