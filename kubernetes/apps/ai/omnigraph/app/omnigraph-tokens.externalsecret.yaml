---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-tokens
  namespace: ai
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: omnigraph-tokens
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        tokens.json: '{"act-admin":"{{ .admin }}","act-agent":"{{ .agent }}","act-reader":"{{ .reader }}","act-ryan":"{{ .ryan }}","act-ingest":"{{ .ingest }}","act-brain-agent":"{{ .brain_agent }}","act-explorer":"{{ .explorer }}","act-vault-import":"{{ .vault_import }}","act-glide":"{{ .glide }}","act-forge-import":"{{ .forge_import }}","act-review":"{{ .review }}"}'
  data:
    - {secretKey: admin, remoteRef: {key: omnigraph/admin, property: token}}
    - {secretKey: agent, remoteRef: {key: omnigraph/agent, property: token}}
    - {secretKey: reader, remoteRef: {key: omnigraph/reader, property: token}}
    - {secretKey: ryan, remoteRef: {key: omnigraph/ryan, property: token}}
    - {secretKey: ingest, remoteRef: {key: omnigraph/ingest, property: token}}
    - {secretKey: brain_agent, remoteRef: {key: omnigraph/brain-agent, property: token}}
    - {secretKey: explorer, remoteRef: {key: omnigraph/explorer, property: token}}
    - {secretKey: vault_import, remoteRef: {key: omnigraph/vault-import, property: token}}
    - {secretKey: glide, remoteRef: {key: omnigraph/glide, property: token}}
    - {secretKey: forge_import, remoteRef: {key: omnigraph/forge-import-token, property: token}}
    - {secretKey: review, remoteRef: {key: omnigraph/review, property: token}}
