---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omnigraph-maintenance-restart
  namespace: ai
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omnigraph-maintenance-restart
  namespace: ai
rules:
  - apiGroups:
      - "apps"
    resources:
      - "deployments"
    resourceNames:
      - "omnigraph"
    verbs:
      - "get"
      - "patch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omnigraph-maintenance-restart
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omnigraph-maintenance-restart
subjects:
  - kind: ServiceAccount
    name: omnigraph-maintenance-restart
    namespace: ai
