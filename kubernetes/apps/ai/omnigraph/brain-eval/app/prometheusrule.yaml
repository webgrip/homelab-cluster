---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: omnigraph-brain-eval
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-brain-eval
spec:
  groups:
    - name: omnigraph-brain-eval.rules
      rules:
        - alert: OmnigraphBrainEvalStale
          expr: |
            time() - last_over_time(brain_eval_last_success_timestamp_seconds{mode="retrieval"}[3d]) > 36 * 3600
            or
            absent_over_time(brain_eval_last_success_timestamp_seconds{mode="retrieval"}[3d])
          for: 30m
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "The brain retrieval eval has not completed a nightly run in 36h (ai/omnigraph-brain-eval-retrieval)"
            description: |
              What's happening:
              - The omnigraph-brain-eval-retrieval CronJob scores brain retrieval every night at 04:40 and pushes brain_eval_last_success_timestamp_seconds{mode="retrieval"} only after its results are stored. No run has completed for more than 36 hours, or none in the last 3 days.

              Impact/risk:
              - Retrieval changes (a new stored query, a writer change, an Omnigraph upgrade) are no longer measured, so a regression in how well the brain finds things goes unnoticed.
              - The brain retrieval phases gate on these scores and cannot be accepted without fresh numbers.

              Likely causes:
              - Omnigraph is restarting or down, or act-brain-eval is missing from tokens.json (log: "omnigraph answered HTTP 401/403" or "HTTP 0").
              - The eval store is unreachable: after the move to the private Forgejo repo the deploy key was removed or forgejo-ssh is down (log: "eval repo not reachable").
              - The eval repo holds no cases or a case file does not parse (log: "the eval repo holds no cases" or a case file name with the line number).
              - vmagent did not accept the push (log: "vmagent answered").

              First actions:
              - kubectl -n ai get cronjob,jobs -l app.kubernetes.io/instance=omnigraph-brain-eval-retrieval
              - kubectl -n ai logs job/<latest job> --all-containers
              - kubectl -n ai create job --from=cronjob/omnigraph-brain-eval-retrieval omnigraph-brain-eval-retrieval-manual
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#brain-eval"
        - alert: OmnigraphBrainEvalJudgeControlFailed
          expr: |
            last_over_time(brain_eval_judge_control_ok[8d]) == 0
          for: 5m
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "The brain eval judge failed its control pair; answer scores are withheld (ai/omnigraph-brain-eval)"
            description: |
              What's happening:
              - Every answer and gate run first asks the judge model (fireworks-deepseek-v4p1-flash) to grade a planted correct answer and a planted unsupported one. The correct one must score 0.8 or more and the unsupported one 0.2 or less, and a verdict that is not valid JSON fails. The last run's judge failed that check, so the run published no answer scores and exited non-zero.

              Impact/risk:
              - Answer quality (key-fact recall, faithfulness, citation precision, abstention) is not measured until the judge passes again.
              - A judge that cannot tell a supported from an unsupported answer would make every later gate decision meaningless.

              Likely causes:
              - Fireworks changed or re-quantised the judge model behind fireworks-deepseek-v4p1-flash, so it now grades differently.
              - The judge prompt or its JSON schema changed and the judge now misreads the task.
              - The provider returned invalid or cut-off JSON (the "judge control pair" line then shows supported 0 and unsupported 1).

              First actions:
              - kubectl -n ai logs job/<latest omnigraph-brain-eval-answer job> -c eval (the "judge control pair" line has both scores)
              - Check the judge model route in LiteLLM and the spend log for the key omnigraph-eval
              - If the model itself no longer passes, switch JUDGE_MODEL in brain_eval.py to the next cheapest model of another family (deepseek-chat, then deepseek-reasoner; never MiniMax, gpt-oss or an Anthropic model) and add it to the omnigraph-eval key
              - Re-run the check cheaply with the smoke job: kubectl -n ai create job --from=cronjob/omnigraph-brain-eval-smoke omnigraph-brain-eval-smoke-manual
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#brain-eval"
        - alert: OmnigraphBrainEvalRunInvalid
          expr: |
            last_over_time(brain_eval_run_valid[3d]) == 0
          for: 5m
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "A brain eval run was marked invalid (ai/omnigraph-brain-eval, mode {{ $labels.mode }})"
            description: |
              What's happening:
              - The last brain eval run of this mode stopped before it stored results and pushed brain_eval_run_valid 0: it hit its spend cap, an upstream refused it, or the eval set did not load.

              Impact/risk:
              - That mode's scores are missing for this run; a gate run that is invalid cannot be used for a phase decision.

              Likely causes:
              - The per-run spend cap was reached (log: "passed the cap"), for example because the raw B0 bridge returned very large outputs.
              - Omnigraph or LiteLLM answered with an error (log: "answered HTTP").
              - A case file in the eval repo does not parse or validate (log names the file and line).

              First actions:
              - kubectl -n ai logs job/<latest omnigraph-brain-eval job> -c eval (the "run invalid" line has the reason)
              - Fix the cause, then re-run the mode with kubectl -n ai create job --from=cronjob/<cronjob> <cronjob>-manual
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#brain-eval"
        - alert: OmnigraphBrainEvalBudgetNearlySpent
          expr: |
            max(litellm_key_spend{key_alias="omnigraph-eval"}) / max(litellm_key_max_budget{key_alias="omnigraph-eval"} > 0) > 0.8
          for: 30m
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "The brain eval has used over 80% of its 30-day LiteLLM budget (ai/omnigraph-eval key)"
            description: |
              What's happening:
              - The omnigraph-eval virtual key has spent more than 80% of its max_budget of USD 10 in the current 30-day window.

              Impact/risk:
              - When the budget runs out LiteLLM refuses the key: weekly answer runs, gates and candidate drafting fail until the window resets.
              - Spend this high means far more runs or far larger runs than the steady state of about USD 2.40 a month.

              Likely causes:
              - Several manual gate runs in one window (about USD 3.50 each).
              - The raw B0 bridge returned very large tool outputs, so each answer used many tokens.
              - A model price rose, or answer mode ran with more repeats than planned.

              First actions:
              - Grafana, AI folder, LiteLLM Inference Spend and Budgets, filtered on key omnigraph-eval
              - kubectl -n ai logs job/<latest omnigraph-brain-eval job> -c eval (spend_usd per run)
              - Raise MAX_BUDGET in litellm/keys/app/omnigraph-eval-key-register.job.yaml only after the cause is understood
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#brain-eval"
        - alert: OmnigraphBrainEvalCaseTextInPublicRepo
          expr: |
            last_over_time(brain_eval_public_repo_leaks[3d]) > 0
          for: 5m
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "An eval question or key fact from the private brain eval set appears in the public homelab-cluster repo (ai/omnigraph-brain-eval-retrieval)"
            description: |
              What's happening:
              - The nightly retrieval run clones the public webgrip/homelab-cluster repo and looks for any eight consecutive words (or the whole phrase, at 5 to 7 words) of an eval question or key fact. Temporal templates are skipped, and so are the key facts of cases whose source document is in this repo, since those quote it. brain_eval_public_repo_leaks counts the cases it found.

              Impact/risk:
              - homelab-cluster is mirrored to public GitHub, so a question found there is published: it reveals what Ryan asks his own notes and can hint at note content.
              - A question the tuned pipeline has seen verbatim also stops being a fair test case.

              Likely causes:
              - A question, key fact, answer or result was pasted into a doc, ticket template, test fixture or commit in this repo.
              - A drafted question or key fact repeats a sentence that is public anyway, for example a key fact quoting a public doc of another repo that this repo also quotes; check the case's source before treating it as a leak.

              First actions:
              - kubectl -n ai logs job/<latest omnigraph-brain-eval-retrieval job> -c eval (the "public repo leak check" line has the count, never the text)
              - Search this repo for the question text from the private eval repo on a trusted machine, remove it in a commit, and rewrite or drop the case in ryangr0/brain-eval
              - Treat a real leak as published: GitHub keeps history, so rotate the case rather than only deleting the text
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#brain-eval"
        - alert: OmnigraphBrainEvalRepoNotPrivate
          expr: |
            last_over_time(brain_eval_repo_private[3d]) == 0
          for: 1m
          labels:
            severity: critical
            owner: platform
            service: omnigraph
          annotations:
            summary: "The private brain eval repo ryangr0/brain-eval can be read without signing in (ai/omnigraph-brain-eval)"
            description: |
              What's happening:
              - Before a brain eval job pushes to the eval repo it reads GET /api/v1/repos/ryangr0/brain-eval on Forgejo without credentials. A private repo answers 404; this one answered 200, so anyone can read it. The job stopped before pushing and marked the run invalid.

              Impact/risk:
              - The repo holds Ryan's own eval questions, key facts taken from his notes, and every per-question result. If it is public, all of that is published, and Forgejo may push-mirror it onward.
              - Every brain eval job stays blocked until the repo is private again, so retrieval and answer scores go stale.

              Likely causes:
              - The repo was created without "Make repository private", or its visibility was changed in Settings.
              - The owner account's visibility or the instance's anonymous-access settings changed.

              First actions:
              - In Forgejo, ryangr0/brain-eval, Settings, Danger zone: make the repository private, then check Settings, Mirror settings for any push mirror and remove it.
              - Treat the contents as published: check the access log for anonymous reads since it went public, and rotate affected cases.
              - Re-run a job: kubectl -n ai create job --from=cronjob/omnigraph-brain-eval-retrieval omnigraph-brain-eval-retrieval-manual (its privacy-store log must say "private": true)
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#brain-eval"
        - alert: OmnigraphBrainEvalStoreNotBackedUp
          expr: |
            (
              time() - max(longhorn_volume_last_backup_at{pvc_namespace="ai", pvc="omnigraph-brain-eval-store"}) > 36 * 3600
              or
              absent_over_time(longhorn_volume_last_backup_at{pvc_namespace="ai", pvc="omnigraph-brain-eval-store"}[1h])
            )
            and on()
            last_over_time(brain_eval_store_provisional[3d]) == 1
          for: 1h
          labels:
            severity: warning
            owner: platform
            service: omnigraph
          annotations:
            summary: "The provisional brain eval store has no Longhorn backup from the last 36h (ai/omnigraph-brain-eval-store)"
            description: |
              What's happening:
              - Until the private repo ryangr0/brain-eval exists, the eval set, its candidate pool and the results history live only in a bare git repo on the PVC omnigraph-brain-eval-store. The volume is attached only while a job runs, so it is backed up by its own Longhorn RecurringJob brain-eval-store-backup at 03:15 UTC, while the CronJob omnigraph-brain-eval-store-backup-window holds it attached from 03:05 to 03:30 UTC. No backup has completed for 36 hours.

              Impact/risk:
              - Losing the volume's replicas loses the only copy of the drafted cases and every stored result.

              Likely causes:
              - The backup target is failing: Garage full or unreachable (the Backup CR is in state Error with "failed to put object").
              - The backup-window job did not run or started too late, so the volume was detached at 03:15 and Longhorn skipped it.
              - The Volume CR lost its recurring-job-group.longhorn.io/brain-eval-store label (Kyverno policy longhorn-backup-enrollment, rule enrol-brain-eval-store).

              First actions:
              - kubectl -n longhorn-system get backups.longhorn.io -l backup-volume=<volume of ai/omnigraph-brain-eval-store> (state and error)
              - kubectl -n ai get jobs -l app.kubernetes.io/name=omnigraph-brain-eval-store-backup-window
              - Take one now: kubectl -n ai create job --from=cronjob/omnigraph-brain-eval-store-backup-window omnigraph-brain-eval-store-backup-window-manual, then kubectl -n longhorn-system create job --from=cronjob/brain-eval-store-backup brain-eval-store-backup-manual
              - The lasting fix is the private repo: once the store moves into ryangr0/brain-eval, Forgejo's own backup covers it and this alert stops applying.
            runbook_url: "https://backstage.${SECRET_DOMAIN}/docs/default/component/homelab-cluster/runbooks/omnigraph/#the-eval-store"
