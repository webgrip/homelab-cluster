---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigraph-brain-eval-egress
  namespace: ai
  labels:
    app.kubernetes.io/part-of: omnigraph
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: omnigraph-brain-eval
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: omnigraph
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: brain-tools
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo
      ports:
        - protocol: TCP
          port: 2222
        - protocol: TCP
          port: 3000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 8429
