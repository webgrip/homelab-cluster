---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: omnigraph-brain-eval-store-backup-window
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-brain-eval-store-backup-window
    app.kubernetes.io/part-of: omnigraph
spec:
  schedule: "5 3 * * *"
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 2400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: omnigraph-brain-eval-store-backup-window
            app.kubernetes.io/part-of: omnigraph
        spec:
          serviceAccountName: omnigraph-brain-eval
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: hold-attached
              image: harbor.webgrip.dev/dockerhub/alpine/git:v2.54.0@sha256:832b1cd1a271509f3d5272a1a62d4cb2ab1a53426ebde1f6c2cb7349f907dc6f
              imagePullPolicy: IfNotPresent
              command:
                - "sh"
                - "-c"
                - "ls /store > /dev/null && echo 'eval store attached for the 03:15 UTC Longhorn backup' && sleep 1500"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 1m, memory: 8Mi}
                limits: {memory: 32Mi}
              volumeMounts:
                - {name: store, mountPath: /store, readOnly: true}
          volumes:
            - name: store
              persistentVolumeClaim:
                claimName: omnigraph-brain-eval-store
                readOnly: true
