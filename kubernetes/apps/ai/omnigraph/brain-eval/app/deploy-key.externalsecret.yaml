---
apiVersion: generators.external-secrets.io/v1alpha1
kind: SSHKey
metadata:
  name: omnigraph-brain-eval-deploy-key
  namespace: ai
spec:
  keyType: ed25519
  comment: omnigraph-brain-eval
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-brain-eval-deploy-key
  namespace: ai
spec:
  refreshInterval: "0"
  target:
    name: omnigraph-brain-eval-deploy-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: SSHKey
          name: omnigraph-brain-eval-deploy-key
