---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-repo-tiers
  namespace: ai
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A JSON document that sorts repositories into tiers for the company view, written by a person with bao kv put secret/omnigraph/repo-tiers tiers=@tiers.json."
    wellhead.dev/verify.format.tiers: "\\s*[\\[{][\\s\\S]*"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: omnigraph-repo-tiers
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - {secretKey: tiers, remoteRef: {key: omnigraph/repo-tiers, property: tiers}}
