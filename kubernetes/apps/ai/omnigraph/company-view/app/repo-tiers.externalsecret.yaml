---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-repo-tiers
  namespace: ai
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: omnigraph-repo-tiers
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - {secretKey: tiers, remoteRef: {key: omnigraph/repo-tiers, property: tiers}}
