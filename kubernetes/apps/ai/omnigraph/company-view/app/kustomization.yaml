---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./repo-tiers.externalsecret.yaml
  - ./cronjob.yaml
  - ./networkpolicy.yaml
  - ./vmrule.yaml
configMapGenerator:
  - name: omnigraph-company-view
    files:
      - ./company_view.py
      - ./default-tiers.json
      - ./apply.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
