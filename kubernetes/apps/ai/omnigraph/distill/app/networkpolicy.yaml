---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigraph-distill-egress
  namespace: ai
  labels:
    app.kubernetes.io/part-of: omnigraph
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: omnigraph-distill
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: omnigraph
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
