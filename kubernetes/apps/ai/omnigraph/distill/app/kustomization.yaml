---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yaml
  - ./cronjob.yaml
  - ./networkpolicy.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: omnigraph-distill
    files:
      - ./distill.py
      - ./extraction.prompt.txt
      - ./extraction.schema.json
      - ./merge.prompt.txt
      - ./snapshot.gq
      - ./snapshot.sh
      - ./apply.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
