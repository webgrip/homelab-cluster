---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-forge-import-forgejo
  namespace: ai
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Forgejo access token with read access to the repositories the forge import reads, made by a person in Forgejo (Settings, Applications)."
    wellhead.dev/verify.http.url: "https://forgejo.webgrip.dev/api/v1/user"
    wellhead.dev/verify.http.auth: "bearer:token"
    wellhead.dev/verify: "http"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: omnigraph-forge-import-forgejo
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - {secretKey: token, remoteRef: {key: omnigraph/forge-import, property: token}}
