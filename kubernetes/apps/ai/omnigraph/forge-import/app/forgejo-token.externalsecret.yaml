---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-forge-import-forgejo
  namespace: ai
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: omnigraph-forge-import-forgejo
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - {secretKey: token, remoteRef: {key: omnigraph/forge-import, property: token}}
