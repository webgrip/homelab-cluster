---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: omnigraph-forge-import
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-forge-import
    app.kubernetes.io/part-of: omnigraph
spec:
  schedule: "40 * * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2700
      template:
        metadata:
          labels:
            app.kubernetes.io/name: omnigraph-forge-import
            app.kubernetes.io/part-of: omnigraph
        spec:
          serviceAccountName: omnigraph-forge-import
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: snapshot
              # renovate: datasource=docker depName=docker.io/modernrelay/omnigraph-server
              image: harbor.webgrip.dev/dockerhub/modernrelay/omnigraph-server:v0.11.0@sha256:db0911099d93e738641b637a911b83b4ae2b179fe4f0719de4e3eb45a81d50b0
              imagePullPolicy: IfNotPresent
              command:
                - "sh"
                - "/etc/forge-import/snapshot.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: NO_COLOR, value: "1"}
                - {name: OMNIGRAPH_URL, value: "http://omnigraph.ai.svc.cluster.local:8080"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/forge-import, readOnly: true}
                - {name: token, mountPath: /run/secrets/omnigraph, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
            - name: plan
              image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:a1321512d6a287428c50dcdf2ab3857761127e03a23b1f648e9c1c0de59288f8
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /etc/forge-import/forge_import.py
                - --forge-url=http://forgejo-http.forgejo.svc.cluster.local:3000
                - --token-file=/run/secrets/forgejo/token
                - --scope-file=/etc/forge-import/scope.json
                - --snapshot-dir=/work/snapshot
                - --out=/work/plan
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 1Gi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/forge-import, readOnly: true}
                - {name: forgejo-token, mountPath: /run/secrets/forgejo, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: apply
              # renovate: datasource=docker depName=docker.io/modernrelay/omnigraph-server
              image: harbor.webgrip.dev/dockerhub/modernrelay/omnigraph-server:v0.11.0@sha256:db0911099d93e738641b637a911b83b4ae2b179fe4f0719de4e3eb45a81d50b0
              imagePullPolicy: IfNotPresent
              command:
                - "sh"
                - "/etc/forge-import/apply.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: NO_COLOR, value: "1"}
                - {name: OMNIGRAPH_URL, value: "http://omnigraph.ai.svc.cluster.local:8080"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 1Gi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/forge-import, readOnly: true}
                - {name: token, mountPath: /run/secrets/omnigraph, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: scripts
              configMap:
                name: omnigraph-forge-import
            - name: token
              secret:
                secretName: omnigraph-forge-import-token
                defaultMode: 0440
                items:
                  - {key: token, path: token}
            - name: forgejo-token
              secret:
                secretName: omnigraph-forge-import-forgejo
                optional: true
                defaultMode: 0440
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
