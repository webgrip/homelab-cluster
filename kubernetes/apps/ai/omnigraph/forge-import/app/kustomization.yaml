---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yaml
  - ./forgejo-token.externalsecret.yaml
  - ./cronjob.yaml
  - ./networkpolicy.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: omnigraph-forge-import
    files:
      - ./forge_import.py
      - ./scope.json
      - ./snapshot.gq
      - ./snapshot.sh
      - ./apply.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
