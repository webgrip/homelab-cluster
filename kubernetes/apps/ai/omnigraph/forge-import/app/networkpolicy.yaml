---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigraph-forge-import-egress
  namespace: ai
  labels:
    app.kubernetes.io/part-of: omnigraph
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: omnigraph-forge-import
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: omnigraph
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo
      ports:
        - protocol: TCP
          port: 3000
