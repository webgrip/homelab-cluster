---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./networkpolicy.yaml
  - ./cronjob.yaml
  - ./vmrule.yaml
configMapGenerator:
  - name: omnigraph-scrub
    files:
      - ./scrub.py
      - ./targets.json
      - ./patterns.json
generatorOptions:
  disableNameSuffixHash: true
