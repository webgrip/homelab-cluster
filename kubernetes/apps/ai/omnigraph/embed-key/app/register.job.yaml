---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omnigraph-embed-key-register
  namespace: ai
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: omnigraph-embed-key-register
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-embed-key-register
    cleanup.webgrip.io/retry-failed: "true"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnigraph-embed-key-register
    spec:
      serviceAccountName: omnigraph-embed-key-register
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: register
          image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - /scripts/register-embed-key.sh
          env:
            - {name: HOME, value: /tmp}
            - {name: LITELLM_URL, value: "http://litellm.ai.svc.cluster.local:4000"}
            - {name: KEY_ALIAS, value: omnigraph-embeddings}
            - {name: EMBED_MODEL, value: granite-embedding-97m-multilingual-r2}
            - {name: MAX_BUDGET, value: "1"}
            - {name: BUDGET_DURATION, value: 30d}
            - {name: RPM_LIMIT, value: "3000"}
            - {name: TPM_LIMIT, value: "1000000"}
            - {name: EMBED_KEY_FILE, value: /run/secrets/omnigraph-embed-key/OMNIGRAPH_EMBED_API_KEY}
            - {name: MASTER_KEY_FILE, value: /run/secrets/litellm/LITELLM_MASTER_KEY}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: embed-key, mountPath: /run/secrets/omnigraph-embed-key, readOnly: true}
            - {name: master-key, mountPath: /run/secrets/litellm, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap:
            name: omnigraph-embed-key-register
        - name: embed-key
          secret:
            secretName: omnigraph-embed-key
            items:
              - key: OMNIGRAPH_EMBED_API_KEY
                path: OMNIGRAPH_EMBED_API_KEY
        - name: master-key
          secret:
            secretName: litellm-secret
            items:
              - key: LITELLM_MASTER_KEY
                path: LITELLM_MASTER_KEY
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
