---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigraph-migrate-source
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  dataSource:
    kind: PersistentVolumeClaim
    name: omnigraph-state
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigraph-migrate-work
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
