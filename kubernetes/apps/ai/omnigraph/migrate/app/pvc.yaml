---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigraph-migrate-source-d
  namespace: ai
  annotations:
    policy.webgrip.io/allow-stateful-delete: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  dataSource:
    kind: PersistentVolumeClaim
    name: omnigraph-state
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigraph-migrate-work
  namespace: ai
  annotations:
    policy.webgrip.io/allow-stateful-delete: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
