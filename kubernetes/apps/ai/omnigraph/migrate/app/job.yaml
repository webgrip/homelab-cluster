---
apiVersion: batch/v1
kind: Job
metadata:
  name: omnigraph-migrate-014-b
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-migrate
    app.kubernetes.io/part-of: omnigraph
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omnigraph-migrate
        app.kubernetes.io/part-of: omnigraph
    spec:
      serviceAccountName: omnigraph
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: copy
          image: harbor.webgrip.dev/dockerhub/modernrelay/omnigraph-server:v0.11.0@sha256:db0911099d93e738641b637a911b83b4ae2b179fe4f0719de4e3eb45a81d50b0
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "/etc/omnigraph-migrate/copy.sh"
          env:
            - {name: OMNIGRAPH_GRAPHS, value: "brain memory webgrip webgrip-knowledge webgrip-notes"}
            - {name: OMNIGRAPH_STATE_DIR, value: /var/lib/omnigraph/state}
            - {name: HOME, value: /tmp}
            - {name: NO_COLOR, value: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: scripts, mountPath: /etc/omnigraph-migrate, readOnly: true}
            - {name: source, mountPath: /source, readOnly: true}
            - {name: work, mountPath: /var/lib/omnigraph/state}
            - {name: tmp, mountPath: /tmp}
        - name: export
          image: harbor.webgrip.dev/dockerhub/modernrelay/omnigraph-server:v0.14.0@sha256:b5c92f1cfe2f735f07bc7aa79ec69d8b8311772a18399dc90136bc23b4943e1a
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "/etc/omnigraph-migrate/export.sh"
          env:
            - {name: OMNIGRAPH_GRAPHS, value: "brain memory webgrip webgrip-knowledge webgrip-notes"}
            - {name: OMNIGRAPH_STATE_DIR, value: /var/lib/omnigraph/state}
            - {name: HOME, value: /tmp}
            - {name: NO_COLOR, value: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: scripts, mountPath: /etc/omnigraph-migrate, readOnly: true}
            - {name: work, mountPath: /var/lib/omnigraph/state}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: load
          image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:01ddf82b43479870a7ea87037b7d68472bef12cc244941843c26bb75bf9a9b04
          imagePullPolicy: IfNotPresent
          command:
            - "python3"
            - "-I"
            - "/etc/omnigraph-migrate/load.py"
          env:
            - {name: OMNIGRAPH_GRAPHS, value: "memory webgrip webgrip-knowledge webgrip-notes brain"}
            - {name: OMNIGRAPH_URL, value: "http://omnigraph-next.ai.svc.cluster.local:8080"}
            - {name: OMNIGRAPH_HTTP_API, value: "0.14"}
            - {name: OMNIGRAPH_TOKEN_FILE, value: /run/secrets/omnigraph/token}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: scripts, mountPath: /etc/omnigraph-migrate, readOnly: true}
            - {name: work, mountPath: /work, readOnly: true}
            - {name: token, mountPath: /run/secrets/omnigraph, readOnly: true}
      volumes:
        - name: scripts
          configMap:
            name: omnigraph-migrate-scripts
        - name: source
          persistentVolumeClaim:
            claimName: omnigraph-migrate-source
        - name: work
          persistentVolumeClaim:
            claimName: omnigraph-migrate-work
        - name: token
          secret:
            secretName: omnigraph-migrate-token
            items:
              - {key: token, path: token}
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
