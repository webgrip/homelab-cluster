---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: omnigraph-vault-import-deploy-key
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: omnigraph-vault-import-deploy-key
  data:
    - match: {secretKey: publicKey, remoteRef: {remoteKey: omnigraph/vault-import-deploy-key, property: public_key}}
