---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-vault-client-terms
  namespace: ai
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The client terms the vault import must not copy, written by a person with bao kv put secret/omnigraph/vault-client-terms terms=-."
    wellhead.dev/verify.format.terms: "[\\s\\S]+"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: omnigraph-vault-client-terms
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - {secretKey: terms, remoteRef: {key: omnigraph/vault-client-terms, property: terms}}
