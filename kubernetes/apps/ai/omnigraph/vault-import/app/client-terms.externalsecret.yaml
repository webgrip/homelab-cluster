---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigraph-vault-client-terms
  namespace: ai
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: omnigraph-vault-client-terms
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - {secretKey: terms, remoteRef: {key: omnigraph/vault-client-terms, property: terms}}
