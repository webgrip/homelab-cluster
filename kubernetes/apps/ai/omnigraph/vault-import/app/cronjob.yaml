---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: omnigraph-vault-import
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-vault-import
    app.kubernetes.io/part-of: omnigraph
spec:
  schedule: "5,20,35,50 * * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: omnigraph-vault-import
            app.kubernetes.io/part-of: omnigraph
        spec:
          serviceAccountName: omnigraph-vault-import
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: clone
              image: harbor.webgrip.dev/dockerhub/alpine/git:v2.54.0@sha256:4fac439ee3b9204bec99c712b8a15942999632458f716ae8149fbb97cb760cd4
              imagePullPolicy: IfNotPresent
              command:
                - "sh"
                - "/etc/vault-import/clone.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: VAULT_REPO_URL, value: "ssh://git@forgejo-ssh.forgejo.svc.cluster.local/webgrip/obsidian-vault.git"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/vault-import, readOnly: true}
                - {name: deploy-key, mountPath: /run/secrets/vault-deploy-key, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
            - name: snapshot
              image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
              imagePullPolicy: IfNotPresent
              command:
                - "sh"
                - "/etc/vault-import/snapshot.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: NO_COLOR, value: "1"}
                - {name: OMNIGRAPH_URL, value: "http://omnigraph-next.ai.svc.cluster.local:8080"}
                - {name: OMNIGRAPH_HTTP_API, value: "0.14"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/vault-import, readOnly: true}
                - {name: embed-step, mountPath: /etc/omnigraph-embed-step, readOnly: true}
                - {name: token, mountPath: /run/secrets/omnigraph, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
            - name: plan
              image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /etc/vault-import/vault_import.py
                - --vault=/work/vault
                - --client-terms-file=/run/secrets/client-terms/terms
                - --snapshot-dir=/work/snapshot
                - --out=/work/plan
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/vault-import, readOnly: true}
                - {name: client-terms, mountPath: /run/secrets/client-terms, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
            - name: embed
              image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /etc/omnigraph-embed-step/embed_step.py
                - embed
                - --plan=/work/plan
                - --contract=/etc/omnigraph-embedding-contract/contract.json
                - --litellm-url=http://litellm.ai.svc.cluster.local:4000
                - --key-file=/run/secrets/litellm/OMNIGRAPH_EMBED_API_KEY
                - --tokens-per-second=300
                - --deadline-seconds=300
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: embed-step, mountPath: /etc/omnigraph-embed-step, readOnly: true}
                - {name: embedding-contract, mountPath: /etc/omnigraph-embedding-contract, readOnly: true}
                - {name: embed-key, mountPath: /run/secrets/litellm, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
            - name: apply
              image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
              imagePullPolicy: IfNotPresent
              command:
                - "sh"
                - "/etc/vault-import/apply.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: NO_COLOR, value: "1"}
                - {name: OMNIGRAPH_URL, value: "http://omnigraph-next.ai.svc.cluster.local:8080"}
                - {name: OMNIGRAPH_HTTP_API, value: "0.14"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/vault-import, readOnly: true}
                - {name: embed-step, mountPath: /etc/omnigraph-embed-step, readOnly: true}
                - {name: token, mountPath: /run/secrets/omnigraph, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: report
              image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /etc/omnigraph-embed-step/embed_step.py
                - report
                - --plan=/work/plan
                - --vmagent-url=http://vmagent-vmagent.observability.svc.cluster.local:8429
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: embed-step, mountPath: /etc/omnigraph-embed-step, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: scripts
              configMap:
                name: omnigraph-vault-import
            - name: deploy-key
              secret:
                secretName: omnigraph-vault-import-deploy-key
                optional: true
                defaultMode: 0440
                items:
                  - {key: privateKey, path: privateKey}
            - name: token
              secret:
                secretName: omnigraph-vault-import-token
                defaultMode: 0440
                items:
                  - {key: token, path: token}
            - name: client-terms
              secret:
                secretName: omnigraph-vault-client-terms
                optional: true
                defaultMode: 0440
            - name: embed-step
              configMap:
                name: omnigraph-embed-step
            - name: embedding-contract
              configMap:
                name: omnigraph-embedding-contract
            - name: embed-key
              secret:
                secretName: omnigraph-embed-key
                defaultMode: 0440
                items:
                  - {key: OMNIGRAPH_EMBED_API_KEY, path: OMNIGRAPH_EMBED_API_KEY}
            - name: work
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
