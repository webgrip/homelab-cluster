---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: omnigraph-vault-import
  namespace: ai
  labels:
    app.kubernetes.io/name: omnigraph-vault-import
    app.kubernetes.io/part-of: omnigraph
spec:
  schedule: "*/15 * * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: omnigraph-vault-import
            app.kubernetes.io/part-of: omnigraph
        spec:
          serviceAccountName: omnigraph-vault-import
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            node.webgrip.io/pool: worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: clone
              image: harbor.webgrip.dev/dockerhub/alpine/git:v2.54.0@sha256:832b1cd1a271509f3d5272a1a62d4cb2ab1a53426ebde1f6c2cb7349f907dc6f
              imagePullPolicy: IfNotPresent
              command:
                - "sh"
                - "/etc/vault-import/clone.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: VAULT_REPO_URL, value: "ssh://git@forgejo-ssh.forgejo.svc.cluster.local/ryangr0/obsidian-vault.git"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/vault-import, readOnly: true}
                - {name: deploy-key, mountPath: /run/secrets/vault-deploy-key, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
            - name: snapshot
              # renovate: datasource=docker depName=docker.io/modernrelay/omnigraph-server
              image: harbor.webgrip.dev/dockerhub/modernrelay/omnigraph-server:v0.11.0@sha256:db0911099d93e738641b637a911b83b4ae2b179fe4f0719de4e3eb45a81d50b0
              imagePullPolicy: IfNotPresent
              command:
                - "sh"
                - "/etc/vault-import/snapshot.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: NO_COLOR, value: "1"}
                - {name: OMNIGRAPH_URL, value: "http://omnigraph.ai.svc.cluster.local:8080"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/vault-import, readOnly: true}
                - {name: token, mountPath: /run/secrets/omnigraph, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
            - name: plan
              image: harbor.webgrip.dev/dockerhub/python:3.14-alpine@sha256:a1321512d6a287428c50dcdf2ab3857761127e03a23b1f648e9c1c0de59288f8
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /etc/vault-import/vault_import.py
                - --vault=/work/vault
                - --client-terms-file=/run/secrets/client-terms/terms
                - --graph-notes=/work/vault_notes.json
                - --graph-links=/work/vault_links.json
                - --out=/work/plan
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/vault-import, readOnly: true}
                - {name: client-terms, mountPath: /run/secrets/client-terms, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: apply
              # renovate: datasource=docker depName=docker.io/modernrelay/omnigraph-server
              image: harbor.webgrip.dev/dockerhub/modernrelay/omnigraph-server:v0.11.0@sha256:db0911099d93e738641b637a911b83b4ae2b179fe4f0719de4e3eb45a81d50b0
              imagePullPolicy: IfNotPresent
              command:
                - "sh"
                - "/etc/vault-import/apply.sh"
              env:
                - {name: HOME, value: /tmp}
                - {name: NO_COLOR, value: "1"}
                - {name: OMNIGRAPH_URL, value: "http://omnigraph.ai.svc.cluster.local:8080"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: scripts, mountPath: /etc/vault-import, readOnly: true}
                - {name: token, mountPath: /run/secrets/omnigraph, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: scripts
              configMap:
                name: omnigraph-vault-import
            - name: deploy-key
              secret:
                secretName: omnigraph-vault-import-deploy-key
                optional: true
                defaultMode: 0440
                items:
                  - {key: privateKey, path: privateKey}
            - name: token
              secret:
                secretName: omnigraph-vault-import-token
                defaultMode: 0440
                items:
                  - {key: token, path: token}
            - name: client-terms
              secret:
                secretName: omnigraph-vault-client-terms
                optional: true
                defaultMode: 0440
            - name: work
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
