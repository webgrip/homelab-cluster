---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # POD SECURITY: this namespace had NO pod-security labels at all, and it is also
    # on the exclusion list of namespace-tenancy-audit's add-application-psa-labels
    # mutate — so nothing was ever going to stamp them. With no label, PSA falls back
    # to the cluster default, which is `privileged` for all three modes. The effect
    # was not that enforcement was missing (it was always going to be privileged
    # here) but that warn and audit were silent too: violations in this namespace
    # were invisible, unlike every other privileged namespace.
    #
    # This mirrors forgejo, which runs the same shape of workload — GitHub Actions
    # runners building nested containers, which cannot satisfy baseline. enforce
    # stays `privileged` and is now EXPLICIT rather than inherited, which is a
    # no-op at admission but makes the intent reviewable. warn/audit go to
    # `restricted` so non-runner workloads here are surfaced without being blocked.
    #
    # arc-systems is also excluded from Kyverno's pod-security-baseline policy, so
    # unlike forgejo there is no second gate behind this. That exclusion predates
    # this change and is left alone deliberately — narrowing it needs the same
    # exception-matrix work as the CEL split (rfc-kyverno-cel-migration.md).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
