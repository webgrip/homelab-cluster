---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: background-batch
value: -100
globalDefault: false
preemptionPolicy: Never
description: >-
  Scheduled and reconcile batch work nobody waits on, such as security scans, tf-runner plans
  and knowledge imports. Equal to ci-batch, so neither preempts the other, and on a full worker
  pool this work waits for room instead of killing a CI job mid-run.
