---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    tolerations:
      - operator: Exists
    autoDirectNodeRoutes: true
    bpf:
      masquerade: true
      # Ref: https://github.com/siderolabs/talos/issues/10002
      hostLegacyRouting: true
    cni:
      # Required for pairing with Multus CNI
      exclusive: false
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # NOTE: devices might need to be set if you have more than one active NIC on your hosts
    # devices: eno+ eth+
    dashboards:
      enabled: true
    # Transparent pod-to-pod encryption on the wire (WireGuard). etcd-at-rest is already
    # covered by Talos secretbox; this closes east-west pod traffic in flight. nodeEncryption
    # stays off (host/node-port traffic excluded) to avoid health-check/DSR interactions. ADR-0004.
    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: false
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false
    hubble:
      enabled: true
      # Metrics-only (no relay/UI pods) — keep the footprint small on RAM-tight
      # nodes. Low-cardinality set: drop reasons + policy verdicts for the
      # zero-trust network dashboard (hubble_drop_total, hubble_policy_verdicts_total).
      metrics:
        enabled:
          - drop
          - policy
        serviceMonitor:
          enabled: true
          trustCRDsExist: true
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: "10.42.0.0/16"
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
    loadBalancer:
      algorithm: maglev
      mode: "dsr"
    localRedirectPolicy: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 1
      # The chart ships `resources: {}` for the operator — unbounded. Bounded here
      # so a leaking operator can't contribute to the node memory pressure that
      # kills the agent (see the agent `resources` note below).
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
      rollOutPods: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    # Top-level `resources` is the cilium-AGENT container (chart convention).
    # 600Mi was too tight for the busiest nodes: the agent's footprint scales with
    # endpoints + policy revisions, and on fringe-workstation (50 pods, node at 85%
    # memory) it crash-looped 805 times in 39 days — exit 137 ~30s after start,
    # liveness `connection reset`. That left `node.cilium.io/agent-not-ready:NoSchedule`
    # stuck on the node, making it intermittently unschedulable and funnelling every
    # new pod onto worker-1 (which sat at 98% CPU requests for 14 days as a result).
    # Measured agent usage 2026-08-02: worker-1 (80 pods) 448Mi, soyo-3 397Mi,
    # worker-2 326Mi. 1Gi gives the busiest node real headroom.
    resources:
      requests:
        cpu: 100m
        memory: 300Mi
      limits:
        memory: 1Gi
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      enabled: true
      hostNamespaceOnly: true
