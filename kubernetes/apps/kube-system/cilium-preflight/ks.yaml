---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-preflight
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/cilium-preflight/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  timeout: 15m
  wait: true
