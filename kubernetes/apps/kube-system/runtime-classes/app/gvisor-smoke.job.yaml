---
# Standing smoke test for the gvisor RuntimeClass (ADR-0079): proves the class
# schedules and the pod really runs on gVisor's Sentry. Inside gVisor `uname -r`
# ends in -gvisor and dmesg starts with "Starting gVisor...". It stays Pending
# until a node carries runtime.webgrip.io/gvisor, which is expected before the
# Talos upgrade lands.
#   kubectl -n kube-system logs job/gvisor-smoke
apiVersion: batch/v1
kind: Job
metadata:
  name: gvisor-smoke
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gvisor-smoke
    spec:
      runtimeClassName: gvisor
      restartPolicy: Never
      containers:
        - name: probe
          image: harbor.webgrip.dev/dockerhub/library/alpine:latest
          command:
            - sh
            - -ec
            - |
              echo "sandbox kernel: $(uname -r)"
              dmesg 2>/dev/null | head -n 1 || true
              echo "nproc: $(nproc), mem: $(grep MemTotal /proc/meminfo)"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
