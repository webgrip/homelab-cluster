---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-basic-auth
  namespace: searxng
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: searxng-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: .htpasswd
      remoteRef:
        key: searxng/basic-auth
        property: htpasswd
