---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-basic-auth
  namespace: searxng
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "An htpasswd line (user:bcrypt hash) for SearXNG's public route behind gateway basic auth, made with htpasswd -nB <user>."
    wellhead.dev/verify.format.htpasswd: "[^:\\s]+:\\$2[aby]\\$\\S+"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: searxng-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: .htpasswd
      remoteRef:
        key: searxng/basic-auth
        property: htpasswd
