apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # The cluster-wide CNPG PodMonitor + alert rules. ONE install only: the PodMonitor
  # selects `cnpg.io/cluster` with `namespaceSelector.any: true`, so a second copy
  # scrapes every CNPG pod a second time (this was installed four times until
  # 2026-08-04 and every pod was scraped 4x).
  - ../../../../components/cnpg-monitoring
