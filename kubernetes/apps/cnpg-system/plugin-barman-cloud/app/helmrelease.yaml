---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
spec:
  interval: 1h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cnpg-system
  values:
    # Single replica (replicaCount: 1) → leader election is pure downside: a missed lease
    # renewal during transient API-server latency makes the controller-runtime manager exit
    # ("leader election lost") and restart, which can interrupt an in-progress backup. The
    # chart hardcodes --leader-elect; appending --leader-elect=false wins (pflag: last value).
    additionalArgs:
      - --leader-elect=false
    sidecarImage:
      registry: ghcr.io
      repository: cloudnative-pg/plugin-barman-cloud-sidecar
      tag: v0.15.1@sha256:2287a793a804db751edd0d07d44cd549e357677e98a800eb12e2cf7c0d53f9b0
    # Off the soyo control-planes (2026-07-11 placement audit); backup plugin
    # only acts when DBs (worker-pinned) are alive anyway.
    nodeSelector:
      node.webgrip.io/pool: worker
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: plugin-barman-cloud
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: plugin-barman-cloud
                annotations:
                  reloader.stakater.com/auto: "true"
