---
# Migration phase 6 (swap): sparkyfitness-secrets (app config) <- OpenBao secret/sparkyfitness/app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-secrets
  namespace: sparkyfitness
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "App secrets written once and copied to OpenBao by their PushSecret; they include an at-rest key the app encrypts its data with. Restore the values from OpenBao's history, never new ones. SPARKY_FITNESS_API_ENCRYPTION_KEY encrypts stored API keys."
    wellhead.dev/fields: "JWT_SECRET SPARKY_FITNESS_ADMIN_EMAIL SPARKY_FITNESS_API_ENCRYPTION_KEY SPARKY_FITNESS_APP_DB_PASSWORD SPARKY_FITNESS_APP_DB_USER SPARKY_FITNESS_EMAIL_PASS SPARKY_FITNESS_EMAIL_USER"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "none"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: sparkyfitness-secrets, creationPolicy: Owner}
  dataFrom:
    - extract: {key: sparkyfitness/app}
