---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: cert-manager
spec:
  # SPLIT FROM THE CONTROLLER 2026-08-06, after a self-inflicted deadlock.
  #
  # ClusterIssuers are validated by cert-manager's own admission webhook. While
  # they lived in the SAME Kustomization as the HelmRelease that runs that
  # webhook, a crashlooping webhook made the whole Kustomization unappliable:
  # the ClusterIssuer dry-run failed with "no endpoints available for service
  # cert-manager-webhook", so Flux could not apply ANY resource in the path —
  # including the HelmRelease change that fixed the webhook. It took a manual
  # `kubectl patch` on the HelmRelease to break out.
  #
  # Worse, cert-manager gates a dependency chain (kyverno -> kyverno-policies),
  # so the stall silently blocked unrelated work: a day of policy commits sat in
  # Git, validated and never applied, while `flux get` showed only
  # DependencyNotReady.
  #
  # Split so the controller can always be repaired. The controller path now
  # contains nothing its own webhook validates; only this Kustomization fails
  # when the webhook is down, and it recovers on its own once it is back.
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: letsencrypt-production
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/cert-manager/issuers/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cert-manager
  timeout: 5m
  wait: true
