---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cert-manager-secret
  namespace: cert-manager
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Cloudflare API token with Zone Read and DNS Edit on the zones cert-manager solves DNS-01 for, made by a person in the Cloudflare dashboard (My Profile, API Tokens)."
    wellhead.dev/verify.cloudflare-token.field: "api-token"
    wellhead.dev/verify: "cloudflare-token"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: cert-manager-secret, creationPolicy: Owner}
  data:
    - secretKey: api-token
      remoteRef: {key: cert-manager/cloudflare, property: api-token}
