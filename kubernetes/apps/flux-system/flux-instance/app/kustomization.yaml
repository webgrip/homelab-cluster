---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./github-webhook-token-secret.externalsecret.yaml
  - ./github-webhook-token-secret.pushsecret.yaml
  - ./grafana-annotations-token.externalsecret.yaml
  - ./grafana-annotations-token.pushsecret.yaml
  - ./httproute.yaml
  - ./receiver.yaml
  - ./grafana-annotations.yaml
  - ./podmonitor.yaml
secretGenerator:
  - name: trusted-signers
    files:
      - trusted-signers/forgejo.sshpub
      - trusted-signers/ryan.sshpub
    options:
      disableNameSuffixHash: true
