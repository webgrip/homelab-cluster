---
# github-webhook-token-secret now sourced from OpenBao. Replaces secret.sops.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-token-secret
  namespace: flux-system
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The shared secret of the GitHub webhook that tells Flux to reconcile: any long random value, typed or left empty to generate, then set as the webhook's secret on GitHub."
    wellhead.dev/generate: "token"
    wellhead.dev/verify.format.token: "\\S{20,}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: github-webhook-token-secret, creationPolicy: Owner}
  data:
    - secretKey: token
      remoteRef: {key: flux/github-webhook, property: token}
