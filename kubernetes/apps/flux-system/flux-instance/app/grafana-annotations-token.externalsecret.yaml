---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-annotations-token
  namespace: flux-system
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Grafana service account token with Annotations Write that Flux's notifications use, made in Grafana (Administration, Service accounts)."
    wellhead.dev/verify.format.token: "glsa_\\S+"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: grafana-annotations-token, creationPolicy: Owner}
  data:
    - secretKey: token
      remoteRef: {key: flux/grafana-annotations, property: token}
