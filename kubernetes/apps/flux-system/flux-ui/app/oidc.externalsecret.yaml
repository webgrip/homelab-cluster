---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-dashboards-oidc
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-dashboards-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: cluster-dashboards
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: authentik/dashboards-oidc
        property: client_secret
