---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoiceninja-secrets
  namespace: invoiceninja
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "App secrets written once and copied to OpenBao by their PushSecret; they include an at-rest key the app encrypts its data with. Restore the values from OpenBao's history, never new ones. APP_KEY encrypts Invoice Ninja's stored data."
    wellhead.dev/fields: "APP_KEY DB_PASSWORD IN_USER_EMAIL IN_USER_PASSWORD MAIL_ENCRYPTION MAIL_FROM_ADDRESS MAIL_FROM_NAME MAIL_HOST MAIL_MAILER MAIL_PASSWORD MAIL_PORT MAIL_USERNAME MARIADB_DATABASE MARIADB_PASSWORD MARIADB_ROOT_PASSWORD MARIADB_USER"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "none"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: invoiceninja-secrets, creationPolicy: Owner}
  dataFrom:
    - extract: {key: invoiceninja/app}
