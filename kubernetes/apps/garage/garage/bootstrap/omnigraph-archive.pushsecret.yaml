---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: garage-omnigraph-archive-key
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: garage-omnigraph-archive-key
  data:
    - match: {secretKey: access_key_id, remoteRef: {remoteKey: garage/omnigraph-archive, property: access_key_id}}
    - match: {secretKey: secret_access_key, remoteRef: {remoteKey: garage/omnigraph-archive, property: secret_access_key}}
    - match: {secretKey: bucket, remoteRef: {remoteKey: garage/omnigraph-archive, property: bucket}}
