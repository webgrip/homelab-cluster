---
# Mirror the Garage-minted TechDocs S3 keys into OpenBao at secret/garage/techdocs
# (the path plan-backstage-techdocs Phase 1 names). Garage is authoritative for the
# key material — it mints the pairs — which is why this is a PushSecret out of the
# cluster rather than an ExternalSecret in (same reasoning as pushsecret.yaml).
#
# Consumers pull only their half:
#   backstage/app/techdocs-s3.externalsecret.yaml            read_* (serve)
#   forgejo/forgejo-actions-secrets/.../techdocs-s3.*.yaml   publish_* (CI publish)
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: garage-techdocs-keys
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: garage-techdocs-keys
  data:
    - match:
        secretKey: publish_access_key_id
        remoteRef:
          remoteKey: garage/techdocs
          property: publish_access_key_id
    - match:
        secretKey: publish_secret_access_key
        remoteRef:
          remoteKey: garage/techdocs
          property: publish_secret_access_key
    - match:
        secretKey: read_access_key_id
        remoteRef:
          remoteKey: garage/techdocs
          property: read_access_key_id
    - match:
        secretKey: read_secret_access_key
        remoteRef:
          remoteKey: garage/techdocs
          property: read_secret_access_key
