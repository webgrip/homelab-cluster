---
# Mirror the per-repo docs publish keys (estate item #2) into OpenBao at
# secret/garage/docs-repo-keys. Garage is authoritative — the techdocs bootstrap
# Job mints/re-reads the keys and rebuilds garage-docs-repo-keys convergently —
# so this is a PushSecret out of the cluster, same reasoning as
# techdocs.pushsecret.yaml. Sole consumer: forgejo-actions-secrets, which
# publishes each pair as REPO-level TECHDOCS_S3_* Actions secrets.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: garage-docs-repo-keys
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: garage-docs-repo-keys
  data:
    - match:
        secretKey: infrastructure_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: infrastructure_access_key_id
    - match:
        secretKey: infrastructure_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: infrastructure_secret_access_key
    - match:
        secretKey: workflows_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: workflows_access_key_id
    - match:
        secretKey: workflows_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: workflows_secret_access_key
    - match:
        secretKey: telemetry-service_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: telemetry-service_access_key_id
    - match:
        secretKey: telemetry-service_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: telemetry-service_secret_access_key
    - match:
        secretKey: ledgerflow_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: ledgerflow_access_key_id
    - match:
        secretKey: ledgerflow_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: ledgerflow_secret_access_key
    - match:
        secretKey: monitoring-platform_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: monitoring-platform_access_key_id
    - match:
        secretKey: monitoring-platform_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: monitoring-platform_secret_access_key
    - match:
        secretKey: searxng-application_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: searxng-application_access_key_id
    - match:
        secretKey: searxng-application_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: searxng-application_secret_access_key
    - match:
        secretKey: freshrss-application_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: freshrss-application_access_key_id
    - match:
        secretKey: freshrss-application_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: freshrss-application_secret_access_key
    - match:
        secretKey: invoiceninja-application_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: invoiceninja-application_access_key_id
    - match:
        secretKey: invoiceninja-application_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: invoiceninja-application_secret_access_key
    - match:
        secretKey: action-typescript-template_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: action-typescript-template_access_key_id
    - match:
        secretKey: action-typescript-template_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: action-typescript-template_secret_access_key
    - match:
        secretKey: application-template_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: application-template_access_key_id
    - match:
        secretKey: application-template_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: application-template_secret_access_key
    - match:
        secretKey: backstage-application_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: backstage-application_access_key_id
    - match:
        secretKey: backstage-application_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: backstage-application_secret_access_key
    - match:
        secretKey: twente.dev_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: twente.dev_access_key_id
    - match:
        secretKey: twente.dev_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: twente.dev_secret_access_key
    - match:
        secretKey: glide_access_key_id
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: glide_access_key_id
    - match:
        secretKey: glide_secret_access_key
        remoteRef:
          remoteKey: garage/docs-repo-keys
          property: glide_secret_access_key
