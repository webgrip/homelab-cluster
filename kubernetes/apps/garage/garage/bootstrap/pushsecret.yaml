---
# Mirror the Garage-minted S3 key into OpenBao at secret/harbor/s3-cluster.
#
# DELIBERATELY A SEPARATE KV PATH from the off-cluster Garage's secret/harbor/s3.
# PushSecret defaults to updatePolicy: Replace, so pushing to the live path would
# destroy the only copy of the OLD credentials — and with them the ability to roll
# back to the off-cluster store by reverting a git commit. Two paths means the two
# credential sets coexist, the rollback stays a two-line revert, and this
# PushSecret is safe to run from day one instead of being staged for the cutover.
#
# Consumed by apps/harbor/harbor/app/harbor-s3-cluster.externalsecret.yaml, which
# materialises Secret `harbor-s3-cluster` alongside (not over) `harbor-s3`.
#
# Garage is authoritative for the key material (it mints the pair), which is why
# this is a PushSecret out of the cluster rather than an ExternalSecret in.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: garage-harbor-key
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: garage-harbor-key
  data:
    - match:
        secretKey: REGISTRY_STORAGE_S3_ACCESSKEY
        remoteRef:
          remoteKey: harbor/s3-cluster
          property: REGISTRY_STORAGE_S3_ACCESSKEY
    - match:
        secretKey: REGISTRY_STORAGE_S3_SECRETKEY
        remoteRef:
          remoteKey: harbor/s3-cluster
          property: REGISTRY_STORAGE_S3_SECRETKEY
