---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: garage-harbor-key
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-push
  selector:
    secret:
      name: garage-harbor-key
  data:
    - match:
        secretKey: REGISTRY_STORAGE_S3_ACCESSKEY
        remoteRef:
          remoteKey: harbor/s3-cluster
          property: REGISTRY_STORAGE_S3_ACCESSKEY
    - match:
        secretKey: REGISTRY_STORAGE_S3_SECRETKEY
        remoteRef:
          remoteKey: harbor/s3-cluster
          property: REGISTRY_STORAGE_S3_SECRETKEY
