---
# TechDocs buckets + keys (ADR-0039 + ADR-0052). Same do-once, gated, idempotent
# shape as bootstrap.job.yaml, and deliberately a SEPARATE Job: the harbor
# bootstrap is done and stable, and `force: true` on this ks re-creates every Job
# on any spec change — keeping them apart means iterating on techdocs never
# re-runs the layout-assign path.
#
# Two buckets, one key pair:
#   techdocs   — TechDocs artifact store (`techdocs-cli publish`, entity-keyed);
#                Backstage's external builder reads it (ADR-0039, deferred).
#   docs-site  — the Zensical-built human site (ADR-0052), website-enabled and
#                served anonymously via Garage's web endpoint (:3902) behind the
#                docs HTTPRoute. Web serving needs no key; the grants below are
#                for CI writes (publish) and debugging reads (read).
# Keys, least-privilege per consumer (plan-backstage-techdocs Phase 1):
#   techdocs-publish  read+write on both  — CI (publish artifact + sync site)
#   techdocs-read     read-only  on both  — Backstage / verification
# Both land in one Secret `garage-techdocs-keys`; techdocs.pushsecret.yaml mirrors
# it to OpenBao secret/garage/techdocs, from which the backstage and forgejo
# namespaces each pull only the half they need.
#
# Every step is guarded on current state: buckets/website/grants converge on every
# re-run; the key pair is minted exactly once (a re-mint would orphan the keys
# CI/Backstage already hold).
#
# Estate item #2 layers per-repo isolation on top (step 5): every docs repo gets
# `docs-<repo>` + `docs-<repo>-trash` and its own key with rw on exactly that
# pair, converged into `garage-docs-repo-keys` → OpenBao garage/docs-repo-keys →
# the forgejo-actions-secrets CronJob publishes them as REPO-level TECHDOCS_S3_*
# (repo-level shadows org-level, so callers change nothing but their bucket).
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-techdocs-bootstrap
  namespace: garage
  labels:
    cleanup.webgrip.io/retry-failed: "true"
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: garage-bootstrap
      automountServiceAccountToken: true
      restartPolicy: Never
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: NAMESPACE
              value: garage
            - name: ADMIN
              value: http://garage-s3.garage.svc.cluster.local:3903
            - name: BUCKET
              value: techdocs
            - name: DOCS_BUCKET
              value: docs-site
            - name: TRASH_BUCKET
              value: docs-site-trash
            - name: KEY_SECRET
              value: garage-techdocs-keys
            # Estate item #2 — bucket-per-repo isolation. One bucket pair +
            # one Garage key per docs repo; the key can touch NOTHING else, so
            # no repo's publish can ever delete another repo's docs (the
            # 2026-08-11 estate wipe becomes structurally impossible, not just
            # excluded-by-flag). homelab-cluster itself stays on docs-site via
            # the org-level key.
            - name: REPOS
              value: >-
                infrastructure workflows telemetry-service ledgerflow
                monitoring-platform searxng-application freshrss-application
                invoiceninja-application action-typescript-template
                application-template backstage-application twente.dev
            - name: REPO_KEY_SECRET
              value: garage-docs-repo-keys
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-admin
                  key: admin_token
          command:
            - /bin/sh
            - -ceu
            - |
              # This ks has NO postBuild.substituteFrom, so braced ${VAR} survives
              # to the shell (same contract as bootstrap.job.yaml).
              auth="Authorization: Bearer ${ADMIN_TOKEN}"
              api() {
                curl -fsS --connect-timeout 5 --max-time 60 \
                  -H "${auth}" -H 'Content-Type: application/json' "$@"
              }

              # Any HTTP status proves the API is up; only connection failure
              # (000) means keep waiting. Layout is assigned by the harbor
              # bootstrap Job; this one only ever adds buckets + keys.
              echo "== waiting for the admin API to answer"
              ready=no
              for i in $(seq 1 60); do
                code="$(curl -sS -o /dev/null -w '%{http_code}' \
                  --connect-timeout 5 --max-time 10 "${ADMIN}/metrics" 2>/dev/null || echo 000)"
                if [ "${code}" != "000" ]; then
                  echo "  admin API answering (HTTP ${code})"; ready=yes; break
                fi
                echo "  no connection yet (${i}/60)"; sleep 5
              done
              [ "${ready}" = yes ] || { echo "admin API never answered" >&2; exit 1; }

              # ensure_bucket ALIAS -> prints the bucket ID. AllowBucketKey takes
              # the ID (hex), NOT the global alias — the alias silently grants
              # nothing.
              ensure_bucket() {
                _alias="$1"
                _info="$(api "${ADMIN}/v2/GetBucketInfo?globalAlias=${_alias}" 2>/dev/null || true)"
                _id="$(echo "${_info}" | jq -r '.id // empty')"
                if [ -z "${_id}" ]; then
                  _created="$(api -X POST "${ADMIN}/v2/CreateBucket" -d "{\"globalAlias\":\"${_alias}\"}")"
                  _id="$(echo "${_created}" | jq -r '.id // empty')"
                  [ -n "${_id}" ] || { echo "bucket creation for ${_alias} returned no id" >&2; return 1; }
                  echo "  created ${_alias} (${_id})" >&2
                else
                  echo "  ${_alias} exists (${_id})" >&2
                fi
                echo "${_id}"
              }

              echo "== 1. buckets"
              bucket_id="$(ensure_bucket "${BUCKET}")"
              docs_bucket_id="$(ensure_bucket "${DOCS_BUCKET}")"
              # Deletion trash-net (estate item #1): rclone --backup-dir target.
              # A separate bucket because backup-dir may not overlap the sync
              # destination, and the root sync's destination IS docs-site's root.
              trash_bucket_id="$(ensure_bucket "${TRASH_BUCKET}")"

              echo "== 2. website access on ${DOCS_BUCKET}"
              # Idempotent: UpdateBucket converges the flag on every re-run. The
              # web endpoint (:3902) serves this bucket anonymously by Host; the
              # HTTPRoute rewrites the public hostname to the bare alias.
              api -X POST "${ADMIN}/v2/UpdateBucket?id=${docs_bucket_id}" \
                -d '{"websiteAccess":{"enabled":true,"indexDocument":"index.html","errorDocument":"404.html"}}' >/dev/null
              echo "  website access enabled (index.html / 404.html)"

              # grant KEY_ID BUCKET_ID READ WRITE — idempotent (re-allow is a no-op).
              grant() {
                api -X POST "${ADMIN}/v2/AllowBucketKey" \
                  -d "{\"bucketId\":\"$2\",\"accessKeyId\":\"$1\",\"permissions\":{\"read\":$3,\"write\":$4,\"owner\":false}}" >/dev/null
              }

              echo "== 3. access keys"
              if kubectl -n "${NAMESPACE}" get secret "${KEY_SECRET}" >/dev/null 2>&1; then
                echo "  ${KEY_SECRET} exists — not minting again; converging grants"
                keys="$(api "${ADMIN}/v2/ListKeys")"
                pub_id="$(echo "${keys}" | jq -r '.[] | select(.name=="techdocs-publish") | .id')"
                read_id="$(echo "${keys}" | jq -r '.[] | select(.name=="techdocs-read") | .id')"
                [ -n "${pub_id}" ] && [ -n "${read_id}" ] || { echo "expected keys missing from Garage" >&2; exit 1; }
              else
                mint_key() {
                  _created="$(api -X POST "${ADMIN}/v2/CreateKey" -d "{\"name\":\"$1\"}")"
                  echo "${_created}" | jq -r '.accessKeyId + " " + .secretAccessKey'
                }
                echo "  minting techdocs-publish (read+write)"
                publish_pair="$(mint_key techdocs-publish)"
                echo "  minting techdocs-read (read-only)"
                read_pair="$(mint_key techdocs-read)"
                pub_id="$(echo "${publish_pair}" | cut -d' ' -f1)"
                read_id="$(echo "${read_pair}" | cut -d' ' -f1)"
                [ -n "${pub_id}" ] && [ "${pub_id}" != "null" ] || { echo "key mint failed" >&2; exit 1; }

                kubectl -n "${NAMESPACE}" create secret generic "${KEY_SECRET}" \
                  --from-literal=publish_access_key_id="${pub_id}" \
                  --from-literal=publish_secret_access_key="$(echo "${publish_pair}" | cut -d' ' -f2)" \
                  --from-literal=read_access_key_id="${read_id}" \
                  --from-literal=read_secret_access_key="$(echo "${read_pair}" | cut -d' ' -f2)" \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "  created ${KEY_SECRET}"
              fi

              echo "== 4. grants (converged every run)"
              grant "${pub_id}"  "${bucket_id}"      true true
              grant "${read_id}" "${bucket_id}"      true false
              grant "${pub_id}"  "${docs_bucket_id}" true true
              grant "${read_id}" "${docs_bucket_id}" true false
              grant "${pub_id}"  "${trash_bucket_id}" true true
              grant "${read_id}" "${trash_bucket_id}" true false
              echo "  publish=rw read=ro on ${BUCKET} + ${DOCS_BUCKET} + ${TRASH_BUCKET}"

              echo "== 5. per-repo buckets + keys (estate item #2)"
              # Unlike the mint-once pair above, this section is fully
              # convergent: GetKeyInfo?showSecretKey=true re-reads existing
              # secrets from Garage (the authority), so the Secret is rebuilt
              # from scratch every run and adding a repo to REPOS later is a
              # one-line change.
              keys_json="$(api "${ADMIN}/v2/ListKeys")"
              set --
              for repo in ${REPOS}; do
                rb_id="$(ensure_bucket "docs-${repo}")"
                rt_id="$(ensure_bucket "docs-${repo}-trash")"
                api -X POST "${ADMIN}/v2/UpdateBucket?id=${rb_id}" \
                  -d '{"websiteAccess":{"enabled":true,"indexDocument":"index.html","errorDocument":"404.html"}}' >/dev/null
                kname="docs-publish-${repo}"
                kid="$(echo "${keys_json}" | jq -r --arg n "${kname}" '.[] | select(.name==$n) | .id')"
                if [ -z "${kid}" ]; then
                  _created="$(api -X POST "${ADMIN}/v2/CreateKey" -d "{\"name\":\"${kname}\"}")"
                  kid="$(echo "${_created}" | jq -r '.accessKeyId // empty')"
                  ksecret="$(echo "${_created}" | jq -r '.secretAccessKey // empty')"
                  echo "  minted ${kname} (${kid})"
                else
                  ksecret="$(api "${ADMIN}/v2/GetKeyInfo?id=${kid}&showSecretKey=true" | jq -r '.secretAccessKey // empty')"
                  echo "  ${kname} exists (${kid})"
                fi
                [ -n "${kid}" ] && [ -n "${ksecret}" ] || { echo "key material for ${repo} incomplete" >&2; exit 1; }
                # The repo key owns exactly its bucket pair; the shared publish
                # key gets READ on the site bucket (offline bundle + checks).
                grant "${kid}" "${rb_id}" true true
                grant "${kid}" "${rt_id}" true true
                grant "${pub_id}" "${rb_id}" true false
                set -- "$@" \
                  --from-literal="${repo}_access_key_id=${kid}" \
                  --from-literal="${repo}_secret_access_key=${ksecret}"
              done
              kubectl -n "${NAMESPACE}" create secret generic "${REPO_KEY_SECRET}" "$@" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "  converged ${REPO_KEY_SECRET} ($(( $# / 2 )) repo key pairs)"

              echo "== done"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
