---
# Mirror the Garage-minted authentik media key to OpenBao garage/authentik-media
# (Garage is authoritative for the key material, so this pushes out of the cluster).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: garage-authentik-media-key
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: garage-authentik-media-key
  data:
    - match: {secretKey: access_key_id, remoteRef: {remoteKey: garage/authentik-media, property: access_key_id}}
    - match: {secretKey: secret_access_key, remoteRef: {remoteKey: garage/authentik-media, property: secret_access_key}}
    - match: {secretKey: bucket, remoteRef: {remoteKey: garage/authentik-media, property: bucket}}
