---
# Both ends of the off-site bucket migration, in one Secret.
#
# The migration Job needs FOUR credential pairs, because the two buckets it moves
# do not share a key:
#   cnpg-backups-bucket  old <- s3/cnpg-backup           new <- s3/cnpg-backup-offsite
#   forgejo              old <- forgejo/s3               new <- forgejo/s3-offsite
# and the forgejo path uses MINIO_* property names rather than S3_*, because that
# is what the Forgejo chart expects and the path predates this migration.
#
# The `-offsite` paths are new, deliberately parallel to the originals rather than
# replacing them — same reasoning as harbor/s3-cluster. Both credential sets exist
# at once, so each app's cutover is a one-line endpoint change and the rollback is
# reverting that same commit. Nothing is re-minted and no key is lost.
#
# This Secret exists only so the Job can read both stores; no app consumes it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bucket-migrate-s3
  namespace: garage
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: bucket-migrate-s3, creationPolicy: Owner}
  data:
    - {secretKey: OLD_CNPG_KEY, remoteRef: {key: s3/cnpg-backup, property: S3_ACCESS_KEY_ID}}
    - {secretKey: OLD_CNPG_SECRET, remoteRef: {key: s3/cnpg-backup, property: S3_SECRET_ACCESS_KEY}}
    - {secretKey: NEW_CNPG_KEY, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_ACCESS_KEY_ID}}
    - {secretKey: NEW_CNPG_SECRET, remoteRef: {key: s3/cnpg-backup-offsite, property: S3_SECRET_ACCESS_KEY}}
    - {secretKey: OLD_FORGEJO_KEY, remoteRef: {key: forgejo/s3, property: MINIO_ACCESS_KEY_ID}}
    - {secretKey: OLD_FORGEJO_SECRET, remoteRef: {key: forgejo/s3, property: MINIO_SECRET_ACCESS_KEY}}
    - {secretKey: NEW_FORGEJO_KEY, remoteRef: {key: forgejo/s3-offsite, property: MINIO_ACCESS_KEY_ID}}
    - {secretKey: NEW_FORGEJO_SECRET, remoteRef: {key: forgejo/s3-offsite, property: MINIO_SECRET_ACCESS_KEY}}
    # guac, for the _db-backups/ prefix only — see the Job for why sboms/ is excluded.
    - {secretKey: OLD_GUAC_KEY, remoteRef: {key: s3/security, property: S3_ACCESS_KEY_ID}}
    - {secretKey: OLD_GUAC_SECRET, remoteRef: {key: s3/security, property: S3_SECRET_ACCESS_KEY}}
    - {secretKey: NEW_GUAC_KEY, remoteRef: {key: s3/security-offsite, property: S3_ACCESS_KEY_ID}}
    - {secretKey: NEW_GUAC_SECRET, remoteRef: {key: s3/security-offsite, property: S3_SECRET_ACCESS_KEY}}
