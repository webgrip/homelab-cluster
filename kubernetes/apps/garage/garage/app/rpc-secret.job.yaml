---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-rpc-secret
  namespace: garage
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-rpc-secret
  namespace: garage
rules:
  # `create` cannot be scoped by resourceNames — RBAC has no name to match against
  # for an object that does not exist yet. Keep it in its own rule so the
  # read/modify verbs below stay narrowed to exactly one Secret.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - garage-rpc
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-rpc-secret
  namespace: garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-rpc-secret
subjects:
  - kind: ServiceAccount
    name: garage-rpc-secret
    namespace: garage
---
# Mints Garage's rpc_secret. This is a Job rather than an ExternalSecret because
# Garage requires exactly 32 bytes hex-encoded, and the ESO password generator
# emits alphanumerics — Garage rejects those at startup.
#
# Idempotent and NON-destructive: if the Secret already exists it is left alone.
# Regenerating an rpc_secret on a live cluster would break the node's identity, so
# "create if absent" is the only safe behaviour here.
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-rpc-secret
  namespace: garage
  annotations:
    # Job spec.template is IMMUTABLE, so any change to the script below is
    # rejected on apply and wedges this Kustomization permanently. Per-resource
    # force (delete+recreate) rather than ks-level `spec.force`, because this ks
    # also owns the StatefulSet and PVCs, which must NOT be recreated.
    # Value is `enabled`, not `true`.
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    # Terminal-Failed Jobs are deleted hourly by the Kyverno
    # cleanup-opt-in-failed-jobs policy and recreated by Flux = automatic retry.
    # Complete runs are never touched (do-once marker, ADR-0003).
    cleanup.webgrip.io/retry-failed: "true"
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: garage-rpc-secret
      automountServiceAccountToken: true
      restartPolicy: Never
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mint
          image: harbor.webgrip.dev/dockerhub/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: NAMESPACE
              value: garage
            - name: SECRET_NAME
              value: garage-rpc
          command:
            - /bin/sh
            - -ceu
            - |
              # This ks has NO postBuild.substituteFrom, so braced ${VAR} is left
              # intact for the shell. Do not add substituteFrom without rewriting
              # these to unbraced $VAR — envsubst would blank them silently.
              if kubectl -n "${NAMESPACE}" get secret "${SECRET_NAME}" >/dev/null 2>&1; then
                echo "secret ${SECRET_NAME} already exists — leaving it alone"
                echo "(regenerating rpc_secret would break the running node's identity)"
                exit 0
              fi
              echo "minting rpc_secret (32 bytes hex)"
              # NOT `openssl rand -hex 32` — this image has no openssl (verified:
              # it ships od/xxd/hexdump but not openssl, and the first run failed
              # with "openssl: not found"). od is present and portable.
              od -An -vtx1 -N32 /dev/urandom | tr -d ' \n' > /tmp/rpc_secret
              len="$(wc -c < /tmp/rpc_secret)"
              [ "${len}" -eq 64 ] || { echo "expected 64 hex chars, got ${len}" >&2; exit 1; }
              kubectl -n "${NAMESPACE}" create secret generic "${SECRET_NAME}" \
                --from-file=rpc_secret=/tmp/rpc_secret \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "created ${SECRET_NAME}"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
