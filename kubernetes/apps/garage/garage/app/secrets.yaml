---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-admin
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: "0"
  target:
    name: garage-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
      rewrite:
        - regexp:
            source: "password"
            target: "admin_token"
