---
# Admin/metrics API token. Free-form, so the ESO password generator is the right
# tool — no OpenBao round-trip and no human ever sees it.
# refreshInterval "0" = generate once, never rotate. NOTE (ESO skill): adding a
# new key to this ExternalSecret later is NOT picked up while refreshInterval is
# "0" — the derived Secret must be deleted once to re-materialise.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-admin
spec:
  refreshInterval: "0"
  target:
    name: garage-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator-32
      rewrite:
        - regexp:
            source: "password"
            target: "admin_token"
