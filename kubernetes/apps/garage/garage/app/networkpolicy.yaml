---
# Zero-trust re-opening for the `garage` namespace (default-deny is generated by
# Kyverno from the namespace label). Cross-namespace rules use namespaceSelector,
# never ipBlock: Cilium enforces on the post-DNAT backend identity, so a CIDR rule
# silently misses Service traffic (the 2026-07-17 forgejo-db outage).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage-allow-ingress
  labels:
    app.kubernetes.io/part-of: garage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Intra-namespace: the bootstrap Job -> admin API, and RPC between replicas
    # if this ever grows past one node.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: garage
    # Harbor's registry -> S3 API. This is the whole point of the namespace.
    # NOTE: the matching EGRESS allow must also exist on harbor's side — harbor's
    # egress excludes the pod CIDR, so without it this ingress rule is moot.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
      ports:
        - protocol: TCP
          port: 3900
    # Backstage TechDocs reader -> S3 API (ADR-0039): `builder: external` serves
    # prebuilt docs straight from the techdocs bucket. Read-only key; the matching
    # EGRESS allow lives on backstage's side (its egress excludes the pod CIDR).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backstage
      ports:
        - protocol: TCP
          port: 3900
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: omnigraph-explorer
      ports:
        - protocol: TCP
          port: 3900
    # Forgejo CI -> S3 API (ADR-0039): `techdocs-cli publish` writes the built
    # docs into the techdocs bucket. Two labels because jobs that declare
    # `container:` run on the SHARED forgejo-dind DaemonSet, not in the runner
    # pod (run 1028's 5-minute S3 black hole, 2026-08-09). forgejo-agent-runner
    # (LLM-authored workloads, ADR-0048) stays excluded — it uses its own in-pod
    # dind sidecar and matches neither label; same reasoning as
    # forgejo-runner-allow-openbao on the forgejo side.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - forgejo-runner
                  - forgejo-dind
      ports:
        - protocol: TCP
          port: 3900
    # envoy-internal -> web endpoint (ADR-0052): the docs-site bucket is served
    # as a static website through the gateway at docs.<domain> (LAN-only).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
      ports:
        - protocol: TCP
          port: 3902
    # Metrics scraping.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 3903
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage-allow-egress
  labels:
    app.kubernetes.io/part-of: garage
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Intra-namespace only. Garage serves; it does not call out. DNS is granted
    # separately by the Kyverno-generated allow-dns policy.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: garage
---
# Egress for the one-shot bucket migration Job ONLY — scoped by job-name, not
# granted namespace-wide, so Garage itself keeps its intra-namespace-only egress.
#
# Two destinations, both genuinely outside the cluster, which is why ipBlock is
# correct here and namespaceSelector is not (the reverse of the rule above: the
# post-DNAT-identity trap applies to Service traffic, not to external addresses).
#
#   10.0.0.110:3900     the Proxmox box's Garage, plain HTTP on the LAN. Source.
#   116.202.53.185:443  the off-site Garage behind Caddy. Destination. Garage
#                       binds to loopback there, so 443 is the only open port and
#                       the admin API on 3903 is unreachable by construction.
#
# This policy can be deleted along with the Job once the Proxmox box is retired.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage-bucket-migrate-egress
  labels:
    app.kubernetes.io/part-of: garage
spec:
  podSelector:
    matchLabels:
      job-name: garage-bucket-migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.110/32
      ports:
        - {protocol: TCP, port: 3900}
    - to:
        - ipBlock:
            cidr: 116.202.53.185/32
      ports:
        - {protocol: TCP, port: 443}
---
# API-server egress for the two provisioner Jobs (they write Secrets via kubectl).
# This MUST be a CiliumNetworkPolicy `toEntities: kube-apiserver`, not a CIDR rule:
# Cilium matches the API server by a reserved identity, so even an
# `ipBlock: 0.0.0.0/0` egress does not cover it — the rule looks permissive and the
# calls still time out on 10.43.0.1:443. Same trap as components/cnpg-netpol.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage-allow-provisioner-apiserver
spec:
  endpointSelector:
    matchExpressions:
      - key: job-name
        operator: Exists
  egress:
    - toEntities:
        - kube-apiserver
