---
# Dedicated identity. Garage never calls the Kubernetes API, so this carries no
# Role at all and the token is not mounted — but running as `default` would be
# both a workload-hardening finding and a needless shared identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage
  namespace: garage
automountServiceAccountToken: false
---
# Headless service — gives the StatefulSet its stable pod identity and carries the
# RPC port. Garage derives its node address from this.
apiVersion: v1
kind: Service
metadata:
  name: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: garage
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: rpc
      port: 3901
      targetPort: rpc
---
# The address consumers use. `garage-s3.garage.svc.cluster.local:3900`.
apiVersion: v1
kind: Service
metadata:
  name: garage-s3
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: garage
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: web
      port: 3902
      targetPort: web
    - name: admin
      port: 3903
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/part-of: garage
    spec:
      # Garage never calls the Kubernetes API — its config is a file and its
      # bootstrap is a separate Job.
      serviceAccountName: garage
      automountServiceAccountToken: false
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: docker.io/dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
          imagePullPolicy: IfNotPresent
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: web
              containerPort: 3902
            - name: admin
              containerPort: 3903
          # The image has no ENTRYPOINT; its CMD is ["/garage","server"], which we
          # keep. Config and secret locations come from the env vars documented in
          # `garage --help` rather than CLI flags or TOML keys — the env-var names
          # are the part of the contract that is explicitly documented.
          env:
            # Garage's default config path is /etc/garage.toml, NOT the directory
            # this mounts into. Without this the config is silently not found.
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
            # Secrets come in as env vars, NOT as mounted files, because the file
            # path is unwinnable here: Garage demands mode 0600 and treats
            # group-readable as world-readable, but Kubernetes secret volumes are
            # owned by root:fsGroup — so 0600 is unreadable by the uid-1000
            # process and 0440 is rejected outright ("File ... is world-readable!
            # (mode: 0100440, expected 0600)"). The alternatives were running as
            # root or setting GARAGE_ALLOW_WORLD_READABLE_SECRETS; env vars need
            # neither, and match how every other app in this repo takes secrets.
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-rpc
                  key: rpc_secret
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-admin
                  key: admin_token
          # tcpSocket, NOT httpGet /health — deliberately.
          #
          # Garage's /health reports CLUSTER health and returns 503 until a layout
          # has been assigned. Probing it deadlocks bring-up: 503 -> pod not Ready
          # -> the garage-s3 Service has no endpoints -> the bootstrap Job cannot
          # reach the admin API -> no layout is ever assigned -> /health stays 503.
          # On liveness it is worse still: the kubelet restarts the container every
          # couple of minutes forever. Both observed on first bring-up.
          #
          # These probes answer "is the process serving?", which is what a probe is
          # for. Cluster health is a monitoring concern and belongs on the
          # garage_* metrics from vmservicescrape.yaml, not on the kubelet.
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: config
              mountPath: /etc/garage/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-single
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: data
      spec:
        # Sized for Harbor's hosted `webgrip` project (20.5 GiB measured
        # 2026-07-31) plus room for the proxy cache to re-warm and grow.
        # `longhorn-single` is 1 replica on purpose — see the class header.
        # Expandable online (allowVolumeExpansion) once the reclaimed node adds
        # capacity, at which point this should move to a 2-replica class.
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-single
        resources:
          requests:
            storage: 100Gi
