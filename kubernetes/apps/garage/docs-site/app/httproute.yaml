---
# docs.<domain> -> Garage web endpoint (ADR-0052). LAN-only (envoy-internal +
# split DNS via k8s-gateway; external-dns excluded). Garage's s3_web routes by
# Host header to a bucket's global alias, so the URLRewrite filter swaps the
# public hostname for the bare `docs-site` alias — the SOPS-guarded domain
# literal never reaches Garage's config or the bucket taxonomy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docs-site
  namespace: garage
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  hostnames:
    - docs.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: docs-site
      backendRefs:
        - name: garage-s3
          namespace: garage
          port: 3902
