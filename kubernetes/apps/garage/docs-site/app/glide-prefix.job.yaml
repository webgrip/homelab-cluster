---
apiVersion: batch/v1
kind: Job
metadata:
  name: docs-glide-prefix-seed
  namespace: garage
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    cleanup.webgrip.io/retry-failed: "true"
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        node.webgrip.io/pool: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seed
          image: harbor.webgrip.dev/webgrip/techdocs-builder:1.6.0
          env:
            - name: RCLONE_CONFIG_GARAGE_TYPE
              value: s3
            - name: RCLONE_CONFIG_GARAGE_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_GARAGE_ENDPOINT
              value: http://garage-s3.garage.svc.cluster.local:3900
            - name: RCLONE_CONFIG_GARAGE_REGION
              value: garage
            - name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE
              value: "true"
            - name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: garage-docs-repo-keys, key: glide_access_key_id}
            - name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: garage-docs-repo-keys, key: glide_secret_access_key}
          command:
            - /bin/sh
            - -ceu
            - |
              if rclone lsf garage:docs-glide/.glide-prefix-seeded | test -n "$(cat)"; then
                echo 'Glide prefix already seeded'
                exit 0
              fi
              rclone copy garage:docs-glide /tmp/site --exclude '/glide/**' --exclude '/.glide-prefix-seeded' --checksum
              test -s /tmp/site/index.html
              test -s /tmp/site/docs-sources.json
              rclone copy /tmp/site garage:docs-glide/glide --checksum
              rclone touch garage:docs-glide/.glide-prefix-seeded
              echo 'Glide prefix seeded; original objects retained'
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scratch, mountPath: /tmp}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 128Mi}
