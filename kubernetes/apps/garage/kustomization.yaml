---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: garage

components:
  # cluster-secrets into this namespace — the garage-docs-site ks substitutes
  # ${SECRET_DOMAIN} in its HTTPRoute, and substituteFrom resolves in the
  # Kustomization's OWN namespace (post-build failed without this).
  - ../../components/sops
  - ../../components/resource-quota

resources:
  - ./namespace.yaml
  - ./garage/ks.yaml
  - ./docs-site/ks.yaml
