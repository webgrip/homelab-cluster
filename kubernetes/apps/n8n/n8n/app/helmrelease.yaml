---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  chartRef:
    kind: OCIRepository
    name: n8n
  interval: 30m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: uninstall
  values:
    controllers:
      n8n:
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          # Pin to the worker pool off the soyos (ADR-0002) via native nodeSelector
          # + strategy:Recreate above — NOT the postRenderer component, which
          # deadlocks helm-controller on this RWO move.
          nodeSelector:
            # `pool: worker`, NOT `ram: high`. ram=high resolves to worker-1 alone
            # (24Gi), and worker-1 was excluded by the old volume's PV
            # nodeAffinity — an empty intersection that made n8n unschedulable and
            # took it down on 2026-08-02. The replacement volume (pvc-data.yaml)
            # has no PV pin at all, and n8n peaks well under 400Mi, so it has no
            # business reserving the cluster's only 24Gi node. The RWO volume
            # re-attaches via Longhorn and strategy:Recreate handles the
            # single-writer handoff.
            node.webgrip.io/pool: worker
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: harbor.webgrip.dev/dockerhub/n8nio/n8n
              tag: 2.34.4@sha256:f69bad7a699300702af665b9f13fc67455b93c9fb9174bca6c37f3d4a47b8583
            envFrom:
              - configMapRef:
                  name: n8n-env
              - secretRef:
                  name: n8n-secrets
            ports:
              - name: http
                containerPort: 5678
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/readiness
                    port: http
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/readiness
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                memory: 768Mi
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: http
    persistence:
      data:
        # n8n-data, not n8n — see pvc-data.yaml. The legacy claim's PV carries an
        # immutable WFFC-era nodeAffinity excluding both workers.
        existingClaim: n8n-data
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.n8n
                readOnly: false
