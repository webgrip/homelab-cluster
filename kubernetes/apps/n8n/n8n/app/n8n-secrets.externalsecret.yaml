---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: n8n
  annotations:
    wellhead.dev/origin: "preserve"
    wellhead.dev/how: "App secrets written once and copied to OpenBao by their PushSecret; they include an at-rest key the app encrypts its data with. Restore the values from OpenBao's history, never new ones. N8N_ENCRYPTION_KEY encrypts n8n's stored credentials."
    wellhead.dev/fields: "N8N_ENCRYPTION_KEY DB_POSTGRESDB_PASSWORD"
    wellhead.dev/rotate-on-compromise: "false"
    wellhead.dev/verify: "none"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: n8n-secrets, creationPolicy: Owner}
  dataFrom:
    - extract: {key: n8n/app}
