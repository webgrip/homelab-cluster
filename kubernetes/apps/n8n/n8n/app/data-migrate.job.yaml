---
# One-shot copy of n8n's state directory (/home/node/.n8n) from the legacy `n8n`
# PVC to the freshly-created `n8n-data` PVC — see pvc-data.yaml for
# why the old volume has to be abandoned rather than repaired (its PV
# nodeAffinity is immutable, and eviction cannot rewrite it: ADR-0002 lines
# 90-100).
#
# WHY THIS POD RUNS ON A SOYO, contrary to ADR-0002's pool=worker rule:
# both claims are RWO, so a single pod must attach BOTH at once, and the old PV
# will only attach on soyo-1/2/3 or fringe-workstation. fringe is excluded
# because its cilium-agent crash-loops and the resulting
# node.cilium.io/agent-not-ready taint makes placement there a coin flip. That
# leaves the soyos. This is a one-shot migration Job, not a resident app, and the
# constraint comes from the very PV pin we are removing — so the exception
# disappears together with this file.
#
# WHY runAsUser 1000 AND NOT root: the first attempt ran as uid 0 and failed —
# root with `capabilities.drop: ALL` has neither CAP_DAC_OVERRIDE (so it cannot
# read `config`, mode 0600 owned by uid 1000) nor CAP_CHOWN (so `cp -a` cannot
# preserve ownership). Restoring those capabilities would be the wrong fix: every
# file in the tree is ALREADY owned by 1000:1000, because n8n runs as uid 1000
# with fsGroup 1000. Running as that same uid reads and writes everything with no
# capabilities at all, and the copy lands owned exactly as n8n expects. Fully
# hardened: non-root, read-only rootfs, all capabilities dropped, no privilege
# escalation, no service-account token, no network needed.
#
# WHY tar AND NOT `cp -a`: busybox `cp -a` implies -p, which attempts chown even
# when the target ownership is already correct, and fails the Job. A tar pipe
# preserves mode and structure, creates entries owned by the running uid, and is
# the only form that can skip lost+found (an ext4 artifact, not app data, and
# root-owned so unreadable here) without needing a shell variable — see the args
# comment on why variables are forbidden in this file.
apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-data-migrate
  namespace: n8n
  annotations:
    # Job spec.template is immutable. Bump PASS below and this annotation makes
    # Flux delete+recreate so the Job re-runs. Per-resource, NOT ks-level force:
    # this ks also owns n8n's HelmRelease and both PVCs.
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    # Terminal-Failed Jobs are reaped hourly by the Kyverno cleanup policy and
    # recreated by Flux = automatic retry. Complete runs are left alone.
    cleanup.webgrip.io/retry-failed: "true"
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # Mirrors the old PV's own nodeAffinity minus fringe-workstation
              # (see the header). Deliberately a list, not a single hostname, so
              # the Job still places if one soyo is cordoned for maintenance.
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "soyo-1"
                      - "soyo-2"
                      - "soyo-3"
      securityContext:
        # uid/gid 1000 == the uid every file in the source tree is already owned
        # by (n8n runs as `node`). fsGroup matches helmrelease.yaml so the
        # destination ends up group-owned exactly as n8n expects.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: copy
          image: harbor.webgrip.dev/dockerhub/library/busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-ceu"
          env:
            # Bump to trigger a re-run (see the force annotation above).
            - name: PASS
              value: "2"
          args:
            # NO shell variables in this script, deliberately. This ks has
            # postBuild.substituteFrom, so envsubst rewrites these args before
            # Kubernetes ever sees them: a brace-wrapped reference to anything
            # absent from cluster-secrets is silently blanked, and the
            # double-dollar escape form fails the whole Kustomization. flux-local
            # catches neither, because a blanked script is still valid YAML.
            # (This comment avoids writing either dollar form literally, since
            # envsubst processes comments too.) PASS is still an env var: it
            # exists to change the pod spec and trigger a re-run.
            - |
              echo "== n8n data migrate: /old (legacy PVC) -> /new (n8n-data)"

              echo "== source tree"
              ls -la /old
              du -sh /old

              # Converge, then verify — do NOT refuse on a non-empty destination.
              # Flux recreates this Job whenever the pod spec changes (the force
              # annotation), and Kyverno reaps Failed ones hourly, so it WILL run
              # again over an already-copied volume. Refusing there turns a
              # succeeded migration into a permanently red Job. Copy only when
              # there is nothing to copy onto; verify unconditionally either way,
              # so a re-run is a free integrity check rather than a no-op.
              #
              # (Skipping the copy is also required for correctness, not just
              # tidiness: this pod runs as uid 1000 and cannot overwrite entries
              # a differently-owned run left behind — tar surfaces that as
              # "can't remove old file ...: Permission denied".)
              echo "== destination state"
              if find /new -mindepth 1 -path /new/lost+found -prune -o -print | grep -q .; then
                echo "-- /new already populated; skipping copy, verifying only"
              else
                # tar pipe, not `cp -a` — see the header. Preserves mode,
                # structure and dotfiles; entries land owned by the running uid
                # (1000), which is what n8n expects. lost+found is an ext4
                # artifact, root-owned, and not app data.
                echo "-- /new empty; copying"
                cd /old && tar cf - --exclude=./lost+found . | tar xf - -C /new
              fi

              # Real verification, not a size check: every regular file's md5 and
              # path must match on both sides. A size-only comparison would pass
              # on a truncated-then-repadded file. Same lost+found exclusion, or
              # the two sides would never agree.
              echo "== verifying checksums"
              cd /old && find . -path ./lost+found -prune -o -type f -exec md5sum {} + | sort -k 2 > /tmp/old.sums
              cd /new && find . -path ./lost+found -prune -o -type f -exec md5sum {} + | sort -k 2 > /tmp/new.sums
              diff /tmp/old.sums /tmp/new.sums

              echo "== file count"
              wc -l < /tmp/old.sums
              echo "== destination tree"
              du -sh /new
              echo "== migrate pass complete: trees are identical"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: old
              mountPath: /old
            - name: new
              mountPath: /new
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: n8n
        - name: new
          persistentVolumeClaim:
            claimName: n8n-data
        - name: tmp
          emptyDir: {}
