---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    namespaceOverride: network
    global:
      imageRegistry: mirror.gcr.io
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
    deployment:
      pod:
        affinity: {}
        nodeSelector:
          node.webgrip.io/pool: worker
        tolerations:
          - key: dedicated
            operator: Equal
            value: fringe
            effect: NoSchedule
      envoyGateway:
        startupProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 12 # 2 minutes grace on cold start
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6 # 2 minutes before kill after startup

  # The envoy-gateway chart honours deployment.pod.nodeSelector and .tolerations but has NO
  # template reference for priorityClassName — Helm accepts the unknown value and silently drops
  # it. Verified on the live Deployment: nodeSelector and tolerations present, priorityClassName
  # empty, while the EnvoyProxy CR (which does support it) applied cleanly to the data plane.
  #
  # The operator is platform tier for the same reason the data plane is: it reconciles the
  # gateways, so if it cannot schedule, nothing repairs them. Patched in directly rather than
  # waiting for chart support.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: envoy-gateway
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: platform-critical
