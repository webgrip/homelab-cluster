---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ploeg-github-webhook
spec:
  hostnames:
    - ploeg-hooks.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /webhooks/forge/github
          method: POST
      backendRefs:
        - name: ploeg
          namespace: ploeg
          port: 8080
