---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              # 25m, not 100m. Measured 2026-08-01: all four envoy pods (2 external
              # + 2 internal) sit at 2-3m steady, so 100m each reserved 400m of a
              # 4-core node for ~10m of real work. worker-1 hit 99% CPU *requests*
              # against ~28% actual use and stopped being able to schedule anything
              # at all -- including Longhorn's instance-manager, which is how a
              # capacity problem turned into a storage one.
              # There is deliberately no CPU limit here, so this changes scheduling
              # only: envoy still bursts freely under load. 25m is ~10x observed.
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 1Gi
        pod:
          # Ingress is platform, not application. Without this the data plane queued behind
          # erfbeeld/authentik/weave-gitops when worker-1 filled up on 2026-08-01 and the VIP
          # refused connections cluster-wide. See priorityclass.yaml.
          priorityClassName: platform-critical
          # Pins in git what the envoy-gateway operator already applies to the
          # container (runAsUser/Group 65532, drop-ALL, seccomp) but never
          # declares at the pod level -- nothing in git guaranteed it. Ticket #27.
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          nodeSelector:
            node.webgrip.io/pool: worker
          tolerations:
            - key: dedicated
              operator: Equal
              value: fringe
              effect: NoSchedule
          # Prefer keeping the data plane OFF fringe: that node also runs the CI dind daemon
          # and Harbor, and its saturation made the internal VIP refuse connections during
          # image releases (infra runs 137/158). externalTrafficPolicy is Cluster, so any
          # replica on a starved node degrades the VIP for ~half of connections. Preferred,
          # not required — if worker-1 is down, falling back onto fringe (via the toleration
          # above) beats no ingress at all.
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - "fringe-workstation"
      envoyService:
        externalTrafficPolicy: Cluster
  shutdown:
    drainTimeout: 180s
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Gzip
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy
    namespace: network
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: external.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: "10.0.0.28"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-production-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  annotations:
    external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: internal.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: "10.0.0.27"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-production-tls
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy
spec:
  compressor:
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
  connection:
    bufferLimit: 8Mi
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy
spec:
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  connection:
    bufferLimit: 4Mi
    maxAcceptPerSocketEvent: 0
  http2:
    initialStreamWindowSize: 512Ki
    initialConnectionWindowSize: 8Mi
    onInvalidMessage: TerminateStream
  http3: {}
  # Envoy Gateway's DEFAULT escaped-slash action is UnescapeAndRedirect: a 307 that unescapes
  # ONLY %2F/%5C. That breaks Forgejo's npm registry — Forgejo's own dist.tarball URLs are
  # fully-encoded (/npm/%40scope%2Fname/-/<v>/<file>.tgz), and the redirect's half-decoded form
  # (%40scope/name/...) 404s in Forgejo's router, so every `npm install` of a scoped package
  # against forgejo.<domain> failed at the tarball fetch. KeepUnchanged forwards the path as the
  # client sent it, letting Forgejo serve the canonical URLs it generates.
  path:
    escapedSlashesAction: KeepUnchanged
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  tcpKeepalive: {}
  timeout:
    http:
      requestReceivedTimeout: 0s
  tls:
    # HTTP/3 (line above) is QUIC, which is TLS-1.3-only already; this raises
    # the TCP 443 listeners (HTTP/2, HTTP/1.1) to the same floor. Ticket #27.
    minVersion: "1.3"
    alpnProtocols:
      - h2
      - http/1.1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
    monitoring.webgrip.io/synthetic-check: gateway-redirect
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: http
    - name: envoy-internal
      namespace: network
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
