---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
spec:
  chartRef:
    kind: OCIRepository
    name: cloudflare-tunnel
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    controllers:
      cloudflare-tunnel:
        # 2 replicas so a single pod/node loss doesn't sever external ingress.
        # cloudflared opens independent tunnel connections; Cloudflare load-balances.
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/cloudflare/cloudflared
              tag: 2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
            env:
              NO_AUTOUPDATE: true
              TUNNEL_METRICS: 0.0.0.0:8080
              TUNNEL_POST_QUANTUM: true # disable when using http2
              TUNNEL_TRANSPORT_PROTOCOL: quic # or http2
            envFrom:
              - secretRef:
                  name: cloudflare-tunnel-secret
            args:
              - "tunnel"
              - "run"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 192Mi
    defaultPodOptions:
      # Soft-spread the 2 replicas across nodes; never block scheduling.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflare-tunnel
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
    configMaps:
      config:
        data:
          config.yaml: |-
            ingress:
              # Git-over-SSH from outside the LAN, without dialling the WireGuard VPN.
              # cloudflared proxies the raw TCP stream to the SAME forgejo-ssh Service the
              # LAN LoadBalancer (10.0.0.11) fronts, so there is one SSH endpoint, one host
              # key, and one set of git remotes -- clients off-LAN just reach it with
              # `ProxyCommand cloudflared access ssh --hostname %h`.
              #
              # MUST stay above the wildcard rule below: cloudflared matches ingress rules in
              # order, and "*.${SECRET_DOMAIN}" would otherwise swallow this hostname and hand
              # an SSH byte stream to Envoy as if it were HTTPS.
              #
              # This is the first non-HTTP service the tunnel carries, and it puts a git SSH
              # daemon on the public internet. The gate is Forgejo's own sshd (publickey only,
              # one forced-command `git` user) and deliberately nothing else: a Cloudflare
              # Access application was designed and declined, because an expiring browser
              # session plus a service token to rotate is a worse failure mode here than the
              # exposure it removes -- same posture every public forge runs. ADR-0054 records
              # that trade-off; the practical follow-through is key hygiene, since every key on
              # a Forgejo account now works from anywhere.
              #
              # LAN clients are untouched: k8s-gateway is authoritative for the zone on the
              # LAN and keeps answering 10.0.0.11, so only off-LAN resolvers ever see the
              # tunnel path. No NetworkPolicy change was needed -- forgejo-allow-ingress
              # already admits the `network` namespace on all ports.
              - hostname: "forgejo-ssh.${SECRET_DOMAIN}"
                service: ssh://forgejo-ssh.forgejo.svc.cluster.local:22
              - hostname: "*.${SECRET_DOMAIN}"
                originRequest:
                  http2Origin: true
                  originServerName: external.${SECRET_DOMAIN}
                service: https://envoy-external.{{ .Release.Namespace }}.svc.cluster.local:443
              - service: http_status:404
    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/cloudflared/config.yaml
            subPath: config.yaml
