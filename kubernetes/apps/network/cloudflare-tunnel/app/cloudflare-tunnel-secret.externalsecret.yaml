---
# cloudflare-tunnel-secret now sourced from OpenBao. Replaces secret.sops.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-secret
  namespace: network
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The connector token of the homelab's Cloudflare Tunnel: Cloudflare Zero Trust, Networks, Tunnels, the tunnel, Configure."
    wellhead.dev/verify.format.TUNNEL_TOKEN: "eyJ\\S+"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: cloudflare-tunnel-secret, creationPolicy: Owner}
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef: {key: cloudflare/tunnel, property: TUNNEL_TOKEN}
