---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns-secret
  namespace: network
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "A Cloudflare API token with Zone Read and DNS Edit for external-dns, made by a person in the Cloudflare dashboard (My Profile, API Tokens) and written with bao kv patch secret/cloudflare/dns api-token=-."
    wellhead.dev/verify.cloudflare-token.field: "api-token"
    wellhead.dev/verify: "cloudflare-token"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: cloudflare-dns-secret, creationPolicy: Owner}
  data:
    - secretKey: api-token
      remoteRef: {key: cloudflare/dns, property: api-token}
