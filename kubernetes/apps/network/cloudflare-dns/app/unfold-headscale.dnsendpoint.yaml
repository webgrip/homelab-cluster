---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: unfold-headscale
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  endpoints:
    - dnsName: "headscale.${SECRET_DOMAIN}"
      recordType: A
      recordTTL: 300
      targets:
        - "2.31.73.11"
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
