---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-headscale-address
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target: {name: unfold-headscale-address, creationPolicy: Owner}
  dataFrom:
    - extract: {key: unfold/headscale-address}
