---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unfold-headscale-address
  annotations:
    wellhead.dev/origin: "minted"
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: unfold-headscale-address, creationPolicy: Owner}
  dataFrom:
    - extract: {key: unfold/headscale-address}
