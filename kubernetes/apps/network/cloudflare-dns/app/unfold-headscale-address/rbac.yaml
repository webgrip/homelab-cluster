---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unfold-headscale-address
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unfold-headscale-address
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "unfold-headscale-address"
    verbs:
      - "get"
  - apiGroups:
      - "externaldns.k8s.io"
    resources:
      - "dnsendpoints"
    resourceNames:
      - "unfold-headscale"
    verbs:
      - "get"
      - "patch"
  - apiGroups:
      - "externaldns.k8s.io"
    resources:
      - "dnsendpoints"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unfold-headscale-address
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: unfold-headscale-address}
subjects:
  - {kind: ServiceAccount, name: unfold-headscale-address, namespace: network}
