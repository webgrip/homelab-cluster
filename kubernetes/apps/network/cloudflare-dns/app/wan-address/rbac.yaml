---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wan-address
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wan-address
rules:
  - apiGroups:
      - "externaldns.k8s.io"
    resources:
      - "dnsendpoints"
    resourceNames:
      - "wan-address"
    verbs:
      - "get"
      - "patch"
  - apiGroups:
      - "externaldns.k8s.io"
    resources:
      - "dnsendpoints"
    verbs:
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wan-address
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: wan-address}
subjects:
  - {kind: ServiceAccount, name: wan-address, namespace: network}
