---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-restore-drill
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: etcd-restore-drill
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["etcd-backup-canary", "restore-verified-etcd-homelab-etcd"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etcd-restore-drill
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: etcd-restore-drill
subjects:
  - kind: ServiceAccount
    name: etcd-restore-drill
