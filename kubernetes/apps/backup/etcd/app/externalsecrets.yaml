---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-backup-writer
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The write-only key homelab-etcd-writer on the off-site Garage (s3/homelab-etcd-writer, made by a person with garage key create on garage-fsn1) and the age public key from secret/backup/homelab-etcd, which the homelab-etcd-age-keygen Job writes."
    wellhead.dev/plain: "S3_ACCESS_KEY_ID S3_REGION S3_ENDPOINT S3_BUCKET"
    wellhead.dev/verify.format.S3_ACCESS_KEY_ID: "GK[0-9a-f]{24}"
    wellhead.dev/verify.format.S3_SECRET_ACCESS_KEY: "[0-9a-f]{64}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: etcd-backup-writer, creationPolicy: Owner}
  data:
    - {secretKey: AWS_ACCESS_KEY_ID, remoteRef: {key: s3/homelab-etcd-writer, property: S3_ACCESS_KEY_ID}}
    - {secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: {key: s3/homelab-etcd-writer, property: S3_SECRET_ACCESS_KEY}}
    - {secretKey: AWS_REGION, remoteRef: {key: s3/homelab-etcd-writer, property: S3_REGION}}
    - {secretKey: CUSTOM_S3_ENDPOINT, remoteRef: {key: s3/homelab-etcd-writer, property: S3_ENDPOINT}}
    - {secretKey: BUCKET, remoteRef: {key: s3/homelab-etcd-writer, property: S3_BUCKET}}
    - {secretKey: AGE_X25519_PUBLIC_KEY, remoteRef: {key: backup/homelab-etcd, property: AGE_X25519_PUBLIC_KEY}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-restore-drill
  annotations:
    wellhead.dev/origin: "provided"
    wellhead.dev/how: "The read-only key backup-verify on the off-site Garage (s3/backup-verify-offsite, made by a person with garage key create on garage-fsn1) and the drill age identity from secret/backup/homelab-etcd, which the homelab-etcd-age-keygen Job writes."
    wellhead.dev/plain: "S3_ACCESS_KEY_ID S3_REGION S3_ENDPOINT"
    wellhead.dev/verify.format.S3_ACCESS_KEY_ID: "GK[0-9a-f]{24}"
    wellhead.dev/verify.format.S3_SECRET_ACCESS_KEY: "[0-9a-f]{64}"
    wellhead.dev/verify: "format"
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: etcd-restore-drill, creationPolicy: Owner}
  data:
    - {secretKey: S3_ACCESS_KEY_ID, remoteRef: {key: s3/backup-verify-offsite, property: S3_ACCESS_KEY_ID}}
    - {secretKey: S3_SECRET_ACCESS_KEY, remoteRef: {key: s3/backup-verify-offsite, property: S3_SECRET_ACCESS_KEY}}
    - {secretKey: S3_REGION, remoteRef: {key: s3/backup-verify-offsite, property: S3_REGION}}
    - {secretKey: S3_ENDPOINT, remoteRef: {key: s3/backup-verify-offsite, property: S3_ENDPOINT}}
    - {secretKey: AGE_DRILL_IDENTITY, remoteRef: {key: backup/homelab-etcd, property: AGE_DRILL_IDENTITY}}
