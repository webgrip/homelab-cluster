---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecrets.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - cronjob-backup.yaml
  - cronjob-drill.yaml
  - cronjob-lifecycle.yaml
  - age-keygen.yaml
configMapGenerator:
  - name: etcd-restore-drill
    files:
      - verify-etcd-snapshot.sh
      - record-etcd-drill.sh
    options:
      disableNameSuffixHash: true
  - name: homelab-etcd-lifecycle
    files:
      - apply-lifecycle.sh
      - homelab-etcd-lifecycle.json
    options:
      disableNameSuffixHash: true
  - name: homelab-etcd-age-keygen
    files:
      - homelab-etcd-age-keygen.sh
    options:
      disableNameSuffixHash: true
