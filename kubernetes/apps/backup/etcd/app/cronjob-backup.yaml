---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
spec:
  schedule: "17 */6 * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: talos-backup
              image: harbor.webgrip.dev/ghcr/siderolabs/talos-backup:v0.1.0-beta.3@sha256:05c86663b251a407551dc948097e32e163a345818117eb52c573b0447bd0c7a7
              command:
                - /talos-backup
              workingDir: /tmp
              env:
                - name: CLUSTER_NAME
                  value: homelab
                - name: S3_PREFIX
                  value: homelab
                - name: USE_PATH_STYLE
                  value: "false"
                - name: ENABLE_COMPRESSION
                  value: "false"
              envFrom:
                - secretRef:
                    name: etcd-backup-writer
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: talos-config
                  mountPath: /.talos
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: talos-config
              emptyDir: {}
            - name: talos-secrets
              secret:
                secretName: talos-backup
