---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-restore-drill
  namespace: backup
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-restore-drill
  namespace: backup
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    resourceNames: ["restore-drill-forgejo-data", "restore-drill-vikunja", "restore-drill-invoiceninja-storage"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    resourceNames: ["restore-drill-forgejo-data", "restore-drill-vikunja", "restore-drill-invoiceninja-storage"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["restore-verified-longhorn-forgejo-data", "restore-verified-longhorn-vikunja", "restore-verified-longhorn-invoiceninja-storage"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-restore-drill
  namespace: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhorn-restore-drill
subjects:
  - kind: ServiceAccount
    name: longhorn-restore-drill
    namespace: backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-restore-drill
  namespace: longhorn-system
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "backups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["create"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    resourceNames: ["restore-drill-forgejo-data", "restore-drill-vikunja", "restore-drill-invoiceninja-storage"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-restore-drill
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: longhorn-restore-drill
subjects:
  - kind: ServiceAccount
    name: longhorn-restore-drill
    namespace: backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-restore-drill
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    resourceNames: ["restore-drill-forgejo-data", "restore-drill-vikunja", "restore-drill-invoiceninja-storage"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-restore-drill
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-restore-drill
subjects:
  - kind: ServiceAccount
    name: longhorn-restore-drill
    namespace: backup
