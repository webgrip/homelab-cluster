---
version: "3"

tasks:
  generate-config:
    desc: Generate Talos configuration
    dir: "{{.TALOS_DIR}}"
    cmd: talhelper genconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which talhelper

  apply-node:
    # NODE selects WHICH config to apply (hostname, or the ipAddress in
    # talconfig). AT is WHERE the machine is reachable right now, defaulting to
    # the configured address.
    #
    # Identical in steady state; different in the two cases that matter — a new
    # node still on DHCP, and any node being renumbered. The previous version
    # passed NODE straight to `talhelper gencommand apply`, which always emits
    # --nodes=<the address in talconfig> with no way to override it, so both
    # cases fell out of the tooling and got driven by hand-written talosctl.
    # --extra-flags cannot patch around it either: talosctl's --nodes is a
    # string slice, so a second one appends and you target both addresses.
    #
    #   task talos:apply-node NODE=worker-1                            # steady state
    #   task talos:apply-node NODE=worker-2 AT=10.0.0.29               # renumbering
    #   task talos:apply-node NODE=worker-3 AT=10.0.0.70 INSECURE=true # new node
    desc: "Apply Talos config to a node [NODE=hostname|ip, AT=current addr, MODE, INSECURE]"
    dir: "{{.TALOS_DIR}}"
    vars:
      MODE: '{{.MODE | default "auto"}}'
      INSECURE: '{{.INSECURE | default "false"}}'
      # Match on hostname OR configured IP so either identifies the node.
      HOST:
        sh: yq -r '.nodes[] | select(.hostname == "{{.NODE}}" or .ipAddress == "{{.NODE}}") | .hostname' {{.TALOS_DIR}}/talconfig.yaml
      CONFIGURED_IP:
        sh: yq -r '.nodes[] | select(.hostname == "{{.NODE}}" or .ipAddress == "{{.NODE}}") | .ipAddress' {{.TALOS_DIR}}/talconfig.yaml
      TARGET: '{{.AT | default .CONFIGURED_IP}}'
    requires:
      vars:
        - NODE
    preconditions:
      # Empty HOST means NODE matched nothing; fail loudly rather than building
      # a command against an empty filename.
      - sh: '[ -n "{{.HOST}}" ]'
        msg: "NODE={{.NODE}} matches no hostname or ipAddress in talconfig.yaml"
      - test -f ./clusterconfig/kubernetes-{{.HOST}}.yaml
      - '{{if eq .INSECURE "true"}}talosctl get disks --nodes {{.TARGET}} --endpoints {{.TARGET}} --insecure{{else}}talosctl --nodes {{.TARGET}} --endpoints {{.TARGET}} get machineconfig{{end}}'
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talhelper talosctl yq
    cmds:
      # Quoted: an unquoted ": " inside a command makes YAML parse the entry as
      # a mapping ("invalid keys in command").
      - 'echo "==> {{.HOST}} — applying kubernetes-{{.HOST}}.yaml via {{.TARGET}} (configured {{.CONFIGURED_IP}})"'
      - 'talosctl apply-config --talosconfig=./clusterconfig/talosconfig --nodes={{.TARGET}} --endpoints={{.TARGET}} --file=./clusterconfig/kubernetes-{{.HOST}}.yaml --mode={{.MODE}}{{if eq .INSECURE "true"}} --insecure{{end}}'

  apply-node-safe:
    # Same NODE/AT contract as apply-node — the hostname is the node's identity
    # in both talconfig and Kubernetes, so one variable serves the drain, the
    # apply and the uncordon. Delegates the apply itself rather than repeating
    # the talosctl invocation, so the DHCP/renumber handling cannot drift
    # between the two tasks.
    #
    #   task talos:apply-node-safe NODE=worker-1
    #   task talos:apply-node-safe NODE=worker-2 AT=10.0.0.29
    desc: "Drain, apply, wait Ready, uncordon [NODE=hostname|ip, AT=current addr, MODE, INSECURE]"
    dir: "{{.TALOS_DIR}}"
    vars:
      MODE: '{{.MODE | default "auto"}}'
      INSECURE: '{{.INSECURE | default "false"}}'
      HOST:
        sh: yq -r '.nodes[] | select(.hostname == "{{.NODE}}" or .ipAddress == "{{.NODE}}") | .hostname' {{.TALOS_DIR}}/talconfig.yaml
    requires:
      vars:
        - NODE
    preconditions:
      - sh: '[ -n "{{.HOST}}" ]'
        msg: "NODE={{.NODE}} matches no hostname or ipAddress in talconfig.yaml"
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talhelper talosctl yq kubectl
    cmds:
      - desc: Drain node to gracefully evict workloads before reboot
        cmd: kubectl drain {{.HOST}} --ignore-daemonsets --delete-emptydir-data --timeout=120s
      - desc: Apply Talos config
        task: apply-node
        vars: {NODE: "{{.NODE}}", AT: "{{.AT}}", MODE: "{{.MODE}}", INSECURE: "{{.INSECURE}}"}
      - desc: Wait for node to become Ready again
        cmd: kubectl wait node/{{.HOST}} --for=condition=Ready --timeout=300s
      - desc: Uncordon node to restore scheduling
        cmd: kubectl uncordon {{.HOST}}

  upgrade-node:
    desc: Upgrade Talos on a single node [IP=required]
    dir: "{{.TALOS_DIR}}"
    cmd: talhelper gencommand upgrade --node {{.IP}} --extra-flags '--image={{.TALOS_IMAGE}}:{{.TALOS_VERSION}} --timeout=10m{{if eq .INSECURE "true"}} --insecure --endpoints={{.IP}}{{end}}' | bash
    vars:
      TALOS_IMAGE:
        sh: yq '.nodes[] | select(.ipAddress == "{{.IP}}") | .talosImageURL' {{.TALOS_DIR}}/talconfig.yaml
      TALOS_VERSION:
        sh: yq '.talosVersion' {{.TALOS_DIR}}/talenv.yaml
      INSECURE: '{{.INSECURE | default "false"}}'
    requires:
      vars:
        - IP
    preconditions:
      - '{{if eq .INSECURE "true"}}talosctl get disks --nodes {{.IP}} --endpoints {{.IP}} --insecure{{else}}talosctl --nodes {{.IP}} get machineconfig{{end}}'
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which kubectl talhelper talosctl yq

  upgrade-k8s:
    desc: Upgrade Kubernetes
    dir: "{{.TALOS_DIR}}"
    cmd: talhelper gencommand upgrade-k8s --extra-flags "--to '{{.KUBERNETES_VERSION}}'" | bash
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/talenv.yaml
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talhelper talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: "{{.TALOS_DIR}}"
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: talhelper gencommand reset --extra-flags="--reboot {{- if eq .CLI_FORCE false }} --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL{{ end }} --graceful=false --wait=false" | bash
    preconditions:
      - which talhelper
