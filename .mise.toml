[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
JUST_UNSTABLE = "1"

[tools]
"python" = "3.14.5"
"uv" = "0.12.10"
"pipx" = "1.16.7"
"pipx:makejinja" = "2.8.3"
"just" = "1.58.0"
"gum" = "0.17.0"
"lefthook" = "2.1.12"
"sd" = "1.1.0"
"zizmor" = "1.29.0"
"gitleaks" = "8.30.1"
"aqua:budimanjojo/talhelper" = "3.1.17"
"aqua:cilium/cilium-cli" = "0.19.7"
"aqua:cli/cli" = "2.97.0"
"aqua:cloudflare/cloudflared" = "2026.7.3"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
# OpenBao CLI (`bao`) — pinned to the cluster's server version (chart 0.28.3 / appVersion
# v2.5.4) so client/KV-v2 behaviour matches. Address derived from the live HTTPRoute via
# `just bao-login`; auth is Authentik OIDC (no static token, no root).
#
# DO NOT let Renovate move this on its own — see the packageRule in .renovaterc.json5.
# Bumped to 2.6.1 on 2026-08-10 and it broke the ENTIRE toolchain on macOS arm64:
# upstream renamed their release assets between 2.5.5 and 2.6.1
# (bao_<ver>_darwin_arm64.tar.gz -> openbao_<ver>_darwin_arm64.tar.gz) and the aqua
# package still expects the old name, so mise fails with
# "no asset found: bao_2.6.1_Darwin_arm64.tar.gz". mise install is all-or-nothing, so one
# unresolvable tool takes kubectl, flux, helm and the pre-commit hooks with it.
"aqua:openbao/openbao/bao" = "2.5.5"
"aqua:helm/helm" = "4.2.4"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:kubernetes/kubectl" = "1.36.1"
# Kubescape: independent posture scoring against NSA-CISA / MITRE ATT&CK / CIS. Used as an
# ASSURANCE layer, not an admission engine — our Kyverno policies otherwise grade their own
# homework. CLI only, deliberately: the in-cluster operator ships an eBPF node agent, and
# this cluster removed Falco and Tetragon for resource pressure. Always run with
# `--submit=false` (see the just recipe) — a scan otherwise offers to upload cluster
# posture to ARMO's SaaS.
"aqua:kubescape/kubescape" = "4.0.13"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:google/yamlfmt" = "0.21.0"
"aqua:siderolabs/talos" = "1.13.10"
# Claude Code hook linters — without these, .claude/hooks/validate-manifest.sh and
# the gitleaks scan in guard-secrets.sh silently no-op (they're optional-by-design).
# Pinned here so the local safety hooks actually enforce on edit.
"pipx:yamllint" = "1.38.0"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:gitleaks/gitleaks" = "8.30.1"

[hooks]
postinstall = "lefthook install"
