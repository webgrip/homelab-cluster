name: secrets-levels
version: 0.1.0
description: 'Places a secret at the right level of the Webgrip estate and names the
  manifest that puts it there: floor (SOPS), vault (OpenBao), cluster (External Secrets),
  bridge (Forgejo Actions and Cloudflare Worker secrets), short-lived (OIDC, dynamic
  credentials, per-run tokens), person (a laptop). The placement half of the secrets
  model; guard-secrets is the enforcement half.'
