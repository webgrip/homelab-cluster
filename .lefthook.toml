# Makes `lefthook install` emit `. ./.lefthookrc` into .git/hooks/* — that puts
# mise back on PATH for GUI git clients. Note it is the generated hook script
# that sources it, so a direct `lefthook run <hook>` does NOT pick the rc file up.
#
# The "./" is load-bearing and not cosmetic. POSIX `.` resolves an operand with
# no slash in it through $PATH, NOT through the working directory, so the
# generated `. .lefthookrc` fails on any system whose /bin/sh is dash — Debian
# and Ubuntu, i.e. this machine:
#
#   $ dash -c '. .lefthookrc'   → dash: 1: .: .lefthookrc: not found  (exit 2)
#   $ dash -c '. ./.lefthookrc' → sourced                             (exit 0)
#
# and a failing pre-commit hook aborts the commit. It stayed hidden until
# lefthook re-synced the hook scripts, at which point every commit on this
# machine started failing with a message about a file that is plainly there.
rc = "./.lefthookrc"

[pre-commit]
parallel = true

[pre-commit.commands.format-just]
# `mise exec --`, like every other command here: `just` is a mise-managed tool,
# not a PATH binary, so a bare `just` exits 127 and fails the commit. This hook
# had never actually run — found 2026-08-02 when the justfile became the repo's
# only task runner and edits to it stopped being rare. `--fmt` also needs
# JUST_UNSTABLE=1, which .mise.toml exports.
run = "for f in {staged_files}; do mise exec -- just --justfile $f --fmt; done"
glob = ["*.just", ".justfile", "justfile"]
stage_fixed = true

[pre-commit.commands.format-mise]
glob = [".mise.toml"]
run = "mise fmt"
stage_fixed = true

[pre-commit.commands.format-yaml]
run = "mise exec -- yamlfmt {staged_files}"
glob = ["*.yml", "*.yaml"]
stage_fixed = true

[pre-commit.commands.validate-access-model]
glob = ["kubernetes/apps/security/access-plane/model/**/*", "scripts/validate_access_model.py", "scripts/validate-access-model.sh"]
run = "mise exec -- ./scripts/validate-access-model.sh"

[pre-commit.commands.validate-omnigraph-policies]
glob = ["kubernetes/apps/ai/omnigraph/app/bundle/*", "scripts/validate_omnigraph_policies.py", "scripts/test-validate-omnigraph-policies.sh"]
run = "mise exec -- bash -c 'python3 scripts/validate_omnigraph_policies.py kubernetes/apps/ai/omnigraph/app/bundle/cluster.yaml --cross-client-actor act-admin --cross-client-actor act-ryan --cross-client-actor act-ingest && bash scripts/test-validate-omnigraph-policies.sh >/dev/null'"

[pre-commit.commands.rehearse-omnigraph-bundle]
glob = ["kubernetes/apps/ai/omnigraph/app/*", "kubernetes/apps/ai/omnigraph/app/bundle/*", "kubernetes/apps/ai/omnigraph/embed-step/**/*", ".mise.toml", "scripts/omnigraph_rehearsal.py", "scripts/rehearse-omnigraph-bundle.sh", "scripts/test_omnigraph_embedding_contract.py"]
run = "mise exec -- bash -c './scripts/rehearse-omnigraph-bundle.sh && python3 scripts/test_omnigraph_embedding_contract.py'"

[pre-commit.commands.test-omnigraph-rehearsal]
glob = ["scripts/omnigraph_rehearsal.py", "scripts/rehearse-omnigraph-bundle.sh", "scripts/test-rehearse-omnigraph-bundle.sh", "scripts/test_omnigraph_embedding_contract.py"]
run = "mise exec -- bash -c 'bash scripts/test-rehearse-omnigraph-bundle.sh && python3 scripts/test_omnigraph_embedding_contract.py --self-test'"

[pre-commit.commands.test-omnigraph-brain-eval]
glob = ["kubernetes/apps/ai/omnigraph/brain-eval/app/*", "scripts/test_omnigraph_brain_eval.py", "scripts/test-omnigraph-brain-eval-mutation.sh"]
run = "mise exec -- bash scripts/test-omnigraph-brain-eval-mutation.sh"

[pre-commit.commands.test-litellm-runtime-patches]
glob = ["kubernetes/apps/ai/litellm/app/litellm-runtime-patches.configmap.yaml", "kubernetes/apps/ai/litellm/app/helmrelease.yaml", "scripts/test_litellm_runtime_patches.py", "scripts/test-litellm-runtime-patches.sh"]
run = "mise exec -- bash scripts/test-litellm-runtime-patches.sh --pinned-image"

[pre-commit.commands.test-forgejo-sync]
glob = ["scripts/forgejo-sync.sh", "scripts/test-forgejo-sync-skips-private.sh"]
run = "bash scripts/test-forgejo-sync-skips-private.sh >/dev/null"

[pre-commit.commands.validate-synthetic-coverage]
glob = ["kubernetes/apps/**/*.yaml", "scripts/validate_synthetic_coverage.py", "scripts/test-validate-synthetic-coverage.sh"]
run = "mise exec -- bash -c 'python3 scripts/validate_synthetic_coverage.py . && bash scripts/test-validate-synthetic-coverage.sh >/dev/null'"

[pre-commit.commands.grafana-generated]
glob = ["scripts/dashboards/**/*.py", "kubernetes/apps/observability/grafana/app/dashboards/*.generated.yaml", "kubernetes/apps/observability/grafana/app/playlists/*.yaml", "kubernetes/apps/observability/grafana/app/kustomization.yaml", "kubernetes/apps/forgejo/forgejo-runner/app/scaledjob.yaml"]
run = "python3 scripts/dashboards/generate.py --check"

[pre-commit.commands.format-tofu]
glob = ["*.tf"]
run = "mise exec -- tofu fmt {staged_files}"
stage_fixed = true

# Keep every script runnable on a stock Mac (bash 3.2) AND Linux CI (bash 5):
# 1) parse with the local bash — on macOS that catches 3.2 parser breakage
#    (e.g. unbalanced ')' in case patterns inside $()) that CI's bash 5 accepts;
# 2) deny-list bash-4-only constructs (associative arrays, mapfile, ${var^^}) —
#    those parse fine everywhere but fail at RUNTIME on 3.2, beyond bash -n's
#    reach. Comment lines are skipped so fixes may name the constructs.
[pre-commit.commands.check-sh-parse]
glob = ["*.sh"]
run = "for f in {staged_files}; do bash -n \"$f\" || exit 1; if grep -nE '^[^#]*(declare -A|local -A|mapfile|readarray|\\$\\{[A-Za-z_]+(\\^\\^|,,))' \"$f\"; then echo \"$f: bash-4-only construct — scripts must run on stock macOS bash 3.2\" >&2; exit 1; fi; done"

[pre-commit.commands.zizmor]
glob = [".github/workflows/*.yaml", ".github/actions/**/action.yaml"]
run = "mise exec -- zizmor --offline {staged_files}"
