---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: worker-1
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("94:de:80:6b:d2:66", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 10.0.0.31/24
routes:
  - gateway: 10.0.0.1
