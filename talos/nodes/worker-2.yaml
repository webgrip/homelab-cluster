---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: worker-2
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("4c:cc:6a:6d:df:8c", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 10.0.0.32/24
routes:
  - gateway: 10.0.0.1
