---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: fringe-workstation
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("f0:92:1c:e0:ec:3b", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 10.0.0.30/24
routes:
  - gateway: 10.0.0.1
