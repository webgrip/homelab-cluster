hostname: soyo-3
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("e0:51:d8:1d:8d:56", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
