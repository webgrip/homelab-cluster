# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
# v1.13.7, NOT v1.13.8 (2026-08-12, corrected after research): v1.13.8's
# iscsi-tools bumps open-iscsi 2.1.11→2.1.12, which RENAMED the persisted
# node-DB key conn_reopen_log_freq→sess_reopen_log_freq with no compat alias —
# each version hard-fails (exit 7) parsing records the other wrote, and
# /var/lib/iscsi survives upgrades AND downgrades, so every Longhorn engine op
# on the node fault-loops (Longhorn bundles NO open-iscsi; it drives the host's
# iscsiadm, so no Longhorn version helps). Upstream: siderolabs/extensions#1182,
# compat patch merged 2026-08-11 (extensions commit 12c4033796) but in NO tagged
# release yet. Proven here on fringe AND soyo-1; both downgraded + /var/lib/iscsi
# purged. v1.13.7 already carries everything the upgrade was for: OOMController
# QoS-trigger cooldown (talos#13675, ≥1.13.6) + podruntime protection (1.13.7).
# UNBLOCK v1.13.8+ only when the release's iscsi-tools contains the
# node-reopen-log-freq-compat patch (check siderolabs/extensions release notes).
talosVersion: v1.13.7
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.4
# Cluster domain; templated into machine-registries.yaml for the Harbor pull-through mirror
# (ADR-0024). Not sensitive — kept in plaintext talenv so genconfig is reproducible.
secretDomain: webgrip.dev
