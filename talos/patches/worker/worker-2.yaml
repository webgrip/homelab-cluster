---
# worker-2 — the reclaimed Proxmox box (2026-08-02). Placement is label-driven
# (capability taxonomy, ADR-0001), never hostname-pinned.
#
# Hardware, measured in maintenance mode rather than taken from the old docs:
#   CPU  Intel i7-6700K, 4C/8T @ 4.00GHz  — the fastest clock in the fleet
#   RAM  16 GB (2 x 8 GB Kingston HyperX; TWO DIMM SLOTS FREE — cheap upgrade)
#   Disk 2 TB Samsung 990 EVO Plus NVMe (install + Longhorn)
#        + 250 GB Samsung 850, 1 TB Samsung 860, 1 TB Seagate HDD, 2 TB Samsung HDD
#
# The old README listed this machine as 32 GB; it is 16 GB. Labels follow what
# the hardware actually reports.
machine:
  nodeLabels:
    node.webgrip.io/pool: worker
    node.webgrip.io/pet: magpie
    # cpu=high: 4.00GHz beats fringe's i7-4770 (3.40GHz). This is the point of
    # adding it — cpu=high previously resolved to fringe ALONE, so authentik and
    # every other cpu=high workload had no fallback and piled onto one node that
    # was already OOM-thrashing. Two high nodes means the scheduler has a choice.
    node.webgrip.io/cpu: high
    # ram=standard: 16 GB, same class as fringe. worker-1 (24 GB) keeps ram=high.
    node.webgrip.io/ram: standard
    # The reason this node matters most. Until now worker-1 was the ONLY
    # schedulable Longhorn node, which is why 58 of 69 volumes sat degraded and
    # why no PVC in the cluster could be expanded ("cannot expand volume before
    # replica scheduling success"). A second storage node lets replicas schedule
    # and both of those resolve on their own.
    storage.webgrip.io/longhorn: "true"
    # The containerd `kata` runtime handler exists here as of 2026-08-13 — the
    # node now runs the extended schematic d1200926df53... The kata RuntimeClass
    # selects on this label rather than pool=worker, so only labelled nodes can
    # receive kata pods. Verified live after the upgrade:
    #   talosctl -n 10.0.0.32 get extensions
    #     -> kata-containers 3.32.0, schematic d1200926df53...
    #   talosctl -n 10.0.0.32 ls /usr/local/bin -> containerd-shim-kata-v2
    #   /proc/uptime 123s, i.e. it really rebooted into the new image
    #
    # SAME-VERSION UPGRADES ARE A KNOWN TRAP — read before touching this node.
    # Earlier attempts at this exact upgrade (v1.13.7 base -> v1.13.7 kata)
    # reported `installation complete`, exit 0, and the node still booted the
    # OLD schematic. This is a same-version install, so sd-boot suffixes the new
    # UKI instead of replacing it and the default entry can stay put:
    #   sd-boot: found existing UKI files: [Talos-v1.13.7.efi Talos-v1.13.7~2.efi]
    #   sd-boot: LoaderEntryDefault: Talos-v1.13.7~2.efi   <- stayed here
    #   copying ... to Talos-v1.13.7~3.efi                 <- new image, unused
    # fringe and worker-1 never hit it because their kata installs followed a
    # version CHANGE (v1.13.8->v1.13.7, v1.13.4->v1.13.7), giving the new UKI a
    # distinct name.
    #
    # WHAT MADE IT TAKE: applying this node's machine config FIRST. Its live
    # install.image was still the base schematic 1da3394e6229... (it never got
    # the config that fringe/worker-1 received), so the installer and the boot
    # entry disagreed about the target. After
    #   talosctl apply-config --nodes 10.0.0.32 --file ... --mode no-reboot
    # the very next `just talos-upgrade-node worker-2` pulled the image and the
    # reboot landed on it. Correlation from a single run, not a controlled
    # experiment — but if this recurs on another node, apply the machine config
    # before concluding the upgrade cannot work.
    #
    # Also note `talos-upgrade-node` exits 1 on success here:
    #   error creating Kubernetes client for drain: kubeconfig is only available
    #   on control plane nodes
    # That is talosctl's own post-upgrade drain helper, which only works on
    # control planes. The upgrade itself already printed `upgrade completed`.
    # Judge the outcome by `get extensions`, never by the exit code.
    runtime.webgrip.io/kata: "true"
