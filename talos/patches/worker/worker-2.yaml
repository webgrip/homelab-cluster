---
# worker-2 — the reclaimed Proxmox box (2026-08-02). Placement is label-driven
# (capability taxonomy, ADR-0001), never hostname-pinned.
#
# Hardware, measured in maintenance mode rather than taken from the old docs:
#   CPU  Intel i7-6700K, 4C/8T @ 4.00GHz  — the fastest clock in the fleet
#   RAM  16 GB (2 x 8 GB Kingston HyperX; TWO DIMM SLOTS FREE — cheap upgrade)
#   Disk 2 TB Samsung 990 EVO Plus NVMe (install + Longhorn)
#        + 250 GB Samsung 850, 1 TB Samsung 860, 1 TB Seagate HDD, 2 TB Samsung HDD
#
# The old README listed this machine as 32 GB; it is 16 GB. Labels follow what
# the hardware actually reports.
machine:
  nodeLabels:
    node.webgrip.io/pool: worker
    # cpu=high: 4.00GHz beats fringe's i7-4770 (3.40GHz). This is the point of
    # adding it — cpu=high previously resolved to fringe ALONE, so authentik and
    # every other cpu=high workload had no fallback and piled onto one node that
    # was already OOM-thrashing. Two high nodes means the scheduler has a choice.
    node.webgrip.io/cpu: high
    # ram=standard: 16 GB, same class as fringe. worker-1 (24 GB) keeps ram=high.
    node.webgrip.io/ram: standard
    # The reason this node matters most. Until now worker-1 was the ONLY
    # schedulable Longhorn node, which is why 58 of 69 volumes sat degraded and
    # why no PVC in the cluster could be expanded ("cannot expand volume before
    # replica scheduling success"). A second storage node lets replicas schedule
    # and both of those resolve on their own.
    storage.webgrip.io/longhorn: "true"
    # NO runtime.webgrip.io/kata label here — DELIBERATE, not an oversight.
    # talconfig.yaml assigns this node the extended schematic d1200926df53...
    # (with siderolabs/kata-containers), but the node has never been upgraded to
    # it and still runs the base schematic 1da3394e6229.... Verified live
    # 2026-08-13:
    #   talosctl -n 10.0.0.32 get extensions
    #     -> binfmt-misc, iscsi-tools, util-linux-tools, schematic 1da3394e6229
    #   (fringe .30 and worker-1 .31 both report kata-containers 3.32.0)
    # A kata pod scheduled here fails sandbox creation forever:
    #   FailedCreatePodSandBox: no runtime for "kata" is configured
    # ADD this label in the SAME change that upgrades the node:
    #   just talos-upgrade-node worker-2      # reboots the node
    #   talosctl -n 10.0.0.32 get extensions  # confirm kata-containers present
    # Draining this node is NOT a plain `kubectl drain`: openbao (1 replica, PDB
    # maxUnavailable 0), devex-db (1 CNPG instance, PDB minAvailable 1) and
    # worker-2's own Longhorn instance-manager all report disruptionsAllowed=0
    # and will block eviction indefinitely.
